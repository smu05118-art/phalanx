<script>
/* ══════════════ 여행자 표 가중 자동 집계 (voting-F) ══════════════
   관료(3표)·도둑(음수표)·부두술사(사망자 토큰 불요)를 집계에 자동 반영한다.
   ▸ 분모(den)·과반 기준(need)은 원본 closeBallot 의 계산을 그대로 쓴다 —
     여기서는 찬성(분자)에만 보정을 얹는다(분모는 다른 레인이 소유한다).
   ▸ 원본 함수는 고치지 않고 전역 이름만 래핑한다. 값으로 미리 붙잡지 않으므로
     나중에 얹히는 래퍼(SABER 원장의 tally 이벤트)가 보정된 숫자를 본다.
   ▸ 모든 능력은 오작동(중독·취함)이면 무효 — 무효 사유도 화면·로그에 남긴다. */
(function(){
  /* 밤 n 에 받은 지목은 낮 n 에 적용된다(advancePhase 가 night n → day n 로 간다). */
  function ctxOf(){
    const ph=S.phase||{};
    const n=(ph.kind==='day'||ph.kind==='night')? ph.n : null;
    const c={n:n, kind:ph.kind, bu:null, th:null, voudon:null, notes:[]};
    if(n==null) return c;
    const pick=(charId,key,ko,glyph)=>{
      const who=S.players.find(p=>p.alive&&p.charId===charId);
      if(!who) return null;
      const rec=S[key];
      const t=(rec&&rec.n===n)? playerOf(rec.pid) : null;
      if(!t) return null;
      if(isMalfunctioning(who)){
        c.notes.push(`${glyph} ${ko}(${who.name}) 오작동(중독/취함) — ${t.name}의 표 가중을 적용하지 않습니다.`);
        return null;
      }
      return t;
    };
    c.bu=pick('bureaucrat','bureaucratTarget','관료','📋');
    c.th=pick('thief','thiefTarget','도둑','🦹');
    const vd=S.players.find(p=>p.alive&&p.charId==='voudon');
    if(vd && !isMalfunctioning(vd)) c.voudon=vd;
    else if(vd) c.notes.push(`🪬 부두술사(${vd.name}) 오작동(중독/취함) — 특례 없이 평소대로 집계합니다.`);
    return c;
  }
  /* 기본 1표 · 관료 지정은 3표 · 도둑 지정은 부호 반전.
     둘 다 걸리면 3×(−1) = −3표. 찬성표에만 적용된다(BotC 는 찬성만 센다). */
  function weightOf(c,pid){
    let w=1;
    if(c.bu && c.bu.id===pid) w=3;
    if(c.th && c.th.id===pid) w=-w;
    return w;
  }
  function adjOf(nom){
    const c=ctxOf(); const rows=[]; const seen={}; let delta=0;
    [c.bu,c.th].forEach(p=>{
      if(!p || seen[p.id]) return;
      seen[p.id]=1;
      const w=weightOf(c,p.id);
      const yes=!!(nom && nom.votes && nom.votes[p.id]==='yes');
      const d=yes? (w-1) : 0;
      delta+=d;
      rows.push({pid:p.id, name:p.name, w:w, yes:yes, d:d});
    });
    return {c:c, rows:rows, delta:delta};
  }
  window.thyVoteWeightCtx=ctxOf;
  window.thyVoteWeightOf=weightOf;
  window.thyVoteAdj=adjOf;

  /* ── 지목 기록 카드 (밤·낮 어느 쪽에서도 입력 가능) ── */
  function setTarget(key,pid){
    const ph=S.phase||{};
    if(ph.kind!=='day' && ph.kind!=='night'){ toast('밤 또는 낮 단계에서만 지목을 기록할 수 있습니다.','warn'); return; }
    S[key]= pid? {pid:pid, n:ph.n} : null;
    const ko=(key==='bureaucratTarget')? '관료' : '도둑';
    const t=pid? playerOf(pid) : null;
    log(t? `🧳 ${ko} 지목: ${t.name} — 낮 ${ph.n} 찬반 집계에 반영` : `🧳 ${ko} 지목 해제 (낮 ${ph.n})`);
    save(); renderAll();
  }
  window.thySetTravTarget=setTarget;

  function buildCard(){
    const ph=S.phase||{};
    if(ph.kind!=='day' && ph.kind!=='night') return null;
    const bu=S.players.find(p=>p.alive&&p.charId==='bureaucrat');
    const th=S.players.find(p=>p.alive&&p.charId==='thief');
    const vd=S.players.find(p=>p.alive&&p.charId==='voudon');
    if(!bu && !th && !vd) return null;
    const box=document.createElement('div');
    box.className='card'; box.id='thy-travvote';
    const h=document.createElement('h3'); h.textContent='🧳 여행자 표 가중 — 자동 집계'; box.appendChild(h);
    /* 플레이어 이름은 전부 textContent 로만 넣는다 — 인라인 onclick 보간 없음(저장형 XSS 방지) */
    const mk=(who,key,glyph,ko,hint)=>{
      const row=document.createElement('div'); row.className='row'; row.style.margin='6px 0';
      const lab=document.createElement('b'); lab.textContent=`${glyph} ${ko} (${who.name})`; row.appendChild(lab);
      const sel=document.createElement('select');
      const o0=document.createElement('option'); o0.value=''; o0.textContent='— 지목 없음 —'; sel.appendChild(o0);
      S.players.filter(p=>p.id!==who.id).forEach(p=>{
        const o=document.createElement('option'); o.value=p.id;
        o.textContent=`${p.name} (${charName(p)}${p.alive?'':' 💀'})`;
        sel.appendChild(o);
      });
      const rec=S[key];
      sel.value=(rec && rec.n===ph.n && playerOf(rec.pid))? rec.pid : '';
      sel.addEventListener('change', ()=>setTarget(key, sel.value));
      row.appendChild(sel);
      const hn=document.createElement('span'); hn.className='hint';
      hn.textContent = isMalfunctioning(who)
        ? `${hint} ⚠ 현재 오작동(중독/취함) — 집계에 반영하지 않습니다.`
        : hint;
      row.appendChild(hn);
      return row;
    };
    if(bu) box.appendChild(mk(bu,'bureaucratTarget','📋','관료','지목 대상의 찬성표를 3표로 집계합니다.'));
    if(th) box.appendChild(mk(th,'thiefTarget','🦹','도둑','지목 대상의 찬성표를 −1표로 집계합니다.'));
    if(bu && th){
      const d=document.createElement('div'); d.className='hint';
      d.textContent='📋🦹 같은 사람이 관료·도둑 양쪽에 지목되면 3표 × 음수 = −3표로 집계합니다.';
      box.appendChild(d);
    }
    if(vd){
      const d=document.createElement('div'); d.className='hint'; d.style.marginTop='6px';
      d.textContent = isMalfunctioning(vd)
        ? `🪬 부두술사(${vd.name}) 오작동(중독/취함) — 특례 없이 평소대로 집계합니다.`
        : `🪬 부두술사(${vd.name}) 생존 — 사망자는 투표 토큰 없이 투표할 수 있고 토큰도 소진되지 않습니다. 산 자·죽은 자 구분 없이 그대로 집계합니다. (산 자의 투표 차단·과반 규칙 미적용은 자동화하지 않았으니 필요하면 사회자가 판정하세요.)`;
      box.appendChild(d);
    }
    const foot=document.createElement('div'); foot.className='hint'; foot.style.marginTop='6px';
    foot.textContent='밤에 받은 지목을 여기에 기록하면 그날 낮 찬반 집계에 자동 반영됩니다. 분모·과반 기준은 그대로이고 찬성(분자)만 보정됩니다.';
    box.appendChild(foot);
    return box;
  }
  function inject(paneId, afterFirstCard){
    const pane=document.getElementById(paneId);
    if(!pane || pane.querySelector('#thy-travvote')) return;
    const c=buildCard(); if(!c) return;
    const first=afterFirstCard? pane.querySelector('.card') : null;
    if(first) first.insertAdjacentElement('afterend', c); else pane.appendChild(c);
  }
  const _rn=renderNight, _rd=renderDay;
  renderNight=function(){ _rn(); inject('pane-night', false); };
  renderDay =function(){ _rd(); inject('pane-day', true); };

  /* ── 화면 검산: 2단계 찬반 화면에 가중 내역을 votemath 로 보여준다 ── */
  const _rno=renderNomOpen;
  renderNomOpen=function(nom){
    const c=ctxOf();
    /* 부두술사 생존 시엔 토큰을 이미 쓴 사망자도 투표할 수 있어야 한다.
       렌더 동안만 토큰을 되돌려 원본이 투표 버튼을 그리게 하고 즉시 원복한다(save 하지 않는다). */
    const restored=[];
    if(c.voudon) S.players.forEach(p=>{ if(!p.alive && p.deadVote===false){ p.deadVote=true; restored.push(p); } });
    let html, rawYes=0, need=0;
    try{
      html=_rno(nom);
      /* 분모는 절대 여기서 다시 정의하지 않는다 — voting-B 의 ballotEligible() 이 유일 정의다.
         (헬퍼가 없는 단독 적용 상황에서만 구식 식으로 폴백한다.) */
      const elig=(typeof ballotEligible==='function')
        ? ballotEligible(nom)
        : alivePlayers().concat(S.players.filter(p=>!p.alive && (p.deadVote!==false || (nom&&nom.votes&&nom.votes[p.id]!==undefined))));
      rawYes=elig.filter(p=>nom&&nom.votes&&nom.votes[p.id]==='yes').length;
      need=majority(elig.length);
    } finally { restored.forEach(p=>{ p.deadVote=false; }); }
    if(!nom || nom.stage!==2) return html;
    const a=adjOf(nom);
    if(!a.rows.length && !a.c.notes.length && !c.voudon) return html;
    const fin=rawYes+a.delta;
    const sg=v=>(v>0?'+':'')+v;
    const wlab=w=>(w===3?'📋 관료 3표':(w===-1?'🦹 도둑 −1표':(w===-3?'📋🦹 관료+도둑 −3표':w+'표')));
    const blk=`<div class="card" style="background:var(--sunken)">
      <h3>🧳 여행자 표 가중 내역</h3>
      <div class="votemath">
        <div class="vmbox"><div class="vlab">가중 전 찬성</div><div class="vval">${rawYes}</div></div>
        <div class="vmbox"><div class="vlab">가중 보정</div><div class="vval">${sg(a.delta)}</div></div>
        <div class="vmbox ${fin>=need?'pass':'fail'}"><div class="vlab">최종 찬성</div><div class="vval">${fin}</div></div>
        <div class="vmbox ${fin>=need?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need}</div></div>
      </div>
      ${a.rows.map(r=>`<div class="hint">${wlab(r.w)} 지정 <b>${esc(r.name)}</b> — ${r.yes?`찬성 반영 ${sg(r.d)}`:'아직 찬성표 없음 (보정 0)'}</div>`).join('')}
      ${a.c.notes.map(t=>`<div class="hint"><mark>${esc(t)}</mark></div>`).join('')}
      ${c.voudon?`<div class="hint">🪬 부두술사(${esc(c.voudon.name)}) 생존 — 사망자는 토큰 없이 투표하며 토큰이 소진되지 않습니다.</div>`:''}
      <div class="hint">※ 분모·과반 기준은 기존 규칙 그대로이며, 위 보정은 찬성(분자)에만 적용됩니다.</div>
    </div>`;
    /* 치환문에 이름이 섞이므로 문자열 대신 함수 치환을 쓴다($&·$' 같은 특수 패턴 방지) */
    return html.replace(/(<div class="row" style="margin-top:10px">\s*<button class="primary" onclick="closeBallot)/, m=>blk+m);
  };

  /* ── 부두술사: 사망자는 토큰 없이 투표하고 토큰이 소진되지 않는다 ── */
  const _cv=castVote;
  castVote=function(nid,pid,v){
    const c=ctxOf();
    const p=playerOf(pid);
    if(!c.voudon || !p || p.alive) return _cv(nid,pid,v);
    const n0=findNom(nid);
    const savedDV=p.deadVote;
    const savedList=n0? (n0.deadVoters||[]).slice() : null;
    p.deadVote=true;                 // 토큰 유무와 무관하게 투표 허용
    const r=_cv(nid,pid,v);
    p.deadVote=savedDV;              // 토큰 소진 없음 — 원복
    const n1=findNom(nid);
    if(n1 && savedList) n1.deadVoters=savedList;
    save(); renderAll();
    return r;
  };

  /* ── 집계: 찬성(분자)에만 가중을 얹는다. den·need 는 원본 값을 그대로 쓴다 ── */
  const _cb=closeBallot;
  closeBallot=function(nid){
    const ret=_cb(nid);
    const n=findNom(nid);
    if(!n || !n.closed) return ret;
    const a=adjOf(n);
    a.rows.forEach(x=>log(`🧳 표 가중: ${x.name} = ${x.w}표 · ${x.yes?`찬성 반영 ${(x.d>=0?'+':'')+x.d}`:'찬성표 없음 → 보정 0'}`));
    a.c.notes.forEach(t=>log(t));
    if(a.delta!==0){
      const before=n.yes;
      n.yes=before+a.delta;
      n.ratio=n.den? n.yes/n.den : 0;
      n.result=(n.yes>=n.need)? 'pass' : 'yesFail';
      log(`🧳 여행자 표 가중 반영: 찬성 ${before} → ${n.yes}/${n.den} (기준 ${n.need}) → ${n.result==='pass'?'과반 통과':'부결'}`);
      toast(`여행자 표 가중 반영 — 찬성 ${before} → ${n.yes} (기준 ${n.need})`,'warn');
      save(); renderAll();
    }
    return ret;
  };
})();
</script>

/* ── 파워티어 산정 (주관적 평가) ──────────────────────────────────────────────
   powerTier 는 "스크립트가 좋다/강하다"가 아니라 **운영 부하 등급**이다.

     상호작용 복잡도 i (0~4) =
        악마 3종 이상 +1.5 / 2종 +0.75
      + 캐릭터 28종 이상 +1 / 25종 이상 +0.5
      + 미구현(실험판) 캐릭터 비중 40% 이상 +1 / 20% 이상 +0.5
      + 여행자·우화 포함 +0.5
     종합점수 = 사회자 난도(0~5) + 플레이어 난도(0~5) + i      → 0~14

     S: 11 이상 · A: 8.5~10.9 · B: 5.5~8.4 · C: 5.4 이하

   난이도 수치는 teeroz 공표값(difficultySource:'teeroz')을 그대로 쓰고,
   공표값이 없는 스크립트는 티르소스 자체 추정치('estimate')를 넣었다.
   테마·태그·티어는 모두 티르소스의 주관적 편집 판단이며 공식 등급이 아니다. */
const SCRIPT_LIB_TIER_DOC='powerTier = 사회자 난도 + 플레이어 난도 + 상호작용 복잡도(악마 수·캐릭터 수·실험판 비중·여행자/우화 유무)의 종합 운영 부하 등급입니다. S 11↑ / A 8.5↑ / B 5.5↑ / C 5.4↓. 티르소스의 주관적 평가이며 공식 등급이 아닙니다.';
const SCRIPT_LIB_THEMES=['입문','정보전','혼돈','광기·기만','전투·처형','실험적'];

function libCharMeta(id){
  const c=(typeof CHARACTERS!=='undefined') && CHARACTERS.find(x=>x.id===id);
  /* edition:'exp' 는 백과사전 수록 전용 — 이름·유형은 정식으로 보여주되
     밤 순서가 없으므로 자동화 가능(playable) 판정에서는 미구현으로 센다. */
  if(c) return {ko:c.ko, en:c.en, type:c.type, have:true, encyc:c.edition==='exp'};
  const m=SCRIPT_LIB_EXTRA_CHARS[id];
  return m? {ko:m.ko, en:m.en, type:m.type, have:false}
          : {ko:id, en:id, type:'unknown', have:false};
}
function libEnrich(s){
  const metas=s.characters.map(libCharMeta);
  s.missing=s.characters.filter((id,i)=>!metas[i].have || metas[i].encyc);
  s.playable=s.missing.length===0;
  const demons=metas.filter(m=>m.type==='demon').length;
  const extra=metas.filter(m=>m.type==='traveller'||m.type==='fabled').length;
  const ratio=s.missing.length/s.characters.length;
  let i=0;
  i += demons>=3?1.5 : demons===2?0.75 : 0;
  i += s.characters.length>=28?1 : s.characters.length>=25?0.5 : 0;
  i += ratio>=0.4?1 : ratio>=0.2?0.5 : 0;
  i += extra?0.5:0;
  s.interaction=i;
  s.powerScore=Math.round((s.stDifficulty+s.playerDifficulty+i)*100)/100;
  s.powerTier = s.powerScore>=11?'S' : s.powerScore>=8.5?'A' : s.powerScore>=5.5?'B' : 'C';
  return s;
}
SCRIPT_LIB.forEach(libEnrich);

     items 는 SCRIPT_LIB 의 id 문자열 배열이며, 존재하지 않는 id 는 렌더 시 무시된다. */
const POPULAR = {

let libTheme='전체', libTier='전체', libOpen=null;
function libSetTheme(t){ libTheme=t; libRender(); }
function libSetTier(t){ libTier=t; libRender(); }
/* libOpen 은 '섹션:id' 키 — 같은 스크립트가 인기·라이브러리 양쪽에 있어도 한 곳만 펼쳐진다. */
function libToggle(key){ libOpen = libOpen===key ? null : key; libRender(); }

const LIB_TEAM_ORDER=[['townsfolk','마을 주민'],['outsider','외지인'],['minion','하수인'],['demon','악마'],['traveler','여행자'],['fabled','우화'],['unknown','미분류']];
function libEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function libNum(n){ return Number.isInteger(n)? String(n) : String(n); }

function libCard(s, sec){
  const key=(sec||'lib')+':'+s.id;
  const open = libOpen===key;
  return `<div class="libcard${open?' open':''}" data-sid="${s.id}" data-key="${key}" onclick="libToggle('${key}')" role="button" tabindex="0"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();libToggle('${key}')}">
    <div class="libcard-h">
      <span class="tierbadge t${s.powerTier}" title="${libEsc(SCRIPT_LIB_TIER_DOC)}">${s.powerTier}</span>
      <div class="libcard-t">
        <div class="sko">${libEsc(s.ko)}</div>
        <div class="sen">${libEsc(s.en)} <span class="libby">by ${libEsc(s.author)}</span></div>
      </div>
    </div>
    <div class="libstats">
      <span class="libstat" title="사회자 난도">🎩 ST <b class="num">${libNum(s.stDifficulty)}</b></span>
      <span class="libstat" title="플레이어 난도">🙋 Player <b class="num">${libNum(s.playerDifficulty)}</b></span>
      <span class="libstat" title="구성 캐릭터 수">🃏 <b class="num">${s.characters.length}</b>종</span>
      <span class="libstat ${s.playable?'ok':'warn'}" title="${s.playable?'밤 순서·판정 자동화 가능':'밤 순서 미정 캐릭터 '+s.missing.length+'종 — 목록 표시 전용'}">${s.playable?'▶ 진행 가능':'👁 표시 전용'}</span>
    </div>
    <div class="libtags"><span class="libtheme">${libEsc(s.theme)}</span>${s.tags.map(t=>`<span class="libtag">${libEsc(t)}</span>`).join('')}</div>
    ${open? libDetail(s) : ''}
  </div>`;
}

function libDetail(s){
  const groups=LIB_TEAM_ORDER.map(([k,label])=>{
    const list=s.characters.map(libCharMeta).filter(m=>m.type===k);
    if(!list.length) return '';
    return `<div class="libgrp"><div class="libgrp-h"><span class="pill ${k}">${label}</span> <b class="num">${list.length}</b></div>
      <div class="libchars">${list.map(m=>{const auto=m.have&&!m.encyc;return `<span class="libchar${auto?'':' ghosted'}" title="${auto?'':(m.have?'백과사전 수록 — 밤 순서 자동화는 미지원':'티르소스 미수록 — 표시 전용')}">${libEsc(m.ko)}<i>${libEsc(m.en)}</i></span>`;}).join('')}</div></div>`;
  }).join('');
  const src = s.source==='teeroz' ? 'teeroz 시계탑' : 'botcscripts 커뮤니티 DB';
  const dsrc = s.difficultySource==='teeroz' ? 'teeroz 공표값' : '티르소스 추정';
  return `<div class="libdetail" onclick="event.stopPropagation()">
    <p class="libnote">${libEsc(s.note)}</p>
    <div class="libmetaline">출처 ${src} · 난이도 ${dsrc} · 종합 <b class="num">${s.powerScore}</b>점 (ST ${libNum(s.stDifficulty)} + Player ${libNum(s.playerDifficulty)} + 상호작용 ${s.interaction}) → <b>${s.powerTier}</b>티어${s.verified?'':' · <b>미검증</b>'}</div>
    ${s.playable? '' : `<p class="libwarn">⚠ 밤 순서가 정해지지 않은 캐릭터 <b class="num">${s.missing.length}</b>종이 포함되어 자동 밤 진행을 지원하지 않습니다. 아래 토큰 중 <b>점선·흐림 표시</b>된 것이 그 대상이며, 능력·주의사항은 백과사전에서 모두 볼 수 있습니다.</p>`}
    ${groups}
  </div>`;
}

function libRender(){
  const host=document.querySelector('#scriptlib');
  if(!host) return;
  const pop = POPULAR.items.map(id=>SCRIPT_LIB.find(s=>s.id===id)).filter(Boolean);
  const list = SCRIPT_LIB.filter(s=>(libTheme==='전체'||s.theme===libTheme) && (libTier==='전체'||s.powerTier===libTier))
                         .slice().sort((a,b)=>b.powerScore-a.powerScore);
  const chip=(cur,val,fn,extra)=>`<button class="libchip${cur===val?' on':''}${extra||''}" onclick="${fn}('${val}')">${libEsc(val)}</button>`;
  const counts={};SCRIPT_LIB.forEach(s=>counts[s.powerTier]=(counts[s.powerTier]||0)+1);
  host.innerHTML=`
    <div class="secthead"><span class="shicon">🔥</span> 인기 스크립트
      <span class="libupd">마지막 갱신: ${libEsc(POPULAR.updated)}</span></div>
    <div class="scriptgrid libgrid">${pop.map(x=>libCard(x,'pop')).join('')}</div>

    <div class="secthead"><span class="shicon">📚</span> 스크립트 라이브러리
      <span class="libupd">${SCRIPT_LIB.length}종 · teeroz ${SCRIPT_LIB.filter(s=>s.source==='teeroz').length} / 커뮤니티 ${SCRIPT_LIB.filter(s=>s.source==='community').length}</span></div>
    <div class="libfilters">
      <div class="libfrow"><span class="libflabel">테마</span>
        ${chip(libTheme,'전체','libSetTheme')}${SCRIPT_LIB_THEMES.map(t=>chip(libTheme,t,'libSetTheme')).join('')}</div>
      <div class="libfrow"><span class="libflabel" title="${libEsc(SCRIPT_LIB_TIER_DOC)}">파워티어 <i>ⓘ</i></span>
        ${chip(libTier,'전체','libSetTier')}${['S','A','B','C'].map(t=>chip(libTier,t,'libSetTier',' tier t'+t)).join('')}</div>
      <p class="hint libtierdoc">${libEsc(SCRIPT_LIB_TIER_DOC)} 현재 분포 — S ${counts.S||0} · A ${counts.A||0} · B ${counts.B||0} · C ${counts.C||0}.</p>
    </div>
    ${list.length? `<div class="scriptgrid libgrid">${list.map(x=>libCard(x,'lib')).join('')}</div>`
                 : '<p class="hint">조건에 맞는 스크립트가 없습니다.</p>'}`;
}

/* renderScripts 래핑 — 원본은 그대로 두고 뒤에 섹션만 덧붙인다. */
(function(){
  if(typeof renderScripts!=='function') return;
  const _origRenderScripts=renderScripts;
  window._origRenderScripts=_origRenderScripts;
  window.renderScripts=function(){
    _origRenderScripts.apply(this, arguments);
    const pane=document.querySelector('#pane-scripts');
    if(!pane) return;
    let host=pane.querySelector('#scriptlib');
    if(!host){
      host=document.createElement('div');
      host.id='scriptlib';
      const card=pane.querySelector('.card');
      (card||pane).appendChild(host);
    }
    libRender();
  };
  if(typeof activeTab!=='undefined' && activeTab==='scripts' && document.querySelector('#pane-scripts')) window.renderScripts();
})();
</script>

<!-- ══ 오리지널 SVG 캐릭터 아이콘 ══ -->
<style>
/* 캐릭터 아이콘: 베이지 토큰 + 단색 라인아트(선=청, 악=적). 색은 currentColor로만 지정. */
.cicon{display:inline-block;vertical-align:-.2em;width:1em;height:1em;color:#2c5f9e;
  background:#d4c9a8;border:1.5px solid #b8a880;border-radius:50%;padding:.14em;box-sizing:content-box}
.cicon.evil{color:#9c2f28}
/* 이미 베이지인 토큰 안에서는 디스크를 벗고 꽉 차게 */
.tkicon .cicon,.ricon .cicon{display:block;width:1em;height:1em;background:none;border:0;padding:0;vertical-align:baseline}
/* 원형 토큰 컨테이너 자체를 베이지로 (타입별 테두리 색은 유지) */
.ctoken:has(svg),.cseat .ctoken:has(svg),.ctoken.demon:has(svg),
.wiz-bigtoken:has(svg),.wiz-shownplayer .pp:has(svg){background:#d4c9a8}
.ctoken .cicon,.wiz-bigtoken .cicon,.wiz-shownplayer .pp .cicon,.pcell .cicon{
  display:block;width:1em;height:1em;background:none;border:0;padding:0;vertical-align:baseline}
/* 목록·버튼 안(비베이지 배경)에서는 베이지 디스크를 유지해 대비 확보 */
.wiz-pickbtn .pt .cicon{vertical-align:middle;padding:.12em}
button .cicon{vertical-align:-.28em}
.tseat.dead .ttoken .tkicon .cicon{opacity:.45}
/* 라인아트는 이모지보다 시각 무게가 가벼우므로 토큰 안에서 조금 키운다 */
.ttoken .tkicon:has(svg){font-size:44px}
.reveal-token .ricon:has(svg){font-size:86px}
.ctoken:has(svg){font-size:26px}
.cseat .ctoken:has(svg){font-size:29px}
@media (max-width:880px){
  .ttoken .tkicon:has(svg){font-size:36px}
  .reveal-token .ricon:has(svg){font-size:68px}
  .ctoken:has(svg){font-size:23px}
  .cseat .ctoken:has(svg){font-size:25px}
}
/* ══════════ 모바일 심화: 오버플로 · 터치 타깃 · 한글 줄바꿈 · safe-area ══════════ */
/* 한국어는 어절 단위 유지(keep-all), 그래도 안 들어가면 아무 데서나 끊어 컨테이너를 넘지 않게(anywhere) */
.card,.step,.alertbox,.guide li,.hint,.pill,.token,button,.scard,.handoff-btn,
.pcell,.rostercell,.roschip,.wiz-note,.wiz-caption,.wiz-pickbtn,.vmbox,.dawnrow,
.qstat,.stchip,.setstep .slab,.sheetrow .sab,#pmodal .pmability,
#daytimerbar,#nighttimerbar{word-break:keep-all;overflow-wrap:anywhere}
/* 전체화면 오버레이도 safe-area 존중 */
#pmodal{padding:16px calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
#gameover{padding:20px calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px))}
#wizhead{padding-top:calc(12px + env(safe-area-inset-top,0px))}
#wizfoot{padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px))}

@media (max-width:880px){
  /* 페이지 자체는 절대 가로로 밀리지 않게 (clip 은 sticky/fixed 를 깨지 않음) */
  body{overflow-x:clip}
  /* ── 타운스퀘어 가로 오버플로 ── */
  /* 좌석은 원 밖으로 (좌석폭/2 − 원 여백)만큼 튀어나온다 → 원 지름을 그만큼 줄여 흡수 */
  #tsq{width:min(100% - 40px,660px)}
  #circlewrap{width:min(100% - 36px,640px)}
  /* ── 하단 탭바: 한국어 라벨 nowrap 때문에 467px 로 넘치던 것 ── */
  #sidenav{overflow-x:hidden}
  #sidenav button{min-width:0;white-space:normal;word-break:keep-all;line-height:1.2;text-align:center;justify-content:center}
  /* ── 터치 타깃 44px ── */
  #subtabs button,.sheettabs button,.viewtoggle button,.vbtn,.stchip{min-height:44px}
  .vbtn{min-width:56px;padding:8px 14px}
  .pcell{min-height:56px}
  .rostercell{min-height:60px}
  .roschip{min-height:48px}
  /* 작은 (i) 버튼: 시각 크기는 유지하고 탭 영역만 44px 로 확장 */
  .infobtn{position:relative;width:28px;height:28px;min-height:28px;font-size:13px}
  .infobtn::after{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
  .stephead input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
  .draghandle{padding:10px 6px;font-size:20px}
  /* ── 그리드: 좁아져도 무너지지 않게 auto-fill ── */
  .wiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,96px),1fr));gap:8px;width:100%;max-width:100%}
  .wiz-pickbtn{min-width:0;width:100%;padding:10px 6px;font-size:13px;min-height:66px}
  .wiz-pickbtn .pt{font-size:28px}
  .pickgrid,.handoff-list,.rosterlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,96px),1fr));gap:8px;max-width:100%}
  .roschips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,132px),1fr))}
  .pcell,.rostercell,.handoff-btn,.roschip{min-width:0;width:100%}
  .wiz-players{gap:10px}
  /* ── 설정 스테퍼: 라벨 때문에 넘치던 것 ── */
  .setsteps{overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .setsteps::-webkit-scrollbar{display:none}
  .setstep .slab{font-size:10.5px;max-width:66px;text-align:center;line-height:1.3}
  .setline{min-width:12px}
  /* ── 타이머 바: 좁은 화면에서 줄바꿈 ── */
  #daytimerbar,#nighttimerbar{gap:8px 10px;padding:10px 12px}
  #daytimerbar .hint,#nighttimerbar .hint{flex:1 0 100%;margin:0;font-size:12px}
  #daytimerbar button{margin-left:0!important;flex:1 1 auto;min-width:0}
  /* ── 그 외 고정폭 잔재 ── */
  .runbar .runbtn{padding:0 16px;flex:1 1 auto;min-width:0}
  .dawnlist{max-width:100%}
  .step .stepbody{padding-left:12px;padding-right:12px}
  .rosform input,.rosrow input,.seatrow input{min-width:0}
}

  .cseat .crole{font-size:9px}
}

/* 기존 이모지 glyph()는 그대로 보존하고, SVG가 있으면 SVG를 우선 반환하도록 래핑 */

<script>
/* ══════════════════ SABER 원장 적재 + OP스코어 ══════════════════
   데이터 계약·계수·기준선은 위쪽 SABER 상수 블록이 정의한다. 이 블록은
   ① 판정 함수 래핑으로 S.events 병행 적재(emit) ② 지표 합성 점수(compute)만 맡는다.
   S.log 와 기존 판정 로직은 손대지 않는다 — 원본 호출 뒤에 관측만 남긴다. */

/* 원장 적재. 레코드 계약 {i,k,n,t,a,b,d} 는 SABER.EV 참조.
   원본들이 이미 save() 를 부르지만 래퍼는 원본 '이후'에 적재하므로 한 번 더 영속화한다. */
function emitEv(t, a, b, d){
  if(!Array.isArray(S.events)) S.events=[];
  const ph=S.phase||{kind:'setup', n:0};
  S.evSeq=(S.evSeq|0)+1;
  S.events.push({i:S.evSeq, k:ph.kind, n:ph.n, t, a:(a==null? null:a), b:(b==null? null:b), d:d||{}});
  if(S.events.length>SABER.MAX_EVENTS) S.events.splice(0, S.events.length-SABER.MAX_EVENTS);
  save();
}

/* ── 시점 복원 도우미 ──
   낮 d 표결 시점의 생존: 밤 n 사망은 낮 n 이전이고, 낮 사망자는 그날 표결에
   이미 참여했을 수 있으므로 산 것으로 센다(사망 투표 여부는 deadVote 축이 따로 감쇠). */
function aliveAtDay(p, d){
  if(!p || !p.diedAt) return true;
  return p.diedAt.n>d || (p.diedAt.n===d && p.diedAt.kind==='day');
}
function aliveNAtDay(d){ return S.players.filter(p=>aliveAtDay(p,d)).length; }
/* 낮 d 생존자의 유형별 구성 — SABER.baseExec/baseKill 의 반사실 기준선 입력 */
function aliveCntAtDay(d){
  const cnt={townsfolk:0, outsider:0, minion:0, demon:0, traveler:0, fabled:0};
  S.players.forEach(p=>{
    if(!aliveAtDay(p,d)) return;
    const ty=charOf(p.charId)?.type;
    if(cnt[ty]!=null) cnt[ty]++;
  });
  return cnt;
}

/* 원장에서 지명별 부가 정보를 복원한다(cutoff: 그 순번 이하 이벤트만).
   nomI/closedI 는 추이 계산의 포함 기준, switched 는 SWING(표 전환) 관측,
   died 는 '그 지명이 실제 처형 사망으로 끝났나'(EV.exec 연결)다. */
function saberNomStats(cutoff){
  const st={}; let lastDay=0, endTeam=null;
  const g=id=>st[id]||(st[id]={switched:{}, nomI:0, closedI:0, died:false});
  for(const e of (S.events||[])){
    if(cutoff!=null && e.i>cutoff) break;
    if(e.k==='day' && e.n>lastDay) lastDay=e.n;
    const nid=e.d && e.d.nomId;
    if(e.t==='nom' && nid) g(nid).nomI=e.i;
    else if(e.t==='vote' && nid){
      const s=g(nid), pv=e.d.prev, v=e.d.v;
      if(pv && v && pv!==v && (pv==='yes'||pv==='no') && (v==='yes'||v==='no')) s.switched[e.a]=true;
    }
    else if(e.t==='tally' && nid){ const s=g(nid); if(e.d.stage===2 || !e.d.pass) s.closedI=e.i; }
    else if(e.t==='exec' && nid){ const s=g(nid); s.closedI=e.i; if(e.d.died) s.died=true; }
    else if(e.t==='end' && e.d) endTeam=e.d.team||null;
  }
  if(cutoff==null && S.phase && S.phase.kind!=='setup' && S.phase.n>lastDay) lastDay=S.phase.n;
  return {st, lastDay:Math.max(1,lastDay), endTeam};
}

/* ══ OP스코어 — SABER 지표를 0~10 한 줄 점수로 합성하는 가중치 ══
   기준선 5.0(반사실: 아무 기여 없는 평균 참가자)에서 각 항을 가감한다.
   처형·표 관련 항의 부호는 '자기 팀 이익'으로 곱으므로 선악 모두 같은 잣대다:
   선은 악 처형 유도·정확한 표로, 악은 생존·기만(선 처형 유도)·정치질로 득점한다. */
const OPSCORE={
  BASE:5, CLAMP:[0,10],
  W:{xEXE:0.55, LEAD:1.5, BAND:1.2, SWING:0.6, FREE:0.8, CROSS:1.2,
     SURV:1.0, HEAT:0.5, POLI:0.9, WIN:0.5, DEMON:0.5},
  CAP:{xEXE:8, SWING:2, HEAT:3, POLI:3},
};
function opClamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* pid 의 지표별 상세(cutoff 이하 이벤트만 반영) — scorePlayer/scoreTimeline 공용 코어 */
function opBreakdown(pid, cutoff){
  const out={pid, terms:{}, score:OPSCORE.BASE};
  const me=playerOf(pid);
  if(!me) return out;
  const meEvil=isEvil(me);
  const p0=S.players.length||1;
  const {st, lastDay, endTeam}=saberNomStats(cutoff);
  const W=OPSCORE.W, CAP=OPSCORE.CAP;
  const inCut=n=>{ const s=st[n.id]; return cutoff==null? true : !!(s && (s.nomI||s.closedI)); };
  const nomsAll=(S.noms||[]).filter(inCut);
  const nomsClosed=nomsAll.filter(n=>n.closed && (cutoff==null || (st[n.id]&&st[n.id].closedI)));
  const closed2=nomsClosed.filter(n=>n.result==='pass'||n.result==='yesFail');
  // 대상(악?)이 처형되는 것이 내 팀에 이득인가: +1 / -1
  const gain=tEvil=>(tEvil!==meEvil? 1 : -1);
  // 그 지명이 실제 처형 사망으로 끝났나 — EV.exec 우선, 구버전 원장은 diedAt 으로 보강
  const diedOf=n=>{
    const s=st[n.id];
    if(s && s.died) return true;
    const nee=playerOf(n.nominee);
    return !!(n.result==='pass' && nee && nee.diedAt && nee.diedAt.kind==='day' && nee.diedAt.n===n.day);
  };

  // ① xEXE 처형 기여 — 내가 찬성해 성사된 처형의 '기준선 대비 초과 가치' [METRICS.xEXE]
  let xexe=0;
  for(const n of closed2){
    if(n.votes[pid]!=='yes' || n.result!=='pass' || !diedOf(n)) continue;
    const nee=playerOf(n.nominee); if(!nee) continue;
    const ty=charOf(nee.charId)?.type;
    const raw=(SABER.EXEC_VAL[ty]||0) - SABER.baseExec(aliveCntAtDay(n.day));
    xexe += raw * SABER.w({alive:aliveNAtDay(n.day), p0, yes:n.yes, need:n.need, deadVote:!aliveAtDay(me,n.day)});
  }
  xexe=opClamp(xexe, -CAP.xEXE, CAP.xEXE);
  out.terms.xEXE=W.xEXE * (meEvil? -xexe : xexe);   // 악은 부호를 뒤집어 읽는다 [xEXE note]

  // ② NOM_LEAD 지명 주도 = 0.5×(내 지명 비중) + 0.5×(그날 첫 지명인 날 비중) [METRICS.NOM_LEAD]
  const myNoms=nomsAll.filter(n=>n.nominator===pid).length;
  const firstByDay={};
  for(const n of nomsAll){ if(firstByDay[n.day]==null) firstByDay[n.day]=n.nominator; } // push 순서 = 지명 순서
  let daysAlive=0, firstDays=0;
  for(let d=1; d<=lastDay; d++){
    if(!aliveAtDay(me,d)) continue;
    daysAlive++;
    if(firstByDay[d]===pid) firstDays++;
  }
  const lead=(nomsAll.length? 0.5*myNoms/nomsAll.length : 0) + (daysAlive? 0.5*firstDays/daysAlive : 0);
  out.terms.LEAD=W.LEAD*lead;

  // ③ CONF·FREE — 동조율과 무임승차 지수(FREE = CONF×(1−NOM_LEAD)) [METRICS.CONF/FREE]
  let ballots=0, conform=0;
  for(const n of closed2){
    const v=n.votes[pid];
    if(v!=='yes' && v!=='no') continue;
    ballots++;
    if((v==='yes')===(n.result==='pass')) conform++;
  }
  const confR=ballots? conform/ballots : 0;
  out.terms.FREE=(ballots>=3)? -W.FREE * confR * (1-Math.min(1,lead)) : 0;

  // ④ SWING 표 전환 — 갈아탄 최종 표가 결과와 일치할 때, 아슬아슬할수록(piv) 크게 [METRICS.SWING]
  let swing=0;
  for(const n of closed2){
    const s=st[n.id];
    if(!s || !s.switched[pid]) continue;
    const vf=n.votes[pid];
    if(vf!=='yes' && vf!=='no') continue;
    if((vf==='yes')!==(n.result==='pass')) continue;
    const nee=playerOf(n.nominee); if(!nee) continue;
    const sign=gain(isEvil(nee)) * (vf==='yes'? 1 : -1);
    swing += sign * (n.result==='pass'? (SABER.piv(n.yes,n.need)-1) : 0.5);
  }
  out.terms.SWING=W.SWING*opClamp(swing, -CAP.SWING, CAP.SWING);

  // ⑤ BAND 표 결집력 = P(통과|내가 거수) − P(통과) [METRICS.BAND — 상관 지표]
  const withMe=nomsClosed.filter(n=>(n.hands||[]).includes(pid));
  const pAll=nomsClosed.length? nomsClosed.filter(n=>n.result==='pass').length/nomsClosed.length : 0;
  const pMe=withMe.length? withMe.filter(n=>n.result==='pass').length/withMe.length : pAll;
  out.terms.BAND=W.BAND*(pMe-pAll);

  // ⑥ CROSS 정보 정확도(선 전용) — 찬성표의 상대 진영 적중률에서 무작위 기준선을 뺀다
  //    [METRICS.CROSS − BASE_DESC.vote. 악의 표 방향성은 ⑧ xPOLI 가 담당]
  if(!meEvil){
    let yesN=0, crossN=0;
    for(const n of closed2){
      if(n.votes[pid]!=='yes') continue;
      yesN++;
      const nee=playerOf(n.nominee);
      if(nee && isEvil(nee)) crossN++;
    }
    const evil0=S.players.filter(p=>isEvil(p)).length;
    out.terms.CROSS=yesN? W.CROSS*((crossN/yesN) - SABER.baseVote(evil0,p0)) : 0;
  }

  if(meEvil){
    // ⑦ SURV 생존 지수 — 기대 생존(expDays/2 = 지수 0.5) 대비 초과 [METRICS.SURV]
    const surv=(me.diedAt? me.diedAt.n : lastDay)/SABER.expDays(p0);
    out.terms.SURV=W.SURV*opClamp(surv-0.5, -1, 1.5);
    // ⑧ HEAT_SURV 지명열 생존 — 의심(찬성률×압축 계수)을 사고도 처형을 피함 [METRICS.HEAT_SURV]
    let heat=0;
    for(const n of closed2){
      if(n.nominee!==pid || diedOf(n)) continue;
      heat += (n.den? (n.yes||0)/n.den : 0) * SABER.lev(aliveNAtDay(n.day), p0);
    }
    out.terms.HEAT=W.HEAT*opClamp(heat, 0, CAP.HEAT);
    // ⑨ xPOLI 정치질 — 상대 진영(선)에게 표를 몰아준 정도, 자기 팀에 찬성하면 감점 [METRICS.xPOLI]
    let poli=0;
    for(const n of closed2){
      if(n.votes[pid]!=='yes') continue;
      const nee=playerOf(n.nominee); if(!nee) continue;
      const wgt=SABER.w({alive:aliveNAtDay(n.day), p0, yes:n.yes, need:n.need});
      poli += (isEvil(nee)? -1 : 1) * (n.den? (n.yes||0)/n.den : 0) * wgt * 0.3;
    }
    out.terms.POLI=W.POLI*opClamp(poli, -CAP.POLI, CAP.POLI);
  }

  // ⑩ 종료 보너스 — EV.end 가 있어야만 반영(진행 중에는 0)
  if(endTeam){
    if((endTeam==='evil')===meEvil) out.terms.WIN=W.WIN;
    if(endTeam==='evil' && meEvil && me.alive && charOf(me.charId)?.type==='demon') out.terms.DEMON=W.DEMON;
  }

  /* 합성: tanh 소프트 클립 — 하드 클램프와 달리 큰 판에서도 순서(동점 붕괴)를 보존한다 */
  let sum=0;
  for(const k in out.terms) sum+=out.terms[k];
  out.score=Math.round(opClamp(OPSCORE.BASE + 5*Math.tanh(sum/5), OPSCORE.CLAMP[0], OPSCORE.CLAMP[1])*10)/10;
  return out;
}

/* OP스코어 0~10 — 잘한 사람이 높다. 절대값보다 같은 판 안의 순서로 읽는다 */
function scorePlayer(pid){ return opBreakdown(pid, null).score; }

/* 이 판의 MVP pid — 최고 OP스코어, 동점이면 승리 팀 소속이 우선 */
function matchMVP(){
  const {endTeam}=saberNomStats(null);
  let best=null, bs=-1, bestWin=false;
  for(const p of S.players){
    const sc=scorePlayer(p.id);
    const onWin=!!endTeam && ((isEvil(p)?'evil':'good')===endTeam);
    if(sc>bs || (sc===bs && onWin && !bestWin)){ bs=sc; best=p.id; bestWin=onWin; }
  }
  return best;
}

/* 페이즈별 누적 추이 [{n, kind, score}] — 각 페이즈의 마지막 이벤트 시점 스냅샷 */
function scoreTimeline(pid){
  const out=[]; let cur=null;
  for(const e of (S.events||[])){
    if(!cur || cur.kind!==e.k || cur.n!==e.n){ cur={n:e.n, kind:e.k, lastI:e.i}; out.push(cur); }
    else cur.lastI=e.i;
  }
  return out.map(ph=>({n:ph.n, kind:ph.kind, score:opBreakdown(pid, ph.lastI).score}));
}

/* ── 최소 침습 훅 — 판정 함수를 래핑해 원장에 병행 기록 ── */
(function(){
  // 원본과 같은 차단 판정을 '호출 전' 상태에서 미리 계산해 attack.d.blocked 에 싣는다
  const preBlock=(t, src, bypass)=>{
    try{ return deathBlockReason(t, {sourceType:src, bypass:!!bypass}); }catch(e){ return null; }
  };

  // death — 좀버얼 죽은 척 포함, alive 가 실제로 꺾인 호출만 적재 [EV.death]
  const _kp=killPlayer;
  killPlayer=function(p, cause, opts){
    const was=p && p.alive;
    _kp(p, cause, opts);
    if(p && was && !p.alive)
      emitEv('death', null, p.id, {cause:cause||'', char:p.charId, byExec:/처형|성결자/.test(cause||'')});
  };

  // attack + star — 임프. 별 넘기기는 호출 전후의 imp 보유자 차이로 감지 [EV.attack/EV.star]
  const _imp=doImpKill;
  doImpKill=function(pid){
    const t=playerOf(pid);
    const dem=S.players.find(q=>q.alive && charOf(q.charId)?.type==='demon');
    const mal=dem? isMalfunctioning(dem) : false;
    const blocked=t? (mal? '오작동' : preBlock(t,'demon',false)) : null;
    const impsBefore=S.players.filter(q=>q.charId==='imp').map(q=>q.id);
    _imp(pid);
    if(t) emitEv('attack', dem? dem.id : null, pid, {killer:dem? dem.charId : 'imp', blocked});
    const np=S.players.find(q=>q.charId==='imp' && !impsBefore.includes(q.id));
    if(np) emitEv('star', dem? dem.id : null, np.id, {to:np.id});
  };

  // attack + swap — 팡 구. 점프(외지인 전향)는 charId 변화로 감지 [EV.attack/EV.swap]
  const _fg=doFangGuAttack;
  doFangGuAttack=function(pid){
    const t=playerOf(pid);
    const fg=S.players.find(q=>q.alive && q.charId==='fanggu');
    const mal=fg? isMalfunctioning(fg) : false;
    const blocked=t? (mal? '오작동' : preBlock(t,'demon',false)) : null;
    const oldChar=t? t.charId : null;
    _fg(pid);
    if(!t) return;
    emitEv('attack', fg? fg.id : null, pid, {killer:'fanggu', blocked});
    if(t.charId!==oldChar) emitEv('swap', fg? fg.id : null, pid, {from:oldChar, to:t.charId, why:'팡 구 점프'});
  };

  // poison + attack — 푸카. 새 표적은 중독, 이전 희생자는 지연 공격으로 남긴다 [EV.poison/EV.attack]
  const _pk=doPukkaPick;
  doPukkaPick=function(pid){
    const t=playerOf(pid);
    const pk=S.players.find(q=>(q.alive || (q.charId==='zombuul'&&hasStatus(q,'fakedead'))) && q.charId==='pukka');
    const mal=pk? isMalfunctioning(pk) : false;
    const prev=S.pukkaVictimId? playerOf(S.pukkaVictimId) : null;
    const prevBlk=(prev && prev.alive && !mal)? preBlock(prev,'demon',false) : null;
    _pk(pid);
    if(t) emitEv('poison', pk? pk.id : null, pid, {src:'푸카', key:'poison', mal});
    if(t && prev && prev!==t && !mal) emitEv('attack', pk? pk.id : null, prev.id, {killer:'pukka', blocked:prevBlk});
  };

  // attack — BMR/SV 단계 살해. 군인 면역 판별을 위해 살해 출처를 원본과 같게 구분 [EV.attack]
  const _sk=doStepKill;
  doStepKill=function(pid, killerId){
    const t=playerOf(pid);
    const kid=killerId || window.__stepKiller || null;
    const actor=S.players.find(q=>(q.alive || (q.charId==='zombuul'&&hasStatus(q,'fakedead'))) && q.charId===kid);
    const mal=actor? isMalfunctioning(actor) : false;
    const src=charOf(kid)?.type==='demon'? 'demon' : 'night';
    const blocked=(t && t.alive)? (mal? '오작동' : preBlock(t, src, kid==='assassin')) : null;
    _sk(pid, killerId);
    if(t) emitEv('attack', actor? actor.id : null, pid, {killer:kid, blocked});
  };

  // protect / poison — 부여 시도를 오작동 여부와 함께 남긴다 [EV.protect/EV.poison]
  const _pr=doProtect;
  doProtect=function(pid){
    const t=playerOf(pid);
    const monk=S.players.find(q=>q.charId==='monk');
    _pr(pid);
    if(t) emitEv('protect', monk? monk.id : null, pid, {src:'수도사', mal:monk? isMalfunctioning(monk) : false});
  };
  const _po=doPoison;
  doPoison=function(pid){
    const t=playerOf(pid);
    const psn=S.players.find(q=>q.charId==='poisoner');
    _po(pid);
    if(t) emitEv('poison', psn? psn.id : null, pid, {src:'독살범', key:'poison', mal:psn? isMalfunctioning(psn) : false});
  };

  // pick — 구마사제·악마의 변호사의 밤 지목 [EV.pick]
  const _ex=doExorcist;
  doExorcist=function(pid){
    _ex(pid);
    if(pid && playerOf(pid))
      emitEv('pick', S.players.find(q=>q.alive&&q.charId==='exorcist')?.id||null, pid, {step:'exorcist', targets:[pid]});
  };
  const _da=doDevilsAdvocate;
  doDevilsAdvocate=function(pid){
    _da(pid);
    if(pid && playerOf(pid))
      emitEv('pick', S.players.find(q=>q.alive&&q.charId==='devilsadvocate')?.id||null, pid, {step:'devilsadvocate', targets:[pid]});
  };

  // swap — 이발사·뱀 조련사. 원본 검증을 통과해 charId 가 실제로 바뀐 경우만 [EV.swap]
  const swapWrap=(name, why)=>{
    const o=window[name];
    window[name]=function(pids){
      const a=playerOf((pids||[])[0]), b=playerOf((pids||[])[1]);
      const ac=a? a.charId : null, bc=b? b.charId : null;
      o(pids);
      if(a && b && a!==b && a.charId!==ac){
        emitEv('swap', a.id, a.id, {from:ac, to:a.charId, why});
        emitEv('swap', b.id, b.id, {from:bc, to:b.charId, why});
      }
    };
  };
  swapWrap('doSwapChars','이발사 교환');
  swapWrap('doSnakeSwap','뱀 조련사 스왑');

  // nom/hand/vote/tally — 지명·투표 계열. ord = 그날 몇 번째 지명 [EV.nom~EV.tally]
  const _nn=newNomination;
  newNomination=function(){
    const len=S.noms.length;
    _nn();
    if(S.noms.length>len){
      const n=S.noms[S.noms.length-1];
      emitEv('nom', n.nominator, n.nominee, {nomId:n.id, ord:S.noms.filter(x=>x.day===n.day).length});
    }
  };
  const _th=toggleHand;
  toggleHand=function(nid, pid){
    _th(nid, pid);
    const n=findNom(nid);
    if(n) emitEv('hand', pid, n.nominee, {nomId:nid, on:n.hands.includes(pid)});
  };
  const _cv=castVote;
  castVote=function(nid, pid, v){
    const n0=findNom(nid);
    const prev=n0? n0.votes[pid] : undefined;
    _cv(nid, pid, v);
    const n=findNom(nid);
    if(n && n.votes[pid]!==prev)
      emitEv('vote', pid, n.nominee, {nomId:nid, v:(n.votes[pid]==null? null : n.votes[pid]), prev:(prev==null? null : prev)});
  };
  const _ch=closeHands;
  closeHands=function(nid){
    _ch(nid);
    const n=findNom(nid);
    if(n){
      const den=alivePlayers().length;
      emitEv('tally', null, n.nominee, {nomId:nid, stage:1, num:n.hands.length, den, need:majority(den), pass:n.stage===2});
    }
  };
  const _cb=closeBallot;
  closeBallot=function(nid){
    _cb(nid);
    const n=findNom(nid);
    if(n && n.closed)
      emitEv('tally', null, n.nominee, {nomId:nid, stage:2, num:n.yes, den:n.den, need:n.need, pass:n.result==='pass'});
  };

  // exec — 처형 확정. 차단 사유는 호출 전 상태로 판정, nomId 는 통과된 최근 지명과 연결 [EV.exec]
  const _re=resolveExecution;
  resolveExecution=function(p, cause){
    const blocked=p? preBlock(p,'execution',false) : null;
    const died=_re(p, cause);
    if(p){
      const nom=S.noms.slice().reverse().find(n=>n.nominee===p.id && n.result==='pass')||null;
      emitEv('exec', null, p.id, {died:!!died, blocked:blocked||null, nomId:nom? nom.id : null});
    }
    return died;
  };

  // phase — 검증 실패로 전환이 안 된 호출은 기록하지 않는다 [EV.phase]
  const _ap=advancePhase;
  advancePhase=function(){
    const k=S.phase.kind, n=S.phase.n;
    _ap();
    if(S.phase.kind!==k || S.phase.n!==n) emitEv('phase', 'ST', null, {to:S.phase.kind, n:S.phase.n});
  };

  // end + 전적 적립 — 원장에 end 를 먼저 적재해야 승리 보너스가 점수에 반영된다 [EV.end]
  const _cw=confirmWin;
  confirmWin=function(yes){
    const res=pendingWin;                       // 원본이 소거하기 전에 확보
    _cw(yes);
    if(!yes || !res || !res.team) return;
    emitEv('end', 'ST', null, {team:res.team, reason:res.reason||''});
    if(!Array.isArray(S.history)) S.history=[];
    const mvp=matchMVP();
    S.history.push({
      ts:Date.now(), edition:S.edition, winner:res.team,
      players:S.players.map(p=>({
        rosterId:p.rosterId||null, pid:p.id, name:p.name, charId:p.charId,
        alignment:isEvil(p)? 'evil' : 'good', score:scorePlayer(p.id), mvp:p.id===mvp,
      })),
    });
    /* 정규화기와 같은 상한 하나(SABER.MAX_HISTORY)를 쓴다 — 적재 쪽만 무한히 쌓이면
       다음 로드의 migrateState 가 조용히 잘라내 저장본 왕복마다 길이가 요동친다 */
    if(S.history.length>SABER.MAX_HISTORY) S.history.splice(0, S.history.length-SABER.MAX_HISTORY);
    save();
  };
})();
</script>

<script>
/* ══════════════ 해시 라우팅 · 공유 · 홈 큐레이션 (nav-share) ══════════════
   단일 파일 오프라인 앱(file:// 포함)이라 History API 대신 location.hash 를 쓴다.
   경로는 탭 id 1:1(#scripts · #night · #stats …)이고 시트만 2단(#sheet/tb).
   원본 함수는 고치지 않고 전역 이름만 래핑한다. 래핑 대상을 '값'으로 미리
   붙잡지 않으므로($('#advbtn').onclick=advancePhase 사고와 같은 조기 캡처 금지)
   나중에 얹히는 다른 래퍼도 함께 발화한다. */

/* 탭 화이트리스트는 하드코딩하지 않는다 — 실제 DOM 의 .tabpane id 에서 유도한다.
   목록이 pane 과 어긋나면 renderAll 의 $('#pane-'+activeTab) 가 null 이 되어
   화면 전체가 죽는다(#tab=foo 한 방에 흰 화면). 유도하면 어긋날 수가 없다. */
const THY_TAB_IDS=Array.from(document.querySelectorAll('main section.tabpane[id^="pane-"]'))
  .map(el=>el.id.slice(5)).filter(Boolean);
const THY_HOME_TAB='scripts';
const THY_TAB_KO={scripts:'공식 스크립트', setup:'설정', sheet:'스크립트 시트', grim:'그리모어',
  night:'밤 진행', day:'낮 · 투표', guide:'백과사전', stats:'통계', check:'체크리스트', custom:'내 스크립트'};
function thyKnownTab(t){ return THY_TAB_IDS.indexOf(t)>=0 && !!document.querySelector('#pane-'+t); }
function thyRouteOf(){ return activeTab==='sheet' ? 'sheet/'+sheetEd : activeTab; }
function thyRouteUrl(){ return location.href.split('#')[0] + '#' + thyRouteOf(); }
function thyRouteWrite(){ const h='#'+thyRouteOf(); if(location.hash!==h){ try{ location.hash=h; }catch(e){} } }
/* 모르는 해시는 화면을 바꾸지 않고 false 를 돌려준다 — 호출자가 기본 탭으로 되돌린다 */
function thyRouteApply(h){
  const raw=String(h==null? '':h).replace(/^#/,'').trim();
  if(!raw) return false;
  const parts=raw.split('/'), tab=parts[0];
  if(!thyKnownTab(tab)) return false;
  if(tab==='sheet'){
    const ed=parts[1];
    if(ed && typeof EDITIONS==='object' && EDITIONS[ed]) sheetEd=ed;
    sheetTab='chars';
  }
  switchTab(tab);
  return true;
}
/* 미지의 해시·깨진 activeTab 에서 되돌아올 자리 */
function thyRouteFallback(){
  if(!thyKnownTab(activeTab) && thyKnownTab(THY_HOME_TAB)) switchTab(THY_HOME_TAB);
  else thyRouteWrite();
}
/* switchTab 래핑 — 모든 전환(자동 전환 포함)이 해시에 남는다 */
(function(){
  const _origSwitchTab=window.switchTab;
  if(typeof _origSwitchTab!=='function') return;
  window.switchTab=function(){ const r=_origSwitchTab.apply(this, arguments); thyRouteWrite(); return r; };
})();
/* 뒤로가기·직접 입력 복원. 우리가 쓴 해시와 같으면 무시해 루프를 막는다. */
window.addEventListener('hashchange', ()=>{
  if(location.hash.replace(/^#/,'')===thyRouteOf()) return;
  if(!thyRouteApply(location.hash)) thyRouteFallback();
});

/* 현재 화면 공유 — navigator.share 우선, 없거나 거부되면 클립보드 복사 폴백 */
function thyShareCurrent(){
  const url=thyRouteUrl();
  const title='🕰 티르소스 — '+(THY_TAB_KO[activeTab]||'사회자 콘솔');
  const copy=()=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>toast('현재 화면 링크를 복사했습니다 — '+url,'ok'), ()=>prompt('복사하세요:',url));
    } else prompt('복사하세요:',url);
  };
  if(navigator.share){
    try{
      const p=navigator.share({title, text:title, url});
      if(p && p.catch) p.catch(err=>{ if(!err || err.name!=='AbortError') copy(); });
      return;
    }catch(e){}
  }
  copy();
}

/* ── 홈 큐레이션 ──
   ※ 여기서 쓰는 건 S.recentScripts(최근 연 스크립트)다. 판 전적 원장 S.history 와는
      다른 필드다 — 한때 둘 다 history 였고, 그대로 두면 이 정규화기('id 없는 항목
      제거·중복 제거')가 전적 레코드를 통째로 지운다(localStorage 라 복구 불가). */
const THY_RECENT_MAX=8;
function thyRecordScript(id, kind){
  if(!id) return;
  if(!Array.isArray(S.recentScripts)) S.recentScripts=[];
  const h=S.recentScripts, sid=String(id).slice(0,40);
  let k=(kind==='play')? 'play':'sheet';
  const i=h.findIndex(x=>x&&x.id===sid);
  if(i>=0){ if(h[i].kind==='play') k='play'; h.splice(i,1); }   // 한 번 플레이한 스크립트는 계속 '플레이함'
  h.unshift({id:sid, kind:k, at:Date.now()});
  if(h.length>THY_RECENT_MAX) h.length=THY_RECENT_MAX;
  save();
}
(function(){
  const _openSheet=window.openSheet, _startFromSheet=window.startFromSheet;
  if(typeof _openSheet==='function') window.openSheet=function(ed){ const r=_openSheet.apply(this,arguments); thyRecordScript(ed,'sheet'); return r; };
  if(typeof _startFromSheet==='function') window.startFromSheet=function(ed){
    const r=_startFromSheet.apply(this,arguments);
    if(activeTab==='setup') thyRecordScript(ed,'play');   // confirm 취소 시엔 탭이 안 바뀌므로 기록하지 않는다
    return r;
  };
})();
function thyHomeCurationHTML(){
  const recent=(Array.isArray(S.recentScripts)? S.recentScripts:[]).slice(0,6);
  const cards=recent.map(h=>{
    const meta=SCRIPTS_META.find(s=>s.id===h.id);
    const ko=meta? meta.ko : h.id, en=meta? meta.en : '';
    let when='';
    if(typeof h.at==='number' && h.at){ try{ when=new Date(h.at).toLocaleDateString('ko-KR'); }catch(e){} }
    return `<div class="scard" data-home-script="${esc(h.id)}" role="button" tabindex="0">
      <div class="sicon">${h.kind==='play'?'🎲':'📜'}</div>
      <div><div class="sko">${esc(ko)}</div><div class="sen">${esc(en)}</div>
      <div class="smeta">${h.kind==='play'?'플레이함':'시트 열람'}${when?' · '+esc(when):''}</div></div></div>`;
  }).join('');
  const cs=Array.isArray(S.customs)? S.customs.filter(c=>c&&typeof c==='object') : [];
  const custom = cs.length
    ? `<div class="scriptgrid"><div class="scard" data-home-nav="custom" role="button" tabindex="0">
        <div class="sicon">📝</div>
        <div><div class="sko">티르소스 커스텀 시트</div><div class="sen">custom · ${cs.length} characters</div>
        <div class="smeta">${esc(cs.slice(0,6).map(c=>c.ko||'?').join(' · '))}${cs.length>6?' …':''}</div></div></div></div>`
    : `<p class="hint">아직 커스텀 캐릭터가 없습니다 — <b>내 스크립트</b>에서 만들면 여기에 모입니다.</p>`;
  return `<div class="secthead"><span class="shicon">🕘</span> 최근 플레이한 스크립트</div>
    ${cards? `<div class="scriptgrid">${cards}</div>`
           : '<p class="hint">아직 기록이 없습니다 — 스크립트를 열거나 게임을 시작하면 여기에 쌓입니다.</p>'}
    <div class="secthead"><span class="shicon">⭐</span> 내 커스텀 시트</div>
    ${custom}`;
}
(function(){
  if(typeof window.renderScripts!=='function') return;
  const _prev=window.renderScripts;   // 스크립트 라이브러리 래퍼 위에 한 겹 더 얹는다
  window.renderScripts=function(){
    _prev.apply(this, arguments);
    const pane=document.querySelector('#pane-scripts'); if(!pane) return;
    const card=pane.querySelector('.card')||pane;
    let host=pane.querySelector('#homecuration');
    if(!host){ host=document.createElement('div'); host.id='homecuration'; card.insertBefore(host, card.firstChild); }
    host.innerHTML=thyHomeCurationHTML();
  };
})();
/* 인라인 onclick 에 사용자 데이터를 넣지 않기 위한 위임 리스너 */
document.addEventListener('click', e=>{
  const t=e.target.closest && e.target.closest('[data-home-script],[data-home-nav]');
  if(!t) return;
  const sid=t.getAttribute('data-home-script');
  if(sid){
    if(SCRIPTS_META.some(s=>s.id===sid)) openSheet(sid);
    else toast('그 스크립트 정보를 찾지 못했습니다.','warn');
    return;
  }
  if(t.getAttribute('data-home-nav')==='custom') switchTab('custom');
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t=e.target && e.target.closest && e.target.closest('[data-home-script],[data-home-nav]');
  if(!t) return;
  e.preventDefault(); t.click();
});

window.thyRoute={of:thyRouteOf, url:thyRouteUrl, apply:thyRouteApply, write:thyRouteWrite,
  fallback:thyRouteFallback, known:thyKnownTab, tabs:THY_TAB_IDS, share:thyShareCurrent, record:thyRecordScript};
/* ══════════════════ 리마인더 레인 — 집착·지속 효과 능동 제시 ══════════════════
   기존 3축(STATUS_DEFS 토큰 / buildChecklist / dayNotice)은 "그 캐릭터가 시트에 있으면"
   뜨는 정적 안내다. 여기서 채우는 격차는 "지금 이 판의 실제 값" —
   누가 무슨 광기인지 · 오늘 밤 주인이 누구인지 · 저주가 누구에게 붙었는지 ·
   1회성 능력이 남았는지 · 지연 효과가 몇 페이즈 남았는지.
   기존 함수는 본문을 고치지 않고 래핑만 한다(원래 반환값 보존). */
(function(){
  if(window.__thyRemindLane) return; window.__thyRemindLane=true;   // 이중 래핑 방지

  /* 페이즈를 직선화(밤n=2n, 낮n=2n+1)해 남은 페이즈 수를 센다 */
  const ord=o=>(o&&o.kind==='night')? o.n*2 : (o? o.n*2+1 : 0);
  const phasesLeft=exp=> exp? ord(exp)-ord(S.phase) : null;
  const phaseLabel=o=>(o.kind==='night'?'밤 ':'낮 ')+o.n;
  const madPool=()=>editionChars(S.edition).filter(c=>!c.custom&&(c.type==='townsfolk'||c.type==='outsider'));
  /* 받침 유무에 따른 "이라고/라고" — 캐릭터명은 코드 상수이므로 조사만 고르면 된다 */
  const irago=w=>{ const t=String(w||''); const c=t.charCodeAt(t.length-1);
    return (c>=0xAC00&&c<=0xD7A3&&((c-0xAC00)%28))? '이라고':'라고'; };

  /* 1회성 능력 원장. btn=true 인 항목만 수동 소진 버튼을 준다 —
     처단자(doSlayer)·성결자(newNomination)·어릿광대(killPlayer)는 기존 흐름이 자동 기록하므로
     수동 버튼을 주면 원장이 어긋난다. */
  const ONESHOT=[
    ['slayer','slayerUsed','낮 공개 지목 — 위 “🏹 처단자 공개 지목 판정” 버튼으로 처리',false],
    ['virgin','virginUsed','최초 지명 시 자동 판정(지명자가 주민이면 즉시 처형)',false],
    ['fool','spent','첫 사망 1회 무효 — 사망 처리 시 자동 발동',false],
    ['assassin','spent','게임당 1회 밤 살해(보호·면역 무시)',true],
    ['courtier','spent','게임당 1회 — 지목 캐릭터 3밤 3낮 취함',true],
    ['professor','spent','게임당 1회 — 죽은 마을 주민 소생',true],
    ['philosopher','spent','게임당 1회 — 선한 캐릭터 능력 획득',true],
    ['seamstress','spent','게임당 1회 — 두 사람이 같은 진영인지',true],
    ['artist','spent','게임당 1회 — 예/아니오 질문',true],
    ['juggler','spent','첫 낮 공개 추측(최대 5명) — 그 다음 밤에 정답 수 전달',true],
    ['fanggu','spent','게임당 1회 — 외지인 점프',true]
  ];

  function items(){
    const out=[], ph=S.phase;
    if(!ph || ph.kind==='setup' || !S.players.length) return out;
    const isNight = ph.kind==='night';

    /* ① 광기 — 대상 / 주장해야 할 캐릭터 / 위반 시 재량 처형 */
    S.players.filter(p=>hasStatus(p,'mad')).forEach(p=>{
      const s=(p.statuses||[]).find(x=>x.key==='mad');
      const c=charOf(s&&s.note);
      const opts=['<option value="">(미지정)</option>'].concat(madPool().map(x=>
        `<option value="${esc(x.id)}"${(c&&c.id===x.id)?' selected':''}>${esc(x.ko)}</option>`)).join('');
      const cere=S.players.find(q=>q.charId==='cerenovus');
      out.push({tone:c?'':'red', icon:'🌀', head:`광기 — ${esc(p.name)}`, body:
        (c ? `<b>${esc(p.name)}</b>은(는) ${isNight?'내일':'오늘'} 하루 <b>${esc(c.ko)}</b>${irago(c.ko)} 미친 듯이 주장해야 합니다.`
           : `<b>⚠ 주장할 캐릭터가 기록되어 있지 않습니다</b> — 지금 지정하세요. 기록이 없으면 낮에 위반 판정을 할 수 없습니다.`)
        + `<br>성실히 주장하면 충족, 명백히 어기면 <b>재량 처형 가능</b>(경고성 1회 관용도 허용 — 판정 기준은 판 전체에 일관되게).`
        + `<div class="row" style="margin-top:6px;gap:6px;align-items:center"><span class="hint">주장할 캐릭터</span>`
        + `<select data-mad-sel="${esc(p.id)}">${opts}</select></div>`
        + (p.alive?'':`<div class="hint">※ 대상이 이미 사망 — 광기 의무는 사라집니다.</div>`)
        + ((cere&&isMalfunctioning(cere))?`<div class="hint">※ 세레노버스가 중독/취함 — 광기 의무 없음. 위반해도 처형하지 마세요.</div>`:'')});
    });

    /* ② 주인(집사) — 밤엔 갱신, 낮엔 제약 */
    const butler=S.players.find(p=>p.alive&&p.charId==='butler');
    if(butler){
      const master=S.players.find(p=>hasStatus(p,'master'));
      out.push({tone:master?'':'red', icon:'🤵', head:`주인 — 집사 ${esc(butler.name)}`, body:
        (master
          ? `현재 주인: <b>${esc(master.name)}</b>` + (isNight
              ? ` — 오늘 밤 집사를 깨워 <b>주인을 새로 지목</b>받으세요. 갱신을 잊으면 어제 주인이 그대로 남습니다.`
              : ` — 오늘 낮 <b>모든 지명</b>에서 ${esc(master.name)}이(가) 거수/찬성하지 않으면 집사의 표는 무효입니다.`)
          : `<b>⚠ 주인 미지정</b> — 집사를 깨워 주인을 지목받고 🤵 토큰을 놓으세요. 미지정이면 낮 투표 제한을 판정할 수 없습니다.`)
        + (isMalfunctioning(butler)? `<br><mark>집사가 현재 중독/취함 — 제약 없음(자유 투표 허용). 본인에게는 알리지 마세요.</mark>`:'')});
    }

    /* ③ 저주(마녀) — 지명하면 즉시 사망 */
    const cursed=S.players.filter(p=>hasStatus(p,'curse'));
    if(cursed.length){
      const w=S.players.find(q=>q.charId==='witch');
      const names=cursed.map(p=>esc(p.name)).join(', ');
      const why = (!w||!w.alive) ? '마녀 사망'
                : isMalfunctioning(w) ? '마녀 중독/취함'
                : (alivePlayers().length<=3) ? `생존 ${alivePlayers().length}명(3인 이하)` : '';
      out.push({tone:why?'':'red', icon:'🧹', head:`저주 — ${names}`, body:
        why ? `현재 저주는 <b>불발</b>입니다(${esc(why)}) — 지명해도 죽지 않습니다. 토큰은 남기되 발동시키지 마세요.`
            : `<b>${names}</b>이(가) <b>지명하는 즉시 사망</b>합니다. 지명자를 접수하기 전에 반드시 확인하세요(지명 절차 자체는 그대로 진행).`});
    }

    /* ④ 1회성 능력 소진 현황 */
    const rows=[];
    ONESHOT.forEach(([cid,key,what,btn])=>{
      playersByChar(cid).forEach(p=>{
        const used=hasStatus(p,key);
        rows.push(`<div class="checkitem"><span class="pill ${used?'neutral':'warn'}">${used?'✔ 소진':'● 남음'}</span>`
          +`<span><b>${esc(charName(p))}</b> <span class="hint">${esc(p.name)}</span> — ${esc(what)}`
          +((!used&&btn)?` <button class="small" data-spend-cid="${esc(cid)}" data-spend-key="${esc(key)}">✔ 소진 기록</button>`:'')
          +`</span></div>`);
      });
    });
    if(rows.length) out.push({tone:'', icon:'✔', head:'1회성 능력 현황', body:rows.join('')});

    /* ⑤ 지연·지속 효과 타이머 */
    const de=[];
    if(S.pukkaVictimId){
      const v=playerOf(S.pukkaVictimId);
      const pk=S.players.find(q=>q.charId==='pukka');
      if(v) de.push(`🐍 <b>푸카의 독</b>: ${esc(v.name)} — <b>푸카가 다음에 무는 시점</b>에 사망합니다(페이즈 만료가 아님). `
        +((pk&&(!pk.alive||isMalfunctioning(pk)))
          ? '<mark>푸카가 사망/오작동 — 지연 사망이 일어나지 않습니다.</mark>'
          : '푸카 단계를 건너뛰면 사망도 함께 미뤄집니다.'));
    }
    const TIMED=['poison','drunkS','protect','execProtect'];
    S.players.forEach(p=>(p.statuses||[]).forEach(s=>{
      const d=STATUS_DEFS[s.key]; if(!d || TIMED.indexOf(s.key)<0) return;
      const src=s.source?`(${esc(s.source)})`:'';
      if(s.expiresAt) de.push(`${d.icon} <b>${esc(p.name)}</b> ${esc(d.ko)}${src} — ${esc(phaseLabel(s.expiresAt))} 시작에 자동 해제 · 남은 페이즈 <b>${phasesLeft(s.expiresAt)}</b>`);
      else de.push(`${d.icon} <b>${esc(p.name)}</b> ${esc(d.ko)}${src} — <b>영구</b>(자동 해제 없음). 임의로 지우지 마세요.`);
    }));
    if(de.length) out.push({tone:'', icon:'⏳', head:'지연·지속 효과 타이머', body:de.map(x=>`<div>· ${x}</div>`).join('')});

    return out;
  }

  function bannerHTML(list){
    if(!list.length) return '';
    const when=S.phase.kind==='night'? `밤 ${S.phase.n}` : `낮 ${S.phase.n}`;
    return `<div class="card" id="thyRemind">
      <div class="row" style="justify-content:space-between;margin-bottom:4px">
        <h2 style="margin:0">🔔 지금 확인할 것 <span class="hint">${esc(when)}</span></h2>
        <span class="hint">이 판의 실제 값 — 시트 전체 안내는 체크리스트 탭</span></div>
      ${list.map(it=>`<div class="alertbox ${it.tone==='red'?'red':'blue'}"><b>${it.icon} ${it.head}</b><div style="margin-top:4px">${it.body}</div></div>`).join('')}
    </div>`;
  }
  function inject(paneId){
    const pane=document.getElementById(paneId); if(!pane) return;
    /* 비활성 탭에 남은 낡은 배너까지 제거 — id 중복을 만들지 않는다 */
    document.querySelectorAll('#thyRemind').forEach(n=>n.remove());
    const html=bannerHTML(items()); if(!html) return;
    const box=document.createElement('div'); box.innerHTML=html;
    const node=box.firstElementChild; if(node) pane.insertBefore(node, pane.firstChild);
  }
  const _n=renderNight, _d=renderDay;
  renderNight=function(){ const r=_n.apply(this,arguments); inject('pane-night'); return r; };
  renderDay =function(){ const r=_d.apply(this,arguments); inject('pane-day');  return r; };

  /* 낮/밤 전환 순간에 능동 제시 — 배너가 이미 맨 위에 붙지만, 전환 직후엔 토스트로 한 번 더 민다 */
  const _adv=advancePhase;
  advancePhase=function(){
    const before=S.phase.kind+'/'+S.phase.n;
    const r=_adv.apply(this,arguments);
    if(S.phase.kind+'/'+S.phase.n!==before){
      const l=items(), urgent=l.filter(i=>i.tone==='red').length;
      if(l.length) toast(`🔔 지금 확인할 것 ${l.length}건${urgent?` · 미기록/미지정 ${urgent}건`:''} — 화면 맨 위 카드를 보세요.`, urgent?'warn':'ok');
    }
    return r;
  };

  /* 지명 UI 실시간 경고 — 지명자를 고르는 순간(개시 전)에 저주·광기를 알린다 */
  const _snp=setNomPick;
  setNomPick=function(k,pid){
    const r=_snp.apply(this,arguments);
    try{
      if(k==='tor' && typeof nomPick!=='undefined' && nomPick.tor===pid){
        const p=playerOf(pid), msg=[];
        if(p && hasStatus(p,'curse')){
          const w=S.players.find(q=>q.charId==='witch');
          const off = !w || !w.alive || isMalfunctioning(w) || alivePlayers().length<=3;
          msg.push(off? `🧹 ${p.name}은(는) 저주받았지만 지금은 불발 조건 — 지명해도 죽지 않습니다.`
                      : `🧹 경고: ${p.name}은(는) 마녀의 저주 상태 — 지명을 개시하면 즉시 사망합니다.`);
        }
        if(p && hasStatus(p,'mad')){
          const s=(p.statuses||[]).find(x=>x.key==='mad'), c=charOf(s&&s.note);
          msg.push(`🌀 ${p.name}은(는) 광기 상태${c?`(${c.ko} 주장)`:'(주장 캐릭터 미기록)'} — 위반 여부를 먼저 판정하세요.`);
        }
        if(msg.length) toast(msg.join(' / '), 'warn');
      }
    }catch(e){}
    return r;
  };

  /* 광기 캐릭터 기록 — 위저드가 고른 madchar 를 mad 토큰에 붙인다.
     doMad 는 반환값을 쓰지 않지만 규약대로 원래 반환값을 그대로 넘긴다. */
  const _doMad=doMad;
  window.doMad = doMad = function(pid){
    const r=_doMad.apply(this,arguments);
    try{
      const p=playerOf(pid);
      const s=p && (p.statuses||[]).find(x=>x.key==='mad');
      if(s){
        const cid=(typeof wiz!=='undefined' && wiz && wiz.vars && (wiz.vars.madchar||[])[0]) || '';
        const c=charOf(cid);
        s.note = c? c.id : '';
        if(c){ log(`🌀 광기 기록 — ${p.name}: ${c.ko}`);
               toast(`🌀 ${p.name} 광기 — 내일 하루 “${c.ko}”${irago(c.ko)} 주장해야 합니다. 위반 시 재량 처형 가능.`,'warn'); }
        else   toast(`🌀 ${p.name} 광기 부여 — 주장할 캐릭터를 “🔔 지금 확인할 것” 카드에서 지정하세요.`,'warn');
        save(); renderAll();
      }
    }catch(e){}
    return r;
  };

  /* 위임 리스너 — 인라인 onclick 에 사용자 데이터를 절대 넣지 않는다 */
  document.addEventListener('change', e=>{
    const t=e.target && e.target.closest && e.target.closest('[data-mad-sel]');
    if(!t) return;
    const p=playerOf(t.getAttribute('data-mad-sel')); if(!p) return;
    const s=(p.statuses||[]).find(x=>x.key==='mad');
    if(!s){ toast('광기 토큰이 없습니다 — 먼저 🌀 토큰을 부여하세요.','warn'); return; }
    const c=charOf(t.value);
    s.note = c? c.id : '';
    log(`🌀 광기 기록 — ${p.name}: ${c? c.ko : '(미지정)'}`);
    save(); renderAll();
  });
  document.addEventListener('click', e=>{
    const t=e.target && e.target.closest && e.target.closest('[data-spend-cid]');
    if(!t) return;
    const cid=t.getAttribute('data-spend-cid'), key=t.getAttribute('data-spend-key')||'spent';
    if(!STATUS_DEFS[key]) return;
    const p=S.players.find(q=>q.charId===cid && !hasStatus(q,key));
    if(!p){ toast('대상이 없거나 이미 소진되었습니다.','warn'); return; }
    addStatus(p,key,`${charName(p)} 1회 능력 사용`,null);
    toast(`✔ ${p.name}(${charName(p)}) 1회 능력 소진 기록`,'ok');
    save(); renderAll();
  });

  window.thyReminders = items;   // 테스트·디버그용 진입점
})();

(function(){
  const sb=document.querySelector('#sharebtn');
  if(sb) sb.onclick=()=>thyShareCurrent();   // 값 캡처 금지 — 호출 시점에 이름을 다시 해석한다
  /* 초기 로드: 해시가 유효하면 그 화면으로, 아니면 기본 탭으로 되돌리고 큐레이션 포함 재렌더 */
  if(!(location.hash && thyRouteApply(location.hash))){ thyRouteFallback(); renderAll(); }
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   요구 6 — 시트별 사회자 유의사항 + 커스텀 시트 자동 검증
   원본 함수는 수정하지 않는다. renderSheet / renderCustom / buildChecklist /
   addCustom / importScript 를 이 블록에서 래핑하고, 원래 반환값을 그대로 돌려준다.
   유의사항 문장은 공식 위키에서 사실만 확인하고 전부 자체 작성했다.
   ══════════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
const E = (typeof esc==='function') ? esc
        : (s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

/* ── 1. 공식 3스크립트 사회자 유의사항 ────────────────────────────────── */
const ST_SHEET_NOTES={
 tb:{lead:'능력이 대부분 1회성이거나 매 밤 같은 형태로 반복되어, 사회자가 동시에 붙잡고 있어야 할 상태가 적다. 함정은 능력 자체보다 게임을 시작하기 전에 정해두는 것들에 몰려 있다.',
  items:[
   {tag:'셋업',t:'주정뱅이 위장을 배분 단계에서 확정한다',
    d:'주정뱅이는 자기가 다른 주민이라고 믿는다. 어떤 주민으로 위장시킬지 캐릭터를 나눠주기 전에 정하고, 본인에게는 그 주민 토큰만 보여준다. 그리모어에는 주정뱅이 토큰과 위장 토큰을 겹쳐 두고, 매 밤 위장 주민의 순서 자리에서 깨워 거짓 정보를 준다 — 위장 주민이 밤에 깨지 않는 캐릭터라면 주정뱅이도 깨우지 않는다.'},
   {tag:'셋업',t:'붉은 청어는 첫날 밤 전에 정하고 끝까지 바꾸지 않는다',
    d:'점쟁이의 붉은 청어는 게임 내내 고정이다. 점쟁이 본인을 붉은 청어로 삼아도 된다. 판 중간에 대상을 바꾸면 그때까지 준 점괘가 전부 앞뒤가 맞지 않게 되고, 마을은 그 모순을 사회자 실수가 아니라 단서로 읽는다.'},
   {tag:'셋업',t:'남작이 뽑히면 배분을 다시 짠다',
    d:'남작은 주민 −2 / 외지인 +2다. 인원표대로 뽑은 뒤 남작이 나왔다면 토큰을 나눠주기 전에 구성을 고쳐야 한다. 외지인이 늘어나면 주정뱅이·성자·은둔자가 한꺼번에 들어올 수 있어 판의 성격이 완전히 달라진다.'},
   {tag:'재량',t:'은둔자·첩자의 등록은 판정마다 정하고 기록한다',

   {tag:'밤',t:'까마귀지기는 밤 사망 직후에 챙긴다',

function stNotesHTML(ed){
  const n=ST_SHEET_NOTES[ed];
  if(!n) return '';
  return '<div class="secthead"><span class="shicon">🎩</span> 이 시트의 사회자 유의사항</div>'
   +'<p class="stlead">'+E(n.lead)+'</p>'
   +n.items.map(function(it){
      return '<div class="stitem"><h4><span class="sttag">'+E(it.tag)+'</span>'+E(it.t)+'</h4><p>'+E(it.d)+'</p></div>';
    }).join('')
   +'<p class="hint">공식 위키에서 사실 관계만 확인하고 문장은 티르소스가 직접 썼습니다. 정본은 공식 룰북·위키를 따릅니다.</p>';
}

/* ── 2. 커스텀 시트 자동 검증 ─────────────────────────────────────────
   반환: [{sev:'error'|'warn'|'info', cat, id, txt}] — id 는 체크박스 키 안정용. */
const INFO_RE=/알게 된다|알려준다|알 수 있다|안다|확인한다|가리킨다|보여준다/;
const SWAP_RE=/캐릭터[^.]{0,30}(맞바꾸|맞바꿀|바꾼다|바꿀 수|바뀐다|교체)|로 변한다/;
const SETUPMOD_RE=/구성 변경|외지인\s*[+\-−±]|주민\s*[+\-−±]|외지인 수/;

function thyAuditCustomScript(){
  const out=[];
  const add=(sev,cat,id,txt)=>{ out.push({sev,cat,id,txt}); };
  if(typeof S==='undefined'||!S) return out;
  const customs=Array.isArray(S.customs)? S.customs.filter(c=>c&&typeof c==='object') : [];
  const ed=S.edition||'tb';
  const edName=(typeof EDITIONS!=='undefined'&&EDITIONS[ed])? EDITIONS[ed].ko : ed;
  const base=(typeof CHARACTERS!=='undefined')
    ? CHARACTERS.filter(c=>(c.edition||'tb')===ed && c.type!=='traveler' && c.type!=='fabled') : [];
  const sheet=base.concat(customs);
  const cnt=t=>sheet.filter(c=>c.type===t).length;
  const nm=c=>c.ko||c.id;
  const list=a=>a.map(nm).join(' · ');

  /* ── 구성 ── */
  const nD=cnt('demon'), nM=cnt('minion'), nT=cnt('townsfolk'), nO=cnt('outsider');
  add('info','구성','comp',`현재 시트(${edName} + 커스텀 ${customs.length}종) 구성 — 주민 ${nT} · 외지인 ${nO} · 하수인 ${nM} · 악마 ${nD}종.`);
  if(nD===0) add('error','구성','demon0','악마가 한 종도 없다 — 배분할 악마가 없어 게임을 시작할 수 없다.');
  if(nM===0) add('error','구성','minion0','하수인이 한 종도 없다 — 7인 이상 판에서 배분할 하수인이 없다.');
  if(nT<13) add('warn','구성','tf-low',`주민이 ${nT}종뿐이다 — 15인 판은 주민 9명이 필요하고 표준 시트는 13종을 갖춘다. 중복 배정을 허용할지 미리 정해라.`);
  if(nO<4) add('warn','구성','out-low',`외지인이 ${nO}종뿐이다 — 15인 판 기본 2명에 셋업 보정(+2)까지 겹치면 최대 4명까지 필요하다.`);
  if(nM<4) add('warn','구성','min-low',`하수인이 ${nM}종뿐이다 — 13인 이상 판은 하수인 3명을 서로 다른 캐릭터로 채워야 한다.`);
  const cD=customs.filter(c=>c.type==='demon');
  if(cD.length) add('info','구성','cdemon',`커스텀 악마 ${cD.length}종(${list(cD)})이 기존 악마 ${nD-cD.length}종에 더해졌다 — 배분 전에 어느 악마를 쓸지 명시해라.`);

  /* 외지인 보정(setupNote) 조합 */
  const outMod=sheet.filter(c=>/외지인/.test(c.setupNote||'') || SETUPMOD_RE.test(c.ability||''));
  /* 악마는 한 판에 한 종만 들어가므로 악마 보정자는 통째로 1건으로 센다(스톡 시트 오경보 방지). */
  const outModEff=outMod.filter(c=>c.type!=='demon').length + (outMod.some(c=>c.type==='demon')?1:0);
  if(outModEff>=2) add('warn','구성','outmod',`외지인·주민 수를 건드리는 캐릭터가 동시에 뽑힐 수 있다(${list(outMod)}) — 보정이 누적되면 외지인 수가 인원표에서 크게 벗어난다. 토큰을 나눠주기 전에 합산 결과를 손으로 확인해라.`);
  else if(outMod.length>=1) add('info','구성','outmod1',`셋업에서 구성을 바꾸는 캐릭터: ${list(outMod)} — 뽑혔다면 배분 전에 보정을 적용해라.`);
  customs.filter(c=>SETUPMOD_RE.test(c.ability||'')).forEach(c=>{
    add('warn','구성','cset:'+c.id,`커스텀 「${nm(c)}」 능력에 구성 변경이 적혀 있지만 티르소스는 커스텀의 셋업 보정을 자동 적용하지 않는다 — 인원 배분 화면에서 직접 보정해라.`);
  });

  /* ── 상호작용 ── */
  const koMap={};
  sheet.forEach(c=>{ const k=(c.ko||'').trim(); if(!k) return; (koMap[k]=koMap[k]||[]).push(c); });
  Object.keys(koMap).filter(k=>koMap[k].length>1).forEach(k=>{
    add('warn','상호작용','dupko:'+k,`이름 「${k}」가 ${koMap[k].length}개 있다 — 그리모어·체크리스트·밤 순서에서 서로 구분되지 않는다.`);
  });
  const seenId={};
  customs.forEach(c=>{ seenId[c.id]=(seenId[c.id]||0)+1; });
  Object.keys(seenId).filter(k=>seenId[k]>1).forEach(k=>{
    add('error','상호작용','dupid:'+k,`커스텀 id 「${k}」가 중복된다 — 삭제·배정이 엉뚱한 캐릭터에 걸린다.`);
  });
  if(typeof CHARACTERS!=='undefined') customs.filter(c=>CHARACTERS.some(b=>b.id===c.id)).forEach(c=>{
    add('error','상호작용','shadow:'+c.id,`커스텀 「${nm(c)}」의 id 「${c.id}」가 기본 캐릭터와 겹친다 — 조회가 기본 캐릭터 쪽으로 먼저 잡혀 능력·가이드가 뒤바뀐다. id 를 바꿔 다시 등록해라.`);
  });
  /* 성립하는 공식 징크스(시트 기준 — 배정 전이라도 조합이 가능하면 경고) */
  if(typeof JINXES!=='undefined'&&Array.isArray(JINXES)){
    const ids=new Set(sheet.map(c=>c.id));
    JINXES.filter(j=>ids.has(j.a)&&ids.has(j.b)).forEach(j=>{
      const a=sheet.find(c=>c.id===j.a), b=sheet.find(c=>c.id===j.b);
      add('warn','상호작용','jinx:'+j.a+'|'+j.b,`징크스 — ${a?a.ko:j.a} ↔ ${b?b.ko:j.b}: ${j.rule}`+(j.confidence==='check'?' (공식 위키 재확인 필요)':''));
    });
  }
  const cInfo=customs.filter(c=>INFO_RE.test(c.ability||''));
  const liars=sheet.filter(c=>/모두 거짓|전부 거짓/.test(c.ability||''));
  if(liars.length&&cInfo.length) add('warn','상호작용','vortox',`전역 거짓 정보 캐릭터(${list(liars)})와 커스텀 정보 캐릭터 ${cInfo.length}종(${list(cInfo)})이 같은 시트에 있다 — 커스텀 정보에도 같은 원칙을 적용할지 미리 정해라. 자동 적용되지 않는다.`);
  const swappers=sheet.filter(c=>SWAP_RE.test(c.ability||''));
  const cWake=customs.filter(c=>c.first||c.other);
  if(swappers.length&&cWake.length) add('warn','상호작용','swap',`게임 중 캐릭터를 바꾸는 캐릭터(${list(swappers)})가 있고, 밤에 깨는 커스텀이 ${cWake.length}종이다 — 교체로 커스텀이 들어오거나 빠질 때 밤 순서는 자동으로 재계산되지 않는다.`);
  const cVote=customs.filter(c=>c.voteRelated);
  if(cVote.length>=2) add('warn','상호작용','vote',`투표 노티스를 띄우는 커스텀이 ${cVote.length}종이다(${list(cVote)}) — 낮 패널에 동시에 쌓여 어느 것이 지금 유효한지 흐려진다.`);
  customs.filter(c=>!c.ability||c.ability==='(능력 미기재)').forEach(c=>{
    add('warn','상호작용','noab:'+c.id,`커스텀 「${nm(c)}」에 능력 설명이 없다 — 상호작용을 검증할 근거가 없고 시트·백과사전에도 빈칸으로 나온다.`);
  });
  customs.filter(c=>!c.first&&!c.other&&!c.voteRelated&&!(c.reminders||[]).length).forEach(c=>{
    add('info','상호작용','inert:'+c.id,`커스텀 「${nm(c)}」는 밤에 깨지 않고 리마인더·투표 노티스도 없다 — 진행 화면 어디에도 나타나지 않는다.`);
  });

  /* ── 밤 순서 ── */
  const edF=(typeof EDITIONS!=='undefined'&&EDITIONS[ed]&&Array.isArray(EDITIONS[ed].first))? EDITIONS[ed].first : [];
  const edO=(typeof EDITIONS!=='undefined'&&EDITIONS[ed]&&Array.isArray(EDITIONS[ed].other))? EDITIONS[ed].other : [];
  const tbF=(typeof FIRST_NIGHT_ORDER!=='undefined')? FIRST_NIGHT_ORDER : [];
  const tbO=(typeof OTHER_NIGHT_ORDER!=='undefined')? OTHER_NIGHT_ORDER : [];
  [['first','firstAfter',edF,tbF,'첫날 밤'],['other','otherAfter',edO,tbO,'그 외 밤']].forEach(function(spec){
    const wakeK=spec[0], anchK=spec[1], order=spec[2], tbOrder=spec[3], label=spec[4];
    customs.forEach(function(c,idx){
      if(!c[wakeK]) return;
      const a=c[anchK];
      if(!a){ add('warn','밤 순서','na:'+wakeK+':'+c.id,`「${nm(c)}」의 ${label} 위치가 지정되지 않았다 — 밤 순서 맨 앞(하수인·악마 정보보다도 앞)으로 들어간다. 의도한 자리인지 확인해라.`); return; }
      const inEd=order.indexOf(a)>=0;
      const ai=customs.findIndex(x=>x.id===a);
      if(!inEd&&ai<0){
        const hint=(tbOrder.indexOf(a)>=0)? ` 이 앵커는 점철되는 혼란 밤 순서에만 있다 — 커스텀 편집 화면의 위치 목록은 점철되는 혼란 기준으로만 만들어진다.` : '';
        add('error','밤 순서','bad:'+wakeK+':'+c.id,`「${nm(c)}」의 ${label} 기준 「${a}」를 현재 에디션(${edName}) 밤 순서에서 찾을 수 없다 — 맨 끝으로 밀려난다.`+hint);
        return;
      }
      if(ai>=0){
        if(!customs[ai][wakeK]) add('error','밤 순서','anchoff:'+wakeK+':'+c.id,`「${nm(c)}」가 「${nm(customs[ai])}」 다음으로 지정됐지만 그 캐릭터는 ${label}에 깨지 않아 순서에 존재하지 않는다 — 맨 끝으로 밀려난다.`);
        else if(ai>idx) add('warn','밤 순서','fwd:'+wakeK+':'+c.id,`「${nm(c)}」가 목록에서 뒤쪽에 있는 「${nm(customs[ai])}」를 기준으로 삼는다 — 삽입 시점에 기준이 아직 없어 ${label}에 맨 끝으로 밀려난다. 등록 순서를 앞뒤로 바꿔라.`);
      }
    });
    /* 순환 참조 */
    const reported={};
    customs.forEach(function(c){
      if(!c[wakeK]) return;
      const seen={}; let cur=c, guard=0;
      while(cur && guard++<=customs.length+1){
        if(seen[cur.id]){
          const key=Object.keys(seen).sort().join('>');
          if(!reported[key]){ reported[key]=1;
            add('error','밤 순서','cycle:'+wakeK+':'+key,`${label} 순서에 순환 참조가 있다 — ${Object.keys(seen).map(id=>{const x=customs.find(y=>y.id===id);return x?nm(x):id;}).join(' → ')} 가 서로를 기준으로 삼는다. 하나 이상을 기본 캐릭터 뒤로 옮겨라.`);
          }
          break;
        }
        seen[cur.id]=1;
        const a=cur[anchK];
        cur = a? customs.find(x=>x.id===a) : null;
      }
    });
  });

  /* ── 정보 역할 ── */
  const infoTf=sheet.filter(c=>c.type==='townsfolk'&&(c.first||c.other)&&INFO_RE.test(c.ability||''));
  if(infoTf.length<2) add('warn','정보 역할','info-low',`밤에 정보를 얻는 주민이 ${infoTf.length}종뿐이다 — 선한 팀이 추리를 시작할 근거가 거의 없다. 사망 패턴만으로 굴러가는 시트가 되는지 확인해라.`);
  else if(infoTf.length>10) add('warn','정보 역할','info-high',`밤에 정보를 얻는 주민이 ${infoTf.length}종이다 — 밤이 길어지고 마을이 과도하게 강해진다. 점철되는 혼란 8종 · 화단에 꽃피운 이단 7종이 기준이다.`);
  else if(infoTf.length<6) add('info','정보 역할','info-lean',`밤에 정보를 얻는 주민 ${infoTf.length}종 — 정보가 적은 편이다. 피로 물든 달(2종)처럼 사망 패턴과 처형으로 굴러가는 시트인지 확인해라.`);
  else add('info','정보 역할','info-ok',`밤에 정보를 얻는 주민 ${infoTf.length}종 — 점철되는 혼란 8종 · 화단에 꽃피운 이단 7종과 같은 범위다.`);
  if(cWake.length>=4) add('warn','정보 역할','wake-many',`밤에 깨는 커스텀이 ${cWake.length}종이다 — 기존 밤 순서에 그만큼 단계가 더 붙어 밤이 눈에 띄게 길어진다.`);

  return out;
}
window.thyAuditCustomScript=thyAuditCustomScript;

const SEV_CLS={error:'e',warn:'w',info:'i'};
function ccAuditHTML(){
  let ws=[];
  try{ ws=thyAuditCustomScript(); }catch(e){ console.warn('[thyrsus] 시트 검증 실패', e); return ''; }
  const ne=ws.filter(w=>w.sev==='error').length, nw=ws.filter(w=>w.sev==='warn').length;
  const rows=ws.slice().sort((a,b)=>({error:0,warn:1,info:2}[a.sev]-{error:0,warn:1,info:2}[b.sev]))
    .map(w=>`<div class="ccrow ${SEV_CLS[w.sev]}"><span class="cccat">${E(w.cat)}</span><span>${E(w.txt)}</span></div>`).join('');
  return '<div class="secthead"><span class="shicon">🧪</span> 시트 자동 검증</div>'
   +`<div class="ccsum"><span class="ccpill ${ne?'e':'o'}">오류 ${ne}</span><span class="ccpill ${nw?'w':'o'}">경고 ${nw}</span>`
   +`<span class="ccpill">점검 항목 ${ws.length}</span></div>`
   +(ne||nw? '' : '<p class="hint">치명적인 문제는 발견되지 않았습니다. 아래는 현재 시트에서 계산된 상태입니다.</p>')
   +rows
   +'<p class="hint">구성·상호작용·밤 순서·정보 역할을 현재 시트에서 매번 다시 계산합니다. 경고는 규칙 위반이 아니라 사회자가 직접 결정해야 하는 지점을 가리킵니다.</p>';
}
window.thyCcAuditHTML=ccAuditHTML;

/* ── 3. 래핑 (원래 반환값 보존) ─────────────────────────────────────── */
function wrapRender(name, hostId, htmlFn, paneId){
  if(typeof window[name]!=='function') return;
  const _prev=window[name];
  window[name]=function(){
    const r=_prev.apply(this, arguments);
    try{
      const pane=document.querySelector(paneId);
      if(pane){
        const card=pane.querySelector('.card')||pane;
        let host=pane.querySelector('#'+hostId);
        if(!host){ host=document.createElement('div'); host.id=hostId; card.appendChild(host); }
        host.innerHTML=htmlFn();
      }
    }catch(e){ console.warn('[thyrsus] '+name+' 부가 렌더 실패', e); }
    return r;
  };
}
wrapRender('renderSheet','stnotes',()=>stNotesHTML((typeof sheetEd!=='undefined'&&sheetEd)||'tb'),'#pane-sheet');
wrapRender('renderCustom','ccaudit',()=>ccAuditHTML(),'#pane-custom');

/* 체크리스트: 정적 문구를 걷어내고 계산된 경고를 넣는다. */
if(typeof window.buildChecklist==='function'){
  const _prevBuild=window.buildChecklist;
  const STATIC='커스텀 캐릭터 — 상호작용 검증 필요(제작자에게 시트 검토 요청)';
  window.buildChecklist=function(){
    const items=_prevBuild.apply(this, arguments)||[];
    const out=items.filter(i=>!(i&&i.txt===STATIC));
    try{
      thyAuditCustomScript().filter(w=>w.sev!=='info').forEach(w=>{
        /* 키에 사용자 문자열이 그대로 들어가지 않도록 ASCII 로 인코딩한다(체크박스 onchange 인라인 인자). */
        out.push({group:'시트 검증', src:w.cat, txt:(w.sev==='error'?'⛔ ':'⚠ ')+w.txt, key:'ccaudit|'+encodeURIComponent(w.id)});
      });
    }catch(e){ console.warn('[thyrsus] 체크리스트 검증 편입 실패', e); }
    return out;
  };
}

/* 커스텀 추가·가져오기 직후 요약 알림 */
['addCustom','importScript'].forEach(function(fn){
  if(typeof window[fn]!=='function') return;
  const _prev=window[fn];
  window[fn]=function(){
    const r=_prev.apply(this, arguments);
    try{
      const ws=thyAuditCustomScript();
      const ne=ws.filter(w=>w.sev==='error').length, nw=ws.filter(w=>w.sev==='warn').length;
      if((ne||nw) && typeof toast==='function'){
        setTimeout(()=>toast(`시트 자동 검증: 오류 ${ne} · 경고 ${nw} — 아래 "시트 자동 검증"에서 확인하세요.`, ne?'warn':'ok'), 400);
      }
    }catch(e){ console.warn('[thyrsus] 검증 요약 실패', e); }
    return r;
  };
});

/* 이 블록이 늦게 얹히므로 현재 화면을 한 번 다시 그린다. */
try{ if(typeof renderAll==='function') renderAll(); }catch(e){}
})();
</script>

<script>
/* ══════════════════ 상태 통합 대시보드 (요구 4) ══════════════════
   "지금 걸려 있는 상태 + 언제 풀리나"를 밤·낮·그리모어 탭 상단에 접이식 패널로 얹는다.
   - 원본 render* 는 손대지 않고 IIFE 로 감싸 반환값을 그대로 보존한 뒤 패널만 앞에 끼워 넣는다.
   - 신규 영속 필드 없음: 접힘 상태는 세션 변수(sbOpen)로만 관리한다.
   - 사용자 문자열은 전부 esc(). 인라인 onclick 에는 사용자 데이터를 넣지 않는다(무인자 토글뿐). */
(function(){
  if(window.__thyStatusBoard) return;      // 중복 설치 방지(레인 중복 적용 대비)
  window.__thyStatusBoard = true;

  let sbOpen = true;                        // 세션 한정 — 저장하지 않는다

  /* 페이즈 서수: 밤 n < 낮 n < 밤 n+1. 준비 단계는 -1. */
  function sbOrd(ph){ return (!ph || ph.kind==='setup' || typeof ph.n!=='number') ? -1 : ph.n*2 + (ph.kind==='night'?0:1); }
  function sbPhaseKo(e){ return (e.kind==='night'?'밤 ':'낮 ') + e.n + ' 시작'; }
  /* expiresAt 을 사람이 읽는 문구로. soon = 이번 페이즈 전환에 풀림(강조 대상) */
  function sbExpiry(s){
    if(!s || !s.expiresAt || typeof s.expiresAt.n!=='number') return {txt:'영구 · 수동 해제', soon:false};
    const cur=sbOrd(S.phase), tgt=sbOrd(s.expiresAt), abs=sbPhaseKo(s.expiresAt);
    if(tgt<=cur)      return {txt:abs+' · 기한 지남(다음 전환에 정리)', soon:true};
    if(tgt===cur+1)   return {txt:abs+' · 다음 전환에 해제', soon:true};
    return {txt:abs, soon:false};
  }
  /* 오작동 사유(중독 · 취함 · 주정뱅이 캐릭터) — isMalfunctioning 과 같은 판정 기준 */
  function sbMalReasons(p){
    const r=[];
    (p.statuses||[]).forEach(s=>{
      if(s.key==='poison') r.push('☠ 중독' + (s.source?' ('+s.source+')':''));
      if(s.key==='drunkS') r.push('🍺 취함' + (s.source?' ('+s.source+')':''));
    });
    if(p.charId==='drunk') r.push('🍺 주정뱅이(캐릭터 자체 · 영구)');
    return r;
  }

  function sbRowHTML(p, s){
    const ex=sbExpiry(s), i=S.players.indexOf(p);
    return '<div class="sbrow'+(ex.soon?' soon':'')+'">'
      + '<span class="sbwho"><span class="num">'+(i+1)+'</span> '+esc(p.name)+'</span>'
      + '<span class="sbmeta">'+esc(charName(p))+(p.alive?'':' · 💀 사망')+'</span>'
      + (s.source?'<span class="sbmeta">출처 '+esc(s.source)+'</span>':'')
      + '<span class="sbexp">'+esc(ex.txt)+'</span></div>';
  }

  function statusBoardHTML(){
    if(typeof S!=='object' || !S || !Array.isArray(S.players)) return '';
    if(!S.phase || S.phase.kind==='setup') return '';

    const groups=[]; let total=0;
    Object.keys(STATUS_DEFS).forEach(key=>{      // STATUS_DEFS 정의 순서 = 표시 순서
      const d=STATUS_DEFS[key], rows=[];
      S.players.forEach(p=>{ (p.statuses||[]).forEach(s=>{ if(s.key===key) rows.push({p:p, s:s}); }); });
      if(rows.length){ total+=rows.length; groups.push({d:d, rows:rows}); }
    });

    const mal=S.players.filter(p=>isMalfunctioning(p));
    const malHTML = mal.length
      ? '<div class="sbmal"><div class="sbmalt">⚠ 능력 오작동 '+mal.length+'명 — 정보형은 거짓 가능, 발동형은 불발</div>'
        + '<div class="sbmalrow">' + mal.map(p=>
            '<span class="sbmalp'+(p.alive?'':' dead')+'">'+esc(p.name)+(p.alive?'':' 💀')
            + '<span class="why">'+esc(charName(p))+' · '+esc(sbMalReasons(p).join(' + ')||'오작동')+'</span></span>').join('')
        + '</div></div>'
      : '<div class="sbok">✔ 현재 오작동(중독·취함·주정뱅이) 인원 없음</div>';

    const groupHTML = groups.length
      ? groups.map(g=>'<div class="sbgrp"><div class="sbgname" title="'+esc(g.d.desc)+'">'+g.d.icon+' '+esc(g.d.ko)
          +' <span class="sbmeta">'+g.rows.length+'명</span></div>'
          + g.rows.map(r=>sbRowHTML(r.p, r.s)).join('') + '</div>').join('')
      : '<div class="sbempty">걸려 있는 상태 토큰이 없습니다.</div>';

    const soonN = groups.reduce((a,g)=>a + g.rows.filter(r=>sbExpiry(r.s).soon).length, 0);
    return '<div class="thy-sb">'
      + '<button type="button" class="sbhead" onclick="toggleStatusBoard()" aria-expanded="'+(sbOpen?'true':'false')+'">'
      + '<span>🗂 상태판</span>'
      + '<span class="sbmeta">상태 '+total+'건 · 오작동 '+mal.length+'명'+(soonN?' · 만료 임박 '+soonN+'건':'')+'</span>'
      + '<span class="sbcaret">'+(sbOpen?'접기 ▲':'펼치기 ▼')+'</span></button>'
      + (sbOpen ? '<div class="sbbody">'+malHTML+groupHTML
          + '<div class="sbfoot">만료 시점은 그 페이즈가 <b>시작될 때</b> 자동 해제됩니다. 노란 줄 = 다음 전환에 풀림.</div></div>' : '')
      + '</div>';
  }

  window.toggleStatusBoard = function(){ sbOpen = !sbOpen; renderAll(); };

  const PANES = {renderNight:'#pane-night', renderDay:'#pane-day', renderGrim:'#pane-grim'};
  function injectInto(sel){
    const pane=document.querySelector(sel); if(!pane) return;
    Array.prototype.slice.call(pane.children).forEach(c=>{
      if(c.classList && c.classList.contains('thy-sb')) c.remove();
    });
    const html=statusBoardHTML(); if(!html) return;
    const holder=document.createElement('div'); holder.innerHTML=html;
    const node=holder.firstElementChild;
    if(node) pane.insertBefore(node, pane.firstChild);
  }

  /* 원본을 값으로 붙잡지 않는다 — orig 만 잡고, 호출은 항상 래퍼를 통해 이름으로 해석된다.
     반환값(원본이 undefined 여도)을 그대로 돌려준다. */
  Object.keys(PANES).forEach(fn=>{
    const orig = window[fn];
    if(typeof orig!=='function') return;
    window[fn] = function(){
      const ret = orig.apply(this, arguments);
      try{ injectInto(PANES[fn]); }catch(err){ console.warn('[statusboard]', err); }
      return ret;
    };
  });

  /* 설치 시점에 이미 그려진 활성 탭에는 즉시 한 번 끼워 넣는다(첫 렌더는 이 블록보다 먼저 끝난다) */
  try{
    Object.keys(PANES).forEach(fn=>{
      const el=document.querySelector(PANES[fn]);
      if(el && el.classList.contains('active') && el.innerHTML.trim()) injectInto(PANES[fn]);
    });
  }catch(err){ console.warn('[statusboard init]', err); }

  window.thyStatusBoard = {html:statusBoardHTML, expiry:sbExpiry, ord:sbOrd, malReasons:sbMalReasons,
    inject:injectInto, isOpen:()=>sbOpen, setOpen:v=>{ sbOpen=!!v; }};
})();
</script>
