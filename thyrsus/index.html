function statsHistBoard(h){
  const rows=h.players.slice()
    .sort((a,b)=>(statsPlayerScore(b)??-1)-(statsPlayerScore(a)??-1))
    .map(p=>{
      const c=charOf(p.charId);
      const al=p.alignment==='evil'? '<span class="pill evilw">악</span>'
        : p.alignment==='good'? '<span class="pill goodw">선</span>' : '<span class="pill neutral">—</span>';
      return `<tr><td>${statsIsMvp(h,p)?'👑 ':''}${esc(p.name??'?')}</td>
      <td>${c? esc(c.ko) : esc(p.charKo||p.charId||'—')}</td><td>${al}</td><td>${statsBadge(statsPlayerScore(p))}</td></tr>`;
    }).join('');
  return `<div class="histboard"><div class="tblwrap"><table class="stattbl">
  <tr><th>플레이어</th><th>캐릭터</th><th>진영</th><th>평점</th></tr>${rows}</table></div>${statsPeerHTML(h)}</div>`;
}
/* 그 판의 동료 평가 결과. 이름은 그 판의 players 스냅샷에서 되찾는다 —
   playerOf() 로 찾으면 지금 좌석에 없는 사람이 전부 '?' 가 된다. */
function statsPeerHTML(h){
  const top=(a)=>Array.isArray(a)? a : [];
  const mvpTop=top(h.mvpTop), bustTop=top(h.bustTop);
  if(!mvpTop.length && !bustTop.length) return '';
  const nm=pid=>{ const r=h.players.find(x=>x&&x.pid===pid); return esc((r&&r.name)||'?'); };
  const cnt=(tal,pid)=>(tal&&typeof tal==='object')? (tal[pid]|0) : 0;
  const line=(label,list,tal,vn)=>`<div><b>${label}</b> ${list.length
      ? list.map(pid=>`${nm(pid)} <span class="hint">${cnt(tal,pid)}표</span>`).join(' · ')
      : '<span class="hint">표 없음</span>'}<span class="hint"> (투표자 ${vn|0}명)</span></div>`;
  const pv=h.peerVoters||{};
  return `<div class="alertbox" style="text-align:left;margin-top:8px">🗳 <b>동료 평가</b>
    ${line('🏆 최고', mvpTop, h.mvpVotes, pv.mvp)}
    ${line('😵 찐빠', bustTop, h.bustVotes, pv.bust)}</div>`;
}
function statsHistoryHTML(){
  const entries=statsHistEntries();
  if(!entries.length)
    return `<div class="card"><h2>④ 판 기록</h2><p class="hint">아직 저장된 판이 없습니다.</p></div>`;
  const items=entries.map((h,i)=>({h,i})).reverse().map(({h,i})=>{
    const open=statsOpenHist.has(i);
    const sm=(typeof SCRIPTS_META!=='undefined')? SCRIPTS_META.find(s=>s.id===h.edition) : null;
    const title=h.label? esc(String(h.label)) : `${sm? esc(sm.ko) : '커스텀'} · ${h.players.length}인`;
    const wpill=h.winner==='good'? '<span class="pill goodw">선 승리</span>'
      : h.winner==='evil'? '<span class="pill evilw">악 승리</span>' : '<span class="pill neutral">결과 미기록</span>';
    return `<div class="histrow ${open?'open':''}" data-histtoggle="${i}" role="button" tabindex="0" aria-expanded="${open}">
      <span class="num hint">#${i+1}</span>
      <div class="histmain"><b>${title}</b><span class="hint">${statsWhen(h.at)}</span></div>
      ${wpill}<span class="chev">${open?'▾':'▸'}</span>
    </div>${open? statsHistBoard(h) : ''}`;
  }).join('');
  return `<div class="card"><h2>④ 판 기록</h2>${items}</div>`;
}
function renderStats(){
  const el=$('#pane-stats'); if(!el) return;
  /* '플레이어 추가'는 통계 탭 최상단(요구 1). 등록부가 사람 단위 통계의 뿌리이므로
     집계 카드보다 앞에 둔다. 설정 탭에는 편집 폼을 두지 않는다(폼 id 중복 방지).
     renderRosterAdmin 은 앞 스크립트 블록 소속이라 typeof 로 로드 실패를 흡수한다. */
  const admin=(typeof renderRosterAdmin==='function')? renderRosterAdmin() : '';
  /* 전광판 두 개를 나란히: ② MMR(평균 평점) → ②-b 최다 최고·최다 찐빠 → ③ 판 기록.
     statsAwardBoard 는 뒤 블록에서 정의되므로 typeof 가드로 감싼다(없으면 조용히 빠진다). */
  const award=(typeof statsAwardBoard==='function')? statsAwardBoard() : '';
  el.innerHTML=`${admin}${statsCurrentHTML()}${statsBoardHTML()}${award}${statsHistoryHTML()}`;
}
/* 판 기록 펼침/접힘 — 사용자 문자열을 onclick 에 보간하지 않도록 data-* 위임 */
document.addEventListener('click', e=>{
  const t=e.target.closest && e.target.closest('[data-histtoggle]');
  if(!t) return;
  const i=Number(t.getAttribute('data-histtoggle'));
  if(!Number.isInteger(i)) return;
  if(statsOpenHist.has(i)) statsOpenHist.delete(i); else statsOpenHist.add(i);
  renderStats();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t=e.target.closest && e.target.closest('[data-histtoggle]');
  if(t){ e.preventDefault(); t.click(); }
});
</script>

 '임프와 독살범이 나란히 앉은 게임에서 요리사에게 1을 알려줬다. 낮에 공개되자 마을은 인접 쌍 후보를 좁혀 갔고, 악 팀은 "첩자가 떨어져 앉은 것"이라는 역논리로 버텼다.']},
empath:{howto:[
 '죽은 이웃 건너뛰기 계산 실수가 가장 흔한 사고 — 매 밤 좌석표를 손가락으로 직접 짚으며 확인.',
 '초공감자 옆에 악이 앉은 판은 초공감자를 빨리 죽이거나 중독시킬 유인이 크다 — 독살범의 표적 선택을 지켜볼 것.'],
examples:[
 '3일차 밤, 초공감자의 왼쪽 이웃이 처형되어 그 너머의 독살범이 새 이웃이 됐다. 숫자가 0에서 1로 바뀌었고, 공개되자 마을은 처형자 너머 두 자리를 집중 추궁했다.']},
fortuneteller:{howto:[
 '붉은 청어는 셋업에서 반드시 지정 — 점쟁이 본인 지정도 가능하며, 이 경우 장기적으로 큰 혼선을 준다.',
 '"예"가 나온 쌍을 쪼개 재확인하는 플레이(A+B → A+C)에 대비해 이전 판정을 전부 메모해 둘 것.'],
examples:[
 '붉은 청어가 시장인 게임. 점쟁이가 시장+무고한 주민 쌍에서 "예"를 받자 시장이 위기에 몰렸다. 사흘 뒤 시장을 뺀 쌍들이 전부 "아니오"가 나오며 마을은 시장을 처형했고, 선 팀은 3인 승리 조건을 스스로 잃었다.']},
undertaker:{howto:[
 '밤 시작 전에 오늘 처형 유무부터 확인 — 처형이 없던 밤에는 깨우지 않는다.',
 '첩자·은둔자·주정뱅이 처형 시 무엇을 보여줄지는 처형 확정 직후 미리 정해 두면 밤 진행이 매끄럽다.'],
examples:[
 '낮에 은둔자가 처형됐다. 그 밤 장의사에게 "임프" 토큰을 보여주는 재량을 택했다(실제 악마 사망이 아니므로 게임은 계속). 다음 날 마을은 "악마가 죽었는데 왜 밤 사망이?"라며 대혼란 — 은둔자 등록 재량의 대표적 활용.']},
monk:{howto:[
 '보호 판정은 임프 지목 순간에 — 이 도구의 살해 판정 버튼이 보호를 자동 체크한다.',
 '공격이 막힌 아침의 "사망 없음"은 수도사·군인·시장 모두의 가능성을 남긴다 — 어느 쪽으로도 티 내지 말 것.'],
examples:[
 '수도사가 점쟁이를 보호한 밤 임프가 점쟁이를 지목했다. 사망 없는 아침에 임프는 "군인을 쳤다"고 오판하고 다음 밤 다시 점쟁이를 노렸지만, 수도사는 이번엔 다른 사람을 보호했고 점쟁이가 죽었다.']},
ravenkeeper:{howto:[
 '임프 살해 판정 직후 "죽은 사람이 까마귀지기인가?"를 반드시 확인 — 가장 잊기 쉬운 발동이다.',
 '죽는 순간 중독이었다면 거짓 캐릭터를 보여줄 수 있다 — 악마에게 유리한 거짓을 고를 기회.'],
examples:[
 '임프가 까마귀지기를 죽인 밤, 깨어난 까마귀지기가 첩자를 지목했다. 재량으로 "세탁부" 토큰을 보여줬고, 다음 날 죽은 자의 유언 정보로 첩자는 완전한 신뢰를 얻었다.']},
virgin:{howto:[
 '최초 지명 순간에만 발동 — 지명 접수 전 성결자 여부를 스치듯 확인(투표 패널이 자동 경고).',
 '발동하면 그날 처형은 그것으로 소모 — 이어지는 지명·투표는 진행하지 않는다.'],
examples:[
 '2일차 낮, 세탁부가 성결자를 지명했다. 즉시 세탁부가 처형됐고 마을은 성결자를 강하게 신뢰하게 됐지만, 그날 처형이 소모되어 임프는 하루를 벌었다.']},
slayer:{howto:[
 '공개 지목은 낮 어느 시점이든 가능 — 접수 즉시 판정하고, 성공·실패와 무관하게 소진 처리.',
 '가짜 처단자 주장(악 팀 블러프)에도 똑같은 톤으로 "아무 일도 일어나지 않습니다"라고 답할 것.'],
examples:[
 '4일차 낮, 처단자가 조용하던 플레이어를 공개 지목했다. 실제 임프였고 즉시 사망 — 하지만 생존 6인이라 탕녀가 계승했다. 마을이 승리를 확신하는 사이 게임은 계속됐다.']},
soldier:{howto:[
 '임프가 군인을 지목하면 조용히 사망 없음 처리 — 임프에게 어떤 힌트도 주지 않는다.',
 '사망 없는 아침의 원인(군인/수도사/시장 재량)은 사회자만 안다 — 표정을 한결같이.'],
examples:[
 '임프가 이틀 연속 같은 군인을 지목해 이틀 연속 사망 없는 아침이 밝았다. 마을은 수도사의 활약이라 착각했고, 독살범이 사흘째 밤 군인을 중독시키자 그제야 군인이 죽었다.']},
mayor:{howto:[
 '총알받이 재량(대신 죽을 사람)은 균형 도구 — 선이 유리하면 시장을 그대로 보내고, 악이 몰리면 정보가 소진된 주민을 대신 보낼 수도 있다.',
 '생존 3인이 되면 낮 시작부터 시장 승리 조건을 염두에 — 처형 없이 낮이 끝나는 순간 즉시 선 승리 선언.'],
examples:[
 '생존 3인(시장·임프·독살범). 독살범이 밤에 시장을 중독시켰고 낮에 마을은 처형을 포기했다. 시장이 중독 상태라 승리 조건이 불발 — 게임은 하루 더 이어져 결국 악이 이겼다.']},
butler:{howto:[
 '투표 순간마다 "주인이 손을 들었는가"를 먼저 확인 — 이 도구의 투표 패널이 자동 체크한다.',
 '죽은 집사는 유령 투표 토큰을 자유롭게 쓸 수 있다 — 제한은 살아있는 동안만.'],
examples:[
 '결정적 처형 표결에서 주인이 손을 내리자 집사도 들 수 없었고, 1표 차로 처형이 무산됐다. 악 팀은 집사의 주인이 누구인지 역추리해 다음 낮 그를 회유 대상으로 삼았다.']},
drunk:{howto:[
 '매 밤 위장 캐릭터의 순서에 깨워 정보를 주되, 반드시 거짓일 필요는 없다 — 대개 거짓이 유효하지만 정체 보호를 위해 참을 섞어도 된다. 무엇을 말했는지 반드시 메모.',
 '거짓을 줄 때는 "완전히 틀린 것"보다 "한 끗 어긋난 것"이 오래 간다 — 실제 판과 적당히 겹치게 설계.'],
examples:[
 '초공감자로 위장한 주정뱅이에게 매일 밤 0을 줬다. 실제 이웃 중 한 명이 임프였기에, 마을은 그의 "깨끗한 이웃" 발언을 믿고 임프를 오래 방치했다.']},
recluse:{howto:[
 '정보 판정마다 "이번엔 악으로 등록할까?"를 의식적으로 결정 — 게임당 1~2회의 결정적 순간에만 쓰는 것이 요령.',
 '처단자 지목·장의사 확인 같은 공개성 판정에서의 악 등록은 파급이 크다 — 쓰기 전에 게임이 끝나 보이지 않는지 확인.'],
examples:[
 '처단자가 은둔자를 공개 지목한 순간, 악마로 등록해 죽는 재량을 택했다. 마을은 "악마를 잡았다"고 확신했지만 밤 사망이 이어졌고, 처단자 능력은 이미 소진 — 악 팀에게 이틀의 여유가 생겼다.']},
saint:{howto:[
 '성자 지명이 접수되면 표결 전에 중독 여부를 확인해 둔다(투표 패널 자동 경고).',
 '정상 성자의 처형이 확정되는 순간 즉시 게임 종료 선언 — 표 계산을 두 번 확인할 것.'],
examples:[
 '독살범이 밤에 성자를 중독시키고 악 팀이 낮에 성자를 몰아 처형시켰다. 중독 상태라 선 패배는 발동하지 않았지만, 마을은 "성자가 처형됐는데 게임이 계속되니 저 사람은 성자가 아니었다"는 잘못된 추리에 빠졌다.']},
poisoner:{howto:[
 '독살범이 밤 순서 맨 앞인 이유를 활용 — 오늘 밤 깨어날 정보 캐릭터를 중독시키면 그 정보를 거짓으로 줄 수 있다.',
 '낮 능력(성자·성결자·처단자)도 중독된 낮 동안 오작동 — 낮 판정 전에 중독 토큰을 확인하는 습관을.'],
examples:[
 '독살범이 성결자를 중독시킨 낮, 주민이 성결자를 지명했지만 발동하지 않았다(능력은 소진). 마을은 "성결자가 가짜"라고 판단해 다음 날 진짜 성결자를 처형했다.']},
spy:{howto:[
 '그리모어를 보여줄 땐 충분한 시간을 — 첩자의 정보력이 악 팀 전략의 중심이 된다.',
 '등록 재량(선/주민/외지인)은 판정마다 개별 결정하되, 한 게임 안에서 방침의 일관성을 유지.'],
examples:[
 '첩자가 성결자를 지명하는 순간 "주민 등록" 재량으로 성결자 능력을 발동시켰다. 첩자는 처형됐지만 마을은 그를 확실한 주민으로 믿고 묻었고, 성결자 능력은 소진됐다.']},
scarletwoman:{howto:[
 '악마가 처형·사망 위기에 몰릴 때마다 생존자 수(5인 이상?)와 탕녀의 중독 여부를 함께 확인.',
 '계승이 일어나면 태연하게 밤으로 — 그 밤 탕녀를 깨워 임프 토큰을 보여주고 이후 임프로 활동시킨다.'],
examples:[
 '생존 6인에서 임프가 처형됐다. 게임 종료를 선언하지 않고 밤으로 진행해 탕녀를 깨워 임프 토큰을 보여줬다. 새 임프가 그 밤 처단자를 죽이며 마을의 승리 확신을 무너뜨렸다.']},
baron:{howto:[
 '밤에 깨우지 않는다 — 일은 셋업(주민 −2, 외지인 +2)에서 끝난다.',
 '사서의 외지인 정보와 구성 논쟁이 남작 존재의 단서 — 낮 논쟁이 스스로 굴러가게 두는 것이 좋다.'],
examples:[
 '남작 게임에서 중독된 사서에게 "외지인 0"을 줬다. 마을은 남작 가능성을 배제했고, 외지인 2명(주정뱅이·성자)은 끝까지 서로를 주민이라 믿었다.']},
imp:{howto:[
 '살해 판정 순서(보호 → 군인 → 시장 재량 → 사망)를 이 도구의 판정 버튼으로 처리하면 자동 체크된다.',
 '자기 지목(별 넘기기)은 하수인에게 임프를 계승시키는 악 팀의 기술 — 계승자를 깨워 임프 토큰을 보여줄 것.'],
examples:[
 '수사관에게 정체가 반쯤 드러난 임프가 밤에 자신을 지목했다. 탕녀에게 별을 넘기고 아침에 임프의 사망을 공표 — 마을은 "밤에 죽었으니 악마가 아니었다"고 판단해 수사관 정보를 폐기했다.']},
/* ── 피로 물든 달(BMR) ── */
grandmother:{howto:[
 '악마가 손주를 죽인 밤엔 할머니도 같은 밤에 함께 사망 처리 — 아침에 두 사망을 같이 공표.',
 '할머니가 중독인 밤의 손주 사망은 연동 없음 — 판정 전에 상태부터 확인.'],
examples:[
 '푸카가 손주를 중독시켜 다음 밤 손주가 죽자 할머니도 함께 죽었다. 한 밤 2명 사망 공표에 마을은 샤발로스나 포를 의심하며 악마 종류 추리에 혼선을 겪었다.']},
sailor:{howto:[
 '"누가 취할지"는 사회자 선택 — 선원이 계속 멀쩡하면 사실상 불사신이 되므로, 균형을 보며 선원 쪽을 취하게 할 타이밍을 잰다.',
 '멀쩡한 선원은 처형조차 무효 — 처형 확정 전 취함 여부를 확인.'],
examples:[
 '마을이 선원을 처형했지만 그날 선원은 멀쩡한 상태라 죽지 않았다. "처형이 안 통한다"는 사실로 선원의 정체는 공증됐지만, 그날의 처형은 소모됐고 악마는 하루를 벌었다.']},
chambermaid:{howto:[
 '"자기 능력 때문에 깨어남"만 계산 — 악마의 살해 지목, 정보 수령 기상 모두 포함. 애매한 사례는 첫 판정 때 기준을 정해 게임 내내 유지.',
 '지목은 자신 외 생존자 2명 — 사망자 지목은 정중히 다시 받는다.'],
examples:[
 '객실 청소부가 조용한 두 명을 찍어 "1"을 받았다. 한 명은 매일 깨는 독살범류 하수인이었고, 이후 청소부는 밤 순서 추리로 그 후보를 좁혀 갔다.']},
exorcist:{howto:[
 '지목이 악마와 일치하면 악마를 깨워 구마사제를 가리켜 보여주고, 그 밤 악마의 살해 단계를 통째로 건너뛴다.',
 '이 과정에서 악마는 구마사제가 누군지 알게 된다 — 다음 밤 최우선 표적이 될 수 있음을 염두에.'],
examples:[
 '구마사제가 좀버얼을 정확히 지목했다. 그 밤 좀버얼은 활동하지 못해 사망 없는 아침이 밝았고, 다음 밤 좀버얼은 즉시 구마사제를 죽였다 — 마을은 "누군가 악마를 하루 봉인했었다"는 단서를 얻었다.']},
innkeeper:{howto:[
 '보호 2명 중 1명 취함 — 누구를 취하게 할지는 균형 재량(정보 캐릭터를 취하게 하면 다음 정보가 흔들린다).',
 '암살자의 살해는 이 보호를 관통한다 — 판정 순서에 주의.'],
examples:[
 '여관 주인이 도박사와 험담꾼을 보호하고 도박사를 취하게 했다. 그 밤 취한 도박사는 추측이 틀렸는데도 죽지 않았고(능력 오작동), 다음 날 "틀렸는데 살아있다"는 사실에서 여관 주인의 보호를 역추리했다.']},
gambler:{howto:[
 '추측 접수 → 정답 판정 → 오답이면 그 자리에서 밤 사망 처리(아침 공표).',
 '미치광이를 "악마"로 추측하는 등 등록이 애매한 판정은 방침을 미리 정해 일관되게.'],
examples:[
 '사흘 연속 정답으로 신뢰를 쌓은 도박사가 4일째 밤 미치광이를 "악마"로 추측했다. 미치광이는 악마가 아니므로 오답 — 도박사는 죽었지만, 마을은 "그가 찍은 사람이 진짜 악마는 아니다"라는 유언 정보를 얻었다.']},
gossip:{howto:[
 '낮의 공개 험담을 접수하면 진위를 그 자리에서 판정해 메모(판정 결과는 비공개).',
 '참이면 그 밤 1명 사망 — 대상은 사회자 선택이므로 균형을 보고 고른다. 험담꾼이 중독이면 참이어도 사망 없음.'],
examples:[
 '험담꾼이 낮에 "이 게임에 미치광이가 있다"고 험담했다. 사실이었고, 그 밤 재량으로 미치광이를 죽였다 — 아침 사망 공표에 진짜 악마는 자신의 방패막이를 잃었다.']},
courtier:{howto:[
 '발동은 캐릭터 이름 지목 — 그 캐릭터가 게임에 없으면 아무 일 없이 소진된다.',
 '취함 3일(밤 3+낮 3) 카운트를 그리모어 메모로 관리하고 만료 시점에 해제.'],
examples:[
 '궁정대신이 2일차 밤 "포"를 지목했다. 포가 사흘간 취해 살해가 불발됐고, 사망 없는 아침이 이어지자 악 팀은 궁정대신의 발동을 눈치채고 낮에 그를 몰아 처형했다.']},
professor:{howto:[
 '발동 밤에 죽은 플레이어 1명 지목 — 주민이면 되살리고 아침에 소생을 공표한다.',
 '소생자는 능력도 돌아온다(1회성 능력은 이미 썼다면 소진 유지) — 상태 토큰을 재정비할 것.'],
examples:[
 '교수가 처형당했던 찻집 여인을 되살렸다. 아침 소생 공표에 마을이 술렁였고, 되살아난 찻집 여인의 양옆 보호가 다시 켜지며 악마의 살해 계획이 꼬였다.']},
minstrel:{howto:[
 '하수인이 "처형으로" 죽는 순간 발동 — 다음 황혼까지 음유시인을 제외한 전원에게 취함 토큰.',
 '발동 중의 밤 정보는 전부 거짓 가능, 악마의 살해도 불발 — 그 하루는 사실상 정보 암전임을 의식하고 운영.'],
examples:[
 '암살자가 처형된 날 마을 전체가 취했다. 그 밤 모든 정보를 그럴듯한 거짓으로 주고 악마의 살해도 불발 처리 — 다음 날 마을은 "어젯밤 정보는 전부 의심하라"는 경고 속에 하루를 다시 시작했다.']},
tealady:{howto:[
 '살아있는 양옆 이웃이 모두 선일 때만 보호 — 좌석·사망이 바뀔 때마다 재계산.',
 '보호는 처형까지 막는다 — 처형 불발이 공개되면 찻집 여인의 위치 구도가 노출됨을 염두에.'],
examples:[
 '마을이 찻집 여인의 이웃(선)을 처형했지만 죽지 않았다. "안 죽는 사람 곁에 찻집 여인이 있다"는 공개 정보가 되어, 역설적으로 악 팀이 그녀의 좌석을 특정하는 단서가 됐다.']},
pacifist:{howto:[
 '선한 플레이어의 처형이 확정될 때마다 "살릴 것인가"를 재량 판정 — 남발하면 처형 제도가 무너지므로 결정적 1~2회에.',
 '살린 경우에도 그날 처형은 소모된 것으로 처리한다.'],
examples:[
 '마을이 할머니를 오판 처형하려던 날 평화주의자 재량으로 살렸다. 처형 불발은 "할머니는 선하다"는 강한 신호가 됐고, 악 팀은 그날 밤 즉시 할머니를 노렸다.']},
fool:{howto:[
 '첫 사망 순간(처형·밤 살해 불문) 1회 무효 — 발동 즉시 ✔소진 표시, 이후엔 평범하게 죽는다.',
 '발동 순간 취함/중독이면 그냥 죽는다 — 판정 전 상태 확인.'],
examples:[
 '어릿광대가 처형됐지만 죽지 않았다(1회 발동). 마을은 그를 어릿광대로 확신했지만, 그날 밤 포가 그를 지목하자 이번엔 그대로 죽었다.']},
goon:{howto:[
 '밤마다 "건달을 가장 먼저 지목한 능력"만 발동 — 지목자는 취하고(그 밤+다음 낮) 건달은 그 지목자의 진영이 된다.',
 '건달의 현재 진영을 그리모어에 상시 표시 — 진영 관련 판정에 즉시 반영.'],
examples:[
 '여관 주인이 보호 대상 중 하나로 건달을 지목했다. 최초 지목자였던 여관 주인은 취해 그 밤 보호가 전부 무효가 됐고, 악마의 살해가 그대로 통과해 마을은 애꿎은 여관 주인을 의심했다.']},
lunatic:{howto:[
 '첫날 밤 진짜 악마보다 먼저 깨워 가짜 하수인·블러프 정보를 주고, 진짜 악마에게는 미치광이가 누군지 보여준다.',
 '매 밤 살해 지목을 받되 효과는 없음 — 그 지목을 진짜 악마에게 손짓으로 전달해 기만을 완성시키는 재량도 가능.'],
examples:[
 '미치광이가 매 밤 지목한 대상을 진짜 좀버얼이 그대로 죽여줬다. 미치광이는 자신이 악마라 확신한 채 낮에도 악마답게 행동했고, 마을이 그를 처형했을 때 진짜 악마는 안전하게 숨어 있었다.']},
tinker:{howto:[
 '밤이든 낮이든 재량으로 죽일 수 있다 — 살해가 불발된 밤의 사망 보정이나 서사적 타이밍에 활용.',
 '죽이는 순간의 명분(균형·재미)을 스스로 설명할 수 있을 때만 발동할 것.'],
examples:[
 '사망 없는 밤이 이어지며 마을이 패턴 추리를 시작하자 땜장이를 재량으로 죽여 밤 사망의 규칙성을 흐렸다 — 마을은 악마의 살해와 구분하지 못했다.']},
moonchild:{howto:[
 '사망을 "알게 된" 즉시 공개 지목을 받는다 — 낮 사망이면 그 자리에서, 밤 사망이면 새벽에 사망을 공표한 뒤. 앱이 그 시점에 자동으로 묻고, 그때의 대상 진영을 얼려 저장한다.',
 '판정은 다음 밤의 달의 자손 단계에서 저장된 값으로만 한다 — 지목 뒤 대상의 진영이 바뀌거나 대상이 죽어도 근거는 지목 시점 값이다.',
 '밤에 새로 볼 것은 달의 자손 본인의 중독·취함뿐이다(오작동이면 불발). 지목 시점 진영이 선이면 사망, 악이면 아무 일 없음(어느 쪽이었는지는 비공개).'],
examples:[
 '달의 자손이 처형 직후 자신을 몰아붙인 플레이어를 지목했다. 선한 플레이어라 그날 밤 죽었다 — 한 번의 처형이 선 두 명을 지운 셈이 되어 마을이 크게 위축됐다.']},
godfather:{howto:[
 '"낮에 외지인이 죽은 날"만 밤에 깨운다 — 처형 등 낮 사망 기준이며 밤 사망은 발동 없음.',
 '셋업의 외지인 ±1 조정을 잊지 말 것.'],
examples:[
 '낮에 미치광이가 처형되자 그 밤 대부가 깨어나 1명을 추가로 죽였다. 하룻밤 2명 사망에 마을은 악마의 종류를 오판하기 시작했다.']},
devilsadvocate:{howto:[
 '매일 밤 전날과 다른 생존자를 지목받아 처형 면역 토큰을 옮긴다.',
 '면역이 발동해도 처형 자체는 성립(그날 처형 소모) — "처형됐는데 살아있다"는 공개 사건이 된다.'],
examples:[
 '악마의 변호사가 악마에게 면역을 걸어 둔 날, 마을이 정확히 악마를 처형했지만 죽지 않았다. 마을은 선원이나 찻집 여인의 보호로 오판했고, 악마는 하루를 더 살았다.']},
assassin:{howto:[
 '발동 밤엔 모든 보호·면역을 관통해 무조건 사망 — 다른 판정 없이 죽인다.',
 '1회 소진 표시를 잊지 말 것.'],
examples:[
 '찻집 여인의 보호로 이틀을 버틴 주민을 암살자가 발동으로 관통해 죽였다. "절대 안 죽던 사람이 죽었다"는 사실에서 마을은 암살자의 존재를 역추리했다.']},
mastermind:{howto:[
 '악마가 처형으로 죽어도 게임 종료를 선언하지 않고 태연히 하루 더 진행 — 그 밤엔 아무도 죽지 않는다.',
 '다음 낮의 처형 결과로 즉시 판정: 선한 플레이어 처형 = 악 승리, 그 외 = 선 승리.'],
examples:[
 '악마가 처형됐는데 게임이 끝나지 않자 마을은 "진짜 악마가 따로 있다"고 판단해 다음 날 가장 의심스러운 주민을 처형했다. 선한 플레이어였고, 주모자의 조건이 완성되며 악이 이겼다.']},
zombuul:{howto:[
 '"오늘 아무도 죽지 않은 날"만 밤에 깨운다 — 낮 처형·밤 사망을 합쳐 하루 사망 유무를 체크.',
 '첫 사망은 죽은 척: 공개적으로는 사망 처리(유령 투표 토큰 지급)하되 그리모어엔 생존 표시, 밤에 계속 깨운다.'],
examples:[
 '좀버얼이 처형되어 "죽었다". 이후 처형 없는 날마다 밤 사망이 이어졌지만, 마을은 죽은 좀버얼을 용의선상에서 제외한 채 엉뚱한 생존자만 추궁했다.']},
pukka:{howto:[
 '2단계 추적: 오늘의 지목 → 중독 토큰, 어젯밤 중독자 → 오늘 밤 사망+독 해제.',
 '첫날 밤에도 깨워 지목을 받는다(사망은 둘째 밤부터 발생).'],
examples:[
 '푸카가 1일차 밤 객실 청소부를 중독시켰다. 청소부는 그 밤 거짓 정보를 받았고 2일차 밤에 죽었다 — 마을은 "죽기 전에 받은 정보"를 신뢰했다가 이중으로 당했다.']},
shabaloth:{howto:[
 '매 밤 2명 지목·각각 판정 — 전날 희생자 명단을 그리모어에 남겨 소생 재량에 대비.',
 '소생 재량은 균형 도구 — 정보가 소진된 플레이어를 살리면 악에 유리, 핵심 주민을 살리면 선에 숨통.'],
examples:[
 '샤발로스가 전날 죽인 할머니를 되살렸다. 마을은 이 소생을 교수의 발동으로 오판했고, "교수가 살아있다"는 잘못된 전제 위에 추리를 쌓았다.']},
po:{howto:[
 '매 밤 "0명 또는 1명" — 0명을 고른 밤엔 충전 표시를 남기고, 다음 밤 3명 지목을 받는다.',
 '3연속 사망 판정은 각각 보호·상태를 따로 체크.'],
examples:[
 '사망 없는 아침에 마을은 보호 성공이라 안심했다. 다음 밤 포가 3명을 쓸어 담으며 판이 뒤집혔다 — "조용한 밤 뒤의 폭풍"이 포의 시그니처다.']},
/* ── 화단에 꽃피운 이단(SV) ── */
clockmaker:{howto:[
 '첫날 밤 한 번뿐 — 셋업 직후 좌석표에서 악마↔최근접 하수인 거리를 미리 계산해 둔다.',
 '보르톡스 게임이면 반드시 틀린 수를 줄 것(거짓 의무).'],
examples:[
 '시계공이 "2"를 받았다. 낮 좌석 추리로 후보 쌍이 좁혀지자, 하수인이 먼저 "내가 시계공인데 3을 받았다"고 나서며 정보전을 흐렸다.']},
dreamer:{howto:[
 '제시할 [선, 악] 캐릭터 쌍을 미리 몇 개 준비해 두면 밤이 빨라진다 — 진짜 캐릭터 하나 + 그럴듯한 반대 진영 하나.',
 '같은 대상을 재지목받으면 다른 쌍을 줘도 되지만, 이전 제시와 모순되지 않게.'],
examples:[
 '꿈꾸는 자가 마귀할멈을 지목받아 [예언자, 마귀할멈]을 제시했다. 대상이 마침 예언자를 자칭하고 있었기에 마을은 반반 확률에 갇혔고, 이틀 뒤 진짜 예언자가 나서면서 마귀할멈이 몰렸다.']},
snakecharmer:{howto:[
 '스왑은 강제·즉시: 두 사람을 각각 깨워 새 캐릭터·진영을 안내하고, 전 악마(새 뱀 조련사)에게 ☠영구 중독 토큰.',
 '스왑 후 그리모어와 밤 순서를 새 악마 기준으로 전면 갱신.'],
examples:[
 '3일차 밤 뱀 조련사가 노 다시를 지목해 스왑됐다. 영구 중독된 새 뱀 조련사(전 악마)는 매일 지목을 이어갔지만 효과가 없었고, 낮에 진실을 말해도 아무도 믿지 않았다.']},
mathematician:{howto:[
 '하루 동안 "능력이 규칙대로 작동하지 않은" 플레이어를 그때그때 카운트 — 중독·취함으로 거짓 정보를 준 경우가 대표.',
 '집계 기준(등록 재량 포함 여부 등)을 첫날 정해 게임 내내 유지.'],
examples:[
 '중독된 꿈꾸는 자가 거짓 쌍을 받은 날, 수학자에게 "1"을 알려줬다. 수학자가 공개하자 마을은 "어젯밤 누군가의 정보 하나는 가짜"라며 전날 공개된 정보들을 재검증했다.']},
flowergirl:{howto:[
 '낮 표결에서 악마의 거수 여부를 기록(투표 패널이 자동 저장) — 표결이 없던 날은 "아니오"로.',
 '악마가 투표를 계속 피하면 그 자체가 낮의 행동 단서가 된다.'],
examples:[
 '이틀 연속 "아니오"를 받은 꽃팔이 소녀가 이를 공개하자, 마을은 투표에 소극적이던 두 명으로 용의자를 좁혔다. 셋째 날 악마가 어쩔 수 없이 거수했고 "예"로 바뀌며 포위망이 완성됐다.']},
towncrier:{howto:[
 '그날 지명자 명단에서 하수인 유무만 판정 — 지명 기록은 낮 패널이 자동 저장한다.',
 '하수인이 지명을 아예 안 하는 식으로 회피할 수 있다 — 낮 운영과 연결되는 정보임을 의식.'],
examples:[
 '포고꾼이 사흘 내리 "아니오"를 받았다. 마을은 "지명한 적 없는 사람들" 중에 하수인이 있다고 역추리해 조용한 플레이어들을 심문하기 시작했다.']},
oracle:{howto:[
 '죽은 자 중 악의 수만 세면 된다 — 사망자 명단을 패널에서 확인.',
 '"어제 처형한 사람이 악이었는가"에 대한 간접 답, 즉 처형 결과 검증기 역할을 한다.'],
examples:[
 '이틀 연속 처형에 성공했다고 믿던 밤, 예언자가 "0"을 받았다. 죽은 둘 다 선이었다는 뜻 — 다음 날 마을은 추리를 처음부터 다시 짰다.']},
savant:{howto:[
 '매일 낮 1회 응대 — [참, 거짓] 정보 짝을 아침마다 미리 준비해 두면 진행이 매끄럽다.',
 '참 정보는 게임을 바로 끝내지 않을 수준으로, 거짓 정보는 그럴듯하게 — 짝의 난이도를 맞출 것.'],
examples:[
 '백치천재에게 "이 게임에 외지인은 2명이다"(참)와 "하수인 둘이 이웃해 앉아 있다"(거짓)를 줬다. 마을은 이틀에 걸쳐 두 명제를 교차 검증하며 낮 토론의 축으로 삼았다.']},
seamstress:{howto:[
 '발동은 1회 — 지목한 2명이 "서로 같은 진영인지"만 예/아니오로 답하고 소진 표시.',
 '중독·취함이면 답은 임의(거짓 가능·참도 가능), 보르톡스 생존 시엔 반드시 거짓 — 답하기 전 상태 확인.'],
examples:[
 '재봉사가 서로 으르렁대던 두 명을 지목해 "예(같은 진영)"를 받았다. 둘 다 선이라는 뜻이었지만 마을 일부는 "둘 다 악"으로 해석했다 — 정보의 양면성이 낮을 뜨겁게 달궜다.']},
philosopher:{howto:[
 '발동 시 선한 캐릭터 하나를 골라 능력을 부여 — 이후 밤 순서에서 그 캐릭터의 위치에 깨울 것(수동 관리).',
 '고른 캐릭터가 게임에 실재하면 원 보유자는 영구 취함 — 🍺토큰과 함께 메모.'],
examples:[
 '철학자가 "예언자"를 골랐고, 진짜 예언자는 그날부터 취해 거짓 수를 받았다. 두 예언자의 숫자가 갈리자 마을은 철학자의 발동을 의심하며 진짜를 가려내는 데 하루를 통째로 썼다.']},
artist:{howto:[
 '낮에 은밀히 예/아니오 질문 1개를 접수 — 답은 예/아니오/고개젓기(판정 불가) 중 하나로 성실하게.',
 '게임을 즉시 흔들 질문("악마는 A인가?")에도 정직하게 답해야 한다 — 그래서 무서운 능력이다. 중독이면 거짓 가능.'],
examples:[
 '화가가 "생존자 중에 마귀할멈이 있습니까?"라고 물어 "예"를 받았다. 마을은 밤마다 캐릭터가 바뀔 수 있다는 공포 속에 매일의 처형 대상을 신중히 골랐다.']},
juggler:{howto:[
 '첫 낮의 공개 추측(최대 5개)을 반드시 기록 — 누구를 어떤 캐릭터로 지목했는지까지.',
 '둘째 밤에만 깨워 정답 수를 손가락으로 — 이후로는 깨우지 않는다.'],
examples:[
 '곡예사가 첫 낮에 5명을 추측하고 둘째 밤 "3"을 받았다. 다섯 추측 중 셋이 맞다는 조합 정보에 마을 전체가 경우의 수 퍼즐에 뛰어들었고, 악 팀은 자신이 포함된 추측을 필사적으로 부정했다.']},
sage:{howto:[
 '악마의 살해로 죽는 순간에만 발동 — 살해 판정 직후 깨워 2명(그중 1명이 악마)을 가리켜 준다.',
 '나머지 1명의 선택이 재량 포인트 — 이미 의심받는 선 플레이어를 섞으면 혼선이 커진다.'],
examples:[
 '팡 구가 현자를 죽였다. 현자에게 [팡 구, 무고한 주민]을 보여줬고, 다음 날 유언 공개로 마을은 둘 중 하나까지 좁혔다 — 악 팀은 남은 하루 동안 무고한 쪽을 몰아가는 데 사활을 걸었다.']},
mutant:{howto:[
 '"외지인임을 밝히려 드는" 발언·강한 암시가 나오면 재량으로 즉시 처형 가능 — 그날의 처형으로 계산.',
 '경고 없이 집행할 수도, 한 번 눈감을 수도 있다 — 방침을 정해 일관되게.'],
examples:[
 '변종이 "나 아무래도 외지인 같은데…"라고 흘리는 순간 즉시 처형을 선언했다. 그날의 처형이 소모되어 마을은 지명 기회를 잃었고, 이후 아무도 외지인을 자칭하지 않는 침묵의 낮이 이어졌다.']},
sweetheart:{howto:[
 '사망 즉시 1명을 골라 영구 취함(비공개) — 정보 캐릭터를 고르면 교란이 오래간다.',
 '누구를 취하게 했는지 그리모어에 기록.'],
examples:[
 '사랑꾼이 처형된 뒤 예언자를 몰래 취하게 했다. 예언자의 수가 그날부터 미묘하게 어긋나기 시작했고, 마을은 한참 뒤에야 사랑꾼의 사망 시점과 정보 오류의 상관을 눈치챘다.']},
barber:{howto:[
 '이발사가 죽은 밤 악마를 깨워 스왑 여부와 대상 2명을 받는다 — 스왑 시 두 사람을 각각 깨워 새 캐릭터를 안내.',
 '선택하는 악마 자신은 교환 대상이 될 수 있다 — 금지되는 것은 다른 악마 플레이어다. 스왑 후 그리모어·밤 순서 전면 갱신.'],
examples:[
 '이발사가 처형된 밤, 악마는 예언자와 곡예사의 캐릭터를 맞바꿨다. 다음 밤부터 서로의 능력으로 깨어나게 되자 두 사람의 과거 정보 공개가 모순처럼 보였고, 마을은 둘 다 의심했다.']},
klutz:{howto:[
 '사망 공표 직후 공개 지목을 진행시킬 것 — 잊기 쉬운 발동이다.',
 '지목이 악이면 즉시 선 패배 선언, 선이면 게임 계속(그 대상이 죽지는 않는다).'],
examples:[
 '얼뜨기가 밤에 죽은 아침, 사망 공표와 함께 지목을 받았다. 얼뜨기는 가장 의심하던 플레이어를 찍었는데 하수인이었다 — 그 자리에서 선 패배가 선언됐다.']},
eviltwin:{howto:[
 '첫날 밤 둘을 동시에 깨워 서로(캐릭터 토큰 포함)를 확인시킨다.',
 '종료 판정 이중 체크: 선 쌍둥이 처형 = 즉시 악 승리, 두 쌍둥이가 모두 생존 중엔 악마가 죽어도 선 승리 선언 금지.'],
examples:[
 '마을이 악마를 처형했는데 게임이 끝나지 않았다(쌍둥이 둘 다 생존). 마을은 규칙을 근거로 남은 쌍둥이 쌍을 특정했지만 어느 쪽이 악인지는 반반 — 잘못 찍으면 그대로 패배인 최후의 도박이 벌어졌다.']},
witch:{howto:[
 '저주받은 자가 "지명하는 순간" 즉시 사망 — 지명 자체는 유효하게 접수해 표결을 진행한다.',
 '생존 3인이 되면 능력 소멸 — 저주 토큰을 제거.'],
examples:[
 '저주받은 플레이어가 아침 일찍 지명에 나섰다가 그 자리에서 죽었다. 마을은 마녀의 존재를 확신했고, 그날부터 지명을 서로 미루는 눈치 싸움이 벌어졌다 — 지명 없는 날은 처형도 없다는 걸 악 팀은 노리고 있었다.']},
cerenovus:{howto:[
 '대상을 깨워 "내일 하루 ○○인 척하라"는 광기 내용을 명확히 전달.',
 '위반 판정은 재량 — 가벼운 일탈은 경고, 노골적 거부는 처형까지. 방침을 정해 일관되게.'],
examples:[
 '세레노버스가 예언자에게 "재봉사 광기"를 걸었다. 예언자는 하루 종일 재봉사인 척하느라 진짜 정보를 공개하지 못했고, 마을은 그 어색한 연기를 의심해 오히려 처형 후보로 올렸다.']},
pithag:{howto:[
 '게임에 없는 캐릭터 지정만 성립 — 성립 시 대상을 깨워 새 역할을 안내하고 그리모어·밤 순서 전면 갱신.',
 '새 악마를 만든 밤은 사망 전권이 사회자 재량 — 기존 악마의 살해까지 조정해 사망 수를 자연스럽게 관리.'],
examples:[
 '마귀할멈이 주민을 "노 다시"로 바꿨다. 그 밤 사망을 재량으로 1명만 처리해 이변을 감췄고, 마을은 이틀 뒤에야 새로 생긴 이웃 중독 패턴에서 악마의 증식을 의심했다.']},
fanggu:{howto:[
 '외지인 "최초" 지목 판정을 정확히 — 점프 시 대상이 새 팡 구(악 전향)가 되고 기존 팡 구는 그 밤 죽는다.',
 '점프한 아침의 공표는 "밤 사망 1명"뿐 — 마을에겐 평범한 밤으로 보이게.'],
examples:[
 '팡 구가 변종을 지목해 점프했다. 아침엔 전(前) 팡 구의 사망만 공표되어 마을은 그를 선한 희생자로 분류했고, 새 팡 구(전 변종)는 외지인 행세를 이어가며 완벽히 숨었다.']},
vigormortis:{howto:[
 '하수인 살해 시: 그 하수인의 능력은 죽은 뒤에도 계속 — 밤 순서에 계속 깨운다. 인접 주민 1명에게 ☠영구 중독.',
 '죽은 하수인·중독 이웃을 그리모어에 표시해 두지 않으면 반드시 잊는다.'],
examples:[
 '비고르모르티스가 자기 하수인인 마녀를 죽였다. 마을은 밤 사망자를 선한 희생자로 분류했지만 저주는 매일 밤 계속 갱신됐고, 죽은 마녀는 유령 투표까지 쓰며 낮 표결을 흔들었다.']},
nodashii:{howto:[
 '양옆의 "가장 가까운 주민"을 좌석표에서 확인해 상시 중독 — 외지인은 건너뛴다. 사망·좌석 변동 때마다 재계산.',
 '중독된 두 주민의 정보는 매일 거짓 가능 — 두 오염원을 일관되게 관리.'],
examples:[
 '노 다시 양옆의 예언자와 포고꾼이 매일 거짓 정보를 받았다. 두 사람의 정보가 서로 모순을 일으키자, 마을은 "정보가 꼬이는 중심점"의 좌석을 계산해 노 다시를 특정해 냈다.']},
vortox:{howto:[
 '게임 시작부터 원칙 고정: 주민에게 주는 모든 정보는 반드시 틀리게 — "거짓 가능"이 아니라 거짓 의무다.',
 '낮 종료 때마다 처형 유무 확인 — 처형 없는 낮 종료 = 즉시 악 승리 선언.'],
examples:[
 '보르톡스 게임 이틀째, 시계공의 수와 꿈꾸는 자의 쌍이 모두 어긋난다는 걸 눈치챈 마을이 "모든 정보가 거짓"이라는 가설에 도달했다. 이후 마을은 정보를 거꾸로 읽으며 매일 처형을 이어가 보르톡스를 몰아냈다.']},

  /* ── 실험·Loric 109종 사회자 팁·예시 (공식 roles.json·위키 근거, 자체 작성) ── */
  acrobat:{howto:['지목 즉시 판정하지 말고 그 밤이 끝날 때 확인하라. 능력은 대상이 오늘 밤 취함·중독 상태이거나 그렇게 되는 경우를 모두 잡으므로, 곡예사보다 뒤 순번인 독살범이 그 대상을 겨눠도 곡예사가 죽는다.','주정뱅이 캐릭터를 지목하면 언제나 곡예사가 죽는다. 마을이 이것을 주정뱅이 색출 도구로 쓰는 것도 정상 플레이이니 막지 말 것.','손풍금장이처럼 스스로 취하기를 고르는 캐릭터, 궁정대신에게 걸린 캐릭터도 전부 대상이 된다. 밤 순서표에서 취함·중독을 만드는 순번이 전부 끝난 뒤에 곡예사 표식을 정산하라.','곡예사 본인이 중독·취함이면 판정이 뒤집힐 수 있다. 실제로 취한 사람을 골랐어도 살려 두거나, 멀쩡한 사람을 골랐는데도 죽게 만들 수 있다.'],examples:['5일차 밤, 곡예사가 수상하게 보던 B를 지목했다. 그 시점의 B는 멀쩡했지만 뒤 순번의 궁정대신이 B의 캐릭터를 지목하면서 B가 취했고, 아침에 곡예사가 시체로 발견됐다. 곡예사가 낮에 미리 지목 계획을 말해 둔 덕분에 마을은 사망 원인을 역추적해 궁정대신의 존재를 짚어냈다.','곡예사가 마을의 신뢰를 받던 점쟁이를 지목한 밤에는 아무 일도 없었다. 다음 밤 같은 점쟁이를 다시 지목하자 곡예사가 죽었고, 마을은 그 사이에 점쟁이가 중독됐다고 결론 내렸다. 실제로 독살범이 하루 사이에 표적을 바꾼 것이었다.']},
  amnesiac:{howto:['셋업 때 기억상실자가 실제로 가진 능력을 사회자가 직접 정해 종이에 적어 둔다. 혼자 판을 끝낼 만큼 강하지 않게, 이 판에 부족한 정보를 메우는 방향으로 고르면 무난하다.','공식 밤 지시가 "기억상실자의 능력을 충족시키기 위해 필요한 일을 하라" 이다. 밤에 굴려야 하는 능력을 줬다면 매일 밤 빠뜨리지 말고 굴려라. 사회자가 잊으면 그 캐릭터는 게임에서 사실상 사라진다.','낮 추측의 정확도 피드백 기준(따뜻함·차가움, 손가락 0~5 등)을 첫날에 정하고 끝까지 같은 기준으로 답하라. 기준이 흔들리면 기억상실자는 아무것도 좁힐 수 없다.','중독·취함이면 정해 둔 능력이 작동하지 않고 정확도 피드백도 거짓으로 줄 수 있다. 다만 마을 전체가 기억상실자에게 의존하는 판에서 오래 끌면 진행이 멈추니 지속 기간을 짧게 잡아라.'],examples:['사회자는 기억상실자에게 "밤에 죽은 사람이 선하면 아침에 사회자가 엄지를 올린다" 는 능력을 정했다. 이틀 동안 기억상실자는 이유 모를 엄지 신호만 받다가 사흘째 낮에 밤 사망과 관련된 능력인지 추측했고, 사회자는 손가락 4개로 거의 맞았다고 답했다. 그날 마을 앞에서 능력을 공개한 기억상실자는 단숨에 정보의 축이 됐다.']},
  bountyhunter:{howto:['셋업에서 주민 1명을 악 성향으로 바꾼다. 그 주민은 캐릭터와 능력을 그대로 유지한 채 성향만 악이므로, 자기 능력으로 얻은 진짜 정보를 그대로 말하며 마을의 신뢰를 얻을 수 있다.','밤 지시가 "KNOW 표식이 붙은 사람이 오늘 낮이나 오늘 밤에 죽었으면 새 대상을 가리켜라" 이다. 낮 처형으로 죽었을 때 그날 밤 갱신하는 것을 가장 자주 빠뜨리니 처형 직후 표식부터 옮겨 두어라.','처음 알려주는 악을 그 악 성향 주민으로 잡으면 판이 크게 꼬인다. 사냥꾼이 무고해 보이는 정보원을 몰아붙이게 되고, 그 정보원의 정보는 실제로 진짜이기 때문이다.','중독·취함이면 선한 플레이어를 악이라고 알려준다. 그 거짓 대상이 죽어도 마찬가지로 새 대상을 알려주며 거짓을 이어갈 수 있다. 악 성향이 된 주민이 첫날 밤 악 팀 정보에 포함되는지는 공식 위키에서 세부 판정을 확인할 것.'],examples:['현상금 사냥꾼이 첫날 밤에 알게 된 악은 사실 악 성향이 된 사서였다. 낮에 사냥꾼이 사서를 지목하자 사서는 자기 정보를 그대로 공개했고 그것이 진짜였기에 오히려 마을이 사냥꾼을 의심했다. 결국 사서가 처형되자 그날 밤 사냥꾼은 진짜 독살범을 새로 알게 됐고, 뒤늦게 신뢰를 회복했다.']},
  cultleader:{howto:['매일 밤 살아 있는 양 이웃을 확인한다. 두 이웃의 성향이 다르면 어느 쪽으로 바꿀지는 전적으로 사회자 재량이니, 판이 한쪽으로 기울지 않는 방향으로 고르면 된다.','성향이 바뀌어도 캐릭터는 교주 그대로다. 악이 되어도 악마·하수인을 알지 못하고 밤에 함께 깨어나지도 않으며, 승리만 악 팀과 같이한다.','성향이 바뀐 밤에만 깨울지 매 밤 깨울지 첫날에 정하고 일관되게 하라. 바뀐 밤에만 깨우면 깨움 자체가 정보가 되어 교주가 이웃의 성향을 좁힐 수 있다.','중독·취함이면 실제 성향은 바뀌지 않는다. 거짓 성향을 알려주더라도 진짜 성향은 사회자 장부에만 적어 두고 승패는 장부 기준으로 판정하라.'],examples:['교주의 양 이웃이 선한 군인과 악한 첩자였다. 사회자는 선 팀이 앞선다고 보아 교주를 악으로 돌렸다. 다음 날 교주가 솔직하게 오늘은 자신이 악이라며 가입을 권했지만 마을은 이를 함정으로 읽고 교주를 처형했고, 남은 선한 플레이어들은 교단 승리 경로를 영영 잃었다.']},
  general:{howto:['엄지 위는 선, 아래는 악, 옆으로 눕히면 백중이다. 남은 인원 계산이 아니라 정보량·처형권·악의 노출 정도를 종합한 사회자 본인의 판단을 답하는 것이다.','매 밤 같은 기준으로 판단해야 정보가 쌓인다. 어제와 신호가 달라졌다면 그 사이에 무엇이 바뀌었는지 스스로 한 줄로 설명할 수 있어야 한다.','장군이 사흘 연속 악 신호를 공표하면 마을 전체의 추리가 한 번에 뒤집힌다. 어느 날 어떤 신호를 줬는지 반드시 기록해 두고 나중에 중독 여부를 다툴 때 근거로 삼아라.','중독·취함이면 반대 신호나 백중 신호를 준다. 장군은 매일 밤 깨어나므로 독살범의 1순위 표적이 되기 쉽다.'],examples:['6명이 남은 4일차 밤, 살아 있는 악은 임프 하나뿐이었지만 마을은 완전히 엉뚱한 두 사람을 몰아붙이고 있었다. 사회자는 엄지를 아래로 내렸다. 다음 날 장군의 공표에 마을은 추리를 처음부터 다시 짰고, 남은 이틀 안에 진짜 임프를 찾아냈다.']},
  magician:{howto:['첫날 밤 하수인 정보 때 마술사와 악마를 함께 가리키고, 악마 정보 때 마술사와 하수인들을 함께 가리킨다. 어느 쪽이 진짜인지는 절대 알려주지 않는다. 그 모호함이 능력의 전부다.','마술사는 실제로 등장한 캐릭터이므로 악마에게 주는 블러프 3개에 넣지 말 것. 대신 하수인 후보가 하나 늘어난 만큼 악 팀은 첫날부터 서로를 의심하게 된다.','마술사가 첫날 밤에 중독·취함이면 악 팀은 정확한 정보를 받는다. 독살범이나 궁정대신이 첫날 밤에 무엇을 했는지 확인한 뒤 가리킬 명단을 확정하라.','가리킬 사람이 많아 순서가 꼬이기 쉽다. 하수인 정보용 명단과 악마 정보용 명단을 셋업 때 종이에 미리 적어 두고 그대로 읽어라.'],examples:['악마는 첫날 밤 하수인 후보 두 명을 봤고 그중 진짜는 하나였다. 낮에 악마가 잘못된 쪽에게 은근한 신호를 보내다 선한 마술사에게 들켰고, 마술사가 자신을 자기편으로 착각하고 접근한 사람을 그대로 공개하면서 이틀 만에 악마가 처형됐다.']},
  preacher:{howto:['선택한 사람이 하수인일 때만 그 하수인을 깨워 "이 캐릭터가 당신을 선택했다" 표식과 설교자 토큰을 보여준다. 선한 사람을 골랐다면 아무도 깨우지 않는다. 이 차이가 곧 정보이므로 절차를 흘리지 말 것.','설교받은 하수인에게 능력 없음 표식을 붙인다. 표식이 세 개까지 준비되어 있으므로 여러 하수인을 순서대로 무력화할 수 있다.','설교자가 중독·취함인 밤에는 하수인을 골라도 능력이 사라지지 않는다. 그런데도 하수인 본인에게 설교받았다고 알려줄지는 사회자가 고를 수 있어, 악 팀에 심는 거짓 정보로 쓸 수 있다.','설교자가 죽거나 나중에 중독됐을 때 이미 설교받은 하수인이 능력을 되찾는지는 공식 위키에서 세부 판정을 확인할 것. 판의 결말이 갈리는 지점이다.'],examples:['설교자가 2일차 밤에 지목한 사람이 독살범이었다. 독살범은 자신이 설교받았음을 알고 그날부터 독을 놓지 못했고, 마을은 중독 정보가 갑자기 끊긴 것을 근거로 설교자의 주장을 믿기 시작했다. 악 팀은 설교자를 서둘러 처형하려다 오히려 자기들의 표를 노출했다.']},
  zealot:{howto:['생존자가 5명 이상인 동안에는 모든 지명에 반드시 손을 들어야 한다. 광신자 본인이 지명당했을 때도 자기 처형에 찬성표를 던진다.','생존자가 4명 이하로 줄어드는 순간 강제가 풀린다. 처형과 밤 사망 직후에는 생존자 수를 다시 세어 오늘 이 강제가 살아 있는지 먼저 확인하라.','중독·취함이면 강제가 풀려 원하는 대로 투표할 수 있다. 다만 광신자 본인은 자기가 취했음을 모르므로, 자유롭게 투표해도 된다고 알려줄지는 사회자가 정한다.','죽은 광신자가 남은 사망 투표 한 장을 반드시 써야 하는지는 공식 위키에서 세부 판정을 확인할 것.'],examples:['마을은 첫날부터 광신자를 추적했다. 세 번의 지명에 빠짐없이 손을 든 사람이 딱 하나 나오자 마을은 그를 광신자로 확정하고, 이후 그의 표를 계산에서 아예 빼고 정족수를 짰다. 광신자의 표로 무고한 정보원을 처형시키려던 악 팀의 계획은 그날로 무너졌다.']},
  plaguedoctor:{howto:['역병 의사가 죽으면 사회자가 하수인 능력 하나를 얻는다. 낮 처형으로 죽어도 발동하므로, 처형이 확정되는 즉시 사회자 능력 표식을 밤 순서표 맨 앞에 올려 두어라.','밤 지시가 "아직 처리하지 않았다면 지금 하라" 로 되어 있다. 죽은 다음 밤에 반드시 정산하고, 어떤 능력을 얻었는지 장부에 적어 두어라.','얻은 능력은 사회자가 직접 굴린다. 조건부로 발동하는 하수인 능력을 골랐다면 그 조건이 언제 성립하는지 미리 정리해 두지 않으면 굴릴 타이밍을 놓친다.','어떤 하수인 능력까지 고를 수 있는지와 사용 범위는 판을 크게 흔든다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['역병 의사가 2일차에 처형됐다. 사회자는 독살범 능력을 얻어 그날 밤부터 매일 한 명씩 중독시키기 시작했다. 마을은 진짜 독살범이 이미 죽었다고 믿고 있었기에 갑자기 쏟아지는 거짓 정보의 출처를 끝까지 찾지 못했고, 선 팀은 잘못된 추리 위에서 무너졌다.']},
  puzzlemaster:{howto:['셋업에서 취할 플레이어 1명을 사회자가 정해 취함 표식을 붙인다. 퍼즐 명인 본인을 고를 수도 있다.','이 취함은 퍼즐 명인이 죽어도 유지된다. 퍼즐 명인이 처형된 뒤에도 그 사람은 계속 잘못된 정보를 받으므로 표식을 절대 치우지 말 것.','추측은 게임당 1회뿐이다. 맞히면 진짜 악마 플레이어를, 틀리면 악마가 아닌 사람을 알려준다. 어느 쪽이든 답의 형식은 똑같아야 하며 즉시 사용 표식을 붙여라.','추측을 비공개로 받을지 공개로 받을지, 틀렸을 때 누구를 거짓 악마로 지목할지는 판을 좌우한다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['퍼즐 명인은 점쟁이의 정보가 계속 어긋나는 것을 보고 점쟁이를 취한 사람으로 지목했다. 정답이었고 사회자는 진짜 임프를 알려줬다. 다음 날 퍼즐 명인이 임프를 공개하자 악 팀은 외지인이 어떻게 악마를 아느냐며 반박했지만, 마을은 그 반박 자체가 퍼즐 명인의 존재를 인정하는 것임을 알아채고 처형을 밀어붙였다.']},
  wraith:{howto:['다른 악한 플레이어가 깨어나는 모든 순번에 망령도 함께 깨운다. 악마의 살해 지목과 하수인의 능력 사용 순간이 전부 포함되므로, 밤 순서표의 악 순번마다 망령을 표시해 두어라.','눈을 뜰지 말지는 매번 망령이 고른다. 눈을 감기로 했다면 그 순번에 무엇이 있었는지 나중에도 알 수 없다는 점을 본인에게 확인시켜라.','망령은 보기만 할 뿐 개입하지 않는다. 악마가 누구를 지목했는지 알게 되므로 악 팀 안에서 정보 우위가 생기고, 악마 사망 후 하수인이 승격하는 판에서 특히 강해진다.','망령이 중독·취함이면 능력이 작동하지 않는다. 아예 깨우지 않거나, 엉뚱한 순번에 깨워 잘못된 장면만 보게 만들 수 있다.'],examples:['임프가 밤에 망령의 이웃을 죽였다. 망령은 눈을 뜨고 임프의 지목을 지켜봤고, 다음 날 마을이 사망자 주변 좌석을 파고들 때 미리 준비한 알리바이로 임프를 감쌌다. 마을은 그 변호가 왜 그렇게 정확한지 끝내 설명하지 못했다.']},
  boomdandy:{howto:['처형이 확정되는 순간 발동한다. 살아 있는 플레이어 3명만 남고 나머지가 전부 죽는다.','남은 3명에게 10부터 1까지 소리 내어 센 뒤, 카운트가 끝나는 시점에 각자 한 명을 손으로 가리키게 한다. 가장 많이 지목된 사람이 죽는다. 카운트 도중 대화는 허용되므로 이 몇 초가 판의 결말이 되니, 시작 전에 절차를 또박또박 설명하라.','붐댄디가 중독·취함인 상태에서 처형되면 아무 일도 일어나지 않고 평범한 처형으로 끝난다. 처형 판정 전에 표식을 반드시 확인할 것.','3명을 누가 고르는지, 지목이 동수일 때 어떻게 처리하는지, 이후 게임이 어떻게 이어지는지는 공식 위키에서 세부 판정을 확인할 것.'],examples:['5일차, 마을은 마지막 하수인이라 확신하고 붐댄디를 처형했다. 순식간에 세 명만 남았고 10부터 1까지 세는 동안 세 사람은 필사적으로 서로를 설득했다. 카운트가 끝나자 두 명이 같은 사람을 가리켰고 그가 죽었는데, 하필 유일하게 살아 있던 선한 정보원이었다. 남은 임프는 다음 밤을 기다릴 것도 없이 승리했다.']},
  organgrinder:{howto:['투표는 전원 눈을 감고 진행한다. 사회자만 손을 세며 득표수는 공개하지 않고, 오늘 처형될 사람이 바뀌었는지 여부만 알려준다.','곧 죽을 사람 표식으로 현재 처형 선두를 관리하라. 표수를 공개하지 않으므로 사회자의 장부가 유일한 기록이며 집계를 틀리면 되돌릴 수 없다.','손풍금장이는 매일 밤 스스로 취할지 고른다. 취하기를 택하면 투표 비공개 능력도 함께 꺼져 그날 투표는 평소대로 눈을 뜨고 진행하게 된다.','곡예사가 손풍금장이를 지목한 밤에 손풍금장이가 취하기를 택했다면 곡예사가 죽는다. 스스로 취하기를 고르는 캐릭터는 몇 없으니 판정에서 놓치지 말 것.'],examples:['마을은 사흘 내내 누가 몇 표를 던졌는지 몰랐다. 4일차에 손풍금장이가 스스로 취하기를 택하자 그날 투표가 갑자기 공개로 진행됐고, 마을은 오늘만 눈을 뜨는 이유가 무엇이냐를 파고들어 손풍금장이를 찾아냈다.']},
  yaggababble:{howto:['첫날 밤 비밀 문구를 보여준다. 문구는 사회자가 정하되, 자연스럽게 끼워 넣기 어렵지만 불가능하지는 않은 길이로 잡아라. 너무 짧으면 우연히 나오고 너무 길면 아무도 못 쓴다.','그날 낮에 공개적으로 말한 횟수를 세어 두었다가 밤에 정산한다. 횟수만큼 사람이 죽을 수 있을 뿐 반드시 죽는 것은 아니며, 누가 죽는지는 사회자가 고른다.','말했는지의 판정 기준을 첫날에 정하라. 문구 전체를 또렷하게, 다른 사람이 들을 수 있게 말했을 때만 인정하는 식이다. 애매한 발화를 즉석에서 판정하면 분쟁이 난다.','야가배블은 밤에 따로 지목하지 않는다. 밤 사망자 수가 곧 낮의 발화 횟수 힌트가 되므로, 몇 명을 죽일지 조절해 정보를 흐릴 수 있다. 발화 집계의 정확한 기준은 공식 위키에서 확인할 것.'],examples:['야가배블의 문구는 솔직히 말해서 나는 이 마을이 좋다 였다. 첫날 두 번 끼워 넣는 데 성공했고 그 밤에 두 명이 죽었다. 사망자가 갑자기 둘이 되자 마을은 여럿을 죽이는 악마 유형으로 후보를 좁혔지만, 다음 날 야가배블이 아예 문구를 말하지 않아 사망자가 없자 추리가 다시 흐트러졌다.']},
  lordoftyphon:{howto:['셋업에서 악한 캐릭터 전원을 좌석상 연속한 한 줄로 앉히고 티폰의 군주를 그 한가운데에 둔다. 하수인이 1명 늘어나므로 좌석 배치를 먼저 확정한 뒤 캐릭터를 배분하라.','외지인 수는 임의로 조절할 수 있다. 하수인이 늘어난 만큼 주민을 어디서 깎을지 결정하는 손잡이가 외지인 수다.','첫날 밤에는 티폰의 군주의 양 이웃을 깨워 "당신은 이 캐릭터다" 표식과 하수인 토큰을 보여주고 엄지를 내린다. 이웃들은 그 순간 자신이 악한 하수인이 되었음을 알게 된다.','악의 줄은 셋업 시점의 좌석 기준이며, 이후 사람이 죽어도 다시 짜이지 않는다. 마을이 좌석만으로 악의 덩어리를 찾아낼 수 있다는 점을 감안해 시작 좌석을 정하라.'],examples:['10인 게임에서 사회자는 4번부터 8번까지를 악의 줄로 잡고 6번에 티폰의 군주를 앉혔다. 첫날 밤 5번과 7번이 자신이 하수인임을 통보받았다. 사흘째 마을이 5번과 7번을 연달아 처형하면서 인접한 두 악이라는 패턴을 발견했고, 그 사이에 앉은 6번을 곧바로 악마로 지목해 판을 끝냈다.']},
  riot:{howto:['매일 밤 폭동 날짜 표식을 다음 날로 옮긴다. 3일차 밤에는 하수인들을 깨워 "당신은 이 캐릭터다" 표식과 폭동 토큰을 보여줘 전원 폭동으로 만든다.','3일차 낮부터는 지명당한 사람이 즉시 죽고, 죽은 그 사람이 곧바로 살아 있는 사람 1명을 지명한다. 투표는 하지 않으며 이 연쇄는 선택이 아니라 강제다.','연쇄가 이어지는 동안 매 지명마다 생존자 수를 다시 세어라. 승리 조건이 성립하는 순간 즉시 멈추고 게임을 끝내야 하는데, 흐름이 매우 빨라 지나치기 쉽다.','누가 첫 지명을 하는지, 이미 지명한 사람이 다시 지명받을 수 있는지 등 3일차 절차의 세부는 공식 위키에서 세부 판정을 확인할 것.'],examples:['3일차 낮이 열리자마자 마을은 연쇄가 어디서 끊길지 계산하기 시작했다. 첫 지명자가 하수인 후보를 지목했고 그가 죽으면서 곧바로 다른 사람을 지목했다. 다섯 번의 연쇄 끝에 살아남은 사람 중에는 선한 쪽이 더 많았지만 폭동 본체가 그 안에 섞여 있었고, 그대로 악 팀이 승리했다.']},
  gnome:{howto:['노움이 합류하는 시점에 아미고 표식을 붙일 플레이어 1명을 정해 전원에게 공개한다. 그 사람은 노움과 같은 진영이며, 노움 본인일 수도 있다.','아미고를 지명하는 사람은 노움이 죽일 수 있다. 반드시 죽이는 것이 아니라 노움의 선택이며, 여러 명이 차례로 지명하면 그때마다 죽일 수 있다.','노움이 중독·취함이면 죽이지 못한다. 죽이지 않기로 고른 것과 겉으로 구분되지 않으므로 정보가 새지 않는다는 점이 이 캐릭터의 안전판이다.','죽음이 지명 직후 즉시 발생하는지, 그 뒤 그날의 지명 절차가 어떻게 이어지는지는 공식 위키에서 세부 판정을 확인할 것.'],examples:['노움의 아미고는 3번 자리 플레이어였고 그 사실을 모두가 알았다. 마을은 3번이 수상하다고 보면서도 이틀 동안 아무도 지명하지 못했다. 사흘째 참다 못한 한 명이 3번을 지명하자 노움이 곧바로 그를 죽였고, 마을은 노움이 악 진영이며 따라서 3번도 악이라는 결론에 도달했다.']},
  bigwig:{howto:['지명이 성립할 때마다 피지명자가 플레이어 1명을 고른다. 그 순간부터 투표가 시작될 때까지 발언권은 오직 그 한 사람에게만 있으며 피지명자 본인도 말할 수 없다.','고른 사람은 피지명자가 선하다는 광기 상태여야 한다. 그 시간 동안 피지명자를 변호하는 말만 해야 하며, 광기를 어기면 사회자가 죽일 수 있다.','광기 위반은 곧바로 죽이기보다 한 번 경고한 뒤 적용하는 편이 판이 부드럽다. 다만 경고 없이 죽일 수도 있다는 것을 게임 시작 전에 전원에게 공지하라.','우화 캐릭터인 만큼 세부 운영이 판마다 다르다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['한 플레이어가 지명당하자 자신을 가장 의심하던 사람을 변호인으로 골랐다. 그 사람은 광기 때문에 자기 논리를 스스로 뒤집어야 했고, 마지못해 늘어놓은 변호가 오히려 설득력을 얻어 처형이 부결됐다. 다음 지명부터 마을은 변호인 지목 자체를 전략으로 계산하기 시작했다.']},
  godofug:{howto:['우그 모자를 실물로 하나 준비해 게임 시작 시 누군가에게 씌운다. 모자를 쓴 사람은 한 번에 한 소리씩만 말할 수 있고 대신 투표가 2표로 계산된다.','한 번에 한 소리 규칙을 어기면 모자를 다른 사람에게 넘긴다. 넘길 사람을 누가 정하는지는 시작 전에 공지하고 끝까지 같게 적용하라.','2표는 살아 있는 동안에만 의미가 있다. 이 한 표가 처형을 가르는 경우가 자주 나오니 표를 셀 때 반드시 소리 내어 확인하라.','우화 캐릭터인 만큼 세부 운영이 판마다 다르다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['모자를 쓴 플레이어가 하필 핵심 정보를 가진 점쟁이였다. 한 소리씩 짜내며 설명하다 결국 규칙을 어겼고 모자가 옆 사람에게 넘어갔다. 그 순간 점쟁이는 자유롭게 말할 수 있게 됐지만 2표를 잃었고, 그날 처형이 한 표 차이로 부결되면서 악마가 하루를 더 벌었다.']},
  pope:{howto:['셋업에서 선한 캐릭터 하나를 골라 두 사람에게 똑같이 배분한다. 둘 다 진짜 그 캐릭터이며 각자 정상적으로 능력이 작동한다.','중복된 그 캐릭터를 악마의 블러프로도 줄 수 있다. 같은 캐릭터를 주장하는 사람이 셋까지 나올 수 있으며, 마을은 몇 명까지가 진짜인지 알 수 없다.','어느 캐릭터를 중복시킬지가 판의 난이도를 정한다. 정보형 주민을 중복시키면 마을이 서로의 정보를 대조하게 되어 재미있고, 보호형을 중복시키면 악마가 매우 답답해진다.','우화 캐릭터인 만큼 세부 운영이 판마다 다르다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['사회자는 점쟁이를 중복시키고 악마 블러프에도 점쟁이를 넣었다. 낮에 세 명이 동시에 점쟁이를 주장하자 마을은 최소 두 명은 거짓이라고 확신하고 둘을 연달아 처형했다. 처형된 둘은 모두 진짜 점쟁이였고 살아남은 하나가 악마였다.']},
  ventriloquist:{howto:['지명 절차를 진행하는 동안 지명자가 이 게임에서 아직 아무도 주장하지 않은 새 캐릭터인 척 광기를 부렸다면 광기 표식을 붙인다. 이미 나온 캐릭터를 다시 쓰면 인정하지 않는다.','표식이 붙은 사람은 그날 처형되어도 죽지 않을 수 있다. 반드시 살아나는 것이 아니라 사회자의 재량이다.','어떤 캐릭터가 이미 꺼낸 적 있는 것인지 판정하려면 낮마다 나온 캐릭터 주장 목록을 계속 적어 두어야 한다. 이 기록이 없으면 판정 자체가 불가능하다.','우화 캐릭터인 만큼 세부 운영이 판마다 다르다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['한 플레이어가 지명하면서 아직 아무도 말하지 않은 캐릭터인 척 연기했다. 그날 그가 역으로 지명당해 처형됐지만 죽지 않았고, 마을은 시장이나 군인 같은 생존 능력을 의심하며 완전히 잘못된 방향으로 추리를 틀었다.']},
  gunslinger:{howto:['그날 첫 투표의 집계가 끝난 직후에만 발동한다. 두 번째 지명 이후에는 쓸 수 없으므로, 첫 투표가 끝나면 총잡이에게 쓸지 확인한 뒤 다음 지명으로 넘어가라.','대상은 그 투표에서 실제로 손을 든 사람 중에서만 고른다. 처형이 가결됐든 부결됐든 상관없이 발동할 수 있다.','총잡이의 총격은 처형도 밤 공격도 아니다. 수도사의 보호나 군인의 악마 면역으로는 막히지 않는다.','매일 쓸 수 있어 여행자 중에서도 파괴력이 크다. 총잡이가 악이면 마을의 정보원이 하루에 하나씩 사라지니, 추방 투표가 언제 나오는지 지켜볼 것.'],examples:['총잡이는 첫 투표에서 손을 든 다섯 명 중 유독 열심히 몰아붙이던 한 명을 쐈다. 죽은 사람은 그날 아침 정보를 공개했던 초공감자였고, 마을은 곧바로 총잡이를 악으로 규정해 추방 투표를 열었다. 총잡이는 추방됐지만 그 한 발로 선 팀의 정보 축은 이미 사라진 뒤였다.']},
  thief:{howto:['매일 밤 자신을 제외한 1명을 고르고 음수 투표 표식을 붙인다. 다음 날 그 사람이 손을 들면 총 득표에서 1을 뺀다.','표식은 다음 날 황혼까지만 유효하다. 매일 밤 새로 지목하므로 전날 표식을 반드시 치우고 시작하라. 표식이 겹친 채로 집계하는 것이 가장 흔한 사고다.','처형 선두를 다시 계산할 때는 음수 표를 반영한 값으로 비교해야 한다. 득표가 음수가 될 수도 있다는 점을 염두에 둘 것.','도둑이 죽은 사람을 고르면 그 사람의 사망 투표 한 장이 음수가 된다. 마을이 사망 투표를 아껴 두는 후반에 특히 유효한 선택이다.'],examples:['마지막 3인 상황에서 도둑은 마을의 신뢰를 한 몸에 받던 플레이어를 지목했다. 다음 날 그가 악마 후보를 지명하고 스스로 손을 들었지만 그 표가 마이너스로 계산되면서 처형이 부결됐다. 마을은 표 계산이 왜 어긋났는지 그날 저녁이 되어서야 깨달았다.']},
  judge:{howto:['다른 사람이 지명했을 때만 쓸 수 있다. 판사 본인이 지명한 건에는 쓸 수 없으므로 지명자가 누구인지부터 확인하라.','표를 다 센 뒤에도 결과를 뒤집을 수 있다. 판사가 선언하면 그 지명은 표와 무관하게 가결 또는 부결로 확정된다.','게임당 1회뿐이다. 사용 즉시 능력 없음 표식을 붙여 두 번 쓰지 못하게 하라.','능력을 잃은 상태에서 선언하면 아무 일도 일어나지 않고 표대로 진행된다. 이때 판사 본인에게 실패를 알릴지 말지는 사회자가 정한다.'],examples:['4일차, 마을 대다수가 확신하던 악마 후보에 대한 지명이 한 표 모자라 부결될 참이었다. 판사가 능력을 선언해 처형을 강제로 통과시켰고 처형된 사람은 진짜 임프였다. 판사는 그 한 번으로 게임을 끝냈지만, 정보가 조금만 부족했다면 선한 시장을 죽일 뻔한 도박이기도 했다.']},
  barista:{howto:['매일 밤 대상 1명을 정하고 둘 중 어느 효과를 줄지 사회자가 고른다. 대상을 깨워 "이 캐릭터가 당신을 선택했다" 표식과 바리스타 토큰을 보여준 뒤 손가락 1개 또는 2개로 어느 쪽인지 알린다.','멀쩡해짐을 고르면 그 밤 동안 취함·중독이 풀리고 정보도 진짜가 된다. 주정뱅이가 대상이면 하룻밤만 자기 진짜 능력을 쓰는 셈이라 판이 크게 흔들린다.','두 번 작동을 고르면 능력을 두 번 굴린다. 점쟁이라면 쌍을 두 번 묻고 수도사라면 두 명을 보호하는 식인데, 능력 모양에 따라 두 번 굴리기가 애매한 경우가 있으니 대상 선정 전에 미리 그려 볼 것.','효과는 다음 황혼까지다. 밤에 굴리는 능력뿐 아니라 낮에 발동하는 능력에도 적용되므로 낮 동안 표식을 치우지 말 것.'],examples:['바리스타는 정보가 계속 어긋나던 초공감자를 골라 멀쩡해짐을 줬다. 그날 밤 초공감자는 처음으로 진짜 숫자를 받았고 그 숫자가 이전 사흘과 완전히 달랐다. 마을은 초공감자가 그동안 중독돼 있었다는 결론을 내리고, 초공감자를 겨눌 수 있던 좌석부터 다시 훑기 시작했다.']},
  bonecollector:{howto:['게임당 1회, 첫날 밤을 제외한 밤에 죽은 플레이어 1명을 고른다. 능력 있음 표식을 붙이고, 그 밤에 굴려야 하는 능력이라면 그 사람을 깨워라.','되찾은 능력은 다음 황혼까지 유효하다. 밤에 굴리는 능력이면 그 자리에서, 낮에 발동하는 능력이면 다음 날 낮에 작동한다.','죽은 사람이 밤에 깨어나는 것 자체가 강한 정보다. 사망자 중 누가 깨어났는지 살아 있는 사람들이 추리하지 못하도록 밤 진행 소리에 신경 쓸 것.','게임당 1회짜리 능력을 이미 쓴 사람을 골랐을 때 그 사용 기록이 초기화되는지는 공식 위키에서 세부 판정을 확인할 것.'],examples:['뼈 수집가는 사흘 전에 죽은 장의사를 골랐다. 그날 낮에도 처형이 있었으므로 장의사는 밤에 깨어나 처형자의 캐릭터가 스카를렛 우먼이었음을 확인했다. 다음 날 죽은 장의사의 폭로로 하수인 하나가 확정되면서, 마을은 그와 붙어 다니던 두 사람으로 악마 후보를 좁혔다.']},
  angel:{howto:['게임 시작 시 어떤 플레이어가 천사의 보호를 받는지 공개한다. 보통 이 게임이 처음이거나 거의 처음인 사람에게 보호 표식을 붙인다.','보호받는 사람이 죽었을 때 그 죽음에 가장 큰 책임이 있는 사람에게 나쁜 일이 일어날 수 있다. 반드시 일어나는 것이 아니라 사회자의 재량이다.','나쁜 일의 내용도 사회자가 정한다. 능력을 잃게 하거나 거짓 정보를 주는 것부터 죽이는 것까지 폭이 넓은데, 입문자를 몰아붙였다는 이유만으로 곧바로 죽이면 게임이 망가지니 가벼운 쪽부터 쓰라.','천사의 존재는 공개되어 있으므로 마을이 보호 대상을 처형 후보에서 무조건 빼는 흐름이 생기기 쉽다. 보호는 죽음을 막는 것이 아니라 이후에 대가를 물리는 것임을 분명히 설명하라.'],examples:['이번 판이 두 번째인 플레이어에게 천사 보호가 붙었다. 2일차에 한 경험자가 그를 강하게 몰아붙여 처형시켰는데, 처형된 사람은 선한 세탁부였다. 사회자는 그 경험자에게 이틀간 거짓 정보를 주는 것으로 대가를 물렸고, 잘못된 정보를 자신 있게 공개한 그는 스스로 신뢰를 잃었다.']},
  revolutionary:{howto:['게임 시작 시 인접한 두 자리를 골라 정렬 표식을 붙이고, 그 둘이 서로 같은 진영이라고 전원에게 공개한다. 둘 다 선일 수도 둘 다 악일 수도 있다.','게임당 1회, 그 둘 중 하나가 다른 캐릭터의 정보에 실제와 반대 진영으로 등록될 수 있다. 초공감자나 마을 바보가 그를 볼 때만 진영이 뒤집혀 보이게 만드는 식이다.','거짓 등록을 언제 쓸지 정하는 것은 사회자다. 마을이 이 두 자리에 전적으로 기대어 추리를 굳혔을 때 쓰면 효과가 가장 크고, 너무 늦게 쓰면 아무 의미가 없다.','쓰기 전까지 마을은 이 두 자리를 강력한 기준점으로 삼는다. 사용 여부를 게임 내내 티 내지 말고, 거짓 등록 표식은 사용 즉시 뒤집어 두 번 쓰지 않게 하라.'],examples:['혁명가로 3번과 4번이 같은 진영임이 공개됐다. 4일차에 마을 바보가 4번을 확인해 선하다는 답을 받았고, 마을은 공개된 정렬을 근거로 3번까지 통째로 신뢰했다. 사실 그 답이 혁명가의 거짓 등록이었고 3번과 4번은 나란히 앉은 악 두 명이었다.']},
  fibbin:{howto:['게임 시작 전에 공개 배치한다. 게임 내내 딱 한 번, 선한 플레이어 1명에게 거짓 정보를 줄 수 있는 권한을 사회자가 갖는다.','존재가 공개되어 있으므로 마을은 내 정보가 그 한 번일지 모른다는 의심을 항상 안고 간다. 실제로 쓰지 않고 끝내도 이 캐릭터는 제 역할을 한다.','선한 플레이어에게만 쓸 수 있다. 초보 사회자가 균형을 급하게 맞추려고 초반에 소모하기 쉬운데, 마을이 한 사람에게 완전히 기댈 때까지 아껴 두는 편이 낫다.','거짓 정보를 준 뒤에는 능력 없음 표식을 붙여 두 번 쓰지 않게 하라. 어느 정보가 거짓이었는지는 게임이 끝날 때까지 밝히지 않는다.'],examples:['핍빈이 놓인 판에서 점쟁이는 사흘 내리 정확한 정보를 냈고 마을은 그를 완전히 신뢰했다. 4일차 밤, 사회자는 그 한 번을 써서 진짜 임프가 포함된 쌍에 아니오를 줬다. 다음 날 마을은 그 쌍을 후보에서 통째로 지웠고, 임프는 편안하게 마지막 이틀을 보냈다.']},
  spiritofivory:{howto:['시작 시점의 악한 플레이어 수를 적어 두고, 그보다 1명을 초과해 악이 늘어나지 않도록 막는다. 한도에 도달하면 더 이상 악 없음 표식을 붙여라.','악을 늘리는 캐릭터가 여럿 있는 판에서 켜는 우화다. 성향 전환이 연달아 일어나 악이 계속 불어나면서 게임이 망가지는 것을 막아 준다.','이미 한도에 도달했다면 이후의 성향 전환은 그냥 일어나지 않는다. 대상 본인에게는 아무 일도 없었던 것처럼 처리해 정보가 새지 않게 하라.','여행자는 게임 도중 합류하므로 시작 인원 기준을 어디로 잡을지가 애매해진다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['교주와 다른 성향 전환 캐릭터가 함께 있는 판이었다. 3일차에 이미 악이 하나 늘어난 상태에서 교주의 양 이웃이 모두 악이 됐지만, 상아의 정령 때문에 교주는 선한 채로 남았다. 사회자는 교주를 깨우지도 않았고, 교주는 이유를 모른 채 자신이 여전히 선하다고만 알았다.']},
  knight:{howto:['첫날 밤 악마가 아닌 두 명을 가리킨다. 하수인을 포함해도 되며 오히려 그쪽이 판을 재미있게 만든다. 마을이 그 둘을 통째로 신뢰하게 되기 때문이다.','기사는 후보를 크게 좁히므로 인원이 적은 판에서 둘 다 무고한 주민으로 주면 마을이 너무 편해진다. 최소 하나는 하수인으로 잡는 것을 기본으로 고려하라.','중독·취함이면 둘 중 하나 또는 둘 다 악마로 잡아 줄 수 있다. 기사의 정보는 초반에 공개되는 경우가 많아 이 거짓이 판 전체를 끝까지 오염시킨다.','스카를렛 우먼처럼 악마가 다른 사람으로 옮겨 갈 수 있는 판에서는 기사의 정보가 나중에 결과적으로 틀리게 된다. 첫날 밤 시점 기준이라는 것을 사회자가 기억하고 판정하라.'],examples:['기사에게 무고한 요리사와 독살범을 가리켰다. 낮에 기사가 두 이름을 공개하자 독살범은 자동으로 결백 인증을 받았고, 이후 사흘 동안 논의를 주도하며 마을의 정보원을 하나씩 중독시켰다. 마을은 마지막 날에야 악마가 아니라고 했지 선하다고 한 적은 없다는 문구의 함정을 깨달았다.']},
  pixie:{howto:['첫날 밤 실제로 등장한 주민 캐릭터 토큰 하나를 보여준다. 픽시는 그날부터 자신이 그 캐릭터라고 주장하는 광기를 부려야 능력을 얻는다.','광기를 얼마나 강하게 요구할지는 사회자가 정하되, 첫날에 기준을 알려 주고 끝까지 같게 적용하라. 광기를 진심으로 유지하지 않으면 능력을 주지 않아도 된다.','그 주민이 죽는 순간 능력 있음 표식을 붙이고 픽시에게 능력을 넘긴다. 죽은 방식은 상관없다. 이 발동을 잊는 것이 가장 흔한 사고이므로 사망 처리 때마다 픽시 토큰을 확인하라.','픽시가 중독·취함이면 실제로 등장하지 않은 주민을 보여줄 수 있다. 이 경우 픽시는 존재하지 않는 캐릭터를 진심으로 주장하며 마을을 오래 헤매게 만든다.'],examples:['픽시는 첫날 밤 장의사 토큰을 봤고 이튿날부터 자신이 장의사라고 강하게 주장했다. 진짜 장의사가 나서서 반박하자 둘 중 하나는 거짓말쟁이라는 구도가 만들어졌고, 마을은 진짜 장의사를 처형했다. 그 순간 픽시가 장의사 능력을 얻어, 자신이 방금 처형시킨 사람의 캐릭터를 그날 밤에 확인하게 됐다.']},
  villageidiot:{howto:['셋업에서 마을 바보를 0명에서 2명까지 더 넣을 수 있다. 둘 이상이면 그중 정확히 1명에게 취함 표식을 붙인다. 몇 명을 넣든 취한 사람은 한 명뿐이다.','밤에는 마을 바보들을 한 명씩 따로 깨워 지목받고 엄지 신호를 준다. 동시에 깨우면 서로의 지목이 새므로 반드시 순차로 진행하라.','취한 마을 바보 본인은 자신이 취했음을 모른다. 둘이 같은 사람을 확인했는데 답이 엇갈리는 순간이 이 캐릭터의 핵심 장면이므로, 거짓 신호도 좌석 추리와 그럴듯하게 맞춰 주어라.','취함 표식은 게임 내내 고정이며 다른 사람에게 옮겨 가지 않는다. 마을 바보가 하나뿐인 판에서는 취한 사람도 없다.'],examples:['마을 바보가 셋인 판에서 둘이 같은 플레이어를 확인해 하나는 선, 하나는 악이라는 답을 받았다. 낮에 두 사람이 정면으로 충돌하자 세 번째 마을 바보가 자신의 존재를 밝히며 판을 정리하려 했지만, 취한 사람이 누구인지는 끝까지 알 수 없었다. 악 팀은 그 혼란 속에서 진짜 정보원 둘을 조용히 처형시켰다.']},
  damsel:{howto:['첫날 밤 하수인 정보 때 하수인들에게 아가씨 토큰을 보여준다. 누가 아가씨인지는 알려주지 않고 있다는 사실만 알린다.','하수인의 공개 지목은 게임 전체에서 딱 한 번이다. 아무 하수인이든 낮에 공개적으로 아가씨를 지목하는 순간 사용 표식을 붙이고, 맞으면 그 자리에서 선 팀 패배로 게임을 끝낸다.','틀리면 그 기회는 그대로 사라진다. 마을이 아가씨를 미끼로 하수인의 지목을 유도해 소모시키는 전략을 쓸 수 있고, 이것이 이 외지인의 진짜 재미다.','사냥꾼이 있는 판에서는 아가씨가 다른 주민으로 바뀔 수 있다. 그날 밤 아가씨를 깨워 새 캐릭터 토큰을 보여줘야 하며, 이 절차를 빠뜨리면 본인이 바뀐 줄도 모른다.'],examples:['마을은 아가씨를 지키려고 세 명이 동시에 자신이 아가씨라고 주장하는 작전을 폈다. 하수인 하나가 참지 못하고 그중 한 명을 공개 지목했지만 틀렸고, 아가씨의 위협은 그것으로 끝났다. 남은 게임에서 마을은 그 하수인을 확정 악으로 놓고 판을 풀어 갔다.']},
  marionette:{howto:['꼭두각시는 가방에서 뽑히지 않는다. 셋업에서 악마의 이웃 중 한 명을 골라 선한 캐릭터 토큰을 준 뒤, 그가 꼭두각시임은 사회자 장부에만 기록한다.','첫날 밤 악마를 깨워 이 사람이 꼭두각시라는 표식과 함께 그를 가리킨다. 꼭두각시 본인은 끝까지 자신이 선하다고 믿으며 어떤 밤에도 이 사실을 알려주지 않는다.','꼭두각시가 믿는 캐릭터에 밤 능력이 있다면 매일 밤 깨워서 굴리는 시늉을 하되 정보는 전부 거짓으로 준다. 절차를 생략하면 본인이 곧바로 눈치챈다.','꼭두각시는 악 팀으로 승리한다. 진심으로 자기 정보를 말하는 사람이 악이라는 뜻이므로, 이 판에서는 정직함이 결백의 근거가 되지 않는다.'],examples:['꼭두각시는 자신이 초공감자라고 굳게 믿고 매일 밤 숫자를 받았다. 사회자는 좌석과 그럴듯하게 맞는 숫자를 계속 줬고, 꼭두각시는 그 정보를 진심으로 공개하며 마을의 신뢰를 얻었다. 마지막 날 마을은 그의 숫자를 근거로 악마 후보를 좁혔는데, 정작 그가 악마의 옆자리에 앉은 하수인이었다.']},
  goblin:{howto:['지명당한 그 순간에 공개적으로 고블린이라고 선언해야 한다. 지명되지 않은 상태에서 미리 선언하거나 선언 없이 처형되면 발동하지 않는다.','선언한 그날 안에 처형되어야 한다. 선언 표식을 붙이되 그날 처형이 다른 사람에게 가면 표식을 치우고, 다음 날 다시 지명당하면 다시 선언해야 한다.','선언 즉시 마을은 딜레마에 빠진다. 처형하면 지고 살려 두면 하수인 하나를 방치하게 되는데, 사회자는 중립을 지키고 어느 쪽으로도 유도하지 말 것.','고블린이 중독·취함인 상태에서 선언하고 처형되면 아무 일도 일어나지 않는다. 악 팀 전체가 승리했다고 착각하는 순간이므로 처형 판정 전에 표식을 반드시 확인하라.'],examples:['3일차에 마을은 남은 하수인이라 확신하고 한 명을 지명했다. 그가 곧바로 자신이 고블린이라고 선언하자 지명자는 표를 거두려 했지만 이미 손을 든 사람이 정족수를 넘긴 뒤였다. 부결시키자는 설득이 오갔지만 한 명이 끝내 손을 내리지 않았고, 처형이 통과되며 악 팀이 그 자리에서 승리했다.']},
  kazali:{howto:['첫날 밤 카잘리를 깨워 어떤 플레이어를 어떤 하수인으로 만들지 직접 고르게 한다. 고른 사람들을 하나씩 깨워 "당신은 이 캐릭터다" 표식과 하수인 토큰을 보여주고 엄지를 내린다.','하수인이 된 사람은 원래 캐릭터와 능력을 잃는다. 선한 정보원이 하수인으로 바뀌면 마을은 그 정보가 왜 처음부터 나오지 않는지 이해하지 못한 채 판을 진행하게 된다.','외지인 수를 늘리거나 줄일 수 있다. 하수인으로 바뀔 사람들을 감안해야 하므로 인원 배분은 카잘리의 선택 이후에 최종 확정된다고 보고 진행하라.','여행자를 고를 수 있는지, 하수인 수를 어떻게 채우는지 등 첫날 밤 절차의 세부는 판에 큰 영향을 준다. 공식 위키에서 세부 판정을 확인할 것.'],examples:['카잘리는 첫날 밤 좌석 양쪽 끝의 두 사람을 하수인으로 골랐다. 그중 한 명은 가방에서 점쟁이를 뽑았던 사람이었고, 그는 첫 정보를 받아 보기도 전에 자신이 독살범이 되었다는 통보를 받았다. 다음 날 아무도 점쟁이를 주장하지 않자 마을은 점쟁이가 처음부터 없었다고 결론 내렸고, 그 오판 위에서 판이 끝까지 흘러갔다.']},
  alchemist:{howto:['셋업에서 어떤 하수인 능력을 줄지 미리 정한다. 첫날 밤 "당신은" 토큰과 하수인 토큰을 보여주되, 그리모어에는 연금술사 토큰을 그대로 두고 "연금술사임" 전역 알림을 붙인다.','악마·하수인 정보에 연금술사는 등장하지 않는다. 하수인 능력을 가져도 진영은 선이고 악 팀은 그가 누구인지 모른다.','하수인 능력이 악에게 유리한 방향으로 쓰이려 하면 "다른 선택을 하겠습니까"라고 물어 되돌릴 수 있다. 이건 규칙 위반이 아니라 연금술사 능력에 포함된 조항이다.','중독·취함이면 하수인 능력이 작동하지 않는다. 그래도 평소대로 지목시키고 결과만 무효로 처리해 본인이 눈치채지 못하게 할 것.'],examples:['연금술사에게 독살범 능력을 줬다. 첫날 밤 그가 조용한 플레이어를 중독시키려 했는데 그 대상이 실제 임프여서 아무 의미가 없었다. 사회자가 다른 선택을 권하자 연금술사는 점쟁이 옆자리를 골랐다. 낮에 그가 "나는 독살범 능력을 가진 연금술사"라고 커밍아웃하자 마을은 반신반의하면서도 그를 정보 축으로 삼았다.']},
  atheist:{howto:['구성에서 악한 캐릭터를 전부 뺀다. 하수인·악마 자리까지 선한 캐릭터로 채우며 중복 캐릭터를 넣어도 된다. 첫날 밤 하수인 정보·악마 정보 단계는 건너뛴다.','마을이 무신론자를 처형하면 즉시 선이 승리한다. 죽은 무신론자도 지명·처형 대상으로 허용해야 이 조항이 의미를 가지므로, 유령 처형 절차를 미리 정해 둘 것.','이 판에서만 사회자가 규칙을 깰 수 있다. 밤에 사람을 죽이고 거짓 정보를 주어 악마가 있는 것처럼 굴리되, 마을이 진실에 도달할 실마리는 반드시 남길 것.','무신론자 본인도 다른 사람의 정체는 모른다. 커밍아웃이 곧 승리 조건 공개이므로 마을이 그를 믿어 주는지가 전부다.'],examples:['8인 무신론자 판에서 사회자는 밤마다 1명씩 죽이며 임프가 있는 것처럼 굴렸고 점쟁이에게는 거짓 "예"를 계속 줬다. 4일차에 점쟁이의 판정들이 서로 모순된다는 걸 눈치챈 마을이 "이 판에는 악마가 없다"는 결론에 도달했다. 커밍아웃한 무신론자를 처형하면서 선이 이겼다.']},
  cannibal:{howto:['처형으로 죽은 가장 최근 사망자의 능력만 이어받는다. 밤 살해나 처단자 사망으로는 발동하지 않는다.','죽은 이가 악이었다면 식인종은 중독된다. 이때도 능력은 계속 주되 결과를 거짓으로 준다. 다음 선한 플레이어가 처형될 때까지 중독이 풀리지 않는다.','처형이 이어질 때마다 능력은 최신 처형자로 덮어쓴다. "점심" 알림을 옮겨 붙여 지금 무슨 능력인지 그리모어에서 추적할 것.','게임당 1회짜리 능력을 물려받으면 횟수가 새로 충전된다. 이미 다 쓴 처단자를 먹어도 식인종은 한 번 쏠 수 있다.'],examples:['3일차에 처형된 점쟁이의 능력을 식인종이 이어받았다. 붉은 청어는 기존 지정을 그대로 유지했고 식인종은 그날 밤부터 두 명씩 확인하기 시작했다. 다음 날 마을이 하수인을 처형하자 식인종은 중독되어 거짓 "예"를 받았다. 그 정보로 무고한 주민이 처형되면서 중독이 풀렸고, 식인종은 뒤늦게 자기 정보가 한 칸 어긋났다는 걸 알았다.']},
  engineer:{howto:['게임당 1회, 밤에 하수인 전부 또는 악마를 지정한다. 둘 중 하나만 고른다 — 섞어서 고를 수 없다.','지정이 성립하면 해당 플레이어들을 하나씩 깨워 "당신은" 토큰과 새 캐릭터 토큰을 보여준다. 진영은 그대로이고 캐릭터만 바뀐다.','중독·취함이면 아무것도 바뀌지 않지만 능력은 소진된다. 기술자는 성공했다고 믿게 두고 "능력 없음" 알림만 붙일 것.','살아 있는 하수인 수와 지정한 하수인 수가 맞지 않으면 사회자가 조정한다. 이미 죽은 자리에는 지정이 적용되지 않는다.'],examples:['5일차 밤, 기술자가 악마를 임프로 지정했다. 실제 악마는 젠보였고 그 자리에서 임프로 바뀌었다. 낮에 기술자가 이를 공표하자 마을은 "지금 악마는 임프"라는 확실한 축을 얻었다. 임프가 스스로를 지목해 계승을 시도했지만 마을은 이미 계승 후보군을 좁혀 놓은 뒤였다.']},
  king:{howto:['첫날 밤 악마를 깨워 "이 플레이어는" 토큰과 왕 토큰을 보여주고 왕을 가리킨다. 왕은 악마가 자신을 안다는 사실만 알 뿐 악마가 누구인지는 모른다.','죽은 사람 수가 산 사람 수 이상일 때만 정보를 준다. 매 밤 인원부터 세고 미달이면 왕을 깨우지 않는다.','알려주는 것은 살아 있는 캐릭터 하나다. 누구인지는 밝히지 않고 캐릭터 토큰만 보여주며, 어떤 캐릭터를 고를지는 사회자 재량이다.','중독·취함이면 게임에 없는 캐릭터나 이미 죽은 캐릭터를 보여줄 수 있다. 조건 미달인 밤과 구분되지 않도록 진행 속도를 일정하게 유지할 것.'],examples:['12인 게임 5일차 밤, 사망 6명·생존 6명이 되어 왕이 처음 발동했다. 사회자는 아직 커밍아웃하지 않은 군인 토큰을 보여줬다. 낮에 왕이 이를 공개하자 군인 주장이 튀어나오며 논의가 정리됐지만, 악마는 첫날부터 왕이 누구인지 알고 있었다. 그날 밤 왕이 가장 먼저 죽었다.']},
  nightwatchman:{howto:['게임당 1회이며 첫날 밤에도 쓸 수 있다. 매 밤 쓸 것인지 확인하고, 쓰지 않으면 그냥 넘어간다.','지목이 성립하면 야경꾼을 재우고 대상을 깨워 "이 플레이어는" 토큰과 야경꾼 토큰을 보여준 뒤 야경꾼을 가리킨다. 대상은 확실하게 알게 된다.','중독·취함이면 대상을 아예 깨우지 않는다. 야경꾼은 성공했다고 믿으므로 낮에 "내가 밤에 갔다"고 주장했다가 부정당하는 충돌이 벌어진다 — 개입하지 말 것.','악한 플레이어를 지목해도 그대로 알려준다. 야경꾼이 악마에게 정체를 넘기는 것도 유효한 플레이다.'],examples:['야경꾼이 2일차 밤에 가장 신뢰하던 플레이어를 지목했는데 그는 독살범이었다. 독살범은 중독으로 대응하는 대신 낮에 "야경꾼이 나에게 왔다"고 먼저 공표해 신뢰를 가로챘다. 진짜 야경꾼이 반박했지만 능력은 이미 소진된 뒤였다. 마을은 끝까지 둘 중 누가 진짜인지 가리지 못했다.']},
  princess:{howto:['두 조건이 모두 성립해야 한다 — 공주가 직접 지명했고, 그 대상이 그날 처형되어야 한다. 남이 지명한 사람이 처형되면 발동하지 않는다.','공주의 첫째 날은 공주가 살아 있는 첫 낮이다. 그날을 넘기면 능력은 끝난다.','성립하면 그날 밤 악마를 평소대로 깨워 지목시키되 아무도 죽지 않는다. 악마에게 실패를 알리지 말 것 — 아침의 사망 없음으로만 드러난다.','중독·취함이면 조건을 채워도 악마가 정상적으로 죽인다. 공주는 자기 능력이 통했다고 믿고 있으므로 낮에 혼선이 생긴다.'],examples:['1일차 낮에 공주가 수상한 플레이어를 지명했고 마을이 그를 처형했다. 그는 하수인이었고, 그날 밤 임프의 지목은 무위로 돌아가 아침에 아무도 죽지 않았다. 마을은 수도사가 막았다고 해석해 엉뚱한 사람을 신뢰했다. 공주는 정체를 숨긴 채 이틀을 더 벌었다.']},
  hatter:{howto:['낮에 죽었든 밤에 죽었든 죽은 그날 밤에 한 번만 발동한다. "오늘 밤 다과회" 알림을 붙여 잊지 말 것.','하수인과 악마를 깨워 각자 새 캐릭터로 바꿀지 고르게 한다. 바꾸지 않아도 되며, 하수인은 하수인으로 악마는 악마로만 바뀐다.','같은 캐릭터가 둘이 되지 않게 조율한다. 이미 게임에 있는 캐릭터나 다른 사람이 방금 고른 캐릭터는 고를 수 없다.','중독·취함 상태로 죽었다면 다과회는 열리지 않는다. 악 팀은 왜 안 깨워졌는지 알 수 없으므로 조용히 넘어가면 된다.'],examples:['3일차에 모자 장수가 처형됐다. 그날 밤 임프는 그대로 남기로 했지만 독살범이 첩자로 바꿨다. 다음 날 첩자가 그리모어를 보고 나온 정보로 마을의 점쟁이를 정확히 짚어 몰아붙였다. 마을은 장의사가 확인한 하수인이 독살범이었는데 왜 중독이 멈췄는지를 두고 한참 헤맸다.']},
  ogre:{howto:['첫날 밤 자신이 아닌 1명을 지목하게 하고 "친구" 알림을 붙인다. 그 사람의 진영이 오거의 진영이 되지만 오거에게는 어느 쪽인지 알려주지 않는다.','중독·취함이어도 작동한다. 명시된 예외이므로 독살범이 오거를 지목해도 진영 전환은 그대로 일어난다.','악으로 바뀌어도 오거는 악 팀 정보를 받지 않고 악마도 오거를 모른다. 악 팀에 합류시키지 말 것 — 승리 조건만 같아진다.','진영은 지목 시점 기준으로 정해진다. 이후 그 사람의 진영이 바뀌어도 오거를 다시 계산하지 않는다.'],examples:['오거가 첫날 밤 가장 말이 많던 플레이어를 골랐는데 그는 남작이었다. 오거는 자신이 악이 된 줄 모른 채 진심으로 마을 편에서 추리했고 악마 후보를 정확히 좁혀 갔다. 마지막 날 마을이 악마 처형에 실패해 악이 승리했다. 끝까지 마을을 도왔던 오거가 승자 명단에 오르면서 모두가 웃었다.']},
  vizier:{howto:['첫날 밤 재상이 누구인지 공표한다. 모든 플레이어가 알고 시작하며 재상 본인도 숨길 이유가 없다.','재상은 낮에 죽지 않는다. 처형이 성립해도 죽지 않고 사이코패스나 총잡이 같은 낮 살해도 통하지 않는다. 밤 살해로는 죽는다.','선한 플레이어가 찬성표를 던진 지명이면 재상은 집계 도중이라도 즉시 처형을 선언할 수 있다. 과반이나 최다 득표를 따지지 않는다.','중독·취함이면 즉시 처형이 통하지 않는다. 시도하게 두되 "아무 일도 일어나지 않습니다"라고 답하고 투표를 계속 진행할 것.'],examples:['재상이 공개된 판에서 마을은 재상 앞에서 지명하기를 꺼렸다. 4일차에 참다못한 주민이 조사관을 지명하고 스스로 찬성표를 들자, 재상이 즉시 처형을 선언해 조사관이 죽었다. 그 뒤로 마을은 선한 표를 아예 봉인했고 지명 자체가 얼어붙었다. 악은 아무것도 하지 않고 이틀을 벌었다.']},
  wizard:{howto:['게임당 1회 마법사가 소원을 빈다. 들어줄지, 어떤 대가를 붙일지, 어떤 단서를 남길지가 모두 사회자 재량이다.','판을 뒤집을 만큼 큰 소원이면 대가도 그만큼 크게 잡는다. 마을이 나중에 "무언가 부자연스러운 일이 있었다"고 추적할 단서를 반드시 하나 남길 것.','중독·취함이면 소원이 이뤄지지 않는다. 그래도 능력은 소진되며 마법사에게 실패를 알리지 않는다.','자유도가 극단적으로 높아 판정 폭이 넓다. 시트에 넣기 전 공식 위키에서 세부 판정과 허용 범위를 확인할 것.'],examples:['마법사가 "장의사가 죽었으면 좋겠다"고 빌었다. 사회자는 소원을 들어주되 대가로 마법사 본인을 그날 밤부터 중독시켰고, 단서로 아침에 "이 죽음은 악마가 낸 것이 아니다"라고 공표했다. 마을은 하수인 중에 밤에 사람을 죽일 수 있는 무언가가 있다고 판단했다. 이후 중독된 마법사의 다음 판단이 어긋나면서 오히려 악 팀이 흔들렸다.']},
  psychopath:{howto:['매일 낮 지명이 시작되기 전에만 쓸 수 있다. 첫 지명이 접수되면 그날은 끝이므로, 낮 시작 시 사이코패스에게 먼저 물을 것.','공개적으로 고르고 대상은 즉시 죽는다. 보호나 부활 능력이 걸려 있으면 평소 판정을 그대로 적용한다.','처형이 확정되면 사회자와 가위바위보를 한다. 지면 죽고 이기면 살아남으며 비기면 다시 낸다. 살아남아도 그날 낮은 그대로 끝난다.','중독·취함이면 낮 살해가 통하지 않는다. 공개적으로 고르게 두고 아무 일도 일어나지 않는다고 답하면 사이코패스의 정체만 노출된다.'],examples:['2일차 낮이 시작되자마자 사이코패스가 공개적으로 점쟁이를 골라 죽였다. 마을은 즉시 그를 지명해 처형했지만 가위바위보에서 사이코패스가 이겨 살아남았고 그날 낮은 그대로 끝났다. 다음 날 또 한 명이 죽으면서 마을 인원은 사흘 만에 반으로 줄었다. 마을은 처형권 자체를 사이코패스에게 계속 소모당했다.']},
  xaan:{howto:['셋업에서 외지인 수를 X명으로 맞춘다. X는 사회자가 정하는 값이며 그만큼 주민 자리를 줄인다.','X일째 밤에 모든 주민이 황혼까지 중독된다. 그 밤의 주민 정보를 전부 거짓으로 줄 수 있고 다음 날 낮 내내 주민 능력이 죽어 있다.','매 밤 알림 토큰을 1일차·2일차·3일차로 옮겨 X일이 언제인지 추적한다. 이 카운트를 놓치는 것이 가장 흔한 사고다.','자안이 중독·취함이거나 죽어 있으면 X일째 밤에도 아무 일도 일어나지 않는다.'],examples:['외지인 3명으로 시작한 자안 판. 3일차 밤에 모든 주민이 중독되어 초공감자는 0을, 점쟁이는 거짓 "예"를 받았다. 다음 날 그 정보들이 서로 어긋나자 마을은 독살범을 의심하며 엉뚱한 사람을 처형했다. 자안은 정체를 드러내지 않고도 하루 만에 판을 뒤집었다.']},
  lilmonsta:{howto:['릴 몬스타는 가방에 넣지 않는다. 하수인 +1을 적용해 하수인만 뽑고, 릴 몬스타 토큰은 그리모어에 따로 두고 "악마임" 전역 알림으로 보모를 표시한다.','매일 밤 하수인들을 함께 깨워 누가 보모를 맡을지 고르게 한다. 합의가 안 되면 사회자가 정한다. 선택된 하수인을 깨워 "당신은" 토큰과 릴 몬스타 토큰을 보여줄 것.','살해 판정은 첫날 밤을 제외한 매 밤이다. 하수인들에게 대상을 지목시키지 말 것 — 누가 죽을지는 사회자가 정한다.','그날의 보모가 악마로 등록된다. 악마를 찾는 능력은 보모를 악마로 잡으며, 보모가 처형돼 죽으면 악마가 죽은 것으로 처리한다.'],examples:['하수인 셋이 매일 밤 보모를 돌려 맡던 판이었다. 4일차에 마을이 확신을 갖고 한 명을 처형했는데 그가 마침 그날의 보모여서 즉시 선이 승리했다. 악 팀은 어제까지는 다른 사람이 들고 있었다며 억울해했다. 보모 교대 타이밍을 읽힌 것이 패인이었다.']},
  lleech:{howto:['첫날 밤 숙주를 지목하게 하고 "중독" 알림을 붙인다. 숙주는 게임이 끝날 때까지 중독 상태로 남는다.','리치는 숙주가 죽어 있을 때만, 그리고 그때에만 죽는다. 숙주가 살아 있으면 처형이 성립해도 죽지 않는다 — 처형을 진행하고 죽지 않았다고 공표할 것.','숙주가 선한 플레이어면 마을이 스스로 숙주를 처형해야 리치를 잡을 수 있다. 숙주가 중독이라 정보를 못 내는 것도 단서이므로 그 모순이 드러나도 개입하지 말 것.','리치가 죽으면 숙주의 중독도 함께 풀린다. 막판 판정에서 이 해제를 잊지 말 것.'],examples:['리치가 첫날 밤 초공감자를 숙주로 골랐다. 초공감자의 숫자가 계속 어긋나자 마을은 그를 주정뱅이로 의심해 3일차에 처형했다. 숙주가 죽은 그 순간부터 리치는 죽을 수 있는 상태가 됐지만 마을은 그 사실을 몰랐다. 다음 날 처단자가 반쯤 찍은 지목 한 방에 게임이 끝났다.']},
  cacklejack:{howto:['매일 낮 캐클잭이 1명을 지목하면 그 사람에게 "내가 아님" 알림을 붙인다. 그날 밤 캐릭터가 바뀌는 사람은 지목된 그 사람이 아니라 다른 누군가다.','새벽 직전에 "내가 아님" 표시가 없는 플레이어 중 하나를 사회자가 골라 캐릭터를 바꾼다. 누구로 바꿀지는 전적으로 재량이므로 판의 균형을 보고 정할 것.','대상을 깨워 "당신은" 토큰과 새 캐릭터 토큰을 보여준다. 진영까지 바꿀지는 배치 전에 정해 두고 일관되게 적용할 것.','새로 추가된 여행자다. 지목 제한이나 진영 변경 허용 범위 같은 세부 판정은 공식 위키에서 확인할 것.'],examples:['캐클잭이 매일 낮 자기 자신을 지목해 나는 안 바뀐다는 신호를 보냈다. 사회자는 그날 밤 조용하던 주민을 골라 광인으로 바꿨다. 다음 날 그가 자신을 악마라 믿고 떠들기 시작하면서 마을의 추리가 통째로 헝클어졌다. 추방 논의가 캐클잭이 아니라 그 광인에게 쏠린 것이 악 팀에게는 공짜 하루였다.']},
  deusexfiasco:{howto:['게임 시작 전 공개 배치한다. 사회자가 최소 1회 실수를 저지르고, 바로잡은 뒤 공개적으로 인정하겠다는 약속이다.','실수는 의도적으로 만들어도 되고 진짜 실수를 그대로 써도 된다. 중요한 건 고쳤다와 인정했다 두 단계를 반드시 공개로 밟는 것이다.','정정 전에 마을이 이미 그 정보로 움직였다면 되돌리지 말고 그 흐름을 인정한 채 진행한다. "휴지" 알림으로 어느 판정이 무효였는지 기록해 둘 것.','초보 사회자나 실험적 시트에서 심리적 안전판으로 쓰는 우화다. 배치했다면 실수를 감추지 말 것.'],examples:['3일차 밤에 사회자가 장의사에게 잘못된 캐릭터 토큰을 보여줬다. 다음 날 낮에 이를 알아채고 어제 장의사에게 준 정보가 사회자 실수였다고 공개한 뒤 정정했다. 마을은 이미 그 정보로 한 명을 몰아붙이던 중이었다. 정정 덕분에 축을 다시 세운 마을이 그날 진짜 하수인을 찾아냈다.']},
  bootlegger:{howto:['게임 시작 전 공개 배치한다. 이 시트에 공식이 아닌 캐릭터나 자작 규칙이 들어 있다는 사전 고지다.','자작 규칙의 내용까지 밝힐 필요는 없다. 다만 표준과 다른 것이 있다는 사실 자체는 모두가 알아야 한다.','알림 토큰 두 개를 자유롭게 써서 어떤 자작 규칙이 걸려 있는지 그리모어에 기록해 둘 것. 판정이 갈릴 때 기준이 된다.','자작 내용에 따라 판정이 크게 달라진다. 표준 규칙과 충돌하는 지점은 시작 전 공식 위키의 밀주업자 항목과 대조해 정리할 것.'],examples:['사회자가 자작 외지인 하나를 섞은 시트에 밀주업자를 배치했다. 마을은 외지인 목록에 모르는 것이 있다는 전제를 깔고 추리했다. 실제로 그 자작 외지인이 등장했을 때 플레이어들은 항의하는 대신 검증에 들어갔다. 사전 고지 덕분에 판이 깨지지 않고 끝까지 굴러갔다.']},
  hindu:{howto:['게임 시작 전 공개 배치한다. 처음 죽는 4명은 죽는 즉시 같은 진영의 여행자로 환생한다.','환생 처리는 사망 판정 직후 바로 한다. 밤 사망이면 아침 공표 전에 새 여행자 토큰을 배정하고, 낮 처형이면 그 자리에서 처리할 것.','진영은 유지되고 캐릭터만 여행자로 바뀐다. 선한 사망자는 선한 여행자로, 악한 사망자는 악한 여행자로 돌아온다.','인원수·투표수·승리 조건 계산이 크게 흔들린다. 여행자 추방 규칙과 겹치는 세부 판정은 공식 위키에서 확인할 것.'],examples:['2일차 밤에 죽은 점쟁이가 즉시 학자 여행자로 환생했다. 죽은 줄 알았던 사람이 투표권을 가진 채 돌아오자 마을은 인원 계산을 처음부터 다시 했다. 악 팀은 밤 살해의 가치가 크게 떨어졌다고 판단해 낮 처형 유도로 전략을 바꿨다. 그때부터 판의 무게중심이 완전히 낮으로 옮겨갔다.']},
  stormcatcher:{howto:['게임 시작 전 공개 배치하고 선한 캐릭터 하나를 지정해 공표한다. 그 캐릭터가 실제로 게임에 있는지는 밝히지 않는다.','지정한 캐릭터가 게임에 있으면 그 플레이어에게 "폭풍잡힘" 알림을 붙이고, 첫날 밤 악한 플레이어 전원에게 그 캐릭터 토큰과 해당 플레이어를 보여준다.','지정한 캐릭터가 게임에 없으면 악한 플레이어 전원에게 이 캐릭터들은 게임에 없다 토큰과 함께 그 캐릭터를 보여준다. 악 팀에게는 블러프 재료가 된다.','폭풍잡힌 플레이어는 처형으로만 죽는다. 밤 살해와 낮 살해가 전부 통하지 않으므로 악 팀은 그를 처형대로 몰아야 한다. 세부 판정은 공식 위키에서 확인할 것.'],examples:['사회자가 시장을 폭풍잡이 대상으로 지정했다. 시장이 실제로 게임에 있어 악 팀은 첫날 밤부터 그가 누구인지 알았고, 밤에 죽일 수 없으니 낮 여론을 그에게 몰아갔다. 마을은 왜 저 사람만 집요하게 몰리는지를 역으로 읽어 시장을 지켜냈다. 시장이 끝까지 살아남으면서 선은 처형 없는 승리 조건까지 열어 뒀다.']},
  zenomancer:{howto:['게임 시작 전 공개 배치한다. 한 명 이상에게 각각 목표를 하나씩 주고 "목표" 알림으로 추적한다.','목표는 그 플레이어가 달성 여부를 스스로 알 수 있을 만큼 구체적이어야 한다. 달성하면 참인 정보 한 조각을 준다.','중독·취함인 플레이어에게도 참인 정보를 줄지는 배치 전에 정해 두고 일관되게 적용할 것. 판정이 왔다 갔다 하면 우화 자체가 정보 오염원이 된다.','목표 난이도와 보상 정보의 무게를 맞추는 것이 전부다. 목표 설정 지침과 세부 판정은 공식 위키에서 확인할 것.'],examples:['사회자가 계속 겉돌던 플레이어에게 오늘 낮에 최소 세 명에게 먼저 말을 걸라는 목표를 줬다. 그가 목표를 달성하자 그날 밤 왼쪽 이웃이 선하다는 참인 정보를 받았다. 소극적이던 그가 확신을 갖고 발언하기 시작하면서 마을에 논의 축이 하나 더 생겼다. 그 축이 결국 하수인 하나를 걸러내는 실마리가 됐다.']},
  beggar:{howto:['거지는 투표하려면 사망 투표 토큰이 필요하다. 살아 있어도 기본 투표권이 없으므로 집계 때 토큰 보유 여부부터 확인할 것.','죽은 플레이어가 유령 토큰을 거지에게 넘기면 거지는 그 사람의 진영을 알게 된다. 넘기는 행위는 공개이고 진영은 거지에게만 조용히 알려준다.','거지는 취하지도 중독되지도 않는다. 독살범이 거지를 지목해도 아무 효과가 없으므로 그 밤은 사실상 낭비된 것으로 처리한다.','첩자·은둔자의 진영을 알려줄 때 등록 재량이 걸린다. 실제 진영을 줄지 등록된 진영을 줄지 미리 정해 둘 것.'],examples:['3일차에 죽은 초공감자가 거지에게 유령 토큰을 넘겼다. 거지는 그가 선하다는 것을 알게 됐고 그 표로 결정적인 처형에 찬성했다. 이후 악 팀은 죽은 사람들에게 거지에게 토큰을 주지 말라고 설득하기 시작했다. 누가 토큰을 거절하는지가 그 자체로 정보가 되면서 거지는 남은 게임 내내 표를 구걸하며 다녔다.']},
  apprentice:{howto:['첫날 밤 그리모어를 참고해 능력을 정한다. 선한 진영이면 주민 능력, 악한 진영이면 하수인 능력을 주며 무엇을 줄지는 전적으로 사회자 재량이다.','"당신은" 토큰과 해당 캐릭터 토큰을 보여준 뒤, 그리모어에서 견습생 토큰과 그 캐릭터 토큰을 바꿔 놓고 "견습생임" 알림을 붙인다.','견습생은 여전히 여행자다. 추방 규칙이 그대로 적용되고 인원수 계산에서도 여행자로 센다.','이미 게임에 있는 캐릭터의 능력도 줄 수 있다. 중복을 허용할지, 판이 어느 쪽으로 기울었는지 보고 능력 강도를 조절할 것.'],examples:['악한 견습생에게 독살범 능력을 줬다. 마을은 여행자가 하수인 능력을 가질 수 있다는 걸 알면서도 계속 어긋나는 정보의 출처를 여행자에서 찾지 않았다. 4일차에야 견습생을 추방했지만 그때는 주요 정보 캐릭터가 전부 오염된 뒤였다. 남은 정보로는 악마를 좁힐 수 없었다.']},
  bishop:{howto:['주교가 게임에 있는 동안 지명은 사회자만 한다. 플레이어들은 누구를 지명해 달라고 요청할 수 있을 뿐 최종 결정은 사회자 몫이다.','매일 주교와 반대 진영인 플레이어가 최소 1명 지명되어야 한다. 선 지명·악 지명 알림으로 그날 조건을 채웠는지 추적할 것.','주교가 선하면 매일 악한 플레이어가 최소 1명 지명대에 오른다. 사회자가 매일 악의 정체를 한 조각씩 흘리는 셈이므로 누구를 고를지 신중할 것.','주교가 죽거나 추방되면 이 규칙도 끝난다. 그 순간부터 평소대로 플레이어 지명으로 돌아간다.'],examples:['선한 주교가 있는 판에서 사회자는 매일 하수인 하나와 무고한 주민 하나를 지명했다. 마을은 매일 지명된 둘 중 하나는 악이라는 사실만으로 3일 만에 교집합을 좁혔다. 악 팀은 지명 자체를 통제할 수 없어 여론전으로 버티는 수밖에 없었다. 결국 4일차에 임프가 잡혔다.']},
  harlot:{howto:['첫날 밤에는 발동하지 않는다. 이후 매 밤 살아 있는 1명을 지목하게 하고, 그 사람을 깨워 매춘부 토큰을 보여준 뒤 고개로 동의 여부를 답하게 한다.','동의하면 매춘부를 깨워 그 사람의 캐릭터 토큰을 보여준다. 거절하면 아무 일도 일어나지 않는다.','동의가 성립한 밤에만 두 사람이 죽을 수 있다. 누가 죽을지는 사회자 재량이며, 매춘부가 악마를 방문했다면 둘 다 죽이는 쪽이 자연스럽다.','중독·취함이면 거짓 캐릭터를 보여준다. 그래도 사망 판정은 그대로 재량으로 내릴 수 있다.'],examples:['매춘부가 2일차 밤에 조용한 플레이어를 방문했고 그는 동의했다. 그가 독살범이라는 것을 확인한 뒤 사회자는 매춘부는 살려 두고 방문 대상만 죽이는 재량을 택했다. 낮에 매춘부가 정보를 공개하자 마을은 남은 악을 빠르게 좁혔다. 악 팀은 여행자 말을 믿느냐로 반격했지만 시신이 곧 증거였다.']},
  deviant:{howto:['판정 기준은 오직 사회자의 재미 감각이다. 낮이 끝날 때 오늘 이 사람이 재미있었는지 스스로 판정하고, 재미있었다면 그날 추방으로 죽지 않는다.','보호되는 것은 추방뿐이다. 처형이나 밤 살해로는 평소대로 죽는다 — 여행자도 처형될 수 있다는 점과 혼동하지 말 것.','기준을 미리 말해 주지 말 것. 일탈자가 무엇이 통했는지 모른 채 계속 시도하게 두는 편이 판을 살린다.','재미 판정은 매일 새로 한다. 어제 통했다고 오늘도 통하지는 않는다.'],examples:['일탈자가 매일 낮 자기 정체에 대해 점점 터무니없는 이야기를 지어냈다. 3일차에 마을이 추방을 걸었지만 사회자는 그날 그가 충분히 재미있었다고 판정해 살려 뒀다. 마을은 추방이 실패한 이유를 몰라 그를 특별한 능력자로 오해했다. 다음 날 다시 추방을 걸었을 때는 그가 지쳐 조용했고, 그대로 나갔다.']},
  buddhist:{howto:['게임 시작 전 공개 배치하고 누가 숙련 플레이어인지 사회자가 정해 공표한다. 지목된 사람들은 매일 낮 시작 후 2분간 말할 수 없다.','2분을 실제로 재라. 눈대중으로 넘어가면 효과가 사라진다. 타이머를 켜고 종료를 명확히 알릴 것.','침묵 대상도 듣고 관찰할 수는 있다. 몸짓이나 필담까지 막을지는 배치할 때 미리 정해 함께 공표할 것.','초보자가 섞인 판에서 발언 지분을 나누는 장치다. 침묵하는 2분 동안 초보자에게 먼저 말을 걸어 흐름을 만들어 줄 것.'],examples:['경험 많은 세 명과 처음 하는 다섯 명이 섞인 판에 수행자를 배치했다. 첫 2분 동안 숙련자들이 침묵하자 초보자들이 스스로 정보를 꺼내기 시작했고 논의 축이 초보자 쪽에서 세워졌다. 숙련자들은 이미 만들어진 판 위에서 발언해야 했다. 결과적으로 훨씬 고른 게임이 됐다.']},
  fiddler:{howto:['게임 시작 전 공개 배치한다. 게임당 1회, 악마가 밤에 은밀히 반대 진영 1명을 지목하면 게임이 그 자리에서 멈춘다.','멈춘 뒤 두 사람이 누구인지 공개하고 모든 플레이어가 둘 중 누가 이길지 고른다. 죽은 사람도 참여하며 다수를 얻은 쪽의 진영이 승리한다.','악마에게 이 카드가 있다는 것을 미리 알려 둘 것. 언제 쓸 수 있는지 아는 것만으로도 악마의 낮 행동이 달라진다.','발동 시점의 정보 우위보다 누가 더 설득력 있었는가가 승패를 가른다. 발동 직전 낮에 두 사람이 충분히 말할 기회를 가졌는지 확인할 것.'],examples:['악마가 4일차 밤에 마을에서 가장 신뢰받던 점쟁이를 지목해 연주자를 발동시켰다. 게임이 멈추고 전원이 선택에 들어가자, 그동안 조용히 인상을 관리해 온 악마 쪽으로 표가 몰렸다. 정보로는 마을이 앞서 있었지만 인상에서 졌다. 뒤풀이 내내 그 한 표 차이가 회자됐다.']},
  duchess:{howto:['게임 시작 전 공개 배치한다. 매일 낮 최대 3명이 방문하겠다고 사회자에게 알리며, 방문자에게 "방문자" 알림을 붙인다.','그날 밤 방문자를 한 명씩 깨워 방문자 중 악한 사람이 몇 명인지 손가락으로 알려준다. 방문자 본인도 카운트에 포함한다.','방문자 중 정확히 1명에게는 거짓 숫자를 준다. "거짓 정보" 알림으로 누구에게 거짓을 줬는지 표시하고, 매일 다른 사람에게 거짓을 주는 편이 자연스럽다.','방문자가 3명 미만이어도 그대로 진행하며 그중 1명은 여전히 거짓을 받는다. 방문자가 1명이면 그 1명이 거짓을 받는다.'],examples:['3일차에 세 명이 공작부인을 방문했고 그중 하나가 하수인이었다. 두 명에게는 1을 주고 하수인에게는 거짓으로 0을 줬다. 다음 날 세 사람이 숫자를 맞춰 보자 하수인만 다른 숫자를 말했다. 마을은 거짓을 받은 사람이 악이라는 보장은 없다면서도 결국 그를 처형했고, 판정은 맞았다.']},
  djinn:{howto:['게임 시작 전 공개 배치한다. 이 시트에 걸린 징크스 규칙을 모든 플레이어에게 미리 설명한다 — 숨기면 진을 넣은 의미가 없다.','징크스는 특정 캐릭터 조합에서만 발동한다. 시트를 짤 때 걸리는 조합을 목록으로 뽑아 두고, 해당 캐릭터가 실제로 게임에 들어갔는지 확인할 것.','징크스 규칙은 일반 규칙보다 우선한다. 평소 판정과 충돌하면 징크스 쪽을 따른다.','게임에 없는 캐릭터의 징크스까지 공개할지는 미리 정할 것. 그 캐릭터가 블러프로 쓰일 수 있어 공개 범위가 곧 정보량이 된다.'],examples:['처단자와 정신병자가 함께 있는 시트에 진을 배치하고 두 캐릭터에 걸린 징크스를 시작 전에 공표했다. 4일차에 정신병자가 자신을 악마로 믿고 떠들다 처단자에게 공개 지목당했다. 모두가 이미 규칙을 알고 있어 판정 논쟁 없이 즉시 처리됐다. 규칙을 미리 깔아 둔 덕분에 결과가 그대로 정보로 쓰였다.']},
  noble:{howto:['첫날 밤 3명을 가리켜 보여주고 각자에게 "앎" 알림을 붙인다. 그중 정확히 1명만 악이다 — 0명도 2명도 아니다.','어떤 악 1명을 넣고 어떤 선 2명을 붙일지가 전부 사회자 재량이다. 악마를 넣으면 강력하고 하수인만 넣으면 완만해진다.','중독·취함이면 이 규칙을 깨도 된다. 셋 다 선하거나 둘이 악인 조합을 줘서 마을을 크게 흔들 수 있다.','첩자·은둔자가 후보에 끼면 등록 재량이 걸린다. 첩자를 선한 2명 자리에 넣는 것도 정당한 선택이다.'],examples:['귀족에게 임프·군인·집사를 보여줬다. 낮에 세 이름이 공개되자 마을은 그 셋에 집중했고 임프는 자신을 세탁부라고 주장하며 버텼다. 3일차에 집사가 밤에 죽으면서 후보가 둘로 줄었다. 마을은 남은 둘 중 임프를 골라 처형했고, 첫날 밤의 정보 하나가 끝까지 축으로 버텼다.']},
  highpriestess:{howto:['매일 밤 이야기를 나눠야 할 사람 1명을 가리켜 준다. 정보가 아니라 방향 제시이므로 판을 어디로 밀고 싶은지에 따라 자유롭게 정한다.','초반에는 조용한 플레이어를, 후반에는 정보가 엉킨 지점을 가리키는 식으로 쓰면 판이 굴러간다. 매번 악을 가리킬 필요는 없다.','대여사제가 이 정보를 공개하면 지목된 사람은 즉시 주목받는다. 그 부담을 감당할 수 있는 사람인지 보고 고를 것.','중독·취함이면 대화해 봐야 아무것도 안 나올 사람을 가리킨다. 티 내지 말고 평소와 같은 속도로 가리킬 것.'],examples:['대여사제가 3일차 밤에 계속 겉돌던 플레이어를 지목받았다. 낮에 그를 붙잡고 캐묻자 그는 어젯밤 야경꾼의 방문을 받았다는 사실을 그제야 꺼냈다. 묻히기 직전이던 정보 하나가 되살아났다. 마을은 그 방문 기록을 축으로 하수인 후보를 둘까지 좁혔다.']},
  huntsman:{howto:['셋업에서 아가씨를 반드시 추가한다. 사냥꾼이 있으면 아가씨도 들어가며 그만큼 주민을 하나 줄인다.','게임당 1회. 밤에 살아 있는 1명을 지목하게 하고 그 대상이 아가씨일 때만 발동한다. 아가씨가 아니면 아무 일도 없이 능력만 소진된다.','아가씨였다면 그를 깨워 "당신은" 토큰과 게임에 없던 주민 캐릭터 토큰을 보여준다. 그 순간부터 아가씨의 패배 조건은 사라진다.','중독·취함이면 아가씨를 정확히 짚어도 아무 일도 일어나지 않는다. 사냥꾼은 성공했다고 믿게 두고 "능력 없음" 알림만 붙일 것.'],examples:['아가씨가 낮에 조심스럽게 자기 정체를 흘렸고 사냥꾼이 그 밤에 그를 지목했다. 아가씨는 점쟁이로 바뀌었고 다음 밤부터 진짜 정보를 내기 시작했다. 하수인이 나중에 아가씨를 공개 추측했을 때는 이미 게임에 아가씨가 없어 아무 일도 일어나지 않았다. 그 헛발질로 하수인의 정체만 드러났다.']},
  politician:{howto:['게임이 끝나는 순간에만 판정한다. 자기 진영이 졌고 그 패배에 가장 큰 책임이 정치인 본인이라면 진영을 바꿔 혼자 승리한다.','죽어 있어도 성립한다. 일찍 처형된 정치인이 그 죽음으로 마을을 잘못된 방향으로 밀었다면 그것도 책임이 된다.','가장 큰 책임은 전적으로 사회자 판정이다. 애매하면 성립시키지 않는 쪽이 기본이며, 의도적으로 자기 팀을 망친 정황이 뚜렷할 때만 인정할 것.','정치인이 악으로 바뀐 판에서도 똑같이 작동한다. 악이 지고 정치인이 그 원흉이면 정치인만 선으로 바뀌어 이긴다.'],examples:['정치인이 매일 마을을 잘못된 후보로 몰아붙였고 3일 연속 무고한 주민이 처형되며 악이 승리했다. 사회자는 선 팀 패배의 원인이 정치인의 선동이라고 판정해 그를 승자로 인정했다. 마을은 자기들이 가장 믿었던 목소리가 별도의 승리 조건을 갖고 있었다는 사실에 한참 말을 잃었다.']},
  widow:{howto:['첫날 밤 과부에게 그리모어를 필요한 만큼 보여준다. 시간 제한은 두되 캐릭터와 좌석을 다 볼 수 있게 할 것.','이어서 1명을 지목해 중독시킨다. 과부 자신을 고를 수도 있으며 이는 정체를 숨기는 유효한 전략이다.','그다음 선한 플레이어 1명을 깨워 과부 토큰을 보여준다. 누구에게 알릴지는 사회자 재량이며, 이 사람이 낮에 공표하면 판이 즉시 뒤집힌다.','그리모어를 보는 것은 첫날 밤 한 번뿐이다. 이후 캐릭터가 바뀌어도 과부는 갱신된 정보를 받지 못한다.'],examples:['과부가 그리모어에서 점쟁이 자리를 확인하고 그를 중독시켰다. 동시에 사회자는 요리사에게 과부가 게임에 있다고 알렸다. 요리사가 낮에 이를 공표하자 마을은 즉시 중독 가능성을 계산에 넣었다. 점쟁이의 연속된 "예"를 걸러내는 대신 마을은 오히려 과부 추적을 시작했고, 그리모어를 본 사람 특유의 지나친 확신이 단서가 됐다.']},
  leviathan:{howto:['첫날 밤 레비아탄이 게임에 있다고 공표한다. 밤 살해가 없는 악마이므로 아침에 사망 공표가 없다고 해서 무언가 막힌 것이 아니다.','선한 플레이어가 2명 처형되는 순간 악이 승리한다. 처형된 사람의 진영을 매번 확인하고 "선한 플레이어 처형됨" 알림으로 셀 것.','5일차 낮이 끝나면 악이 승리한다. 매 밤 알림 토큰을 다음 날짜로 옮기고 마을에 며칠째인지 알려 줄 것.','하수인 처형은 카운트에 들어가지 않는다. 마을은 5일 안에 악마를 처형해야 하고 실수는 한 번만 허용된다는 점을 정확히 안내할 것.'],examples:['레비아탄 판 2일차에 마을이 무고한 주민을 처형했다. 남은 실수 허용치가 0이 되자 마을은 3일차와 4일차 처형을 아예 포기했다. 5일차에 모든 것을 걸고 한 명을 처형했지만 그는 하수인이었다. 낮이 끝나며 악이 승리했고, 마을은 카운트에 쫓겨 검증할 시간을 스스로 날린 셈이 됐다.']},
  alsaahir:{howto:['추측은 낮에 공개로 해야 하며, 게임에 있는 하수인 수·악마 수만큼 "누가 하수인이고 누가 악마인지"를 전부 정확히 지목해야 인정한다. 하나라도 틀리면 아무 일도 일어나지 않는다.','중독·취함 상태의 알사히르는 정답을 말해도 발동하지 않는다. 이때도 "아무 일도 일어나지 않습니다"라고만 답해 상태를 노출하지 말 것.','여행자는 하수인·악마에 포함되지 않는다. 군단처럼 팀 구성이 비표준인 대본에서는 무엇을 정답으로 볼지 셋업 때 미리 정해 둘 것.','하루에 몇 번까지 추측할 수 있는지 등 세부 판정은 공식 위키에서 확인할 것. 추측 실패도 정보이므로 마을의 후보를 좁혀 준다는 점을 염두에 둔다.'],examples:['5일차 낮, 알사히르가 "B와 D가 하수인, F가 악마"라고 공개 선언했다. 실제로는 F가 남작이고 D가 임프였다. 사회자는 "아무 일도 일어나지 않습니다"라고만 답했지만, 마을은 세 자리를 유력 후보로 굳혔고 악 팀은 그날 밤 알사히르를 최우선으로 죽였다.','독살범이 알사히르를 중독시킨 다음 날, 알사히르가 완벽하게 정답을 맞혔다. 발동하지 않았고 마을은 "정답이 아니었다"고 결론지어 진짜 악 셋을 용의선상에서 지웠다. 중독 한 번으로 판이 통째로 뒤집힌 장면이었다.']},
  banshee:{howto:['악마의 밤 공격으로 죽었을 때만 발동한다. 처형이나 다른 캐릭터에 의한 죽음은 발동하지 않으므로 아침 공표 전에 사인부터 확인할 것.','발동하면 아침에 "밴시가 죽었습니다"를 전원에게 공개한다. 죽은 밴시의 캐릭터가 드러나므로 마을의 신뢰 지형이 단숨에 바뀐다.','죽는 순간 중독·취함이었다면 능력이 작동하지 않는다. 공표도 하지 않고 평범한 밤 사망으로 처리한다.','죽은 밴시가 유령표로 몇 표를 행사하는지, 지명 2회가 어떻게 적용되는지는 판정이 갈릴 수 있으니 공식 위키에서 세부 판정을 확인할 것.'],examples:['3일차 밤 악마가 밴시를 죽였다. 아침에 공표하자 그때까지 조용하던 자리가 단숨에 마을의 신뢰 축이 됐다. 밴시는 그날 두 번 지명해 하수인 후보 둘을 동시에 도마에 올렸고, 두 번째 지명에서 처형이 성사됐다.','악마가 밴시를 노렸지만 그 밤 밴시는 중독 상태였다. 밴시는 그냥 죽었고 공표는 없었다. 마을은 평범한 밤 사망으로 넘어갔고, 악 팀은 밴시가 있었다는 사실조차 모른 채 게임을 마쳤다.']},
  choirboy:{howto:['셋업에 반드시 왕을 추가한다. 왕이 게임에서 빠지면 성가대 소년의 능력은 영영 발동하지 않는다.','발동 조건은 "악마가 왕을 죽였을 때"다. 왕이 처형되거나 다른 원인으로 죽으면 아무것도 알려주지 않는다.','악마는 왕을 치는 순간 자기 정체를 넘겨준다는 걸 안다. 그래서 왕은 오래 살아남기 쉽고, 마을이 왕 주변을 안전지대로 오판하는 흐름이 자주 생긴다.','발동 시점에 성가대 소년이 중독·취함이면 악마가 아닌 아무 플레이어나 가리켜도 된다.'],examples:['6일차 밤, 남은 정보원이 왕뿐이라 판단한 악마가 결국 왕을 쳤다. 성가대 소년이 깨어나 정확히 악마를 지목받았고, 다음 날 아침 왕의 사망 발표 직후 곧바로 지명해 게임을 끝냈다.','왕이 있는 판에서 악마가 끝까지 왕을 피해 다녔다. 성가대 소년은 게임 내내 아무 정보도 얻지 못했지만, 왕이 계속 살아 있다는 사실 자체가 악마의 행동 제약을 마을에 알려주는 단서가 됐다.']},
  farmer:{howto:['밤에 죽었을 때만 발동한다. 낮 처형으로 죽으면 아무 일도 일어나지 않는다.','새 농부는 살아 있는 선한 플레이어 중 사회자가 고른다. 정보 캐릭터를 지우면 마을이 크게 약해지므로, 이미 정보를 소진한 주민을 고르는 편이 균형에 낫다.','새 농부에게는 그 밤에 "당신은" 토큰과 농부 토큰을 보여준다. 본인만 알며 공개하지 않는다.','죽는 순간 농부가 중독·취함이었다면 계승은 일어나지 않는다. 새로 농부가 된 플레이어가 중독 상태로 죽어도 마찬가지다.'],examples:['악마가 2일차 밤 농부를 죽였다. 사회자는 이미 정보를 다 쓴 세탁부를 새 농부로 지정했다. 4일차 밤 악마가 그 세탁부를 다시 죽이자 또 다른 농부가 생겼고, 악 팀은 죽여도 계속 되살아나는 정체를 눈치채지 못한 채 킬을 낭비했다.','농부가 낮에 처형됐다. 계승은 없었다. 마을은 누군가 새 농부가 됐을 것이라 기대하며 신호를 기다렸지만 아무도 나서지 않았고, 그 침묵이 오히려 사인이 처형이었다는 사실을 확인해 줬다.']},
  lycanthrope:{howto:['셋업 때 악으로 등록되는 선한 플레이어 1명을 반드시 지정해 둘 것. 늑대인간이 그 사람을 고르면 죽지 않고 악마의 킬도 막히지 않는다.','선한 대상을 맞히면 그 대상이 죽고 그 밤 악마는 아무도 죽이지 못한다. 아침 사망자는 한 명뿐이라 마을은 이를 악마의 킬로 오해하기 쉽다.','중독·취함이면 대상이 선해도 죽지 않고 악마의 킬도 막히지 않는다. 그 밤 사망자는 악마가 고른 사람뿐이다.','늑대인간의 킬은 악마의 킬이 아니다. 악마 살해를 조건으로 하는 능력은 발동하지 않으며, 지정된 악 등록이 다른 정보 캐릭터에게까지 미치는 범위는 공식 위키에서 세부 판정을 확인할 것.'],examples:['늑대인간이 3일차 밤 조용한 플레이어를 골랐고 그는 선했다. 그 사람이 죽고 악마의 킬은 막혔다. 사망자가 한 명뿐이라 마을은 평범한 악마 살해로 봤고, 악마는 자기 킬이 왜 안 먹혔는지 몰라 수도사를 의심하며 다음 밤 표적을 바꿨다.','사회자가 열기구 조종사를 악 등록 대상으로 지정했다. 어느 밤 늑대인간이 그를 골랐지만 악으로 등록되어 죽지 않았고 악마의 킬도 그대로 통과했다. 마을은 늑대인간의 판정을 신뢰해 그 열기구 조종사를 악으로 몰아붙였다.']},
  poppygrower:{howto:['첫날 밤 하수인 정보와 악마 정보를 건너뛴다. 악마에게는 게임에 없는 선한 캐릭터 3개만 블러프로 보여준다.','양귀비 재배자가 죽은 날 밤에 하수인들을 깨워 악마를 알려주고, 악마를 깨워 하수인들을 알려준다. 낮 처형으로 죽었어도 그날 밤에 처리한다 — 가장 잊기 쉬운 타이밍이다.','죽는 순간 중독·취함이었다면 상견례는 일어나지 않는다. 악 팀은 계속 서로를 모른 채 남는다.','악 팀이 서로를 모르므로 밤 살해가 동료에게 향할 수 있다. 그대로 진행하라 — 그 사고 자체가 이 캐릭터의 값어치다.'],examples:['첫날 밤 악마는 블러프만 받고 하수인을 몰랐다. 2일차 밤 악마가 자기 하수인인 독살범을 죽였다. 마을은 정보 캐릭터가 죽을 줄 알았는데 조용해서 혼란스러워했고, 악 팀은 남은 하루를 서로 경계하며 낭비했다.','4일차 낮 마을이 양귀비 재배자를 처형했다. 그 밤 하수인과 악마가 처음 서로를 확인했고, 다음 날부터 악 팀의 발언이 눈에 띄게 맞물리기 시작했다. 마을은 그 변화를 읽고 자기들이 무언가를 풀어 줬다는 사실을 역추적했다.']},
  snitch:{howto:['첫날 밤 하수인 정보 직후, 하수인 각자를 따로 깨워 게임에 없는 캐릭터 3개를 보여준다. 하수인마다 다른 조합을 줘도 되고 같은 조합을 줘도 된다.','하수인이 여럿이면 반드시 개별로 처리한다. 시간이 꽤 걸리므로 첫날 밤 순서에 여유를 잡아 둘 것.','밀고자가 중독·취함이면 실제로 게임에 있는 캐릭터를 블러프로 섞어 줄 수 있다. 하수인이 그 이름을 대는 순간 진짜 본인에게 반박당한다.','밀고자는 외지인이라 남작 등으로 강제 투입될 수 있다. 악 팀에게 큰 선물이 되므로 셋업 균형을 신중히 볼 것.'],examples:['첫날 밤 남작과 첩자가 각각 블러프 3개씩을 받았다. 낮에 남작이 "나는 점쟁이"라고 주장했고 진짜 점쟁이가 없는 게임이라 오래 버텼다. 마을이 그 거짓을 깨는 데 이틀이 걸렸다.','밀고자가 중독된 상태여서 사회자는 하수인에게 실제로 게임에 있는 캐릭터를 블러프로 줬다. 하수인이 그 이름을 대자 진짜 본인이 즉시 반박했고, 하수인은 첫날부터 정체를 반쯤 노출했다.']},
  hermit:{howto:['셋업에서 외지인 수를 그대로 둘지 1명 줄일지 정한다. 은자 혼자 여러 외지인 몫을 하므로 대개 줄여서 균형을 잡는다.','대본에 있는 모든 외지인 능력을 동시에 가진다. 각 능력의 발동 조건을 사회자가 전부 추적해야 하므로, 진행 전에 해당 외지인 목록을 종이에 적어 둘 것.','은자는 정보 캐릭터에게 외지인으로 등록된다. 사서에게 은자를 어떤 외지인 토큰과 함께 보여줄지가 가장 큰 재량 지점이다.','능력끼리 충돌하거나 일부만 오작동시키고 싶을 때의 처리는 재량 폭이 넓으니, 공식 위키에서 세부 판정을 확인할 것.'],examples:['대본에 성자·집사·주정뱅이가 있는 판에서 은자를 넣고 외지인을 하나 줄였다. 낮에 마을이 은자를 처형하자 성자 능력이 발동해 선 팀이 즉시 패배했다. 아무도 그 자리를 성자라고 의심하지 않았기에 충격이 컸다.','사서에게 "집사" 토큰과 함께 은자와 무고한 주민을 보여줬다. 은자는 자기가 집사가 아님을 알기에 혼란스러워했고, 마을은 사서 정보가 깨졌다고 판단해 사서를 주정뱅이로 몰았다.']},
  heretic:{howto:['승패 판정 순간에 적용한다. 종료 조건이 성립하면 먼저 통상대로 승자를 정한 뒤, 이단자 능력으로 진영을 뒤집어 선언한다.','이단자가 죽어 있어도 적용된다. 반대로 게임이 끝나는 시점에 이단자가 중독·취함이면 뒤집기가 일어나지 않는다 — 종료 시점의 상태를 반드시 확인할 것.','이단자는 선한 팀이지만 사실상 선의 승리를 막아야 한다. 마을이 이단자를 찾아내는 순간이 판의 분기점이 되므로, 그 논의를 서두르지 말고 지켜볼 것.','악 팀이 이단자를 발견하면 오히려 지켜 준다. 밤 살해가 이단자를 자연스럽게 피해 가는 흐름을 그대로 허용하라.'],examples:['마을이 모든 악을 찾아 마지막 악마를 처형했다. 통상대로면 선 승리지만 이단자가 살아 있어 결과가 뒤집혔고 악 팀이 이겼다. 마을은 승리를 확신하며 함성을 지르다 그대로 얼어붙었다.','독살범이 이단자를 정보 캐릭터로 오인해 마지막 날 밤 중독시켰다. 다음 날 마을이 악마를 처형하자 뒤집기가 무효화되어 선 팀이 이겼다. 악 팀이 스스로 발등을 찍은 판이었다.']},
  boffin:{howto:['첫날 밤 괴짜 과학자와 악마를 함께 깨워, 이 하수인이 선택했다는 토큰과 함께 부여할 선한 캐릭터 토큰을 보여준다. 둘 다 무슨 능력인지 안다.','부여한 능력은 악마가 중독·취함이어도 계속 작동한다. 독살범이 악마를 중독시켜도 부여 능력만은 정상 처리할 것 — 이 캐릭터의 핵심이다.','악마가 밤에 깨어나야 하는 능력을 받았다면 밤 순서에 그 자리를 끼워 넣어야 한다. 밤 시트를 미리 다시 짜 둘 것.','괴짜 과학자가 죽어도 부여 능력은 사라지지 않는다. 악마가 교체될 때 새 악마가 그 능력을 이어받는지는 공식 위키에서 세부 판정을 확인할 것.'],examples:['괴짜 과학자가 악마에게 처단자 능력을 줬다. 4일차 낮 악마가 공개적으로 무고한 주민을 지목했고 아무 일도 없었지만, 빗나간 처단자라는 그림이 만들어져 악마는 선한 진영의 신뢰를 얻었다.','악마가 시장 능력을 받은 판. 마을이 마지막 날 처형 없이 낮을 끝내자 승리 조건이 악마 쪽에서 걸렸다. 사회자는 게임 전에 이 조합의 처리를 정해 뒀기에 즉시 결과를 선언할 수 있었다.']},
  mezepheles:{howto:['첫날 밤 비밀 단어를 종이에 적어 보여준다. 대화 중 나올 법하되 너무 흔하지는 않은 단어를 고를 것 — "그냥"이나 "확실히" 같은 단어는 첫 5분 만에 소모된다.','선한 플레이어가 그 단어를 말했다면 그날 밤 그를 깨워 "당신은" 토큰과 엄지 아래를 보여준다. 캐릭터는 그대로이고 진영만 악이 된다.','발동은 1회뿐이다. 발동 후에는 능력 없음 토큰을 붙여 둘 것.','악한 플레이어가 먼저 말했다면 소모되지 않고 그대로 남는다. 메제펠레스가 중독·취함이던 때 단어가 나왔다면 아무도 넘어가지 않는다.'],examples:['비밀 단어가 "정리"였다. 3일차 낮 열기구 조종사가 "정보를 정리해 보자"고 말했고 그 밤 악한 진영이 됐다. 캐릭터는 그대로라 다음 날에도 진짜 정보를 말했지만, 마을을 악마에게서 멀어지게 하는 조각만 골라 말했다.','단어가 "아마도"였는데 첫날부터 하수인이 먼저 말해 버렸다. 선한 플레이어가 아니므로 발동하지 않았고 능력은 그대로 남았다. 5일차에야 성직자가 그 단어를 말해 뒤늦게 넘어갔다.']},
  summoner:{howto:['셋업에서 악마 없이 시작한다. 악마 칸은 주민으로 채우며, 3일째 밤까지 악마가 없으므로 밤 사망도 없다.','첫날 밤 게임에 없는 선한 캐릭터 3개를 보여준다. 밤마다 밤 1·2·3 토큰을 갱신해 며칠째인지 놓치지 말 것.','3일째 밤 소환사가 플레이어 1명과 악마 캐릭터를 고른다. 선한 플레이어를 골라도 되며, 대상은 캐릭터가 바뀌고 악한 진영이 된 것을 그 밤에 알게 된다.','3일째 밤 소환사가 중독·취함이면 소환이 실패한다. 이 경우 악마 없는 판이 이어지므로 승패 처리 방침을 미리 정하고, 공식 위키에서 세부 판정을 확인할 것.'],examples:['이틀 동안 밤 사망이 없자 마을은 수도사나 양귀비 재배자를 떠올리며 안심했다. 3일째 밤 소환사가 조용하던 성직자를 골라 임프로 만들었고, 다음 날부터 사망자가 나오기 시작해 그때까지의 추리가 통째로 무너졌다.','소환사가 자기 자신을 골라 악마가 됐다. 하수인이 사라지고 악마 하나만 남았지만, 마을은 여전히 하수인이 하나 더 있다는 전제로 인원을 세고 있어 엉뚱한 자리를 계속 팠다.']},
  harpy:{howto:['매일 밤 하피가 2명을 고른다. 하피를 재운 뒤 첫 번째 대상을 깨워 이 캐릭터가 선택했다는 토큰과 하피 토큰을 보여주고, 두 번째 대상을 가리킨다.','첫 번째 대상은 다음 날 두 번째 대상이 악하다는 광기에 사로잡혀야 한다. 설득력 있게 주장하지 않으면 사회자 재량으로 첫 번째 대상 또는 두 번째 대상, 혹은 둘 다 죽일 수 있다.','광기 판정은 전적으로 재량이다. 첫날부터 바로 죽이기보다 경고를 한 번 주는 편이 매끄럽지만, 명백히 무시하면 반드시 집행할 것 — 집행하지 않으면 이 캐릭터는 무력해진다.','하피가 중독·취함이면 광기 강제도 사망 처벌도 없다. 그래도 첫 번째 대상은 똑같이 깨워 지시를 주는 편이 상태를 감춘다.'],examples:['하피가 첫날 밤 성직자와 시장을 골랐다. 다음 날 성직자는 시종일관 시장이 악하다고 밀어붙였고, 마을은 신뢰받던 성직자의 말에 흔들려 시장을 처형했다. 성직자는 자기가 왜 그러는지 설명할 수조차 없었다.','지목된 플레이어가 "나는 광기에 걸렸다"고 대놓고 밝히며 주장을 포기했다. 사회자는 그 밤 그를 죽였다. 이후 마을은 하피의 존재를 확신하고, 다음 날부터 이상한 주장을 하는 사람들의 발언을 역으로 읽기 시작했다.']},
  ojo:{howto:['플레이어가 아니라 캐릭터를 지목한다. 그 캐릭터인 플레이어가 죽으며, 이미 죽어 있거나 보호받고 있으면 아무 일도 일어나지 않는다.','게임에 없는 캐릭터를 지목하면 사회자가 죽을 사람을 고른다. 악 팀에게 유리하게 고를지 균형을 위해 다르게 고를지는 재량이며, 세부 판정은 공식 위키에서 확인할 것.','오조는 자기가 무엇을 맞혔는지 알지 못한다. 아침 사망자만 보고 역산해야 하므로 사회자는 어떤 반응도 보이지 말 것.','오조가 중독·취함이면 아무도 죽지 않는다. 보호에 막힌 경우와 겉으로 구분되지 않으므로 똑같이 침묵으로 처리한다.'],examples:['오조가 "군인"을 지목했다. 군인은 실제로 게임에 있었지만 악마 공격에 죽지 않아 사망자가 없었다. 아침이 조용하자 마을은 수도사를 떠올렸고, 오조는 자기가 군인을 맞혔다는 걸 몰라 다음 밤 또 군인을 지목했다.','오조가 게임에 없는 "장의사"를 지목했다. 사회자는 그날 밤 가장 위험한 정보원이던 점쟁이를 죽였다. 마을은 왜 하필 점쟁이인지 추론하다가 오조 특유의 무작위성을 끝내 읽어 내지 못했다.']},
  alhadikhia:{howto:['3명을 고르면 누구인지 전원에게 공개한다. 그 뒤 순서대로 한 명씩 따로 깨워 고개를 끄덕이거나 저어 삶·죽음을 고르게 하고, 한 명을 재운 뒤 다음 사람을 깨울 것.','앞사람의 선택 결과는 뒷사람에게 알려주지 않는다. 각자는 자기 앞에서 무슨 일이 있었는지 모른 채 결정한다.','죽음을 택한 사람은 그 자리에서 죽고, 셋 모두 삶을 택했다면 셋 다 죽는다. 한 명이 희생하면 나머지 둘이 산다는 구조를 마을이 낮에 계산하게 된다.','능력 사용은 선택이며 고르지 않는 밤에는 아무도 죽지 않는다. 중독·취함일 때의 처리와 보호 캐릭터와의 상호작용은 까다로우니 공식 위키에서 세부 판정을 확인할 것.'],examples:['알하디키아가 성직자·군인·집사를 지목했다. 성직자는 마을을 위해 죽음을 택했고 나머지 둘은 삶을 택해 살아남았다. 아침에 마을은 성직자를 순교자로 기렸지만, 남은 두 사람은 서로가 왜 살아남았는지를 놓고 의심하기 시작했다.','지목된 셋이 낮에 미리 아무도 죽지 말자고 공개 합의했다. 그 밤 셋 다 삶을 택했고 세 명이 한꺼번에 죽었다. 생존자가 절반으로 줄면서 판이 단숨에 악 팀 쪽으로 기울었다.']},
  gangster:{howto:['하루 1회. 양옆 중 한 명을 죽이려면 반대쪽의 살아 있는 이웃이 공개적으로 동의해야 한다. 동의를 낮에 말로 확인하고, 접수한 시점에 즉시 처리한다.','이웃 계산은 죽은 플레이어를 건너뛴다. 사람이 줄수록 갱스터의 사정거리가 넓어진다는 점을 양쪽에 상기시킬 것.','처형이 아니므로 그날의 처형 기회는 소모되지 않는다. 성자·희생양처럼 처형에 걸린 조건도 발동하지 않는다.','여행자이므로 진영은 사회자만 안다. 마을이 갱스터를 판단할 근거는 오직 누구를 죽였는가뿐이다.'],examples:['악한 갱스터가 오른쪽 이웃인 점쟁이를 노렸다. 왼쪽 이웃을 낮 내내 설득해 동의를 받아 냈고 점쟁이는 처형 없이 사라졌다. 마을은 동의해 준 사람을 공범으로 의심했지만 그는 그저 속은 선한 주민이었다.','마을이 갱스터를 신뢰해 확실한 하수인을 죽여 달라고 요청했다. 하지만 그 하수인은 이웃이 아니어서 사정거리 밖이었다. 이틀 뒤 사이에 있던 플레이어들이 죽어 이웃이 되자 갱스터가 즉시 집행했다.']},
  ferryman:{howto:['마지막 날의 판단은 사회자 몫이다. 오늘 처형으로 게임이 끝날 가능성이 높다고 보면 낮 시작 시점에 죽은 플레이어 전원이 표를 되찾는다고 공개 선언한다.','이미 유령표를 쓴 사람도 되찾는다. 처형 성립 인원 계산이 통째로 바뀌므로 선언 전에 표 수를 다시 세어 둘 것.','선언 타이밍이 곧 균형 조정이다. 너무 이르면 선 팀이 압도하고 너무 늦으면 아무 효과가 없다.','우화이므로 중독·취함이 없다. 게임 시작 전 공개 배치하며 모두가 이 규칙을 알고 시작한다.'],examples:['생존 4명 중 둘이 악으로 의심받는 상황에서 사회자가 뱃사공을 발동했다. 죽은 다섯 명이 표를 되찾아 확실한 하수인 처형이 성사됐고, 마을은 그날 남은 악마까지 몰아붙여 승리했다.','사회자가 발동을 하루 미뤘다. 그 사이 악마가 마지막 정보원을 죽였고, 다음 날 유령표가 돌아왔을 때는 마을이 누구를 처형해야 할지 몰라 표가 흩어졌다.']},
  gardener:{howto:['캐릭터를 가방에서 뽑지 않고 사회자가 전원에게 직접 배정한다. 게임 시작 전 공개 배치하므로 모두가 이 사실을 안다.','플레이어 성향에 맞춰 배정한다. 처음 하는 사람에게는 판정이 단순한 캐릭터를, 노련한 사람에게는 어려운 캐릭터를 주는 것이 본래 목적이다.','배정이 곧 균형 설계다. 특정인에게 몰아준다는 인상을 주지 않도록, 배정 이유를 게임 후에 설명할 수 있을 만큼 근거를 갖출 것.','마을은 사회자가 골랐다는 사실을 알기에 메타 추리를 시도한다. 평소 습관과 다른 배정을 섞어 읽히지 않게 할 것.'],examples:['처음 참가한 세 명에게 세탁부·요리사·군인처럼 판정이 단순한 캐릭터를 주고, 경험자에게 점쟁이와 임프를 맡겼다. 초보들이 자기 정보를 정확히 전달하면서 첫 게임치고 매끄럽게 굴러갔다.','노련한 플레이어에게 주정뱅이를 배정했다. 그는 자신이 세탁부라 믿고 강하게 주장했고, 그 확신이 마을을 이틀 동안 잘못된 방향으로 끌었다. 게임 후 사회자가 왜 그에게 줬는지 설명해 모두를 납득시켰다.']},
  knaves:{howto:['사회자 2명이 필요하다. 시작 전에 누가 진실 담당이고 누가 거짓 담당인지 둘이 정하고 플레이어에게는 알리지 않는다.','밤에 각 플레이어가 어느 사회자에게 갔는지 반드시 기록해 둘 것. 그래야 낮 논쟁에서 정보의 출처를 두 사람이 일관되게 유지할 수 있다.','게임당 1회, 황혼에 두 사회자가 역할을 바꿀 수 있다. 바꿀지는 두 사람이 합의해 정하며 플레이어에게 알리지 않는다.','거짓말의 범위를 어디까지 볼지는 시작 전에 두 사회자가 합의하고, 공식 위키에서 세부 판정을 확인할 것.'],examples:['점쟁이가 밤마다 왼쪽 사회자에게 갔다. 사흘 내내 아니오만 나왔고 마을은 점쟁이를 신뢰했다. 4일차에 처음 오른쪽 사회자에게 갔더니 예가 나왔고, 마을은 어느 쪽이 거짓인지를 두고 완전히 갈라졌다.','황혼에 두 사회자가 역할을 바꿨다. 그때까지 일관되게 어긋나던 초공감자의 숫자가 갑자기 좌석과 맞아떨어졌고, 마을은 그 변화를 초공감자의 중독이 풀린 것으로 오해했다.']},
  tor:{howto:['첫날 밤 하수인 정보와 악마 정보를 건너뛴다. 아무도 자기 캐릭터를 모르므로 블러프도 주지 않는다.','밤에 능력이 발동하는 캐릭터는 그냥 깨워 정보를 준다. 본인은 자기가 왜 그 정보를 받는지 모른 채 받는다.','플레이어가 죽으면 "당신은" 토큰과 캐릭터 토큰을 보여주고 엄지로 진영을 알려준다. 그때부터 그는 자기가 무엇이었는지 알고 유령으로 참여한다.','악마조차 자기가 악마인 줄 모르므로 밤 살해와 선택 능력의 처리 방침을 시작 전에 세워 둘 것. 진행 난도가 매우 높으니 공식 위키에서 세부 판정을 확인할 것.'],examples:['첫날 밤 아무에게도 시작 정보를 주지 않았다. 낮이 되자 모두가 아무것도 모른다고 말했고 논의는 순수한 행동 관찰만으로 진행됐다. 처형된 첫 희생자가 자기 캐릭터를 확인하고 유령이 되어서야 판에 첫 사실 하나가 생겼다.','3일차에 죽은 플레이어가 자기가 하수인이었음을 그제야 알게 됐다. 그때까지 그는 진심으로 마을을 도우려 했고, 선한 근거로 쌓여 있던 그의 발언 기록 때문에 마을의 추리 틀이 통째로 흔들렸다.']},
  scapegoat:{howto:['발동은 전적으로 사회자 재량이다. 희생양과 같은 진영의 플레이어가 처형될 때 그 대신 희생양을 처형할 수 있다.','대신 처형되면 원래 대상은 살아남고, 그날의 처형은 소모된 것으로 처리한다.','균형 도구로 쓴다. 마을이 확실한 하수인을 너무 빨리 잡았을 때 판을 늘리거나, 반대로 마을이 몰릴 때는 발동하지 않으면 된다.','여행자이므로 희생양의 진영은 사회자만 안다. 마을은 발동 여부로 진영을 역추론하려 드니, 그 추론이 성립하게 둘지도 의식하고 결정할 것.'],examples:['마을이 확실한 독살범을 처형하려는 순간 사회자가 선한 희생양을 대신 처형했다. 독살범은 살아남았고 마을은 왜 하필 지금이냐며 혼란에 빠졌지만, 덕분에 하루 더 긴 게임이 됐다.','악한 희생양이 있던 판. 마을이 하수인을 처형하려 할 때 사회자는 발동하지 않고 그대로 진행했다. 다음 날 무고한 주민을 처형할 때도 발동하지 않아, 마을은 희생양을 선한 쪽으로 오판한 채 끝까지 갔다.']},
  bureaucrat:{howto:['첫날 밤부터 매일 밤 지목한다. 자기 자신은 고를 수 없다.','지목 사실은 대상에게도 알리지 않는다. 다음 날 그 사람이 손을 들면 3표로 계산해 발표하므로, 집계 전에 토큰 위치를 반드시 확인할 것.','죽은 플레이어를 지목해도 된다. 유령표가 3표가 되므로 막판 처형 성립에 결정적일 수 있다.','매일 밤 갱신되므로 어제의 3표 토큰을 치우는 걸 잊지 말 것 — 가장 흔한 진행 실수다.'],examples:['관료가 조용한 주민을 지목했다. 다음 날 접전에서 그가 손을 들자 3표가 되어 하수인 처형이 성사됐고, 마을은 관료가 선한 편이라는 심증을 굳혔다.','악한 관료가 죽은 하수인을 지목했다. 마지막 날 그 유령표 3표가 무고한 주민의 처형을 성립시켰고, 선 팀은 마지막 기회를 그대로 날렸다.']},
  matron:{howto:['마님이 있는 동안 사적 대화가 금지된다. 전원이 자리에 앉아 있어야 하며 대화는 이웃과만 가능하다 — 이 규칙 자체가 마님의 본체다.','하루에 최대 3쌍까지 자리를 바꾸게 할 수 있다. 요청이 오면 즉시 집행하고, 좌석에 의존하는 캐릭터의 판정 기준이 바뀐다는 점을 기억할 것.','밤 정보는 어제 좌석이 아니라 지금 좌석으로 계산해야 한다. 좌석표를 매일 갱신하라.','사적 대화 금지는 선한 정보 공유를 크게 제약해 판이 느려지고 악 팀이 유리해지는 경향이 있다. 인원과 대본을 보고 투입할 것.'],examples:['마님이 초공감자와 그 왼쪽 이웃의 자리를 맞바꿨다. 그날 밤 숫자가 1에서 0으로 바뀌자 마을은 좌석 변경 전후를 대조해 악한 플레이어의 위치를 상당히 좁힐 수 있었다.','마님이 서로 짜고 있던 두 사람을 떼어 놓으려 자리를 바꿨다. 사적 대화가 금지된 상태라 둘은 신호를 맞출 방법이 없었고, 다음 날 두 사람의 발언이 어긋나면서 악 팀의 호흡이 무너졌다.']},
  voudon:{howto:['부두술사가 살아 있는 동안 산 사람 중에는 부두술사 본인만 투표할 수 있다. 투표 시작 전에 매번 소리 내어 상기시킬 것.','죽은 플레이어는 유령표 소모 없이 매번 투표할 수 있다. 과반 규칙도 적용되지 않으므로 표를 가장 많이 받은 지명이 처형된다.','지명은 통상대로 살아 있는 플레이어가 한다. 제한되는 것은 투표뿐이라는 점을 헷갈리지 말 것.','부두술사가 죽거나 퇴출되면 즉시 통상 규칙으로 돌아간다. 그 전환 시점을 전원에게 명확히 공표하라.'],examples:['생존 6명 중 죽은 사람이 네 명인 판에 부두술사가 들어왔다. 유령들이 매일 투표하면서 처형이 계속 성사됐고, 살아 있는 마을 사람들은 발언으로 유령을 설득하는 것 외에 할 수 있는 게 없었다.','악한 부두술사가 마지막 날 유일한 생존 투표권으로 무고한 주민에게 표를 던졌다. 유령 표가 갈린 상황이라 그 한 표로 최다 득표가 되어 처형이 성립했고, 선 팀은 승리 직전에 무너졌다.']},
  butcher:{howto:['첫 처형이 확정된 뒤에도 백정은 추가로 지명할 수 있다. 하루에 두 번 처형이 일어날 수 있으므로 낮 진행 순서를 미리 안내할 것.','두 번째 처형이 성사되면 그날 생존자가 두 명 줄어든다. 판이 급격히 짧아지므로 균형에 큰 영향이 있다.','이미 지명한 적이 있는 백정이 다시 지명할 수 있는지, 같은 사람을 다시 지명할 수 있는지 등 지명 제한의 세부 판정은 공식 위키에서 확인할 것.','여행자이므로 진영은 사회자만 안다. 악한 백정은 정보원을 하루에 둘씩 지워 낼 수 있다.'],examples:['마을이 확실한 하수인을 처형한 직후 백정이 곧바로 다른 유력 용의자를 지명했다. 두 번째 처형까지 성사되며 하루에 하수인과 악마가 함께 죽었고 게임이 그 자리에서 끝났다.','악한 백정이 첫 처형으로 무고한 사람이 죽은 뒤 남은 정보원을 지명했다. 마을은 이미 처형을 한 뒤라 경계가 풀려 있었고, 표가 그대로 모여 정보원까지 잃었다.']},
  doomsayer:{howto:['게임 시작 전 공개 배치. 생존자가 4명 이상일 때만 발동하며 3명 이하로 줄면 더는 쓸 수 없다.','선언은 낮에 공개로 한다. 선언자와 같은 진영의 플레이어 1명이 죽으며 누가 죽을지는 사회자가 고른다 — 선언자 본인을 고를 수도 있다.','각 플레이어당 게임 1회. 누가 썼는지 기록해 둘 것. 선언 자체가 그 사람의 진영을 사실상 노출한다는 점을 미리 알려 준다.','판이 늘어질 때 속도를 올리는 도구다. 죽을 사람을 고르는 것이 곧 균형 조정이므로, 정보가 많이 남은 쪽을 지울지 소진된 쪽을 지울지 매번 판단할 것.'],examples:['8일차까지 늘어진 판에서 마을 사람 하나가 파멸을 선언했다. 사회자는 이미 정보를 다 쓴 세탁부를 죽였다. 선언자가 선한 진영임이 확정되면서 마을은 그를 신뢰 축으로 삼아 남은 용의자를 빠르게 좁혔다.','하수인이 위장을 위해 파멸을 선언했다. 사회자는 악마 대신 그 하수인 본인을 죽이는 쪽을 택했다. 마을은 선한 사람이 희생했다고 오해했지만, 악 팀은 하수인 하나를 잃고 수적으로 몰렸다.']},
  hellslibrarian:{howto:['게임 시작 전 공개 배치. 밤이나 정숙 요청 중에 떠드는 사람에게 나쁜 일이 일어날 수 있다고 미리 명확히 경고할 것.','나쁜 일의 내용은 사회자 재량이다. 하루 능력 무효화, 거짓 정보, 극단적으로는 사망까지 가능하니 위반 정도에 비례하게 고르라.','처음 위반에는 경고, 반복되면 집행이 무난하다. 다만 한 번도 집행하지 않으면 우화가 무의미해지므로 기준을 미리 정해 둘 것.','처벌이 그 사람의 캐릭터를 노출하지 않도록 주의하라. 갑자기 죽이면 마을이 그 자리를 정보원으로 오해할 수 있다.'],examples:['첫날 밤 두 사람이 계속 속닥거렸다. 사회자는 그중 점쟁이에게 그 밤 거짓 정보를 줬다. 다음 날 점쟁이의 판정이 좌석 추리와 어긋나면서 마을은 그를 주정뱅이로 의심했고, 점쟁이는 이유를 끝내 알지 못했다.','밤중에 웃음을 터뜨린 플레이어에게 사회자가 능력 없음 토큰을 붙였다. 그날 초공감자 숫자가 나오지 않자 본인은 중독됐다고 믿고 낮에 그렇게 발표했고, 마을은 있지도 않은 독살범을 이틀 동안 찾아 헤맸다.']},
  toymaker:{howto:['게임 시작 전 공개 배치. 첫날 밤에는 7인 미만이어도 하수인 정보와 악마 정보를 정상적으로 처리한다 — 소인원 게임을 굴리기 위한 우화다.','악마는 밤마다 공격하지 않기를 선택할 수 있고 게임 중 최소 한 번은 반드시 그렇게 해야 한다. 첫날 밤에 이 의무를 악마에게 분명히 알려 줄 것.','악마의 공격으로 게임이 끝날 수 있는 밤인데 의무가 아직 남아 있다면, 그 밤 악마를 깨우지 않고 공격 없음으로 처리한다. 마지막 밤 토큰으로 추적하라.','사망 없는 아침이 늘어난다. 마을은 수도사나 군인을 떠올리기 쉬우니 사회자는 어느 쪽도 암시하지 말 것.'],examples:['6인 게임에 장난감 장인을 넣었다. 하수인이 첫날 밤 악마를 정상적으로 알게 되면서 악 팀이 제대로 협력할 수 있었고, 소인원인데도 판이 끝까지 팽팽했다.','악마가 공격 없음을 마지막까지 아껴 뒀다. 생존 4명이 된 밤, 한 명만 더 죽으면 악 팀이 이기는 상황이었는데 의무가 남아 있어 공격이 막혔다. 아침을 맞은 마을은 그날 악마를 잡아 승리했다.']},
  sentinel:{howto:['게임 시작 전 공개 배치. 셋업에서 외지인을 표준보다 1명 늘리거나 1명 줄이거나 그대로 둘 수 있으며, 무엇을 골랐는지는 사회자만 안다.','외지인 수를 세는 정보의 신뢰도가 통째로 흔들린다. 사서의 손가락이나 남작 추론이 더는 확정 근거가 되지 못한다는 것이 파수꾼의 목적이다.','늘리거나 줄인 만큼 주민 수가 반대로 움직인다. 인원표를 다시 계산해 캐릭터 수를 맞출 것.','남작 같은 셋업 변경 캐릭터와 함께 쓰면 조정이 겹친다. 최종 구성을 종이에 적어 두고 시작하라.'],examples:['파수꾼으로 외지인을 하나 늘려 성자를 추가했다. 낮에 마을이 표준이면 외지인은 하나뿐이라며 주정뱅이 후보를 한 명으로 좁혔는데, 실제로는 둘이라 그 추리가 통째로 어긋났다.','파수꾼으로 외지인을 하나 줄여 외지인 0으로 시작했다. 사서가 손가락 0을 내자 마을은 표준대로면 하나는 있어야 한다며 사서를 주정뱅이로 의심했다. 사서는 멀쩡했지만 끝내 신뢰를 회복하지 못했다.']},
  steward:{howto:['첫날 밤 선한 플레이어 1명을 가리킨다. 누구를 보여줄지 셋업에서 미리 정해 두면 진행이 빠르다.','주정뱅이나 성자처럼 정보가 없는 외지인을 보여주면 확실한 선을 얻지만 활용도는 낮다. 강한 주민을 보여주면 그 주민이 곧 표적이 된다.','청지기가 중독·취함이면 악한 플레이어를 가리켜도 된다. 마을에 매우 강한 거짓 신뢰를 심을 수 있는 지점이다.','첫날 밤 한 번뿐이다. 이후에는 깨우지 않는다.'],examples:['청지기에게 성직자를 보여줬다. 낮에 청지기가 그 자리를 지목하자 성직자도 자기 정보를 공개해 둘이 함께 신뢰 축이 됐고, 악마는 그 둘을 최우선으로 노려야 하는 상황에 몰렸다.','첫날 밤 독살범이 청지기를 중독시켰다. 사회자는 하수인을 가리켰고, 다음 날 청지기가 그 하수인을 확실한 선으로 보증했다. 그 보증 하나로 하수인은 사흘을 안전하게 보냈다.']},
  shugenja:{howto:['첫날 밤 시계 방향인지 반시계 방향인지만 손짓으로 알려준다. 몇 자리 떨어졌는지는 알려주지 않는다.','양쪽 최근접 악의 거리가 같으면 어느 쪽을 알려줄지는 사회자 재량이다. 자주 발생하니 좌석표에서 미리 계산해 둘 것.','첩자나 늑대인간이 지정한 선한 플레이어처럼 등록이 걸린 캐릭터를 악으로 셀지가 핵심 재량 지점이다. 어느 쪽으로 정했는지 메모해야 이후 정보와 모순이 없다.','슈겐자가 중독·취함이면 반대 방향을 알려준다. 마을이 좌석 절반을 통째로 잘못 보게 되므로 파급이 매우 크다.'],examples:['슈겐자에게 시계 방향을 알려줬다. 낮에 공개되자 마을은 슈겐자 기준 시계 방향 절반에 수사를 집중했고, 반시계 쪽에 있던 독살범은 이틀 동안 논의에서 완전히 빠져 있었다.','양쪽 거리가 세 자리로 같아 사회자가 반시계 방향을 골랐다. 나중에 시계 방향 세 번째 자리에서도 하수인이 나오자 마을은 슈겐자가 중독됐다고 결론지었지만, 사실은 재량 판정이었을 뿐이다.']},
  balloonist:{howto:['셋업에서 외지인을 그대로 둘지 1명 늘릴지 정한다. 네 유형이 다 있어야 정보가 오래 이어지므로 외지인이 없으면 늘리는 쪽을 고려할 것.','첫날 밤은 아무나 가리켜도 된다. 그 다음부터는 직전에 보여준 플레이어와 유형이 다른 사람을 가리키므로, 마지막으로 보여준 유형을 토큰으로 반드시 표시해 둘 것.','유형은 알려주지 않고 사람만 가리킨다. 열기구 조종사는 매일 유형이 바뀐다는 사실만으로 역추론해야 한다.','중독·취함이면 유형 규칙을 무시하고 아무나 가리켜도 된다. 그래도 직전 유형 토큰은 계속 갱신해 둬야 중독이 풀렸을 때 이어갈 수 있다.'],examples:['열기구 조종사가 나흘 연속으로 네 명을 받았다. 유형이 매일 달라야 하므로 그중 하나는 반드시 악마였다. 마을이 넷을 놓고 좁혀 가자 악마는 그 안에서 스스로를 지우려고 무리한 발언을 하다 꼬리를 밟혔다.','외지인이 전부 죽어 유형 하나가 사라졌다. 사회자는 남은 세 유형으로만 순환시켰고, 열기구 조종사는 그 반복을 보고 외지인이 전멸했음을 알아채 마을에 알렸다.']},
  fisherman:{howto:['게임당 1회. 낮에 요청이 오면 따로 불러 조언 한 마디를 준다. 사용하면 능력 없음 토큰을 붙일 것.','조언은 사실 정보가 아니라 어떻게 하면 이길지에 대한 방향 제시다. 누가 악마인지 직접 말하면 판이 그 자리에서 끝나 버린다.','조언의 강도가 곧 균형 조정이다. 선이 몰려 있으면 강하게, 선이 앞서 있으면 두루뭉술하게 준다.','어부가 중독·취함이면 해로운 조언을 줘도 된다. 다만 형식과 어조는 똑같이 유지해 상태를 노출하지 말 것.'],examples:['3일차, 마을이 두 후보를 놓고 갈렸을 때 어부가 사회자를 찾아왔다. 사회자는 오늘 처형하지 않으면 내일 아침이 훨씬 어두울 것이라고만 답했다. 마을은 처형을 강행했고 하수인을 잡았다.','어부가 첫날 낮에 성급히 능력을 썼다. 정보가 거의 없던 시점이라 사회자는 왼쪽 절반을 더 들여다보라는 정도밖에 줄 수 없었고, 그 조언은 나흘 뒤에야 의미를 얻었다.']},
  golem:{howto:['지명하는 순간 판정한다. 대상이 악마가 아니면 즉시 죽으며, 지명 자체는 그대로 진행되어 대상은 죽은 채로 투표 국면에 들어간다.','게임당 1회만 지명할 수 있다. 지명 불가 토큰으로 관리하고, 지명을 접수하기 전에 골렘 여부를 확인할 것.','대상이 악마면 아무 일도 일어나지 않는다. 골렘이 중독·취함이어도 똑같이 아무 일도 없으므로 두 경우가 겉으로 구분되지 않는다 — 이 모호함이 골렘의 값어치다.','외지인이지만 사실상 강력한 킬을 쥐고 있다. 마을이 골렘을 찾아내면 확실한 용의자를 지명해 달라는 압박이 낮의 축이 된다.'],examples:['골렘이 5일차에 유력 용의자를 지명했다. 대상은 즉시 죽었고 악마가 아니라는 사실만은 확정됐다. 마을은 남은 후보를 단숨에 좁혔지만 골렘의 지명권은 그것으로 소진됐다.','골렘이 진짜 악마를 지명했는데 아무 일도 일어나지 않았다. 마을은 골렘이 중독됐다고 결론 내리고 그 대상을 오히려 신뢰했다. 악마는 그 착각 위에서 이틀을 더 살아남았다.']},
  fearmonger:{howto:['매일 밤 지목한다. 첫날 밤에는 무조건, 이후에는 대상이 어제와 달라졌을 때만 공포 조장가가 새 대상을 골랐다고 전원에게 공표한다. 같은 대상을 유지하면 아무 말도 하지 않는다.','승리 조건이 까다롭다. 공포 조장가 본인이 지명했고 그 지명으로 처형까지 이뤄져야 한다 — 다른 사람이 지명한 처형은 발동하지 않는다.','대상이 선한 팀이면 선이, 악한 팀이면 악이 패배한다. 자기 팀 사람을 지목했다면 자멸 카드이므로 진행만 하고 표정을 바꾸지 말 것.','지명 시점과 처형 시점 중 어느 쪽의 중독·취함이 발동을 막는지는 애매하니 공식 위키에서 세부 판정을 확인할 것.'],examples:['첫날 밤 공포 조장가가 대상을 골랐고 사회자는 그 사실만 공표했다. 마을은 누군가가 표적이라는 공포에 눌려 아무도 적극적으로 지명하지 못했고, 첫 이틀이 처형 없이 흘러갔다.','4일차, 공포 조장가가 지목한 사람이 마을의 유력 용의자가 됐다. 공포 조장가가 직접 지명하자 마을은 함정이라고 의심했지만 이미 표가 모여 처형이 성사됐고, 선 팀이 그 자리에서 패배했다.']},
  legion:{howto:['셋업에서 대부분의 플레이어를 군단으로 채운다. 군단인 사람들은 서로가 군단인지 모르며 각자 자기가 군단이라는 사실만 안다.','매일 밤(첫날 제외) 한 명이 죽을 수도 있다. 누가 죽을지, 아무도 죽지 않을지 전부 사회자 재량이며 군단은 밤에 선택하지 않는다. 죽을 사람으로 군단을 고르는 것도 정상적인 진행이다.','처형 대상에게 악한 플레이어만 투표했다면 그 처형은 실패한다. 투표자 명단을 매번 기록하고, 실패 시 "아무 일도 일어나지 않습니다"라고만 공표할 것.','군단은 하수인으로도 등록된다. 수사관 정보나 하수인을 세는 능력이 군단을 가리킬 수 있으므로 재량 폭이 매우 넓다.'],examples:['12인 게임에서 아홉 명이 군단이었다. 마을이 한 명을 처형했는데 투표자가 전원 군단이라 처형이 실패했다. 아무 일도 일어나지 않는다는 공표에 판이 뒤집혔고, 선한 세 명은 처형에 반드시 자기 표를 넣어야 한다는 걸 그제야 깨달았다.','사회자가 밤마다 군단인 플레이어를 죽여 나갔다. 악마가 제 편을 죽이는 그림이라 마을은 사망자 패턴에서 아무것도 읽어 내지 못했고, 남은 선한 플레이어를 특정하는 데 끝내 실패했다.']}
};
</script>

<script>
/* ══════════════════ 밤 인터랙티브 위저드 ══════════════════
   씬 스키마 (에이전트 참고용 문서):
   NIGHT_FLOW[charId 또는 'minioninfo'/'demoninfo'] = { first:[Scene], other:[Scene] }  (해당 밤에만 쓰면 한쪽만)
   Scene 타입:
   - {t:'wake',  text?}                         : "○○을 깨우세요" 사회자 카드
   - {t:'note',  text}                          : 사회자 전용 안내 카드
   - {t:'pick-player', n, who:'player'|'st', label, filter:'alive'|'alive-not-self'|'any'|'any-not-self'|'dead', storeAs}
       who:'player'면 "플레이어가 지목한 대상을 탭" 문구. 선택 결과는 vars[storeAs]=[pid,...]
   - {t:'pick-character', pool, n?, label, storeAs}
       pool: 'inplay-townsfolk'|'inplay-outsider'|'inplay-minion'|'townsfolk'|'good-notinplay'|'any-edition'
   - {t:'show-token', from|char, caption}       : 📱 플레이어에게 보여주는 전체화면 — 캐릭터 토큰 1개
   - {t:'show-tokens', from, caption}           : 토큰 여러 개(블러프 등)
   - {t:'show-players', from, caption}          : 지목 대상 표시 화면
   - {t:'show-number', suggest?, caption}       : 숫자 선택(0~9) 후 전체화면 표시. suggest=WIZ_SUGGEST 키
   - {t:'show-answer', options, suggest?, caption}: 예/아니오류 선택 후 전체화면 표시
   - {t:'effect', fn, from}                     : 기존 판정 함수 호출(fn: doPoison|doProtect|doMaster|doImpKill|doCurse|doMad|doStepKill|doExorcist|doSailorDrunk|doInnkeeperDrunk|doCourtierDrunk, from=storeAs 첫 대상)
   - {t:'sleep', text?}                         : "재우세요" 카드
   show-* 씬은 화면 아무 곳이나 탭하면 다음으로 진행(폰을 플레이어에게 보여주는 용도).
   모든 문구는 자체 작성 원칙. */
let wiz=null;
function flowFor(stepId){
  const f=NIGHT_FLOW[stepId]; if(!f) return null;
  const first=S.phase.n===1;
  return first? (f.first||null) : (f.other||null);
}
function startWiz(stepId){
  /* 앞 위저드에 남은 사회자 대리 입력 예외와 기기 전달 상태를 버린다
     (정의는 뒤 블록 — typeof 가드 필요). handoff 가 남아 있으면 새 위저드의 첫 렌더가
     이전 단계의 전달 화면을 그린다. 복구 스냅샷(S.handoffDraft)은 여기서 지우지 않는다 —
     바로 아래에서 되살려야 한다. */
  if(typeof clearSTHandoff==='function') clearSTHandoff();
  if(typeof clearHandoff==='function') clearHandoff();
  const srcScenes=flowFor(stepId); if(!srcScenes) return;
  const scenes=srcScenes.map(s=>{const o=Object.assign({},s); delete o._val; delete o._shown; return o;});
  const c=charOf(stepId);
  /* 까마귀지기·현자·이발사·사랑꾼은 '죽어야' 깨는 단계다(DEATH_TRIGGER_STEPS) — 생존자만
     걸러 holder 를 비우면 오작동 경고바(wizWarnBar)·기기 전달 대상(startHandoff)·건달
     판정(goonPickCheck)이 통째로 빠진다. 생존 보유자를 먼저 쓰고, 없으면 사망한 보유자를 쓴다.
     주정뱅이 위장 단계는 시트에 그 캐릭터의 보유자가 없으므로 nightSteps() 의 mask 와 같은
     기준(tb + S.drunkMaskChar)으로 주정뱅이 본인을 holder 로 잡는다. */
  const all=c? playersByChar(stepId) : [];
  const masked=(S.edition==='tb' && S.drunkMaskChar===stepId)? S.players.find(p=>p.charId==='drunk') : null;
  const holder=all.find(p=>p.alive) || all[0] || masked || null;
  wiz={stepId, idx:0, vars:{}, holder, scenes};
  /* 기기 전달 도중 탭이 날아가 저장돼 있던 선택을 되살린다 — 같은 밤·같은 단계일 때만.
     조용히 넣으면 사회자가 남의 지목을 본인 것으로 오해하므로 반드시 알린다. */
  try{
    const d=S.handoffDraft;
