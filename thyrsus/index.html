<meta charset="utf-8">
<title>티르소스</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#1a0a2e; --panel:#200e2f; --raised:#2d1b4e; --sunken:#0d0520; --line:#3d2a5c;
  --text:#e9e0cc; --muted:#b8a88a; --accent:#c4a24d; --accent-soft:rgba(196,162,77,.14);
  --primary:#7b5cd6; --primary-soft:rgba(123,92,214,.20);
  --good:#4a90d9; --good-soft:rgba(74,144,217,.15);
  --evil:#d94a4a; --evil-soft:rgba(217,74,74,.15);
  --outsider:#22d3ee; --outsider-soft:rgba(34,211,238,.13);
  --minionc:#fb923c; --minionc-soft:rgba(251,146,60,.14);
  --warn:#dfae4a; --warn-soft:rgba(223,174,74,.13);
  --ok:#7fb069; --ok-soft:rgba(127,176,105,.14);
  --danger:#c0473f; --on-accent:#1a1030;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1f8; --outsider:#0e7490; --outsider-soft:rgba(14,116,144,.10); --minionc:#c2540a; --minionc-soft:rgba(194,84,10,.10); --panel:#fbfafe; --raised:#ffffff; --sunken:#e9e5f2; --line:#ddd6ea;
    --text:#28223a; --muted:#6f6885; --accent:#8a6a25; --accent-soft:rgba(138,106,37,.12);
    --primary:#6547c0; --primary-soft:rgba(101,71,192,.12);
    --good:#2f66a3; --good-soft:rgba(47,102,163,.10);
    --evil:#b23f37; --evil-soft:rgba(178,63,55,.10);
    --warn:#a4771c; --warn-soft:rgba(164,119,28,.12);
    --ok:#4a7c47; --ok-soft:rgba(74,124,71,.12);
    --danger:#a83a32; --on-accent:#fff;
    --shadow:0 4px 16px rgba(60,50,30,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f1f8; --outsider:#0e7490; --outsider-soft:rgba(14,116,144,.10); --minionc:#c2540a; --minionc-soft:rgba(194,84,10,.10); --panel:#fbfafe; --raised:#ffffff; --sunken:#e9e5f2; --line:#ddd6ea;
  --text:#28223a; --muted:#6f6885; --accent:#8a6a25; --accent-soft:rgba(138,106,37,.12);
  --primary:#6547c0; --primary-soft:rgba(101,71,192,.12);
  --good:#2f66a3; --good-soft:rgba(47,102,163,.10);
  --evil:#b23f37; --evil-soft:rgba(178,63,55,.10);
  --warn:#a4771c; --warn-soft:rgba(164,119,28,.12);
  --ok:#4a7c47; --ok-soft:rgba(74,124,71,.12);
  --danger:#a83a32; --on-accent:#fff;
  --shadow:0 4px 16px rgba(60,50,30,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,h4,.serif{font-family:'Gowun Batang','Noto Serif KR',serif}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:7px 14px;transition:border-color .15s, background .15s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.danger{border-color:var(--danger);color:var(--danger)}
button.ghost{background:transparent}
button.small{padding:3px 9px;font-size:12.5px;border-radius:6px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--sunken);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px}
textarea{width:100%;resize:vertical}
.num{font-variant-numeric:tabular-nums;word-break:normal;overflow-wrap:normal}

/* ── top bar ── */
#topbar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
#topbar .inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#brand{display:flex;align-items:baseline;gap:9px}
#brand h1{margin:0;font-size:21px;letter-spacing:.06em;color:var(--accent)}
#brand .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
#phasechip{display:flex;align-items:center;gap:8px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
#phasechip .plabel{font-weight:700;font-size:14px}
#phasechip .plabel.night{color:var(--good)}
#phasechip .plabel.day{color:var(--warn)}
#quickstats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;align-items:center}
.qstat{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.qstat b{color:var(--text);font-size:14px}
#layout{display:grid;grid-template-columns:216px minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto;align-items:start}
#sidenav{position:sticky;top:64px;padding:14px 10px;display:flex;flex-direction:column;gap:3px}
#sidenav button{display:flex;align-items:center;gap:10px;border:none;background:transparent;color:var(--muted);border-radius:9px;padding:10px 14px;font-size:14px;text-align:left;width:100%}
#sidenav button:hover{background:var(--primary-soft);color:var(--text)}
#sidenav button.active{background:var(--primary-soft);color:var(--text);font-weight:700;box-shadow:inset 3px 0 0 var(--primary)}
#sidenav .icn{width:20px;text-align:center;opacity:.9}
#subtabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:0}
#subtabs[hidden]{display:none!important}
#subtabs button{border:none;background:transparent;color:var(--muted);border-radius:8px 8px 0 0;padding:8px 14px;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
#subtabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{padding:18px 18px 90px;min-width:0;overflow-x:clip}
@media (max-width:880px){
  #layout{grid-template-columns:1fr}
  /* teeroz식 하단 고정 탭바 */
  #sidenav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:70;flex-direction:row;justify-content:space-around;gap:0;
    padding:6px calc(4px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(4px + env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.35)}
  #sidenav button{flex-direction:column;gap:2px;width:auto;flex:1;padding:6px 2px;font-size:11px;white-space:nowrap;border-radius:10px;align-items:center}
  #sidenav button .icn{width:auto;font-size:20px;line-height:1.2}
  #sidenav button.active{box-shadow:none;background:var(--primary-soft)}
  main{padding:12px calc(12px + env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  /* 상단바 슬림 */
  #topbar .inner{padding:8px 12px;gap:8px}
  #brand h1{font-size:18px}
  #brand .sub{display:none}
  #themebtn{margin-left:auto}
  #quickstats{order:9;margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;gap:6px;scrollbar-width:none}
  #quickstats::-webkit-scrollbar{display:none}
  .qstat{white-space:nowrap;flex:0 0 auto}
  /* 터치 타깃·카드 — 최소 44pt 확보 */
  button{min-height:44px}
  button.small{min-height:44px;min-width:44px}
  .card{padding:13px 14px;border-radius:12px}
  .grid2{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
  .chargrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
  .scriptgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
  /* 투표: 큰 버튼·줄맞춤 */
  .voterow{padding:8px 4px;gap:6px}
  .voterow .vname{min-width:84px;font-size:14px}
  .vbtn{padding:7px 14px;font-size:14px;min-height:44px;min-width:44px}
  .votemath{gap:8px}
  .vmbox{flex:1 1 96px;padding:8px 8px}
  .vmbox .vval{font-size:21px}
  /* 밤 진행 — 인라인 min-width:200px 가 좁은 화면에서 뷰포트를 넘지 않게 */
  .step .stepbody button.primary,.step .stepbody .row>input{min-width:0!important}
  .step .stephead{padding:12px 12px}
  .step .stepname{font-size:15.5px}
  .step .stepbody{padding:2px 12px 12px 12px}
  /* 원탁 축소 */
  .cseat{width:70px;margin-left:-35px;margin-top:-35px}
  .cseat .ctoken{width:42px;height:42px;font-size:19px}
  .cseat .cname{font-size:11px}
  .cseat .crole{font-size:9.5px}
  /* 시트 */
  .sheethead h2{font-size:20px}
  .sheettabs button{padding:10px 6px;font-size:13.5px}
  .sheetrow{gap:10px}
  .ctoken{flex-basis:40px;width:40px;height:40px;font-size:19px}
  .callorder{font-size:12px}
  .fieldrow{grid-template-columns:1fr}
}
/* 스크립트 카드 (teeroz 홈 스타일) */
.scriptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.scard{display:flex;gap:14px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s}
.scard:hover{border-color:var(--primary);background:var(--primary-soft)}
.scard.disabled{cursor:default;opacity:.55}
.scard.disabled:hover{border-color:var(--line);background:var(--raised)}
.scard .sicon{flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:var(--sunken);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--accent)}
.scard .sko{font-weight:700;font-size:15.5px}
.scard .sen{color:var(--muted);font-size:12px;font-style:italic}
.scard .smeta{color:var(--muted);font-size:11.5px;margin-top:3px}
.secthead{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:15px;font-weight:700;color:var(--text)}
.secthead:first-child{margin-top:0}
.secthead .shicon{color:var(--accent)}
.sheettabs{display:flex;gap:4px;margin:8px 0 14px;border-bottom:1px solid var(--line)}
.sheettabs button{border:none;background:transparent;color:var(--muted);border-radius:8px 8px 0 0;padding:9px 14px;border-bottom:2px solid transparent}
.sheettabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
/* ── 밤 인터랙티브 위저드 ── */
#wizard{position:fixed;inset:0;z-index:100;background:var(--sunken);display:flex;flex-direction:column}
#wizard[hidden]{display:none!important}
#wizhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#wizhead .wtitle{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px}
#wizhead .wstep{color:var(--muted);font-size:12.5px;margin-left:auto}
#wizbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;padding:20px;text-align:center}
#wizfoot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
#wizfoot button{flex:1;min-height:46px;font-size:15px}
.wiz-note{max-width:560px;font-size:16px;line-height:1.8}
.wiz-caption{font-size:15px;color:var(--muted);margin-bottom:18px}
.wiz-bigtoken{width:170px;height:170px;border-radius:50%;border:5px solid var(--accent);background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:84px;margin:0 auto 14px;box-shadow:0 0 60px var(--accent-soft)}
.wiz-bigname{font-family:'Gowun Batang',serif;font-size:32px;font-weight:700}
.wiz-bigsub{color:var(--muted);font-size:15px;font-style:italic}
.wiz-bignum{font-size:130px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.wiz-biganswer{font-size:72px;font-weight:700;font-family:'Gowun Batang',serif}
.wiz-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px}
.wiz-pickbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--raised);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:min(96px,100%);min-height:44px;cursor:pointer;font-size:14px}
.wiz-pickbtn .pt{font-size:34px}
.wiz-pickbtn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.wiz-pickbtn.dim{opacity:.45}
.wiz-showhint{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--muted);font-size:13px;animation:wizpulse 1.6s infinite}
@keyframes wizpulse{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.wiz-showhint{animation:none}}
.wiz-warnbar{background:var(--evil-soft);border:1px solid var(--evil);border-radius:10px;padding:8px 14px;font-size:14px;max-width:560px;margin-bottom:16px}
/* ── 게임 설정 스테퍼 ── */
.setsteps{display:flex;align-items:flex-start;margin:6px 0 22px}
.setstep{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer}
.setstep .dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;background:var(--raised);border:2px solid var(--line);color:var(--muted)}
.setstep.done .dot{background:#2d7a4f;border-color:#2d7a4f;color:#fff}
.setstep.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setstep .slab{font-size:12px;color:var(--muted)}
.setstep.cur .slab{color:var(--text);font-weight:700}
.setline{flex:1;height:2px;background:var(--line);margin-top:22px;min-width:24px}
body.wizopen #sidenav{display:none!important}
body.wizopen main{padding-bottom:20px}
.ready-hero{text-align:center;padding:28px 10px 8px}
.ready-hero .rh-icon{font-size:76px;line-height:1}
.ready-hero h3{font-size:22px;margin:14px 0 4px}
.ready-hero p{color:var(--muted);margin:0 0 22px}
.bigactions{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.bigactions button{min-height:52px;font-size:16px;border-radius:12px}
.bigactions .gold{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.wiz-players{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.wiz-shownplayer{display:flex;flex-direction:column;align-items:center;gap:6px}
.wiz-shownplayer .pp{width:110px;height:110px;border-radius:50%;border:4px solid var(--good);background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
.wiz-shownplayer .pn{font-size:22px;font-weight:700}
section.tabpane{display:none}
section.tabpane.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
.card h3{margin:14px 0 8px;font-size:15.5px}
.card p.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;border:1px solid var(--line)}
.pill.townsfolk{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.pill.outsider{color:var(--outsider);border-color:var(--outsider);background:var(--outsider-soft)}
.pill.minion{color:var(--minionc);border-color:var(--minionc);background:var(--minionc-soft)}
.pill.demon{color:#fff;border-color:var(--evil);background:var(--evil)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.neutral{color:var(--muted)}

.token{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.token.poison{background:var(--evil-soft);color:var(--evil);border:1px solid var(--evil)}
.token.drunkT{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.token.protect{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.token.herring{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.token.master{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.token.custom{background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.token .x{cursor:pointer;opacity:.7;font-weight:400}
.token .x:hover{opacity:1}

/* player cards */
.pcard{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--accent)}
.pcard.dead{opacity:.62;background:var(--panel)}
.pcard.dead .pname{text-decoration:line-through}
.pcard .pname{font-weight:700;font-size:15px}
.pcard .prole{font-family:'Gowun Batang',serif;font-size:14px}
.pcard .tokens{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:10px}
.pcard .pbtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.seat{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted)}

/* night stepper */
.step{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;overflow:hidden}
.step.wake{border-left-color:var(--accent)}
.step.done{opacity:.55;border-left-color:var(--ok)}
.step.skip{opacity:.45}
.step > .stephead{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.step > .stephead:hover{background:var(--accent-soft)}
.step .stepnum{font-size:12px;color:var(--muted);min-width:22px;text-align:right}
.step .stepname{font-family:'Gowun Batang',serif;font-weight:700;font-size:16px}
.step .stepwho{color:var(--muted);font-size:13px}
.step .stepbody{display:none;padding:2px 16px 14px 46px;border-top:1px dashed var(--line)}
.step.open .stepbody{display:block}
.guide{font-size:14px}
.guide ol,.guide ul{margin:6px 0;padding-left:20px}
.guide li{margin:3px 0}
.alertbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.alertbox.red{border-color:var(--evil);background:var(--evil-soft)}
.alertbox.blue{border-color:var(--good);background:var(--good-soft)}
.alertbox b{font-weight:700}

/* vote */
.votemath{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.vmbox{flex:1 1 130px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
.vmbox .vlab{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.vmbox .vval{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.vmbox.pass .vval{color:var(--ok)} .vmbox.fail .vval{color:var(--evil)}
.voterow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.voterow:last-child{border-bottom:none}
.voterow .vname{min-width:110px;font-weight:500}
.voterow.deadrow .vname{color:var(--muted);text-decoration:line-through}
.vbtn{border-radius:6px;padding:3px 12px;font-size:13px}
.vbtn.sel-yes{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.vbtn.sel-no{background:var(--evil);border-color:var(--evil);color:#fff;font-weight:700}

 ability:'매일 밤(첫날 제외), 자신이 아닌 1명을 지목한다. 그 플레이어는 오늘 밤 악마로부터 안전하다.',
 first:false, other:true,
 guideOther:['수도사를 깨운다.','자신을 제외한 1명을 지목하게 한다.','🛡보호 토큰을 그 플레이어에게 놓는다.','수도사를 재운다.'],
 warn:['보호는 "악마의 공격"만 막는다 — 처형·처단자·성결자는 못 막는다.','임프가 보호 대상을 지목하면: 아무 일도 일어나지 않는다(사망 없음). 임프에게 실패를 알리지 않는다.','수도사가 중독/술취함이면 보호가 작동하지 않는다 — 대상이 죽을 수 있다!'],
 remind:['보호는 그 밤에만 유효 — 새벽에 자동 해제된다.']},

{id:'ravenkeeper', ko:'까마귀지기', en:'Ravenkeeper', type:'townsfolk',
 ability:'밤에 죽으면 깨어나 1명을 지목하고, 그 플레이어의 캐릭터를 알게 된다.',
 first:false, other:true, conditional:'오늘 밤 사망한 경우에만',
 guideOther:['까마귀지기가 오늘 밤 죽었을 때만(임프 공격 직후) 깨운다.','1명을 지목하게 한다.','그 플레이어의 캐릭터 토큰을 보여준다.','재운다. (죽었음은 새벽에 공표)'],
 warn:['첩자를 지목하면 선한 캐릭터로 보여줄 수 있고, 은둔자는 악한 캐릭터로 보여줄 수 있다(재량).','중독/술취함 상태로 죽었으면 거짓 캐릭터를 보여줄 수 있다.','임프가 일부러 까마귀지기를 죽여 정보를 흘리게 만들 수도 있음을 기억.'],
 remind:['밤 사망시에만. 처형으로 죽으면 발동하지 않는다.']},

{id:'virgin', ko:'성결자', en:'Virgin', type:'townsfolk',
 ability:'최초로 지명당했을 때, 지명자가 마을 주민이면 그 지명자가 즉시 처형된다. (1회)',
 first:false, other:false, dayAbility:true,
 dayGuide:['성결자가 처음 지명당하는 순간 발동을 판정한다.','지명자가 (등록상) 마을 주민이면: 지명자는 즉시 처형되어 죽는다. 그날의 처형은 이것으로 끝 — 추가 처형 불가.','지명자가 외지인·하수인·악마면: 아무 일도 없고 지명 절차는 그대로 진행.','발동 여부와 무관하게, 최초 지명이 지나가면 능력은 소진된다.'],
 warn:['주정뱅이는 외지인이므로 발동하지 않는다 — 본인이 주민이라 믿어도.','첩자가 지명하면 "마을 주민으로 등록"되어 발동시킬 수도 있다(재량!).','성결자가 중독/술취함이면 발동하지 않는다. 단, 능력 소진은 그대로 진행.','발동 처형은 장의사가 확인하는 "처형"이며, 성자(Saint) 규칙과는 무관(지명자가 처형되는 것).'],
 remind:['미발동 상태인지 지명 때마다 확인 — 투표 패널이 자동 경고한다.']},

{id:'slayer', ko:'처단자', en:'Slayer', type:'townsfolk',
 ability:'게임 중 단 한 번, 낮에 공개적으로 1명을 지목한다. 그 플레이어가 악마라면 즉시 죽는다.',
 first:false, other:false, dayAbility:true,
 dayGuide:['처단자가 공개적으로 능력을 선언하고 지목하면 즉시 판정한다.','지목 대상이 (등록상) 악마면: 그 자리에서 사망. 처형이 아니므로 장의사·성자와 무관.','아니면: "아무 일도 일어나지 않습니다"라고 공표.','성공이든 실패든 능력은 소진된다.'],
 warn:['은둔자가 지목되면 악마로 등록되어 죽을 수 있다(재량 — 극적인 순간을 만들 수 있다).','처단자가 중독/술취함이면 진짜 악마를 지목해도 불발.','처단자가 아닌 플레이어가 처단자인 척 지목하면: 똑같이 침착하게 "아무 일도 없습니다" — 리액션으로 정보를 흘리지 말 것.','임프 사망 시: 생존 5인 이상이면 탕녀 계승 체크!'],
 remind:['능력 사용 여부를 그리모어에 기록(사용 시 자동 소진 표시).']},

{id:'soldier', ko:'군인', en:'Soldier', type:'townsfolk',
 ability:'악마에게 죽지 않는다.',
 first:false, other:false, passive:true,
 warn:['임프가 군인을 지목하면 아무 일도 일어나지 않는다. 임프에게 실패를 알리지 않는다.','군인이 중독/술취함이면 그날 밤엔 죽을 수 있다!','처형·성결자 등 악마 외의 사망은 그대로 적용된다.'],
 remind:[]},

{id:'mayor', ko:'시장', en:'Mayor', type:'townsfolk',
 ability:'생존자가 3명일 때 그날 처형이 없으면 선한 팀이 승리한다. 밤에 죽게 되면, 사회자 재량으로 다른 플레이어가 대신 죽을 수 있다.',
 first:false, other:false, passive:true,
 warn:['임프가 시장을 지목하면 3가지 선택지: ① 시장이 죽는다 ② 다른 플레이어가 대신 죽는다(사회자 선택) ③ 아무도 안 죽는다? — 공식적으로는 "다른 플레이어가 죽을 수 있다"이므로 ①·② 중 재량. 게임 균형을 보고 결정.','시장이 중독/술취함이면: 총알받이 능력도, 3인 승리 조건도 작동하지 않는다.','3인 생존 + 처형 없이 낮 종료 → 즉시 선한 팀 승리. 낮 패널이 자동 경고한다.'],
 remind:['생존자 3명이 되면 항상 시장 승리 조건을 염두에 둘 것.']},

/* ───────── 외지인 4 ───────── */
{id:'butler', ko:'집사', en:'Butler', type:'outsider',
 ability:'매일 밤 주인 1명을 지목한다. 다음 날 주인이 투표할 때만 자신도 투표할 수 있다.',
 first:true, other:true, voteRelated:true,
 guideFirst:['집사를 깨운다.','자신이 아닌 1명을 주인으로 지목하게 한다.','🤵주인 토큰을 그 플레이어에게 놓는다.','집사를 재운다.'],
 guideOther:['집사를 깨운다.','주인을 새로 지목하게 한다(매일 밤 갱신, 자신 제외).','🤵주인 토큰을 옮긴다.','집사를 재운다.'],
 warn:['투표 규칙: 주인이 찬성(거수)한 경우에만 집사도 찬성할 수 있다. 주인이 손을 내리면 집사도 낼 수 없다.','집사가 지명하는 것 자체는 가능하다 — 투표만 제한된다.','집사가 중독/술취함이면 자유 투표 가능하나, 본인은 모른다(사회자만 아는 사실 — 굳이 알리지 않는다).','죽은 집사는 능력이 사라져 자유롭게(토큰으로) 투표할 수 있다.'],
 remind:['투표 패널이 주인 거수 여부를 자동 체크한다.']},

{id:'drunk', ko:'주정뱅이', en:'Drunk', type:'outsider',
 ability:'자신이 마을 주민이라고 믿지만, 실제로는 주정뱅이다. 능력은 작동하지 않는다.',
 first:false, other:false, passive:true, setupChar:true,
 setupNote:'게임 시작 전, 어떤 마을 주민으로 위장시킬지 정한다. 그 주민의 토큰을 보여주며 시작하되 그리모어에는 주정뱅이+위장 토큰을 함께 둔다.',
 warn:['위장 캐릭터의 밤 순서에 똑같이 깨우고, 정보는 임의로 준다 — 대개 거짓이 유효하지만 반드시 거짓일 필요는 없다(정체 보호를 위해 참을 줘도 됨).','사서 정보에 "주정뱅이"으로 잡힐 수 있다(외지인이므로).','성결자를 지명해도 발동시키지 못한다(외지인).','장의사에게는 "주정뱅이" 토큰을 보여준다.','주정뱅이에게 준 정보는 게임 내내 일관성 있게 관리하라 — 매 밤 무엇을 말했는지 메모 필수.'],
 remind:['밤 순서에 위장 캐릭터 자리로 자동 삽입된다.']},

{id:'recluse', ko:'은둔자', en:'Recluse', type:'outsider',
 ability:'악한 플레이어로, 하수인이나 악마로 등록될 수 있다. 실제로는 선하다.',
 first:false, other:false, passive:true,
 warn:['"등록될 수 있다" = 사회자 재량. 매번 다르게 판정해도 된다.','적용처: 수사관·요리사·초공감자·점쟁이·장의사·까마귀지기 정보, 처단자 지목(죽을 수 있다!), 임프로 등록되어 처형 시 게임이 끝난 척? — 아니다: 은둔자 처형으로 게임은 끝나지 않지만, "악마가 죽었다"고 등록·공표하는 것은 불가(게임 종료는 실제 악마 사망만).','재량 원칙: 은둔자를 악으로 등록하는 것은 선한 팀을 혼란시키는 도구다. 과용하면 은둔자만 억울해진다 — 게임당 1~2회의 결정적 순간에.'],
 remind:['정보 캐릭터 판정 때마다 은둔자 등록 여부를 의식적으로 결정할 것.']},

{id:'saint', ko:'성자', en:'Saint', type:'outsider',
 ability:'처형으로 죽으면 선한 팀이 패배한다.',
 first:false, other:false, passive:true, voteRelated:true,
 warn:['오직 "처형"만 해당 — 임프에게 밤에 죽는 것, 처단자 오발 등은 무관.','성자가 중독/술취함 상태에서 처형되면: 패배하지 않는다! (능력 오작동) — 독살범의 강력한 플레이.','투표 패널이 성자 지명 시 자동 경고한다.'],
 remind:['성자 지명·처형 직전에 반드시 중독 여부 확인.']},

/* ───────── 하수인 4 ───────── */
{id:'poisoner', ko:'독살범', en:'Poisoner', type:'minion',
 ability:'매일 밤 1명을 지목한다. 그 플레이어는 오늘 밤과 내일 낮 동안 중독된다.',
 first:true, other:true,
 guideFirst:['독살범을 깨운다.','1명을 지목하게 한다(자신·악마 포함 가능).','☠중독 토큰을 놓는다 — 오늘 밤 + 내일 낮 유지, 내일 황혼(밤 시작)에 자동 해제.','독살범을 재운다.'],
 guideOther:['독살범을 깨운다.','새 대상을 지목하게 한다.','이전 중독 토큰은 황혼에 이미 해제됨 — 새 토큰을 놓는다.','독살범을 재운다.'],
 warn:['독살범이 밤 순서 맨 앞(정보 캐릭터들보다 먼저)인 이유: 오늘 밤의 정보 캐릭터를 중독시켜 거짓 정보를 줄 수 있게 하기 위해서다.','중독 = 능력 오작동: 정보형은 거짓 정보 가능, 발동형(수도사 보호·군인 면역·성결자·성자·탕녀 계승 등)은 불발.','독살범 자신이 중독/술취함이면 그날 밤 독이 퍼지지 않는다.','중독은 누적 기록이 중요 — 그리모어가 자동 관리한다.'],
 remind:['매 밤 대상 갱신. 이전 대상 해제 확인.']},

{id:'spy', ko:'첩자', en:'Spy', type:'minion',
 ability:'매일 밤 그리모어를 볼 수 있다. 선한 플레이어, 마을 주민, 외지인으로 등록될 수 있다.',
 first:true, other:true,
 guideFirst:['밤 순서 마지막에 첩자를 깨운다.','그리모어(이 화면의 그리모어 탭 상태)를 충분히 보여준다.','첩자를 재운다.'],
 guideOther:['밤 순서 마지막에 첩자를 깨워 그리모어를 보여준다.','첩자를 재운다.'],
 warn:['이 도구를 그대로 보여줘도 되고, 요약해서 보여줘도 된다 — 단, 충분한 시간을 줄 것.','등록 재량: 세탁부·사서·수사관·요리사·초공감자·점쟁이·장의사·까마귀지기 정보, 성결자 발동(첩자가 지명 시 "주민 등록"으로 발동시킬 수 있음!)에 모두 적용.','일관성 원칙: 한 게임에서 첩자를 "선"으로 등록하기로 했다면 근거 없이 오락가락하지 말 것. 균형이 필요할 때 의도적으로만.'],
 remind:['첩자가 살아있는 동안 매일 밤 마지막 순서.']},

{id:'scarletwoman', ko:'탕녀', en:'Scarlet Woman', type:'minion',
 ability:'생존자가 5명 이상일 때 악마가 죽으면, 자신이 그 악마가 된다.',
 first:false, other:true, conditional:'악마 계승 시에만',
 guideOther:['(악마 계승이 일어난 날 밤에만) 탕녀를 깨운다.','임프 토큰을 보여주며 "당신이 이제 임프"임을 알린다.','이후 임프 순서에 따라 살해를 진행하게 한다.'],
 warn:['발동 조건: 악마 사망 시점의 생존자(악마 포함 계산 전) 5인 이상. 4인 이하면 발동하지 않고 선한 팀 승리.','처형·처단자 어느 쪽이든 악마가 죽으면 즉시 계승 — 게임은 끝나지 않는다. 태연하게 밤으로 진행하라.','임프가 자살(자기 지목)한 경우: 사회자가 하수인 중 하나를 임프로 만든다 — 탕녀가 있으면 그녀가 관례적 우선이지만 재량이다.','탕녀가 중독/술취함 상태면 계승이 불발된다 — 악마 사망 = 게임 종료! 처형 전 반드시 확인.'],
 remind:['악마가 지명·처형 위기일 때마다 생존자 수와 탕녀 중독 여부 확인(투표 패널 자동 경고).']},

{id:'baron', ko:'남작', en:'Baron', type:'minion',
 ability:'구성 변경: 외지인이 2명 늘어난다. (마을 주민 −2)',

 setupNote:'남작이 뽑히면 마을 주민 −2, 외지인 +2로 구성을 바꾼 뒤 역할을 배분한다. 밤에는 깨지 않는다.',
 warn:['수사관 정보에 잡힐 수 있는 것 외에는 밤 활동이 전혀 없다.','외지인이 많다는 사실 자체가 단서가 된다 — 사서·구성 논쟁을 지켜보는 재미를 살릴 것.'],
 remind:[]},

/* ───────── 악마 1 ───────── */
{id:'imp', ko:'임프', en:'Imp', type:'demon',
 ability:'매일 밤(첫날 제외) 1명을 지목해 죽인다. 자신을 지목해 죽으면, 하수인 하나가 임프가 된다.',
 first:false, other:true,
 guideOther:['임프를 깨운다.','1명을 지목하게 한다(자신 포함 가능).','판정 순서: ① 대상이 수도사 보호 중? → 사망 없음 ② 대상이 군인? → 사망 없음 ③ 대상이 시장? → 재량으로 다른 사람 사망 가능 ④ 그 외 → 사망.','자신을 지목했다면: 임프 사망 → 사회자가 선택한 생존 하수인이 임프가 된다(★ 별 넘기기). 그 하수인을 깨워 임프 토큰을 보여준다.','임프를 재운다. 사망자가 있으면 이어서 까마귀지기 체크.'],
 warn:['임프가 중독/술취함이면 그날 밤 살해 불발 — 아무도 죽지 않는다.','첫날 밤엔 깨우지 않는다(7인 이상이면 악마 정보만).','별 넘기기 시 탕녀가 있으면 그녀에게 넘기는 것이 관례(그녀의 능력과 시너지)지만 재량이다.','사망자가 까마귀지기면 즉시 까마귀지기 순서로.'],
 remind:['살해 대상 지목 시 보호/군인/시장/중독을 이 도구의 살해 판정 버튼으로 처리하면 자동 체크된다.']},
{id:'acrobat',ko:'곡예사',en:'Acrobat',type:'townsfolk',edition:'exp',first:false,other:true,ability:'매일 밤(첫날 제외) 1명을 선택한다. 그 사람이 오늘 밤 취함·중독 상태이거나 그렇게 되면 곡예사가 죽는다.',guideFirst:[],guideOther:['곡예사를 깨운다.','플레이어 1명을 지목하게 한다.','곡예사를 재운다.','그 대상이 오늘 밤 취함·중독 상태이면(이후에 그렇게 되는 경우 포함) 곡예사 사망 처리.'],warn:['곡예사 본인이 취함·중독이면 능력이 오작동 — 조건이 맞아도 죽지 않을 수 있다.','판정은 그 밤 전체 기준 — 선택 이후 대상이 중독돼도 죽는다.'],remind:['밤 순서 후반에 판정해 그 밤의 취함·중독 변동을 반영하라.']},
{id:'alchemist',ko:'연금술사',en:'Alchemist',type:'townsfolk',edition:'exp',first:true,other:false,ability:'하수인 능력 하나를 가지고 시작한다. 그 능력을 사용할 때 사회자가 다른 선택을 하도록 유도할 수 있다.',guideFirst:['연금술사를 깨운다.','그가 가진 하수인 캐릭터 토큰을 보여준다.','그 능력이 첫날 밤 능력이면 이어서 진행한다.','연금술사를 재운다.'],guideOther:[],warn:['어떤 하수인 능력을 줄지는 사회자가 게임에 없는 하수인 중에서 고른다.','연금술사는 선한 주민 — 악 팀은 그를 모르고 그도 악 팀을 모른다.','중독·취함이면 그 하수인 능력도 오작동한다.'],remind:['얻은 능력이 밤 능력이면 해당 하수인의 밤 순서에 깨워 진행하라.','능력 사용 내역을 별도로 기록하라.']},
{id:'alsaahir',ko:'알사히르',en:'Alsaahir',type:'townsfolk',edition:'exp',first:false,other:false,ability:'매일 낮, 공개적으로 어느 플레이어들이 하수인이고 누가 악마인지 추측해 전부 맞히면 선한 팀이 승리한다.',guideFirst:[],guideOther:[],warn:['추측은 공개 선언이어야 하며 하수인 전원과 악마를 모두 정확히 맞혀야 한다.','알사히르가 취함·중독이면 정답이어도 승리가 발동하지 않는다.'],remind:['하루 1회 기준으로 운영하고, 오늘 선언이 있었는지 기록하라.']},
{id:'amnesiac',ko:'기억상실자',en:'Amnesiac',type:'townsfolk',edition:'exp',first:true,other:true,ability:'자신의 능력이 무엇인지 모른다. 매일 낮 사회자에게 비공개로 능력을 추측하면 얼마나 정확한지 듣는다.',guideFirst:['사회자가 설계한 능력이 첫날 밤에 작동하면 깨워서 진행한다.'],guideOther:['설계한 능력이 밤 능력이면 해당 순서에 깨워 진행한다.'],warn:['능력은 사회자가 미리 자유 설계 — 지나치게 강하거나 약하지 않게.','추측 정확도 답변은 차갑다·미지근하다·뜨겁다 같은 단계 표현이 운영하기 쉽다.'],remind:['설계한 능력 전문을 반드시 적어 두라.','중독·취함이면 능력이 오작동하고 추측 답변도 부정확해질 수 있다.']},
{id:'atheist',ko:'무신론자',en:'Atheist',type:'townsfolk',edition:'exp',first:false,other:false,setupChar:true,ability:'사회자는 게임 규칙을 깰 수 있다. 무신론자가 처형되면 죽어 있어도 선한 팀이 승리한다. 구성 변경: 악한 캐릭터 없음.',setupNote:'셋업 시 악한 캐릭터가 전혀 없다 — 전원 선. 사회자가 악의 존재를 연기한다.',guideFirst:[],guideOther:[],warn:['악마가 없으므로 가짜 밤 사망·거짓 정보로 평범한 게임처럼 연출한다.','규칙 파괴는 무신론자가 게임에 있을 때만 허용된다.','사회자 측이 이기는 길은 선이 무신론자를 처형하지 못한 채 통상 패배 조건에 이르게 하는 것.'],remind:['무신론자 처형 즉시 선 승리로 게임 종료 — 놓치지 마라.']},
{id:'banshee',ko:'밴시',en:'Banshee',type:'townsfolk',edition:'exp',first:false,other:true,conditional:'악마에게 사망 시',ability:'악마가 밴시를 죽이면 전원이 그 사실을 알게 된다. 그 후 밴시는 매일 지명을 2회 할 수 있고, 지명마다 2표를 행사할 수 있다.',guideFirst:[],guideOther:[],warn:['공표하는 것은 밴시가 죽었다는 사실뿐 — 어느 플레이어인지는 밝히지 않는다.','악마의 킬로 죽었을 때만 발동 — 처형이나 다른 원인의 사망은 해당 없음.','죽을 때 중독·취함 상태였다면 발동하지 않는다(공표도 없다).'],remind:['발동 후 죽은 밴시는 사망자 투표 제한 없이 매일 지명 2회·지명당 2표 — 낮 진행 시 잊지 마라.','아침 사망 공표 때 밴시 발동 문구를 함께 선언하라.']},
{id:'bountyhunter',ko:'현상금 사냥꾼',en:'Bounty Hunter',type:'townsfolk',edition:'exp',first:true,other:true,setupChar:true,ability:'첫날 밤 악한 플레이어 1명을 알게 된다. 그가 죽으면 그날 밤 새 악한 플레이어를 알게 된다. 구성 변경: 주민 1명이 악 성향이다.',setupNote:'셋업 시 주민 1명이 악 성향으로 시작한다(캐릭터·능력은 그대로, 성향만 악).',guideFirst:['악 성향이 된 주민을 깨워 악임을 알린다.','현상금 사냥꾼을 깨운다.','악한 플레이어 1명을 가리킨다.','현상금 사냥꾼을 재운다.'],guideOther:['추적 중인 악 플레이어가 죽었다면: 현상금 사냥꾼을 깨워 다른 악한 플레이어 1명을 가리킨다.'],warn:['악이 된 주민은 악마·하수인 정보를 받지 않는다 — 자신이 악이라는 사실만 안다.','첩자 등록 재량에 따라 가리킬 대상이 달라질 수 있다.','중독·취함이면 선한 플레이어를 가리켜도 된다.'],remind:['현재 추적 중인 대상을 표시해 두고, 그가 죽는 밤에 갱신하라.']},
{id:'cannibal',ko:'식인종',en:'Cannibal',type:'townsfolk',edition:'exp',first:false,other:false,conditional:'처형 사망 시',ability:'가장 최근에 처형으로 죽은 사람의 능력을 가진다. 그가 악이었다면 다음에 선한 사람이 처형으로 죽을 때까지 식인종은 중독된다.',guideFirst:[],guideOther:[],warn:['얻은 능력은 본인에게 알려주지 않는다 — 능력이 작동하는 듯한 연출로 스스로 추리하게 하라.','악인을 먹어 중독된 동안에도 능력을 가진 척 거짓 정보를 줄 수 있다.','새 처형 사망이 나오면 이전 능력은 사라지고 교체된다.','1회용 능력은 식인종이 새로 얻을 때마다 다시 1회 쓸 수 있다.'],remind:['현재 보유 능력과 중독 여부를 기록하라.','얻은 능력이 밤 능력이면 그 캐릭터의 밤 순서에 식인종을 깨워라.']},
{id:'choirboy',ko:'성가대 소년',en:'Choirboy',type:'townsfolk',edition:'exp',first:false,other:true,setupChar:true,conditional:'왕 사망 시',ability:'악마가 왕을 죽이면, 성가대 소년은 어느 플레이어가 악마인지 알게 된다. 구성 변경: 왕 포함.',setupNote:'셋업 시 왕(King)이 반드시 게임에 포함된다.',guideFirst:[],guideOther:['악마가 왕을 죽인 밤: 성가대 소년을 깨운다.','악마 플레이어를 가리킨다.','성가대 소년을 재운다.'],warn:['왕이 처형 등 다른 원인으로 죽으면 발동하지 않는다.','성가대 소년이 중독·취함이면 엉뚱한 플레이어를 가리켜도 된다.'],remind:['왕의 사망 원인을 확인하라 — 악마 킬일 때만 발동.']},
{id:'cultleader',ko:'교주',en:'Cult Leader',type:'townsfolk',edition:'exp',first:true,other:true,ability:'매일 밤, 살아 있는 이웃 중 한 명과 같은 성향이 된다. 선한 플레이어 전원이 교단 가입을 선언하면 교주의 팀이 승리한다.',guideFirst:['교주를 깨운다.','성향이 바뀌었다면 새 성향을 신호로 알려준다.','교주를 재운다.'],guideOther:['교주를 깨운다.','성향이 바뀌었다면 새 성향을 신호로 알려준다.','교주를 재운다.'],warn:['양옆 이웃 중 어느 쪽 성향을 따르게 할지는 사회자 선택 — 매일 바뀔 수 있다.','악이 된 교주는 악 팀 정보를 받지 않고, 악 팀도 교주를 모른다.','가입은 각자 자유 선언이고 언제든 철회할 수 있다 — 전원 가입 순간 교주 팀 승리.'],remind:['교주의 현재 성향을 매일 밤 갱신해 기록하라.','승리 판정 전에 전원 가입 선언이 유효한지 확인하라.']},
{id:'engineer',ko:'기술자',en:'Engineer',type:'townsfolk',edition:'exp',first:true,other:true,ability:'게임당 1회, 밤에 어떤 하수인들이 게임에 있을지 또는 어떤 악마가 있을지 정한다.',guideFirst:['기술자를 깨운다.','능력을 쓰면: 하수인 구성 전체 또는 악마 캐릭터 하나를 지정하게 한다.','지정대로 교체하고, 바뀐 악 플레이어들을 깨워 새 캐릭터를 알린다.','기술자를 재운다.'],guideOther:['아직 능력을 안 썼다면 깨워서 사용 여부를 묻고, 쓰면 첫날 밤과 같이 처리한다.'],warn:['하수인 쪽과 악마 쪽 중 한쪽만 지정할 수 있다.','중독·취함이면 지정이 반영되지 않는다(구성 유지).','새 악마·하수인의 셋업형 능력은 이미 지난 셋업을 소급하지 않는다 — 재량 처리.'],remind:['사용 여부(게임당 1회)를 표시하라.','교체된 캐릭터의 밤 순서 변화를 반영하라.']},
{id:'farmer',ko:'농부',en:'Farmer',type:'townsfolk',edition:'exp',first:false,other:true,conditional:'밤 사망 시',ability:'농부가 밤에 죽으면, 살아 있는 선한 플레이어 1명이 농부가 된다.',guideFirst:[],guideOther:['농부가 밤에 죽었다면: 살아 있는 선한 플레이어 1명을 골라 깨운다.','농부 토큰을 보여줘 새 농부가 되었음을 알린다.','재운다.'],warn:['처형 등 낮 사망에는 발동하지 않는다 — 밤 사망만.','새 농부의 원래 캐릭터 능력은 사라지고 농부로 완전히 교체된다.','새 농부도 밤에 죽으면 다시 연쇄된다.'],remind:['누가 현재 농부인지 토큰을 옮겨 기록하라.']},
{id:'general',ko:'장군',en:'General',type:'townsfolk',edition:'exp',first:true,other:true,ability:'매일 밤, 사회자가 판단하기에 지금 어느 편이 이기고 있는지(선·악·백중) 알게 된다.',guideFirst:['장군을 깨운다.','엄지 위(선 우세)·아래(악 우세)·옆(백중) 신호를 보여준다.','장군을 재운다.'],guideOther:['장군을 깨운다.','현재 판세 신호를 보여준다.','장군을 재운다.'],warn:['사회자의 솔직한 판단이어야 한다 — 정보라기보다 판세 신호다.','중독·취함이면 반대 신호를 줘도 된다.'],remind:['신호 체계(위·아래·옆)를 첫날 밤 전에 정해 두라.']},
{id:'king',ko:'왕',en:'King',type:'townsfolk',edition:'exp',first:true,other:true,ability:'매일 밤, 죽은 사람이 산 사람보다 많거나 같으면 살아 있는 캐릭터 하나를 알게 된다. 악마는 누가 왕인지 안다.',guideFirst:['악마를 깨워 왕이 누구인지 가리켜 준다.','첫날 밤에는 사망자가 없으므로 왕 본인은 깨우지 않는다.'],guideOther:['죽은 사람 수가 산 사람 수 이상이면: 왕을 깨운다.','살아 있는 캐릭터 토큰 하나를 보여준다.','왕을 재운다.'],warn:['보여주는 것은 캐릭터 토큰 — 어느 플레이어인지는 알려주지 않는다.','왕이 중독·취함이면 게임에 없는 캐릭터를 보여줘도 된다.'],remind:['매일 밤 생존·사망 인원을 세어 조건을 확인하라.']},
{id:'lycanthrope',ko:'늑대인간',en:'Lycanthrope',type:'townsfolk',edition:'exp',first:false,other:true,killer:true,ability:'매일 밤(첫날 제외) 살아 있는 1명을 선택한다. 그 대상이 선하면 죽고, 그 밤에는 악마가 아무도 죽이지 못한다. 선한 플레이어 1명은 악으로 등록된다(사회자 지정).',guideFirst:[],guideOther:['늑대인간을 깨운다.','살아 있는 1명을 지목하게 한다.','늑대인간을 재운다.','대상이 선이면 사망 처리하고, 그 밤 악마의 킬만 무효로 한다 — 다른 원인의 사망은 그대로 진행한다.','대상이 악이면 아무 일도 없고 밤은 정상 진행된다.'],warn:['막히는 것은 악마의 킬뿐이다 — 암살자·푸카 등 다른 원인의 밤 사망은 그대로 일어난다.','셋업에서 선한 플레이어 1명을 악으로 등록되도록 지정해 둔다 — 늑대인간이 그를 골라도 죽지 않는다.','늑대인간이 중독·취함이면 대상이 선이어도 죽지 않고 악마 킬도 막지 못한다.','은둔자·첩자의 등록 재량이 선악 판정에 개입할 수 있다.'],remind:['늑대인간이 선을 죽인 밤에는 악마의 킬만 무효 처리하라 — 다른 사망 원인은 그대로 유지.','악으로 등록되는 선한 플레이어 1명을 게임 시작 전에 정해 기록하라.']},
{id:'magician',ko:'마술사',en:'Magician',type:'townsfolk',edition:'exp',first:true,other:false,ability:'악마는 마술사를 자기 하수인이라 알고, 하수인들은 마술사를 악마라 안다.',guideFirst:['하수인 정보 단계: 악마 표시로 진짜 악마와 마술사 두 명을 함께 가리킨다.','악마 정보 단계: 하수인 목록에 마술사를 포함해 가리킨다.','마술사 본인은 깨우지 않는다.'],guideOther:[],warn:['악마에게는 하수인이 한 명 많아 보이고, 하수인에게는 악마 후보가 둘로 보인다.','악마가 마술사를 하수인으로 여겨 밤 킬을 피하게 되는 것이 핵심 효과.','첫날 밤 정보에만 영향을 준다 — 이후 밤에는 할 일이 없다.'],remind:['첫날 밤 하수인·악마 정보 순서 전에 마술사 존재를 확인하라.']},
{id:'nightwatchman',ko:'야경꾼',en:'Nightwatchman',type:'townsfolk',edition:'exp',first:true,other:true,ability:'게임당 1회, 밤에 1명을 선택한다. 그 사람은 야경꾼이 누구인지 알게 된다.',guideFirst:['야경꾼을 깨운다.','능력을 쓰면 1명을 지목하게 한다.','야경꾼을 재운다.','지목된 사람을 깨워 야경꾼이 누구인지 가리켜 주고 재운다.'],guideOther:['아직 능력을 안 썼다면 깨워서 사용 여부를 묻고, 쓰면 첫날 밤과 같이 처리한다.'],warn:['야경꾼이 중독·취함이면 대상을 깨우지 않거나 엉뚱한 사람을 야경꾼이라 가리켜도 된다.','악한 플레이어에게 쓰면 정체만 노출된다 — 선택은 본인 몫.'],remind:['사용 여부(게임당 1회)를 표시하라.']},
{id:'poppygrower',ko:'양귀비 재배자',en:'Poppy Grower',type:'townsfolk',edition:'exp',first:true,other:true,conditional:'사망 시',ability:'하수인과 악마는 서로를 모른 채 시작한다. 양귀비 재배자가 죽으면 그날 밤 서로를 알게 된다.',guideFirst:['하수인 정보 단계와 악마 정보 단계에서 서로를 가리켜 주지 않는다.','악마 블러프 3개는 평소대로 보여준다.'],guideOther:['양귀비 재배자가 죽었다면 그 밤: 하수인들과 악마를 깨워 서로를 알려준다.'],warn:['처형으로 죽어도 그날 밤 상견례를 진행한다.','악 팀이 서로 모르는 동안 하수인 능력의 대상 지정 등이 꼬일 수 있다 — 재량 처리.','양귀비 재배자가 중독·취함 상태로 시작하면 악 팀이 평소처럼 서로를 알게 해도 된다.'],remind:['사망한 밤의 상견례를 잊지 마라 — 놓치면 악 팀이 계속 서로를 모른다.']},
{id:'preacher',ko:'설교자',en:'Preacher',type:'townsfolk',edition:'exp',first:true,other:true,ability:'매일 밤 1명을 선택한다. 선택된 하수인은 설교받았음을 알게 되고 능력을 잃는다.',guideFirst:['설교자를 깨운다.','1명을 지목하게 한다.','설교자를 재운다.','지목이 하수인이면: 그 하수인을 깨워 설교받았음을 알린다.'],guideOther:['설교자를 깨운다.','1명을 지목하게 한다.','설교자를 재운다.','지목이 하수인이면: 그 하수인을 깨워 설교받았음을 알린다.'],warn:['설교받은 하수인은 설교자가 멀쩡한 한 계속 능력이 없다.','설교자가 죽거나 중독·취함이 되면 하수인들의 능력이 돌아온다.','설교자가 중독·취함 상태에서 지목한 하수인은 능력을 잃지 않는다(알림 여부는 재량).'],remind:['설교받은 하수인 전원에게 표시 토큰을 붙여라.']},
{id:'princess',ko:'공주',en:'Princess',type:'townsfolk',edition:'exp',first:false,other:true,ability:'공주의 첫째 날에 공주가 지명한 플레이어가 처형됐다면, 그날 밤 악마는 아무도 죽이지 못한다.',guideFirst:[],guideOther:[],warn:['공주 본인의 지명이 실제 처형으로 이어져야 발동한다.','막는 것은 악마의 킬뿐 — 다른 원인의 밤 사망은 그대로 진행된다.','공주가 중독·취함이면 악마 킬이 정상 진행된다.'],remind:['첫째 날 공주의 지명·처형 여부를 기록하라.','발동한 밤에도 악마는 평소처럼 깨워 지목시키되 사망 처리만 하지 않는다.']},
{id:'snitch',ko:'밀고자',en:'Snitch',type:'outsider',edition:'exp',first:true,other:false, ability:'각 하수인은 첫날 밤 블러프(게임에 없는 캐릭터) 3개를 받는다.', guideFirst:['하수인 정보 시점에 각 하수인을 차례로 깨운다 — 밀고자 본인은 깨우지 않는다.','하수인마다 게임에 없는 캐릭터 3개를 보여준다 — 하수인끼리 같아도, 악마 블러프와 겹쳐도 된다(재량).'], guideOther:[], warn:['밀고자가 중독/술취함이면: 블러프를 주지 않거나, 게임에 있는 캐릭터를 섞은 거짓 블러프를 줘도 된다.','악마 블러프와의 조합을 미리 설계하면 악 팀의 거짓말이 매끄러워진다 — 균형 재량.'], remind:['첫날 밤 이후 발동 없음.']},
{id:'zealot',ko:'광신자',en:'Zealot',type:'outsider',edition:'exp',first:false,other:false,passive:true,voteRelated:true, ability:'생존자가 5명 이상이면 모든 지명에 반드시 찬성표를 던져야 한다.', guideFirst:[],guideOther:[], warn:['의무는 광신자 본인의 것 — 투표를 잊으면 조용히 상기시켜라.','생존자 4명 이하가 되면 의무가 사라져 자유 투표.','광신자가 중독/술취함이면 의무 없음.','죽으면 능력이 사라진다 — 유령표를 강제로 쓰게 하지 마라.'], remind:['생존자 수 5명 경계 체크.'], dayNotice:'✋ 광신자: 생존 5인 이상이면 매 지명에 손을 들어야 한다 — 투표마다 확인.'},
{id:'hatter',ko:'모자 장수',en:'Hatter',type:'outsider',edition:'exp',first:false,other:true,conditional:'사망한 날 밤', ability:'낮이나 밤에 죽으면, 그날 밤 하수인·악마 플레이어들이 각자 새 하수인·악마 캐릭터로 바뀌기를 선택할 수 있다.', guideFirst:[], guideOther:['모자 장수가 오늘 죽었다면 그 밤 하수인들과 악마를 깨운다.','악마는 새 악마 캐릭터를, 각 하수인은 새 하수인 캐릭터를 고를 수 있다(유지도 가능).','토큰을 교체하고 그리모어를 갱신한다 — 이후 능력은 새 캐릭터 기준.'], warn:['유형은 유지 — 하수인은 하수인으로만, 악마는 악마로만.','이미 게임에 있는 캐릭터나 서로 간 중복 선택은 불허(재량 조정).','새 캐릭터의 [대괄호] 셋업 효과는 적용하지 않는다.','모자 장수가 중독/술취함 상태로 죽으면 발동 없음.'], remind:['1회성 — 죽은 그 밤에만 진행.']},
{id:'hermit',ko:'은자',en:'Hermit',type:'outsider',edition:'exp',first:true,other:true,setupChar:true, ability:'대본의 모든 외지인 능력을 동시에 가진다. 구성 변경: 외지인 0 또는 −1.', setupNote:'셋업 시 외지인 수를 그대로 두거나 1 줄인다(주민 수로 보정).', guideFirst:['대본의 각 외지인 능력을 그 캐릭터의 밤 순서 위치에서 은자에게 적용한다 — 깨어나는 능력이 있으면 그때마다 깨운다.'], guideOther:['동일 — 해당하는 외지인 능력들의 밤 순서에 맞춰 진행.'], warn:['능력 간 충돌·중복은 사회자 재량으로 정합적으로 정리 — 게임 전에 처리 방침을 정해둬라.','은자가 중독/술취함이면 모든 외지인 능력이 무효.','정보·상태량이 많은 캐릭터다 — 그리모어 메모를 아끼지 마라.'], remind:['적용 중인 외지인 능력 목록을 메모해두면 실수를 막는다.']},
{id:'plaguedoctor',ko:'역병 의사',en:'Plague Doctor',type:'outsider',edition:'exp',first:false,other:true,passive:true,conditional:'사망 시', ability:'죽으면 사회자가 하수인 능력 하나를 얻는다.', guideFirst:[],guideOther:[], warn:['보통 게임에 없는 하수인의 능력을 골라, 사회자가 그 하수인인 것처럼 밤 순서에 맞춰 운용한다.','[대괄호] 셋업 효과는 적용하지 않는 것이 원칙.','역병 의사가 중독/술취함 상태로 죽으면 능력을 얻지 않는다.','여러 캐릭터와 공식 징크스가 있다 — 대본에 함께 있으면 위키 확인.'], remind:['사망 시 어떤 하수인 능력을 얻을지 미리 구상해두면 진행이 매끄럽다.']},
{id:'ogre',ko:'오거',en:'Ogre',type:'outsider',edition:'exp',first:true,other:false, ability:'첫날 밤 자신이 아닌 1명을 지목해 그 플레이어의 진영이 된다(어느 쪽인지 모른다). 중독/술취함이어도 작동한다.', guideFirst:['오거를 깨운다.','자신을 제외한 1명을 지목하게 한다.','그 플레이어의 진영에 맞춰 오거의 진영을 몰래 바꾼다 — 오거에게는 아무것도 알려주지 않는다.','오거를 재운다.'], guideOther:[], warn:['능력문에 명시된 대로 중독/술취함이어도 진영 변경은 일어난다.','첩자·은둔자를 지목하면 등록 재량 적용 가능 — 첩자를 선으로 등록해 오거를 선하게 둘 수도 있다.','오거의 진영은 정보 판정·승패 계산에 실제로 반영된다.'], remind:['오거의 현재 진영을 그리모어에 표시.']},
{id:'heretic',ko:'이단자',en:'Heretic',type:'outsider',edition:'exp',first:false,other:false,passive:true, ability:'승자는 패자가 되고 패자는 승자가 된다 — 이단자가 죽어 있어도 적용된다.', guideFirst:[],guideOther:[], warn:['게임 종료 판정 직후 승패를 뒤집는다 — 악마 처형으로 끝나면 악이 승리.','이단자가 그 시점에 중독/술취함이면 뒤집지 않는다.','공식 징크스가 매우 많은 캐릭터 — 대본 제작 단계에서 조합을 걸러라.'], remind:['승패 선언 전에 이단자 상태(생사 무관, 중독 여부)를 확인.']},
{id:'puzzlemaster',ko:'퍼즐 명인',en:'Puzzlemaster',type:'outsider',edition:'exp',first:false,other:false, ability:'게임 시작부터 1명이 취해 있으며, 퍼즐 명인이 죽어도 유지된다. (게임당 1회) 그 취한 플레이어를 맞히면 악마 플레이어를 알게 되고, 틀리면 거짓 정보를 받는다.', guideFirst:[],guideOther:[], warn:['게임 시작 시 취할 플레이어를 정해 🍺 토큰 — 퍼즐 명인이 죽어도 풀리지 않는다.','추측은 사회자에게 하는 1회성 선언 — 맞으면 진짜 악마를, 틀리면 그럴듯한 거짓 답을 줘라. 본인이 어느 쪽인지 구분할 수 없어야 한다.','퍼즐 명인이 중독/술취함일 때 추측하면 거짓 정보를 줘도 된다.'], remind:['취함 대상과 추측 사용 여부 표시.'], dayNotice:'🧩 퍼즐 명인: 낮에 추측이 들어올 수 있다 — 답변을 준비해둬라.'},
{id:'vizier',ko:'재상',en:'Vizier',type:'minion',edition:'exp',first:true,other:false,passive:true,voteRelated:true, ability:'모든 플레이어가 재상이 누군지 안다. 재상은 낮에는 죽지 않는다. 선한 플레이어가 찬성표를 던진 지명을 즉시 처형시킬 수 있다.', guideFirst:[],guideOther:[], warn:['첫날 밤이 끝난 아침, 재상이 누구인지 공개 선언하라.','낮 사망 면역 — 처형·처단자 등으로 죽지 않는다(처형 절차 자체는 유효하게 진행).','즉시 처형: 선한 플레이어가 1명이라도 찬성한 지명에서 재상이 원하면 피지명자를 즉시 처형한다 — 그것이 그날의 처형이 된다.','재상이 중독/술취함이면 낮에 죽을 수 있고 즉시 처형도 불가 — 단 신분은 이미 공개된 상태.'], remind:['첫날 아침 공개 선언을 잊지 마라.'], dayNotice:'👑 재상: 선한 표가 나온 지명에서 즉시 처형 선언 가능 — 투표마다 주시.'},
{id:'boffin',ko:'괴짜 과학자',en:'Boffin',type:'minion',edition:'exp',first:true,other:false, ability:'악마가 게임에 없는 선한 캐릭터의 능력 하나를 가진다(악마가 중독/술취함이어도 유지). 둘 다 어떤 능력인지 안다.', guideFirst:['괴짜 과학자와 악마를 깨워 부여된 선한 캐릭터 토큰을 보여준다.'], guideOther:[], warn:['부여할 능력은 사회자가 고른다 — 그 능력의 밤 순서에 맞춰 악마를 깨워 운용하라.','악마의 중독/술취함을 무시하는 건 부여된 능력뿐 — 악마 본연의 능력은 평소대로 영향받는다.','[대괄호] 셋업 효과가 있는 능력은 피하거나 셋업 효과 없이 부여.','괴짜 과학자가 죽으면 부여 능력도 사라진다.'], remind:['부여한 능력 토큰을 악마 옆에 표시.']},
{id:'wraith',ko:'망령',en:'Wraith',type:'minion',edition:'exp',first:true,other:true, ability:'밤에 눈을 뜨기로 선택할 수 있다. 다른 악한 플레이어들이 깨어날 때 함께 깨어난다.', guideFirst:['다른 악한 플레이어(하수인·악마)를 깨우는 단계마다 망령도 함께 깨운다.','눈을 뜰지 감고 있을지는 망령 본인이 정한다 — 강제하지 않는다.','그 단계가 끝나면 함께 재운다.'],guideOther:['다른 악한 플레이어를 깨우는 단계마다 망령도 함께 깨운다 — 첫날 밤과 동일.'], warn:['망령에게는 지목·정보 능력이 없다 — 다른 악한 플레이어가 깨어나는 순간을 함께 보는 것이 전부다.','악 팀이 서로를 모르는 구성이면 망령이 눈을 떠도 정체가 드러나지 않도록 깨우는 순서를 설계하라.','망령이 중독·취함이면 깨우지 않거나 엉뚱한 타이밍에 깨워도 된다.'], remind:['악한 플레이어를 깨우는 모든 밤 단계에 망령을 함께 깨울 것(첫날 밤 포함).']},
{id:'wizard',ko:'마법사',en:'Wizard',type:'minion',edition:'exp',first:true,other:true,conditional:'1회 발동', ability:'게임당 1회, 소원을 빈다. 소원이 이뤄지면 대가가 따르고 단서가 남을 수 있다.', guideFirst:['마법사를 깨워 소원을 빌지 확인한다 — 빌면 몸짓·필담으로 내용을 받는다.','들어줄지, 어떤 대가·단서를 붙일지는 전적으로 재량 — 즉답하지 않고 나중에 효과를 내도 된다.'], guideOther:['소원을 아직 안 썼다면 매일 밤 동일하게 확인.'], warn:['게임을 망치는 소원은 거절하거나 비틀어라 — 거절 시 1회 소진 여부도 재량.','소원을 들어줬다면 대가와 단서로 균형을 맞춰라 — 선한 팀이 추리할 실마리를 남기는 운영이 권장된다.','마법사가 중독/술취함이면 소원은 이뤄지지 않는다(재량).'], remind:['소원 사용 여부·내용·약속한 대가를 반드시 메모.']},
{id:'mezepheles',ko:'메제펠레스',en:'Mezepheles',type:'minion',edition:'exp',first:true,other:true,conditional:'단어가 발화된 밤', ability:'첫날 밤 비밀 단어 하나를 알게 된다. 그 단어를 처음 말한 선한 플레이어는 그날 밤 악한 진영이 된다.', guideFirst:['단어는 미리 정해둔다 — 흔치 않지만 유도해 말하게 할 수는 있는 단어로.','메제펠레스를 깨워 단어를 적어 보여준다.'], guideOther:['오늘 선한 플레이어가 그 단어를 처음 말했다면, 그 밤 그를 깨워 엄지를 아래로 향해 악한 진영이 되었음을 알린다.'], warn:['진영만 바뀐다 — 캐릭터와 능력은 그대로.','전향은 최초 발화자 1명뿐.','메제펠레스가 그 시점에 중독/술취함이면 전향 없음 — 단어 소진 여부는 일관된 재량으로.','일상 대화에서 우연히 말해도 발동한다 — 판정을 놓치지 마라.'], remind:['단어를 그리모어에 기록.','전향 발생 여부 표시.']},
{id:'boomdandy',ko:'붐댄디',en:'Boomdandy',type:'minion',edition:'exp',first:false,other:false,passive:true,conditional:'처형 시', ability:'처형되면 3명만 남고 모두 죽는다. 이후 10부터 1까지 센 뒤, 가장 많은 지목을 받은 플레이어가 죽는다.', guideFirst:[],guideOther:[], warn:['처형 즉시 진행되는 급박한 절차 — 생존자를 3명으로 줄이는 세부 방식은 게임 전에 공식 위키의 진행법으로 확인해둬라.','카운트다운이 끝나면 전원이 1명씩 지목 — 최다 지목자가 죽는다. 동수면 재량(보통 아무도 안 죽거나 재지목).','붐댄디가 중독/술취함이면 처형돼도 아무 일 없음.','최후 2인에 악마가 남으면 악 승리로 직결될 수 있다 — 배치에 주의.'], remind:['처형 순간 절차가 급박하다 — 사전 숙지 필수.'], dayNotice:'💣 붐댄디: 처형되는 순간 폭발 절차 시작 — 진행법을 미리 숙지.'},
{id:'psychopath',ko:'사이코패스',en:'Psychopath',type:'minion',edition:'exp',first:false,other:false,killer:true, ability:'매일 낮 지명이 시작되기 전에 공개적으로 1명을 골라 죽일 수 있다. 처형될 경우 가위바위보에서 져야만 죽는다.', guideFirst:[],guideOther:[], warn:['살인은 공개 — 자신을 드러내고 죽이는 능력이다. 하루 1명, 지명 시작 전까지만.','사이코패스가 중독/술취함이면 선택해도 아무도 죽지 않는다.','처형 시 지명자와 가위바위보 — 지면 죽고 이기면 살아남는다. 비기면 다시 한다.','낮 사망이므로 밤 사망 전제 능력들과의 상호작용에 주의.'], remind:['오늘 살인 사용 여부 체크.'], dayNotice:'🔪 사이코패스: 지명 전 공개 살인 가능 — 선언이 나오면 즉시 사망 처리.'},
{id:'summoner',ko:'소환사',en:'Summoner',type:'minion',edition:'exp',first:true,other:true,setupChar:true,conditional:'3일째 밤', ability:'블러프 3개를 받는다. 3일째 밤 1명을 골라 원하는 악마로 만든다. 구성 변경: 악마 없이 시작.', setupNote:'셋업에서 악마 토큰을 배포하지 않는다 — 3일째 밤 소환 전까지 게임에 악마가 없다.', guideFirst:['소환사를 깨워 게임에 없는 캐릭터 3개(블러프)를 보여준다.'], guideOther:['3일째 밤에만: 소환사를 깨워 플레이어 1명과 악마 캐릭터 하나를 지목받는다.','그 플레이어를 그 악마로 교체(진영도 악으로) — 그 밤부터 악마 능력이 작동한다.'], warn:['3일째 밤에 소환사가 중독/술취함이면 사회자가 대상 플레이어와 악마를 대신 고른다.','소환 전에 소환사가 죽으면 악마가 등장할 수 없다 — 게임 종료 처리(악마 사망에 준함)는 공식 위키로 확인해둬라.','소환된 플레이어의 원래 캐릭터·능력은 사라진다.'], remind:['밤 카운터(1·2·3) 토큰 사용.','소환 후 그리모어 전면 갱신.']},
{id:'organgrinder',ko:'손풍금장이',en:'Organ Grinder',type:'minion',edition:'exp',first:true,other:true,voteRelated:true, ability:'모든 투표는 눈을 감고 진행되며 득표수는 비공개다. 매일 밤 자신이 다음 황혼까지 취할지 선택한다.', guideFirst:['손풍금장이를 깨워 다음 황혼까지 취할지 선택받는다(엄지 신호 등).'], guideOther:['매일 밤 동일.'], warn:['취함을 선택한 날은 능력이 꺼져 투표가 평소처럼 공개로 진행된다.','능력이 켜진 날: 지명마다 전원 눈 감고 거수 — 사회자만 집계하고 득표수는 비공개. 처형 결과 공개 시점·방식은 게임 전에 고지해둬라.','손풍금장이가 죽으면 즉시 공개 투표로 복귀.'], remind:['오늘 취함 선택 여부 표시 — 낮 투표 방식이 갈린다.'], dayNotice:'🎵 손풍금장이: 능력 활성일은 눈 감고 투표 + 득표수 비공개 — 매 지명 유지.'},
{id:'xaan',ko:'자안',en:'Xaan',type:'minion',edition:'exp',first:true,other:true,setupChar:true,conditional:'X일째 밤', ability:'X일째 밤, 모든 주민이 다음 황혼까지 중독된다. 구성 변경: 외지인 수가 X명이 된다.', setupNote:'셋업 시 외지인 수를 X로 바꾼다(주민 수로 보정). X는 사회자가 정하며 발동하는 밤 번호와 같다.', guideFirst:['X가 1이면 첫날 밤 모든 주민에게 ☠중독(다음 황혼까지).'], guideOther:['X일째 밤이 오면 모든 주민에게 ☠중독(다음 황혼까지) — 그 외의 밤엔 아무 일 없음.'], warn:['중독은 주민만 — 외지인·하수인·악마는 무관.','그 밤과 다음 낮의 주민 정보·능력이 전부 오염된다 — 거짓 정보를 일관되게 설계하라.','외지인 수를 세면 X를 역산할 수 있다 — 마을 쪽 추리 포인트.','자안이 X일째 밤에 중독/술취함이면 발동 없음(기회 소진 여부는 재량).'], remind:['X 값과 발동 여부 표시.','다음 황혼에 중독 일괄 해제.']},
{id:'harpy',ko:'하피',en:'Harpy',type:'minion',edition:'exp',first:true,other:true, ability:'매일 밤 2명을 고른다. 내일 첫 번째 플레이어는 두 번째 플레이어가 악하다는 광기에 사로잡혀야 하며, 어기면 한 명 또는 둘 다 죽을 수 있다.', guideFirst:['하피를 깨워 2명을 차례로 지목받는다.','첫 번째 플레이어를 깨워 하피 토큰을 보여주고 두 번째 플레이어를 가리킨다 — 내일 그가 악하다고 주장해야 함을 전달.'], guideOther:['매일 밤 동일 — 대상은 바꿔도 된다.'], warn:['광기 판정은 세레노버스와 같은 요령 — 성실히 주장하면 충족, 명백히 어기면 그 밤 한 명 또는 둘 다 죽일 수 있다(의무는 아님 — 재량).','하피가 중독/술취함이면 광기 의무 없음 — 첫 번째 플레이어를 깨우지 않거나 무효 처리.','죽인다면 보통 광기를 어긴 첫 번째 플레이어부터 — 재량.'], remind:['오늘의 광기 대상(1번→2번) 기록.','낮 동안 광기 이행을 관찰.']},
{id:'yaggababble',ko:'야가배블',en:'Yaggababble',type:'demon',edition:'exp',first:true,other:true,killer:true,
 ability:'첫날 밤에 비밀 문구 하나를 알게 된다. 그날 낮에 그 문구를 공개적으로 말한 횟수 1회마다, 플레이어 1명이 죽을 수 있다.',
 guideFirst:['야가배블을 깨워 사회자가 미리 정해 둔 비밀 문구를 보여준다(쪽지 권장).','야가배블을 재운다.'],
 guideOther:['깨우지 않는다 — 그날 낮의 문구 발화 횟수를 상한으로 사망자 수를 정해 처리(0명도 가능).'],
 warn:['"공개적으로"의 판정은 사회자 재량 — 전체가 들을 수 있는 발언만 세는 편이 안전.','문구는 대화에 섞을 수 있되 너무 쉽지 않게 — 길이·난이도가 곧 밸런스.','중독/취함이면 그 밤 사망 0명 처리.'],
 remind:['낮마다 발화 횟수 기록','사망 수는 상한일 뿐 의무가 아님 — 균형 재량']},
{id:'lilmonsta',ko:'릴 몬스타',en:"Lil' Monsta",type:'demon',edition:'exp',first:true,other:true,setupChar:true,killer:true,
 ability:'매일 밤 하수인들이 누가 릴 몬스타를 맡아 "악마가 될지" 고른다. 매일 밤(첫날 제외) 플레이어 1명이 죽을 수 있다. 구성 변경: 하수인 +1.',

<script>
/* ══════════════════ SABER · 시계탑 세이버메트릭스 스키마 ══════════════════
   야구 세이버메트릭스와 같은 문제의식 — 승패가 아니라 '개별 행동의 기여도'를 잰다.
   이 블록에는 데이터 계약과 계수만 둔다. 이벤트 적재(emit)와 집계(compute)는 별도.

   [왜 S.events 가 필요한가]
   S.log 는 {t:'밤 2', msg:'💀 홍길동(임프) 사망 — 임프의 공격'} 같은 사람용 문자열이다.
   실제로 showReplay() 의 _rpIcon() 은 msg 에 '처형'/'사망' 부분문자열이 있는지로만
   분류한다 — 이름에 그 글자가 들어가면 오분류되고, 행위자·대상·수치는 되찾을 수 없다.
   → S.log 는 서술용으로 그대로 두고, S.events 를 병행 적재해 계량은 여기서만 한다.

   [관측 등급 — 추측으로 지표를 만들지 않는다]
   'auto' 기존 상태(S.players / S.noms / p.diedAt / p.statuses / S.executed*)만으로 산출
   'semi' 사회자가 1탭 해야 완성 — 발화 기반(역할 선언·정보 공개)은 전부 여기
   'none' 이 앱이 원리상 관측 불가 → EXCLUDED 에 사유와 함께 명시하고 지표에서 뺀다

   [기여도의 정의]
   모든 지표는 누적이 아니라 '기대값 대비 초과분'이다(x- 접두).
     x지표 = Σ (실제 가치 − 같은 국면에서 무작위/평균 행위자의 기대 가치) × 상황 가중
   ══════════════════════════════════════════════════════════════════════════ */

  /* ── ② 상황 계수 ── */
  K: {LEV_EXP:0.7, LEV_MAX:2.6, TIM_SLOPE:0.12, TIM_MIN:0.7, TIM_MAX:1.8, MAL:0.25, DEADVOTE:0.8},

  /* 기대 게임 길이(낮 수). 악은 생존 2인에서 이기고 하루 1처형이 원칙이므로
     선한 팀의 '처형 예산'이 곧 게임 길이다: p0 → 2 까지 대략 p0-3 낮. */
  expDays(p0){ return Math.max(1, (p0|0) - 3); },

  /* 생존자 압축 계수 — 남은 처형 예산 (alive-2) 이 줄수록 같은 1표가 무겁다.
     시작 시 1.0, 종반 상한 2.6 (p0=10 → alive 8:1.22 · 6:1.62 · 5:1.94 · 4↓:2.6). */
  lev(alive, p0){
    const a = Math.max(3, alive|0);
    const P = Math.max(a, p0|0);
    const r = Math.pow((P-2)/(a-2), this.K.LEV_EXP);
    return Math.min(this.K.LEV_MAX, Math.max(1, r));
  },

  /* 결정성 계수 — 찬성이 과반 기준을 아슬아슬하게 넘겼을수록 개별 표가 결정적이다.
     yes==need(딱 과반) → 2.0 · 여유 1표 → 1.5 · 여유 3표 → 1.25 · 부결 → 1.0. */
  piv(yes, need){
    const y = yes|0, nd = need|0;
    if(y < nd) return 1;
    return 1 + 1/(1 + (y - nd));
  },

  /* 정보 조기 공개 프리미엄 — 남은 낮이 많을수록 그 정보가 쓰일 기회가 많다. */
  tim(day, p0){
    const v = 1 + this.K.TIM_SLOPE * (this.expDays(p0) - (day|0));
    return Math.min(this.K.TIM_MAX, Math.max(this.K.TIM_MIN, v));
  },

  /* 오작동(중독·취함·주정뱅이) 중의 행동은 본인 탓이 아니다 — 0 이 아니라 감쇠. */
  mal(isMal){ return isMal ? this.K.MAL : 1; },

  /* 합성 가중치. ctx = {alive, p0, yes, need, day, mal, deadVote} — 없는 축은 1.0 */
  w(ctx){
    ctx = ctx || {};
    let v = 1;
    if(ctx.alive != null) v *= this.lev(ctx.alive, ctx.p0 || ctx.alive);
    if(ctx.yes != null && ctx.need != null) v *= this.piv(ctx.yes, ctx.need);
    if(ctx.day != null) v *= this.tim(ctx.day, ctx.p0 || 0);
    v *= this.mal(!!ctx.mal);
    if(ctx.deadVote) v *= this.K.DEADVOTE;
    return v;
  },

  /* ── ③ 행동 가치표 (단위: '한 몸' = 생존자 1명) ──
     EXEC_VAL 은 선한 팀 관점의 처형 가치, KILL_VAL 은 악마 관점의 밤 살해 가치. */
  EXEC_VAL: {townsfolk:-1.0, outsider:-0.35, minion:1.0, demon:3.0, traveler:0, fabled:0},
  KILL_VAL: {townsfolk:1.0, outsider:0.25, minion:-1.2, demon:-3.0, traveler:0, fabled:0},
  KILL_INFO_BONUS: 0.3,   // 대상이 밤 정보 역할(c.first||c.other 인 주민)이면 가산

  /* ── ④ 반사실 기준선 ──
     '같은 국면에서 아무 생각 없이 행동하는 대체 수준 플레이어'의 기대값. */
  BASE_DESC: {
    exec: '무작위 생존자 1명 처형 = Σ_type (cnt[type]/alive) × EXEC_VAL[type]',
    kill: '무작위 생존자 1명 살해 = Σ_type (cnt[type]/alive) × KILL_VAL[type]',
    prot: '무작위 보호가 실제 공격과 겹칠 확률 = 1 / (생존 선한 대상 수)',
    info: '무작위 응답의 정답률 = 1 / (선택지 수)  — 예/아니오 2, 0~2 카운트 3',
    vote: '무작위 찬성표가 악을 맞힐 확률 = 생존 악 수 / 생존자 수',
    surv: '평균 생존 = expDays(p0) / 2 낮'
  },
  /* cnt = {townsfolk,outsider,minion,demon,traveler,fabled} — 생존자 유형별 인원 */
  ev(tbl, cnt){
    cnt = cnt || {};
    let n = 0, s = 0;
    for(const k in tbl){ const c = cnt[k]|0; n += c; s += c * tbl[k]; }
    return n ? s/n : 0;
  },
  baseExec(cnt){ return this.ev(this.EXEC_VAL, cnt); },
  baseKill(cnt){ return this.ev(this.KILL_VAL, cnt); },
  baseProt(aliveGood){ const g = aliveGood|0; return g > 0 ? 1/g : 0; },
  baseInfo(options){ const k = options|0; return k > 0 ? 1/k : 0; },
  baseVote(aliveEvil, alive){ const n = alive|0; return n > 0 ? (aliveEvil|0)/n : 0; },
  baseSurv(p0){ return this.expDays(p0) / 2; },

    {ko:'첩자·은둔자 등록 재량이 정보에 준 왜곡', why:'재량 판정을 남기는 지점이 코드에 없다(사회자 머릿속).'},

/* ══════════════════ 상태 ══════════════════ */
const LS_KEY = 'thyrsus.tb.v1';
const blank = () => ({
  phase:{kind:'setup', n:0},
  players:[], log:[], nightDone:{}, dayDone:{}, checks:{}, noms:[],
  edition:'tb', redHerringId:null, drunkMaskChar:null, executedToday:null, executedPrevDay:null,
  customs:[], roster:[], nomSeq:1, theme:'auto', poCharged:false, exorcistPrev:null, daPrev:null,
  pukkaVictimId:null, mastermindDay:null, executedTodayPid:null, executedDiedToday:null,
  fangGuJumped:false, demonBlockedNight:null, demonBlockedPid:null, dayTimer:null,
  /* 여행자 표 가중 지목 — {pid, n}. n 은 이 지목이 적용되는 낮 번호(밤 n 지목 → 낮 n 적용). */
  bureaucratTarget:null, thiefTarget:null,
  /* history = 판 전적 원장(종료 시 1건씩 적재), recentScripts = 홈 큐레이션용 '최근 연 스크립트'.
     두 레인이 같은 이름을 쓰면 한쪽 정규화기가 다른 쪽 레코드를 통째로 지운다 — 필드를 갈라 둔다. */
  events:[], evSeq:0, history:[], recentScripts:[], schema:2
});
let S = blank();
/* 구버전 저장본 정규화. 최상위 Object.assign 만으로는 플레이어·지명의 신규 필드가 비어
   `n.deadVoters.includes(...)` 같은 지점에서 예외가 난다. uid() 는 아직 TDZ 라 지역 생성기를 쓴다. */
function migrateState(raw){
  const mkid=()=>Math.random().toString(36).slice(2,9);
  const st=Object.assign(blank(), (raw&&typeof raw==='object')? raw : {});
  if(!st.phase || typeof st.phase!=='object') st.phase={kind:'setup', n:0};
  if(typeof st.phase.n!=='number') st.phase.n=0;
  st.players=(Array.isArray(st.players)? st.players:[]).filter(p=>p&&typeof p==='object').map(p=>{
    const q=Object.assign({id:mkid(), name:'?', charId:'', alive:true, deadVote:true,
      statuses:[], notes:'', alignment:null, diedAt:null, rosterId:null}, p);
    if(!Array.isArray(q.statuses)) q.statuses=[];
    q.statuses=q.statuses.filter(x=>x&&typeof x==='object'&&typeof x.key==='string');
    /* 리마인더 레인: 상태 부가 메모(광기로 주장할 캐릭터 id 등)는 문자열로 정규화한다 */
    q.statuses.forEach(x=>{ x.note = (typeof x.note==='string')? x.note.slice(0,60) : ''; });
    if(typeof q.notes!=='string') q.notes='';
    if(q.alignment!=='good'&&q.alignment!=='evil') q.alignment=null;
    if(!q.diedAt||typeof q.diedAt!=='object') q.diedAt=null;
    q.alive=!!q.alive; q.deadVote=q.deadVote!==false;
    return q;
  });
  st.noms=(Array.isArray(st.noms)? st.noms:[]).filter(n=>n&&typeof n==='object').map(n=>{
    const m=Object.assign({id:mkid(), day:0, nominator:null, nominee:null, hands:[],
      stage:1, votes:{}, closed:false, deadVoters:[]}, n);
    if(!Array.isArray(m.hands)) m.hands=[];
    if(!Array.isArray(m.deadVoters)) m.deadVoters=[];
    if(!m.votes||typeof m.votes!=='object') m.votes={};
    return m;
  });
  ['log','customs','events'].forEach(k=>{ if(!Array.isArray(st[k])) st[k]=[]; });
  /* SABER 원장 정규화 — 레코드 계약(SABER.EV)에 맞지 않는 항목은 버린다.
     원장이 커지면 localStorage 를 삼키므로 상한 초과분은 오래된 쪽부터 잘라낸다. */
  st.events=st.events.filter(e=>e&&typeof e==='object'&&typeof e.t==='string'&&SABER.EV[e.t])
    .map(e=>Object.assign({i:0, k:'setup', n:0, a:null, b:null, d:{}}, e));
  if(st.events.length>SABER.MAX_EVENTS) st.events=st.events.slice(-SABER.MAX_EVENTS);
  st.evSeq=Math.max(st.evSeq|0, st.events.reduce((m,e)=>Math.max(m,e.i|0),0));
  /* 플레이어 등록부: 이름만 필수, 소속·나이는 선택. 이름 없는 항목은 버린다 */
  st.roster=(Array.isArray(st.roster)? st.roster:[]).filter(r=>r&&typeof r==='object').map(r=>{
    const e=Object.assign({id:mkid(), name:'', affil:'', age:null, createdAt:0}, r);
    e.name=String(e.name==null?'':e.name).trim().slice(0,40);
    e.affil=String(e.affil==null?'':e.affil).trim().slice(0,40);
    const a=parseInt(e.age,10); e.age=Number.isFinite(a)? a : null;
    if(typeof e.createdAt!=='number') e.createdAt=0;
    return e;
  }).filter(r=>r.name);
  /* 사라진 등록부 항목을 가리키는 rosterId 는 끊는다(통계 오귀속 방지) */
  const ridSet=new Set(st.roster.map(r=>r.id));
  st.players.forEach(p=>{ if(p.rosterId && !ridSet.has(p.rosterId)) p.rosterId=null; });
  /* 전적 원장 — confirmWin(true) 훅이 push 한다. 손상 항목은 버리고 상한만큼만 남긴다.
     이 블록은 st.history 만 만진다(아래 recentScripts 정규화기와 서로 침범하지 않는다). */
  if(!Array.isArray(st.history)) st.history=[];
  st.history=st.history.filter(h=>h&&typeof h==='object'&&Array.isArray(h.players));
  if(st.history.length>SABER.MAX_HISTORY) st.history=st.history.slice(-SABER.MAX_HISTORY);
  /* 최근 연 스크립트(홈 큐레이션) — 전적과 다른 필드다. id 없는 항목 제거·중복 제거·상한 8.
     이 블록은 st.recentScripts 만 만진다. 구버전 저장본에는 이 필드가 없으므로 배열 보정부터 한다. */
  st.recentScripts=(Array.isArray(st.recentScripts)? st.recentScripts:[])
    .filter(h=>h&&typeof h==='object'&&typeof h.id==='string'&&h.id.trim())
    .map(h=>({ id:String(h.id).trim().slice(0,40),
               kind:(h.kind==='play'? 'play':'sheet'),
               at:(typeof h.at==='number'&&isFinite(h.at))? h.at : 0 }))
    .filter((h,i,a)=>a.findIndex(x=>x.id===h.id)===i)
    .slice(0,8);
  /* 여행자 표 가중 지목(관료·도둑) — {pid, n} 형태만 남긴다.
     사라진 플레이어를 가리키면 끊는다(집계가 유령 대상에 가중을 얹는 사고 방지). */
  ['bureaucratTarget','thiefTarget'].forEach(k=>{
    const v=st[k];
    st[k]=(v && typeof v==='object' && typeof v.pid==='string'
           && typeof v.n==='number' && isFinite(v.n)
           && st.players.some(p=>p.id===v.pid)) ? {pid:v.pid, n:v.n} : null;
  });
  ['nightDone','checks'].forEach(k=>{ if(!st[k]||typeof st[k]!=='object') st[k]={}; });
  /* dayDone = 낮 국면 가이드 진행표. 구버전 저장본엔 없고, 손상된 낮 항목은 통째로 버린다. */
  if(!st.dayDone || typeof st.dayDone!=='object' || Array.isArray(st.dayDone)) st.dayDone={};
  Object.keys(st.dayDone).forEach(k=>{ const v=st.dayDone[k]; if(!v || typeof v!=='object' || Array.isArray(v)) delete st.dayDone[k]; });
  st.schema=2;
  return st;
}
try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = migrateState(JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

const $ = sel => document.querySelector(sel);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

function allChars(){ return CHARACTERS.concat(S.customs||[]); }
function charOf(id){ return allChars().find(c=>c.id===id); }
function playersByChar(cid){ return S.players.filter(p=>p.charId===cid); }
function alivePlayers(){ return S.players.filter(p=>p.alive); }
function playerOf(pid){ return S.players.find(p=>p.id===pid); }
/* 진영은 캐릭터에서 '유도'하면 이발사 교환·건달·팡 구에서 오염된다.
   p.alignment 가 명시돼 있으면 그것이 우선, 없으면 캐릭터 타입에서 유도한다. */
function isEvil(p){
  if(p && (p.alignment==='evil'||p.alignment==='good')) return p.alignment==='evil';
  const c=charOf(p.charId); return !!(c && (c.type==='minion'||c.type==='demon'));
}
function pinAlignment(p){ if(p && !p.alignment) p.alignment = isEvil(p)?'evil':'good'; }
/* 이발사: 캐릭터만 교환하고 진영은 각자 보존한다 */
function doSwapChars(pids){
  const a=playerOf((pids||[])[0]), b=playerOf((pids||[])[1]);
  if(!a||!b||a===b){ toast('서로 다른 두 명을 선택하세요.','warn'); return; }
  pinAlignment(a); pinAlignment(b);                  // 교환 전 진영을 고정
  const aOld=a.charId, bOld=b.charId;                // 교환 전 캐릭터(지속효과 출처 정리 기준)
  const t=a.charId; a.charId=b.charId; b.charId=t;
  clearEffectsFromChar(aOld, `캐릭터 교환 — ${a.name}의 옛 능력 상실`);
  clearEffectsFromChar(bOld, `캐릭터 교환 — ${b.name}의 옛 능력 상실`);
  log(`✂ 이발사 교환: ${a.name} ↔ ${b.name} (캐릭터만 교환, 진영은 각자 유지)`);
  toast(`✂ ${a.name}=${charName(a)} / ${b.name}=${charName(b)} — 각각 깨워 새 캐릭터를 보여주세요. 진영은 바뀌지 않습니다.`,'warn');
  save(); renderAll();
}
/* 뱀 조련사: 캐릭터와 진영을 함께 교환하고, 새 뱀 조련사(전 악마)는 영구 중독 */
function doSnakeSwap(pids){
  const a=playerOf((pids||[])[0]), b=playerOf((pids||[])[1]);
  if(!a||!b||a===b){ toast('서로 다른 두 명을 선택하세요.','warn'); return; }
  pinAlignment(a); pinAlignment(b);
  const aOld=a.charId, bOld=b.charId;                // 교환 전 캐릭터(지속효과 출처 정리 기준)
  let t=a.charId; a.charId=b.charId; b.charId=t;
  clearEffectsFromChar(aOld, `뱀 조련사 스왑 — ${a.name}의 옛 능력 상실`);
  clearEffectsFromChar(bOld, `뱀 조련사 스왑 — ${b.name}의 옛 능력 상실`);
  t=a.alignment; a.alignment=b.alignment; b.alignment=t;
  const newSC = a.charId==='snakecharmer'? a : (b.charId==='snakecharmer'? b : null);
  if(newSC && !hasStatus(newSC,'poison')) addStatus(newSC,'poison','뱀 조련사 스왑(영구)',null);
  log(`🐍 뱀 조련사 스왑: ${a.name} ↔ ${b.name} (캐릭터·진영 모두 교환)`);
  save(); renderAll();
}
function hasStatus(p,key){ return (p.statuses||[]).some(s=>s.key===key); }
function isMalfunctioning(p){ return hasStatus(p,'poison') || hasStatus(p,'drunkS') || (p.charId==='drunk'); }
function majority(n){ return Math.floor(n/2)+1; }
function phaseName(){ const ph=S.phase; if(ph.kind==='setup') return '준비'; return (ph.kind==='night'?'밤 ':'낮 ')+ph.n; }
function log(msg){ S.log.push({t:phaseName(), msg}); save(); }

/* 상태 토큰 부여/해제. expiresAt: {kind,n} = 해당 페이즈 '시작 시' 자동 해제 */
function addStatus(p, key, source, expiresAt){
  p.statuses = p.statuses||[];
  p.statuses.push({key, source:source||'', expiresAt:expiresAt||null});
  log(`${p.name}: ${STATUS_DEFS[key].icon}${STATUS_DEFS[key].ko} 부여` + (source?` (${source})`:''));
}
function removeStatus(p, idx){ const s=p.statuses.splice(idx,1)[0]; log(`${p.name}: ${STATUS_DEFS[s.key].ko} 해제`); }
function expireStatuses(){
  const ph=S.phase;
  S.players.forEach(p=>{
    (p.statuses||[]).slice().forEach(s=>{
      if(s.expiresAt && s.expiresAt.kind===ph.kind && s.expiresAt.n===ph.n){
        p.statuses.splice(p.statuses.indexOf(s),1);
        S.log.push({t:phaseName(), msg:`${p.name}: ${STATUS_DEFS[s.key].icon}${STATUS_DEFS[s.key].ko} 자동 해제`});
      }
    });
  });
}

/* 밤 살해를 막는 사유(보호·면역). 암살자만 이 판정을 관통한다.
   doImpKill(TB)과 doStepKill(BMR/SV)이 갈라져 있어 BMR/SV 악마가 군인·보호를 뚫던 결함 수정. */
function deathBlockReason(t, opts){
  opts=opts||{}; const src=opts.sourceType||'demon';   // 'demon' | 'night' | 'execution'
  if(opts.bypass) return null;                         // 암살자는 모든 보호를 관통
  // 찻집 여인: 살아있는 선한 이웃은 어떤 원인으로도 죽지 않는다(처형 포함)
  const tl=teaLadyBlock(t);
  if(tl) return `찻집 여인(${tl.name})의 살아있는 선한 이웃`;
  // 외부 보호는 '다른 플레이어의 능력'이므로 대상이 취하거나 중독돼도 정상 작동한다.
  // 수도사는 악마의 살해로부터만, 여관 주인 등은 모든 밤 사망으로부터 보호한다.
  const pr=(t.statuses||[]).find(s=>s.key==='protect');
  if(pr && src!=='execution' && (pr.source!=='수도사' || src==='demon'))
    return `보호 중(${pr.source||'보호 토큰'})`;
  // 악마의 변호사: '처형'에만 유효한 외부 보호 — 대상이 취하거나 중독돼도 정상 작동한다.
  if(src==='execution' && hasStatus(t,'execProtect'))
    return '악마의 변호사의 변호 — 처형돼도 죽지 않음';
  // 대상 '자신의' 능력에 의한 면역만 오작동의 영향을 받는다
  if(!isMalfunctioning(t)){
    if(t.charId==='soldier' && src==='demon') return '군인 — 악마에게 죽지 않음';
    if(t.charId==='sailor') return '선원 — 죽지 않음';
  }
  return null;
}
/* 탕녀 계승을 '안내'가 아니라 '상태 전환'으로 처리한다.
   charId를 바꾸지 않으면 이후 demonAlive가 계속 false여서 악마 없는 게임이 진행된다. */
function promoteScarletWoman(dead, aliveBefore){
  if(charOf(dead.charId)?.type!=='demon') return false;
  // 다른 악마가 이미 살아있으면(팡 구 점프 등) 계승 대상이 아니다
  if(S.players.some(q=>q.alive && q!==dead && charOf(q.charId)?.type==='demon')) return false;
  const sw=S.players.find(q=>q.alive && q!==dead && q.charId==='scarletwoman');
  if(!sw) return false;
  const aliveN=(aliveBefore!==undefined? aliveBefore : alivePlayers().length);
  if(aliveN<5) return false;
  if(isMalfunctioning(sw)){
    toast('⚠ 탕녀가 중독/오작동 상태 — 계승 불발. 악마 사망이 그대로 성립합니다.','warn');
    log('탕녀 오작동 — 계승 불발');
    return false;
  }
  const demonId=dead.charId, ko=charOf(demonId)?.ko||'악마';
  sw.charId=demonId;
  log(`★ ${sw.name}(탕녀) → ${ko} 계승 (생존 ${aliveN}명)`);
  toast(`★ 탕녀 계승: ${sw.name}이(가) 이제 ${ko}입니다. 캐릭터가 전환되었습니다 — 다음 밤에 깨워 토큰을 보여주세요.`,'warn');
  return true;
}
/* ── 상태-출처 연동(최소침습): 지속효과 출처가 능력을 잃으면 효과도 끝난다 ──
   공식 근거(위키 Poisoner 예시): 독살범이 임프가 되자 시장의 중독이 풀린다 —
   "독살범이 인플레이에 없기 때문". 사망도 동일(죽은 자는 능력이 없다).
   대상: 독살범 독 · 수도사 보호 · 여관 주인 보호/취함 · 궁정대신 취함 · 마녀 저주 · 세레노버스 광기 · 푸카 독.
   유지: 주정뱅이(캐릭터 자체) · 사랑꾼(사망 '후' 발동하는 능력) · 뱀 조련사 스왑 독(영구) · 집사 주인. */
const EFFECT_SOURCE_KO = {poisoner:'독살범', monk:'수도사', innkeeper:'여관 주인', courtier:'궁정대신', witch:'마녀', cerenovus:'세레노버스', pukka:'푸카'};
function clearEffectsFromChar(charId, why){
  const src=EFFECT_SOURCE_KO[charId]; if(!src) return;
  S.players.forEach(q=>{
    (q.statuses||[]).slice().forEach(s=>{
      if(s.source===src){
        q.statuses.splice(q.statuses.indexOf(s),1);
        log(`${q.name}: ${STATUS_DEFS[s.key].icon}${STATUS_DEFS[s.key].ko} 해제 — ${why}`);
      }
    });
  });
}
/* 죽은 플레이어가 지속효과 출처 캐릭터면 그 출처의 상태를 전원에게서 정리한다 */
function reconcileDeath(p){ clearEffectsFromChar(p.charId, `출처 사망(${charName(p)})`); }
function killPlayer(p, cause, opts){
  opts=opts||{};
  const aliveBefore = alivePlayers().length;   // 죽는 본인 포함(탕녀 계승 판정 기준)
  // 좀버얼 첫 사망 = 죽은 척: 겉으로만 사망 처리, 실제로는 생존(밤에 계속 깨움)
  if(p.charId==='zombuul' && !hasStatus(p,'fakedead') && !isMalfunctioning(p)){
    addStatus(p,'fakedead','좀버얼 첫 사망',null);
    p.alive=false;
    p.diedAt={kind:S.phase.kind, n:S.phase.n, cause:cause||''};
    log(`🪦 ${p.name}(좀버얼) 죽은 척 — ${cause} (실제로는 생존, 두 번째 사망이 진짜)`);
    toast(`🪦 좀버얼의 첫 사망 — 겉으로는 죽은 것으로 공표하되 실제로는 생존 중입니다. 계속 밤에 깨우세요. 두 번째 사망이 진짜입니다.`,'warn');
    if(!opts.skipEnd) checkEndConditions(cause, aliveBefore);
    return;
  }
  // 어릿광대 1회 생존: 첫 사망 시 정상 작동이면 재량 발동
  // 어릿광대의 1회 생존은 '강제' 능력이다 — 사회자 재량이 아니므로 확인창 없이 자동 발동.
  // 암살자와 오작동만 예외.
  if(p.charId==='fool' && p.alive && !hasStatus(p,'spent') && !isMalfunctioning(p) && !/암살자/.test(cause)){
    addStatus(p,'spent','어릿광대 1회 생존 발동',null);
    log(`🃏 ${p.name}(어릿광대) 첫 사망 무효 — ${cause} (능력 소진, 강제 발동)`);
    toast(`🃏 ${p.name} 생존 — 어릿광대의 1회 생존이 발동했습니다(강제). 사망하지 않습니다.`,'ok');
    return;
  }
  if(p.charId==='zombuul'){
    const zi=(p.statuses||[]).findIndex(s=>s.key==='fakedead');
    if(zi>=0){ p.statuses.splice(zi,1); log(`🪦 ${p.name}(좀버얼) 두 번째 사망 — 죽은 척 해제, 실제 사망`); }
  }
  p.alive=false; p.diedAt={kind:S.phase.kind, n:S.phase.n, cause:cause||''};
  log(`💀 ${p.name}(${charName(p)}) 사망 — ${cause}`);
  reconcileDeath(p);   // 출처 사망 → 그의 독·보호·저주·광기 등 지속효과 즉시 정리
  if(!opts.skipSuccession) promoteScarletWoman(p, aliveBefore);
  if(!opts.skipEnd) checkEndConditions(cause, aliveBefore);
}
function charName(p){ const c=charOf(p.charId); return c? c.ko : '?'; }

function checkEndConditions(cause, aliveBefore){
  const demonAlive = S.players.some(p=>(p.alive || (p.charId==='zombuul'&&hasStatus(p,'fakedead'))) && charOf(p.charId)?.type==='demon');
  if(demonAlive){
    // M-7: 생존 2인 이하 + 악마 생존 = 악한 팀 승리
    if(alivePlayers().length<=2){
      toast('🏴 생존자가 2명 이하이고 악마가 살아 있습니다 — 악한 팀 승리!','warn');
      log('악한 팀 승리(생존 2인 이하 + 악마 생존)');
    }
    return;
  }
  {
    const sw = S.players.find(p=>p.alive && p.charId==='scarletwoman');
    const aliveN = (aliveBefore!==undefined? aliveBefore : alivePlayers().length+1);
    if(sw && aliveN>=5 && !isMalfunctioning(sw)){
      toast(`⚠ 악마 사망 — 생존 ${aliveN}명(5+). 탕녀가 임프를 계승합니다. 게임은 계속! 다음 밤에 그녀를 깨워 임프 토큰을 보여주세요.`, 'warn');
      log('탕녀 계승 조건 충족 — 다음 밤 임프로 전환');
    } else if(sw && aliveN>=5 && isMalfunctioning(sw)){
      toast('⚠ 탕녀가 중독/오작동 상태 — 계승 불발. 악마 사망 = 선한 팀 승리!', 'warn');
    } else {
      toast('🏆 악마가 죽었습니다 — 선한 팀 승리! (탕녀 계승 조건 없음)', 'ok');
    }
  }
}

let toastTimer=null;
function toast(msg, kind){
  let el = $('#toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el);
    el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;max-width:560px;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--raised);color:var(--text)'; }

function advancePhase(){
  const ph=S.phase;
  if(ph.kind==='setup'){
    if(S.players.length<5){ toast('플레이어가 5명 이상 필요합니다.','warn'); return; }
    const unassigned=S.players.filter(p=>!p.charId);
    if(unassigned.length){ toast(`캐릭터 미배정: ${unassigned.map(p=>p.name).join(', ')}`,'warn'); return; }
    const ft=S.players.find(p=>p.charId==='fortuneteller');
    if(ft && !S.redHerringId){ toast('점쟁이가 있습니다 — 붉은 청어를 먼저 지정하세요(설정 탭).','warn'); return; }
    const dr=S.players.find(p=>p.charId==='drunk');
    if(dr && !S.drunkMaskChar){ toast('주정뱅이가 있습니다 — 위장할 마을 주민을 먼저 지정하세요(설정 탭).','warn'); return; }
    S.phase={kind:'night', n:1};
    log('── 게임 시작: 첫날 밤 ──');
    switchTab('night');
  } else if(ph.kind==='night'){
    S.phase={kind:'day', n:ph.n};
    expireStatuses();
    log(`── 낮 ${ph.n} 시작 ──`);
    switchTab('day');
  } else {
    // 낮 종료 → 시장 3인 승리 조건 최종 확인
    const mayor=S.players.find(p=>p.alive && p.charId==='mayor');
    if(mayor && alivePlayers().length===3 && !S.executedToday && !isMalfunctioning(mayor)){
      if(!confirm('⚠ 생존자 3명 + 오늘 처형 없음 + 시장 생존(정상 작동) = 선한 팀 승리 조건입니다!\n그래도 밤으로 진행할까요? (취소를 누르면 낮에 머뭅니다)')) return;
    }
    if(sheetEd!==S.edition) sheetEd=S.edition;   // 시트가 다른 스크립트를 보고 있으면 되돌린다
    S.executedPrevDay = S.executedDiedToday;  // 장의사는 '처형으로 실제 죽은' 캐릭터만 본다
    S.executedToday=null; S.executedTodayPid=null; S.executedDiedToday=null;
    S.phase={kind:'night', n:ph.n+1};
    expireStatuses();  // 독(어제 밤 부여) 해제 타이밍 = 다음 밤 시작
    S.nightDone[S.phase.n]={};
    log(`── 밤 ${S.phase.n} 시작 ──`);
    switchTab('night');
  }
  save(); renderAll();
}

/* ══════════════════ 설정 탭 ══════════════════ */
function compFor(n, outsiderDelta){
  const c=COMP[Math.min(15,Math.max(5,n))].slice();
  const d=Math.max(outsiderDelta||0, -c[1]); // 외지인은 0 미만으로 내려가지 않는다
  c[0]-=d; c[1]+=d;
  return c;
}
/* 공식 셋업 보정: 남작 +2 / 팡 구 +1 / 비고르모르티스 −1 외지인, 대부는 ±1(양쪽 모두 허용) */
const SETUP_MOD_IDS=['baron','godfather','fanggu','vigormortis'];
function setupMods(ids){
  let delta=0, godfather=false;
  ids.forEach(id=>{ if(id==='baron') delta+=2; else if(id==='fanggu') delta+=1; else if(id==='vigormortis') delta-=1; else if(id==='godfather') godfather=true; });
  return {delta, godfather};
}
function compVariants(n, mods){
  const deltas=mods.godfather? [mods.delta+1, mods.delta-1] : [mods.delta];
  return deltas.map(d=>compFor(n,d));
}
function ensureSeats(target){
  target=Math.max(1,Math.min(15,target));
  while(S.players.length<target) S.players.push({id:uid(), rosterId:null, name:'', charId:'', alive:true, deadVote:true, statuses:[], notes:''});
  while(S.players.length>target) S.players.pop();
  save(); renderAll();
}
function renamePlayer(pid,v){
  const p=playerOf(pid); if(!p) return;
  p.name=v;
  /* 등록부에서 가져온 좌석의 이름을 직접 고쳤다면 그 자리에 앉은 사람이 바뀐 것이다.
     링크를 남겨두면 사람 단위 통계가 엉뚱한 등록부 항목에 쌓이므로 여기서 끊는다.
     (renderAll() 은 부르지 않는다 — 입력 중 포커스 유실 방지. 👤 배지는 다음 렌더에서 사라진다) */
  if(p.rosterId){ const r=rosterOf(p.rosterId); if(!r || r.name!==String(v).trim()) p.rosterId=null; }

}

   blank() 은 이들을 전부 비우므로 여기서 되돌려 넣는다. 보존 목록을 상수로 둬야
   새 필드가 생겼을 때 초기화 정책을 한 곳에서만 고칠 수 있다. */

function setupIssues(){
  const n=S.players.length;
  const issues=[];
  if(n<5) issues.push('플레이어가 5명 이상 필요합니다.');
  const noname=S.players.filter(p=>!p.name.trim()).length;
  if(noname) issues.push(`이름이 비어 있는 좌석 ${noname}곳`);
  const un=S.players.filter(p=>!p.charId);
  if(un.length) issues.push('캐릭터 미배정: '+un.map(p=>p.name).join(', '));
  const mods=setupMods(S.players.map(p=>p.charId));
  const comps=n>=5?compVariants(n,mods):null;
  const counts={townsfolk:0,outsider:0,minion:0,demon:0};
  S.players.forEach(p=>{const c=charOf(p.charId); if(!c) return; if(c.type==='traveler'||c.type==='fabled') return; counts[c.type]++;});
  if(comps && !comps.some(comp=>counts.townsfolk===comp[0]&&counts.outsider===comp[1]&&counts.minion===comp[2]&&counts.demon===comp[3]))
    issues.push(`구성 불일치 — 권장 ${comps.map(c=>c.join('/')).join(' 또는 ')}, 현재 ${counts.townsfolk}/${counts.outsider}/${counts.minion}/${counts.demon}`);
  if(S.players.some(p=>p.charId==='fortuneteller') && !S.redHerringId) issues.push('점쟁이의 붉은 청어를 지정하세요.');
  if(S.players.some(p=>p.charId==='drunk') && !S.drunkMaskChar) issues.push('주정뱅이의 위장 캐릭터를 지정하세요.');
  return issues;
}

  }

    body=`
    <div class="row" style="margin-bottom:10px">

      <button class="ghost" onclick="clearAssign()">배정 전체 비우기</button>
      <span class="hint">또는 아래에서 직접 선택</span>
    </div>
    ${comps?`<p class="hint">권장 구성 (${n}인${modLabel?` · ${modLabel} 적용`:''}): ${comps.map(comp=>`<span class="pill townsfolk">주민 ${comp[0]}</span> <span class="pill outsider">외지인 ${comp[1]}</span> <span class="pill minion">하수인 ${comp[2]}</span> <span class="pill demon">악마 ${comp[3]}</span>`).join(' <span class="hint" style="display:inline">또는</span> ')}
      &nbsp;현재: ${counts.townsfolk}/${counts.outsider}/${counts.minion}/${counts.demon}
      ${compOK?'<span class="pill ok">구성 일치</span>':'<span class="pill warn">구성 불일치</span>'}

    <div>${S.players.map((p,i)=>`
      <div class="voterow">
        <span style="color:var(--muted);width:24px" class="num">${i+1}</span>
        <span class="vname">${esc(p.name)}</span>

      </div>`).join('')}</div>
    ${(ft||dr)?`<hr class="divider"><h3>시작 전 사회자 결정</h3>
      ${ft?`<div class="fieldrow"><label>🎗 붉은 청어</label><div><select onchange="setHerring(this.value)"><option value="">— 선한 플레이어 선택 —</option>
        ${S.players.filter(p=>{const c=charOf(p.charId);return c&&(c.type==='townsfolk'||c.type==='outsider');}).map(p=>`<option value="${p.id}" ${S.redHerringId===p.id?'selected':''}>${esc(p.name)} (${charName(p)})</option>`).join('')}
      </select> <span class="hint">점쟁이에게 악마처럼 감지될 선한 플레이어 1명 — 게임 내내 유지</span></div></div>`:''}
      ${dr?`<div class="fieldrow"><label>🎭 주정뱅이 위장</label><div><select onchange="setDrunkMask(this.value)"><option value="">— 위장할 마을 주민 —</option>
        ${CHARACTERS.filter(c=>c.type==='townsfolk' && (c.edition||'tb')===S.edition && !S.players.some(p=>p.charId===c.id)).map(c=>`<option value="${c.id}" ${S.drunkMaskChar===c.id?'selected':''}>${c.ko}</option>`).join('')}
      </select> <span class="hint">주정뱅이 본인이 믿게 될 주민 — 미사용 캐릭터에서 선택. 밤 순서에 자동 반영</span></div></div>`:''}`:''}
    <div class="bigactions" style="margin-top:16px"><button class="gold" onclick="gotoSetupStep(3)">다음: 시작 ›</button></div>
    <details class="morebox" style="margin-top:14px"><summary>캐릭터 일람 (${editionOf().ko}${S.customs.length?` + 커스텀 ${S.customs.length}종`:''})</summary><div class="inner">
    ${['townsfolk','outsider','minion','demon','traveler','fabled'].filter(t=>editionChars().some(c=>c.type===t)).map(t=>`
      <h3><span class="pill ${t}">${TYPE_KO[t]}</span></h3>
      <div class="chargrid">${editionChars().filter(c=>c.type===t).map(charCard).join('')}</div>`).join('')}</div></details>`;

  else {

      <div class="bigactions"><button onclick="gotoSetupStep(${issues[0].includes('플레이어')?1:2})">‹ 돌아가서 마저 준비하기</button></div>`
