  if(kind==='execute'){
    /* 공식 성자: "If you die by execution, your team loses." — 처형 성립만으로는 부족하고
       사망이 필요하다(찻집 여인·악마의 변호사·선원으로 살아남으면 발동하지 않는다).
       위 executeNominee 래퍼가 이제 처형 성립만 확인하고 넘기므로, 사망 요구는 여기서 건다. */
    if(p && p.charId==='saint' && !isMalfunctioning(p) && !p.alive)
      return {team:'evil', reason:`성자(${p.name})가 처형되었습니다.`, rule:'성자: 처형으로 죽으면 선한 팀이 패배합니다. (중독·취함 상태였다면 발동하지 않습니다)'};
    if(p && p.charId==='eviltwin')
      return null; // 사악한 쌍둥이 본인 처형은 종료 아님
    const et=S.players.find(x=>x.charId==='eviltwin' && x.alive);
    if(et && p && ctx.isGoodTwin)
      return {team:'evil', reason:`선한 쌍둥이(${p.name})가 처형되었습니다.`, rule:'사악한 쌍둥이: 선한 쌍둥이가 처형되면 악한 팀이 승리합니다.'};
  }
  /* kind:'execute' 는 '처형으로 죽었는가'가 조건인 판정(성자·선한 쌍둥이)이라 호출부가
     p.alive 로 게이트한다. 아래 kind:'executeAct' 는 '처형이라는 행위 자체'가 조건인
     캐릭터들이다 — 보호·어릿광대로 살아남아도, 성결자 발동으로 즉시 처형돼도 성립한다.
     그래서 처형의 단일 통로인 resolveExecution 래퍼가 이쪽을 부른다(두 계약을 섞지 않는다). */
  if(kind==='executeAct'){
    /* 무신론자 — 공식: "The Storyteller can break the game rules, and if executed,
       good wins, even if you are dead." 사망 여부와 무관하게 처형 그 자체로 선 승리다.
       무신론자 판에는 악한 캐릭터가 없어 중독 예외를 따로 두지 않는다. */
    if(p && p.charId==='atheist')
      return {team:'good', reason:`무신론자(${p.name})가 처형되었습니다.`, rule:'무신론자: 처형되면 죽어 있어도 선한 팀이 승리합니다.'};
    /* 고블린 — 공식: "If you publicly claim to be the Goblin when nominated & are executed
       that day, your team wins." 지명당한 순간의 공개 선언은 앱이 관측할 수 없으므로
       선한 쌍둥이와 같은 계약으로 사회자에게 확인받는다. 중독·취함이면 선언해도 불발. */
    if(p && p.charId==='goblin' && !isMalfunctioning(p) &&
       confirm(`👺 ${p.name}은(는) 고블린입니다.\n오늘 지명당한 그 순간 공개적으로 고블린임을 선언했습니까?\n[확인] 예 → 악한 팀 승리 / [취소] 아니오`))
      return {team:'evil', reason:`고블린(${p.name})이 선언 후 처형되었습니다.`, rule:'고블린: 지명당했을 때 공개적으로 고블린임을 선언하고 그날 처형되면 악한 팀이 승리합니다.'};
    /* 공포 조장가 — 공식: "Each night, choose a player: if you nominate & execute them,
       their team loses." 공포 표식과 지명자 연동이 앱에 없으므로 두 조건을 한 번에 확인받는다.
       지는 쪽은 '처형된 대상의 진영'이다 — 선한 대상이면 악이, 악한 대상이면 선이 이긴다. */
    const fm=S.players.find(x=>x.alive && x.charId==='fearmonger' && !isMalfunctioning(x));
    if(fm && p &&
       confirm(`😱 공포 조장가(${fm.name})가 있습니다.\n처형된 ${p.name}이(가) 현재 공포 표식 대상이고, 공포 조장가 본인이 지명했습니까?\n[확인] 예 → ${isEvil(p)?'선한':'악한'} 팀 승리 / [취소] 아니오`))
      return {team: isEvil(p)?'good':'evil', reason:`공포 조장가의 대상 ${p.name}이(가) 공포 조장가의 지명으로 처형되었습니다.`, rule:'공포 조장가: 자신이 지명한 공포 대상이 처형되면 그 대상의 진영이 패배합니다.'};
    /* 레비아탄 — 공식: "If more than 1 good player is executed, evil wins."
       기준은 '처형된 사람이 선했는가'이고 실제 사망 여부와 무관하다(앱의 warn 도 동일).
       누적 수는 처형의 단일 통로(resolveExecution 래퍼)에서 세어 S.goodExecCount 에 남긴다. */
    if((S.goodExecCount||0)>=2 && S.players.some(x=>x.alive && x.charId==='leviathan'))
      return {team:'evil', reason:`레비아탄이 있는 판에서 선한 플레이어가 ${S.goodExecCount}명 처형되었습니다.`, rule:'레비아탄: 선한 플레이어가 2명 이상 처형되면 악한 팀이 승리합니다.'};
    return null;
  }
  if(kind==='klutz'){
    if(ctx.targetEvil)
      return {team:'evil', reason:`얼뜨기(${ctx.klutzName})가 악한 플레이어를 지목했습니다.`, rule:'얼뜨기: 사망 후 공개 지목한 대상이 악하면 선한 팀이 패배합니다. (중독·취함 상태로 죽었다면 발동하지 않습니다)'};
    return null;
  }
  if(kind==='dayEnd'){
    if(S.mastermindDay && S.phase.n===S.mastermindDay){
      const ex=S.executedTodayPid? playerOf(S.executedTodayPid):null;
      if(ex && isEvil(ex))
        return {team:'good', reason:`주모자 연장전(낮 ${S.phase.n})에 악한 플레이어 ${ex.name}이(가) 처형되었습니다.`, rule:'주모자: 연장된 하루에 악한 플레이어가 처형되면 선한 팀이 승리합니다.'};
      /* 공식(TPI roles.json mastermind): "If a player is then executed, their team loses."
         — 처형이 '있었을 때'만 그 처형된 사람의 진영이 진다. 연장된 하루에 처형이 아예
         없으면 악은 기회를 날린 것이고, 악마는 이미 처형으로 죽어 있으므로 선이 이긴다.
         앱의 주모자 능력 텍스트도 같은 규칙을 적고 있어 코드만 어긋나 있었다. */
      if(ex)
        return {team:'evil', reason:`주모자 연장전(낮 ${S.phase.n})에 선한 플레이어 ${ex.name}이(가) 처형되었습니다.`, rule:'주모자: 연장된 하루에 처형된 플레이어의 진영이 패배합니다.'};
      return {team:'good', reason:`주모자 연장전(낮 ${S.phase.n})에 처형이 없었습니다.`, rule:'주모자: 연장된 하루에 처형이 일어나지 않으면 이미 죽은 악마 때문에 선한 팀이 승리합니다.'};
    }
    /* 레비아탄의 '5일차 낮 종료' — 이 악마는 밤에 아무도 죽이지 않아 death 이벤트가 거의
       뜨지 않는다. 낮 종료가 확실히 지나는 유일한 지점이라 여기서 잡는다.
       공식(roles.json leviathan): "After day 5, evil wins."
       공식 징크스 레비아탄×시장(앱의 징크스표와 동일): '5일차에 레비아탄과 시장이 모두 살아
       있고 처형이 일어나지 않으면 선이 승리한다' — 인원 조건이 없으므로 아래의 시장 3인
       분기와는 별개다. 그래서 시장 예외를 레비아탄 분기 '안'에서 먼저 처리한다:
       뒤의 시장 분기에 맡기면 생존 3명이 아닐 때 아무도 반환하지 않아 게임이 5일을 넘긴다. */
    const lv=S.players.find(x=>x.alive && x.charId==='leviathan');
    if(lv && S.phase.n>=5){
      const mayorL=S.players.find(x=>x.alive && x.charId==='mayor' && !isMalfunctioning(x));
      if(mayorL && !ctx.executed)
        return {team:'good', reason:`낮 ${S.phase.n}에 처형이 없었고 시장(${mayorL.name})이 살아 있습니다.`, rule:'징크스(레비아탄×시장): 5일차에 레비아탄과 시장이 모두 살아 있고 처형이 일어나지 않으면 선한 팀이 승리합니다.'};
      return {team:'evil', reason:`레비아탄이 살아 있는 채로 낮 ${S.phase.n}이(가) 끝났습니다.`, rule:'레비아탄: 5일차 낮이 끝나면 악한 팀이 승리합니다.'};
    }
    const vx=S.players.find(x=>x.alive && charOf(x.charId)?.type==='demon' && x.charId==='vortox');
    /* 공식 Vortox: "Each day, if no-one died by execution, evil wins." — 게이트는 '처형이
       있었나'가 아니라 '처형으로 죽었나'다. 악마의 변호사·찻집 여인·선원·폭풍잡이로 처형이
       무산되면 아무도 처형으로 죽지 않았으므로 악 승리다. 앱은 이미 그 구분을
       S.executedDiedToday 로 들고 있다(resolveExecution 이 실제 사망일 때만 채운다).
       바로 아래 시장은 공식 문구가 "no execution occurs"라 ctx.executed 를 그대로 써야 한다 —
       두 분기의 게이트가 서로 다르므로 하나로 합치지 마라. */
    const execDied = (ctx.executedDied!==undefined)? !!ctx.executedDied : !!S.executedDiedToday;
    if(vx && !execDied)
      return {team:'evil', reason:'보르톡스가 살아 있는데 오늘 처형으로 죽은 사람이 없습니다.', rule:'보르톡스: 처형으로 아무도 죽지 않은 채 낮이 끝나면 악한 팀이 승리합니다 — 처형이 보호(악마의 변호사·찻집 여인 등)로 무산된 경우도 포함합니다.'};
    const mayor=S.players.find(x=>x.alive && x.charId==='mayor');
    /* 인원 판정은 realAliveCount() 하나만 쓴다 — 죽은 척 중인 좀버얼은 실제로 살아 있다 */
    if(mayor && !isMalfunctioning(mayor) && realAliveCount()===3 && !ctx.executed)
      return {team:'good', reason:'생존자 3명 상태에서 처형 없이 낮이 끝났습니다.', rule:'시장: 생존자가 3명일 때 처형이 일어나지 않으면 선한 팀이 승리합니다.'};
  }
  if(kind==='death'){
    const demonAlive=S.players.some(x=>(x.alive||(x.charId==='zombuul'&&hasStatus(x,'fakedead'))) && charOf(x.charId)?.type==='demon');
    /* 악마 캐릭터가 배정된 좌석이 애초에 없는 대본(무신론자 [악한 캐릭터 없음] · 소환사
       [악마 없이 시작, 3일째 밤 소환] · 릴 몬스타 [토큰 미배정])에서는 '악마가 죽었다'가
       아니라 '아직 악마가 없다'다 — 자동 선 승리를 걸면 안 된다. */
    if(!S.players.some(x=>charOf(x.charId)?.type==='demon')) return null;
    if(demonAlive){
      /* 죽은 척 중인 좀버얼은 '겉보기 사망 · 실제 생존'이다(공식 Zombuul). 예전에는 그를
         생존자에서 빼고 세는 바람에, 실제로 좀버얼+선 1명만 남아도 겉보기 1명이라 악 승리가
         나오지 않고 '죽은 척하는 중'만 반복되어 게임이 끝나지 않았다.
         이 분기는 이미 demonAlive(좀버얼 죽은 척 포함) 안이므로 악마는 살아 있다 —
         따로 demonReallyAlive 를 다시 셀 필요가 없다(정의가 두 벌이어서 어긋났던 자리다). */
      if(realAliveCount()<=2)
        return {team:'evil', reason:'실제 생존자가 2명 이하이고 악마가 살아 있습니다.', rule:'생존자가 2명이 되면 악마가 반드시 이깁니다(처형으로 악마를 잡을 수 없음). 죽은 척 중인 좀버얼도 실제 생존자로 셉니다.'};
      return null;
    }
    const aliveN=regularAliveFrom(ctx.aliveBefore!==undefined? ctx.aliveBefore : alivePlayers().length+1);
    /* 조건은 scarletWomanBlocker() 한 곳에만 있다(winBlockers 와 같은 함수를 본다).
       위에 있던 const blockers=winBlockers() 는 이 분기에서 한 번도 쓰이지 않아 함께 지운다. */
    if(scarletWomanBlocker(aliveN))
      return {kind:'continue', why:'scarletwoman', msg:`탕녀 계승 조건(악마 사망 시 생존 ${aliveN}명) — 게임은 계속됩니다.`};
    const mm=S.players.find(x=>x.alive && x.charId==='mastermind');
    if(mm && !isMalfunctioning(mm) && ctx.byExecution)
      return {kind:'continue', why:'mastermind', msg:'주모자 — 악마가 처형됐지만 게임이 하루 더 이어집니다.'};
    const et=aliveEvilTwinPair();
    if(et)
      return {kind:'continue', why:'eviltwin', msg:'사악한 쌍둥이와 선한 쌍둥이가 모두 살아 있어 선한 팀은 아직 승리할 수 없습니다.'};
    return {team:'good', reason:'마지막 악마가 죽었습니다.', rule:'악마가 모두 죽고 계승·연장 조건이 없으면 선한 팀이 승리합니다.'};
  }
  return null;
}
/* ── 승리값 판별 · '계속' 사유 안내 ── */
function isWinRes(r){ return !!(r && r.team); }
/* '계속'을 기존 checkEndConditions 로 떨어뜨리면 주모자·사악한 쌍둥이 상황에서
   '악마가 죽었습니다 — 선한 팀 승리'가 잘못 선언된다. 여기서 끊고 안내만 한다. */
function announceContinue(res){
  if(res.why==='mastermind' && !S.mastermindDay){
    S.mastermindDay=S.phase.n+1;
    log(`🧠 주모자 연장전 — 낮 ${S.mastermindDay}의 처형 결과로 승패가 갈립니다`);
  }
  log(`게임 계속(${res.why}): ${res.msg}`);
  toast(`▶ ${res.msg}`,'warn');
  save(); renderAll();
}
/* ── 승리 확인 다이얼로그 ── */
let pendingWin=null;
function askWin(res){
  if(!isWinRes(res) || S.gameOver) return;
  /* 이단자 — 공식: "Whoever wins, loses & whoever loses, wins, even if you are dead."
     생사와 무관하고, 그 시점에 중독·취함이면 뒤집지 않는다(앱의 warn 과 동일).
     반전은 '승리값이 만들어진 직후' 이 한 곳에서만 한다. confirmWin 안에서 team 만
     바꿔서는 안 된다: 바깥 SABER 래퍼가 confirmWin 호출 '전에' 잡아둔 같은 res 객체의
     team 으로 EV.end 와 전적(S.history)을 적는다. res 자체를 뒤집어야 확인 다이얼로그·
     종료 화면·로그·전적이 모두 같은 결과를 본다. res.heretic 이 두 번 뒤집기를 막는다. */
  if(!res.heretic){
    const her=S.players.find(x=>x.charId==='heretic' && !isMalfunctioning(x));
    if(her){
      const was=res.team;
      res.heretic=true;
      res.team=(was==='good'? 'evil':'good');
      res.reason=`${res.reason} / 이단자(${her.name})가 승패를 뒤집었습니다.`;
      log(`🔀 이단자 반전 — ${was==='good'?'선':'악'}한 팀 → ${res.team==='good'?'선':'악'}한 팀`);
    }
  }
  pendingWin=res;
  const el=$('#winask'); el.hidden=false;
  const blockers=winBlockers();
  el.innerHTML=`<div class="wcard">
    <div class="wicon">${res.team==='good'?'🕊️':'😈'}</div>
    <div class="wteam ${res.team}">${res.team==='good'?'선한 팀의 승리입니다':'악한 팀의 승리입니다'}</div>
    <h3>게임을 끝내겠습니까?</h3>
    <div class="wreason">${esc(res.reason)}</div>
    <div class="wrule">📖 ${esc(res.rule)}</div>
    ${blockers.length?`<div class="alertbox" style="text-align:left">확인할 것: ${blockers.map(b=>`<b>${esc(b.who)}</b>`).join(' · ')} — ${esc(blockers[0].why)}</div>`:''}
    <div class="bigactions">
      <button class="gold" onclick="confirmWin(true)">✓ 게임 종료</button>
      <button onclick="confirmWin(false)">아니오 — 계속 진행</button>
    </div></div>`;
}
function confirmWin(yes){
  const el=$('#winask'); el.hidden=true;
  const res=pendingWin; pendingWin=null;
  if(!res) return;
  if(yes){ S.gameOver=true; save(); showGameOver(res.team, res.reason+' — '+res.rule); }
  else {
    log(`승리 조건 안내(${res.team==='good'?'선':'악'}) — 사회자가 계속 진행을 선택: ${res.reason}`);
    save();
    if(typeof res.resume==='function'){ const go=res.resume; setTimeout(go,0); }   // 막아둔 페이즈 전환을 이어서 실행
    else renderAll();
  }
}
/* 기존 판정과 연결 — checkEndConditions를 사건 기반 엔진으로 대체 */
(function(){
  const _orig=checkEndConditions;
  checkEndConditions=function(cause, aliveBefore){
    if(S.gameOver) return;
    const byExecution=/처형|성결자/.test(cause||'');

    let isGoodTwin=false;

    const wasExecuted = S.executedTodayPid===p.id && S.executedTodayPid!==executedToday;
    if(p.alive && !wasExecuted) return;

       (두 판정이 동시에 성립하는 조합에서 팀은 항상 같고 사유만 다르다) */
    if(pendingWin) return;

   executeNominee 를 거치지 않고 resolveExecution 을 직접 부른다(공식적으로도 '처형'이며,

         사회자가 p.alignment 를 고정해 두면 그대로 반영된다(isEvil 이 그것을 먼저 본다). */
      if(p && !isEvil(p)) S.goodExecCount=(S.goodExecCount|0)+1;
      if(!S.gameOver && !pendingWin){
        const r=evalWinEvent('executeAct', {player:p});
        if(isWinRes(r)) askWin(r);

      save();

})();

  advancePhase=function(){
    if(!_dayEndResuming && S.phase.kind==='day' && !S.gameOver){
      /* 보르톡스는 '처형으로 사망', 시장은 '처형 성립'을 본다 — 게이트가 다르므로 두 축을 다 넘긴다. */

        /* 재개는 안쪽 체인(_adv)을 값으로 부르지 않는다 — 그러면 이 래퍼보다 바깥에

        res.resume=function(){ _dayEndResuming=true; try{ advancePhase(); } finally{ _dayEndResuming=false; } };

  steps.push({id:'abil', icn:'✨', name:'낮 능력 타이밍',

          <div class="hint">${esc(e.c.dayNotice||e.c.ability||'')}</div>
          ${abilBtns[e.c.id]? `<div class="row" style="margin-top:6px"><button class="small" data-dayact="${e.c.id}">${abilBtns[e.c.id]}</button></div>` : ''}</li>`).join('')}</ul>`
      : `<div class="hint">이 시트·현재 생존자 중 낮에 발동하는 능력이 없습니다.</div>`});
  steps.push({id:'dusk', icn:'🌙', name:'황혼 정리',
    who: expiring.length? `만료 예정 ${expiring.length}건` : '만료 예정 없음',
    body:`<div class="hint">오늘 처형: <b>${S.executedToday? esc(S.executedToday) : '없음'}</b></div>`+
      (expiring.length
        ? `<div class="alertbox" style="margin-top:8px"><div>다음 밤 시작에 자동 해제될 상태</div>
           <ul class="guide">${expiring.map(x=>`<li>${esc(x.p.name)} — ${esc(stName(x.s.key))}${x.s.source? ` (${esc(x.s.source)})` : ''}</li>`).join('')}</ul></div>`
        : `<div class="hint" style="margin-top:6px">다음 밤 시작에 만료될 상태 토큰이 없습니다.</div>`)+
      `<div class="row" style="margin-top:10px"><button class="small primary" data-dayact="dusk">🌙 황혼 — 다음 밤으로</button></div>`});
  return steps;
}
function renderDayGuide(){
  const steps=daySteps();
  const doneMap=dayGuideDone();
  const doneN=steps.filter(s=>doneMap[s.id]).length;
  const wrap=document.createElement('div');
  wrap.className='card'; wrap.id='dayguide';
  wrap.innerHTML=`<h2>낮 진행 순서</h2>
    <div class="runbar">
      <button class="runbtn" data-dayact="dawn">🌅 새벽 공표</button>
      <button data-dayact="tonom">🗳 지명·투표로</button>
      <span class="hint">${doneN}/${steps.length} 단계 완료 — 항목을 눌러 펼치고, 체크로 완료 표시합니다.</span>
    </div>`+
    steps.map((st,i)=>`<div class="step ${doneMap[st.id]?'done':(st.skip?'skip':'wake')} ${dayGuideOpen===st.id?'open':''}" id="daystep-${st.id}">
      <div class="stephead" data-dayhead="${st.id}">
        <input type="checkbox" ${doneMap[st.id]?'checked':''} data-daydone="${st.id}" style="accent-color:var(--accent)">
        <span class="stepnum num">${i+1}</span>
        <span class="stepname">${st.icn} ${esc(st.name)}</span>
        <span class="stepwho">${esc(st.who||'')}</span>
        ${st.skip?`<span class="pill neutral" style="margin-left:auto">${esc(st.skip)}</span>`:''}
      </div>
      <div class="stepbody">${st.body}</div>
    </div>`).join('');
  wrap.addEventListener('click', ev=>{
    const cb=ev.target.closest('input[data-daydone]');
    if(cb){ ev.stopPropagation(); toggleDayDone(cb.getAttribute('data-daydone')); return; }
    const ac=ev.target.closest('[data-dayact]');
    if(ac){ ev.stopPropagation(); const f=DAY_ACTS[ac.getAttribute('data-dayact')]; if(f) f(); return; }
    const hd=ev.target.closest('[data-dayhead]');
    if(hd){ const id=hd.getAttribute('data-dayhead'); dayGuideOpen=(dayGuideOpen===id)? null : id; renderAll(); }
  });
  return wrap;
}
(function(){
  const _rd=renderDay;

let deathMode=false;
function toggleDeathMode(){ deathMode=!deathMode; renderAll();
  toast(deathMode?'💀 사망 표시 모드 — 토큰을 누르면 즉시 생사가 전환됩니다(확인 없음).':'사망 표시 모드 해제','warn'); }
function quickToggleDeath(pid){
  const p=playerOf(pid); if(!p) return;
  /* 소생 경로가 둘로 갈라지면 한쪽만 토큰·사망 기록을 복원해 상태가 어긋난다 —
     소생 처리는 revivePlayer() 한 곳만 쓴다(그 안에서 save·renderAll 까지 한다). */
  if(!p.alive){ revivePlayer(pid); return; }
  killPlayer(p,'사회자 수동 표시');
  save(); renderAll();
}

(function(){
  const _rno=renderNomOpen;
  renderNomOpen=function(nom){
    let html=_rno(nom);
    if(nom.stage!==2) return html;
    /* 본 목록(ballotEligible)에 이미 그려진 사람은 여기서 다시 그리지 않는다 — 중복 행 방지.
       (거수한 사망자는 토큰이 소진돼 있어도 본 목록에 있다.)
       남는 사망자를 제외 사유별로 구분해 보여준다:
        ① 토큰 소진   — 이번 게임에서 더는 투표 불가
        ② 거수 안 함  — 토큰은 있으나 이 지명의 1차에 손을 들지 않아 분모에서 제외 */
    const shown=new Set(ballotEligible(nom).map(p=>p.id));
    const rest=S.players.filter(p=>!p.alive && !shown.has(p.id) && nom.votes[p.id]===undefined);
    if(!rest.length) return html;
    const extra=rest.map(p=>`<div class="voterow deadrow spent">
      <span class="vname">${esc(p.name)} 👻</span>
      <button class="vbtn" disabled>찬성</button><button class="vbtn" disabled>반대</button><button class="vbtn" disabled>기권</button>
      <span class="spentlab">${p.deadVote===false?'투표 토큰 소진 — 이번 게임에서 더는 투표할 수 없습니다':'1차에 거수하지 않음 — 이번 지명의 찬반에는 참여할 수 없습니다(분모 제외)'}</span></div>`).join('');
    return html.replace(/(<div class="row" style="margin-top:10px">\s*<button class="primary" onclick="closeBallot)/, extra+'$1');
  };
})();
</script>
<script>
/* ══════════════ 여행자 표 가중 자동 집계 (voting-F) ══════════════
   관료(3표)·도둑(음수표)·부두술사(사망자 토큰 불요)를 집계에 자동 반영한다.
   ▸ 분모(den)·과반 기준(need)은 원본 closeBallot 의 계산을 그대로 쓴다 —
     여기서는 찬성(분자)에만 보정을 얹는다(분모는 다른 레인이 소유한다).
   ▸ 원본 함수는 고치지 않고 전역 이름만 래핑한다. 값으로 미리 붙잡지 않으므로
     나중에 얹히는 래퍼(SABER 원장의 tally 이벤트)가 보정된 숫자를 본다.
   ▸ 모든 능력은 오작동(중독·취함)이면 무효 — 무효 사유도 화면·로그에 남긴다. */
(function(){
  /* 밤 n 에 받은 지목은 낮 n 에 적용된다(advancePhase 가 night n → day n 로 간다). */
  function ctxOf(){
    const ph=S.phase||{};
    const n=(ph.kind==='day'||ph.kind==='night')? ph.n : null;
    const c={n:n, kind:ph.kind, bu:null, th:null, voudon:null, notes:[]};
    if(n==null) return c;
    const pick=(charId,key,ko,glyph)=>{
      const who=S.players.find(p=>p.alive&&p.charId===charId);
      if(!who) return null;
      const rec=S[key];
      const t=(rec&&rec.n===n)? playerOf(rec.pid) : null;
      if(!t) return null;
      /* 공식 States: 능력은 '사용한 그 순간'에 성립한다. 지목 당시 중독·취함이었으면 나중에
         건강해져도 효과가 생기지 않고, 반대로 지목 당시 멀쩡했으면 뒤에 중독돼도 이미 성립한
         지목은 그대로다. 그래서 집계는 투표 시점의 상태가 아니라 지목 레코드의 스냅샷만 본다
         (setTarget 이 eff·src 를 박아 둔다). eff 가 없는 구버전 저장본만 현재 상태로 폴백한다. */
      if(rec.src && rec.src!==who.id){
        c.notes.push(`${glyph} 이 지목을 남긴 ${ko}는 지금의 ${ko}(${who.name})와 다른 사람입니다 — ${t.name}의 표 가중을 적용하지 않습니다.`);
        return null;
      }
      const eff=(typeof rec.eff==='boolean')? rec.eff : !isMalfunctioning(who);
      if(!eff){
        c.notes.push(`${glyph} ${ko}(${who.name}) 지목 당시 오작동(중독/취함) — ${t.name}의 표 가중을 적용하지 않습니다.`);
        return null;
      }
      return t;
    };
    c.bu=pick('bureaucrat','bureaucratTarget','관료','📋');
    c.th=pick('thief','thiefTarget','도둑','🦹');
    const vd=S.players.find(p=>p.alive&&p.charId==='voudon');
    if(vd && !isMalfunctioning(vd)) c.voudon=vd;
    else if(vd) c.notes.push(`🪬 부두술사(${vd.name}) 오작동(중독/취함) — 특례 없이 평소대로 집계합니다.`);
    return c;
  }
  /* 기본 1표 · 관료 지정은 3표 · 도둑 지정은 부호 반전.
     둘 다 걸리면 3×(−1) = −3표. 찬성표에만 적용된다(BotC 는 찬성만 센다). */
  function weightOf(c,pid){
    let w=1;
    if(c.bu && c.bu.id===pid) w=3;
    if(c.th && c.th.id===pid) w=-w;
    return w;
  }
  function adjOf(nom){
    const c=ctxOf(); const rows=[]; const seen={}; let delta=0;
    [c.bu,c.th].forEach(p=>{
      if(!p || seen[p.id]) return;
      seen[p.id]=1;
      const w=weightOf(c,p.id);
      /* 찬반의 분자를 건드리는 규칙은 둘이다 — closeBallot 의 집사 무효표(결과를 n.butlerVoided
         에 남긴다)와 이 여행자 가중. 서로 모르면 무효 처리된 찬성표가 여기서 3표(또는 −3표)로
         되살아난다. '집계에 들어간 찬성표인가'는 closeBallot 이 남긴 기록 하나만 보고 판단한다.
         마감 전(renderNomOpen)에는 butlerVoided 가 아직 없으므로 화면 미리보기는 그대로다. */
      const voided = !!(nom && nom.butlerVoided===p.id);
      const yes = !voided && !!(nom && nom.votes && nom.votes[p.id]==='yes');
      const d=yes? (w-1) : 0;
      delta+=d;
      rows.push({pid:p.id, name:p.name, w:w, yes:yes, d:d, voided:voided});
    });
    return {c:c, rows:rows, delta:delta};
  }
  window.thyVoteWeightCtx=ctxOf;
  window.thyVoteWeightOf=weightOf;
  window.thyVoteAdj=adjOf;

  /* ── 지목 기록 카드 (밤·낮 어느 쪽에서도 입력 가능) ── */
  function setTarget(key,pid){
    const ph=S.phase||{};
    if(ph.kind!=='day' && ph.kind!=='night'){ toast('밤 또는 낮 단계에서만 지목을 기록할 수 있습니다.','warn'); return; }
    const ko=(key==='bureaucratTarget')? '관료' : '도둑';
    const selfChar=(key==='bureaucratTarget')? 'bureaucrat' : 'thief';
    /* 성립 판정은 '지금'이다 — 공식 States 기준으로 능력은 사용한 순간에 성립하고 그 뒤의
       상태 변화는 이미 성립한 지목을 되돌리지 않는다(중독이 풀려도 되살아나지 않고, 뒤늦게
       중독돼도 죽지 않는다). 오작동 여부를 여기서 스냅샷(eff)으로 박아 두고 집계(ctxOf)는
       투표 시점 상태 대신 그 값만 읽는다. src 는 이 지목을 남긴 여행자 본인이다. */
    const self=S.players.find(p=>p.alive&&p.charId===selfChar) || S.players.find(p=>p.charId===selfChar);
    const eff=!!(self && !isMalfunctioning(self));
    S[key]= pid? {pid:pid, n:ph.n, eff:eff, src:self? self.id : null} : null;
    const t=pid? playerOf(pid) : null;
    log(t? `🧳 ${ko} 지목: ${t.name} — 낮 ${ph.n} 찬반 집계에 반영${eff?'':' (지목 당시 오작동 — 가중 미적용)'}`
          : `🧳 ${ko} 지목 해제 (낮 ${ph.n})`);
    save(); renderAll();
  }
  window.thySetTravTarget=setTarget;

  function buildCard(){
    const ph=S.phase||{};
    if(ph.kind!=='day' && ph.kind!=='night') return null;
    const bu=S.players.find(p=>p.alive&&p.charId==='bureaucrat');
    const th=S.players.find(p=>p.alive&&p.charId==='thief');
    const vd=S.players.find(p=>p.alive&&p.charId==='voudon');
    if(!bu && !th && !vd) return null;
    const box=document.createElement('div');
    box.className='card'; box.id='thy-travvote';
    const h=document.createElement('h3'); h.textContent='🧳 여행자 표 가중 — 자동 집계'; box.appendChild(h);
    /* 플레이어 이름은 전부 textContent 로만 넣는다 — 인라인 onclick 보간 없음(저장형 XSS 방지) */
    const mk=(who,key,glyph,ko,hint)=>{
      const row=document.createElement('div'); row.className='row'; row.style.margin='6px 0';
      const lab=document.createElement('b'); lab.textContent=`${glyph} ${ko} (${who.name})`; row.appendChild(lab);
      const sel=document.createElement('select');
      const o0=document.createElement('option'); o0.value=''; o0.textContent='— 지목 없음 —'; sel.appendChild(o0);
      S.players.filter(p=>p.id!==who.id).forEach(p=>{
        const o=document.createElement('option'); o.value=p.id;
        o.textContent=`${p.name} (${charName(p)}${p.alive?'':' 💀'})`;
        sel.appendChild(o);
      });
      const rec=S[key];
      const cur=(rec && rec.n===ph.n && playerOf(rec.pid))? rec : null;
      sel.value=cur? cur.pid : '';
      sel.addEventListener('change', ()=>setTarget(key, sel.value));
      row.appendChild(sel);
      const hn=document.createElement('span'); hn.className='hint';
      /* 이미 기록된 지목은 '지목 당시' 스냅샷으로, 아직 없으면 '지금 지목하면' 기준으로 안내한다 —
         화면 문구와 집계 기준(ctxOf)이 같은 값을 봐야 사회자가 어긋난 숫자를 만나지 않는다. */
      const curEff = cur? ((typeof cur.eff==='boolean')? cur.eff : !isMalfunctioning(who)) : null;
      hn.textContent = (cur && curEff===false)
        ? `${hint} ⚠ 지목 당시 오작동(중독/취함)이었습니다 — 집계에 반영하지 않습니다.`
        : (!cur && isMalfunctioning(who))
          ? `${hint} ⚠ 현재 오작동(중독/취함) — 지금 지목하면 집계에 반영되지 않습니다.`
          : hint;
      row.appendChild(hn);
      return row;
    };
    if(bu) box.appendChild(mk(bu,'bureaucratTarget','📋','관료','지목 대상의 찬성표를 3표로 집계합니다.'));
    if(th) box.appendChild(mk(th,'thiefTarget','🦹','도둑','지목 대상의 찬성표를 −1표로 집계합니다.'));
    if(bu && th){
      const d=document.createElement('div'); d.className='hint';
      d.textContent='📋🦹 같은 사람이 관료·도둑 양쪽에 지목되면 3표 × 음수 = −3표로 집계합니다.';
      box.appendChild(d);
    }
    if(vd){
      const d=document.createElement('div'); d.className='hint'; d.style.marginTop='6px';
      d.textContent = isMalfunctioning(vd)
        ? `🪬 부두술사(${vd.name}) 오작동(중독/취함) — 특례 없이 평소대로 집계합니다.`
        : `🪬 부두술사(${vd.name}) 생존 — 사망자는 투표 토큰 없이 투표할 수 있고 토큰도 소진되지 않습니다. 산 자·죽은 자 구분 없이 그대로 집계합니다. (산 자의 투표 차단·과반 규칙 미적용은 자동화하지 않았으니 필요하면 사회자가 판정하세요.)`;
      box.appendChild(d);
    }
    const foot=document.createElement('div'); foot.className='hint'; foot.style.marginTop='6px';
    foot.textContent='밤에 받은 지목을 여기에 기록하면 그날 낮 찬반 집계에 자동 반영됩니다. 분모·과반 기준은 그대로이고 찬성(분자)만 보정됩니다.';
    box.appendChild(foot);
    return box;
  }
  function inject(paneId, afterFirstCard){
    const pane=document.getElementById(paneId);
    if(!pane || pane.querySelector('#thy-travvote')) return;
    const c=buildCard(); if(!c) return;
    const first=afterFirstCard? pane.querySelector('.card') : null;
    if(first) first.insertAdjacentElement('afterend', c); else pane.appendChild(c);
  }
  const _rn=renderNight, _rd=renderDay;
  renderNight=function(){ _rn(); inject('pane-night', false); };
  renderDay =function(){ _rd(); inject('pane-day', true); };

  /* ── 화면 검산: 2단계 찬반 화면에 가중 내역을 votemath 로 보여준다 ── */
  const _rno=renderNomOpen;
  renderNomOpen=function(nom){
    const c=ctxOf();
    /* 부두술사 생존 시엔 토큰을 이미 쓴 사망자도 투표할 수 있어야 한다.
       렌더 동안만 토큰을 되돌려 원본이 투표 버튼을 그리게 하고 즉시 원복한다(save 하지 않는다). */
    const restored=[];
    if(c.voudon) S.players.forEach(p=>{ if(!p.alive && p.deadVote===false){ p.deadVote=true; restored.push(p); } });
    let html, rawYes=0, need=0;
    try{
      html=_rno(nom);
      /* 분모는 절대 여기서 다시 정의하지 않는다 — voting-B 의 ballotEligible() 이 유일 정의다.
         (헬퍼가 없는 단독 적용 상황에서만 구식 식으로 폴백한다.) */
      const elig=(typeof ballotEligible==='function')
        ? ballotEligible(nom)
        : alivePlayers().concat(S.players.filter(p=>!p.alive && (p.deadVote!==false || (nom&&nom.votes&&nom.votes[p.id]!==undefined))));
      rawYes=elig.filter(p=>nom&&nom.votes&&nom.votes[p.id]==='yes').length;
      /* 문턱은 생존자 기준이다 — closeBallot·renderNomOpen 과 같은 계약.
         elig 는 분자(rawYes)를 세는 집합일 뿐이라 문턱의 기준 인원이 아니다.
         여기가 어긋나면 가중 내역 카드만 다른 과반 기준을 보여준다. */
      need=majority(alivePlayers().length);
    } finally { restored.forEach(p=>{ p.deadVote=false; }); }
    if(!nom || nom.stage!==2) return html;
    const a=adjOf(nom);
    if(!a.rows.length && !a.c.notes.length && !c.voudon) return html;
    const fin=rawYes+a.delta;
    const sg=v=>(v>0?'+':'')+v;
    const wlab=w=>(w===3?'📋 관료 3표':(w===-1?'🦹 도둑 −1표':(w===-3?'📋🦹 관료+도둑 −3표':w+'표')));
    const blk=`<div class="card" style="background:var(--sunken)">
      <h3>🧳 여행자 표 가중 내역</h3>
      <div class="votemath">
        <div class="vmbox"><div class="vlab">가중 전 찬성</div><div class="vval">${rawYes}</div></div>
        <div class="vmbox"><div class="vlab">가중 보정</div><div class="vval">${sg(a.delta)}</div></div>
        <div class="vmbox ${fin>=need?'pass':'fail'}"><div class="vlab">최종 찬성</div><div class="vval">${fin}</div></div>
        <div class="vmbox ${fin>=need?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need}</div></div>
      </div>
      ${a.rows.map(r=>`<div class="hint">${wlab(r.w)} 지정 <b>${esc(r.name)}</b> — ${r.yes?`찬성 반영 ${sg(r.d)}`:'아직 찬성표 없음 (보정 0)'}</div>`).join('')}
      ${a.c.notes.map(t=>`<div class="hint"><mark>${esc(t)}</mark></div>`).join('')}
      ${c.voudon?`<div class="hint">🪬 부두술사(${esc(c.voudon.name)}) 생존 — 사망자는 토큰 없이 투표하며 토큰이 소진되지 않습니다.</div>`:''}
      <div class="hint">※ 분모·과반 기준은 기존 규칙 그대로이며, 위 보정은 찬성(분자)에만 적용됩니다.</div>
    </div>`;
    /* 치환문에 이름이 섞이므로 문자열 대신 함수 치환을 쓴다($&·$' 같은 특수 패턴 방지) */
    return html.replace(/(<div class="row" style="margin-top:10px">\s*<button class="primary" onclick="closeBallot)/, m=>blk+m);
  };

  /* ── 부두술사: 사망자는 토큰 없이 투표하고 토큰이 소진되지 않는다 ── */
  const _cv=castVote;
  castVote=function(nid,pid,v){
    const c=ctxOf();
    const p=playerOf(pid);
    if(!c.voudon || !p || p.alive) return _cv(nid,pid,v);
    const n0=findNom(nid);
    const savedDV=p.deadVote;
    const savedList=n0? (n0.deadVoters||[]).slice() : null;
    p.deadVote=true;                 // 토큰 유무와 무관하게 투표 허용
    const r=_cv(nid,pid,v);
    p.deadVote=savedDV;              // 토큰 소진 없음 — 원복
    const n1=findNom(nid);
    if(n1 && savedList) n1.deadVoters=savedList;
    save(); renderAll();
    return r;
  };

  /* ── 집계: 찬성(분자)에만 가중을 얹는다. den·need 는 원본 값을 그대로 쓴다 ── */
  const _cb=closeBallot;
  closeBallot=function(nid){
    const ret=_cb(nid);
    const n=findNom(nid);
    if(!n || !n.closed) return ret;
    const a=adjOf(n);
    /* 원본 closeBallot 이 집사 무효표를 이미 분자에서 뺐다(n.butlerVoided). 같은 표에
       여기서 다시 가중을 얹으면 무효 처리된 찬성표가 3표(또는 −3표)로 되살아난다 —
       분자를 두 규칙이 서로 모르게 건드리던 자리다. 무효표는 가중 대상에서 제외한다. */
    if(n.butlerVoided){
      a.rows.filter(x=>x.pid===n.butlerVoided && x.d!==0).forEach(x=>{ a.delta-=x.d; x.d=0; x.yes=false; });
    }
    a.rows.forEach(x=>log(`🧳 표 가중: ${x.name} = ${x.w}표 · ${x.yes?`찬성 반영 ${(x.d>=0?'+':'')+x.d}`:(x.voided?'집사 무효표 — 가중 대상 아님(보정 0)':'찬성표 없음 → 보정 0')}`));
    a.c.notes.forEach(t=>log(t));
    if(a.delta!==0){
      const before=n.yes;
      n.yes=before+a.delta;
      n.ratio=n.den? n.yes/n.den : 0;
      n.result=(n.yes>=n.need)? 'pass' : 'yesFail';
      log(`🧳 여행자 표 가중 반영: 찬성 ${before} → ${n.yes}/${n.den} (기준 ${n.need}) → ${n.result==='pass'?'과반 통과':'부결'}`);
      toast(`여행자 표 가중 반영 — 찬성 ${before} → ${n.yes} (기준 ${n.need})`,'warn');
      save(); renderAll();
    }
    return ret;
  };
})();
</script>

/* ── 파워티어 산정 (주관적 평가) ──────────────────────────────────────────────
   powerTier 는 "스크립트가 좋다/강하다"가 아니라 **운영 부하 등급**이다.

     상호작용 복잡도 i (0~4) =
        악마 3종 이상 +1.5 / 2종 +0.75
      + 캐릭터 28종 이상 +1 / 25종 이상 +0.5
      + 미구현(실험판) 캐릭터 비중 40% 이상 +1 / 20% 이상 +0.5
      + 여행자·우화 포함 +0.5
     종합점수 = 사회자 난도(0~5) + 플레이어 난도(0~5) + i      → 0~14

     S: 11 이상 · A: 8.5~10.9 · B: 5.5~8.4 · C: 5.4 이하

   난이도 수치는 teeroz 공표값(difficultySource:'teeroz')을 그대로 쓰고,
   공표값이 없는 스크립트는 티르소스 자체 추정치('estimate')를 넣었다.
   테마·태그·티어는 모두 티르소스의 주관적 편집 판단이며 공식 등급이 아니다. */
const SCRIPT_LIB_TIER_DOC='powerTier = 사회자 난도 + 플레이어 난도 + 상호작용 복잡도(악마 수·캐릭터 수·실험판 비중·여행자/우화 유무)의 종합 운영 부하 등급입니다. S 11↑ / A 8.5↑ / B 5.5↑ / C 5.4↓. 티르소스의 주관적 평가이며 공식 등급이 아닙니다.';
const SCRIPT_LIB_THEMES=['입문','정보전','혼돈','광기·기만','전투·처형','실험적'];

/* 밤 순서 자동화가 실제로 되는 집합 = EDITIONS 3종 순서표 ∪ nightSteps 의 FABLED_SLOT 6종.
   에디션 이름으로 판정하면 edition:'loric' 13종과 FABLED_SLOT 밖 전설 20종이 '자동화 가능'으로
   집계된다 — 실제로는 순서표에 자리가 없다. 깨우지 않는 캐릭터는 순서가 필요 없으므로 제외한다.
   판정은 한쪽으로만 넓힌다(exp 는 종전대로 무조건 미구현) — 기존 '진행 가능' 배지가 근거 없이
   반대로 뒤집히는 일은 만들지 않는다. */
const LIB_AUTO_NIGHT=(function(){
  const s=new Set();
  if(typeof EDITIONS!=='undefined') Object.keys(EDITIONS).forEach(function(k){
    const e=EDITIONS[k]||{};
    (Array.isArray(e.first)? e.first:[]).forEach(function(x){ s.add(x); });
    (Array.isArray(e.other)? e.other:[]).forEach(function(x){ s.add(x); });
  });
  ['angel','buddhist','toymaker','stormcatcher','tor','duchess'].forEach(function(x){ s.add(x); });
  return s;
})();
function libCharMeta(id){
  const c=(typeof CHARACTERS!=='undefined') && CHARACTERS.find(x=>x.id===id);
  /* edition:'exp' 는 백과사전 수록 전용 — 이름·유형은 정식으로 보여주되
     밤 순서가 없으므로 자동화 가능(playable) 판정에서는 미구현으로 센다. */
  if(c) return {ko:c.ko, en:c.en, type:c.type, have:true,
                encyc: c.edition==='exp' || !!((c.first||c.other) && !LIB_AUTO_NIGHT.has(c.id))};
  const m=SCRIPT_LIB_EXTRA_CHARS[id];
  return m? {ko:m.ko, en:m.en, type:m.type, have:false}
          : {ko:id, en:id, type:'unknown', have:false};
}
function libEnrich(s){
  const metas=s.characters.map(libCharMeta);
  s.missing=s.characters.filter((id,i)=>!metas[i].have || metas[i].encyc);
  s.playable=s.missing.length===0;
  const demons=metas.filter(m=>m.type==='demon').length;
  /* 앱 내부 타입 어휘는 'traveler'(TYPE_KO L421 · LIB_TEAM_ORDER L7383), 공식 JSON 은 'traveller' — 양쪽 다 받는다 */
  const extra=metas.filter(m=>m.type==='traveler'||m.type==='traveller'||m.type==='fabled').length;
  const ratio=s.missing.length/s.characters.length;
  let i=0;
  i += demons>=3?1.5 : demons===2?0.75 : 0;
  i += s.characters.length>=28?1 : s.characters.length>=25?0.5 : 0;
  i += ratio>=0.4?1 : ratio>=0.2?0.5 : 0;
  i += extra?0.5:0;
  s.interaction=i;
  s.powerScore=Math.round((s.stDifficulty+s.playerDifficulty+i)*100)/100;
  s.powerTier = s.powerScore>=11?'S' : s.powerScore>=8.5?'A' : s.powerScore>=5.5?'B' : 'C';
  return s;
}
SCRIPT_LIB.forEach(libEnrich);

/* WEEKLY-UPDATE-BLOCK-START
   ↓ 주간 자동 갱신 루틴은 이 마커 사이 구간만 통째로 치환한다.
     items 는 SCRIPT_LIB 의 id 문자열 배열이며, 존재하지 않는 id 는 렌더 시 무시된다. */
const POPULAR = {
  updated: '2026-08-31',
  items: ['tb','trouble-with-violets','no-greater-joy','catfishing','china-shop','on-thin-ice']
};
/* WEEKLY-UPDATE-BLOCK-END */

/* ── 필터 상태 ── */
let libTheme='전체', libTier='전체', libOpen=null;
function libSetTheme(t){ libTheme=t; libRender(); }
function libSetTier(t){ libTier=t; libRender(); }
/* libOpen 은 '섹션:id' 키 — 같은 스크립트가 인기·라이브러리 양쪽에 있어도 한 곳만 펼쳐진다. */
function libToggle(key){ libOpen = libOpen===key ? null : key; libRender(); }

const LIB_TEAM_ORDER=[['townsfolk','마을 주민'],['outsider','외지인'],['minion','하수인'],['demon','악마'],['traveler','여행자'],['fabled','우화'],['unknown','미분류']];
function libEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function libNum(n){ return Number.isInteger(n)? String(n) : String(n); }

function libCard(s, sec){
  const key=(sec||'lib')+':'+s.id;
  const open = libOpen===key;
  return `<div class="libcard${open?' open':''}" data-sid="${s.id}" data-key="${key}" onclick="libToggle('${key}')" role="button" tabindex="0"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();libToggle('${key}')}">
    <div class="libcard-h">
      <span class="tierbadge t${s.powerTier}" title="${libEsc(SCRIPT_LIB_TIER_DOC)}">${s.powerTier}</span>
      <div class="libcard-t">
        <div class="sko">${libEsc(s.ko)}</div>
        <div class="sen">${libEsc(s.en)} <span class="libby">by ${libEsc(s.author)}</span></div>
      </div>
    </div>
    <div class="libstats">
      <span class="libstat" title="사회자 난도">🎩 ST <b class="num">${libNum(s.stDifficulty)}</b></span>
      <span class="libstat" title="플레이어 난도">🙋 Player <b class="num">${libNum(s.playerDifficulty)}</b></span>
      <span class="libstat" title="구성 캐릭터 수">🃏 <b class="num">${s.characters.length}</b>종</span>
      <span class="libstat ${s.playable?'ok':'warn'}" title="${s.playable?'밤 순서·판정 자동화 가능':'밤 순서 미정 캐릭터 '+s.missing.length+'종 — 목록 표시 전용'}">${s.playable?'▶ 진행 가능':'👁 표시 전용'}</span>
    </div>
    <div class="libtags"><span class="libtheme">${libEsc(s.theme)}</span>${s.tags.map(t=>`<span class="libtag">${libEsc(t)}</span>`).join('')}</div>
    ${open? libDetail(s) : ''}
  </div>`;
}

function libDetail(s){
  const groups=LIB_TEAM_ORDER.map(([k,label])=>{
    const list=s.characters.map(libCharMeta).filter(m=>m.type===k);
    if(!list.length) return '';
    return `<div class="libgrp"><div class="libgrp-h"><span class="pill ${k}">${label}</span> <b class="num">${list.length}</b></div>
      <div class="libchars">${list.map(m=>{const auto=m.have&&!m.encyc;return `<span class="libchar${auto?'':' ghosted'}" title="${auto?'':(m.have?'백과사전 수록 — 밤 순서 자동화는 미지원':'티르소스 미수록 — 표시 전용')}">${libEsc(m.ko)}<i>${libEsc(m.en)}</i></span>`;}).join('')}</div></div>`;
  }).join('');
  const src = s.source==='teeroz' ? 'teeroz 시계탑' : 'botcscripts 커뮤니티 DB';
  const dsrc = s.difficultySource==='teeroz' ? 'teeroz 공표값' : '티르소스 추정';
  return `<div class="libdetail" onclick="event.stopPropagation()">
    <p class="libnote">${libEsc(s.note)}</p>
    <div class="libmetaline">출처 ${src} · 난이도 ${dsrc} · 종합 <b class="num">${s.powerScore}</b>점 (ST ${libNum(s.stDifficulty)} + Player ${libNum(s.playerDifficulty)} + 상호작용 ${s.interaction}) → <b>${s.powerTier}</b>티어${s.verified?'':' · <b>미검증</b>'}</div>
    ${s.playable? '' : `<p class="libwarn">⚠ 밤 순서가 정해지지 않은 캐릭터 <b class="num">${s.missing.length}</b>종이 포함되어 자동 밤 진행을 지원하지 않습니다. 아래 토큰 중 <b>점선·흐림 표시</b>된 것이 그 대상이며, 능력·주의사항은 백과사전에서 모두 볼 수 있습니다.</p>`}
    ${groups}
  </div>`;
}

function libRender(){
  const host=document.querySelector('#scriptlib');
  if(!host) return;
  const pop = POPULAR.items.map(id=>SCRIPT_LIB.find(s=>s.id===id)).filter(Boolean);
  const list = SCRIPT_LIB.filter(s=>(libTheme==='전체'||s.theme===libTheme) && (libTier==='전체'||s.powerTier===libTier))
                         .slice().sort((a,b)=>b.powerScore-a.powerScore);
  const chip=(cur,val,fn,extra)=>`<button class="libchip${cur===val?' on':''}${extra||''}" onclick="${fn}('${val}')">${libEsc(val)}</button>`;
  const counts={};SCRIPT_LIB.forEach(s=>counts[s.powerTier]=(counts[s.powerTier]||0)+1);
  host.innerHTML=`
    <div class="secthead"><span class="shicon">🔥</span> 인기 스크립트
      <span class="libupd">마지막 갱신: ${libEsc(POPULAR.updated)}</span></div>
    <div class="scriptgrid libgrid">${pop.map(x=>libCard(x,'pop')).join('')}</div>

    <div class="secthead"><span class="shicon">📚</span> 스크립트 라이브러리
      <span class="libupd">${SCRIPT_LIB.length}종 · teeroz ${SCRIPT_LIB.filter(s=>s.source==='teeroz').length} / 커뮤니티 ${SCRIPT_LIB.filter(s=>s.source==='community').length}</span></div>
    <div class="libfilters">
      <div class="libfrow"><span class="libflabel">테마</span>
        ${chip(libTheme,'전체','libSetTheme')}${SCRIPT_LIB_THEMES.map(t=>chip(libTheme,t,'libSetTheme')).join('')}</div>
      <div class="libfrow"><span class="libflabel" title="${libEsc(SCRIPT_LIB_TIER_DOC)}">파워티어 <i>ⓘ</i></span>
        ${chip(libTier,'전체','libSetTier')}${['S','A','B','C'].map(t=>chip(libTier,t,'libSetTier',' tier t'+t)).join('')}</div>
      <p class="hint libtierdoc">${libEsc(SCRIPT_LIB_TIER_DOC)} 현재 분포 — S ${counts.S||0} · A ${counts.A||0} · B ${counts.B||0} · C ${counts.C||0}.</p>
    </div>
    ${list.length? `<div class="scriptgrid libgrid">${list.map(x=>libCard(x,'lib')).join('')}</div>`
                 : '<p class="hint">조건에 맞는 스크립트가 없습니다.</p>'}`;
}

/* renderScripts 래핑 — 원본은 그대로 두고 뒤에 섹션만 덧붙인다. */
(function(){
  if(typeof renderScripts!=='function') return;
  const _origRenderScripts=renderScripts;
  window._origRenderScripts=_origRenderScripts;
  window.renderScripts=function(){
    _origRenderScripts.apply(this, arguments);
    const pane=document.querySelector('#pane-scripts');
    if(!pane) return;
    let host=pane.querySelector('#scriptlib');
    if(!host){
      host=document.createElement('div');
      host.id='scriptlib';
      const card=pane.querySelector('.card');
      (card||pane).appendChild(host);
    }
    libRender();
  };
  if(typeof activeTab!=='undefined' && activeTab==='scripts' && document.querySelector('#pane-scripts')) window.renderScripts();
})();
</script>
