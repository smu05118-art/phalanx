undertaker:{howto:[
 '밤 시작 전에 오늘 처형 유무부터 확인 — 처형이 없던 밤에는 깨우지 않는다.',
 '첩자·은둔자·주정뱅이 처형 시 무엇을 보여줄지는 처형 확정 직후 미리 정해 두면 밤 진행이 매끄럽다.'],
examples:[
 '낮에 은둔자가 처형됐다. 그 밤 장의사에게 "임프" 토큰을 보여주는 재량을 택했다(실제 악마 사망이 아니므로 게임은 계속). 다음 날 마을은 "악마가 죽었는데 왜 밤 사망이?"라며 대혼란 — 은둔자 등록 재량의 대표적 활용.']},
monk:{howto:[
 '보호 판정은 임프 지목 순간에 — 이 도구의 살해 판정 버튼이 보호를 자동 체크한다.',
 '공격이 막힌 아침의 "사망 없음"은 수도사·군인·시장 모두의 가능성을 남긴다 — 어느 쪽으로도 티 내지 말 것.'],
examples:[
 '수도사가 점쟁이를 보호한 밤 임프가 점쟁이를 지목했다. 사망 없는 아침에 임프는 "군인을 쳤다"고 오판하고 다음 밤 다시 점쟁이를 노렸지만, 수도사는 이번엔 다른 사람을 보호했고 점쟁이가 죽었다.']},
ravenkeeper:{howto:[
 '임프 살해 판정 직후 "죽은 사람이 까마귀지기인가?"를 반드시 확인 — 가장 잊기 쉬운 발동이다.',
 '죽는 순간 중독이었다면 거짓 캐릭터를 보여줄 수 있다 — 악마에게 유리한 거짓을 고를 기회.'],
examples:[
 '임프가 까마귀지기를 죽인 밤, 깨어난 까마귀지기가 첩자를 지목했다. 재량으로 "세탁부" 토큰을 보여줬고, 다음 날 죽은 자의 유언 정보로 첩자는 완전한 신뢰를 얻었다.']},
virgin:{howto:[
 '최초 지명 순간에만 발동 — 지명 접수 전 성결자 여부를 스치듯 확인(투표 패널이 자동 경고).',
 '발동하면 그날 처형은 그것으로 소모 — 이어지는 지명·투표는 진행하지 않는다.'],
examples:[
 '2일차 낮, 세탁부가 성결자를 지명했다. 즉시 세탁부가 처형됐고 마을은 성결자를 강하게 신뢰하게 됐지만, 그날 처형이 소모되어 임프는 하루를 벌었다.']},
slayer:{howto:[
 '공개 지목은 낮 어느 시점이든 가능 — 접수 즉시 판정하고, 성공·실패와 무관하게 소진 처리.',
 '가짜 처단자 주장(악 팀 블러프)에도 똑같은 톤으로 "아무 일도 일어나지 않습니다"라고 답할 것.'],
examples:[
 '4일차 낮, 처단자가 조용하던 플레이어를 공개 지목했다. 실제 임프였고 즉시 사망 — 하지만 생존 6인이라 탕녀가 계승했다. 마을이 승리를 확신하는 사이 게임은 계속됐다.']},
soldier:{howto:[
 '임프가 군인을 지목하면 조용히 사망 없음 처리 — 임프에게 어떤 힌트도 주지 않는다.',
 '사망 없는 아침의 원인(군인/수도사/시장 재량)은 사회자만 안다 — 표정을 한결같이.'],
examples:[
 '임프가 이틀 연속 같은 군인을 지목해 이틀 연속 사망 없는 아침이 밝았다. 마을은 수도사의 활약이라 착각했고, 독살범이 사흘째 밤 군인을 중독시키자 그제야 군인이 죽었다.']},
mayor:{howto:[
 '총알받이 재량(대신 죽을 사람)은 균형 도구 — 선이 유리하면 시장을 그대로 보내고, 악이 몰리면 정보가 소진된 주민을 대신 보낼 수도 있다.',
 '생존 3인이 되면 낮 시작부터 시장 승리 조건을 염두에 — 처형 없이 낮이 끝나는 순간 즉시 선 승리 선언.'],
examples:[
 '생존 3인(시장·임프·독살범). 독살범이 밤에 시장을 중독시켰고 낮에 마을은 처형을 포기했다. 시장이 중독 상태라 승리 조건이 불발 — 게임은 하루 더 이어져 결국 악이 이겼다.']},
butler:{howto:[
 '투표 순간마다 "주인이 손을 들었는가"를 먼저 확인 — 이 도구의 투표 패널이 자동 체크한다.',
 '죽은 집사는 유령 투표 토큰을 자유롭게 쓸 수 있다 — 제한은 살아있는 동안만.'],
examples:[
 '결정적 처형 표결에서 주인이 손을 내리자 집사도 들 수 없었고, 1표 차로 처형이 무산됐다. 악 팀은 집사의 주인이 누구인지 역추리해 다음 낮 그를 회유 대상으로 삼았다.']},
drunk:{howto:[
 '매 밤 위장 캐릭터의 순서에 깨워 정보를 주되, 반드시 거짓일 필요는 없다 — 대개 거짓이 유효하지만 정체 보호를 위해 참을 섞어도 된다. 무엇을 말했는지 반드시 메모.',
 '거짓을 줄 때는 "완전히 틀린 것"보다 "한 끗 어긋난 것"이 오래 간다 — 실제 판과 적당히 겹치게 설계.'],
examples:[
 '초공감자로 위장한 주정뱅이에게 매일 밤 0을 줬다. 실제 이웃 중 한 명이 임프였기에, 마을은 그의 "깨끗한 이웃" 발언을 믿고 임프를 오래 방치했다.']},
recluse:{howto:[
 '정보 판정마다 "이번엔 악으로 등록할까?"를 의식적으로 결정 — 게임당 1~2회의 결정적 순간에만 쓰는 것이 요령.',
 '처단자 지목·장의사 확인 같은 공개성 판정에서의 악 등록은 파급이 크다 — 쓰기 전에 게임이 끝나 보이지 않는지 확인.'],
examples:[
 '처단자가 은둔자를 공개 지목한 순간, 악마로 등록해 죽는 재량을 택했다. 마을은 "악마를 잡았다"고 확신했지만 밤 사망이 이어졌고, 처단자 능력은 이미 소진 — 악 팀에게 이틀의 여유가 생겼다.']},
saint:{howto:[
 '성자 지명이 접수되면 표결 전에 중독 여부를 확인해 둔다(투표 패널 자동 경고).',
 '정상 성자의 처형이 확정되는 순간 즉시 게임 종료 선언 — 표 계산을 두 번 확인할 것.'],
examples:[
 '독살범이 밤에 성자를 중독시키고 악 팀이 낮에 성자를 몰아 처형시켰다. 중독 상태라 선 패배는 발동하지 않았지만, 마을은 "성자가 처형됐는데 게임이 계속되니 저 사람은 성자가 아니었다"는 잘못된 추리에 빠졌다.']},
poisoner:{howto:[
 '독살범이 밤 순서 맨 앞인 이유를 활용 — 오늘 밤 깨어날 정보 캐릭터를 중독시키면 그 정보를 거짓으로 줄 수 있다.',
 '낮 능력(성자·성결자·처단자)도 중독된 낮 동안 오작동 — 낮 판정 전에 중독 토큰을 확인하는 습관을.'],
examples:[
 '독살범이 성결자를 중독시킨 낮, 주민이 성결자를 지명했지만 발동하지 않았다(능력은 소진). 마을은 "성결자가 가짜"라고 판단해 다음 날 진짜 성결자를 처형했다.']},
spy:{howto:[
 '그리모어를 보여줄 땐 충분한 시간을 — 첩자의 정보력이 악 팀 전략의 중심이 된다.',
 '등록 재량(선/주민/외지인)은 판정마다 개별 결정하되, 한 게임 안에서 방침의 일관성을 유지.'],
examples:[
 '첩자가 성결자를 지명하는 순간 "주민 등록" 재량으로 성결자 능력을 발동시켰다. 첩자는 처형됐지만 마을은 그를 확실한 주민으로 믿고 묻었고, 성결자 능력은 소진됐다.']},
scarletwoman:{howto:[
 '악마가 처형·사망 위기에 몰릴 때마다 생존자 수(5인 이상?)와 탕녀의 중독 여부를 함께 확인.',
 '계승이 일어나면 태연하게 밤으로 — 그 밤 탕녀를 깨워 임프 토큰을 보여주고 이후 임프로 활동시킨다.'],
examples:[
 '생존 6인에서 임프가 처형됐다. 게임 종료를 선언하지 않고 밤으로 진행해 탕녀를 깨워 임프 토큰을 보여줬다. 새 임프가 그 밤 처단자를 죽이며 마을의 승리 확신을 무너뜨렸다.']},
baron:{howto:[
 '밤에 깨우지 않는다 — 일은 셋업(주민 −2, 외지인 +2)에서 끝난다.',
 '사서의 외지인 정보와 구성 논쟁이 남작 존재의 단서 — 낮 논쟁이 스스로 굴러가게 두는 것이 좋다.'],
examples:[
 '남작 게임에서 중독된 사서에게 "외지인 0"을 줬다. 마을은 남작 가능성을 배제했고, 외지인 2명(주정뱅이·성자)은 끝까지 서로를 주민이라 믿었다.']},
imp:{howto:[
 '살해 판정 순서(보호 → 군인 → 시장 재량 → 사망)를 이 도구의 판정 버튼으로 처리하면 자동 체크된다.',
 '자기 지목(별 넘기기)은 하수인에게 임프를 계승시키는 악 팀의 기술 — 계승자를 깨워 임프 토큰을 보여줄 것.'],
examples:[
 '수사관에게 정체가 반쯤 드러난 임프가 밤에 자신을 지목했다. 탕녀에게 별을 넘기고 아침에 임프의 사망을 공표 — 마을은 "밤에 죽었으니 악마가 아니었다"고 판단해 수사관 정보를 폐기했다.']},
/* ── 피로 물든 달(BMR) ── */
grandmother:{howto:[
 '악마가 손주를 죽인 밤엔 할머니도 같은 밤에 함께 사망 처리 — 아침에 두 사망을 같이 공표.',
 '할머니가 중독인 밤의 손주 사망은 연동 없음 — 판정 전에 상태부터 확인.'],
examples:[
 '푸카가 손주를 중독시켜 다음 밤 손주가 죽자 할머니도 함께 죽었다. 한 밤 2명 사망 공표에 마을은 샤발로스나 포를 의심하며 악마 종류 추리에 혼선을 겪었다.']},
sailor:{howto:[
 '"누가 취할지"는 사회자 선택 — 선원이 계속 멀쩡하면 사실상 불사신이 되므로, 균형을 보며 선원 쪽을 취하게 할 타이밍을 잰다.',
 '멀쩡한 선원은 처형조차 무효 — 처형 확정 전 취함 여부를 확인.'],
examples:[
 '마을이 선원을 처형했지만 그날 선원은 멀쩡한 상태라 죽지 않았다. "처형이 안 통한다"는 사실로 선원의 정체는 공증됐지만, 그날의 처형은 소모됐고 악마는 하루를 벌었다.']},
chambermaid:{howto:[
 '"자기 능력 때문에 깨어남"만 계산 — 악마의 살해 지목, 정보 수령 기상 모두 포함. 애매한 사례는 첫 판정 때 기준을 정해 게임 내내 유지.',
 '지목은 자신 외 생존자 2명 — 사망자 지목은 정중히 다시 받는다.'],
examples:[
 '객실 청소부가 조용한 두 명을 찍어 "1"을 받았다. 한 명은 매일 깨는 독살범류 하수인이었고, 이후 청소부는 밤 순서 추리로 그 후보를 좁혀 갔다.']},
exorcist:{howto:[
 '지목이 악마와 일치하면 악마를 깨워 구마사제를 가리켜 보여주고, 그 밤 악마의 살해 단계를 통째로 건너뛴다.',
 '이 과정에서 악마는 구마사제가 누군지 알게 된다 — 다음 밤 최우선 표적이 될 수 있음을 염두에.'],
examples:[
 '구마사제가 좀버얼을 정확히 지목했다. 그 밤 좀버얼은 활동하지 못해 사망 없는 아침이 밝았고, 다음 밤 좀버얼은 즉시 구마사제를 죽였다 — 마을은 "누군가 악마를 하루 봉인했었다"는 단서를 얻었다.']},
innkeeper:{howto:[
 '보호 2명 중 1명 취함 — 누구를 취하게 할지는 균형 재량(정보 캐릭터를 취하게 하면 다음 정보가 흔들린다).',
 '암살자의 살해는 이 보호를 관통한다 — 판정 순서에 주의.'],
examples:[
 '여관 주인이 도박사와 험담꾼을 보호하고 도박사를 취하게 했다. 그 밤 취한 도박사는 추측이 틀렸는데도 죽지 않았고(능력 오작동), 다음 날 "틀렸는데 살아있다"는 사실에서 여관 주인의 보호를 역추리했다.']},
gambler:{howto:[
 '추측 접수 → 정답 판정 → 오답이면 그 자리에서 밤 사망 처리(아침 공표).',
 '미치광이를 "악마"로 추측하는 등 등록이 애매한 판정은 방침을 미리 정해 일관되게.'],
examples:[
 '사흘 연속 정답으로 신뢰를 쌓은 도박사가 4일째 밤 미치광이를 "악마"로 추측했다. 미치광이는 악마가 아니므로 오답 — 도박사는 죽었지만, 마을은 "그가 찍은 사람이 진짜 악마는 아니다"라는 유언 정보를 얻었다.']},
gossip:{howto:[
 '낮의 공개 험담을 접수하면 진위를 그 자리에서 판정해 메모(판정 결과는 비공개).',
 '참이면 그 밤 1명 사망 — 대상은 사회자 선택이므로 균형을 보고 고른다. 험담꾼이 중독이면 참이어도 사망 없음.'],
examples:[
 '험담꾼이 낮에 "이 게임에 미치광이가 있다"고 험담했다. 사실이었고, 그 밤 재량으로 미치광이를 죽였다 — 아침 사망 공표에 진짜 악마는 자신의 방패막이를 잃었다.']},
courtier:{howto:[
 '발동은 캐릭터 이름 지목 — 그 캐릭터가 게임에 없으면 아무 일 없이 소진된다.',
 '취함 3일(밤 3+낮 3) 카운트를 그리모어 메모로 관리하고 만료 시점에 해제.'],
examples:[
 '궁정대신이 2일차 밤 "포"를 지목했다. 포가 사흘간 취해 살해가 불발됐고, 사망 없는 아침이 이어지자 악 팀은 궁정대신의 발동을 눈치채고 낮에 그를 몰아 처형했다.']},
professor:{howto:[
 '발동 밤에 죽은 플레이어 1명 지목 — 주민이면 되살리고 아침에 소생을 공표한다.',
 '소생자는 능력도 돌아온다(1회성 능력은 이미 썼다면 소진 유지) — 상태 토큰을 재정비할 것.'],
examples:[
 '교수가 처형당했던 찻집 여인을 되살렸다. 아침 소생 공표에 마을이 술렁였고, 되살아난 찻집 여인의 양옆 보호가 다시 켜지며 악마의 살해 계획이 꼬였다.']},
minstrel:{howto:[
 '하수인이 "처형으로" 죽는 순간 발동 — 다음 황혼까지 음유시인을 제외한 전원에게 취함 토큰.',
 '발동 중의 밤 정보는 전부 거짓 가능, 악마의 살해도 불발 — 그 하루는 사실상 정보 암전임을 의식하고 운영.'],
examples:[
 '암살자가 처형된 날 마을 전체가 취했다. 그 밤 모든 정보를 그럴듯한 거짓으로 주고 악마의 살해도 불발 처리 — 다음 날 마을은 "어젯밤 정보는 전부 의심하라"는 경고 속에 하루를 다시 시작했다.']},
tealady:{howto:[
 '살아있는 양옆 이웃이 모두 선일 때만 보호 — 좌석·사망이 바뀔 때마다 재계산.',
 '보호는 처형까지 막는다 — 처형 불발이 공개되면 찻집 여인의 위치 구도가 노출됨을 염두에.'],
examples:[
 '마을이 찻집 여인의 이웃(선)을 처형했지만 죽지 않았다. "안 죽는 사람 곁에 찻집 여인이 있다"는 공개 정보가 되어, 역설적으로 악 팀이 그녀의 좌석을 특정하는 단서가 됐다.']},
pacifist:{howto:[
 '선한 플레이어의 처형이 확정될 때마다 "살릴 것인가"를 재량 판정 — 남발하면 처형 제도가 무너지므로 결정적 1~2회에.',
 '살린 경우에도 그날 처형은 소모된 것으로 처리한다.'],
examples:[
 '마을이 할머니를 오판 처형하려던 날 평화주의자 재량으로 살렸다. 처형 불발은 "할머니는 선하다"는 강한 신호가 됐고, 악 팀은 그날 밤 즉시 할머니를 노렸다.']},
fool:{howto:[
 '첫 사망 순간(처형·밤 살해 불문) 1회 무효 — 발동 즉시 ✔소진 표시, 이후엔 평범하게 죽는다.',
 '발동 순간 취함/중독이면 그냥 죽는다 — 판정 전 상태 확인.'],
examples:[
 '어릿광대가 처형됐지만 죽지 않았다(1회 발동). 마을은 그를 어릿광대로 확신했지만, 그날 밤 포가 그를 지목하자 이번엔 그대로 죽었다.']},
goon:{howto:[
 '밤마다 "건달을 가장 먼저 지목한 능력"만 발동 — 지목자는 취하고(그 밤+다음 낮) 건달은 그 지목자의 진영이 된다.',
 '건달의 현재 진영을 그리모어에 상시 표시 — 진영 관련 판정에 즉시 반영.'],
examples:[
 '여관 주인이 보호 대상 중 하나로 건달을 지목했다. 최초 지목자였던 여관 주인은 취해 그 밤 보호가 전부 무효가 됐고, 악마의 살해가 그대로 통과해 마을은 애꿎은 여관 주인을 의심했다.']},
lunatic:{howto:[
 '첫날 밤 진짜 악마보다 먼저 깨워 가짜 하수인·블러프 정보를 주고, 진짜 악마에게는 미치광이가 누군지 보여준다.',
 '매 밤 살해 지목을 받되 효과는 없음 — 그 지목을 진짜 악마에게 손짓으로 전달해 기만을 완성시키는 재량도 가능.'],
examples:[
 '미치광이가 매 밤 지목한 대상을 진짜 좀버얼이 그대로 죽여줬다. 미치광이는 자신이 악마라 확신한 채 낮에도 악마답게 행동했고, 마을이 그를 처형했을 때 진짜 악마는 안전하게 숨어 있었다.']},
tinker:{howto:[
 '밤이든 낮이든 재량으로 죽일 수 있다 — 살해가 불발된 밤의 사망 보정이나 서사적 타이밍에 활용.',
 '죽이는 순간의 명분(균형·재미)을 스스로 설명할 수 있을 때만 발동할 것.'],
examples:[
 '사망 없는 밤이 이어지며 마을이 패턴 추리를 시작하자 땜장이를 재량으로 죽여 밤 사망의 규칙성을 흐렸다 — 마을은 악마의 살해와 구분하지 못했다.']},
moonchild:{howto:[
 '사망을 "알게 된" 즉시 지목을 받는다 — 처형이면 낮에 바로, 밤 사망이면 깨워서.',
 '대상이 선하면 그날 밤 사망 처리, 악하면 아무 일 없음(어느 쪽이었는지는 비공개).'],
examples:[
 '달의 자손이 처형 직후 자신을 몰아붙인 플레이어를 지목했다. 선한 플레이어라 그날 밤 죽었다 — 한 번의 처형이 선 두 명을 지운 셈이 되어 마을이 크게 위축됐다.']},
godfather:{howto:[
 '"낮에 외지인이 죽은 날"만 밤에 깨운다 — 처형 등 낮 사망 기준이며 밤 사망은 발동 없음.',
 '셋업의 외지인 ±1 조정을 잊지 말 것.'],
examples:[
 '낮에 미치광이가 처형되자 그 밤 대부가 깨어나 1명을 추가로 죽였다. 하룻밤 2명 사망에 마을은 악마의 종류를 오판하기 시작했다.']},
devilsadvocate:{howto:[
 '매일 밤 전날과 다른 생존자를 지목받아 처형 면역 토큰을 옮긴다.',
 '면역이 발동해도 처형 자체는 성립(그날 처형 소모) — "처형됐는데 살아있다"는 공개 사건이 된다.'],
examples:[
 '악마의 변호사가 악마에게 면역을 걸어 둔 날, 마을이 정확히 악마를 처형했지만 죽지 않았다. 마을은 선원이나 찻집 여인의 보호로 오판했고, 악마는 하루를 더 살았다.']},
assassin:{howto:[
 '발동 밤엔 모든 보호·면역을 관통해 무조건 사망 — 다른 판정 없이 죽인다.',
 '1회 소진 표시를 잊지 말 것.'],
examples:[
 '찻집 여인의 보호로 이틀을 버틴 주민을 암살자가 발동으로 관통해 죽였다. "절대 안 죽던 사람이 죽었다"는 사실에서 마을은 암살자의 존재를 역추리했다.']},
mastermind:{howto:[
 '악마가 처형으로 죽어도 게임 종료를 선언하지 않고 태연히 하루 더 진행 — 그 밤엔 아무도 죽지 않는다.',
 '다음 낮의 처형 결과로 즉시 판정: 선한 플레이어 처형 = 악 승리, 그 외 = 선 승리.'],
examples:[
 '악마가 처형됐는데 게임이 끝나지 않자 마을은 "진짜 악마가 따로 있다"고 판단해 다음 날 가장 의심스러운 주민을 처형했다. 선한 플레이어였고, 주모자의 조건이 완성되며 악이 이겼다.']},
zombuul:{howto:[
 '"오늘 아무도 죽지 않은 날"만 밤에 깨운다 — 낮 처형·밤 사망을 합쳐 하루 사망 유무를 체크.',
 '첫 사망은 죽은 척: 공개적으로는 사망 처리(유령 투표 토큰 지급)하되 그리모어엔 생존 표시, 밤에 계속 깨운다.'],
examples:[
 '좀버얼이 처형되어 "죽었다". 이후 처형 없는 날마다 밤 사망이 이어졌지만, 마을은 죽은 좀버얼을 용의선상에서 제외한 채 엉뚱한 생존자만 추궁했다.']},
pukka:{howto:[
 '2단계 추적: 오늘의 지목 → 중독 토큰, 어젯밤 중독자 → 오늘 밤 사망+독 해제.',
 '첫날 밤에도 깨워 지목을 받는다(사망은 둘째 밤부터 발생).'],
examples:[
 '푸카가 1일차 밤 객실 청소부를 중독시켰다. 청소부는 그 밤 거짓 정보를 받았고 2일차 밤에 죽었다 — 마을은 "죽기 전에 받은 정보"를 신뢰했다가 이중으로 당했다.']},
shabaloth:{howto:[
 '매 밤 2명 지목·각각 판정 — 전날 희생자 명단을 그리모어에 남겨 소생 재량에 대비.',
 '소생 재량은 균형 도구 — 정보가 소진된 플레이어를 살리면 악에 유리, 핵심 주민을 살리면 선에 숨통.'],
examples:[
 '샤발로스가 전날 죽인 할머니를 되살렸다. 마을은 이 소생을 교수의 발동으로 오판했고, "교수가 살아있다"는 잘못된 전제 위에 추리를 쌓았다.']},
po:{howto:[
 '매 밤 "0명 또는 1명" — 0명을 고른 밤엔 충전 표시를 남기고, 다음 밤 3명 지목을 받는다.',
 '3연속 사망 판정은 각각 보호·상태를 따로 체크.'],
examples:[
 '사망 없는 아침에 마을은 보호 성공이라 안심했다. 다음 밤 포가 3명을 쓸어 담으며 판이 뒤집혔다 — "조용한 밤 뒤의 폭풍"이 포의 시그니처다.']},
/* ── 화단에 꽃피운 이단(SV) ── */
clockmaker:{howto:[
 '첫날 밤 한 번뿐 — 셋업 직후 좌석표에서 악마↔최근접 하수인 거리를 미리 계산해 둔다.',
 '보르톡스 게임이면 반드시 틀린 수를 줄 것(거짓 의무).'],
examples:[
 '시계공이 "2"를 받았다. 낮 좌석 추리로 후보 쌍이 좁혀지자, 하수인이 먼저 "내가 시계공인데 3을 받았다"고 나서며 정보전을 흐렸다.']},
dreamer:{howto:[
 '제시할 [선, 악] 캐릭터 쌍을 미리 몇 개 준비해 두면 밤이 빨라진다 — 진짜 캐릭터 하나 + 그럴듯한 반대 진영 하나.',
 '같은 대상을 재지목받으면 다른 쌍을 줘도 되지만, 이전 제시와 모순되지 않게.'],
examples:[
 '꿈꾸는 자가 마귀할멈을 지목받아 [예언자, 마귀할멈]을 제시했다. 대상이 마침 예언자를 자칭하고 있었기에 마을은 반반 확률에 갇혔고, 이틀 뒤 진짜 예언자가 나서면서 마귀할멈이 몰렸다.']},
snakecharmer:{howto:[
 '스왑은 강제·즉시: 두 사람을 각각 깨워 새 캐릭터·진영을 안내하고, 전 악마(새 뱀 조련사)에게 ☠영구 중독 토큰.',
 '스왑 후 그리모어와 밤 순서를 새 악마 기준으로 전면 갱신.'],
examples:[
 '3일차 밤 뱀 조련사가 노 다시를 지목해 스왑됐다. 영구 중독된 새 뱀 조련사(전 악마)는 매일 지목을 이어갔지만 효과가 없었고, 낮에 진실을 말해도 아무도 믿지 않았다.']},
mathematician:{howto:[
 '하루 동안 "능력이 규칙대로 작동하지 않은" 플레이어를 그때그때 카운트 — 중독·취함으로 거짓 정보를 준 경우가 대표.',
 '집계 기준(등록 재량 포함 여부 등)을 첫날 정해 게임 내내 유지.'],
examples:[
 '중독된 꿈꾸는 자가 거짓 쌍을 받은 날, 수학자에게 "1"을 알려줬다. 수학자가 공개하자 마을은 "어젯밤 누군가의 정보 하나는 가짜"라며 전날 공개된 정보들을 재검증했다.']},
flowergirl:{howto:[
 '낮 표결에서 악마의 거수 여부를 기록(투표 패널이 자동 저장) — 표결이 없던 날은 "아니오"로.',
 '악마가 투표를 계속 피하면 그 자체가 낮의 행동 단서가 된다.'],
examples:[
 '이틀 연속 "아니오"를 받은 꽃팔이 소녀가 이를 공개하자, 마을은 투표에 소극적이던 두 명으로 용의자를 좁혔다. 셋째 날 악마가 어쩔 수 없이 거수했고 "예"로 바뀌며 포위망이 완성됐다.']},
towncrier:{howto:[
 '그날 지명자 명단에서 하수인 유무만 판정 — 지명 기록은 낮 패널이 자동 저장한다.',
 '하수인이 지명을 아예 안 하는 식으로 회피할 수 있다 — 낮 운영과 연결되는 정보임을 의식.'],
examples:[
 '포고꾼이 사흘 내리 "아니오"를 받았다. 마을은 "지명한 적 없는 사람들" 중에 하수인이 있다고 역추리해 조용한 플레이어들을 심문하기 시작했다.']},
oracle:{howto:[
 '죽은 자 중 악의 수만 세면 된다 — 사망자 명단을 패널에서 확인.',
 '"어제 처형한 사람이 악이었는가"에 대한 간접 답, 즉 처형 결과 검증기 역할을 한다.'],
examples:[
 '이틀 연속 처형에 성공했다고 믿던 밤, 예언자가 "0"을 받았다. 죽은 둘 다 선이었다는 뜻 — 다음 날 마을은 추리를 처음부터 다시 짰다.']},
savant:{howto:[
 '매일 낮 1회 응대 — [참, 거짓] 정보 짝을 아침마다 미리 준비해 두면 진행이 매끄럽다.',
 '참 정보는 게임을 바로 끝내지 않을 수준으로, 거짓 정보는 그럴듯하게 — 짝의 난이도를 맞출 것.'],
examples:[
 '백치천재에게 "이 게임에 외지인은 2명이다"(참)와 "하수인 둘이 이웃해 앉아 있다"(거짓)를 줬다. 마을은 이틀에 걸쳐 두 명제를 교차 검증하며 낮 토론의 축으로 삼았다.']},
seamstress:{howto:[
 '발동은 1회 — 지목한 2명이 "서로 같은 진영인지"만 예/아니오로 답하고 소진 표시.',
 '중독·취함이면 답은 임의(거짓 가능·참도 가능), 보르톡스 생존 시엔 반드시 거짓 — 답하기 전 상태 확인.'],
examples:[
 '재봉사가 서로 으르렁대던 두 명을 지목해 "예(같은 진영)"를 받았다. 둘 다 선이라는 뜻이었지만 마을 일부는 "둘 다 악"으로 해석했다 — 정보의 양면성이 낮을 뜨겁게 달궜다.']},
philosopher:{howto:[
 '발동 시 선한 캐릭터 하나를 골라 능력을 부여 — 이후 밤 순서에서 그 캐릭터의 위치에 깨울 것(수동 관리).',
 '고른 캐릭터가 게임에 실재하면 원 보유자는 영구 취함 — 🍺토큰과 함께 메모.'],
examples:[

<script>
/* ══════════════════ 밤 인터랙티브 위저드 ══════════════════
   씬 스키마 (에이전트 참고용 문서):
   NIGHT_FLOW[charId 또는 'minioninfo'/'demoninfo'] = { first:[Scene], other:[Scene] }  (해당 밤에만 쓰면 한쪽만)
   Scene 타입:
   - {t:'wake',  text?}                         : "○○을 깨우세요" 사회자 카드
   - {t:'note',  text}                          : 사회자 전용 안내 카드
   - {t:'pick-player', n, who:'player'|'st', label, filter:'alive'|'alive-not-self'|'any'|'any-not-self'|'dead', storeAs}
       who:'player'면 "플레이어가 지목한 대상을 탭" 문구. 선택 결과는 vars[storeAs]=[pid,...]
   - {t:'pick-character', pool, n?, label, storeAs}
       pool: 'inplay-townsfolk'|'inplay-outsider'|'inplay-minion'|'townsfolk'|'good-notinplay'|'any-edition'
   - {t:'show-token', from|char, caption}       : 📱 플레이어에게 보여주는 전체화면 — 캐릭터 토큰 1개
   - {t:'show-tokens', from, caption}           : 토큰 여러 개(블러프 등)
   - {t:'show-players', from, caption}          : 지목 대상 표시 화면
   - {t:'show-number', suggest?, caption}       : 숫자 선택(0~9) 후 전체화면 표시. suggest=WIZ_SUGGEST 키
   - {t:'show-answer', options, suggest?, caption}: 예/아니오류 선택 후 전체화면 표시
   - {t:'effect', fn, from}                     : 기존 판정 함수 호출(fn: doPoison|doProtect|doMaster|doImpKill|doCurse|doMad|doStepKill|doExorcist|doSailorDrunk|doInnkeeperDrunk|doCourtierDrunk, from=storeAs 첫 대상)
   - {t:'sleep', text?}                         : "재우세요" 카드
   show-* 씬은 화면 아무 곳이나 탭하면 다음으로 진행(폰을 플레이어에게 보여주는 용도).
   모든 문구는 자체 작성 원칙. */
let wiz=null;
function flowFor(stepId){
  const f=NIGHT_FLOW[stepId]; if(!f) return null;
  const first=S.phase.n===1;
  return first? (f.first||null) : (f.other||null);
}
function startWiz(stepId){
  const srcScenes=flowFor(stepId); if(!srcScenes) return;
  const scenes=srcScenes.map(s=>{const o=Object.assign({},s); delete o._val; delete o._shown; return o;});
  const c=charOf(stepId);
  const holders=c? playersByChar(stepId).filter(p=>p.alive) : [];
  const holder=holders[0]||null;
  wiz={stepId, idx:0, vars:{}, holder, scenes};
  renderWiz();
}
function startCustomWiz(title, scenes){
  wiz={stepId:'__custom', custom:true, title, idx:0, vars:{}, holder:null,
       scenes:scenes.map(s=>{const o=Object.assign({},s); delete o._val; delete o._shown; return o;})};
  renderWiz();
}
function wizTitle(){
  if(wiz.custom) return wiz.title||'';
  const c=charOf(wiz.stepId);
  if(c) return `${glyph(c.id)} ${c.ko}` + (wiz.holder? ` — ${wiz.holder.name}`:'');
  return INFO_STEPS[wiz.stepId]? '👥 '+INFO_STEPS[wiz.stepId].ko : wiz.stepId;
}
function wizWarnBar(){
  if(!wiz.holder) return '';
  const bars=[];
  // 중독·취함 오작동 = 정보는 임의(참도 거짓도 가능), 발동형은 불발 — "반드시 거짓" 아님
  if(isMalfunctioning(wiz.holder)) bars.push(`<div class="wiz-warnbar">☠ ${esc(wiz.holder.name)} 오작동 상태 — 정보는 <b>임의</b>(대개 거짓·참도 허용), 발동은 <b>불발</b>로 처리하되 평소와 똑같이 진행하세요.</div>`);
  // 보르톡스 생존 시 주민 정보는 반드시 거짓 — 중독·취함이어도 거짓(공식)
  if(S.players.some(p=>p.alive&&p.charId==='vortox') && charOf(wiz.holder.charId)?.type==='townsfolk') bars.push(`<div class="wiz-warnbar">🌀 보르톡스 생존 중 — 주민 정보는 <b>반드시 거짓</b>이어야 합니다(중독·취함이어도 거짓).</div>`);
  return bars.join('');
}
function wizPlayers(filter){
  const me=wiz.holder;
  let list=S.players;
  if(filter==='alive') list=list.filter(p=>p.alive);
  if(filter==='alive-not-self') list=list.filter(p=>p.alive&&p!==me);
  if(filter==='any-not-self') list=list.filter(p=>p!==me); // 사망자 포함, 본인만 제외 (집사·수도사 등 "choose a player (not yourself)")
  if(filter==='dead') list=list.filter(p=>!p.alive);
  if(filter==='not-self-not-traveler') list=list.filter(p=>p!==me && charOf(p.charId)?.type!=='traveler');
  return list;
}
function wizCharPool(pool){
  const ed=S.edition||'tb';
  const inPlay=new Set(S.players.map(p=>p.charId));
  const all=editionChars(ed).filter(c=>!c.custom&&c.type!=='traveler'&&c.type!=='fabled');
  // 오작동(중독·취함·주정뱅이) 정보 캐릭터는 거짓 정보 가능 → 인플레이 제한 해제, 해당 타입 전체 풀 허용 (정상 시 기존 인플레이 제한 유지)
  const mal = typeof wiz!=='undefined' && wiz && wiz.holder && isMalfunctioning(wiz.holder);
  if(pool==='inplay-townsfolk') return all.filter(c=>c.type==='townsfolk'&&(mal||inPlay.has(c.id)));
  if(pool==='inplay-outsider') return all.filter(c=>c.type==='outsider'&&(mal||inPlay.has(c.id)));
  if(pool==='inplay-minion') return all.filter(c=>c.type==='minion'&&(mal||inPlay.has(c.id)));
  if(pool==='townsfolk') return all.filter(c=>c.type==='townsfolk');
  if(pool==='good-characters') return all.filter(c=>c.type==='townsfolk'||c.type==='outsider');
  if(pool==='evil-characters') return all.filter(c=>c.type==='minion'||c.type==='demon');
  if(pool==='good-notinplay') return all.filter(c=>(c.type==='townsfolk'||c.type==='outsider')&&!inPlay.has(c.id)&&c.id!==S.drunkMaskChar);
  return all;
}
const WIZ_SUGGEST={
  chefPairs(){ let n=0; const s=S.players; for(let i=0;i<s.length;i++){ if(isEvil(s[i])&&isEvil(s[(i+1)%s.length])) n++; } return {v:n, note:'실제 인접 악 쌍(등록 재량 반영 전)'}; },
  empathCount(){ const p=wiz.holder; if(!p) return {v:0,note:''}; const s=S.players,i=s.indexOf(p),n=s.length; let L=null,R=null;
    for(let d=1;d<n;d++){const q=s[((i-d)%n+n)%n]; if(q.alive&&q!==p){L=q;break;}}
    for(let d=1;d<n;d++){const q=s[(i+d)%n]; if(q.alive&&q!==p){R=q;break;}}
    return {v:(L&&isEvil(L)?1:0)+(R&&isEvil(R)?1:0), note:`이웃: ${L?L.name:'-'} · ${R?R.name:'-'} (등록 재량 반영 전)`}; },
  ftAnswer(){ const pair=(wiz.vars.pair||[]).map(playerOf);
    const hit=pair.some(p=>p&&(charOf(p.charId)?.type==='demon'||p.id===S.redHerringId));
    return {v:hit?'예':'아니오', note:'악마/붉은 청어 포함 여부(등록 재량 반영 전)'}; },
  undertakerChar(){ return {v:S.executedPrevDay||'(어제 처형 없음)', note:'어제 처형 기록'}; },
};

  else if(sc.t==='sleep') html=`<div class="wiz-bigtoken">😴</div><div class="wiz-note">${esc(sc.text||'다시 재우세요.')}</div>`;

    <div class="wiz-grid">${wizPlayers(sc.filter||'alive').map(p=>`<div class="wiz-pickbtn ${sel.includes(p.id)?'sel':''} ${p.alive?'':'dim'}" onclick="wizTogglePick('${sc.storeAs}',${sc.n},'${p.id}')"><span class="pt">${p.alive?glyph(p.charId)||'👤':'💀'}</span>${esc(p.name)}</div>`).join('')}</div>`;
  }
  else if(sc.t==='pick-character'){
    const sel=wiz.vars[sc.storeAs]||[];
    const n=sc.n||1;
    html=`${wizWarnBar()}<div class="wiz-caption">${esc(sc.label)} (${sel.length}/${n})</div>
    <div class="wiz-grid">${wizCharPool(sc.pool).map(c=>`<div class="wiz-pickbtn ${sel.includes(c.id)?'sel':''}" onclick="wizTogglePick('${sc.storeAs}',${n},'${c.id}')"><span class="pt">${glyph(c.id)}</span>${esc(c.ko)}</div>`).join('')}</div>`;
  }
  else if(sc.t==='reveal-char'){
    const c=charOf(sc.char);
    html=`<div class="reveal-wrap">
      ${sc.who?`<div class="reveal-who">${esc(sc.who)}</div>`:''}
      <h2>당신의 캐릭터</h2>
      <div class="reveal-token"><span class="rname">${c?esc(c.ko):'?'}</span><span class="ricon">${c?glyph(c.id):'?'}</span></div>
      <div class="reveal-ability">${c?esc(c.ability):''}</div>
      <div class="wiz-showhint">확인했으면 화면을 탭하세요</div></div>`;
  }
  else if(sc.t==='show-token'){
    const cid=sc.char|| (wiz.vars[sc.from]||[])[0];
    const c=charOf(cid);
    html=`<div class="wiz-caption">📱 화면을 플레이어에게 보여주세요</div><div class="wiz-bigtoken">${c?glyph(c.id):'?'}</div>
    <div class="wiz-bigname">${c?esc(c.ko):'?'}</div><div class="wiz-bigsub">${c?esc(c.en||''):''}</div>
    ${sc.caption?`<div class="wiz-note" style="margin-top:14px">${esc(sc.caption)}</div>`:''}<div class="wiz-showhint">탭하면 다음으로</div>`;
  }
  else if(sc.t==='show-tokens'){
    const ids=wiz.vars[sc.from]||[];
    html=`<div class="wiz-caption">📱 화면을 플레이어에게 보여주세요${sc.caption?' — '+esc(sc.caption):''}</div>
    <div class="wiz-players">${ids.map(id=>{const c=charOf(id);return `<div class="wiz-shownplayer"><div class="pp">${c?glyph(c.id):'?'}</div><div class="pn">${c?esc(c.ko):'?'}</div></div>`;}).join('')}</div>
    <div class="wiz-showhint">탭하면 다음으로</div>`;

    else{ const sug=sc.suggest? WIZ_SUGGEST[sc.suggest]():null;

  $('#wizbody').innerHTML=html;

function wizTogglePick(key,n,id){
  const arr=wiz.vars[key]=wiz.vars[key]||[];
  const i=arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else { if(arr.length>=n) arr.shift(); arr.push(id); }
  renderWiz();
}
function wizShowVal(v){ const sc=wiz.scenes[wiz.idx]; sc._val=v; sc._shown=true;
  log(`${wizTitle()} 위저드: "${v}" 표시${sc.caption?' — '+sc.caption:''}`); renderWiz(); }
function wizEffect(){ const sc=wiz.scenes[wiz.idx]; const tgt=(wiz.vars[sc.from]||[])[0];
  if(!tgt){ toast('대상이 선택되지 않았습니다 — 이전 단계에서 선택하세요.','warn'); return; }
  try{
    if(sc.fn==='doStepKill') doStepKill(tgt, charOf(wiz.stepId)?.id);
    else if(sc.fn==='doSwapChars'||sc.fn==='doSnakeSwap') window[sc.fn](wiz.vars[sc.from]||[]);
    else window[sc.fn](tgt);
  }catch(e){ toast('판정 함수 오류: '+sc.fn,'warn'); }
  wizNext();
}
function wizNext(){ if(wiz.idx<wiz.scenes.length-1){ wiz.idx++; renderWiz(); } else closeWiz(true); }
function wizPrev(){ if(wiz.idx>0){ wiz.idx--; renderWiz(); } }
function closeWiz(done){
  $('#wizard').hidden=true; $('#wizbody').onclick=null;
  if(done && wiz && !wiz.custom){ const m=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={}); m[wiz.stepId]=true;
    log(`${wizTitle()} 단계 완료(위저드)`); save(); }
  if(done && wiz && wiz.custom){ log(`${wizTitle()} 완료`); save(); }
  wiz=null; renderAll();
}

<script>
/* ══════════════════ ① 클라우드 저장·이어하기 (artifact 런타임) ══════════════════
   페이지가 정적 셸 + 상태 JSON으로 자신의 새 버전을 발행한다.
   - 저장: 동적 컨테이너를 비운 정적 셸에 #cloudstate JSON을 심어 artifact.publish()
   - 복원: 로드 시 #cloudstate가 있으면 로컬 상태와 비교해 사회자가 선택
   - 발행 권한: 아티팩트 소유자/편집자만 — 읽기 전용 뷰어에겐 버튼 숨김 처리 */
let cloudNS=null, cloudReady=false;
(async ()=>{
  try{
    if(!window.claude || !claude.use) return;
    cloudNS = await claude.use('artifact');
    cloudReady = !!cloudNS;
  }catch(e){ cloudNS=null; }
  if(cloudReady) renderAll();
})();
const CLOUD_DYNAMIC_IDS=['sidenav','subtabs','quickstats','wizhead','wizbody','wizfoot','log'];
function cloudBuildDoc(){
  const body=document.body.cloneNode(true);
  body.querySelectorAll('.tabpane').forEach(el=>{ el.innerHTML=''; el.classList.remove('active'); });
  CLOUD_DYNAMIC_IDS.forEach(id=>{ const el=body.querySelector('#'+id); if(el) el.innerHTML=''; });
  const wz=body.querySelector('#wizard'); if(wz) wz.hidden=true;
  const t=body.querySelector('#toast'); if(t) t.remove();
  ['pmodal','winask','gameover','wizard'].forEach(id=>{
    const el=body.querySelector('#'+id); if(el){ el.hidden=true; el.innerHTML=''; }
  });
  const old=body.querySelector('#cloudstate'); if(old) old.remove();
  const pl=body.querySelector('#phaselabel'); if(pl) pl.textContent='준비';
  const st=document.createElement('script');
  st.type='application/json'; st.id='cloudstate';
  st.textContent=JSON.stringify({saved:new Date().toISOString(), state:S}).replace(/<\//g,'<\\/');
  body.appendChild(st);
  return '<!doctype html>\n<html lang="ko"><head>'+document.head.innerHTML+'</head><body>'+body.innerHTML+'</body></html>';
}
async function cloudSave(){
  if(!cloudNS){ toast('클라우드 저장을 사용할 수 없는 환경입니다(뷰어 권한/미지원).','warn'); return; }
  try{
    await cloudNS.publish(cloudBuildDoc());
    log('☁ 클라우드 저장 완료');
    toast('☁ 저장됨 — 다른 기기에서 이 아티팩트를 열면 이어하기가 제안됩니다.','ok');
  }catch(e){
    const code=(e&&e.code)||'';
    if(code==='conflict') toast('다른 곳에서 방금 저장되어 이 저장은 반영되지 않았습니다. 페이지가 최신 버전으로 갱신됩니다.','warn');
    else if(code==='not_granted'||code==='not_writer') toast('이 계정에는 저장 권한이 없습니다(소유자/편집자 전용).','warn');
    else toast('클라우드 저장 실패: '+(e&&e.message||code||'알 수 없음'),'warn');
  }
}
function cloudTryRestore(){
  const el=document.getElementById('cloudstate');
  if(!el) return;
  try{
    const data=JSON.parse(el.textContent);
    if(!data||!data.state) return;
    const cloud=data.state;
    const localEmpty = !S.players || S.players.length===0;
    const same = JSON.stringify(cloud)===JSON.stringify(S);
    if(same) return;
    const when=new Date(data.saved).toLocaleString('ko-KR');
    const msg=localEmpty
      ? `☁ 클라우드 저장본(${when}, ${cloud.players.length}명 · ${cloud.phase.kind==='setup'?'준비':(cloud.phase.kind==='night'?'밤 ':'낮 ')+cloud.phase.n})을 불러올까요?`
      : `☁ 클라우드 저장본(${when})이 이 기기의 게임과 다릅니다.\n[확인] 클라우드 저장본으로 교체 / [취소] 이 기기 상태 유지`;
    if(confirm(msg)){ S=migrateState(cloud); save(); log('☁ 클라우드 저장본 복원'); renderAll(); }
  }catch(e){}
}
(function(){
  const _rg=renderGrim;
  renderGrim=function(){
    _rg();
    const row=document.querySelector('#pane-grim .card:last-child .row');
    if(row && !row.querySelector('.cloudbtn')){
      const b=document.createElement('button');
      b.className='small cloudbtn'; b.textContent= cloudReady? '☁ 클라우드 저장' : '☁ 저장(미지원 환경)';
      b.disabled=!cloudReady; b.onclick=()=>cloudSave();
      row.appendChild(b);
    }
  };
})();
cloudTryRestore();
</script>

function activeJinxes(){
  const ids=new Set(S.players.map(p=>p.charId).filter(Boolean));
  return JINXES.filter(j=>ids.has(j.a)&&ids.has(j.b));
}
/* buildChecklist 래핑(원본 미수정) — 성립 징크스를 체크리스트에 편입 */
const _origBuild=buildChecklist;
buildChecklist=function(){
  const items=_origBuild();
  activeJinxes().forEach(j=>{
    const a=charOf(j.a), b=charOf(j.b);
    const txt=`${a?a.ko:j.a} ↔ ${b?b.ko:j.b}: ${j.rule}`+(j.confidence==='check'?' (⚠ 공식 위키 확인 필요)':'');
    items.push({group:'징크스', src:'징크스', txt, key:'징크스|'+j.a+'|'+j.b});
  });
  return items;
};

function sheetJinxes(edId){
  const ids=new Set(sheetCharList(edId).map(c=>c.id));
  return JINXES.filter(j=>ids.has(j.a)&&ids.has(j.b));
}

  ${list.map(j=>{const a=charOf(j.a), b=charOf(j.b);
    return `<div class="checkitem"><span><span class="src">[${esc(a?a.ko:j.a)} ↔ ${esc(b?b.ko:j.b)}]</span> ${esc(j.rule)}${j.confidence==='check'?' (⚠ 공식 위키 확인 필요)':''}</span></div>`;
  }).join('')}</div>`;
}
(function(){
  const _origSheet=renderSheet;
  renderSheet=function(){

    try{
      if(sheetTab==='chars'){
        const list=sheetJinxes(sheetEd), el=$('#pane-sheet');

          jinxCardHTML('이 시트의 징크스', list, '아래 두 캐릭터가 함께 인플레이일 때만 적용되는 예외 규칙입니다. 실제 배정 기준 목록은 셋업·체크리스트 화면에서 확인하세요.'));
      }
    }catch(e){}
    return r;
  };
  const _origSetup=renderSetup;
  renderSetup=function(){
    const r=_origSetup.apply(this,arguments);
    try{
      const list=activeJinxes(), el=$('#pane-setup');
      if(list.length&&el) el.insertAdjacentHTML('beforeend',
        jinxCardHTML('지금 성립하는 징크스', list, '현재 배정된 캐릭터 조합에서 실제로 발동하는 예외 규칙입니다. 배정이 바뀌면 목록도 바뀝니다.'));
    }catch(e){}
    return r;
  };
})();

<script>
/* ══════════════════ 기능팩: 캐릭터 변경 · 밤 타이머 · 리플레이 요약 · 여행자 추방 ══════════════════
   문구 자체 작성 원칙. 기존 함수는 수정하지 않고 이 블록에서 래핑/추가만 수행합니다. */

/* ── 공용 미니 오버레이 (#wizard DOM 재사용, 위저드 엔진과 별개 상태) ── */
function ovOpen(title, bodyHTML, footHTML){
  if(typeof wiz!=='undefined' && wiz){ toast('밤 위저드 진행 중에는 열 수 없습니다 — 위저드를 먼저 닫으세요.','warn'); return false; }
  const w=$('#wizard'); w.hidden=false;
  $('#wizhead').innerHTML=`<span class="wtitle">${title}</span>`;
  $('#wizbody').onclick=null;
  $('#wizbody').innerHTML=bodyHTML;
  $('#wizfoot').innerHTML=footHTML;
  return true;
}
function ovClose(){
  $('#wizard').hidden=true; $('#wizbody').onclick=null;
  $('#wizbody').innerHTML=''; $('#wizfoot').innerHTML='';
  cc=null; ex=null; renderAll();
}
const ovWrap = inner => `<div style="margin:auto;max-width:680px;width:100%;text-align:left">${inner}</div>`;

/* ══════════ 1) 캐릭터 변경 다이얼로그 ══════════ */
let cc=null;
const CC_REASONS=[
 ['pithag','🧌 마귀할멈 변경','밤에 지목된 플레이어의 캐릭터가 다른 캐릭터로 바뀜'],
 ['philosopher','📜 철학자','선한 캐릭터 능력 획득 — 원본 보유자가 인플레이면 그 사람은 술취함(수동 부여 권장)'],
 ['barber','✂️ 이발사 스왑','이발사 사망 시 악마 선택으로 두 플레이어가 캐릭터를 서로 교환'],
 ['snakecharmer','🪈 뱀 조련사 스왑','악마 적중 시 캐릭터·진영을 서로 교환 — 새 뱀 조련사는 영구 중독'],
 ['starpass','⭐ 별 넘기기','임프가 자신을 죽여 하수인이 임프를 계승'],
 ['other','✎ 기타','사회자 수동 조정'],
];
const ccSwap = k => k==='barber'||k==='snakecharmer';
function ccReasonKo(k){ const r=CC_REASONS.find(x=>x[0]===k); return r? r[1].replace(/^[^ ]+ /,'') : (k||'기타'); }
function openCharChange(pid){
  cc={pid, step:1, newChar:null, reason:null, second:null, poisonNew:true};
  ccRender();
}
function ccRender(){
  if(!cc) return;
  const p=playerOf(cc.pid); if(!p){ ovClose(); return; }
  const title=`🔁 캐릭터 변경 — ${esc(p.name)} <span class="hint">(현재: ${esc(charName(p))})</span>`;
  let body='', foot='';
  const btnClose=`<button onclick="ovClose()">닫기</button>`;
  if(cc.step===1){
    const chars=editionChars().filter(c=>c.type!=='fabled');
    body=`<div class="wiz-caption">새 캐릭터를 선택하세요<br><span class="hint">스왑 사유(이발사/뱀 조련사)는 상대와 서로 교환하므로 이 선택은 무시됩니다 — 건너뛰어도 됩니다.</span></div>
    <div class="wiz-grid">${chars.map(c=>`<div class="wiz-pickbtn ${cc.newChar===c.id?'sel':''}" onclick="cc.newChar=cc.newChar==='${c.id}'?null:'${c.id}';ccRender()"><span class="pt">${glyph(c.id)}</span>${esc(c.ko)}<span class="hint">${TYPE_KO[c.type]||''}</span></div>`).join('')}</div>`;
    foot=`${btnClose}<button class="primary" onclick="cc.step=2;ccRender()">다음 (사유 선택)</button>`;
  } else if(cc.step===2){
    body=`<div class="wiz-caption">변경 사유를 선택하세요</div>
    <div class="wiz-grid">${CC_REASONS.map(([k,ko,desc])=>`<div class="wiz-pickbtn ${cc.reason===k?'sel':''}" style="max-width:210px" onclick="cc.reason='${k}';ccRender()"><span class="pt">${ko.split(' ')[0]}</span>${esc(ko.replace(/^[^ ]+ /,''))}<span class="hint" style="font-size:11.5px;line-height:1.4">${esc(desc)}</span></div>`).join('')}</div>`;
    foot=`${btnClose}<button onclick="cc.step=1;ccRender()">이전</button><button class="primary" ${cc.reason?'':'disabled'} onclick="cc.step=ccSwap(cc.reason)?3:4;ccRender()">다음</button>`;
  } else if(cc.step===3){
    const others=S.players.filter(q=>q.id!==cc.pid);
    body=`<div class="wiz-caption">캐릭터를 서로 교환할 두 번째 플레이어를 선택하세요</div>
    <div class="wiz-grid">${others.map(q=>`<div class="wiz-pickbtn ${cc.second===q.id?'sel':''} ${q.alive?'':'dim'}" onclick="cc.second='${q.id}';ccRender()"><span class="pt">${q.alive?glyph(q.charId)||'👤':'💀'}</span>${esc(q.name)}<span class="hint">${esc(charName(q))}</span></div>`).join('')}</div>`;
    foot=`${btnClose}<button onclick="cc.step=2;ccRender()">이전</button><button class="primary" ${cc.second?'':'disabled'} onclick="cc.step=4;ccRender()">다음</button>`;
  } else {
    const swap=ccSwap(cc.reason);
    const q=swap? playerOf(cc.second): null;
    const nc=charOf(cc.newChar);
    let summary;
    if(swap) summary=`<b>${esc(p.name)}</b> (${esc(charName(p))}) ↔ <b>${esc(q?.name||'?')}</b> (${esc(q?charName(q):'?')}) — 캐릭터 서로 교환`;
    else if(nc) summary=`<b>${esc(p.name)}</b>: ${esc(charName(p))} → <b>${glyph(nc.id)} ${esc(nc.ko)}</b>`;
    else summary='⚠ 새 캐릭터가 선택되지 않았습니다 — 1단계로 돌아가 선택하세요.';
    body=`<div class="wiz-note" style="max-width:640px;text-align:left">
      <div class="alertbox blue">사유: <b>${esc(ccReasonKo(cc.reason))}</b><br>${summary}</div>
      ${cc.reason==='snakecharmer'&&swap?`<div class="alertbox"><label style="cursor:pointer"><input type="checkbox" ${cc.poisonNew?'checked':''} onchange="cc.poisonNew=this.checked"> 새로 뱀 조련사가 된 플레이어에게 ☠ 영구 중독 자동 부여</label><br><span class="hint">진영(선/악)도 함께 교환됩니다 — 그리모어 메모로 관리하세요.</span></div>`:''}
      ${cc.reason==='starpass'?`<div class="alertbox">별 넘기기: 기존 임프의 사망 처리는 그리모어에서 별도로 진행하세요(자신 지목 시 임프 사망 → 하수인 계승).</div>`:''}
      ${cc.reason==='philosopher'?`<div class="alertbox">원본 캐릭터 보유자가 인플레이라면 그 플레이어에게 술취함 상태를 수동 부여하세요.</div>`:''}
      <p class="hint">세부 룰은 공식 위키를 확인하세요. 적용 시 게임 기록에 남습니다.</p>
    </div>`;
    foot=`${btnClose}<button onclick="cc.step=${swap?3:2};ccRender()">이전</button>
      ${(swap? cc.second : cc.newChar)?`<button onclick="ccApply(true)">옛 캐릭터 지속효과 정리 후 적용</button><button class="primary" onclick="ccApply(false)">상태 유지하고 적용</button>`:''}`;
  }
  ovOpen(title, body, foot);
}
function ccApply(clearStatuses){
  if(!cc) return;
  const p=playerOf(cc.pid); if(!p) return;
  const reasonKo=ccReasonKo(cc.reason);
  /* 전체 삭제가 아니라 '옛 캐릭터가 출처인 지속 효과'만 해제한다.
     다른 출처의 중독·취함 등은 캐릭터 변경과 무관하므로 유지(killPlayer의 reconcileDeath와 동일 패턴). */
  const clearOf=(t,oldId)=>{ clearEffectsFromChar(oldId, `캐릭터 변경 — ${t.name}의 옛 능력(${charOf(oldId)?.ko||'?'}) 상실`); };
  if(ccSwap(cc.reason)){
    const q=playerOf(cc.second); if(!q) return;
    const aKo=charName(p), bKo=charName(q);
    const a=p.charId, bOld=q.charId; p.charId=q.charId; q.charId=a;
    if(clearStatuses){ clearOf(p,a); clearOf(q,bOld); }
    log(`🔁 캐릭터 교환 (${reasonKo}): ${p.name} ↔ ${q.name} — ${aKo} ↔ ${bKo}`);
    if(cc.reason==='snakecharmer'){
      const ns=[p,q].find(x=>x.charId==='snakecharmer');
      if(ns && cc.poisonNew) addStatus(ns,'poison','뱀 조련사 스왑 — 영구 중독(수동 해제 전까지 유지)',null);
      toast('뱀 조련사 스왑 적용 — 진영도 함께 교환됩니다. 세부는 공식 위키 확인.','warn');
    } else {
      toast('캐릭터 교환을 적용했습니다.','ok');
    }
  } else {
    const nc=charOf(cc.newChar); if(!nc) return;
    const oldKo=charName(p);
    if(clearStatuses) clearOf(p, p.charId);   // charId 변경 전 = 옛 캐릭터 기준
    p.charId=cc.newChar;
    log(`🔁 캐릭터 변경 (${reasonKo}): ${p.name} — ${oldKo} → ${nc.ko}`);
    toast(`${p.name}의 캐릭터를 ${nc.ko}(으)로 변경했습니다.`,'ok');
  }
  save(); ovClose();
}

/* ══════════ 2) 밤 타이머 · 페이스 가이드 (renderNight 래핑) ══════════ */
let _ntInt=null;
function _ntTick(){
  if(S.phase.kind!=='night'){ const b=document.getElementById('nighttimerbar'); if(b) b.remove(); return; }
  const sp=document.getElementById('nighttimer');
  if(!sp || !S.stepTimer) return;
  const s=Math.max(0, Math.floor((Date.now()-S.stepTimer.start)/1000));
  sp.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
const _origRenderNight=renderNight;
renderNight=function(){
  _origRenderNight();
  if(S.phase.kind!=='night') return;   /* 밤이 아니면 타이머 바 미표시 */
  if(!S.stepTimer || S.stepTimer.n!==S.phase.n){ S.stepTimer={start:Date.now(), n:S.phase.n}; save(); }
  $('#pane-night').insertAdjacentHTML('afterbegin',
    `<div id="nighttimerbar" class="card" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px">
      <span>⏱ 밤 ${S.phase.n} 경과</span>
      <span id="nighttimer" class="num" style="font-size:20px;font-weight:700">00:00</span>
      <span class="hint">한 단계 30~60초 권장 — 침묵 구간도 동일 템포 유지</span>
    </div>`);
  _ntTick();
  if(!_ntInt) _ntInt=setInterval(_ntTick,1000);   /* 인터벌은 1개만 — span만 갱신, renderAll 재호출 없음 */
};

/* ══════════ 2-b) 낮 타이머 (renderDay 래핑) — teeroz 의 낮 제한시간 대응 ══════════ */
let _dtInt=null;
function _dtTick(){
  if(S.phase.kind!=='day'){ const b=document.getElementById('daytimerbar'); if(b) b.remove(); return; }
  const sp=document.getElementById('daytimer');
  if(!sp || !S.dayTimer) return;
  const s=Math.max(0, Math.floor((Date.now()-S.dayTimer.start)/1000));
  sp.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const lim=(S.dayTimer.limit|0);
  if(lim>0){
    const left=lim*60-s;
    const w=document.getElementById('daytimerleft');
    if(w){
      w.textContent = left>0
        ? `남은 시간 ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`
        : '시간 종료 — 지명을 마감하세요';
      w.className = left>0? 'hint' : 'pill warn';
    }
  }
}
function setDayLimit(){
  const v=prompt('낮 제한시간(분). 0 이면 제한 없음.', String((S.dayTimer&&S.dayTimer.limit)||0));
  if(v===null) return;
  const m=Math.max(0, parseInt(v,10)||0);
  S.dayTimer=S.dayTimer||{start:Date.now(), n:S.phase.n};
  S.dayTimer.limit=m; save(); _dtTick();
  toast(m? `낮 제한시간 ${m}분 설정` : '낮 제한시간 해제','ok');
}
function resetDayTimer(){ S.dayTimer={start:Date.now(), n:S.phase.n, limit:(S.dayTimer&&S.dayTimer.limit)||0}; save(); _dtTick(); }
(function(){
  const _origRenderDay=renderDay;
  renderDay=function(){
    _origRenderDay();
    if(S.phase.kind!=='day'){ const b=document.getElementById('daytimerbar'); if(b) b.remove(); return; }
    if(!S.dayTimer || S.dayTimer.n!==S.phase.n) S.dayTimer={start:Date.now(), n:S.phase.n, limit:(S.dayTimer&&S.dayTimer.limit)||0};
    $('#pane-day').insertAdjacentHTML('afterbegin',
      `<div id="daytimerbar" class="card" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px">
        <span>☀ 낮 ${S.phase.n} 경과</span>
        <span id="daytimer" class="num" style="font-size:20px;font-weight:700">00:00</span>
        <span id="daytimerleft" class="hint">${S.dayTimer.limit? '' : '제한 없음'}</span>
        <button class="small" onclick="setDayLimit()">제한시간</button>
        <button class="small ghost" onclick="resetDayTimer()">리셋</button>
        <button class="small danger ghost" style="margin-left:auto" onclick="endGameManually()">🏁 게임 종료</button>
      </div>`);
    _dtTick();
    if(!_dtInt) _dtInt=setInterval(_dtTick,1000);
  };
})();

/* 종료 조건 재판정 — 사망 이벤트에만 걸려 있으면 '차단이 풀리는 순간'을 놓친다.
   예: 악마가 죽었지만 사악한 쌍둥이가 살아 있어 계속 → 나중에 그 쌍둥이가 중독되면
   (공식상 오작동한 쌍둥이는 선 승리를 막지 못한다) 차단이 사라지는데, 그때는 아무도
   죽지 않으므로 checkEndConditions 가 호출되지 않아 악마 없는 게임이 무한히 이어졌다.
   페이즈 전환마다 한 번씩 값싸게 다시 본다. */
function recheckEndConditions(){
  if(S.gameOver || pendingWin) return;
  if(S.phase.kind==='setup') return;
  const demonAlive=S.players.some(p=>(p.alive||(p.charId==='zombuul'&&hasStatus(p,'fakedead')))
                                     && charOf(p.charId)?.type==='demon');
  if(demonAlive) return;
  if(winBlockers().length) return;          // 탕녀·주모자·쌍둥이가 아직 막고 있으면 계속
  askWin({team:'good', reason:'악마가 모두 죽었고 승리를 막던 조건도 사라졌습니다.',
          rule:'악마가 모두 죽고 계승·연장·쌍둥이 차단이 없으면 선한 팀이 승리합니다. (차단 요소가 중독·사망 등으로 해제된 시점에 판정)'});
}
/* 재판정 지점은 '차단 요소가 실제로 바뀌는 곳'으로만 좁힌다.
   renderAll 전체에 걸면 사회자가 캐릭터를 교체하는 중(악마가 일시적으로 없는 순간)에도
   승리가 선언될 수 있다 — 마귀할멈·이발사 교체가 그 경로다.
   차단 요소를 바꾸는 것은 사망(이미 처리됨) · 중독/취함 부여·해제 · 페이즈 전환뿐이다. */
(function(){
  const _adv=advancePhase;
  advancePhase=function(){ _adv(); recheckEndConditions(); };

  const _add=addStatus;
  addStatus=function(p,key,src,exp){
    const r=_add(p,key,src,exp);
    if(key==='poison'||key==='drunkS') recheckEndConditions();
    return r;
  };
  const _rem=removeStatus;
  removeStatus=function(p,idx){
    const k=(p.statuses||[])[idx] && p.statuses[idx].key;
    const r=_rem(p,idx);
    if(k==='poison'||k==='drunkS') recheckEndConditions();
    return r;
  };
  const _exp=expireStatuses;
  expireStatuses=function(){ _exp(); recheckEndConditions(); };
})();

/* 페이즈가 낮이 아니게 되면 낮 타이머 바를 즉시 제거한다(탭을 안 열어도) */
(function(){
  const _adv=advancePhase;
  advancePhase=function(){
    _adv();
    if(S.phase.kind!=='day'){ const b=document.getElementById('daytimerbar'); if(b) b.remove(); }
  };
})();

/* ══════════ 3) 리플레이(전말) 요약 ══════════ */
function _rpIcon(m){
  if(m.startsWith('──')) return '🕰';
  if(m.includes('처형')) return '⚔️';
  if(m.includes('사망')||m.includes('💀')||m.includes('죽은 척')||m.includes('추방')) return '💀';
  if(m.includes('지명')||m.includes('거수')||m.includes('찬성')||m.includes('부결')||m.includes('투표')) return '🗳️';
  if(m.includes('부여')||m.includes('해제')||m.includes('중독')) return '🎴';
  return '·';
}
function _rpGroups(){
  const groups=[];
  (S.log||[]).forEach(l=>{
    const last=groups[groups.length-1];
    if(last && last.t===l.t) last.items.push(l.msg);
    else groups.push({t:l.t, items:[l.msg]});
  });
  return groups;
}
function _rpHead(t){ return t==='준비'? '🛠 준비' : t.startsWith('밤')? '🌙 '+t : '☀️ '+t; }
function showReplay(){
  const groups=_rpGroups();
  const body=ovWrap(`
    <div class="alertbox red">⚠ 공개용(스포일러 포함) — 게임이 끝난 뒤에만 플레이어에게 보여주세요.</div>
    ${groups.length? groups.map(g=>`
      <h3 style="margin:14px 0 6px">${esc(_rpHead(g.t))}</h3>
      ${g.items.map(m=>`<div style="padding:3px 0;border-bottom:1px dotted var(--line);font-size:13.5px">${_rpIcon(m)} ${esc(m)}</div>`).join('')}
    `).join('') : '<p class="hint">아직 기록이 없습니다.</p>'}
    <p class="hint" style="margin-top:12px">아이콘: ⚔️처형 · 💀사망/추방 · 🗳️지명/투표 · 🎴상태 부여/해제 · 🕰페이즈 전환</p>`);
  ovOpen('📜 전말 요약', body,
    `<button onclick="ovClose()">닫기</button><button class="primary" onclick="copyReplay()">📋 텍스트 복사</button>`);
}
function copyReplay(){
  const txt='[전말 요약 — 스포일러 포함]\n'+_rpGroups().map(g=>`\n== ${g.t} ==\n`+g.items.map(m=>' - '+m).join('\n')).join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('전말 요약 텍스트를 클립보드에 복사했습니다.','ok'),()=>prompt('복사하세요:',txt));
  else prompt('복사하세요:',txt);
}

/* ══════════ 4) 여행자 추방(exile) 투표 (renderDay 래핑 주입) ══════════ */
let ex=null;
const _origRenderDay=renderDay;
renderDay=function(){
  _origRenderDay();
  if(S.phase.kind!=='day') return;
  const trav=S.players.filter(p=>p.alive && charOf(p.charId)?.type==='traveler');
  if(!trav.length) return;   /* 여행자 인플레이(생존) 시에만 노출 */
  const d=document.createElement('div'); d.className='card'; d.id='exilecard';
  d.innerHTML=`<h2>여행자 추방</h2>
    <p class="hint">추방(exile)은 처형과 별개 절차 — <b>하루 처형 횟수와 무관</b>하며 언제든 발의할 수 있습니다.
    기준: <b>전체 플레이어(사망자 포함, 투표 토큰 불요) 과반</b> — 일반 처형(생존자 기준)과 분모가 다릅니다. 세부는 공식 위키 확인.</p>
    <div class="row"><button onclick="startExile()">🚷 여행자 추방 투표</button></div>`;
  $('#pane-day').appendChild(d);
};
function startExile(){
  ex={step:1, tid:null, yes:[]};
  exRender();
}
function exRender(){
  if(!ex) return;
  const btnClose=`<button onclick="ovClose()">닫기</button>`;
  if(ex.step===1){
    const trav=S.players.filter(p=>p.alive && charOf(p.charId)?.type==='traveler');
    ovOpen('🚷 여행자 추방 투표',
      `<div class="wiz-caption">추방 투표에 부칠 여행자를 선택하세요</div>
      <div class="wiz-grid">${trav.map(p=>`<div class="wiz-pickbtn ${ex.tid===p.id?'sel':''}" onclick="ex.tid='${p.id}';exRender()"><span class="pt">${glyph(p.charId)}</span>${esc(p.name)}<span class="hint">${esc(charName(p))}</span></div>`).join('')}</div>`,
      `${btnClose}<button class="primary" ${ex.tid?'':'disabled'} onclick="ex.step=2;exRender()">투표 개시</button>`);
    return;
  }
  const t=playerOf(ex.tid);
  const den=S.players.length, need=majority(den), yes=ex.yes.length;
  ovOpen(`🚷 추방 투표 — ${esc(t?.name||'?')} (${esc(t?charName(t):'?')})`,
    ovWrap(`
      <div class="alertbox blue">추방 기준: <b>전체 플레이어 ${den}명(사망자 포함, 투표 토큰 불요)</b>의 과반 = <b>${need}표</b> 이상.<br>
      일반 처형(생존자 ${alivePlayers().length}명 기준)과 <b>분모가 다릅니다</b>. 추방은 하루 처형 횟수와 무관합니다. 세부는 공식 위키 확인.</div>
      <div class="votemath">
        <div class="vmbox"><div class="vlab">찬성(분자)</div><div class="vval" style="color:var(--ok)">${yes}</div></div>
        <div class="vmbox"><div class="vlab">전체 플레이어(분모)</div><div class="vval">${den}</div></div>
        <div class="vmbox ${yes>=need?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need}</div></div>
      </div>
      <div class="wiz-grid" style="max-width:none;margin-top:10px">${S.players.map(p=>`
        <div class="wiz-pickbtn ${ex.yes.includes(p.id)?'sel':''} ${p.alive?'':'dim'}" onclick="exToggle('${p.id}')">
          <span class="pt">${p.alive?glyph(p.charId)||'👤':'💀'}</span>${esc(p.name)}${p.alive?'':'<span class="hint">👻 사망 — 토큰 없이 투표 가능</span>'}
        </div>`).join('')}</div>`),
    `${btnClose}<button onclick="ex.step=1;exRender()">이전</button><button class="primary" onclick="exClose()">${yes>=need?'✅ 과반 달성 — 추방 확정':'투표 마감 (미달 → 부결)'}</button>`);
}
function exToggle(pid){
  const i=ex.yes.indexOf(pid);
  if(i>=0) ex.yes.splice(i,1); else ex.yes.push(pid);
  exRender();
}
function exClose(){
  const t=playerOf(ex.tid); if(!t){ ovClose(); return; }
  const den=S.players.length, need=majority(den), yes=ex.yes.length;
  if(yes>=need){
    log(`🚷 여행자 추방 투표: ${t.name}(${charName(t)}) — 찬성 ${yes}/${den} (기준 ${need}) 가결`);
    killPlayer(t, '여행자 추방(exile) 가결 — 처형 횟수와 무관');
    toast(`🚷 ${t.name} 추방 — 오늘의 처형 횟수에는 영향을 주지 않습니다.`,'warn');
  } else {
    log(`🚷 여행자 추방 투표: ${t.name}(${charName(t)}) — 찬성 ${yes}/${den} (기준 ${need}) 부결`);
    toast('추방 부결 — 과반 미달.','warn');
  }
  save(); ovClose();
}
</script>

<script>
/* ══ 타운스퀘어(원형) · 상태 뱃지 · 플레이어 모달 ══ */
function seatEvil(p){ const c=charOf(p.charId); return c&&(c.type==='minion'||c.type==='demon'); }
function badgeHTML(p){
  const st=(p.statuses||[]).filter(s=>STATUS_DEFS[s.key]);
  if(!st.length) return '';
  return `<div class="tbadges">${st.slice(0,4).map(s=>{const d=STATUS_DEFS[s.key];
    return `<span class="tbadge ${d.cls}" title="${esc(d.ko)} — ${esc(d.desc)}">${d.icon}</span>`;}).join('')}</div>`;
}
function renderTownSquare(opts){
  const n=S.players.length;
  if(!n) return '<p class="hint" style="text-align:center">플레이어를 추가하면 원탁이 나타납니다.</p>';
  const R = n<=6? 36 : n<=9? 40 : 43;
  const seats=S.players.map((p,i)=>{
    const ang=(i/n)*2*Math.PI - Math.PI/2;
    const x=50+R*Math.cos(ang), y=50+R*Math.sin(ang);
    const c=charOf(p.charId);
    const show = c? (p.charId==='drunk'&&S.drunkMaskChar&&opts&&opts.maskDrunk? charOf(S.drunkMaskChar): c) : null;
    return `<div class="tseat ${seatEvil(p)?'evil':''} ${p.alive?'':'dead'} ${focusPid===p.id?'focus':''}"
        style="left:${x}%;top:${y}%" onclick="openPlayerModal('${p.id}')">
      <div class="ttoken">
        <span class="tkname">${show?esc(show.ko):'미배정'}</span>
        <span class="tkicon">${show?glyph(show.id):'👤'}</span>
        ${badgeHTML(p)}
      </div>
      <div class="tkplayer">${esc(p.name)}</div>
      <div class="tkseat num">${i+1}</div>
    </div>`;
  }).join('');
  return `<div id="tsq">${seats}</div>`;
}
function openPlayerModal(pid){
  focusPid=pid;
  const p=playerOf(pid); if(!p) return;
  const c=charOf(p.charId);
  const i=S.players.indexOf(p);
  const evil=seatEvil(p);
  const toggles=[['poison','중독'],['drunkS','취함'],['protect','보호'],['master','주인'],['curse','저주'],['mad','광기']]
    .filter(([k])=>STATUS_DEFS[k]);
  const el=$('#pmodal'); el.hidden=false;
  el.innerHTML=`<div class="pmcard" onclick="event.stopPropagation()">
    <div class="pmhead">
      <h3>${c?esc(c.ko):'미배정'}</h3><span class="pmseat num">${i+1}</span>
      <button class="pmclose" onclick="closePlayerModal()">✕</button>
    </div>
    <div class="pmbody">
      <div class="pmtop">
        <div style="flex:0 0 auto;text-align:center">
          <div class="ttoken" style="cursor:default">
            <span class="tkname">${c?esc(c.ko):'—'}</span><span class="tkicon">${c?glyph(c.id):'👤'}</span>
          </div>
          <div class="tkseat num" style="margin-top:5px">${esc(p.name)} · ${i+1}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:6px;margin-bottom:8px">
            ${c?`<span class="pill ${c.type}">${TYPE_KO[c.type]}</span>`:''}
            <span class="pill ${evil?'demon':'townsfolk'}">${evil?'악':'선'}</span>
            ${p.alive?'':'<span class="pill neutral">사망</span>'}
            ${(p.statuses||[]).map(s=>STATUS_DEFS[s.key]?`<span class="pill warn">${STATUS_DEFS[s.key].icon} ${STATUS_DEFS[s.key].ko}</span>`:'').join('')}
          </div>
          <div class="pmability">${c?esc(c.ability):'캐릭터가 배정되지 않았습니다.'}</div>
          ${p.charId==='drunk'&&S.drunkMaskChar?`<div class="alertbox" style="margin-top:10px">🎭 본인은 <b>${esc(charOf(S.drunkMaskChar).ko)}</b>라고 믿고 있습니다.</div>`:''}
        </div>
      </div>
      <div class="pmsec">상태</div>
      <div class="row" style="gap:8px">
        ${toggles.map(([k,ko])=>`<button class="stchip ${hasStatus(p,k)?'on':''}" onclick="togglePStatus('${p.id}','${k}')">${STATUS_DEFS[k].icon} ${ko}</button>`).join('')}
      </div>
      <div class="pmsec">메모</div>
      <textarea rows="2" placeholder="이 플레이어에게 준 정보 등" onchange="playerOf('${p.id}').notes=this.value;save()">${esc(p.notes||'')}</textarea>
      <div class="pmacts">
        <button onclick="closePlayerModal();openCharChange('${p.id}')">🔁 캐릭터 변경</button>
        ${p.alive
          ? `<button class="kill" onclick="modalKill('${p.id}')">💀 사망</button>`
          : `<button onclick="revivePlayer('${p.id}');closePlayerModal();">↩ 소생</button>`}
      </div>
      ${p.alive?'':`<div class="row" style="margin-top:10px">${p.deadVote!==false
        ? `<button class="small" onclick="setDeadVote('${p.id}',false);openPlayerModal('${p.id}')">👻 투표 토큰 소진</button>`
        : `<button class="small" onclick="setDeadVote('${p.id}',true);openPlayerModal('${p.id}')">👻 토큰 복원</button>`}</div>`}
    </div></div>`;
  el.onclick=()=>closePlayerModal();
}
function modalKill(pid){ const p=playerOf(pid); if(!p) return;
  if(confirm(`${p.name} 사망 처리?`)){ killPlayer(p,'사회자 수동 처리'); save(); closePlayerModal(); } }
function closePlayerModal(){ const el=$('#pmodal'); el.hidden=true; el.innerHTML=''; focusPid=null; renderAll(); }
function togglePStatus(pid,key){
  const p=playerOf(pid); const ph=S.phase;
  const idx=(p.statuses||[]).findIndex(s=>s.key===key);
  if(idx>=0){ removeStatus(p,idx); }
  else{
    let exp=null;
    if(key==='poison') exp={kind:'night', n:(ph.kind==='night'?ph.n:ph.n)+1};
    if(key==='protect') exp = ph.kind==='night'? {kind:'day', n:ph.n} : {kind:'day', n:ph.n+1};
    if(key==='master'||key==='curse'||key==='mad'){ S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!==key)); exp={kind:'night', n:ph.n+1}; }
    let src='사회자 수동';
    if(key==='drunkS'){                                 // 취함은 출처별 만료가 다르다 — 정책 선택
      const c=prompt('취함 출처 선택 — 1: 선원/여관 주인/건달/음유시인(다음 황혼까지) · 2: 궁정대신(3밤+3낮) · 3: 영구(주정뱅이·사랑꾼·뱀 조련사)','1');
      if(c===null) return;
      if(c.trim()==='2'){ exp=drunkExpiry('court'); src='궁정대신(3밤+3낮)'; }
      else if(c.trim()==='3'){ exp=null; src='영구'; }
      else { exp=drunkExpiry('dusk'); src='다음 황혼까지'; }
    }
    addStatus(p,key,src,exp);
  }
  save(); openPlayerModal(pid);
}
/* 그리모어 원탁을 teeroz형으로 교체 + 밤/낮 화면 상단에도 표시 */
renderCircle=function(){ return renderTownSquare(); };
(function(){
  const _n=renderNight, _d=renderDay;
  function inject(paneId){
    if(S.phase.kind==='setup'||!S.players.length) return;
    const pane=document.getElementById(paneId); if(!pane||pane.querySelector('#tsq')) return;
    const box=document.createElement('div');
    box.className='card';
    box.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:4px">
        <h2 style="margin:0">타운스퀘어</h2>
        <span class="hint">토큰을 누르면 상태·능력·판정</span></div>${renderTownSquare()}`;
    pane.insertBefore(box, pane.firstChild);
  }
  renderNight=function(){ _n(); inject('pane-night'); };
  renderDay=function(){ _d(); inject('pane-day'); };
})();
/* 캐릭터 확인: 1인 1화면(이름·토큰·능력) */
function startRevealWiz(){
  const scenes=[];
  S.players.forEach((p,i)=>{
    let cid=p.charId;
    if(cid==='drunk' && S.drunkMaskChar) cid=S.drunkMaskChar;
    scenes.push({t:'note', text:`📱 ${i+1}번 좌석 — ${p.name}에게 기기를 건네세요. 다른 사람이 화면을 보지 않게 주의!`});
    scenes.push({t:'reveal-char', char:cid, who:p.name});
  });
  scenes.push({t:'note', text:'전원 확인 완료. 기기를 사회자에게 돌려주세요.'});
  startCustomWiz('👥 캐릭터 확인', scenes);
}
</script>

<style>
/* ══ 패리티 보강: 밤 연속 진행 · 새벽 · 종료 · 기기 전달 · 정보 모달 ══ */
.runbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.runbar .runbtn{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;min-height:46px;padding:0 22px;border-radius:12px;font-size:15px}
.dawnlist{display:flex;flex-direction:column;gap:8px;max-width:520px;margin:14px auto 0}
.dawnrow{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.dawnrow .dseat{color:var(--muted);font-size:13px;min-width:22px;text-align:right}
.dawnrow .dname{font-weight:700;font-size:16px}
.dawnrow .drole{color:var(--muted);font-size:13px;margin-left:auto}
.handoff-list{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:680px}
.handoff-btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--raised);border:2px solid var(--line);border-radius:16px;padding:14px 10px;min-width:104px;cursor:pointer}
.handoff-btn .hnum{font-size:12px;color:var(--muted)}
.handoff-btn .hname{font-size:16px;font-weight:700}
.handoff-btn.me{border-color:var(--accent);opacity:.75}
.handoff-btn.sel{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 2px var(--ok)}
.handoff-btn.dead{opacity:.5}
.handoff-btn{min-height:64px}
/* 위저드 푸터 버튼: 한국어가 글자 단위로 줄바꿈되던 문제 — 통째로 유지하고 가로 스크롤 */
#wizfoot{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
#wizfoot button{white-space:nowrap;word-break:keep-all;flex:0 0 auto;min-height:44px}
#wizfoot button.hofoot{flex:1 1 auto;min-width:0}
.hoBtn{white-space:nowrap}
#gameover{position:fixed;inset:0;z-index:98;background:rgba(6,3,14,.85);display:flex;align-items:center;justify-content:center;padding:20px}
#gameover[hidden]{display:none!important}
#gameover .gocard{background:var(--panel);border:2px solid var(--accent);border-radius:18px;max-width:560px;width:100%;padding:34px 26px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#gameover .goicon{font-size:70px;line-height:1}
#gameover h2{font-size:30px;margin:14px 0 6px}
#gameover .goreason{color:var(--muted);font-size:15.5px;line-height:1.7;margin-bottom:22px}
#gameover .goteam{display:inline-block;border-radius:999px;padding:5px 20px;font-size:15px;font-weight:700;margin-bottom:8px}
#gameover .goteam.good{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
#gameover .goteam.evil{background:var(--evil-soft);color:var(--evil);border:1px solid var(--evil)}
.seatrow{display:flex;align-items:center;gap:8px;padding:5px 0}
.seatrow .snum{color:var(--muted);font-size:12.5px;width:26px;text-align:right;font-variant-numeric:tabular-nums}
.seatrow input{flex:1;min-width:120px}
.infobtn{border:1px solid var(--line);background:var(--sunken);color:var(--muted);border-radius:50%;width:24px;height:24px;min-height:24px;padding:0;font-size:12px;line-height:1}
/* 시각 크기는 유지하고 터치 판정 영역만 44pt 로 확장 */
.infobtn,#pmodal .pmclose{position:relative}
.infobtn::after,#pmodal .pmclose::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
/* 토스트: 안전영역 위로 띄우고 좁은 화면에서 뷰포트를 넘지 않게(JS 인라인 스타일보다 우선) */
#toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))!important;max-width:min(560px,calc(100vw - 24px))!important}
</style>
<div id="gameover" hidden></div>

<script>
/* ══ B1: 밤 전체 연속 진행(위저드 큐) + B2: 새벽 집계 ══ */
let wizQueue=null;
function runnableNightSteps(){
  return nightSteps().filter(st=>!stepSkipReason(st) && flowFor(st.id));
}
function startNightRun(){
  const q=runnableNightSteps().map(s=>s.id);
  if(!q.length){ toast('이번 밤에 진행할 단계가 없습니다 — 바로 새벽으로 넘어가세요.','warn'); showDawn(); return; }
  wizQueue={ids:q, i:0};
  startWiz(q[0]);
}
(function(){
  const _close=closeWiz;
  closeWiz=function(done){
    const q=wizQueue;
    _close(done);
    if(!q) return;
    if(!done){ wizQueue=null; toast('밤 연속 진행을 중단했습니다. 리스트에서 개별 단계로 이어갈 수 있습니다.','warn'); return; }
    q.i++;
    if(q.i<q.ids.length){ setTimeout(()=>startWiz(q.ids[q.i]),0); }
    else { wizQueue=null; setTimeout(showDawn,0); }
  };
})();
/* 밤 시작 시 생존 스냅샷 → 새벽에 사망자 집계 */
(function(){
  const _adv=advancePhase;
  advancePhase=function(){
    const before=S.phase.kind;
    _adv();
    if(S.phase.kind==='night' && before!==S.phase.kind){
      S.nightSnapshot=S.players.filter(p=>p.alive).map(p=>p.id);
      save();
    }
  };
})();
function nightDeaths(){
  const snap=S.nightSnapshot||[];
  return S.players.filter(p=>snap.includes(p.id) && !p.alive);
}
function showDawn(){
  const dead=nightDeaths();
  const rows = dead.length
    ? `<div class="dawnlist">${dead.map(p=>`<div class="dawnrow">
        <span class="dseat num">${S.players.indexOf(p)+1}</span>
        <span class="dname">${esc(p.name)}</span>
        <span class="drole">${esc(charName(p))}</span></div>`).join('')}</div>
       <div class="wiz-note" style="margin-top:16px">사인은 밝히지 마세요. 위 명단만 공표합니다.</div>`
    : `<div class="wiz-note" style="margin-top:10px">오늘 밤에는 <b>아무도 죽지 않았습니다</b>. 그대로 공표하세요.</div>`;
  startCustomWiz('🌅 새벽', [{t:'note', text:'―'}]);
  wiz.scenes=[{t:'dawn', html:rows, count:dead.length}];
  wiz.idx=0; renderWiz();
}
/* ══ B4: 종료 결과 화면 ══ */
/* 사회자가 임의로 게임을 끝낸다 — 판정이 자동으로 안 걸리는 상황(합의 종료·중단) 대응 */
function endGameManually(){
  if(S.gameOver){ toast('이미 종료된 게임입니다.','warn'); return; }
  const t=prompt('게임을 종료합니다. 승리 팀을 입력하세요 — 1: 선한 팀 · 2: 악한 팀 · 3: 무승부/중단','1');
  if(t===null) return;
  const map={'1':['good','선한 팀 승리(사회자 선언)'],'2':['evil','악한 팀 승리(사회자 선언)'],'3':['good','무승부·중단(사회자 선언)']};
  const pick=map[String(t).trim()]; if(!pick){ toast('1·2·3 중 하나를 입력하세요.','warn'); return; }
  const why=prompt('사유(선택)','')||pick[1];
  S.gameOver=true; save();
  showGameOver(pick[0], why);
}
function showGameOver(team, reason){
  const el=$('#gameover'); el.hidden=false;
  el.innerHTML=`<div class="gocard">
    <div class="goicon">${team==='good'?'🕊️':'😈'}</div>
    <div class="goteam ${team==='good'?'good':'evil'}">${team==='good'?'선한 팀 승리':'악한 팀 승리'}</div>
    <h2>게임 종료</h2>
    <div class="goreason">${esc(reason||'')}</div>
    <div class="bigactions">
      <button onclick="document.getElementById('gameover').hidden=true;switchTab('grim')">📜 그리모어·전말 요약 보기</button>
      <button class="gold" onclick="document.getElementById('gameover').hidden=true;showReplay()">전말 요약 열기</button>
      <button onclick="document.getElementById('gameover').hidden=true">닫기</button>
    </div></div>`;
  log(`🏁 게임 종료 — ${team==='good'?'선한 팀':'악한 팀'} 승리: ${reason||''}`);
  save();
}
function endGameManual(){
  const t=confirm('게임을 종료합니다.\n[확인] 선한 팀 승리 / [취소] 악한 팀 승리로 기록');
  showGameOver(t?'good':'evil','사회자가 수동으로 종료했습니다.');
}
/* 종료 판정 토스트에 결과 화면 연동 */
(function(){
  const _t=toast;
  toast=function(msg,kind){
    _t(msg,kind);
    if(typeof msg==='string'){
      if(msg.includes('선한 팀 승리')) showGameOver('good', msg.replace(/^[^\s]*\s*/,''));
      else if(msg.includes('악한 팀 승리')) showGameOver('evil', msg.replace(/^[^\s]*\s*/,''));
    }
  };
})();
/* ══ B3: 밤 대상 선택 — 기기 전달(플레이어 대면) 모드 ══ */
let handoff=null;
function startHandoff(storeAs,n,filter,label){
  const holder=wiz&&wiz.holder;
  const list=wizPlayers(filter||'alive');
  const start=holder? S.players.indexOf(holder) : 0;
  const ordered=list.slice().sort((a,b)=>{
    const ia=(S.players.indexOf(a)-start+S.players.length)%S.players.length;
    const ib=(S.players.indexOf(b)-start+S.players.length)%S.players.length;
    return ia-ib;
  });
  handoff={storeAs,n,ordered,holder,label};
  renderHandoff();
}
function renderHandoff(){
  const sel=(wiz.vars[handoff.storeAs]||[]);
  const sc=wiz.scenes[wiz.idx];
  const optional=!!(sc&&sc.optional);
  const done=sel.length>=handoff.n;
  $('#wizhead').innerHTML=`<span class="wtitle">${esc(handoff.holder?handoff.holder.name:'플레이어')}님, 직접 선택하세요</span>`+
    `<span class="wstep num">${sel.length}/${handoff.n}</span>`;
  $('#wizbody').innerHTML=`
    <div class="wiz-caption">${esc(handoff.label||'대상을 선택하세요')}</div>
    <div class="handoff-list">${handoff.ordered.map(p=>{
      const me=p===handoff.holder;
      return `<div class="handoff-btn ${me?'me':''} ${sel.includes(p.id)?'sel':''} ${p.alive?'':'dead'}" data-hopick="${esc(p.id)}">
        <span class="hnum num">${S.players.indexOf(p)+1}</span>
        <span class="hname">${esc(p.name)}${me?' (나)':''}${p.alive?'':' 💀'}</span></div>`;}).join('')}</div>
    ${optional?'<div class="wiz-note hint" style="margin-top:14px">이 능력은 사용하지 않아도 됩니다.</div>':''}`;
  $('#wizbody').onclick=null;
  $('#wizfoot').innerHTML=
    `<button class="hofoot ghost" onclick="useSTInput()">🧑‍⚖️ 사회자가 대신 입력</button>`+
    (optional?`<button class="hofoot" onclick="handoffSkip()">이번 턴에 선택 안 함</button>`:'')+
    `<button class="hofoot primary" ${done?'':'disabled'} onclick="endHandoff()">↩ 이야기꾼에게 전달</button>`;
}
function handoffSkip(){
  const key=handoff.storeAs;
  wiz.vars[key]=[]; wiz.skipped=wiz.skipped||{}; wiz.skipped[key]=true;
  log(`${wizTitle()}: 이번 턴 능력 미사용(선택 안 함)`);
  handoff=null; save(); wizNext();
}
document.addEventListener('click', e=>{
  const b=e.target.closest && e.target.closest('[data-hopick]');
  if(b && handoff) handoffPick(b.getAttribute('data-hopick'));
});
function handoffPick(pid){
  const arr=wiz.vars[handoff.storeAs]=wiz.vars[handoff.storeAs]||[];
  const i=arr.indexOf(pid);
  if(i>=0) arr.splice(i,1); else { if(arr.length>=handoff.n) arr.shift(); arr.push(pid); }
  renderHandoff();
}
/* 플레이어가 이야기꾼에게 돌려주면 그 씬은 끝난 것 — 다음 씬으로 넘어간다.
   renderWiz() 를 그대로 부르면 같은 씬이라 다시 기기 전달 화면으로 되돌아간다. */
function endHandoff(){ handoff=null; wizNext(); }
/* teeroz 방식: who:'player' 지목은 '사회자가 대신 입력'이 아니라
   기기를 플레이어에게 넘겨 본인이 직접 고르는 것이 기본 흐름이다.
   사회자 대리 입력은 예외(stHandoffOverride)로만 허용한다. */
let stHandoffOverride=null;   // 이 씬만 사회자가 대신 입력 (씬 인덱스)
function handoffScene(sc){ return sc && sc.t==='pick-player' && sc.who==='player'; }
function useSTInput(){ stHandoffOverride=wiz? wiz.idx : null; handoff=null; renderWiz(); }
function backToPlayer(){ stHandoffOverride=null; renderWiz(); }
(function(){
  const _rw=renderWiz;
  renderWiz=function(){
    if(handoff){ renderHandoff(); return; }
    // 플레이어 대면 지목 씬이면 자동으로 기기 전달 모드로 들어간다
    if(wiz && !wiz.custom){
      const sc0=wiz.scenes[wiz.idx];
      if(handoffScene(sc0) && stHandoffOverride!==wiz.idx){
        startHandoff(sc0.storeAs, sc0.n, sc0.filter, sc0.label);
        return;
      }
    }
    const sc=wiz&&wiz.scenes[wiz.idx];
    if(sc && sc.t==='dawn'){
      $('#wizhead').innerHTML=`<span class="wtitle">🌅 새벽</span><span class="wstep">밤 ${S.phase.n}</span>`;
      $('#wizbody').innerHTML=`<div style="text-align:center"><div class="wiz-bigtoken">🌅</div>
        <div class="wiz-bigname">아침이 밝았습니다</div>
        <div class="wiz-caption" style="margin-top:6px">${sc.count?`오늘 밤 사망자 ${sc.count}명`:'사망자 없음'}</div>
        ${sc.html}</div>`;
      $('#wizbody').onclick=null;
      $('#wizfoot').innerHTML=`<button onclick="closeWiz(false)">닫기</button>
        <button class="primary" onclick="closeWiz(false);advancePhase()">☀ 낮으로 진행 →</button>`;
      return;
    }
    _rw();
    if(sc && sc.t==='pick-player' && sc.who==='player'){
      const foot=$('#wizfoot');
      if(foot && !foot.querySelector('.hoBtn')){
        const b=document.createElement('button');
        b.className='hoBtn'; b.textContent='📱 플레이어에게';
        b.onclick=()=>backToPlayer();
        foot.insertBefore(b, foot.firstChild);
      }
    }
  };
})();
/* 밤 화면 상단에 연속 진행 · 새벽 버튼 */
(function(){
  const _rn=renderNight;
  renderNight=function(){
    _rn();
    if(S.phase.kind!=='night') return;
    const pane=document.getElementById('pane-night');
    if(!pane || pane.querySelector('.runbar')) return;
    const card=[...pane.querySelectorAll('.card')].find(c=>/밤 \d/.test(c.querySelector('h2')?.textContent||''));
    if(!card) return;
    const bar=document.createElement('div');
    bar.className='runbar';
    const total=runnableNightSteps().length;
    bar.innerHTML=`<button class="runbtn" onclick="startNightRun()">▶ 밤 전체 진행 (${total}단계)</button>
      <button onclick="showDawn()">🌅 새벽 · 사망자 공표</button>
      <span class="hint">한 번 열면 단계가 자동으로 이어지고, 마지막에 새벽 집계가 나옵니다.</span>`;
    card.insertBefore(bar, card.children[1]||null);
  };
})();
/* ══ B5: 캐릭터 (i) 정보 모달 ══ */
function showCharInfo(cid){
  const c=charOf(cid); if(!c) return;
  const ex=(typeof WIKI_EXTRA!=='undefined'&&WIKI_EXTRA[cid])||{};
  const el=$('#pmodal'); el.hidden=false;
  const sec=(t,items)=>items&&items.length?`<div class="pmsec">${t}</div><ul class="guide">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  el.innerHTML=`<div class="pmcard" onclick="event.stopPropagation()">
    <div class="pmhead"><h3>${esc(c.ko)}</h3>
      <span class="hint" style="font-style:italic">${esc(c.en||'')}</span>
      <button class="pmclose" onclick="closePlayerModal()">✕</button></div>
    <div class="pmbody">
      <div class="pmtop">
        <div class="ttoken" style="cursor:default;flex:0 0 auto"><span class="tkname">${esc(c.ko)}</span><span class="tkicon">${glyph(c.id)}</span></div>
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:6px;margin-bottom:8px">
            <span class="pill ${c.type}">${TYPE_KO[c.type]}</span>
            <span class="pill neutral">${esc((typeof scriptLabel==='function'&&(scriptLabel(c.edition)||[])[0]) || EDITIONS[c.edition||'tb']?.ko || '커스텀')}</span>
            ${c.setup||c.setupChar?'<span class="pill warn">셋업 변경</span>':''}
          </div>
          <div class="pmability">${esc(c.ability)}</div>
        </div>
      </div>
      ${c.setupNote?`<div class="alertbox" style="margin-top:12px">셋업: ${esc(c.setupNote)}</div>`:''}
      ${sec('첫날 밤 진행', c.guideFirst)}
      ${sec('그 외 밤 진행', c.guideOther)}
      ${sec('낮 능력·판정 팁', ex.howto)}
      ${sec('상호작용·주의', c.warn)}
      ${sec('기억할 것', c.remind)}
      ${sec('예시', ex.examples)}
    </div></div>`;
  el.onclick=()=>closePlayerModal();
}
/* 시트 카드에 (i) 버튼 주입 */
(function(){
  const _rs=renderSheet;
  renderSheet=function(){
    _rs();
    document.querySelectorAll('#pane-sheet .sheetrow').forEach(row=>{
      if(row.querySelector('.infobtn')) return;
      const nameEl=row.querySelector('.sname'); if(!nameEl) return;
      const ko=nameEl.textContent.trim();
      const c=allChars().find(x=>x.ko===ko); if(!c) return;
      const b=document.createElement('button');
      b.className='infobtn'; b.textContent='i'; b.title='캐릭터 정보';
      b.style.cssText='margin-left:8px;vertical-align:middle';
      b.onclick=(e)=>{ e.stopPropagation(); showCharInfo(c.id); };
      nameEl.parentNode.insertBefore(b, nameEl.nextSibling);
    });
  };
})();
</script>

<script>
/* 위저드 열림 상태를 body 클래스로 반영(모바일 하단 탭바 숨김) */
(function(){
  const _rw=renderWiz, _cw=closeWiz;
  renderWiz=function(){ _rw(); document.body.classList.add('wizopen'); };
  closeWiz=function(d){ _cw(d); if(document.getElementById('wizard').hidden) document.body.classList.remove('wizopen'); };
})();
</script>

<script>
/* ══ 8) 지명 탭 그리드 상태 ══ */
let nomPick={tor:null, nee:null};
function setNomPick(k,pid){ nomPick[k] = nomPick[k]===pid? null : pid; renderAll(); }

/* ══ 10) 좌석 드래그 재정렬 ══ */
let dragPid=null;
function seatDragStart(e,pid){ dragPid=pid; e.currentTarget.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',pid); }catch(_){} }
function seatDragOver(e){ e.preventDefault();
  document.querySelectorAll('.seatrow.dropzone').forEach(el=>el.classList.remove('dropzone'));
  e.currentTarget.classList.add('dropzone'); }
function seatDragEnd(){ dragPid=null;
  document.querySelectorAll('.seatrow.dragging,.seatrow.dropzone').forEach(el=>el.classList.remove('dragging','dropzone')); }
function seatDrop(e,targetPid){
  e.preventDefault();
  const from=S.players.findIndex(p=>p.id===dragPid), to=S.players.findIndex(p=>p.id===targetPid);
  seatDragEnd();
  if(from<0||to<0||from===to) return;
  const [m]=S.players.splice(from,1); S.players.splice(to,0,m);
  log(`좌석 재배치: ${m.name} → ${to+1}번`); save(); renderAll();
}

/* ══ 9) 캐릭터 확인 — 명단 자율 탭 ══ */
let revealDone={};
function startRevealWiz(){
  revealDone={};
  startCustomWiz('👥 캐릭터 확인', [{t:'roster'}]);
}
function revealShow(pid){
  const p=playerOf(pid); if(!p) return;
  let cid=p.charId; if(cid==='drunk' && S.drunkMaskChar) cid=S.drunkMaskChar;
  wiz.scenes=[{t:'reveal-char', char:cid, who:`${S.players.indexOf(p)+1}번 · ${p.name}`, _back:pid}];
  wiz.idx=0; renderWiz();
}
function revealBack(pid){
  if(pid) revealDone[pid]=true;
  wiz.scenes=[{t:'roster'}]; wiz.idx=0; renderWiz();
}
(function(){
  const _rw=renderWiz;
  renderWiz=function(){
    const sc=wiz&&wiz.scenes[wiz.idx];
    if(sc && sc.t==='roster'){
      const total=S.players.length, done=Object.keys(revealDone).length;
      $('#wizhead').innerHTML=`<span class="wtitle">👥 캐릭터 확인</span><span class="wstep num">${done}/${total}</span>`;
      $('#wizbody').innerHTML=`<div style="text-align:center">
        <div class="wiz-caption">확인할 사람을 누르세요. 순서는 자유이고, 확인한 사람은 ✓ 표시됩니다.<br>
          <b>기기를 건네기 전</b>에 다른 사람이 화면을 보지 않는지 확인하세요.</div>
        <div class="rosterlist">${S.players.map((p,i)=>`
          <div class="rostercell ${revealDone[p.id]?'done':''}" onclick="revealShow('${p.id}')">
            <span class="rnum num">${i+1}</span><span class="rname">${esc(p.name)}</span></div>`).join('')}</div>
        ${done===total?'<div class="alertbox blue" style="margin-top:18px;display:inline-block">전원 확인 완료 — 기기를 사회자에게 돌려받으세요.</div>':''}
      </div>`;
      $('#wizbody').onclick=null;
      $('#wizfoot').innerHTML=`<button onclick="closeWiz(false)">닫기</button>
        <button class="primary" onclick="closeWiz(true)">✓ 확인 종료</button>`;
      document.body.classList.add('wizopen');
      return;
    }
    if(sc && sc.t==='reveal-char' && sc._back){
      _rw();
      $('#wizbody').onclick=()=>revealBack(sc._back);
      $('#wizfoot').innerHTML=`<button class="primary" onclick="revealBack('${sc._back}')">↩ 명단으로 (확인 완료)</button>`;
      return;
    }
    _rw();
  };
})();

/* ══ 7) 정보 슬롯 무작위 · 비우기 ══ */
function wizRandomFill(){
  const sc=wiz.scenes[wiz.idx]; if(!sc) return;
  const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
  if(sc.t==='pick-character'){
    const pool=wizCharPool(sc.pool); if(!pool.length) return;
    const n=sc.n||1, out=[]; const bag=pool.slice();
    while(out.length<n && bag.length) out.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0].id);
    wiz.vars[sc.storeAs]=out;
  } else if(sc.t==='pick-player'){
    let cand=wizPlayers(sc.filter||'alive');
    // 정보 캐릭터의 '진짜 대상'이 이미 정해졌으면 그 사람을 반드시 포함
    const truth=wiz.vars.tok&&wiz.vars.tok[0];
    const must=truth? S.players.find(p=>p.charId===truth && cand.includes(p)) : null;
    const out=[]; if(must) out.push(must.id);
    const bag=cand.filter(p=>!out.includes(p.id));
    while(out.length<sc.n && bag.length) out.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0].id);
    // 표시 순서를 섞어 진짜 대상 위치를 감춘다
    for(let i=out.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
    wiz.vars[sc.storeAs]=out;
  } else return;
  renderWiz();
}
function wizClearPick(){
  const sc=wiz.scenes[wiz.idx]; if(!sc||!sc.storeAs) return;
  delete wiz.vars[sc.storeAs]; renderWiz();
}
(function(){
  const _rw=renderWiz;
  renderWiz=function(){
    _rw();
    const sc=wiz&&wiz.scenes[wiz.idx];
    // 플레이어에게 기기를 넘긴 화면에는 사회자용 보조 버튼을 노출하지 않는다
    if(handoff) return;
    if(sc && (sc.t==='pick-character'||sc.t==='pick-player') && !document.querySelector('.wizextra')){
      const body=$('#wizbody');
      if(body){
        const d=document.createElement('div');
        d.className='wizextra';
        d.innerHTML=`<button class="small" onclick="wizRandomFill()">🎲 무작위</button>
                     <button class="small ghost" onclick="wizClearPick()">비우기</button>`;
        body.appendChild(d);
      }
    }
  };
})();
</script>

<script>
/* ══════════════ ③ 승리 조건 엔진 (캐릭터별 전수) ══════════════
   반환: {team:'good'|'evil', reason, rule} 또는 null(계속)
   판정 순서: 즉시 종료 조건 → 악마 생존 여부 → 계승/연장 차단 사유 */
function aliveEvilTwinPair(){
  const et=S.players.find(p=>p.alive && p.charId==='eviltwin');
  if(!et || isMalfunctioning(et)) return null;
  return et;
}
function winBlockers(){
  // 악마가 죽어도 선 승리를 막는 요소들
  const out=[];
  const et=aliveEvilTwinPair();
  if(et) out.push({who:'사악한 쌍둥이', why:'선한 쌍둥이와 사악한 쌍둥이가 모두 살아 있는 동안 선한 팀은 승리할 수 없습니다.'});
  const mm=S.players.find(p=>p.alive && p.charId==='mastermind');
  if(mm && !isMalfunctioning(mm)) out.push({who:'주모자', why:'악마가 처형돼도 게임이 하루 더 이어집니다. 다음 낮 처형 결과로 승패가 갈립니다.'});
  const sw=S.players.find(p=>p.alive && p.charId==='scarletwoman');
  if(sw && !isMalfunctioning(sw)) out.push({who:'탕녀', why:'생존 5명 이상에서 악마가 죽으면 탕녀가 계승합니다.'});
  return out;
}
/* 사건 기반 즉시 종료 판정 */
function evalWinEvent(kind, ctx){
  ctx=ctx||{};
  const p=ctx.player;
  if(kind==='execute'){
    if(p && p.charId==='saint' && !isMalfunctioning(p))
      return {team:'evil', reason:`성자(${p.name})가 처형되었습니다.`, rule:'성자: 처형으로 죽으면 선한 팀이 패배합니다. (중독·취함 상태였다면 발동하지 않습니다)'};
    if(p && p.charId==='eviltwin')
      return null; // 사악한 쌍둥이 본인 처형은 종료 아님
    const et=S.players.find(x=>x.charId==='eviltwin' && x.alive);
    if(et && p && ctx.isGoodTwin)
      return {team:'evil', reason:`선한 쌍둥이(${p.name})가 처형되었습니다.`, rule:'사악한 쌍둥이: 선한 쌍둥이가 처형되면 악한 팀이 승리합니다.'};
  }
  if(kind==='klutz'){
    if(ctx.targetEvil)
      return {team:'evil', reason:`얼뜨기(${ctx.klutzName})가 악한 플레이어를 지목했습니다.`, rule:'얼뜨기: 사망 후 공개 지목한 대상이 악하면 선한 팀이 패배합니다. (중독·취함 상태로 죽었다면 발동하지 않습니다)'};
    return null;
  }
  if(kind==='dayEnd'){
    if(S.mastermindDay && S.phase.n===S.mastermindDay){
      const ex=S.executedTodayPid? playerOf(S.executedTodayPid):null;
      if(ex && isEvil(ex))
        return {team:'good', reason:`주모자 연장전(낮 ${S.phase.n})에 악한 플레이어 ${ex.name}이(가) 처형되었습니다.`, rule:'주모자: 연장된 하루에 악한 플레이어가 처형되면 선한 팀이 승리합니다.'};
      return {team:'evil', reason: ex? `주모자 연장전(낮 ${S.phase.n})에 선한 플레이어 ${ex.name}이(가) 처형되었습니다.` : `주모자 연장전(낮 ${S.phase.n})에 처형이 없었습니다.`, rule:'주모자: 연장된 하루에 악한 플레이어가 처형되지 않으면 악한 팀이 승리합니다.'};
    }
    const vx=S.players.find(x=>x.alive && charOf(x.charId)?.type==='demon' && x.charId==='vortox');
    if(vx && !ctx.executed)
      return {team:'evil', reason:'보르톡스가 살아 있는데 오늘 처형이 없었습니다.', rule:'보르톡스: 처형이 없는 낮이 끝나면 악한 팀이 승리합니다.'};
    const mayor=S.players.find(x=>x.alive && x.charId==='mayor');
    if(mayor && !isMalfunctioning(mayor) && alivePlayers().length===3 && !ctx.executed)
      return {team:'good', reason:'생존자 3명 상태에서 처형 없이 낮이 끝났습니다.', rule:'시장: 생존자가 3명일 때 처형이 일어나지 않으면 선한 팀이 승리합니다.'};
  }
  if(kind==='death'){
    const demonAlive=S.players.some(x=>(x.alive||(x.charId==='zombuul'&&hasStatus(x,'fakedead'))) && charOf(x.charId)?.type==='demon');
    if(demonAlive){
      // 좀버얼이 '죽은 척' 중이면 겉보기 생존 2인이어도 자동 악 승리를 적용하지 않는다
      const demonReallyAlive=S.players.some(x=>x.alive && charOf(x.charId)?.type==='demon');
      if(alivePlayers().length<=2){
        if(demonReallyAlive)
          return {team:'evil', reason:'생존자가 2명 이하이고 악마가 살아 있습니다.', rule:'생존자가 2명이 되면 악마가 반드시 이깁니다(처형으로 악마를 잡을 수 없음).'};
        return {kind:'continue', why:'zombuul', msg:'좀버얼이 죽은 척하는 중 — 생존 2인 자동 악 승리를 적용하지 않습니다. 좀버얼의 두 번째 사망이 진짜입니다.'};
      }
      return null;
    }
    const blockers=winBlockers();
    const aliveN=(ctx.aliveBefore!==undefined? ctx.aliveBefore : alivePlayers().length+1);
    const sw=S.players.find(x=>x.alive && x.charId==='scarletwoman');
    if(sw && aliveN>=5 && !isMalfunctioning(sw))
      return {kind:'continue', why:'scarletwoman', msg:`탕녀 계승 조건(악마 사망 시 생존 ${aliveN}명) — 게임은 계속됩니다.`};
    const mm=S.players.find(x=>x.alive && x.charId==='mastermind');
    if(mm && !isMalfunctioning(mm) && ctx.byExecution)
      return {kind:'continue', why:'mastermind', msg:'주모자 — 악마가 처형됐지만 게임이 하루 더 이어집니다.'};
    const et=aliveEvilTwinPair();
    if(et)
      return {kind:'continue', why:'eviltwin', msg:'사악한 쌍둥이와 선한 쌍둥이가 모두 살아 있어 선한 팀은 아직 승리할 수 없습니다.'};
    return {team:'good', reason:'마지막 악마가 죽었습니다.', rule:'악마가 모두 죽고 계승·연장 조건이 없으면 선한 팀이 승리합니다.'};
  }
  return null;
}
/* ── 승리값 판별 · '계속' 사유 안내 ── */
function isWinRes(r){ return !!(r && r.team); }
/* '계속'을 기존 checkEndConditions 로 떨어뜨리면 주모자·사악한 쌍둥이 상황에서
   '악마가 죽었습니다 — 선한 팀 승리'가 잘못 선언된다. 여기서 끊고 안내만 한다. */
function announceContinue(res){
  if(res.why==='mastermind' && !S.mastermindDay){
    S.mastermindDay=S.phase.n+1;
    log(`🧠 주모자 연장전 — 낮 ${S.mastermindDay}의 처형 결과로 승패가 갈립니다`);
  }
  log(`게임 계속(${res.why}): ${res.msg}`);
  toast(`▶ ${res.msg}`,'warn');
  save(); renderAll();
}
/* ── 승리 확인 다이얼로그 ── */
let pendingWin=null;
function askWin(res){
  if(!isWinRes(res) || S.gameOver) return;
  pendingWin=res;
  const el=$('#winask'); el.hidden=false;
  const blockers=winBlockers();
  el.innerHTML=`<div class="wcard">
    <div class="wicon">${res.team==='good'?'🕊️':'😈'}</div>
    <div class="wteam ${res.team}">${res.team==='good'?'선한 팀의 승리입니다':'악한 팀의 승리입니다'}</div>
    <h3>게임을 끝내겠습니까?</h3>
    <div class="wreason">${esc(res.reason)}</div>
    <div class="wrule">📖 ${esc(res.rule)}</div>
    ${blockers.length?`<div class="alertbox" style="text-align:left">확인할 것: ${blockers.map(b=>`<b>${esc(b.who)}</b>`).join(' · ')} — ${esc(blockers[0].why)}</div>`:''}
    <div class="bigactions">
      <button class="gold" onclick="confirmWin(true)">✓ 게임 종료</button>
      <button onclick="confirmWin(false)">아니오 — 계속 진행</button>
    </div></div>`;
}
function confirmWin(yes){
  const el=$('#winask'); el.hidden=true;
  const res=pendingWin; pendingWin=null;
  if(!res) return;
  if(yes){ S.gameOver=true; save(); showGameOver(res.team, res.reason+' — '+res.rule); }
  else {
    log(`승리 조건 안내(${res.team==='good'?'선':'악'}) — 사회자가 계속 진행을 선택: ${res.reason}`);
    save();
    if(typeof res.resume==='function'){ const go=res.resume; setTimeout(go,0); }   // 막아둔 페이즈 전환을 이어서 실행
    else renderAll();
  }
}
/* 기존 판정과 연결 — checkEndConditions를 사건 기반 엔진으로 대체 */
(function(){
  const _orig=checkEndConditions;
  checkEndConditions=function(cause, aliveBefore){
    if(S.gameOver) return;
    const byExecution=/처형|성결자/.test(cause||'');
    const res=evalWinEvent('death', {aliveBefore, byExecution});
    if(isWinRes(res)){ askWin(res); return; }
    if(res && res.kind==='continue'){ announceContinue(res); return; }
    _orig(cause, aliveBefore);
  };
})();
/* 처형 시 성자·선한 쌍둥이 판정 */
(function(){
  const _exec=executeNominee;
  executeNominee=function(nid){
    const n=findNom(nid); const p=n?playerOf(n.nominee):null;
    const et=S.players.find(x=>x.alive&&x.charId==='eviltwin');
    let isGoodTwin=false;
    if(et && p && p!==et && !isEvil(p) && !isMalfunctioning(et)){
      isGoodTwin = confirm(`👥 사악한 쌍둥이가 게임에 있습니다.\n${p.name}이(가) 선한 쌍둥이입니까?\n[확인] 예 → 처형 시 악한 팀 승리 / [취소] 아니오`);
    }
    _exec(nid);
    if(!p || p.alive) return;
    const res=evalWinEvent('execute', {player:p, isGoodTwin});
    if(isWinRes(res)) askWin(res);
  };
})();
/* 낮 종료(밤 진행) 시 보르톡스·시장 판정 */
(function(){
  const _adv=advancePhase;
  advancePhase=function(){
    if(S.phase.kind==='day' && !S.gameOver){
      const res=evalWinEvent('dayEnd', {executed:!!S.executedToday});
      if(isWinRes(res)){

})();

const DAY_DEAD_TRIGGER=new Set(['klutz','sweetheart','barber']);
function dayGuideDone(){

function dayAbilityEntries(){
  const out=[];
  allChars().forEach(c=>{

function renderDayGuide(){

    </div>`+
    steps.map((st,i)=>`<div class="step ${doneMap[st.id]?'done':(st.skip?'skip':'wake')} ${dayGuideOpen===st.id?'open':''}" id="daystep-${st.id}">

  });
  return wrap;
}
