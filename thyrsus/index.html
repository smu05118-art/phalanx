function addStatusUI(pid,key){
  const p=playerOf(pid); const ph=S.phase;
  let exp=null, src='사회자 수동';
  if(key==='poison'){ exp={kind:'night', n:(ph.kind==='night'?ph.n:ph.n)+1}; }
  if(key==='protect'){ exp={kind:'day', n:ph.n}; }
  if(key==='master'){ S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='master')); exp={kind:'night', n:ph.n+1}; }
  addStatus(p,key,src,exp); save(); renderAll();
}
function exportGame(){
  const blob=JSON.stringify(S,null,1);
  navigator.clipboard?.writeText(blob).then(()=>toast('게임 상태 JSON을 클립보드에 복사했습니다.','ok'),()=>prompt('복사하세요:',blob));
}
</script>

<script>
/* ══════════════════ 밤 진행 탭 ══════════════════ */
function nightSteps(){
  const first = S.phase.n===1;
  const baseOrder = first? FIRST_NIGHT_ORDER : OTHER_NIGHT_ORDER;
  let order = baseOrder.slice();
  // 커스텀 캐릭터 삽입
  (S.customs||[]).forEach(c=>{
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const after = first? c.firstAfter : c.otherAfter;
    if(!after){ order.unshift(c.id); return; }
    const idx = order.indexOf(after);
    if(idx>=0) order.splice(idx+1,0,c.id); else order.push(c.id);
  });
  // 술꾼 위장: 위장 캐릭터가 시트에 없으므로, 그 캐릭터의 원래 순서 위치에 삽입
  const drunkP = S.players.find(p=>p.charId==='drunk');
  const maskC = S.drunkMaskChar? charOf(S.drunkMaskChar): null;
  const steps=[];
  order.forEach(id=>{
    if(INFO_STEPS[id]){
      if(S.players.length>=INFO_STEPS[id].minPlayers) steps.push({id, info:true});
      return;
    }
    const c=charOf(id); if(!c) return;
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const holders = playersByChar(id);
    const maskHere = drunkP && maskC && maskC.id===id; // 위장 캐릭터가 실제로도 플레이 중일 수 있음
    if(!holders.length && !maskHere) return;
    steps.push({id, holders, mask: maskHere? drunkP : null});
  });
  // 위장 캐릭터가 인플레이가 아닌 경우: 순서표에 없으므로 원 위치에 직접 삽입
  if(drunkP && maskC && !steps.some(s=>s.id===maskC.id)){
    const wakes = first? maskC.first : maskC.other;
    if(wakes){
      const baseIdx = (first?FIRST_NIGHT_ORDER:OTHER_NIGHT_ORDER).indexOf(maskC.id);
      let insertAt = steps.length;
      if(baseIdx>=0){
        for(let i=0;i<steps.length;i++){
          const bi=(first?FIRST_NIGHT_ORDER:OTHER_NIGHT_ORDER).indexOf(steps[i].id);
          if(bi>baseIdx){ insertAt=i; break; }
        }
      }
      steps.splice(insertAt,0,{id:maskC.id, holders:[], mask:drunkP, maskOnly:true});
    }
  }
  return steps;
}
function stepSkipReason(st){
  const first=S.phase.n===1;
  if(st.info) return null;
  const c=charOf(st.id);
  const holders=(st.holders||[]).concat(st.mask?[st.mask]:[]);
  const anyAlive = holders.some(p=>p.alive);
  if(st.id==='ravenkeeper'){
    const rk=holders[0];
    if(rk && rk.alive) return '아직 생존 — 오늘 밤 죽는 경우에만 이 시점에 깨움';
    return null; // 죽었으면 표시(그 밤에 죽었는지는 사회자 판단)
  }
  if(!anyAlive) return '사망 — 깨우지 않음';
  if(st.id==='undertaker' && !S.executedPrevDay && !first) return '어제 낮 처형 없음 — 깨우지 않음';
  if(st.id==='scarletwoman') return null;
  return null;
}
function autoInfoHint(st){
  /* 사회자 친화: 요리사·공감자 정답 후보 자동 계산 */
  const seats=S.players;
  const evilAt = p => isEvil(p); // 등록 재량 반영 전 '실제' 값
  if(st.id==='chef'){
    let pairs=0;
    for(let i=0;i<seats.length;i++){ if(evilAt(seats[i]) && evilAt(seats[(i+1)%seats.length])) pairs++; }
    return `실제 인접 악 쌍: <b class="num">${pairs}</b> <span class="hint">(첩자·은둔자 등록 재량 반영 전 기준)</span>`;
  }
  if(st.id==='empath'){
    return (st.holders||[]).filter(p=>p.alive).map(p=>{
      const i=seats.indexOf(p); const n=seats.length;
      let L=null,R=null;
      for(let d=1;d<n;d++){ const q=seats[((i-d)%n+n)%n]; if(q.alive&&q!==p){L=q;break;} }
      for(let d=1;d<n;d++){ const q=seats[(i+d)%n]; if(q.alive&&q!==p){R=q;break;} }
      const cnt=(L&&evilAt(L)?1:0)+(R&&evilAt(R)?1:0);
      return `${esc(p.name)}의 생존 이웃: ${L?esc(L.name):'-'} · ${R?esc(R.name):'-'} → 실제 악 수 <b class="num">${cnt}</b> <span class="hint">(등록 재량 반영 전)</span>`;
    }).join('<br>');
  }
  if(st.id==='undertaker' && S.executedPrevDay){
    return `어제 처형: <b>${esc(S.executedPrevDay)}</b>`;
  }
  if(st.id==='fortuneteller' && S.redHerringId){
    const rh=playerOf(S.redHerringId);
    return rh? `🎗 붉은 청어: <b>${esc(rh.name)}</b> — 지목되면 "예"`:'';
  }
  return '';
}
function renderNight(){
  const el=$('#pane-night');
  if(S.phase.kind!=='night'){
    el.innerHTML=`<div class="card"><h2>밤 진행</h2><p class="hint">지금은 ${phaseName()} 단계입니다. 상단의 진행 버튼으로 밤으로 이동하면 이 시트 구성에 맞는 밤 순서가 생성됩니다.</p>
    ${previewNightOrders()}</div>`;
    return;
  }
  const steps=nightSteps();
  const doneMap=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={});
  const poisoned=S.players.filter(p=>hasStatus(p,'poison'));
  el.innerHTML=`
  <div class="card">
    <h2>밤 ${S.phase.n} ${S.phase.n===1?'(첫날 밤)':''}</h2>
    ${poisoned.length?`<div class="alertbox red">☠ 현재 중독: <b>${poisoned.map(p=>`${esc(p.name)}(${charName(p)})`).join(', ')}</b> — 이들의 능력은 오작동합니다(정보=거짓 가능, 발동=불발).</div>`:''}
    <p class="hint">순서대로 진행하며 완료 체크. 이름을 누르면 진행 가이드가 열립니다. 회색 항목은 오늘 밤 깨우지 않는 캐릭터입니다.</p>
    ${steps.map((st,i)=>renderStep(st,i,doneMap)).join('')}
    <div class="alertbox blue" style="margin-top:12px">🌅 <b>새벽</b> — 모두 깨우고, 오늘 밤의 사망자를 공표하세요(사인은 밝히지 않음). 상단 버튼으로 낮으로 진행하면 보호 토큰이 자동 해제됩니다.</div>
  </div>`;
}
function previewNightOrders(){
  const fmt=(ord,first)=>ord.map(id=>{
    if(INFO_STEPS[id]) return `<li>${INFO_STEPS[id].ko} <span class="hint">(7인 이상)</span></li>`;
    const c=charOf(id); return c?`<li>${esc(c.ko)}</li>`:'';
  }).join('');
  return `<div class="grid2" style="margin-top:10px">
    <div><h3>첫날 밤 순서 (공식)</h3><ol class="guide">${fmt(FIRST_NIGHT_ORDER,true)}</ol></div>
    <div><h3>그 외 밤 순서 (공식)</h3><ol class="guide">${fmt(OTHER_NIGHT_ORDER,false)}</ol></div>
  </div>`;
}
function renderStep(st,i,doneMap){
  const first=S.phase.n===1;
  const done=!!doneMap[st.id];
  const skip=stepSkipReason(st);
  let name, who='', body='';
  if(st.info){
    const inf=INFO_STEPS[st.id];
    name=inf.ko;
    const targets = st.id==='minioninfo' ? S.players.filter(p=>charOf(p.charId)?.type==='minion')
                                         : S.players.filter(p=>charOf(p.charId)?.type==='demon');
    who=targets.map(p=>esc(p.name)).join(', ');
    body=`<ol class="guide">${inf.guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    if(st.id==='demoninfo'){
      const inPlay=new Set(S.players.map(p=>p.charId));
      const safeBluffs=CHARACTERS.filter(c=>(c.type==='townsfolk'||c.type==='outsider') && !inPlay.has(c.id) && c.id!==S.drunkMaskChar).map(c=>c.ko);
      body+=`<div class="alertbox">블러프 후보(미사용 선 캐릭터, 술꾼 위장 제외): ${esc(safeBluffs.join(', ')||'없음')}</div>`;
    }
  } else {
    const c=charOf(st.id);
    name=c.ko;
    const holders=(st.holders||[]);
    who = holders.map(p=>{
      let tags='';
      if(!p.alive) tags+=' 💀';
      if(hasStatus(p,'poison')) tags+=' ☠';
      if(p.charId==='drunk'||hasStatus(p,'drunkS')) tags+=' 🍺';
      return esc(p.name)+tags;
    }).join(', ');
    if(st.mask) who += (who?' · ':'')+`🎭 ${esc(st.mask.name)} (술꾼 — ${esc(c.ko)} 행세)`;
    const guide = first? (c.guideFirst||c.guideOther) : (c.guideOther||c.guideFirst);
    if(guide) body+=`<ol class="guide">${guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    const hint=autoInfoHint(st);
    if(hint) body+=`<div class="alertbox blue">${hint}</div>`;
    const badHolders=holders.filter(p=>p.alive&&isMalfunctioning(p));
    if(badHolders.length) body+=`<div class="alertbox red">☠ <b>${badHolders.map(p=>esc(p.name)).join(', ')}</b>: 능력 오작동 상태 — 정보형이면 <b>거짓 정보</b>를 주고, 발동형이면 <b>효과 없음</b>으로 처리하되 본인에게는 평소처럼 응대하세요.</div>`;
    if(st.mask) body+=`<div class="alertbox">🎭 술꾼입니다 — ${esc(c.ko)}처럼 깨우되 <b>항상 그럴듯한 거짓 정보</b>를 주세요. 어떤 정보를 줬는지 그리모어 메모에 기록!</div>`;
    if(c.warn&&c.warn.length) body+=`<details class="morebox"><summary>상호작용 주의 ${c.warn.length}건</summary><div class="inner"><ul>${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></details>`;
    body+=stepWidget(st,c);
    if(c.conditional) who+=` <span class="pill warn">${esc(c.conditional)}</span>`;
  }
  const cls = done?'done': skip?'skip':'wake';
  return `<div class="step ${cls} ${openStep===st.id?'open':''}" id="step-${st.id}">
    <div class="stephead" onclick="toggleStep('${st.id}')">
      <input type="checkbox" ${done?'checked':''} onclick="event.stopPropagation();toggleDone('${st.id}')" style="accent-color:var(--accent)">
      <span class="stepnum num">${i+1}</span>
      <span class="stepname">${esc(name)}</span>
      <span class="stepwho">${who||''}</span>
      ${skip?`<span class="pill neutral" style="margin-left:auto">${esc(skip)}</span>`:''}
    </div>
    <div class="stepbody">${body}</div>
  </div>`;
}
let openStep=null;
function toggleStep(id){ openStep = openStep===id? null : id; renderAll(); }
function toggleDone(id){ const m=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={}); m[id]=!m[id]; save(); renderAll(); }

function selPlayers(fnName, filter, label){
  const cand=S.players.filter(filter||(()=>true));
  return `<div class="row" style="margin-top:8px">
    <select id="sel-${fnName}"><option value="">— ${label} —</option>${cand.map(p=>`<option value="${p.id}">${esc(p.name)} (${charName(p)}${p.alive?'':' 💀'})</option>`).join('')}</select>
    <button class="small primary" onclick="${fnName}(document.getElementById('sel-${fnName}').value)">적용</button>
  </div>`;
}
function stepWidget(st,c){
  if(st.id==='poisoner') return `<h3>☠ 중독 대상 기록</h3>`+selPlayers('doPoison', p=>p.alive, '독살자가 지목한 대상');
  if(st.id==='monk') return `<h3>🛡 보호 대상 기록</h3>`+selPlayers('doProtect', p=>p.alive&&p.charId!=='monk', '수도사가 지목한 대상');
  if(st.id==='butler') return `<h3>🤵 주인 기록</h3>`+selPlayers('doMaster', p=>p.alive&&p.charId!=='butler', '집사가 지목한 주인');
  if(st.id==='imp') return `<h3>🗡 살해 판정</h3><p class="hint">임프가 지목한 대상을 선택하면 보호·군인·시장·중독을 자동 판정합니다.</p>`+selPlayers('doImpKill', p=>true, '임프가 지목한 대상');
  if(st.id==='ravenkeeper') return `<h3>🔮 캐릭터 확인</h3><p class="hint">까마귀지기가 오늘 밤 죽어 지목한 대상 — 실제 캐릭터를 확인하세요(등록 재량 적용 가능).</p>`+selPlayers('doRavenPeek', p=>true, '까마귀지기가 지목한 대상');
  return '';
}
function doPoison(pid){ if(!pid)return; const p=playerOf(pid); const poisoner=S.players.find(q=>q.charId==='poisoner');
  if(poisoner && isMalfunctioning(poisoner)){ toast('독살자 본인이 오작동 상태 — 독이 퍼지지 않습니다. 기록만 남깁니다.','warn'); log(`독살자 오작동: ${p.name} 중독 불발`); save(); renderAll(); return; }
  addStatus(p,'poison','독살자',{kind:'night', n:S.phase.n+1}); save(); renderAll(); toast(`${p.name} 중독 — 내일 황혼(밤 ${S.phase.n+1} 시작)에 자동 해제`,'ok'); }
function doProtect(pid){ if(!pid)return; const p=playerOf(pid); const monk=S.players.find(q=>q.charId==='monk');
  if(monk && isMalfunctioning(monk)){ toast('수도사가 오작동 상태 — 보호가 실제로는 작동하지 않습니다! 토큰은 기록용으로만 두거나 생략하세요.','warn'); log(`수도사 오작동: ${p.name} 보호 무효`); }
  addStatus(p,'protect','수도사',{kind:'day', n:S.phase.n}); save(); renderAll(); }
function doMaster(pid){ if(!pid)return; S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='master'));
  const p=playerOf(pid); addStatus(p,'master','집사',{kind:'night', n:S.phase.n+1}); save(); renderAll(); }
function doImpKill(pid){
  if(!pid)return; const t=playerOf(pid);
  const imp=S.players.find(q=>q.alive && charOf(q.charId)?.type==='demon');
  if(imp && isMalfunctioning(imp)){ toast('임프가 중독/오작동 — 오늘 밤 살해 불발. 아무도 죽지 않습니다.','warn'); log(`임프 오작동: ${t.name} 살해 불발`); save(); renderAll(); return; }
  if(t===imp){ // 자살 → 별 넘기기
    killPlayer(t,'임프 자살(★ 별 넘기기)');
    const minions=S.players.filter(q=>q.alive && charOf(q.charId)?.type==='minion');
    if(minions.length){
      const sw=minions.find(m=>m.charId==='scarletwoman');
      const pick=prompt(`임프가 될 하수인 이름을 입력하세요 (생존 하수인: ${minions.map(m=>m.name+'('+charName(m)+')').join(', ')})${sw?'\n관례: 주홍 여인 우선':''}`, (sw||minions[0]).name);
      const np=minions.find(m=>m.name===pick)||sw||minions[0];
      np.charId='imp'; log(`★ ${np.name}이(가) 새 임프가 됨 — 깨워서 임프 토큰을 보여주세요`);
      toast(`${np.name}이(가) 새 임프입니다. 지금 깨워 임프 토큰을 보여주세요.`,'warn');
    }
    save(); renderAll(); return;
  }
  if(!t.alive){ toast('이미 죽은 대상입니다 — 아무 일도 일어나지 않습니다.','warn'); return; }
  const mf=isMalfunctioning(t);
  if(hasStatus(t,'protect') && !mf){ toast(`${t.name}은(는) 수도사의 보호 중 — 사망 없음. 임프에게 알리지 마세요.`,'ok'); log(`임프 공격 → ${t.name} 보호로 무효`); save(); renderAll(); return; }
  if(t.charId==='soldier' && !mf){ toast(`${t.name}은(는) 군인 — 사망 없음. 임프에게 알리지 마세요.`,'ok'); log(`임프 공격 → 군인 ${t.name} 무효`); save(); renderAll(); return; }
  if(t.charId==='mayor' && !mf){
    if(confirm(`${t.name}은(는) 시장입니다. [확인] = 다른 플레이어가 대신 사망(재량), [취소] = 시장이 그대로 사망`)){
      const alt=prompt('대신 죽을 플레이어 이름:'); const ap=S.players.find(q=>q.name===alt&&q.alive);
      if(ap){ resolveNightDeath(ap, '임프(시장 대체 사망)'); save(); renderAll(); return; }
      toast('대상을 찾지 못해 시장 사망으로 처리합니다.','warn');
    }
  }
  resolveNightDeath(t, '임프의 공격');
  save(); renderAll();
}
function resolveNightDeath(t, cause){
  killPlayer(t, cause);
  if(t.charId==='ravenkeeper' && !isMalfunctioning(t)){
    toast('🔮 까마귀지기가 밤에 죽었습니다 — 지금 깨워서 1명을 지목받고 캐릭터를 보여주세요(까마귀지기 단계).','warn');
  }
  if(t.charId==='ravenkeeper' && isMalfunctioning(t)){
    toast('까마귀지기가 죽었지만 중독/오작동 — 깨우되 거짓 캐릭터를 보여주세요.','warn');
  }
}
function doRavenPeek(pid){ if(!pid)return; const t=playerOf(pid);
  const c=charOf(t.charId); toast(`${t.name}의 실제 캐릭터: ${c?c.ko:'?'} — 첩자/은둔자면 등록 재량, 까마귀지기가 오작동이면 거짓 제시 가능.`,'ok');
  log(`까마귀지기 확인: ${t.name} (${c?c.ko:'?'})`); }
</script>

<script>
/* ══════════════════ 낮 · 투표 탭 ══════════════════ */
function voteNotices(nom){
  const out=[];
  const butler=S.players.find(p=>p.alive&&p.charId==='butler');
  if(butler){
    const master=S.players.find(p=>hasStatus(p,'master'));
    out.push(`🤵 <b>집사(${esc(butler.name)})</b>: 주인${master?` <b>${esc(master.name)}</b>`:'(미지정!)'}이 거수/찬성한 경우에만 집사도 투표할 수 있습니다.${isMalfunctioning(butler)?' <mark>단, 집사가 현재 오작동 상태 — 자유 투표 허용(본인에겐 알리지 않음)</mark>':''}`);
  }
  const virgin=S.players.find(p=>p.alive&&p.charId==='virgin'&&!hasStatus(p,'virginUsed'));
  if(virgin) out.push(`⚜ <b>성처녀(${esc(virgin.name)})</b> 미발동 — 최초 지명 시 지명자가 마을 주민이면 즉시 처형!${isMalfunctioning(virgin)?' <mark>현재 오작동 — 발동하지 않지만 능력은 소진됨</mark>':''}`);
  const saint=S.players.find(p=>p.alive&&p.charId==='saint');
  if(saint) out.push(`✝ <b>성인(${esc(saint.name)})</b> 생존 중 — 처형되면 선한 팀 패배.${isMalfunctioning(saint)?' <mark>현재 오작동 — 처형돼도 패배하지 않음</mark>':''}`);
  const sw=S.players.find(p=>p.alive&&p.charId==='scarletwoman');
  if(sw && alivePlayers().length>=5) out.push(`🔴 <b>주홍 여인</b> 생존 + 생존자 ${alivePlayers().length}명(5+) — 지금 악마가 처형돼도 게임은 끝나지 않습니다(계승).${isMalfunctioning(sw)?' <mark>단, 현재 오작동 — 계승 불발!</mark>':''}`);
  const mayor=S.players.find(p=>p.alive&&p.charId==='mayor');
  if(mayor && alivePlayers().length===3) out.push(`🏛 <b>시장</b> 생존 + 생존자 3명 — 오늘 처형 없이 낮이 끝나면 선한 팀 승리!${isMalfunctioning(mayor)?' <mark>현재 오작동 — 승리 조건 무효</mark>':''}`);
  const slayer=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(slayer) out.push(`🏹 <b>슬레이어(${esc(slayer.name)})</b> 미사용 — 낮 중 공개 지목 가능. 사용 시 아래 버튼으로 판정하세요.`);
  const deadHold=S.players.filter(p=>!p.alive&&p.deadVote!==false);
  if(deadHold.length) out.push(`👻 사망 투표 토큰 보유: ${deadHold.map(p=>esc(p.name)).join(', ')} — 찬반 투표 참여 시 자동 소진·기록됩니다.`);
  // 커스텀 캐릭터의 투표 관련 노티스
  (S.customs||[]).filter(c=>c.voteRelated).forEach(c=>{
    playersByChar(c.id).filter(p=>p.alive).forEach(p=>out.push(`🔔 <b>${esc(c.ko)}(${esc(p.name)})</b>: ${esc(c.voteNote||c.ability)}`));
  });
  if(nom){
    const nee=playerOf(nom.nominee);
    if(nee){
      if(nee.charId==='saint') out.push(`🚨 지명 대상이 <b>성인</b>입니다 — 처형 확정 전 중독 여부를 반드시 확인!`);
      if(nee.charId==='recluse') out.push(`👤 지명 대상이 <b>은둔자</b> — 처형돼도 게임은 끝나지 않습니다(악마 아님).`);
      if(charOf(nee.charId)?.type==='demon') out.push(`😈 지명 대상이 <b>악마</b> — 처형 시 주홍 여인 계승·생존자 수(5+) 확인.`);
    }
  }
  return out;
}
function renderDay(){
  const el=$('#pane-day');
  if(S.phase.kind!=='day'){
    el.innerHTML=`<div class="card"><h2>낮 · 투표</h2><p class="hint">지금은 ${phaseName()} 단계입니다. 낮이 되면 지명·투표 시스템이 열립니다.</p>
    <div class="card" style="background:var(--sunken)"><h3>티르소스 투표 규칙 (하우스 룰)</h3><ol class="guide">
      <li>지명 후 <b>1차 거수 투표</b>: 생존자 대상. 거수 인원이 <b>생존자 과반</b>(⌊n/2⌋+1) 이상이면 2차로.</li>
      <li><b>2차 찬반 투표</b>: 생존자 전원 + (사망자 중 투표 토큰 보유자, 참여 시 토큰 소진·자동 기록).</li>
      <li>매 단계 <b>분자/분모/과반 기준</b>을 화면에 표시.</li>
      <li>재지명은 언제나 가능. 하루의 모든 지명 중 <b>찬성 과반을 넘긴 지명 가운데 찬성률(과반율)이 가장 높은 사람</b>이 처형.</li>
      <li>최고 찬성률 동률이면 처형 없음(공식 규칙 준용).</li>
    </ol></div></div>`;
    return;
  }
  const notices=voteNotices(null);
  const todays=S.noms.filter(n=>n.day===S.phase.n);
  const closed=todays.filter(n=>n.closed);
  const openNom=todays.find(n=>!n.closed);
  const passed=closed.filter(n=>n.result==='pass');
  let best=null, tie=false;
  passed.forEach(n=>{ if(!best||n.ratio>best.ratio){best=n;tie=false;} else if(n.ratio===best.ratio) tie=true; });
  const slayer=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  el.innerHTML=`
  <div class="card"><h2>낮 ${S.phase.n}</h2>
    ${S.executedToday?`<div class="alertbox red">오늘 처형 완료: <b>${esc(S.executedToday)}</b> — 하루 1처형 원칙. 추가 처형은 불가(성처녀 발동 포함).</div>`:''}
    ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
    ${slayer?`<div class="row" style="margin:6px 0"><button class="small" onclick="doSlayer()">🏹 슬레이어 공개 지목 판정</button></div>`:''}
  </div>
  ${openNom? renderNomOpen(openNom) : `
  <div class="card"><h2>지명</h2>
    ${S.executedToday?'<p class="hint">오늘 처형이 이미 있었습니다 — 추가 지명·투표는 기록용으로만 진행하세요.</p>':''}
    <div class="row">
      <select id="nomtor"><option value="">지명자</option>${alivePlayers().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
      <span>→</span>
      <select id="nomnee"><option value="">피지명자</option>${alivePlayers().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
      <button class="primary" onclick="newNomination()">지명 개시</button>
    </div>
    <p class="hint">재지명 제한 없음 — 같은 사람을 다시 지명해도 됩니다(티르소스 하우스 룰).</p>
  </div>`}
  ${closed.length?`<div class="card"><h2>오늘의 지명 결과</h2>
    ${closed.map(n=>{
      const isBest=best&&n===best&&!tie&&n.result==='pass';
      return `<div class="nomcard ${isBest?'leader':''}">
        <div class="nomtitle">${esc(playerOf(n.nominator)?.name||'?')} → ${esc(playerOf(n.nominee)?.name||'?')}
          ${n.result==='pass'?`<span class="pill ok">찬성 ${n.yes}/${n.den} · ${(n.ratio*100).toFixed(1)}%</span>`:
            n.result==='handsFail'?'<span class="pill warn">거수 미달</span>':'<span class="pill warn">찬성 과반 미달</span>'}
          ${isBest?'<span class="pill demon">처형 후보 1위</span>':''}
        </div>
        ${n.deadVoters&&n.deadVoters.length?`<div class="hint">👻 사망자 투표: ${n.deadVoters.map(esc).join(', ')} (토큰 소진 기록됨)</div>`:''}
        ${isBest&&!S.executedToday?`<button class="small danger" style="margin-top:6px" onclick="executeNominee('${n.id}')">⚔ ${esc(playerOf(n.nominee)?.name||'')} 처형 확정</button>`:''}
      </div>`;}).join('')}
    ${tie?'<div class="alertbox warn">⚖ 최고 찬성률 동률 — 처형 없음(공식 규칙 준용). 재지명으로 갱신 가능합니다.</div>':''}
  </div>`:''}`;
}
function newNomination(){
  const tor=$('#nomtor').value, nee=$('#nomnee').value;
  if(!tor||!nee){ toast('지명자와 피지명자를 선택하세요.','warn'); return; }
  if(tor===nee){ toast('자기 자신을 지명했습니다 — 공식 규칙상 허용됩니다. 그대로 진행합니다.','warn'); }
  const nom={id:uid(), day:S.phase.n, nominator:tor, nominee:nee, hands:[], stage:1, votes:{}, closed:false, deadVoters:[]};
  S.noms.push(nom);
  log(`지명: ${playerOf(tor).name} → ${playerOf(nee).name}`);
  // 성처녀 체크
  const neeP=playerOf(nee), torP=playerOf(tor);
  if(neeP.charId==='virgin' && !hasStatus(neeP,'virginUsed')){
    addStatus(neeP,'virginUsed','최초 지명 발생',null);
    const torC=charOf(torP.charId);
    const torIsTF = torC && torC.type==='townsfolk' && torP.charId!=='drunk';
    if(isMalfunctioning(neeP)){
      toast('⚜ 성처녀 최초 지명 — 그러나 성처녀가 오작동 상태: 발동하지 않습니다. 능력은 소진됩니다.','warn');
    } else if(torIsTF){
      if(confirm(`⚜ 성처녀 발동! 지명자 ${torP.name}(${torC.ko})는 마을 주민입니다.\n즉시 처형 처리할까요? (오늘의 처형으로 기록되며, 이 지명은 종료됩니다)`)){
        killPlayer(torP,'성처녀 발동 — 즉시 처형');
        S.executedToday=`${torP.name} (${charName(torP)}) — 성처녀 발동`;
        nom.closed=true; nom.result='virginTriggered';
        toast('처형 완료. 오늘은 추가 처형이 불가합니다. 장의사는 오늘 밤 지명자의 캐릭터를 봅니다.','warn');
      }
    } else if(torP.charId==='spy'){
      toast('⚜ 성처녀 최초 지명 — 지명자가 첩자입니다. "마을 주민으로 등록"시켜 발동시킬지 재량으로 결정하세요. 발동시키려면 그리모어에서 수동 처형 처리.','warn');
    } else {
      toast(`성처녀 최초 지명 — 지명자 ${torP.name}는 마을 주민이 아니므로 발동하지 않습니다. 능력은 소진되었습니다.`,'warn');
    }
  }
  save(); renderAll();
}
function renderNomOpen(nom){
  const alive=alivePlayers();
  const den1=alive.length, need1=majority(den1), num1=nom.hands.length;
  const torN=esc(playerOf(nom.nominator)?.name||'?'), neeN=esc(playerOf(nom.nominee)?.name||'?');
  const notices=voteNotices(nom).filter(x=>x.includes('집사')||x.includes('성인')||x.includes('악마')||x.includes('은둔자'));
  if(nom.stage===1){
    return `<div class="card"><h2>진행 중 지명: ${torN} → ${neeN}</h2>
      ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
      <h3>1단계 · 거수 투표 (생존자)</h3>
      <div class="votemath">
        <div class="vmbox"><div class="vlab">거수(분자)</div><div class="vval">${num1}</div></div>
        <div class="vmbox"><div class="vlab">생존자(분모)</div><div class="vval">${den1}</div></div>
        <div class="vmbox ${num1>=need1?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need1}</div></div>
      </div>
      <div>${alive.map(p=>{
        const on=nom.hands.includes(p.id);
        const butlerFlag = p.charId==='butler' && !isMalfunctioning(p);
        const master=S.players.find(q=>hasStatus(q,'master'));
        const masterUp = master && nom.hands.includes(master.id);
        return `<div class="voterow"><span class="vname">${esc(p.name)}</span>
          <button class="vbtn ${on?'sel-yes':''}" onclick="toggleHand('${nom.id}','${p.id}')">${on?'✋ 거수':'거수'}</button>
          ${butlerFlag?`<span class="hint">🤵 집사 — 주인(${master?esc(master.name):'미지정'})이 거수해야 유효${on&&!masterUp?' <mark>⚠ 지금 주인 미거수!</mark>':''}</span>`:''}
        </div>`;}).join('')}</div>
      <div class="row" style="margin-top:10px">
        <button class="primary" onclick="closeHands('${nom.id}')">${num1>=need1?'✅ 과반 달성 — 찬반 투표로':'거수 마감 (미달 → 부결)'}</button>
        <button class="ghost danger" onclick="cancelNom('${nom.id}')">지명 취소</button>
      </div></div>`;
  }
  // 2단계 찬반
  const dead=S.players.filter(p=>!p.alive&&p.deadVote!==false);
  const eligible=alive.concat(dead);
  const den2=eligible.length, need2=majority(den2);
  const yes=eligible.filter(p=>nom.votes[p.id]==='yes').length;
  const no=eligible.filter(p=>nom.votes[p.id]==='no').length;
  const ratio=den2?yes/den2:0;
  const master=S.players.find(q=>hasStatus(q,'master'));
  return `<div class="card"><h2>진행 중 지명: ${torN} → ${neeN}</h2>
    ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
    <h3>2단계 · 찬반 투표 (생존자 전원 + 투표 토큰 보유 사망자)</h3>
    <div class="votemath">
      <div class="vmbox"><div class="vlab">찬성(분자)</div><div class="vval" style="color:var(--ok)">${yes}</div></div>
      <div class="vmbox"><div class="vlab">반대</div><div class="vval" style="color:var(--evil)">${no}</div></div>
      <div class="vmbox"><div class="vlab">투표권(분모)</div><div class="vval">${den2}</div></div>
      <div class="vmbox ${yes>=need2?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need2}</div></div>
      <div class="vmbox ${yes>=need2?'pass':'fail'}"><div class="vlab">찬성률</div><div class="vval">${(ratio*100).toFixed(1)}%</div></div>
    </div>
    <div>${eligible.map(p=>{
      const v=nom.votes[p.id];
      const isDead=!p.alive;
      const butlerFlag = p.alive && p.charId==='butler' && !isMalfunctioning(p);
      const masterYes = master && nom.votes[master.id]==='yes';
      return `<div class="voterow ${isDead?'deadrow':''}">
        <span class="vname">${esc(p.name)}${isDead?' 👻':''}</span>
        <button class="vbtn ${v==='yes'?'sel-yes':''}" onclick="castVote('${nom.id}','${p.id}','yes')">찬성</button>
        <button class="vbtn ${v==='no'?'sel-no':''}" onclick="castVote('${nom.id}','${p.id}','no')">반대</button>
        <button class="vbtn ${v==='abs'?'sel-abs':''}" onclick="castVote('${nom.id}','${p.id}','abs')">기권</button>
        ${isDead?'<span class="hint">토큰 1회 — 찬성/반대 시 소진</span>':''}
        ${butlerFlag?`<span class="hint">🤵 주인(${master?esc(master.name):'미지정'})이 찬성해야 유효${v==='yes'&&!masterYes?' <mark>⚠ 주인 미찬성!</mark>':''}</span>`:''}
      </div>`;}).join('')}</div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="closeBallot('${nom.id}')">찬반 마감</button>
      <button class="ghost danger" onclick="cancelNom('${nom.id}')">지명 취소</button>
    </div></div>`;
}
function findNom(id){ return S.noms.find(n=>n.id===id); }
function toggleHand(nid,pid){ const n=findNom(nid); const i=n.hands.indexOf(pid);
  if(i>=0)n.hands.splice(i,1); else n.hands.push(pid); save(); renderAll(); }
function closeHands(nid){ const n=findNom(nid); const den=alivePlayers().length, need=majority(den);
  if(n.hands.length>=need){ n.stage=2; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 통과, 찬반 투표로`); }
  else { n.closed=true; n.result='handsFail'; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 미달, 부결`); }
  save(); renderAll(); }
function castVote(nid,pid,v){
  const n=findNom(nid); const p=playerOf(pid);
  const prev=n.votes[pid];
  if(!p.alive){
    if(prev===v){ delete n.votes[pid]; if(v!=='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.name); log(`${p.name} 사망 투표 취소 — 토큰 복원`);} save(); renderAll(); return; }
    if((v==='yes'||v==='no') && !(prev==='yes'||prev==='no')){
      if(p.deadVote===false){ toast(`${p.name}은(는) 이미 투표 토큰을 소진했습니다.`,'warn'); return; }
      p.deadVote=false; n.deadVoters.push(p.name); log(`👻 ${p.name} 사망 투표 참여(${v==='yes'?'찬성':'반대'}) — 토큰 자동 소진`);
    }
    if((prev==='yes'||prev==='no') && v==='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.name); log(`${p.name} 기권으로 변경 — 토큰 복원`); }
    n.votes[pid]=v; save(); renderAll(); return;
  }
  n.votes[pid] = prev===v? undefined : v;
  if(n.votes[pid]===undefined) delete n.votes[pid];
  save(); renderAll();
}
function closeBallot(nid){
  const n=findNom(nid);
  const alive=alivePlayers(); const dead=S.players.filter(p=>!p.alive&&(n.deadVoters.includes(p.name)||p.deadVote!==false));
  const eligible=alive.concat(S.players.filter(p=>!p.alive&&p.deadVote!==false), S.players.filter(p=>!p.alive&&n.deadVoters.includes(p.name)));
  const uniq=[...new Set(eligible)];
  const den=uniq.length, need=majority(den);
  const yes=uniq.filter(p=>n.votes[p.id]==='yes').length;
  n.yes=yes; n.den=den; n.need=need; n.ratio=den?yes/den:0;
  n.closed=true; n.result = yes>=need? 'pass':'yesFail';
  log(`찬반 마감: ${playerOf(n.nominee).name} — 찬성 ${yes}/${den} (기준 ${need}, ${(n.ratio*100).toFixed(1)}%) → ${n.result==='pass'?'과반 통과':'부결'}`);
  save(); renderAll();
}
function cancelNom(nid){ S.noms=S.noms.filter(n=>n.id!==nid); log('지명 취소'); save(); renderAll(); }
function executeNominee(nid){
  const n=findNom(nid); const p=playerOf(n.nominee);
  const saintCheck = p.charId==='saint' && !isMalfunctioning(p);
  if(saintCheck && !confirm(`🚨 ${p.name}은(는) 성인이며 오작동 상태가 아닙니다!\n처형을 확정하면 선한 팀이 패배합니다. 진행할까요?`)) return;
  killPlayer(p, `처형 (찬성 ${n.yes}/${n.den}, ${(n.ratio*100).toFixed(1)}%)`);
  S.executedToday=`${p.name} (${charName(p)})`;
  if(saintCheck){ toast('✝ 성인이 처형되었습니다 — 악한 팀 승리!','warn'); log('성인 처형 — 악 승리'); }
  toast(`${p.name} 처형. 오늘 밤 장의사에게 보여줄 캐릭터: ${charName(p)} (첩자/은둔자/술꾼이면 등록 재량)`,'ok');
  save(); renderAll();
}
function doSlayer(){
  const sl=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(!sl) return;
  const name=prompt('슬레이어가 지목한 플레이어 이름:'); const t=S.players.find(p=>p.name===name);
  if(!t){ toast('플레이어를 찾지 못했습니다.','warn'); return; }
  addStatus(sl,'slayerUsed','공개 지목',null);
  if(isMalfunctioning(sl)){ toast('슬레이어가 오작동 상태 — "아무 일도 일어나지 않습니다"라고 공표. 능력 소진.','warn'); log(`슬레이어 오발(오작동): ${t.name}`); save(); renderAll(); return; }
  const c=charOf(t.charId);
  if(c?.type==='demon' && t.alive){ killPlayer(t,'슬레이어의 일격'); toast(`😈 ${t.name}(악마) 즉사! 주홍 여인·생존자 수를 확인하세요.`,'warn'); }
  else if(t.charId==='recluse' && t.alive){
    if(confirm(`${t.name}은(는) 은둔자 — 악마로 등록시켜 죽일까요? (재량)`)){ killPlayer(t,'슬레이어의 일격(은둔자 악마 등록)'); toast('은둔자가 쓰러졌습니다 — 게임은 끝나지 않습니다. 태연하게!','warn'); }
    else { toast('"아무 일도 일어나지 않습니다" 공표.','ok'); log(`슬레이어 → 은둔자 ${t.name}: 미등록 처리`); }
  }
  else { toast('"아무 일도 일어나지 않습니다"라고 공표하세요.','ok'); log(`슬레이어 오발: ${t.name}`); }
  save(); renderAll();
}
</script>

<script>
/* ══════════════════ 상호작용 · 재량 가이드 탭 ══════════════════ */
const DISCRETION_PRINCIPLES = [
  ['균형','약한 팀에 유리한 쪽으로. 선이 무너지고 있으면 정확한 정보·유리한 등록을, 악이 몰리면 혼선을.'],
  ['재미','극적인 순간을 만들 수 있는 선택이 규칙상 동등하다면 그쪽을 고른다. 단, 특정 플레이어를 반복해 희생시키지 않는다.'],
  ['일관성','등록 재량(첩자·은둔자)은 흔들 수 있지만, 이유 없이 오락가락하면 사회자 신뢰가 깨진다. 바꿀 땐 의도를 갖고.'],
  ['오작동 우선 확인','어떤 판정이든 먼저 묻는다: 이 능력의 주인이 지금 중독/술취함인가? 그렇다면 정보=거짓 가능, 발동=불발.'],
  ['정보 은닉','불발·무효(보호, 군인, 오발)는 티 내지 않는다. 밤엔 동일한 템포, 낮엔 동일한 표정.'],
  ['거짓말 금지','사회자는 플레이어를 오도할 수 있지만 규칙 바깥의 거짓 판정은 안 된다. 재량은 규칙이 "될 수 있다"라고 한 곳에서만.'],
];
const EFFECT_GUIDES = {
  info: {ko:'정보 제공형', steps:['능력 주인이 오작동인가? → 거짓 정보 가능(그럴듯하게, 한 번 준 거짓과 모순되지 않게)','첩자/은둔자가 판정에 걸리는가? → 등록 재량 결정','정답을 줄 경우: 이 정보가 게임을 즉시 끝내버리지 않는지(밸런스) 확인','무엇을 줬는지 그리모어 메모에 기록']},
  kill: {ko:'살해·제거형', steps:['시전자 오작동? → 불발(티 내지 않기)','대상 보호(수도사)·면역(군인)? → 불발','대상이 시장? → 대체 사망 재량','대상이 까마귀지기? → 즉시 발동 처리','사망 확정 시: 악마 사망이면 주홍 여인·생존자 수 체크, 게임 종료 판정']},
  status: {ko:'상태 부여형', steps:['시전자 오작동? → 부여 불발','지속 기간을 명확히: 이 밤만? 다음 낮까지? 영구? → 그리모어 토큰의 자동 해제 시점 지정','겹치는 상태(중독+보호 등)의 우선순위를 지금 정해두고 메모']},
  rule: {ko:'규칙 변경·특수형(마법사류)', steps:['이 요청이 게임의 승리 조건을 직접 바꾸는가? → 원칙적으로 보류하거나 대가를 크게','효과가 공개인가 비밀인가 결정 — 비밀이면 어떤 단서를 언제 흘릴지 계획','대가/리스크를 설계: 강한 소원일수록 눈에 보이는 흔적을 남긴다','한 번 허용한 해석은 게임 내내 유지된다는 걸 전제로 답하기','판정을 즉답하기 어려우면 "밤에 알려주겠다"로 미루는 것도 정당한 기술']},
};
function renderGuide(){
  const el=$('#pane-guide');
  const selId = guideSel || '';
  const c = selId? charOf(selId) : null;
  el.innerHTML=`
  <div class="card"><h2>캐릭터 상호작용 조회</h2>
    <div class="row">
      <select onchange="guideSel=this.value;renderAll()"><option value="">— 캐릭터 선택 —</option>
        ${allChars().map(x=>`<option value="${x.id}" ${selId===x.id?'selected':''}>${esc(x.ko)} (${TYPE_KO[x.type]})</option>`).join('')}
      </select>
    </div>
    ${c?`<h3><span class="pill ${c.type}">${TYPE_KO[c.type]}</span> ${esc(c.ko)} <span class="hint" style="display:inline">${esc(c.en||'')}</span></h3>
      <p>${esc(c.ability)}</p>
      ${c.setupNote?`<div class="alertbox">셋업: ${esc(c.setupNote)}</div>`:''}
      ${(c.warn&&c.warn.length)?`<ul class="guide">${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:'<p class="hint">특기할 상호작용 없음.</p>'}
      ${(c.remind&&c.remind.length)?`<div class="alertbox blue">기억할 것: ${c.remind.map(esc).join(' · ')}</div>`:''}`:''}
  </div>
  <div class="card"><h2>재량 응대 도우미</h2>
    <p class="hint">마법사류 재량 능력이 발동했을 때, 상황을 입력하면 판정 체크리스트를 만들어 줍니다.</p>
    <div class="fieldrow"><label>발동 캐릭터</label><select id="dg-char">${allChars().map(x=>`<option value="${x.id}">${esc(x.ko)}</option>`).join('')}<option value="_other">기타/커스텀</option></select></div>
    <div class="fieldrow"><label>효과 유형</label><select id="dg-type">${Object.entries(EFFECT_GUIDES).map(([k,v])=>`<option value="${k}">${v.ko}</option>`).join('')}</select></div>
    <div class="fieldrow"><label>상황 설명</label><input id="dg-desc" placeholder="예: 마법사가 '죽은 동료를 되살려 달라'고 소원을 빌었다" style="width:100%"></div>
    <div class="row"><button class="primary" onclick="genDiscretion()">응대 가이드 생성</button></div>
    <div id="dg-out"></div>
    <hr class="divider">
    <h3>재량 판정 6원칙</h3>
    ${DISCRETION_PRINCIPLES.map(([t,d])=>`<div class="checkitem"><b style="min-width:88px">${t}</b><span>${d}</span></div>`).join('')}
  </div>`;
}
let guideSel='';
function genDiscretion(){
  const cid=$('#dg-char').value, type=$('#dg-type').value, desc=$('#dg-desc').value.trim();
  const c=cid==='_other'?null:charOf(cid);
  const g=EFFECT_GUIDES[type];
  const holder=c?playersByChar(c.id).find(p=>p.alive):null;
  const mf=holder?isMalfunctioning(holder):false;
  let html=`<div class="alertbox blue" style="margin-top:12px"><b>${c?esc(c.ko):'커스텀 능력'} · ${g.ko}</b>${desc?` — ${esc(desc)}`:''}
  <ol class="guide" style="margin-top:6px">${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
  if(holder&&mf) html+=`<div class="alertbox red">☠ 현재 ${esc(holder.name)}(${esc(c.ko)})은(는) 오작동 상태입니다 — 이 발동은 <b>불발/거짓</b>으로 처리하되, 본인에게는 평소처럼 응대하세요.</div>`;
  if(c&&c.warn&&c.warn.length) html+=`<div style="margin-top:6px" class="hint">관련 상호작용: ${c.warn.map(esc).join(' / ')}</div>`;
  html+=`<div class="hint" style="margin-top:6px">💡 판단이 서지 않으면: "흥미로운 시도네요 — 오늘 밤 결과를 알려드리죠"라고 답하고 시간을 버세요. 즉답 의무는 없습니다.</div></div>`;
  $('#dg-out').innerHTML=html;
  log(`재량 발동 기록: ${c?c.ko:'커스텀'} · ${g.ko}${desc?' · '+desc:''}`);
  save();
}

/* ══════════════════ 체크리스트 탭 (시트별 잊지 말 것) ══════════════════ */
function buildChecklist(){
  const items=[]; const add=(group,src,txt)=>items.push({group,src,txt,key:group+'|'+src+'|'+txt});
  const inPlay=id=>S.players.some(p=>p.charId===id);
  // 셋업
  if(inPlay('baron')) add('셋업','남작','구성 변경 적용 확인: 마을 주민 −2 / 외부인 +2');
  if(inPlay('drunk')) add('셋업','술꾼',`위장 캐릭터 지정(현재: ${S.drunkMaskChar?charOf(S.drunkMaskChar).ko:'⚠ 미지정'}) — 본인에게는 그 주민 토큰을 보여줄 것`);
  if(inPlay('fortuneteller')) add('셋업','점쟁이',`붉은 청어 지정(현재: ${S.redHerringId?playerOf(S.redHerringId)?.name:'⚠ 미지정'}) — 게임 내내 유지`);
  add('셋업','공통','7인 이상이면 첫날 밤 하수인 정보 → 악마 정보(블러프 3개) 순서 진행');
  // 매일 밤
  if(inPlay('poisoner')) add('매일 밤','독살자','새 중독 대상 기록 — 이전 독은 황혼에 자동 해제되었는지 확인');
  if(inPlay('monk')) add('매일 밤','수도사','보호 대상 갱신 — 보호는 그 밤만, 새벽 자동 해제');
  if(inPlay('butler')) add('매일 밤','집사','주인 갱신 — 다음 날 투표 제한에 직결');
  if(inPlay('empath')) add('매일 밤','공감자','이웃 사망 시 "살아있는 이웃" 재계산');
  if(inPlay('undertaker')) add('매일 밤','장의사','어제 처형이 있었을 때만 깨움 — 성처녀 발동 처형 포함');
  if(inPlay('spy')) add('매일 밤','첩자','밤 순서 맨 끝에 그리모어 공개 — 충분한 시간');
  if(inPlay('drunk')) add('매일 밤','술꾼','위장 캐릭터 순서에 깨워 일관된 거짓 정보 — 지난 밤에 준 정보 메모 확인');
  // 낮·투표
  if(inPlay('virgin')) add('낮·투표','성처녀','최초 지명 시 발동 판정 — 지명자가 주민인지, 성처녀가 중독인지');
  if(inPlay('saint')) add('낮·투표','성인','처형 확정 전 중독 여부 확인 — 정상이면 선 패배');
  if(inPlay('butler')) add('낮·투표','집사','주인이 거수/찬성했는지 매 투표 확인');
  if(inPlay('slayer')) add('낮·투표','슬레이어','공개 지목 시 즉시 판정 — 오작동/은둔자 등록 재량, 성공·실패 무관 소진');
  if(inPlay('mayor')) add('낮·투표','시장','생존 3명이 되면: 처형 없이 낮 종료 = 선 승리(오작동 확인)');
  if(inPlay('scarletwoman')) add('낮·투표','주홍 여인','악마 사망 시 생존자 5+ 확인 → 계승, 게임 계속. 그녀가 중독이면 계승 불발!');
  if(inPlay('recluse')) add('낮·투표','은둔자','정보·슬레이어·처형 판정마다 악 등록 여부를 의식적으로 결정');
  if(inPlay('imp')) add('낮·투표','임프','임프 처형·사망 시: 주홍 여인 → 없으면 게임 종료 선언');
  if(inPlay('soldier')) add('참고','군인','임프 공격 무효 — 단 중독 밤엔 죽는다');
  if(inPlay('ravenkeeper')) add('참고','까마귀지기','밤 사망 시 즉시 발동 — 잊기 쉬움! 임프 살해 판정 직후 확인');
  // 커스텀
  (S.customs||[]).forEach(c=>{
    if(S.players.some(p=>p.charId===c.id)){
      (c.reminders||[]).forEach(r=>add('커스텀',c.ko,r));
      if(!(c.reminders||[]).length) add('커스텀',c.ko,'커스텀 캐릭터 — 상호작용 검증 필요(제작자에게 시트 검토 요청)');
    }
  });
  return items;
}
function renderCheck(){
  const el=$('#pane-check');
  const items=buildChecklist();
  const groups=[...new Set(items.map(i=>i.group))];
  el.innerHTML=`<div class="card"><h2>이 시트의 사회자 체크리스트</h2>
  <p class="hint">현재 배정된 캐릭터 기준으로 자동 생성됩니다. 배정이 바뀌면 목록도 바뀝니다.</p>
  ${items.length?groups.map(g=>`<h3>${g}</h3>${items.filter(i=>i.group===g).map(i=>`
    <div class="checkitem"><input type="checkbox" ${S.checks[i.key]?'checked':''} onchange="S.checks['${i.key.replace(/'/g,"\\'")}']=this.checked;save()">
    <span><span class="src">[${esc(i.src)}]</span> ${esc(i.txt)}</span></div>`).join('')}`).join('')
   :'<p class="hint">캐릭터를 배정하면 시트 맞춤 체크리스트가 생성됩니다.</p>'}
  </div>`;
}

/* ══════════════════ 커스텀 탭 ══════════════════ */
function renderCustom(){
  const el=$('#pane-custom');
  const mk=(ord)=>['__front'].concat(ord).map(id=>{
    if(id==='__front') return `<option value="">밤 순서 맨 앞</option>`;
    const ko=INFO_STEPS[id]?INFO_STEPS[id].ko:(charOf(id)?.ko||id);
    return `<option value="${id}">${ko} 다음</option>`;}).join('');
  const stepOpts=()=>mk(FIRST_NIGHT_ORDER), stepOpts2=()=>mk(OTHER_NIGHT_ORDER);
  el.innerHTML=`
  <div class="card"><h2>커스텀 캐릭터</h2>
  <p class="hint">새 캐릭터를 추가하면 캐릭터 목록·밤 순서·체크리스트·투표 노티스에 자동 통합됩니다.<br>
  ⚠ 커스텀 시트를 새로 짰다면, 시트 전체를 제작자(Claude)에게 보여주고 상호작용·순서 재검증을 받으세요 — 아래 "시트 내보내기"로 JSON을 복사해 전달하면 됩니다.</p>
  <div class="fieldrow"><label>이름(한글)</label><input id="cc-ko" placeholder="예: 마법사"></div>
  <div class="fieldrow"><label>이름(영문)</label><input id="cc-en" placeholder="Wizard"></div>
  <div class="fieldrow"><label>유형</label><select id="cc-type">${Object.entries(TYPE_KO).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
  <div class="fieldrow"><label>능력 설명</label><textarea id="cc-ab" rows="2" placeholder="능력을 사회자 관점에서 정확하게"></textarea></div>
  <div class="fieldrow"><label>첫날 밤</label><div><input type="checkbox" id="cc-first"> 깨움 — 위치: <select id="cc-firstafter">${stepOpts()}</select></div></div>
  <div class="fieldrow"><label>그 외 밤</label><div><input type="checkbox" id="cc-other"> 깨움 — 위치: <select id="cc-otherafter">${stepOpts2()}</select></div></div>
  <div class="fieldrow"><label>투표 관련</label><div><input type="checkbox" id="cc-vote"> <input id="cc-votenote" placeholder="투표 패널에 띄울 노티스" style="width:70%"></div></div>
  <div class="fieldrow"><label>잊지 말 것</label><textarea id="cc-rem" rows="2" placeholder="체크리스트에 넣을 항목 — 줄바꿈으로 구분"></textarea></div>
  <div class="fieldrow"><label>사회자 노트</label><textarea id="cc-warn" rows="2" placeholder="상호작용 주의사항 — 줄바꿈으로 구분"></textarea></div>
  <div class="row"><button class="primary" onclick="addCustom()">추가</button>
  <button onclick="exportScript()">시트 내보내기(JSON)</button>
  <button onclick="importScript()">시트 가져오기</button></div>
  ${S.customs.length?`<h3>등록된 커스텀 (${S.customs.length})</h3><div class="chargrid">${S.customs.map(c=>`
    <div class="charcard">${charCard(c).replace('<div class="charcard">','').replace(/<\/div>$/,'')}
    <button class="small danger ghost" style="margin-top:6px" onclick="delCustom('${c.id}')">삭제</button></div>`).join('')}</div>`:''}
  </div>`;
}
function addCustom(){
  const ko=$('#cc-ko').value.trim(); if(!ko){toast('이름을 입력하세요.','warn');return;}
  const c={ id:'cx_'+uid(), ko, en:$('#cc-en').value.trim(), type:$('#cc-type').value,
    ability:$('#cc-ab').value.trim()||'(능력 미기재)',
    first:$('#cc-first').checked, other:$('#cc-other').checked,
    firstAfter:$('#cc-firstafter').value||null, otherAfter:$('#cc-otherafter').value||null,
    voteRelated:$('#cc-vote').checked, voteNote:$('#cc-votenote').value.trim(),
    reminders:$('#cc-rem').value.split('\n').map(s=>s.trim()).filter(Boolean),
    warn:$('#cc-warn').value.split('\n').map(s=>s.trim()).filter(Boolean),
    custom:true };
  S.customs.push(c); log(`커스텀 캐릭터 추가: ${ko}`); save(); renderAll();
  toast(`${ko} 추가됨. 시트가 새로 완성되면 JSON을 내보내 검증을 요청하세요.`,'ok');
}
function delCustom(id){ S.customs=S.customs.filter(c=>c.id!==id); S.players.forEach(p=>{if(p.charId===id)p.charId='';}); save(); renderAll(); }
function exportScript(){
  const data=JSON.stringify({name:'티르소스 커스텀 시트', base:'trouble-brewing', customs:S.customs}, null, 1);
  navigator.clipboard?.writeText(data).then(()=>toast('시트 JSON 복사됨 — Claude에게 붙여넣어 검증을 요청하세요.','ok'),()=>prompt('복사하세요:',data));
}
function importScript(){
  const raw=prompt('시트 JSON을 붙여넣으세요:'); if(!raw)return;
  try{ const d=JSON.parse(raw); if(Array.isArray(d.customs)){ S.customs=d.customs; save(); renderAll(); toast('가져오기 완료','ok'); } else toast('customs 배열이 없습니다.','warn'); }
  catch(e){ toast('JSON 파싱 실패','warn'); }
}

/* ══════════════════ 초기화 ══════════════════ */
function renderAll(){
  renderTabs(); renderTopbar();
  document.querySelectorAll('.tabpane').forEach(s=>s.classList.remove('active'));
  $('#pane-'+activeTab).classList.add('active');
  ({setup:renderSetup, grim:renderGrim, night:renderNight, day:renderDay, guide:renderGuide, check:renderCheck, custom:renderCustom})[activeTab]();
}
$('#advbtn').onclick=advancePhase;
$('#themebtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?null:'dark';
  if(next) document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
  S.theme=next||'auto'; save();
};
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme',S.theme);
if(S.phase.kind==='night') activeTab='night'; else if(S.phase.kind==='day') activeTab='day';
renderAll();
</script>
