        <button class="gold" onclick="advancePhase()">첫 번째 밤 시작 ›</button>
      </div>
      <p class="hint" style="text-align:center;margin-top:14px">캐릭터 확인하기: 기기를 좌석 순서대로 돌리며 각자 자기 캐릭터를 비공개로 확인합니다.<br>주정뱅이에게는 위장 캐릭터가 표시됩니다.</p>`;
  }
  el.innerHTML=`<div class="card">
    <h2>게임 설정</h2><p class="hint" style="margin-top:-6px">${editionOf().ko}</p>
    ${stepper}${body}</div>`;
}
function startRevealWiz(){
  const scenes=[];
  S.players.forEach(p=>{
    let cid=p.charId;
    if(cid==='drunk' && S.drunkMaskChar) cid=S.drunkMaskChar;
    scenes.push({t:'note', text:`📱 기기를 ${p.name}에게 건네세요. 다른 사람이 화면을 보지 않게 주의!`});
    scenes.push({t:'show-token', char:cid, caption:`${p.name} — 당신의 캐릭터입니다. 확인했으면 탭하고 다음 사람에게 넘기세요.`});
  });
  scenes.push({t:'note', text:'전원 확인 완료. 기기를 사회자에게 돌려주세요.'});
  startCustomWiz('👥 캐릭터 확인', scenes);
}
function charCard(c){
  return `<div class="charcard"><span class="cname">${esc(c.ko)}</span><span class="cen">${esc(c.en||'')}</span>
  <div class="cab">${esc(c.ability)}</div>
  ${(c.warn&&c.warn.length)?`<details class="morebox"><summary>사회자 노트 ${c.warn.length}건</summary><div class="inner"><ul>${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></details>`:''}
  </div>`;
}
/* 직접 입력 폴백 — 등록부가 비어 있을 때 쓰는 즉석 추가. 인자 없이 부르면 #newpname 을 읽는다 */
function addPlayer(name){
  const el=$('#newpname');
  const v=String(name!=null? name : (el? el.value:'')).trim();
  if(!v) return;
  if(S.players.length>=15){toast('최대 15명','warn');return;}
  S.players.push({id:uid(), rosterId:null, name:v, charId:'', alive:true, deadVote:true, statuses:[], notes:'', alignment:null, diedAt:null});
  if(el) el.value='';
  save(); renderAll();
}

/* ══════════════════ 플레이어 등록부(로스터) ══════════════════
   게임마다 이름을 다시 타이핑하지 않도록 사람 단위 명부를 유지한다.
   게임 내 플레이어 객체에 rosterId 를 달아 통계가 사람 단위로 누적된다. */
function rosterList(){ if(!Array.isArray(S.roster)) S.roster=[]; return S.roster; }
function rosterOf(rid){ return rosterList().find(r=>r.id===rid); }
function rosterSeatOf(rid){ return S.players.find(p=>p.rosterId===rid); }
function rosterAdd(){
  const nameEl=$('#rosName'), afEl=$('#rosAffil'), ageEl=$('#rosAge');
  const name=String(nameEl? nameEl.value:'').trim().slice(0,40);
  if(!name){ toast('이름은 필수입니다.','warn'); return; }
  const affil=String(afEl? afEl.value:'').trim().slice(0,40);
  /* 같은 사람을 두 번 등록하면 rosterId 가 갈라져 사람 단위 통계가 두 갈래로 쪼개진다.
     이름+소속이 같으면 막고, 진짜 동명이인은 소속으로 구분하게 안내한다. */
  if(rosterList().some(r=>r.name===name && String(r.affil||'')===affil)){
    toast('이미 등록된 참가자입니다 — 동명이인이면 소속을 다르게 적어 구분하세요.','warn'); return;
  }
  const a=parseInt(ageEl? ageEl.value:'',10);
  rosterList().push({id:uid(), name:name, affil:affil,
    age:Number.isFinite(a)? a : null, createdAt:Date.now()});
  if(nameEl) nameEl.value=''; if(afEl) afEl.value=''; if(ageEl) ageEl.value='';
  save(); renderAll();
}
/* 인라인 편집 — 렌더를 다시 돌리면 포커스가 날아가므로 save() 만 한다 */
function rosterEdit(rid, field, v){
  const r=rosterOf(rid); if(!r) return;
  if(field==='name'){
    const t=String(v).trim(); if(!t) return;          // 이름은 비울 수 없다
    r.name=t.slice(0,40);
    S.players.filter(p=>p.rosterId===rid).forEach(p=>p.name=r.name);
  }
  else if(field==='affil') r.affil=String(v).trim().slice(0,40);
  else if(field==='age'){ const n=parseInt(v,10); r.age=Number.isFinite(n)? n : null; }
  else return;
  save();
}
function rosterDel(rid){
  S.roster=rosterList().filter(r=>r.id!==rid);
  S.players.forEach(p=>{ if(p.rosterId===rid) p.rosterId=null; });   // 진행 중 게임은 유지, 연결만 끊는다
  save(); renderAll();
}
/* 등록부 칩 토글 — 참가자 목록에 넣거나 뺀다. 빈 좌석이 있으면 새로 밀지 않고 그 좌석을 채운다 */
function rosterToggle(rid){
  const r=rosterOf(rid); if(!r) return;
  const seat=rosterSeatOf(rid);
  if(seat){
    /* 진행 중 게임에서는 칩 오탭 한 번에 살아있는 좌석이 통째로 사라진다 — 캐릭터가 배정됐으면 확인받는다 */
    if(S.phase.kind!=='setup' && seat.charId &&
       !confirm(r.name+' 좌석을 게임에서 빼시겠습니까? 캐릭터·상태·기록이 함께 사라집니다.')) return;
    S.players=S.players.filter(p=>p.id!==seat.id); save(); renderAll(); return;
  }
  const empty=S.players.find(p=>!String(p.name||'').trim() && !p.charId && !p.rosterId);
  if(empty){ empty.name=r.name; empty.rosterId=rid; save(); renderAll(); return; }
  if(S.players.length>=15){ toast('최대 15명','warn'); return; }
  S.players.push({id:uid(), rosterId:rid, name:r.name, charId:'', alive:true, deadVote:true,
    statuses:[], notes:'', alignment:null, diedAt:null});
  save(); renderAll();
}
/* 이름·소속은 사용자 입력이므로 전부 esc(). 인라인 onclick 보간 금지 — data-* + 위임 리스너 */
function renderRosterPicker(){
  const list=rosterList();
  const chips = list.length
    ? `<div class="roschips">${list.map(r=>{
        const meta=[r.affil||'', (r.age!=null&&r.age!=='')? r.age+'세':''].filter(Boolean).join(' · ');
        return `<button type="button" class="roschip ${rosterSeatOf(r.id)?'on':''}" data-roschip="${esc(r.id)}">
          <span class="rcname">${esc(r.name)}</span>
          <span class="rcmeta">${esc(meta||'—')}</span>
        </button>`;
      }).join('')}</div>`
    : `<p class="hint">등록된 플레이어가 없습니다 — 아래에서 등록하거나, 좌석에 이름을 직접 입력하세요.</p>`;
  return `<div class="rosbox">
    <div class="secthead"><span class="shicon">👤</span> 등록부에서 참가자 선택</div>
    ${chips}
    <details class="morebox" style="margin-top:10px"><summary>플레이어 등록부 관리 (${list.length}명)</summary><div class="inner">
      <div class="rosform">
        <input id="rosName" placeholder="이름 (필수)" maxlength="40" onkeydown="if(event.key==='Enter')rosterAdd()">
        <input id="rosAffil" placeholder="소속 (선택)" maxlength="40" onkeydown="if(event.key==='Enter')rosterAdd()">
        <input id="rosAge" type="number" min="0" max="120" placeholder="나이" onkeydown="if(event.key==='Enter')rosterAdd()">
        <button class="small primary" data-rosadd="1">등록</button>
      </div>
      ${list.length? `<div>${list.map(r=>`
        <div class="rosrow">
          <input value="${esc(r.name)}" data-rosedit="${esc(r.id)}" data-rosfield="name" placeholder="이름" maxlength="40">
          <input value="${esc(r.affil||'')}" data-rosedit="${esc(r.id)}" data-rosfield="affil" placeholder="소속" maxlength="40">
          <input value="${r.age==null?'':esc(r.age)}" data-rosedit="${esc(r.id)}" data-rosfield="age" type="number" min="0" max="120" placeholder="나이">
          <button class="small danger ghost" data-rosdel="${esc(r.id)}" title="등록 삭제">✕</button>
        </div>`).join('')}</div>`
      : `<p class="hint">이름만 넣어도 됩니다. 소속·나이는 나중에 채울 수 있습니다.</p>`}
    </div></details>
  </div>`;
}
document.addEventListener('click', e=>{
  const t=e.target.closest && e.target.closest('[data-roschip],[data-rosdel],[data-rosadd]');
  if(!t) return;
  if(t.hasAttribute('data-rosadd')) rosterAdd();
  else if(t.hasAttribute('data-rosdel')) rosterDel(t.getAttribute('data-rosdel'));
  else rosterToggle(t.getAttribute('data-roschip'));
});
document.addEventListener('input', e=>{
  const t=e.target.closest && e.target.closest('[data-rosedit]');
  if(!t) return;
  rosterEdit(t.getAttribute('data-rosedit'), t.getAttribute('data-rosfield'), t.value);
});
function removePlayer(pid){ S.players=S.players.filter(p=>p.id!==pid); save(); renderAll(); }
function movePlayer(pid,d){ const i=S.players.findIndex(p=>p.id===pid); const j=i+d; if(j<0||j>=S.players.length)return;
  [S.players[i],S.players[j]]=[S.players[j],S.players[i]]; save(); renderAll(); }
function setChar(pid,cid){ const p=playerOf(pid); p.charId=cid;
  // 주정뱅이 캐릭터 자체가 준 취함만 제거한다 — 사랑꾼·여관 주인·건달·궁정대신이 준 취함은 보존
  p.statuses=(p.statuses||[]).filter(s=>!(s.key==='drunkS' && s.source==='주정뱅이'));
  if(cid==='drunk' && !hasStatus(p,'drunkS')) addStatus(p,'drunkS','주정뱅이',null);
  save(); renderAll(); }
/* 좌석 순서를 무작위로 섞는다 — 캐릭터 배정은 그대로 두고 앉은 자리만 바꾼다.
   이웃 판정(요리사·초공감자·찻집 여인 등)이 좌석 순서에 의존하므로 배정 전에 쓰는 게 안전하다. */
function shuffleSeats(){
  if(S.players.length<2) return;
  if(S.phase.kind!=='setup' && !confirm('게임이 이미 진행 중입니다. 좌석을 섞으면 이웃 기반 판정(요리사·초공감자·찻집 여인 등)이 모두 바뀝니다. 계속할까요?')) return;
  for(let i=S.players.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [S.players[i],S.players[j]]=[S.players[j],S.players[i]];
  }
  log('🔀 자리 섞기 — 좌석 순서 무작위 재배치');
  toast('좌석을 섞었습니다. 이웃 기반 판정이 바뀌었으니 그리모어를 확인하세요.','ok');
  save(); renderAll();
}
/* 캐릭터 배정만 전부 지운다 — 플레이어·좌석은 유지 */
function clearAssign(){
  if(!S.players.some(p=>p.charId)){ toast('배정된 캐릭터가 없습니다.','warn'); return; }
  if(!confirm('모든 플레이어의 캐릭터 배정을 지웁니다. 플레이어와 좌석은 유지됩니다. 계속할까요?')) return;
  S.players.forEach(p=>{ p.charId=''; p.alignment=null;
    p.statuses=(p.statuses||[]).filter(x=>x.key!=='drunkS'&&x.key!=='herring'); });
  S.drunkMaskChar=null; S.redHerringId=null;
  log('배정 전체 비우기');
  save(); renderAll();
}
function setHerring(pid){ S.redHerringId=pid;
  S.players.forEach(p=>p.statuses=(p.statuses||[]).filter(s=>s.key!=='herring'));
  const p=playerOf(pid); if(p) addStatus(p,'herring','점쟁이 셋업',null);
  save(); renderAll(); }
function setDrunkMask(cid){ S.drunkMaskChar=cid; save(); renderAll(); log(`주정뱅이 위장 캐릭터: ${charOf(cid)?.ko||'-'}`); }
function randomAssign(){
  const n=S.players.length; if(n<5) return;
  let baron = S.edition==='tb' && Math.random() < 0.35; // 남작 포함 여부를 먼저 굴린다
  const comp=compFor(n, baron?2:0);
  const pick=(arr,k,exclude)=>{ const pool=arr.filter(c=>!exclude.includes(c.id)); const out=[];
    while(out.length<k && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id); } return out; };
  const pool=editionChars().filter(c=>!c.custom);
  const tf=pool.filter(c=>c.type==='townsfolk'), os=pool.filter(c=>c.type==='outsider'),
        mi=pool.filter(c=>c.type==='minion'), de=pool.filter(c=>c.type==='demon');
  const minions = baron? ['baron'].concat(pick(mi,comp[2]-1,['baron'])) : pick(mi,comp[2],[]);
  if(!baron && minions.includes('baron')){ baron=true; }
  let roles=[].concat(pick(tf,comp[0],[]), pick(os,comp[1],[]), minions, pick(de,comp[3],[]));
  // 셋업 보정 캐릭터(남작·대부·팡 구·비고르모르티스)가 뽑힌 경우 구성 재조정
  const mods=setupMods(roles);
  const delta=mods.delta + (mods.godfather? (Math.random()<0.5?1:-1) : 0); // 대부는 ±1 중 무작위 선택
  if(delta!==0 || mods.godfather){ const c2=compFor(n,delta);
    roles=[].concat(pick(tf,c2[0],[]), pick(os,c2[1],[]), roles.filter(id=>charOf(id).type==='minion'), roles.filter(id=>charOf(id).type==='demon'));
  }
  roles.sort(()=>Math.random()-.5);
  S.players.forEach((p,i)=>{ p.charId=roles[i]||''; p.statuses=[]; if(p.charId==='drunk') addStatus(p,'drunkS','주정뱅이',null); });
  S.redHerringId=null; S.drunkMaskChar=null;
  log('무작위 배정 완료'); save(); renderAll();
}

/* ══════════════════ 시트 탭 (teeroz형 스크립트 페이지) ══════════════════ */
let sheetSort='night'; // night=밤순서순(기본) | abc=가나다순
function sheetCharList(ed){
  const list=allChars().filter(c=>(c.edition||'tb')===ed);

function nightRow(edMeta,id,i,isFirstNight=true){

  if(INFO_STEPS[id]) return `<div class="sheetrow"><div class="ctoken">👥</div><div><span class="sname">${INFO_STEPS[id].ko}</span><span class="sen">7인 이상</span><div class="sab hint">${esc(INFO_STEPS[id].guide[0]||'')}</div></div></div>`;

function revivePlayer(pid){ const p=playerOf(pid); if(!p) return; p.alive=true; log(`${p.name} 소생(수동)`); save(); renderAll(); }
function setDeadVote(pid,v){ const p=playerOf(pid); if(!p) return; p.deadVote=v; log(`${p.name} 투표 토큰 ${v?'복원':'수동 소진'}`); save(); renderAll(); }
function addStatusUI(pid,key){
  const p=playerOf(pid); const ph=S.phase;
  let exp=null, src='사회자 수동';
  if(key==='poison'){ exp={kind:'night', n:(ph.kind==='night'?ph.n:ph.n)+1}; }
  if(key==='protect'){ exp = ph.kind==='night'? {kind:'day', n:ph.n} : {kind:'day', n:ph.n+1}; }  // 낮 부여분은 다음 낮 시작에 해제(그 사이 밤 동안 유효)
  if(key==='master'){ S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='master')); exp={kind:'night', n:ph.n+1}; }
  if(key==='drunkS'){                                   // 취함은 출처별 만료가 다르다 — 정책 선택
    const c=prompt('취함 출처 선택 — 1: 선원/여관 주인/건달/음유시인(다음 황혼까지) · 2: 궁정대신(3밤+3낮) · 3: 영구(주정뱅이·사랑꾼·뱀 조련사)','1');
    if(c===null) return;
    if(c.trim()==='2'){ exp=drunkExpiry('court'); src='궁정대신(3밤+3낮)'; }
    else if(c.trim()==='3'){ exp=null; src='영구'; }
    else { exp=drunkExpiry('dusk'); src='다음 황혼까지'; }
  }
  addStatus(p,key,src,exp); save(); renderAll();
}
function exportGame(){
  const blob=JSON.stringify(S,null,1);
  navigator.clipboard?.writeText(blob).then(()=>toast('게임 상태 JSON을 클립보드에 복사했습니다.','ok'),()=>prompt('복사하세요:',blob));
}

<script>
/* ══════════════════ 밤 진행 탭 ══════════════════ */
function nightSteps(){
  const first = S.phase.n===1;
  const ed = editionOf();
  const baseOrder = first? ed.first : ed.other;
  let order = baseOrder.slice();
  // 커스텀 캐릭터 삽입
  (S.customs||[]).forEach(c=>{
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const after = first? c.firstAfter : c.otherAfter;
    if(!after){ order.unshift(c.id); return; }
    const idx = order.indexOf(after);
    if(idx>=0) order.splice(idx+1,0,c.id); else order.push(c.id);
  });
  // 주정뱅이 위장: 위장 캐릭터가 시트에 없으므로, 그 캐릭터의 원래 순서 위치에 삽입
  const drunkP = S.edition==='tb'? S.players.find(p=>p.charId==='drunk') : null;
  const maskC = S.drunkMaskChar? charOf(S.drunkMaskChar): null;
  const steps=[];
  order.forEach(id=>{
    if(INFO_STEPS[id]){
      if(S.players.length>=INFO_STEPS[id].minPlayers) steps.push({id, info:true});
      return;
    }
    const c=charOf(id); if(!c) return;
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const holders = playersByChar(id);
    const maskHere = drunkP && maskC && maskC.id===id; // 위장 캐릭터가 실제로도 플레이 중일 수 있음
    if(!holders.length && !maskHere) return;
    steps.push({id, holders, mask: maskHere? drunkP : null});
  });
  // 위장 캐릭터가 인플레이가 아닌 경우: 순서표에 없으므로 원 위치에 직접 삽입
  if(drunkP && maskC && !steps.some(s=>s.id===maskC.id)){
    const wakes = first? maskC.first : maskC.other;
    if(wakes){
      const baseIdx = (first?ed.first:ed.other).indexOf(maskC.id);
      let insertAt = steps.length;
      if(baseIdx>=0){
        for(let i=0;i<steps.length;i++){
          const bi=(first?ed.first:ed.other).indexOf(steps[i].id);
          if(bi>baseIdx){ insertAt=i; break; }
        }
      }
      steps.splice(insertAt,0,{id:maskC.id, holders:[], mask:drunkP, maskOnly:true});
    }
  }
  return steps;
}
/* 사망을 계기로 발동하는 역할들. 'night'=그 밤에 죽어야, 'today'=오늘(직전 낮 또는 이 밤) 죽어야 발동 */
const DEATH_TRIGGER_STEPS={ravenkeeper:'night', sage:'night', barber:'today', sweetheart:'today', moonchild:'today'};
function stepSkipReason(st){
  const first=S.phase.n===1;
  if(st.info) return null;
  const c=charOf(st.id);
  const holders=(st.holders||[]).concat(st.mask?[st.mask]:[]);
  const anyAlive = holders.some(p=>p.alive);
  // 구마사제가 이번 밤 봉인한 악마는 단계 자체를 건너뛴다
  if(S.demonBlockedNight===S.phase.n && c?.type==='demon'
     && holders.some(p=>p.id===S.demonBlockedPid)) return '📿 구마사제가 봉인 — 이번 밤 능력 사용 없음';
  const trig=DEATH_TRIGGER_STEPS[st.id];
  if(trig){
    const h=holders[0];
    if(!h) return '해당 캐릭터 없음';
    if(h.alive) return '아직 생존 — 죽는 경우에만 이 시점에 깨움';
    const d=h.diedAt;
    const thisNight = d && d.kind==='night' && d.n===S.phase.n;
    const prevDay    = d && d.kind==='day'   && d.n===S.phase.n-1;
    if(trig==='night' && !thisNight) return '오늘 밤 사망이 아님 — 깨우지 않음';
    if(trig==='today' && !(thisNight||prevDay)) return '오늘 죽지 않음 — 깨우지 않음';
    return null;
  }
  if(!anyAlive){
    if(st.id==='zombuul' && holders.some(p=>hasStatus(p,'fakedead'))) return null; // 죽은 척 — 계속 깨움
    // 비고르모르티스가 죽인 하수인은 죽어도 능력 유지 — 비고르모르티스가 살아있고 정상인 동안 계속 깨움
    if(c?.type==='minion' && holders.some(p=>hasStatus(p,'vigorAbility'))){
      const vg=S.players.find(q=>q.alive && q.charId==='vigormortis');
      if(vg && !isMalfunctioning(vg)) return null;
      return '사망 — 비고르모르티스 부재/오작동으로 능력 유지 정지';
    }
    return '사망 — 깨우지 않음';
  }
  if(st.id==='undertaker' && !S.executedPrevDay && !first) return '어제 낮 처형 없음 — 깨우지 않음';
  if(st.id==='scarletwoman') return null;
  return null;
}
function autoInfoHint(st){
  /* 사회자 친화: 요리사·초공감자 정답 후보 자동 계산 */
  const seats=S.players;
  const evilAt = p => isEvil(p); // 등록 재량 반영 전 '실제' 값
  if(st.id==='chef'){
    let pairs=0;
    for(let i=0;i<seats.length;i++){ if(evilAt(seats[i]) && evilAt(seats[(i+1)%seats.length])) pairs++; }
    return `실제 인접 악 쌍: <b class="num">${pairs}</b> <span class="hint">(첩자·은둔자 등록 재량 반영 전 기준)</span>`;
  }
  if(st.id==='empath'){
    return (st.holders||[]).filter(p=>p.alive).map(p=>{
      const i=seats.indexOf(p); const n=seats.length;
      let L=null,R=null;
      for(let d=1;d<n;d++){ const q=seats[((i-d)%n+n)%n]; if(q.alive&&q!==p){L=q;break;} }
      for(let d=1;d<n;d++){ const q=seats[(i+d)%n]; if(q.alive&&q!==p){R=q;break;} }
      const cnt=(L&&evilAt(L)?1:0)+(R&&evilAt(R)?1:0);
      return `${esc(p.name)}의 생존 이웃: ${L?esc(L.name):'-'} · ${R?esc(R.name):'-'} → 실제 악 수 <b class="num">${cnt}</b> <span class="hint">(등록 재량 반영 전)</span>`;
    }).join('<br>');
  }
  if(st.id==='undertaker' && S.executedPrevDay){
    return `어제 처형: <b>${esc(S.executedPrevDay)}</b>`;
  }
  if(st.id==='fortuneteller' && S.redHerringId){
    const rh=playerOf(S.redHerringId);
    return rh? `🎗 붉은 청어: <b>${esc(rh.name)}</b> — 지목되면 "예"`:'';
  }
  return '';
}
function renderNight(){
  const el=$('#pane-night');
  if(S.phase.kind!=='night'){
    el.innerHTML=`<div class="card"><h2>밤 진행</h2><p class="hint">지금은 ${phaseName()} 단계입니다. 상단의 진행 버튼으로 밤으로 이동하면 이 시트 구성에 맞는 밤 순서가 생성됩니다.</p>
    ${previewNightOrders()}</div>`;
    return;
  }
  const steps=nightSteps();
  const doneMap=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={});
  /* 중독 전용 요약은 파일 하단 '상태 통합 대시보드'(.thy-sb)로 이관했다 — 그쪽 '오작동' 블록이
     중독·취함·주정뱅이를 모두 덮고 만료 시점까지 보여준다. 두 곳에 두면 같은 정보가 두 번 뜬다. */
  el.innerHTML=`
  <div class="card">
    <h2>밤 ${S.phase.n} ${S.phase.n===1?'(첫날 밤)':''}</h2>
    <p class="hint">순서대로 진행하며 완료 체크. 이름을 누르면 진행 가이드가 열립니다. 회색 항목은 오늘 밤 깨우지 않는 캐릭터입니다.</p>
    ${steps.map((st,i)=>renderStep(st,i,doneMap)).join('')}
    <div class="alertbox blue" style="margin-top:12px">🌅 <b>새벽</b> — 모두 깨우고, 오늘 밤의 사망자를 공표하세요(사인은 밝히지 않음). 상단 버튼으로 낮으로 진행하면 보호 토큰이 자동 해제됩니다.</div>
  </div>`;
}
function previewNightOrders(){
  const fmt=(ord,first)=>ord.map(id=>{
    if(INFO_STEPS[id]) return `<li>${INFO_STEPS[id].ko} <span class="hint">(7인 이상)</span></li>`;
    const c=charOf(id); return c?`<li>${esc(c.ko)}</li>`:'';
  }).join('');
  return `<div class="grid2" style="margin-top:10px">
    <div><h3>첫날 밤 순서 (공식)</h3><ol class="guide">${fmt(editionOf().first,true)}</ol></div>
    <div><h3>그 외 밤 순서 (공식)</h3><ol class="guide">${fmt(editionOf().other,false)}</ol></div>
  </div>`;
}
function renderStep(st,i,doneMap){
  const first=S.phase.n===1;
  const done=!!doneMap[st.id];
  const skip=stepSkipReason(st);
  let name, who='', body='';
  if(st.info){
    const inf=INFO_STEPS[st.id];
    name=inf.ko;
    const targets = st.id==='minioninfo' ? S.players.filter(p=>charOf(p.charId)?.type==='minion')
                                         : S.players.filter(p=>charOf(p.charId)?.type==='demon');
    who=targets.map(p=>esc(p.name)).join(', ');
    body=`<ol class="guide">${inf.guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    if(typeof NIGHT_FLOW!=='undefined' && flowFor(st.id)) body=`<div class="row" style="margin:4px 0 10px"><button class="primary" style="min-width:200px" onclick="event.stopPropagation();startWiz('${st.id}')">▶ 인터랙티브 진행</button></div>`+body;
    if(st.id==='demoninfo'){
      const inPlay=new Set(S.players.map(p=>p.charId));
      /* edition:'exp' 는 백과사전 열람 전용이라 어떤 스크립트에도 없다 — 블러프 후보에서 뺀다
         (이 필터는 에디션을 가리지 않으므로, 빼지 않으면 실험적 캐릭터가 그대로 추천된다) */
      const safeBluffs=CHARACTERS.filter(c=>(c.edition||'tb')!=='exp' && (c.type==='townsfolk'||c.type==='outsider') && !inPlay.has(c.id) && c.id!==S.drunkMaskChar).map(c=>c.ko);
      body+=`<div class="alertbox">블러프 후보(미사용 선 캐릭터, 주정뱅이 위장 제외): ${esc(safeBluffs.join(', ')||'없음')}</div>`;
    }
  } else {
    const c=charOf(st.id);
    name=c.ko;
    const holders=(st.holders||[]);
    who = holders.map(p=>{
      let tags='';
      if(!p.alive) tags+=' 💀';
      if(hasStatus(p,'poison')) tags+=' ☠';
      if(p.charId==='drunk'||hasStatus(p,'drunkS')) tags+=' 🍺';
      return esc(p.name)+tags;
    }).join(', ');
    if(st.mask) who += (who?' · ':'')+`🎭 ${esc(st.mask.name)} (주정뱅이 — ${esc(c.ko)} 행세)`;
    const guide = first? (c.guideFirst||c.guideOther) : (c.guideOther||c.guideFirst);
    if(guide) body+=`<ol class="guide">${guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    const hint=autoInfoHint(st);
    if(hint) body+=`<div class="alertbox blue">${hint}</div>`;
    const badHolders=holders.filter(p=>p.alive&&isMalfunctioning(p));
    if(badHolders.length) body+=`<div class="alertbox red">☠ <b>${badHolders.map(p=>esc(p.name)).join(', ')}</b>: 능력 오작동 상태 — 정보형이면 <b>거짓 정보</b>를 주고, 발동형이면 <b>효과 없음</b>으로 처리하되 본인에게는 평소처럼 응대하세요.</div>`;
    if(st.mask) body+=`<div class="alertbox">🎭 주정뱅이입니다 — ${esc(c.ko)}처럼 깨우되 <b>항상 그럴듯한 거짓 정보</b>를 주세요. 어떤 정보를 줬는지 그리모어 메모에 기록!</div>`;
    if(c.warn&&c.warn.length) body+=`<details class="morebox"><summary>상호작용 주의 ${c.warn.length}건</summary><div class="inner"><ul>${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></details>`;
    if(typeof NIGHT_FLOW!=='undefined' && flowFor(st.id)) body+=`<div class="row" style="margin:10px 0 4px"><button class="primary" style="min-width:200px" onclick="event.stopPropagation();startWiz('${st.id}')">▶ 인터랙티브 진행</button></div>`;
    body+=stepWidget(st,c);
    const recTargets=holders.filter(p=>p.alive).concat(st.mask&&st.mask.alive?[st.mask]:[]);
    if(recTargets.length) body+=`<div class="row" style="margin-top:10px">
      <input id="rec-${st.id}" placeholder="오늘 밤 제공한 정보 메모 (예: 2번·5번 중 요리사)" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')recordInfo('${st.id}','${recTargets[0].id}')">
      <button class="small" onclick="recordInfo('${st.id}','${recTargets[0].id}')">📝 기록</button></div>`;
    if(c.conditional) who+=` <span class="pill warn">${esc(c.conditional)}</span>`;
  }
  const cls = done?'done': skip?'skip':'wake';
  return `<div class="step ${cls} ${openStep===st.id?'open':''}" id="step-${st.id}">
    <div class="stephead" onclick="toggleStep('${st.id}')">
      <input type="checkbox" ${done?'checked':''} onclick="event.stopPropagation();toggleDone('${st.id}')" style="accent-color:var(--accent)">
      <span class="stepnum num">${i+1}</span>
      <span class="stepname">${esc(name)}</span>
      <span class="stepwho">${who||''}</span>
      ${skip?`<span class="pill neutral" style="margin-left:auto">${esc(skip)}</span>`:''}
    </div>
    <div class="stepbody">${body}</div>
  </div>`;
}
let openStep=null;
function toggleStep(id){ openStep = openStep===id? null : id; renderAll(); }
function toggleDone(id){ const m=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={}); m[id]=!m[id]; save(); renderAll(); }
function recordInfo(stepId, pid){
  const inp=document.getElementById('rec-'+stepId); const v=(inp&&inp.value||'').trim(); if(!v) return;
  const p=playerOf(pid); if(!p) return;
  p.notes=((p.notes||'')+`\n[밤${S.phase.n}] ${v}`).trim();
  log(`📝 ${p.name} 정보 기록: ${v}`);
  save(); renderAll();
  toast('기록됨 — 그리모어 메모에서 확인할 수 있습니다.','ok');
}

function selPlayers(fnName, filter, label, extraArg){

function stepWidget(st,c){
  if(st.id==='poisoner') return `<h3>☠ 중독 대상 기록</h3>`+selPlayers('doPoison', p=>p.alive, '독살범이 지목한 대상');
  if(st.id==='monk') return `<h3>🛡 보호 대상 기록</h3>`+selPlayers('doProtect', p=>p.alive&&p.charId!=='monk', '수도사가 지목한 대상');
  if(st.id==='butler') return `<h3>🤵 주인 기록</h3>`+selPlayers('doMaster', p=>p.alive&&p.charId!=='butler', '집사가 지목한 주인');
  if(st.id==='imp') return `<h3>🗡 살해 판정</h3><p class="hint">임프가 지목한 대상을 선택하면 보호·군인·시장·중독을 자동 판정합니다.</p>`+selPlayers('doImpKill', p=>true, '임프가 지목한 대상');
  if(st.id==='ravenkeeper') return `<h3>🔮 캐릭터 확인</h3><p class="hint">까마귀지기가 오늘 밤 죽어 지목한 대상 — 실제 캐릭터를 확인하세요(등록 재량 적용 가능).</p>`+selPlayers('doRavenPeek', p=>true, '까마귀지기가 지목한 대상');
  if(st.id==='witch') return `<h3>🧹 저주 대상 기록</h3>`+selPlayers('doCurse', p=>p.alive, '마녀가 지목한 대상');
  if(st.id==='cerenovus') return `<h3>🌀 광기 대상 기록</h3><p class="hint">대상 지정 후, 어떤 캐릭터의 광기인지 그리모어 메모에 적으세요.</p>`+selPlayers('doMad', p=>p.alive, '세레노버스가 지목한 대상');
  if(st.id==='exorcist'){
    const prev=(S.exorcistPrev && S.exorcistPrev.n<S.phase.n)? playerOf(S.exorcistPrev.pid):null;
    const cur=(S.exorcistPrev && S.exorcistPrev.n===S.phase.n)? playerOf(S.exorcistPrev.pid):null;
    return `<h3>📿 구마사제 대상 기록</h3>`
      +(prev?`<div class="alertbox">📿 어제 대상: <b>${esc(prev.name)}</b> — 오늘은 다른 사람을 지목해야 합니다.</div>`:'')
      +(cur?`<div class="alertbox blue">오늘 대상 기록됨: <b>${esc(cur.name)}</b></div>`:'')
      +`<p class="hint">악마를 지목했으면 악마를 깨워 구마사제를 보여주고, 이번 밤 악마 살해 단계를 건너뛰세요.</p>`
      +selPlayers('doExorcist', p=>p.alive, '구마사제가 지목한 대상');
  }
  if(SPENT_ONCE.includes(st.id) && !(c&&c.killer)) return `<h3>✔ 1회성 능력 추적</h3>`+spentWidget(st.id);
  if(c && c.killer && S.edition!=='tb'){ window.__stepKiller=c.id;  // 하위호환(위저드 미사용 경로)
    let extra='';
    if(c.id==='po'){
      extra = S.poCharged
        ? `<div class="alertbox red">⚡ 충전됨 — 이번 밤 3명 지목. 각각 아래에서 살해 기록하세요(살해 기록 시 충전 해제).</div>`
        : `<div class="row" style="margin-top:8px"><button class="small" onclick="doPoCharge()">🦏 이번 밤 지목 안 함(충전)</button></div>`;
    }
    if(SPENT_ONCE.includes(c.id)) extra+=spentWidget(c.id);
    return `<h3>🗡 살해 기록 (${esc(c.ko)})</h3>${extra}<p class="hint">보호·면역(여관 주인·찻집 여인·어릿광대·선원 등)은 위 가이드를 따라 수동 판정 후, 사망만 여기 기록하세요. 시전자 오작동·찻집 여인 이웃은 자동 판정됩니다.</p>`+selPlayers('doStepKill', p=>p.alive, c.ko+'가 지목한 대상', `'${c.id}'`);
  }
  return '';
}
/* 1회성 능력 소진 추적 (어릿광대·악마의 변호사 제외) */
const SPENT_ONCE=['courtier','professor','assassin','seamstress','philosopher','artist','fanggu'];
function spentWidget(cid){
  const holders=playersByChar(cid); if(!holders.length) return '';
  const p=holders.find(q=>!hasStatus(q,'spent'));

}
function doSpend(cid){
  const p=S.players.find(q=>q.charId===cid && !hasStatus(q,'spent'));
  if(!p){ toast('대상이 없거나 이미 소진되었습니다.','warn'); return; }

  toast(`✔ ${p.name}(${charName(p)}) 1회 능력 소진 기록`,'ok');

}
function doPoCharge(){

}
function doExorcist(pid){

  }

    else {
      S.demonBlockedNight=S.phase.n; S.demonBlockedPid=t.id;   // 밤 큐에서 이 악마의 단계를 실제로 건너뛴다
      log(`📿 구마 성공 — 밤 ${S.phase.n} 동안 ${t.name}(${charName(t)})의 능력 단계를 건너뜁니다`);
      toast('😈 악마를 지목했습니다 — 악마를 깨워 구마사제를 보여주세요. 이번 밤 이 악마의 단계는 밤 순서에서 자동으로 건너뜁니다(푸카의 이전 공격에 의한 사망은 그대로 해결).','warn');
    }
  } else {

/* 악마의 변호사: 매일 밤 '전날과 다른' 생존자 1명을 변호 — 내일 처형돼도 죽지 않는다(처형 자체는 성립·소모).
   구마사제(exorcistPrev)와 같은 패턴으로 S.daPrev={pid,n}에 어제 대상을 추적한다.
   밤 n 부여 → 낮 n 처형에 유효 → 밤 n+1 시작(황혼)에 자동 해제. 변호사 오작동이면 불발. */
function doDevilsAdvocate(pid){
  if(!pid)return; const t=playerOf(pid);
  if(S.daPrev && S.daPrev.pid===pid && S.daPrev.n<S.phase.n){
    toast(`⚖️ ${t.name}은(는) 어제의 변호 대상 — 전날과 다른 사람을 지목해야 합니다.`,'warn'); return;
  }
  S.daPrev={pid, n:S.phase.n};
  const da=S.players.find(q=>q.alive&&q.charId==='devilsadvocate');
  if(da && isMalfunctioning(da)){
    toast('악마의 변호사가 오작동 상태 — 보호가 걸리지 않습니다. 기록만 남깁니다.','warn');
    log(`⚖️ 악마의 변호사 오작동: ${t.name} 처형 보호 불발`);
    save(); renderAll(); return;
  }
  // 재지목 시 토큰 '이동': 기존 변호 토큰을 먼저 회수한다 — 한 번에 한 명만 보호(이중 보호·중복 적재 방지)
  S.players.forEach(q=>{ (q.statuses||[]).slice().forEach(s=>{ if(s.key==='execProtect'&&s.source==='악마의 변호사'){ q.statuses.splice(q.statuses.indexOf(s),1); log(`${q.name}: ⚖️처형 보호 해제 — 변호 대상 변경`); } }); });
  addStatus(t,'execProtect','악마의 변호사',{kind:'night', n:S.phase.n+1});
  toast(`⚖️ ${t.name} 처형 보호 — 내일 처형돼도 죽지 않습니다(밤 ${S.phase.n+1} 시작에 자동 해제)`,'ok');
  save(); renderAll();
}
/* 찻집 여인: t가 '정상 작동 중인 생존 찻집 여인'의 살아있는 양옆 이웃이고, 그 이웃 둘 다 선(주민/외지인)이면 보호 */
function teaLadyBlock(t){
  const n=S.players.length;
  for(const tl of S.players){
    if(tl.charId!=='tealady' || !tl.alive || isMalfunctioning(tl)) continue;
    const i=S.players.indexOf(tl);
    let L=null,R=null;
    for(let d=1;d<n;d++){ const q=S.players[((i-d)%n+n)%n]; if(q.alive&&q!==tl){L=q;break;} }
    for(let d=1;d<n;d++){ const q=S.players[(i+d)%n]; if(q.alive&&q!==tl){R=q;break;} }
    if(!L||!R||L===R) continue;
    const good=p=>{const c=charOf(p.charId); return c&&(c.type==='townsfolk'||c.type==='outsider');};
    if(good(L)&&good(R)&&(t===L||t===R)) return tl;
  }
  return null;
}

function drunkExpiry(policy){
  const ph=S.phase;

  if(policy==='dusk')  return {kind:'night', n:base+1};   // 다음 황혼(다음 밤 시작)에 자동 해제
  if(policy==='court') return {kind:'night', n:base+3};   // 3밤+3낮 뒤 황혼에 자동 해제
  return null;                                            // 영구
}

  if(mayor && alivePlayers().length===3) out.push(`🏛 <b>시장</b> 생존 + 생존자 3명 — 오늘 처형 없이 낮이 끝나면 선한 팀 승리!${isMalfunctioning(mayor)?' <mark>현재 오작동 — 승리 조건 무효</mark>':''}`);
  const slayer=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(slayer) out.push(`🏹 <b>처단자(${esc(slayer.name)})</b> 미사용 — 낮 중 공개 지목 가능. 사용 시 아래 버튼으로 판정하세요.`);
  const artist=S.players.find(p=>p.alive&&p.charId==='artist');
  if(artist){
    out.push(hasStatus(artist,'spent')
      ? `🎨 <b>화가(${esc(artist.name)})</b> — 1회 질문 이미 소진됨.`
      : `🎨 <b>화가(${esc(artist.name)})</b> 1회 질문 미사용 — 질문을 받으면 <button class="small" onclick="doSpend('artist')">✔ 소진 기록</button>`);
  }
  const deadHold=S.players.filter(p=>!p.alive&&p.deadVote!==false);
  if(deadHold.length) out.push(`👻 사망 투표 토큰 보유: ${deadHold.map(p=>esc(p.name)).join(', ')} — <b>1차에 거수해야</b> 2차 찬반에 참여할 수 있고, 찬성/반대를 던질 때 토큰이 자동 소진·기록됩니다(기권은 소진 없음).`);
  // 에디션 공통: dayNotice 필드 자동 노출
  allChars().filter(c=>c.dayNotice).forEach(c=>{
    if(playersByChar(c.id).some(p=>p.alive || (c.id==='klutz'||c.id==='sweetheart'||c.id==='barber'))) out.push(esc(c.dayNotice).replace(/&#39;/g,"'"));
  });
  // 커스텀 캐릭터의 투표 관련 노티스
  (S.customs||[]).filter(c=>c.voteRelated).forEach(c=>{
    playersByChar(c.id).filter(p=>p.alive).forEach(p=>out.push(`🔔 <b>${esc(c.ko)}(${esc(p.name)})</b>: ${esc(c.voteNote||c.ability)}`));
  });
  if(nom){
    const nee=playerOf(nom.nominee);
    if(nee){
      if(nee.charId==='saint') out.push(`🚨 지명 대상이 <b>성자</b>입니다 — 처형 확정 전 중독 여부를 반드시 확인!`);
      if(nee.charId==='recluse') out.push(`👤 지명 대상이 <b>은둔자</b> — 처형돼도 게임은 끝나지 않습니다(악마 아님).`);
      if(charOf(nee.charId)?.type==='demon') out.push(`😈 지명 대상이 <b>악마</b> — 처형 시 탕녀 계승·생존자 수(5+) 확인.`);
    }
  }
  return out;
}
function renderDay(){

  if(best){ const topNees=new Set(passed.filter(n=>n.ratio===best.ratio).map(n=>n.nominee)); tie=topNees.size>1; }
  const slayer=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  el.innerHTML=`
  <div class="card"><h2>낮 ${S.phase.n}</h2>

    ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
    ${slayer?`<div class="row" style="margin:6px 0"><button class="small" onclick="doSlayer()">🏹 처단자 공개 지목 판정</button></div>`:''}
  </div>

  <div class="card"><h2>지명</h2>
    ${S.executedToday?'<p class="hint">오늘 처형이 이미 있었습니다 — 추가 지명·투표는 기록용으로만 진행하세요.</p>':''}
    <div class="pickblock">
      <div class="picklab">지명자 <span class="hint">${nomPick.tor?esc(playerOf(nomPick.tor)?.name||''):'선택'}</span></div>
      <div class="pickgrid">${alivePlayers().map(p=>`<button class="pcell ${nomPick.tor===p.id?'sel':''}" onclick="setNomPick('tor','${p.id}')">
        <span class="pcnum num">${S.players.indexOf(p)+1}</span><span class="pcname">${esc(p.name)}</span></button>`).join('')}</div>
      <div class="picklab" style="margin-top:12px">피지명자 <span class="hint">${nomPick.nee?esc(playerOf(nomPick.nee)?.name||''):'선택'}</span></div>

      <div class="bigactions" style="margin-top:14px">
        <button class="gold" onclick="newNomination()" ${(!nomPick.tor||!nomPick.nee)?'disabled':''}>
          ${nomPick.tor&&nomPick.nee?`${esc(playerOf(nomPick.tor)?.name||'')} → ${esc(playerOf(nomPick.nee)?.name||'')} 지명 개시`:'지명 개시'}</button>
      </div>
    </div>
    <p class="hint">재지명 제한 없음 — 같은 사람을 다시 지명해도 됩니다(티르소스 하우스 룰).</p>
  </div>`}
  ${closed.length?`<div class="card"><h2>오늘의 지명 결과</h2>
    ${closed.map(n=>{
      const isBest=best&&n===best&&!tie&&n.result==='pass';
      return `<div class="nomcard ${isBest?'leader':''}">
        <div class="nomtitle">${esc(playerOf(n.nominator)?.name||'?')} → ${esc(playerOf(n.nominee)?.name||'?')}
          ${n.result==='pass'?`<span class="pill ok">찬성 ${n.yes}/${n.den} · ${(n.ratio*100).toFixed(1)}%</span>`:
            n.result==='handsFail'?'<span class="pill warn">거수 미달</span>':'<span class="pill warn">찬성 과반 미달</span>'}
          ${isBest?'<span class="pill demon">처형 후보 1위</span>':''}
        </div>
        ${n.deadVoters&&n.deadVoters.length?`<div class="hint">👻 사망자 투표: ${n.deadVoters.map(id=>esc(playerOf(id)?.name||id)).join(', ')} (토큰 소진 기록됨)</div>`:''}
        ${isBest&&!S.executedToday&&playerOf(n.nominee)?.alive?`<button class="small danger" style="margin-top:6px" onclick="executeNominee('${n.id}')">⚔ ${esc(playerOf(n.nominee)?.name||'')} 처형 확정</button>`:''}
      </div>`;}).join('')}
    ${tie?'<div class="alertbox warn">⚖ 최고 찬성률 동률 — 처형 없음(공식 규칙 준용). 재지명으로 갱신 가능합니다.</div>':''}
  </div>`:''}`;
}
function newNomination(){
  const tor=(typeof nomPick!=='undefined'&&nomPick.tor)||($('#nomtor')&&$('#nomtor').value)||'';
  const nee=(typeof nomPick!=='undefined'&&nomPick.nee)||($('#nomnee')&&$('#nomnee').value)||'';
  if(!tor||!nee){ toast('지명자와 피지명자를 선택하세요.','warn'); return; }
  if(tor===nee){ toast('자기 자신을 지명했습니다 — 공식 규칙상 허용됩니다. 그대로 진행합니다.','warn'); }
  const nom={id:uid(), day:S.phase.n, nominator:tor, nominee:nee, hands:[], stage:1, votes:{}, closed:false, deadVoters:[]};
  S.noms.push(nom);
  if(typeof nomPick!=='undefined'){ nomPick.tor=null; nomPick.nee=null; }
  log(`지명: ${playerOf(tor).name} → ${playerOf(nee).name}`);
  const torP0=playerOf(tor);
  if(hasStatus(torP0,'curse')){
    const witch=S.players.find(p=>p.alive&&p.charId==='witch');
    if(witch && !isMalfunctioning(witch) && alivePlayers().length>=4){
      if(confirm(`🧹 마녀의 저주 발동! 지명자 ${torP0.name}은(는) 저주받은 상태입니다.\n즉시 사망 처리할까요? (지명 절차는 그대로 진행됩니다)`)){
        killPlayer(torP0,'마녀의 저주 — 지명 즉시 사망');
      }
    } else { toast('저주 토큰이 있으나 마녀가 죽었거나 오작동, 또는 생존 3인 — 저주 불발.','warn'); }
  }
  // 성결자 체크
  const neeP=playerOf(nee), torP=playerOf(tor);
  if(neeP.charId==='virgin' && !hasStatus(neeP,'virginUsed')){
    addStatus(neeP,'virginUsed','최초 지명 발생',null);
    const torC=charOf(torP.charId);
    const torIsTF = torC && torC.type==='townsfolk' && torP.charId!=='drunk';
    if(isMalfunctioning(neeP)){
      toast('⚜ 성결자 최초 지명 — 그러나 성결자가 오작동 상태: 발동하지 않습니다. 능력은 소진됩니다.','warn');
    } else if(torIsTF){
      if(confirm(`⚜ 성결자 발동! 지명자 ${torP.name}(${torC.ko})는 마을 주민입니다.\n즉시 처형 처리할까요? (오늘의 처형으로 기록되며, 이 지명은 종료됩니다)`)){
        resolveExecution(torP,'성결자 발동 — 즉시 처형');
        S.executedToday=`${torP.name} (${charName(torP)}) — 성결자 발동`;
        nom.closed=true; nom.result='virginTriggered';
        toast('오늘은 추가 처형이 불가합니다. 장의사는 처형으로 실제 죽은 경우에만 그 캐릭터를 봅니다.','warn');
      }
    } else if(torP.charId==='spy'){
      toast('⚜ 성결자 최초 지명 — 지명자가 첩자입니다. "마을 주민으로 등록"시켜 발동시킬지 재량으로 결정하세요. 발동시키려면 그리모어에서 수동 처형 처리.','warn');
    } else {
      toast(`성결자 최초 지명 — 지명자 ${torP.name}는 마을 주민이 아니므로 발동하지 않습니다. 능력은 소진되었습니다.`,'warn');
    }
  }
  save(); renderAll();
}
/* ── 투표 대상 집합의 단일 정의 ─────────────────────────────────────────────
   분모를 화면용(renderNomOpen)과 확정용(closeBallot) 두 곳에 따로 적어 두었다가
   서로 어긋난 이력이 있다. 아래 두 헬퍼가 유일한 정의이며 renderNomOpen /
   closeBallot / 토큰 소진 안내 래퍼가 전부 이것만 쓴다.
   반환 순서는 S.players 순서(=자리 순서)로 통일한다 — 화면 목록과 확정 집계가
   같은 배열이어야 분자·분모가 갈라질 여지가 없다.

   [1차 거수 대상 handEligible] 생존자 + 투표 토큰 보유 사망자.
     사망자도 손을 들 수 있어야 2차 찬반에 참여할 수 있다(하우스 룰 7-B).
     ★ 토큰 소진 시점 = 2차에서 실제로 찬성/반대를 던질 때(castVote).
       거수만 하고 2차에서 기권하면 토큰은 남는다. 거수 자체는 토큰을 쓰지 않는다.
     이미 hands 에 들어 있는 사람은 토큰이 없어도 포함한다 — 그래야 잘못 올린 손을
     다시 내릴 수 있고, 취소·복원 경로에서 행이 사라지지 않는다.

   [1차 통과 기준] 분모·기준은 생존자 과반 그대로(요구 A). 분자는 거수 전원으로
     사망자 거수도 포함한다 — 공식 규칙도 사망자 표를 '생존자 기준' 문턱의 분자에
     넣는다. 그래서 closeHands() 의 n.hands.length 판정은 손대지 않는다.

   [2차 찬반 대상 ballotEligible] 생존자 ∪ 1차 거수자(사망자 포함).
     거수하지 않은 토큰 보유 사망자는 분모에서 제외된다.
     votes 에 이미 기록이 있는 사람은 방어적으로 포함한다 — 구버전 저장본이나
     stage 되돌림으로 표만 남은 경우 분모에서 빠지면 분자(yes 를 이 집합에서 센다)
     에서도 조용히 사라져 집계가 어긋난다. */
function handEligible(nom){
  const hands=Array.isArray(nom&&nom.hands)? nom.hands : [];
  return S.players.filter(p=> p.alive || p.deadVote!==false || hands.includes(p.id));
}
function ballotEligible(nom){
  const hands=Array.isArray(nom&&nom.hands)? nom.hands : [];
  const votes=(nom&&nom.votes)||{};
  return S.players.filter(p=> p.alive || hands.includes(p.id) || votes[p.id]!==undefined);
}
function renderNomOpen(nom){
  const alive=alivePlayers();
  const den1=alive.length, need1=majority(den1), num1=nom.hands.length;
  const handRows=handEligible(nom);
  const deadHands=nom.hands.filter(id=>{ const q=playerOf(id); return q && !q.alive; }).length;
  const torN=esc(playerOf(nom.nominator)?.name||'?'), neeN=esc(playerOf(nom.nominee)?.name||'?');
  const notices=voteNotices(nom).filter(x=>x.includes('집사')||x.includes('성자')||x.includes('악마')||x.includes('은둔자'));
  if(nom.stage===1){
    return `<div class="card"><h2>진행 중 지명: ${torN} → ${neeN}</h2>
      ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
      <h3>1단계 · 거수 투표 (생존자 + 투표 토큰 보유 사망자)</h3>
      <div class="votemath">
        <div class="vmbox"><div class="vlab">거수(분자)${deadHands?` <span style="text-transform:none;letter-spacing:0">생존 ${num1-deadHands}·사망 ${deadHands}</span>`:''}</div><div class="vval">${num1}</div></div>
        <div class="vmbox"><div class="vlab">생존자(분모)</div><div class="vval">${den1}</div></div>
        <div class="vmbox ${num1>=need1?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need1}</div></div>
      </div>
      <div>${handRows.map(p=>{
        const on=nom.hands.includes(p.id);
        const isDead=!p.alive;
        const butlerFlag = p.charId==='butler' && !isMalfunctioning(p);
        const master=S.players.find(q=>hasStatus(q,'master'));
        const masterUp = master && nom.hands.includes(master.id);
        return `<div class="voterow ${isDead?'deadrow':''}"><span class="vname">${esc(p.name)}${isDead?' 👻':''}</span>
          <button class="vbtn ${on?'sel-yes':''}" onclick="toggleHand('${nom.id}','${p.id}')">${on?'✋ 거수':'거수'}</button>
          ${isDead?'<span class="hint">👻 거수해야 2차 찬반에 참여할 수 있습니다 — 토큰은 2차에서 찬성/반대를 던질 때 소진</span>':''}
          ${butlerFlag?`<span class="hint">🤵 집사 — 주인(${master?esc(master.name):'미지정'})이 거수해야 유효${on&&!masterUp?' <mark>⚠ 지금 주인 미거수!</mark>':''}</span>`:''}
        </div>`;}).join('')}</div>
      <div class="row" style="margin-top:10px">
        <button class="primary" onclick="closeHands('${nom.id}')">${num1>=need1?'✅ 과반 달성 — 찬반 투표로':'거수 마감 (미달 → 부결)'}</button>
        <button class="ghost danger" onclick="cancelNom('${nom.id}')">지명 취소</button>
      </div></div>`;
  }
  /* 2단계 찬반 — 분모는 ballotEligible() 하나만 쓴다(closeBallot 과 같은 집합·같은 순서).
     생존자 ∪ 1차 거수자(사망자 포함). 거수 안 한 토큰 보유 사망자는 여기서 빠진다. */
  const eligible=ballotEligible(nom);
  const den2=eligible.length, need2=majority(den2);
  const yes=eligible.filter(p=>nom.votes[p.id]==='yes').length;
  const no=eligible.filter(p=>nom.votes[p.id]==='no').length;
  const ratio=den2?yes/den2:0;
  const master=S.players.find(q=>hasStatus(q,'master'));
  return `<div class="card"><h2>진행 중 지명: ${torN} → ${neeN}</h2>
    ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
    <h3>2단계 · 찬반 투표 (생존자 전원 + 1차에 거수한 사망자)</h3>
    ${(()=>{const i=S.players.findIndex(p=>p.id===nom.nominee); if(i<0) return '';
      const ord=[]; const n=S.players.length;
      for(let d=1;d<=n;d++){ ord.push(S.players[(i+d)%n]); }
      return `<div class="callorder">🔔 호명 순서(피지명자 왼쪽부터 시계 방향): ${ord.map(p=>`<span class="co ${p.alive?'':'dead'}">${esc(p.name)}</span>`).join('<span style="color:var(--muted)">→</span>')}</div>`;})()}
    <div class="votemath">
      <div class="vmbox"><div class="vlab">찬성(분자)</div><div class="vval" style="color:var(--ok)">${yes}</div></div>
      <div class="vmbox"><div class="vlab">반대</div><div class="vval" style="color:var(--evil)">${no}</div></div>
      <div class="vmbox"><div class="vlab">투표권(분모)</div><div class="vval">${den2}</div></div>
      <div class="vmbox ${yes>=need2?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need2}</div></div>
      <div class="vmbox ${yes>=need2?'pass':'fail'}"><div class="vlab">찬성률</div><div class="vval">${(ratio*100).toFixed(1)}%</div></div>
    </div>
    <div>${eligible.map(p=>{
      const v=nom.votes[p.id];
      const isDead=!p.alive;
      const butlerFlag = p.alive && p.charId==='butler' && !isMalfunctioning(p);
      const masterYes = master && nom.votes[master.id]==='yes';
      return `<div class="voterow ${isDead?'deadrow':''}">
        <span class="vname">${esc(p.name)}${isDead?' 👻':''}</span>
        <button class="vbtn ${v==='yes'?'sel-yes':''}" onclick="castVote('${nom.id}','${p.id}','yes')">찬성</button>
        <button class="vbtn ${v==='no'?'sel-no':''}" onclick="castVote('${nom.id}','${p.id}','no')">반대</button>
        <button class="vbtn ${v==='abs'?'sel-abs':''}" onclick="castVote('${nom.id}','${p.id}','abs')">기권</button>
        ${isDead?`<span class="hint">${p.deadVote===false?'⚠ 토큰 이미 소진 — 기권만 가능':'토큰 1회 — 찬성/반대 시 소진'}</span>`:''}
        ${butlerFlag?`<span class="hint">🤵 주인(${master?esc(master.name):'미지정'})이 찬성해야 유효${v==='yes'&&!masterYes?' <mark>⚠ 주인 미찬성!</mark>':''}</span>`:''}
      </div>`;}).join('')}</div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="closeBallot('${nom.id}')">찬반 마감</button>
      <button class="ghost danger" onclick="cancelNom('${nom.id}')">지명 취소</button>
    </div></div>`;
}
function findNom(id){ return S.noms.find(n=>n.id===id); }
function toggleHand(nid,pid){ const n=findNom(nid); const i=n.hands.indexOf(pid);
  if(i>=0)n.hands.splice(i,1); else n.hands.push(pid); save(); renderAll(); }
function closeHands(nid){ const n=findNom(nid); const den=alivePlayers().length, need=majority(den);
  if(n.hands.length>=need){ n.stage=2; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 통과, 찬반 투표로`); }
  else { n.closed=true; n.result='handsFail'; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 미달, 부결`); }
  save(); renderAll(); }
function castVote(nid,pid,v){
  const n=findNom(nid); const p=playerOf(pid);
  const prev=n.votes[pid];
  if(!p.alive){
    if(prev===v){ delete n.votes[pid]; if(v!=='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.id); log(`${p.name} 사망 투표 취소 — 토큰 복원`);} save(); renderAll(); return; }
    if((v==='yes'||v==='no') && !(prev==='yes'||prev==='no')){
      if(p.deadVote===false){ toast(`${p.name}은(는) 이미 투표 토큰을 소진했습니다.`,'warn'); return; }
      p.deadVote=false; if(!n.deadVoters.includes(p.id)) n.deadVoters.push(p.id);
      log(`👻 ${p.name} 사망 투표 참여(${v==='yes'?'찬성':'반대'}) — 토큰 자동 소진`);
    }
    if((prev==='yes'||prev==='no') && v==='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.id); log(`${p.name} 기권으로 변경 — 토큰 복원`); }
    n.votes[pid]=v; save(); renderAll(); return;
  }
  n.votes[pid] = prev===v? undefined : v;
  if(n.votes[pid]===undefined) delete n.votes[pid];
  save(); renderAll();
}
function closeBallot(nid){
  const n=findNom(nid);
  /* 분모는 화면(renderNomOpen)과 반드시 같아야 한다 — 같은 헬퍼 하나만 쓴다.
     생존자 ∪ 1차 거수자(사망자 포함). 거수 안 한 토큰 보유 사망자는 제외. */
  const uniq=ballotEligible(n);
  const den=uniq.length, need=majority(den);
  let yes=uniq.filter(p=>n.votes[p.id]==='yes').length;
  // 집사 무효표: 주인이 '찬성'하지 않았으면 집사의 찬성을 집계에서 뺀다
  // (공식: "주인이 투표할 때만 집사도 투표 가능" — 오작동 집사는 자유 투표라 제외)
  const butler=uniq.find(p=>p.alive && p.charId==='butler' && !isMalfunctioning(p));
  if(butler && n.votes[butler.id]==='yes'){
    const master=S.players.find(q=>hasStatus(q,'master'));
    if(!master || n.votes[master.id]!=='yes'){
      yes--; n.butlerVoided=butler.id;
      log(`🤵 집사(${butler.name}) 찬성 무효 — 주인${master?`(${master.name}) 미찬성`:' 미지정'} · 집계에서 제외`);
      toast(`집사 ${butler.name}의 찬성은 주인이 찬성하지 않아 무효 처리했습니다.`,'warn');
    }
  }
  n.yes=yes; n.den=den; n.need=need; n.ratio=den?yes/den:0;
  n.closed=true; n.result = yes>=need? 'pass':'yesFail';
  log(`찬반 마감: ${playerOf(n.nominee).name} — 찬성 ${yes}/${den} (기준 ${need}, ${(n.ratio*100).toFixed(1)}%) → ${n.result==='pass'?'과반 통과':'부결'}`);
  save(); renderAll();
}
function cancelNom(nid){
  const n=findNom(nid);
  // 취소된 지명의 투표는 없었던 일 — 소진된 사망 투표 토큰을 복원해야 한다
  if(n && (n.deadVoters||[]).length){
    n.deadVoters.forEach(id=>{ const p=playerOf(id); if(p) p.deadVote=true; });
    log(`👻 지명 취소 — 사망 투표 토큰 복원: ${n.deadVoters.map(id=>playerOf(id)?.name||id).join(', ')}`);
  }
  S.noms=S.noms.filter(x=>x.id!==nid); log('지명 취소'); save(); renderAll(); }
/* 처형은 사망과 별개다. 보호로 살아남아도 '오늘 처형은 있었다'가 성립하고(보르톡스·시장 판정),
   장의사는 '처형으로 실제 죽은' 캐릭터만 본다. 일반 처형·성결자 발동이 이 함수를 공유한다. */
function resolveExecution(p, cause){
  const before=p.alive;
  S.executedToday=`${p.name} (${charName(p)})`; S.executedTodayPid=p.id; S.executedDiedToday=null;
  const blk=deathBlockReason(p,{sourceType:'execution'});
  if(blk){
    log(`⚔ ${p.name} 처형 — ${blk}로 사망하지 않음 (오늘의 처형은 소모)`);
    toast(`⚔ ${p.name} 처형 — ${blk}이므로 죽지 않았습니다. 오늘의 처형은 사용되었고(추가 처형 불가), 장의사에게는 아무 캐릭터도 보여주지 마세요.`,'warn');
    save(); renderAll(); return false;
  }
  killPlayer(p, cause);
  const died = before && !p.alive;                  // 어릿광대 1회 생존 등으로 버틴 경우 제외
  S.executedDiedToday = died? `${p.name} (${charName(p)})` : null;
  if(!died) toast(`⚔ ${p.name} 처형 — 그러나 죽지 않았습니다. 오늘의 처형은 사용되었고, 장의사에게는 아무 캐릭터도 보여주지 마세요.`,'warn');
  else toast(`${p.name} 처형. 오늘 밤 장의사에게 보여줄 캐릭터: ${charName(p)} (첩자/은둔자/주정뱅이면 등록 재량)`,'ok');
  save(); renderAll(); return died;
}
function executeNominee(nid){
  const n=findNom(nid); const p=playerOf(n.nominee);
  const saintCheck = p.charId==='saint' && !isMalfunctioning(p);
  if(saintCheck && !confirm(`🚨 ${p.name}은(는) 성자이며 오작동 상태가 아닙니다!\n처형을 확정하면 선한 팀이 패배합니다. 진행할까요?`)) return;
  resolveExecution(p, `처형 (찬성 ${n.yes}/${n.den}, ${(n.ratio*100).toFixed(1)}%)`);
  if(saintCheck){ toast('✝ 성자가 처형되었습니다 — 악한 팀 승리!','warn'); log('성자 처형 — 악 승리'); }
}
function doSlayer(){
  const sl=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(!sl) return;
  const name=prompt('처단자가 지목한 플레이어 이름:'); const t=S.players.find(p=>p.name===name);
  if(!t){ toast('플레이어를 찾지 못했습니다.','warn'); return; }
  addStatus(sl,'slayerUsed','공개 지목',null);
  if(isMalfunctioning(sl)){ toast('처단자가 오작동 상태 — "아무 일도 일어나지 않습니다"라고 공표. 능력 소진.','warn'); log(`처단자 오발(오작동): ${t.name}`); save(); renderAll(); return; }
  const c=charOf(t.charId);
  if(c?.type==='demon' && t.alive){ killPlayer(t,'처단자의 일격'); toast(`😈 ${t.name}(악마) 즉사! 탕녀·생존자 수를 확인하세요.`,'warn'); }
  else if(t.charId==='recluse' && t.alive){
    if(confirm(`${t.name}은(는) 은둔자 — 악마로 등록시켜 죽일까요? (재량)`)){ killPlayer(t,'처단자의 일격(은둔자 악마 등록)'); toast('은둔자가 쓰러졌습니다 — 게임은 끝나지 않습니다. 태연하게!','warn'); }
    else { toast('"아무 일도 일어나지 않습니다" 공표.','ok'); log(`처단자 → 은둔자 ${t.name}: 미등록 처리`); }
  }
  else { toast('"아무 일도 일어나지 않습니다"라고 공표하세요.','ok'); log(`처단자 오발: ${t.name}`); }
  save(); renderAll();
}
</script>

<script>

const EFFECT_GUIDES = {

  status: {ko:'상태 부여형', steps:['시전자 오작동? → 부여 불발','지속 기간을 명확히: 이 밤만? 다음 낮까지? 영구? → 그리모어 토큰의 자동 해제 시점 지정','겹치는 상태(중독+보호 등)의 우선순위를 지금 정해두고 메모']},

    </div>

/* ══════════════ 재량 응대 도우미 확장 — 자유 텍스트 해석(요구 8) ══════════════
   외부 호출 없이 규칙 기반 결정 트리로 5개 신호(대상 규모·효과 유형·가역성·균형
   크기·공개성)를 뽑고, 현재 판 상태(생존/오작동/처형 예산/승리 근접도)와 함께
   EFFECT_GUIDES·DISCRETION_PRINCIPLES 를 조합해 구체적인 응대 절차를 만든다.
   genDiscretion 본문은 건드리지 않고 IIFE 로 감싸 결과 아래에 덧붙인다(반환값 보존). */
const DG_NUM_KO = {'한':1,'하나':1,'두':2,'둘':2,'세':3,'셋':3,'네':4,'넷':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10};
const DG_LEX = {
  info:['정보','알려','알고','알게','확인','보여','물어','묻','조회','진영','캐릭터','누가','누구','힌트','점쳐','점을','엿','읽','진실','들여다'],
  kill:['죽','살해','제거','목숨','사망','시체','부활','되살','살려','처형','찌르','공격','없애'],
  status:['중독','독을','취하','술취','보호','면역','상태','미치','저주','봉인','무력','침묵','막아','걸리게','씌우','지켜'],
  rule:['규칙','승리','패배','조건','투표','지명','표를','한 표','소원','바꾸','교환','변경','추가','한 번 더','되돌','시간을','부활시','예외']
};
function dgType(t){
  const sc={}; let best='rule', bestN=-1;
  ['kill','rule','status','info'].forEach(k=>{
    sc[k]=DG_LEX[k].reduce((n,w)=>n+(t.indexOf(w)>=0?1:0),0);
    if(sc[k]>bestN){ bestN=sc[k]; best=k; }
  });
  return {primary: bestN>0? best : null, scores: sc};
}
function dgScope(t){
  if(/전원|모두|모든|전체|일괄|다 함께/.test(t)) return {n:'all', ko:'전원'};
  let m=t.match(/(\d+)\s*(명|인|사람)/);
  if(m) return {n:+m[1], ko:m[1]+'명'};
  m=t.match(/(하나|한|둘|두|셋|세|넷|네|다섯|여섯|일곱|여덟|아홉|열)\s*(명|사람)/);
  if(m&&DG_NUM_KO[m[1]]) return {n:DG_NUM_KO[m[1]], ko:DG_NUM_KO[m[1]]+'명'};
  if(/이웃|양옆|옆사람/.test(t)) return {n:2, ko:'이웃 2명'};
  if(/자신|본인|스스로|자기/.test(t)) return {n:1, ko:'자신 1명'};
  return {n:1, ko:'1명(명시 없음 — 기본 가정)'};
}
function dgRevert(t,type){
  if(/영구|영원|게임 내내|끝까지|되돌릴 수 없|영영/.test(t)) return {ok:false, ko:'비가역 — 영구 효과로 명시됨'};
  if(/오늘 밤|이 밤|이번 밤|오늘 낮|하루|다음 낮까지|한 번만|일시|잠깐|잠시/.test(t)) return {ok:true, ko:'가역 — 기간이 명시됨'};
  if(type==='kill') return {ok:false, ko:'비가역 — 사망·부활은 되돌릴 수 없다'};
  if(type==='rule') return {ok:false, ko:'사실상 비가역 — 한 번 내린 해석은 판 내내 유지된다'};
  return {ok:true, ko:'기간을 지금 정하면 가역'};
}
function dgMag(t,type,scope){
  let m={info:1,status:2,kill:3,rule:3}[type]||2;
  if(scope.n==='all') m+=2; else if(typeof scope.n==='number'&&scope.n>=3) m+=1;
  if(/승리|패배|게임 끝|게임 종료|이긴다|진다|끝내/.test(t)) m+=2;
  if(/악마|데몬/.test(t)) m+=1;
  if(/부활|되살|살려|시체/.test(t)) m+=1;
  if(/살짝|약간|작은|소소|힌트만|조금/.test(t)) m-=1;
  return Math.max(1,Math.min(5,m));
}
function dgVis(t){
  if(/공개|공표|발표|모두에게|전체에게|광장|선언|다 같이 듣/.test(t)) return {pub:true, ko:'공개 — 다른 플레이어에게 드러난다'};
  if(/비밀|몰래|조용|아무도 모르게|밤에만|은밀|귓속/.test(t)) return {pub:false, ko:'비밀 — 본인만 안다'};
  return {pub:null, ko:'미정 — 지금 정해야 한다'};
}
function dgSnapshot(){
  const al=alivePlayers(), alive=al.length;
  const mal=al.filter(isMalfunctioning).length;
  const evil=al.filter(isEvil).length, good=alive-evil;
  const demon=al.filter(p=>{ const c=charOf(p.charId); return !!c && c.type==='demon'; }).length;
  const budget=Math.max(0, alive-3);
  const days=Math.max(0, Math.ceil((alive-2)/2));
  let near='균형 — 어느 쪽으로도 기울지 않음';
  if(!S.players.length) near='플레이어 미등록 — 상태 반영 없음';
  else if(alive===0) near='생존자 0 — 판 종료 상태';
  else if(demon===0) near='악마 생존 0 — 선 승리 판정을 먼저 확인하라';
  else if(alive<=3) near='생존 3명 이하 — 악 승리 1수 앞. 처형 하나가 판을 끝낸다';
  else if(evil*2>=alive) near='악 우세 — 균형 원칙상 선 쪽에 유리한 재량을 검토';
  else if(good>=evil*3) near='선 우세 — 정보를 흐리거나 대가를 키우는 재량을 검토';
  return {alive, mal, evil, good, demon, budget, days, near, total:S.players.length};
}

/* ══════════════════ 체크리스트 탭 (시트별 잊지 말 것) ══════════════════ */
function buildChecklist(){
  const items=[]; const add=(group,src,txt)=>items.push({group,src,txt,key:group+'|'+src+'|'+txt});
  const inPlay=id=>S.players.some(p=>p.charId===id);
  // 셋업
  if(inPlay('baron')) add('셋업','남작','구성 변경 적용 확인: 마을 주민 −2 / 외지인 +2');
  if(inPlay('drunk')) add('셋업','주정뱅이',`위장 캐릭터 지정(현재: ${S.drunkMaskChar?charOf(S.drunkMaskChar).ko:'⚠ 미지정'}) — 본인에게는 그 주민 토큰을 보여줄 것`);
  if(inPlay('fortuneteller')) add('셋업','점쟁이',`붉은 청어 지정(현재: ${S.redHerringId?playerOf(S.redHerringId)?.name:'⚠ 미지정'}) — 게임 내내 유지`);
  add('셋업','공통','7인 이상이면 첫날 밤 하수인 정보 → 악마 정보(블러프 3개) 순서 진행');
  // 매일 밤
  if(inPlay('poisoner')) add('매일 밤','독살범','새 중독 대상 기록 — 이전 독은 황혼에 자동 해제되었는지 확인');
  if(inPlay('monk')) add('매일 밤','수도사','보호 대상 갱신 — 보호는 그 밤만, 새벽 자동 해제');
  if(inPlay('butler')) add('매일 밤','집사','주인 갱신 — 다음 날 투표 제한에 직결');
  if(inPlay('empath')) add('매일 밤','초공감자','이웃 사망 시 "살아있는 이웃" 재계산');
  if(inPlay('undertaker')) add('매일 밤','장의사','어제 처형이 있었을 때만 깨움 — 성결자 발동 처형 포함');
  if(inPlay('spy')) add('매일 밤','첩자','밤 순서 맨 끝에 그리모어 공개 — 충분한 시간');
  if(inPlay('drunk')) add('매일 밤','주정뱅이','위장 캐릭터 순서에 깨워 일관된 거짓 정보 — 지난 밤에 준 정보 메모 확인');
  // 낮·투표
  if(inPlay('virgin')) add('낮·투표','성결자','최초 지명 시 발동 판정 — 지명자가 주민인지, 성결자가 중독인지');
  if(inPlay('saint')) add('낮·투표','성자','처형 확정 전 중독 여부 확인 — 정상이면 선 패배');
  if(inPlay('butler')) add('낮·투표','집사','주인이 거수/찬성했는지 매 투표 확인');
  if(inPlay('slayer')) add('낮·투표','처단자','공개 지목 시 즉시 판정 — 오작동/은둔자 등록 재량, 성공·실패 무관 소진');
  if(inPlay('mayor')) add('낮·투표','시장','생존 3명이 되면: 처형 없이 낮 종료 = 선 승리(오작동 확인)');
  if(inPlay('scarletwoman')) add('낮·투표','탕녀','악마 사망 시 생존자 5+ 확인 → 계승, 게임 계속. 그녀가 중독이면 계승 불발!');
  if(inPlay('recluse')) add('낮·투표','은둔자','정보·처단자·처형 판정마다 악 등록 여부를 의식적으로 결정');
  if(inPlay('imp')) add('낮·투표','임프','임프 처형·사망 시: 탕녀 → 없으면 게임 종료 선언');
  if(inPlay('soldier')) add('참고','군인','임프 공격 무효 — 단 중독 밤엔 죽는다');
  if(inPlay('ravenkeeper')) add('참고','까마귀지기','밤 사망 시 즉시 발동 — 잊기 쉬움! 임프 살해 판정 직후 확인');
  // 에디션 공통: 인플레이 캐릭터의 remind·setupNote 자동 편입
  editionChars().filter(c=>!c.custom && (c.edition||'tb')!=='tb').forEach(c=>{
    if(!S.players.some(p=>p.charId===c.id)) return;
    if(c.setupNote) add('셋업', c.ko, c.setupNote);
    (c.remind||[]).forEach(r=>add('매일 밤', c.ko, r));
    if(c.dayNotice) add('낮·투표', c.ko, c.dayNotice.replace(/^[^ ]+ /,''));
  });
  // 커스텀
  (S.customs||[]).forEach(c=>{
    if(S.players.some(p=>p.charId===c.id)){
      (c.reminders||[]).forEach(r=>add('커스텀',c.ko,r));
      if(!(c.reminders||[]).length) add('커스텀',c.ko,'커스텀 캐릭터 — 상호작용 검증 필요(제작자에게 시트 검토 요청)');
    }
  });
  return items;
}

function delCustom(id){ S.customs=S.customs.filter(c=>c.id!==id); S.players.forEach(p=>{if(p.charId===id)p.charId='';}); save(); renderAll(); }
function exportScript(){

  navigator.clipboard?.writeText(data).then(()=>toast('시트 JSON 복사됨 — Claude에게 붙여넣어 검증을 요청하세요.','ok'),()=>prompt('복사하세요:',data));

/* 가져온 시트는 신뢰할 수 없다 — 스키마·타입·길이를 검증하고 id 를 안전한 형태로 재발급한다. */
function importScript(){
  const raw=prompt('시트 JSON을 붙여넣으세요:'); if(!raw)return;
  let d; try{ d=JSON.parse(raw); }catch(e){ toast('JSON 파싱 실패','warn'); return; }
  if(!d || !Array.isArray(d.customs)){ toast('customs 배열이 없습니다.','warn'); return; }
  const str=v=>typeof v==='string'? v.slice(0,400):'';
  const arr=v=>Array.isArray(v)? v.filter(x=>typeof x==='string').map(x=>x.slice(0,400)).slice(0,20):[];
  const TYPES=['townsfolk','outsider','minion','demon','traveler','fabled'];
  const seen=new Set();
  S.customs=d.customs.slice(0,60).filter(c=>c&&typeof c==='object').map(c=>{
    let id=(typeof c.id==='string' && /^[A-Za-z0-9_-]{1,64}$/.test(c.id))? c.id : 'cx_'+uid();
    if(seen.has(id)) id='cx_'+uid();
    seen.add(id);
    return { id, ko:str(c.ko)||'(이름 없음)', en:str(c.en), type:TYPES.includes(c.type)?c.type:'townsfolk',
      ability:str(c.ability)||'(능력 미기재)', first:!!c.first, other:!!c.other,
      firstAfter:typeof c.firstAfter==='string'?c.firstAfter:null,
      otherAfter:typeof c.otherAfter==='string'?c.otherAfter:null,
      voteRelated:!!c.voteRelated, voteNote:str(c.voteNote),
      reminders:arr(c.reminders), warn:arr(c.warn), custom:true };
  });
  save(); renderAll(); toast(`가져오기 완료 — ${S.customs.length}종 (id·필드 검증 적용)`,'ok');
}
document.addEventListener('click', e=>{
  const b=e.target.closest && e.target.closest('[data-delcustom]');
  if(b) delCustom(b.getAttribute('data-delcustom'));
});

function renderAll(){
  /* 분기 객체는 매 호출마다 새로 만든다 — 값으로 미리 붙잡으면 나중에 얹히는 래퍼를 우회한다.
     stats 만 화살표인 이유: renderStats 는 아래 스크립트 블록에서 정의되므로 이름을 즉시
     평가하면 첫 renderAll() 에서 ReferenceError 가 난다. */
  const draw={scripts:renderScripts, setup:renderSetup, sheet:renderSheet, grim:renderGrim, night:renderNight, day:renderDay, guide:renderGuide, check:renderCheck, custom:renderCustom, stats:()=>renderStats()}[activeTab];
  /* 모르는 탭(잘못된 해시·구버전 저장본)이 들어오면 $('#pane-'+activeTab) 가 null 이라
     여기서 앱 전체가 죽는다. 기본 탭으로 되돌리고 한 번만 다시 그린다(무한 재귀 방지). */
  if(typeof draw!=='function' || !$('#pane-'+activeTab)){
    if(activeTab==='scripts') return;
    activeTab='scripts';
    return renderAll();
  }
  renderTabs(); renderTopbar();
  document.querySelectorAll('.tabpane').forEach(s=>s.classList.remove('active'));
  $('#pane-'+activeTab).classList.add('active');
  draw();
}
/* ⚠ 여기서 advancePhase 를 '값'으로 붙잡으면, 이 줄 아래에서 래핑된 버전
   (낮 타이머 정리 · nightSnapshot 갱신 · 보르톡스/시장 낮종료 판정)이 상단
   진행 버튼에서 통째로 우회된다. 반드시 호출 시점에 이름을 다시 해석해야 한다. */
$('#advbtn').onclick=()=>advancePhase();
$('#themebtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?null:'dark';
  if(next) document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
  S.theme=next||'auto'; save();
};
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme',S.theme);
if(S.phase.kind==='night') activeTab='night'; else if(S.phase.kind==='day') activeTab='day'; else activeTab='scripts';
renderAll();

<script>
/* ══════════════════ 통계 탭: 평점 · 전광판(MMR) · 판 기록 ══════════════════
   점수 계산은 별도 점수 엔진(scorePlayer · matchMVP · scoreTimeline)에 위임하고
   여기서는 표시만 담당한다 — 엔진이 아직 없으면 안내만 띄운다(typeof 방어).
   판 기록은 S.history(종료 시 다른 모듈이 기록)를 읽기만 하므로 신규 영속 필드 없음. */

const STATS_MIN_GAMES = 3;              // 이 판수 미만은 '배치 중'
const statsOpenHist = new Set();        // 펼쳐진 판 기록 인덱스(세션 한정, 비영속)

function statsEngineReady(){
  return typeof scorePlayer==='function' && typeof matchMVP==='function';
}
/* 평점을 0~10 사이 유한수로 정규화 — 아니면 null */
function statsNum(v){
  const n=Number(v);
  return Number.isFinite(n)? Math.max(0, Math.min(10, n)) : null;
}
/* op.gg 풍 점수대 배지: 9+ 보라 · 8+ 파랑 · 6+ 초록 · 4+ 호박 · 그 외 회색 */
function statsTier(score){
  const n=statsNum(score);
  if(n===null) return {cls:'rt-x', ko:'—'};
  if(n>=9) return {cls:'rt-s', ko:'탁월'};
  if(n>=8) return {cls:'rt-a', ko:'우수'};
  if(n>=6) return {cls:'rt-b', ko:'준수'};
  if(n>=4) return {cls:'rt-c', ko:'분전'};
  return {cls:'rt-d', ko:'고전'};
}
function statsBadge(score){
  const t=statsTier(score), n=statsNum(score);
  return `<span class="rbadge ${t.cls}"><b class="num">${n===null?'—':n.toFixed(1)}</b><span>${t.ko}</span></span>`;
}
/* 엔진 호출부 — 시그니처 편차(플레이어 객체/pid)를 흡수한다 */
function statsScoreOf(p){
  if(typeof scorePlayer!=='function' || !p) return null;
  let v=null;
  try{ v=statsNum(scorePlayer(p)); }catch(e){}
  if(v===null){ try{ v=statsNum(scorePlayer(p.id)); }catch(e){} }
  return v;
}
/* matchMVP() 반환값이 플레이어 객체·id·이름 어느 쪽이어도 pid 로 정규화 */
function statsMvpPid(){
  if(typeof matchMVP!=='function') return null;
  let m=null; try{ m=matchMVP(); }catch(e){ return null; }
  if(!m) return null;
  if(typeof m==='object') return m.id||null;
  if(typeof m==='string'){
    if(playerOf(m)) return m;
    const byName=S.players.find(p=>p.name===m);
    return byName? byName.id : null;
  }
  return null;
}
/* scoreTimeline() 결과를 {labels, series:[{name, points:[숫자|null]}]} 로 정규화 */
function statsTimelineSeries(){
  if(typeof scoreTimeline!=='function') return null;
  let raw=null; try{ raw=scoreTimeline(); }catch(e){ return null; }
  if(!raw) return null;
  let labels=null, list=raw;
  if(!Array.isArray(raw) && typeof raw==='object'){
    if(Array.isArray(raw.series)){ list=raw.series; labels=Array.isArray(raw.labels)? raw.labels : null; }
    else list=Object.entries(raw).map(([k,v])=>({key:k, points:v}));
  }
  if(!Array.isArray(list)) return null;
  const series=list.map(sr=>{
    if(!sr||typeof sr!=='object') return null;
    const pts=[sr.points, sr.values, sr.scores, sr.data].find(a=>Array.isArray(a)&&a.length);
    if(!pts) return null;
    const key=sr.pid||sr.id||sr.key||null;
    const via=key? playerOf(key) : null;
    const nm=sr.name || (via&&via.name) || key || '?';
    return {name:String(nm), points:pts.map(statsNum)};
  }).filter(Boolean).filter(sr=>sr.points.some(n=>n!==null));
  return series.length? {labels, series} : null;
}
/* 인라인 SVG 라인차트 — viewBox 640×240, y축 0~10 고정, 외부 라이브러리 없음 */
function statsChartSVG(tl){
  const W=640, H=240, L=34, R=12, T=14, B=30;
  const iw=W-L-R, ih=H-T-B;
  const len=Math.max(...tl.series.map(s=>s.points.length));
  if(len<1) return '';
  const x=i=> L + (len<2? iw/2 : iw*i/(len-1));
  const y=v=> T + ih*(1-Math.max(0,Math.min(10,v))/10);
  const cols=['var(--accent)','var(--good)','var(--evil)','var(--ok)','var(--primary)','var(--outsider)','var(--minionc)','var(--warn)'];
  const grid=[0,2,4,6,8,10].map(v=>
    `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}" class="cgrid"/>`+
    `<text x="${L-6}" y="${(y(v)+4).toFixed(1)}" class="ctxt" text-anchor="end">${v}</text>`).join('');
  const step=Math.max(1, Math.ceil(len/12));   // 라벨이 겹치지 않게 솎아낸다
  const names=tl.labels||Array.from({length:len},(_,i)=>i+1);
  const lbls=Array.from({length:len},(_,i)=> i%step? '' :
    `<text x="${x(i).toFixed(1)}" y="${H-10}" class="ctxt" text-anchor="middle">${esc(String(names[i]??i+1))}</text>`).join('');
  const lines=tl.series.map((sr,si)=>{
    const c=cols[si%cols.length];
    const pts=sr.points.map((v,i)=> v===null? null : [x(i),y(v)]).filter(Boolean);
    const poly=pts.map(([px,py])=>`${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
    const dots=pts.map(([px,py])=>`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.5" fill="${c}"/>`).join('');
    return `<polyline points="${poly}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const legend=tl.series.map((sr,si)=>`<span class="clg"><i style="background:${cols[si%cols.length]}"></i>${esc(sr.name)}</span>`).join('');
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="페이즈별 평점 추이">${grid}${lines}${lbls}</svg><div class="clegend">${legend}</div></div>`;
}

/* ── S.history 집계 ── */
function statsHistEntries(){
  const hist=Array.isArray(S.history)? S.history : [];
  return hist.filter(h=>h&&typeof h==='object').map(h=>{
    const players=(Array.isArray(h.players)? h.players : Array.isArray(h.roster)? h.roster : [])
      .filter(p=>p&&typeof p==='object');
    const winner=(h.winner==='good'||h.winner==='evil')? h.winner
      : (h.win==='good'||h.win==='evil')? h.win : null;
    return {players, winner, mvpKey:h.mvpId||h.mvpName||h.mvp||null,
      at:h.ts||h.endedAt||h.at||h.date||null, edition:h.edition||null, label:h.label||h.title||null};
  });
}
function statsIsMvp(entry,p){
  if(p.mvp===true) return true;
  const k=entry.mvpKey;
  if(!k) return false;
  if(typeof k==='object') return k===p || (!!k.id&&k.id===p.id) || (!!k.name&&k.name===p.name);
  return k===p.id || k===p.name;
}
function statsPlayerScore(p){ return statsNum(p.score??p.rating??p.rate); }
/* 전광판: 이름 기준 집계. 판수 가점 없음 — 판별 평점의 단순 평균으로만 순위 */
function statsLeaderboard(){
  const by={};
  /* 등록부가 사람의 단일 출처다 — 소속·현재 이름은 rosterId 로 되찾는다.
     이름만으로 묶으면 동명이인이 합쳐지고, 등록부에서 이름을 고치면 과거 판과 끊긴다. */
  const ros={}; (S.roster||[]).forEach(r=>{ if(r&&r.id) ros[r.id]=r; });
  statsHistEntries().forEach(h=>{
    h.players.forEach(p=>{
      const reg = p.rosterId? ros[p.rosterId] : null;
      const name=String((reg&&reg.name) || p.name || '').trim(); if(!name) return;
      const sc=statsPlayerScore(p); if(sc===null) return;
      const key = p.rosterId? 'r:'+p.rosterId : 'n:'+name;
      const r=by[key] || (by[key]={name, org:'', games:0, sum:0, mvp:0, goodG:0, goodW:0, evilG:0, evilW:0});
      r.name=name;
      r.games++; r.sum+=sc;
      if(statsIsMvp(h,p)) r.mvp++;
      if(p.alignment==='good'){ r.goodG++; if(h.winner==='good') r.goodW++; }
      else if(p.alignment==='evil'){ r.evilG++; if(h.winner==='evil') r.evilW++; }
      const org=(reg&&reg.affil) || p.affil || p.org || p.team || p.affiliation || '';
      if(org) r.org=String(org);
    });
  });
  const rows=Object.values(by).map(r=>Object.assign(r,{avg:r.sum/r.games}));
  rows.sort((a,b)=> b.avg-a.avg || b.games-a.games || a.name.localeCompare(b.name,'ko'));
  return {ranked:rows.filter(r=>r.games>=STATS_MIN_GAMES), placement:rows.filter(r=>r.games<STATS_MIN_GAMES)};
}
function statsWR(w,g){ return g? `${Math.round(w/g*100)}% <span class="hint">(${w}/${g})</span>` : '—'; }
function statsWhen(at){
  if(!at) return '';
  const d=new Date(at);
  if(isNaN(d)) return esc(String(at));
  const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ── 렌더 ── */
function statsCurrentHTML(){
  let body='';
  if(!statsEngineReady()){
    body=`<div class="alertbox">⚙ 점수 엔진이 아직 로드되지 않았습니다 — 평점·MVP 계산 모듈이 추가되면 이곳에 이번 판 분석이 표시됩니다.</div>`;
  } else if(!S.players.length){
    body=`<p class="hint">진행 중인 판이 없습니다 — <b>설정</b> 탭에서 플레이어를 등록하면 평점이 계산됩니다.</p>`;
  } else {
    const mvpPid=statsMvpPid();
    const cards=S.players.map(p=>{
      const c=charOf(p.charId), mvp=p.id===mvpPid;
      return `<div class="statcard ${mvp?'mvp':''} ${p.alive?'':'deadrow'}">
        ${mvp?'<div class="mvptag">👑 MVP</div>':''}
        <div class="scname">${esc(p.name)}</div>
        <div class="scrole">${c?`<span class="pill ${c.type}">${TYPE_KO[c.type]||''}</span> ${esc(c.ko)}`:'<span class="pill neutral">미배정</span>'}</div>
        ${statsBadge(statsScoreOf(p))}
      </div>`;
    }).join('');
    const tl=statsTimelineSeries();
    body=`<div class="statgrid">${cards}</div>
    ${tl? `<h3 style="margin:16px 0 6px">페이즈별 추이</h3>${statsChartSVG(tl)}`
        : `<p class="hint">페이즈별 추이 데이터가 아직 없습니다.</p>`}`;
  }
  return `<div class="card"><h2>① 이번 판</h2>${body}</div>`;
}
function statsBoardHTML(){
  const lb=statsLeaderboard();
  if(!lb.ranked.length && !lb.placement.length)
    return `<div class="card"><h2>② 전광판</h2><p class="hint">아직 집계된 판이 없습니다 — 판이 끝나면 자동으로 쌓입니다.</p></div>`;
  const head=`<tr><th>순위</th><th>이름</th><th>소속</th><th>평균 평점</th><th>판수</th><th>MVP</th><th>선 / 악 승률</th></tr>`;
  const row=(r,rank)=>`<tr>
    <td class="num">${rank}</td>
    <td><b>${esc(r.name)}</b></td>
    <td>${r.org? esc(r.org) : '<span class="hint">—</span>'}</td>
    <td>${statsBadge(r.avg)}</td>
    <td class="num">${r.games}</td>
    <td class="num">${r.mvp?`👑 ${r.mvp}`:'0'}</td>
    <td class="num">${statsWR(r.goodW,r.goodG)} / ${statsWR(r.evilW,r.evilG)}</td>
  </tr>`;
  return `<div class="card"><h2>② 전광판</h2>
  <p class="hint">판별 평점의 단순 평균으로만 순위를 매깁니다 — 판수가 많다고 가점이 붙지 않습니다.</p>
  ${lb.ranked.length? `<div class="tblwrap"><table class="stattbl">${head}${lb.ranked.map((r,i)=>row(r,String(i+1))).join('')}</table></div>`
    : `<p class="hint">정규 순위 대상(${STATS_MIN_GAMES}판 이상)이 아직 없습니다.</p>`}
  ${lb.placement.length? `<h3 style="margin:14px 0 6px">배치 중 <span class="hint" style="font-size:12px">(${STATS_MIN_GAMES}판 미만)</span></h3>
  <div class="tblwrap"><table class="stattbl">${head}${lb.placement.map(r=>row(r,'—')).join('')}</table></div>`:''}
  </div>`;
}
function statsHistBoard(h){
  const rows=h.players.slice()
    .sort((a,b)=>(statsPlayerScore(b)??-1)-(statsPlayerScore(a)??-1))
    .map(p=>{
      const c=charOf(p.charId);
      const al=p.alignment==='evil'? '<span class="pill evilw">악</span>'
        : p.alignment==='good'? '<span class="pill goodw">선</span>' : '<span class="pill neutral">—</span>';
      return `<tr><td>${statsIsMvp(h,p)?'👑 ':''}${esc(p.name??'?')}</td>
      <td>${c? esc(c.ko) : esc(p.charKo||p.charId||'—')}</td><td>${al}</td><td>${statsBadge(statsPlayerScore(p))}</td></tr>`;
    }).join('');
  return `<div class="histboard"><div class="tblwrap"><table class="stattbl">
  <tr><th>플레이어</th><th>캐릭터</th><th>진영</th><th>평점</th></tr>${rows}</table></div></div>`;
}
function statsHistoryHTML(){
  const entries=statsHistEntries();
  if(!entries.length)
    return `<div class="card"><h2>③ 판 기록</h2><p class="hint">아직 저장된 판이 없습니다.</p></div>`;
  const items=entries.map((h,i)=>({h,i})).reverse().map(({h,i})=>{
    const open=statsOpenHist.has(i);
    const sm=(typeof SCRIPTS_META!=='undefined')? SCRIPTS_META.find(s=>s.id===h.edition) : null;
    const title=h.label? esc(String(h.label)) : `${sm? esc(sm.ko) : '커스텀'} · ${h.players.length}인`;
    const wpill=h.winner==='good'? '<span class="pill goodw">선 승리</span>'
      : h.winner==='evil'? '<span class="pill evilw">악 승리</span>' : '<span class="pill neutral">결과 미기록</span>';
    return `<div class="histrow ${open?'open':''}" data-histtoggle="${i}" role="button" tabindex="0" aria-expanded="${open}">
      <span class="num hint">#${i+1}</span>
      <div class="histmain"><b>${title}</b><span class="hint">${statsWhen(h.at)}</span></div>
      ${wpill}<span class="chev">${open?'▾':'▸'}</span>
    </div>${open? statsHistBoard(h) : ''}`;
  }).join('');
  return `<div class="card"><h2>③ 판 기록</h2>${items}</div>`;
}
function renderStats(){
  const el=$('#pane-stats'); if(!el) return;
  el.innerHTML=`${statsCurrentHTML()}${statsBoardHTML()}${statsHistoryHTML()}`;
}
/* 판 기록 펼침/접힘 — 사용자 문자열을 onclick 에 보간하지 않도록 data-* 위임 */
document.addEventListener('click', e=>{
  const t=e.target.closest && e.target.closest('[data-histtoggle]');
  if(!t) return;
  const i=Number(t.getAttribute('data-histtoggle'));
  if(!Number.isInteger(i)) return;
  if(statsOpenHist.has(i)) statsOpenHist.delete(i); else statsOpenHist.add(i);
  renderStats();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t=e.target.closest && e.target.closest('[data-histtoggle]');
  if(t){ e.preventDefault(); t.click(); }
});
</script>
