}
function doProtect(pid){ if(!pid)return; const p=playerOf(pid); const monk=S.players.find(q=>q.charId==='monk');
  if(monk && isMalfunctioning(monk)){
    toast('수도사가 오작동 상태 — 보호가 작동하지 않습니다! 토큰을 놓지 않고 기록만 남깁니다. 임프가 이 대상을 지목하면 그대로 사망 처리하세요.','warn');
    log(`수도사 오작동: ${p.name} 보호 무효(토큰 미부여)`); save(); renderAll(); return;
  }
  addStatus(p,'protect','수도사',{kind:'day', n:S.phase.n}); save(); renderAll(); }
function doMaster(pid){ if(!pid)return; S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='master'));
  const p=playerOf(pid); addStatus(p,'master','집사',{kind:'night', n:S.phase.n+1}); save(); renderAll(); }
function doImpKill(pid){
  if(!pid)return; const t=playerOf(pid);
  const imp=S.players.find(q=>q.alive && charOf(q.charId)?.type==='demon');
  if(imp && isMalfunctioning(imp)){ toast('임프가 중독/오작동 — 오늘 밤 살해 불발. 아무도 죽지 않습니다.','warn'); log(`임프 오작동: ${t.name} 살해 불발`); save(); renderAll(); return; }
  if(t===imp){ // 자살 → 별 넘기기 (승격을 먼저 하고 사망 처리해야 오판정이 없다)
    const minions=S.players.filter(q=>q.alive && charOf(q.charId)?.type==='minion');
    if(minions.length){
      const sw=minions.find(m=>m.charId==='scarletwoman');
      const pick=prompt(`임프가 될 하수인 이름을 입력하세요 (생존 하수인: ${minions.map(m=>m.name+'('+charName(m)+')').join(', ')})${sw?'\n관례: 탕녀 우선':''}`, (sw||minions[0]).name);
      const np=minions.find(m=>m.name===pick)||sw||minions[0];
      np.charId='imp'; log(`★ ${np.name}이(가) 새 임프가 됨 — 깨워서 임프 토큰을 보여주세요`);
      toast(`${np.name}이(가) 새 임프입니다. 지금 깨워 임프 토큰을 보여주세요.`,'warn');
    }
    killPlayer(t,'임프 자살(★ 별 넘기기)',{skipSuccession:true});
    save(); renderAll(); return;
  }
  if(!t.alive){ toast('이미 죽은 대상입니다 — 아무 일도 일어나지 않습니다.','warn'); return; }
  const dr=resolveDeath(t,{sourceType:'demon', sourceCharId:'imp', cause:'임프의 공격'},['block','substitute']);
  const blk=dr.reason;
  if(blk){ toast(`${t.name}: ${blk} — 사망 없음. 임프에게 알리지 마세요.`,'ok'); log(`임프 공격 → ${t.name} 무효(${blk})`); save(); renderAll(); return; }
  if(offerMayorSubstitute(t, dr, '임프')){ save(); renderAll(); return; }
  resolveNightDeath(t, '임프의 공격');
  save(); renderAll();
}
/* 시장 대체 사망 — 공식은 '밤에 죽으면 다른 사람이 대신 죽을 수 있다'(살해 주체 무관)인데
   지금까지 임프 경로에만 인라인으로 있었다. 모든 밤 살해가 같은 창구를 쓰게 뽑아낸다.
   대체 대상은 '사망 판정을 다시 받는다'. 공식 Mayor 진행 지침이 못박는다 — 악마가 시장을
   공격했는데 사회자가 대신 죽은 플레이어·군인·수도사가 보호한 플레이어를 골랐다면 그 플레이어는
   오늘 밤 죽지 않는다(wiki.bloodontheclocktower.com/Mayor · "How to Run"). 즉 대체 대상을
   그렇게 고르면 '아무도 죽지 않는 밤'이 되며, 그래서 죽은 플레이어도 고를 수 있어야 한다.
   재진입은 stages 를 ["block"] 으로만 준다 — 시장 항목은 stage:"substitute" 라 평가 대상에서
   빠지므로 대체의 대체(순환)가 구조적으로 불가능하다.
   반환 true = 이 창구가 결말까지 처리했으니 호출부는 원래 대상을 죽이지 말 것
   (대체 대상이 보호돼 아무도 죽지 않는 경우도 포함한다 — 시장은 어느 쪽이든 살아남는다). */
function offerMayorSubstitute(t, dr, cause, opts){
  if(!dr || dr.blockedBy!=='mayor-substitute') return false;
  if(!confirm(`${t.name}은(는) 시장입니다. [확인] = 다른 플레이어가 대신 사망(재량), [취소] = 시장이 그대로 사망`)) return false;
  const alt=prompt(`대신 죽을 플레이어 이름 — 죽은 플레이어·군인·수도사가 보호한 플레이어를 고르면 공식 재정상 오늘 밤 아무도 죽지 않습니다.\n전체: ${S.players.map(q=>q.name+(q.alive?'':' 💀')).join(', ')}`);
  const ap=S.players.find(q=>q.name===alt);
  if(!ap){ toast('대상을 찾지 못해 시장 사망으로 처리합니다.','warn'); return false; }
  /* 시장 본인을 적으면 '대신 죽는다'가 성립하지 않는다 — 재진입 없이 원래 경로(시장 사망)로 돌린다. */
  if(ap===t){ toast('시장 본인은 대체 대상이 될 수 없습니다 — 시장이 그대로 사망합니다.','warn'); return false; }
  /* 원래 악마 컨텍스트를 그대로 물려준다 — 군인 면역은 sourceType==='demon' 일 때만 성립하므로
     출처를 잃으면 판정이 조용히 달라진다. */
  const sub=Object.assign({sourceType:'demon', sourceCharId:null, bypass:false}, opts||{},
                          {cause:cause+'(시장 대체 사망)'});
  if(!ap.alive){
    log(`시장 대체 사망 → ${ap.name}은(는) 이미 사망 — 오늘 밤 아무도 죽지 않음`);
    toast(`${ap.name}은(는) 이미 죽어 있습니다 — 시장도 그 사람도 죽지 않습니다(공식). 오늘 밤 사망자 없음.`,'ok');
    return true;
  }
  const blk=resolveDeath(ap, sub, ['block']).reason;
  if(blk){
    log(`시장 대체 사망 → ${ap.name} 불발(${blk}) — 오늘 밤 아무도 죽지 않음`);
    toast(`${ap.name}: ${blk} — 대체 사망이 성립하지 않습니다. 시장도 그 사람도 죽지 않습니다(공식).`,'ok');
    return true;
  }
  resolveNightDeath(ap, cause+'(시장 대체 사망)', sub);
  return true;
}
/* 밤 사망 창구 — opts(관통·살해 출처)를 killPlayer 로 그대로 흘려보낸다.
   opts 를 주지 않는 호출부는 종전과 완전히 동일하게 동작한다. */
function resolveNightDeath(t, cause, opts){
  killPlayer(t, cause, opts);
  if(t.charId==='ravenkeeper' && !isMalfunctioning(t)){
    toast('🔮 까마귀지기가 밤에 죽었습니다 — 지금 깨워서 1명을 지목받고 캐릭터를 보여주세요(까마귀지기 단계).','warn');
  }
  if(t.charId==='ravenkeeper' && isMalfunctioning(t)){
    toast('까마귀지기가 죽었지만 중독/오작동 — 깨우되 거짓 캐릭터를 보여주세요.','warn');
  }
}
/* ── 달의 자손 — 지목(사망 인지 시점)과 판정(밤)의 분리 ───────────────────────
   공식: "When you learn that you died, publicly choose 1 alive player. Tonight, if it was a
   good player, they die."(official/roles181.json) 지목은 사망을 안 그 순간의 공개 행위이고,
   판정의 근거는 '그때의' 대상 진영이다. 지목 뒤 대상이 이발사 교환·건달·교주로 진영이 바뀌거나
   죽어도 근거는 얼어 있다. 밤에 새로 평가하는 것은 달의 자손 본인의 중독·취함뿐이다.
   종전에는 다음 밤 pick-player 하나로 두 시점을 합쳐 처리해, 지목 시점 진영이 사라지고
   죽은 달의 자손의 오작동도 doStepKill 이 검사하지 못했다. */
function onMoonchildDeath(p){
  if(!p || p.charId!=='moonchild') return;
  if(S.moonchildChoice && S.moonchildChoice.sourcePid===p.id) return;   // 이미 지목을 받았다
  if(S.phase.kind==='day'){ askMoonchildChoice(p); return; }
  log(`🌙 달의 자손 ${p.name} 밤 사망 — 공개 지목은 새벽에 받는다`);
  toast(`🌙 ${p.name}(달의 자손)이 밤에 죽었습니다 — 공개 지목은 지금이 아니라 새벽입니다. 사망을 공표한 뒤 낮으로 진행하면 지목을 묻습니다.`,'warn');
}
/* 새벽(밤→낮) — 밤에 죽은 달의 자손이 자기 죽음을 '아는' 시점이 여기다.
   그 사망을 공표하는 새벽 딱 한 번만 묻는다(낮 사망은 killPlayer 훅이 그 자리에서 묻는다).
   사회자가 취소하면 다시 묻지 않는다 — 놓쳤을 때의 회수 창구는 밤 단계 카드의
   '🌙 공개 지목 지금 기록' 버튼이다. 조건을 안 걸면 이후 모든 새벽마다 같은 질문이 반복된다. */
function sweepMoonchildChoice(){
  const p=S.players.find(q=>q.charId==='moonchild' && !q.alive
                          && q.diedAt && q.diedAt.kind==='night' && q.diedAt.n===S.phase.n
                          && !(S.moonchildChoice && S.moonchildChoice.sourcePid===q.id));
  if(p) askMoonchildChoice(p);
}
function askMoonchildChoice(p){
  if(!p || p.charId!=='moonchild') return false;
  if(S.moonchildChoice && S.moonchildChoice.sourcePid===p.id) return false;
  const cands=alivePlayers().filter(q=>q!==p);
  if(!cands.length){ log('🌙 달의 자손 공개 지목 — 지목할 생존자가 없어 건너뜁니다'); return false; }
  const raw=prompt(`🌙 ${p.name}(달의 자손)이 공개로 지목한 플레이어 이름을 적으세요 — 지목 시점의 진영이 그대로 굳습니다.\n생존자: ${cands.map(q=>q.name).join(', ')}\n(아직 지목하지 않았다면 [취소] — 밤 단계에서 다시 받을 수 있습니다)`);
  if(raw===null) return false;
  const t=cands.find(q=>q.name===String(raw).trim());
  if(!t){ toast('그 이름의 생존 플레이어가 없어 공개 지목을 기록하지 못했습니다 — 밤 단계에서 다시 입력할 수 있습니다.','warn'); return false; }
  const evil=isEvil(t);
  S.moonchildChoice={sourcePid:p.id, targetPid:t.id, alignmentAtChoice:(evil?'evil':'good'),
                     day:S.phase.n, resolved:false};
  log(`🌙 달의 자손 공개 지목 — ${p.name} → ${t.name} (지목 시점 진영: ${evil?'악':'선'})`);
  toast(`🌙 공개 지목 기록: ${t.name} (지목 시점 ${evil?'악':'선'}). 판정은 다음 밤의 달의 자손 단계에서 하며, 그때는 달의 자손 본인의 중독·취함만 봅니다.`,'warn');
  save(); renderAll();
  return true;
}
/* 지목을 놓쳤을 때의 회수 창구 — 밤 단계 카드의 버튼이 부른다(그 경우 진영은 지금 시점으로 굳는다) */
function askMoonchildChoiceNow(){
  const p=S.players.find(q=>q.charId==='moonchild' && !q.alive) || S.players.find(q=>q.charId==='moonchild');
  if(!p){ toast('달의 자손이 판에 없습니다.','warn'); return false; }
  const ok=askMoonchildChoice(p);
  if(ok && typeof wiz!=='undefined' && wiz) renderWiz();
  return ok;
}
function moonchildSource(){
  const mc=S.moonchildChoice;
  return (mc && mc.sourcePid && playerOf(mc.sourcePid)) || S.players.find(q=>q.charId==='moonchild') || null;
}
/* 밤 단계 — 저장된 지목을 '해결만' 한다. 여기서 새로 지목받지 않는다. */
function resolveMoonchildChoice(){
  const mc=S.moonchildChoice;
  if(!mc || mc.resolved){ toast('해결할 공개 지목이 없습니다 — 지목은 달의 자손이 사망을 안 낮에 받습니다.','warn'); return false; }
  const t=playerOf(mc.targetPid);
  if(!t){ toast('지목 대상을 찾지 못했습니다 — 지목을 다시 기록하세요.','warn'); return false; }
  const src=moonchildSource();
  mc.resolved=true;
  const koAl = mc.alignmentAtChoice==='evil'? '악':'선';
  if(src && isMalfunctioning(src)){
    log(`🌙 달의 자손 오작동 — ${t.name} 사망 불발 (지목 시점 진영: ${koAl})`);
    toast('달의 자손이 중독/취함 상태 — 이번 판정은 불발입니다. 아무도 죽지 않습니다.','warn');
    save(); renderAll(); return false;
  }
  if(mc.alignmentAtChoice!=='good'){
    log(`🌙 달의 자손 지목 대상 ${t.name} — 지목 시점에 악이었으므로 아무 일도 일어나지 않는다`);
    toast(`${t.name}은(는) 지목 시점에 악이었습니다 — 아무 일도 일어나지 않습니다(어느 쪽이었는지 밝히지 마세요).`,'ok');
    save(); renderAll(); return false;
  }
  if(!t.alive){
    log(`🌙 달의 자손 지목 대상 ${t.name} — 이미 사망, 추가 사망 없음`);
    toast(`${t.name}은(는) 이미 죽어 있습니다 — 추가 사망은 없습니다.`,'ok');
    save(); renderAll(); return false;
  }
  doStepKill(t.id, 'moonchild');
  return true;
}
function doCurse(pid){ if(!pid)return; S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='curse'));
  const p=playerOf(pid); addStatus(p,'curse','마녀',{kind:'night', n:S.phase.n+1}); save(); renderAll(); }
function doMad(pid){ if(!pid)return; S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='mad'));
  const p=playerOf(pid); addStatus(p,'mad','세레노버스',{kind:'night', n:S.phase.n+1}); save(); renderAll(); }
/* 팡 구: 점프는 '외지인을 지목했을 때'가 아니라 '외지인을 실제로 죽였을 때'만 일어난다.
   보호로 죽지 않았다면 점프도 없다. */
function doFangGuAttack(pid){
  if(!pid)return; const t=playerOf(pid);
  const fg=S.players.find(q=>q.alive && q.charId==='fanggu');
  if(fg && isMalfunctioning(fg)){ toast('팡 구가 중독/오작동 — 오늘 밤 살해 불발.','warn'); log(`팡 구 오작동: ${t.name} 살해 불발`); save(); renderAll(); return; }
  const dr=resolveDeath(t,{sourceType:'demon', sourceCharId:'fanggu', cause:'팡 구의 공격'},['block','substitute']);
  const blk=dr.reason;
  if(blk){
    toast(`${t.name}: ${blk} — 죽지 않았습니다. 죽이지 못했으므로 점프도 일어나지 않습니다.`,'ok');
    log(`팡 구 공격 → ${t.name} 무효(${blk}) — 점프 없음`);
    save(); renderAll(); return;
  }
  const isOut = charOf(t.charId)?.type==='outsider';
  /* 점프 소진은 S.fangGuJumped 와 'spent' 토큰 두 곳에 따로 적혀 있었다 — 리마인더의
     '✔ 소진 기록' 버튼은 토큰만 세우고 점프를 막지 못했고, 실제 점프는 토큰을 세우지
     않아 리마인더가 계속 '● 남음'으로 보였다. 양방향으로 맞춘다. */
  if(isOut && !S.fangGuJumped && !(fg && hasStatus(fg,'spent'))){
    S.fangGuJumped=true;
    if(fg && !hasStatus(fg,'spent')) addStatus(fg,'spent','팡 구 점프 — 1회 소진',null);
    t.charId='fanggu'; t.alignment='evil';
    log(`🦊 팡 구 점프 — ${t.name}이(가) 새 팡 구로 전향(악)`);
    toast(`🦊 점프 발동: ${t.name}이(가) 새 팡 구입니다(악 전향). 기존 팡 구는 지금 죽습니다. 아침 공표는 "밤 사망 1명"뿐입니다.`,'warn');
    if(fg) killPlayer(fg,'팡 구 점프 — 기존 팡 구 사망',{skipSuccession:true});
    save(); renderAll(); return;
  }
  if(offerMayorSubstitute(t, dr, '팡 구')){ save(); renderAll(); return; }
  resolveNightDeath(t,'팡 구의 공격');
  save(); renderAll();
}
function doStepKill(pid, killerId){ if(!pid)return; const t=playerOf(pid);
  const kid = killerId || window.__stepKiller;
  const actor=S.players.find(q=>(q.alive || (q.charId==='zombuul'&&hasStatus(q,'fakedead'))) && q.charId===kid);
  if(actor && isMalfunctioning(actor)){ toast(`${charName(actor)}이(가) 오작동 상태 — 이 살해는 불발입니다.`,'warn'); log(`${charName(actor)} 오작동: ${t.name} 살해 불발`); save(); renderAll(); return; }
  if(!t.alive){ toast('이미 죽은 대상입니다 — 같은 사람을 두 번 지목할 수 없습니다. 다른 대상을 고르세요.','warn'); return; }
  // 보호·면역 통합 판정. 군인은 '악마의' 살해에만 면역이므로 살해 출처를 구분한다.
  let dr=null;   // 블록 밖에서도 봐야 한다 — 종단의 시장 대체 판정이 같은 결과를 쓴다
  {
    const src = charOf(kid)?.type==='demon' ? 'demon' : 'night';
    /* 사인 문자열은 '살해자 캐릭터'에서 만든다. actor 는 생존자 중에서만 찾으므로
       비고르모르티스로 능력을 유지한 죽은 하수인이면 undefined 가 되고, 그때 사인이
       '악마의 공격'으로 바뀐다 — DEATH_MODIFIERS 의 fool 항목은 /암살자/ 로 사인을
       읽으므로, block 단계는 bypass(kid==='assassin')로 뚫는데 kill 단계만 못 뚫는
       모순이 생긴다. 두 단계가 같은 근거(kid)를 보도록 문자열을 kid 에서 만든다. */
    const killerKo = charOf(kid)?.ko || (actor? charName(actor) : '악마');
    dr=resolveDeath(t,{sourceType:src, sourceCharId:kid||null, bypass:kid==='assassin', cause:killerKo+'의 공격'},['block','substitute']);
    const blk=dr.reason;
    if(blk){
      toast(`${t.name}: ${blk} — 사망하지 않습니다(불발). 악마에게 티 내지 마세요.`,'ok');
      log(`${blk}: ${t.name} 살해 불발 (${actor?charName(actor):'악마'}의 공격)`);
      save(); renderAll(); return;
    }
  }
  if(kid==='po' && S.poCharged){ S.poCharged=false; log('⚡ 포 충전 해제 — 살해 기록됨'); }
  /* 사인 문자열은 위 block 단계와 같아야 화면 표시가 일치한다. 다만 '관통인가'는 이제 문자열이
     아니라 아래 kctx 로 kill 단계까지 구조화돼 전달된다 — /암살자/ 정규식은 opts 를 주지 않는
     옛 호출부용 fallback 으로만 남는다(사회자가 사유에 '암살자'를 적어도 오판하지 않는다). */
  const killerKo2 = charOf(kid)?.ko || (actor?charName(actor):'악마');
  const kctx={sourceType:dr.ctx.sourceType, sourceCharId:dr.ctx.sourceCharId, bypass:!!dr.ctx.bypass};
  if(offerMayorSubstitute(t, dr, killerKo2, kctx)){ save(); renderAll(); return; }
  resolveNightDeath(t, killerKo2+'의 공격', kctx);
  // 비고르모르티스가 하수인을 죽였다면: 죽어도 능력 유지(영구 토큰) + 주민 이웃 1명 중독 안내
  if(kid==='vigormortis' && !t.alive && charOf(t.charId)?.type==='minion'){
    if(!hasStatus(t,'vigorAbility')) addStatus(t,'vigorAbility','비고르모르티스',null);
    toast(`🧟 ${t.name}(하수인)의 능력은 죽어서도 계속 작동합니다 — 밤에 계속 깨우세요. 그 하수인의 최근접 주민 이웃 1명(방향은 사회자 선택, 외지인·하수인은 건너뜀)에게 ☠영구 중독 토큰을 부여하세요. 비고르모르티스가 죽거나 오작동하면 능력 유지·이웃 중독을 재평가(해제)합니다.`,'warn');
  }
  save(); renderAll(); }
function doRavenPeek(pid){ if(!pid)return; const t=playerOf(pid);
  const c=charOf(t.charId); toast(`${t.name}의 실제 캐릭터: ${c?c.ko:'?'} — 첩자/은둔자면 등록 재량, 까마귀지기가 오작동이면 거짓 제시 가능.`,'ok');
  log(`까마귀지기 확인: ${t.name} (${c?c.ko:'?'})`); }
</script>

<script>
/* ══════════════════ 낮 · 투표 탭 ══════════════════ */
function voteNotices(nom){
  const out=[];
  const butler=S.players.find(p=>p.alive&&p.charId==='butler');
  if(butler){
    const master=S.players.find(p=>hasStatus(p,'master'));
    out.push(`🤵 <b>집사(${esc(butler.name)})</b>: 주인${master?` <b>${esc(master.name)}</b>`:'(미지정!)'}이(가) 거수/찬성한 경우에만 집사도 투표할 수 있습니다.${isMalfunctioning(butler)?' <mark>단, 집사가 현재 오작동 상태 — 자유 투표 허용(본인에겐 알리지 않음)</mark>':''}`);
  }
  const virgin=S.players.find(p=>p.alive&&p.charId==='virgin'&&!hasStatus(p,'virginUsed'));
  if(virgin) out.push(`⚜ <b>성결자(${esc(virgin.name)})</b> 미발동 — 최초 지명 시 지명자가 마을 주민이면 즉시 처형!${isMalfunctioning(virgin)?' <mark>현재 오작동 — 발동하지 않지만 능력은 소진됨</mark>':''}`);
  const saint=S.players.find(p=>p.alive&&p.charId==='saint');
  if(saint) out.push(`✝ <b>성자(${esc(saint.name)})</b> 생존 중 — 처형되면 선한 팀 패배.${isMalfunctioning(saint)?' <mark>현재 오작동 — 처형돼도 패배하지 않음</mark>':''}`);
  const sw=S.players.find(p=>p.alive&&p.charId==='scarletwoman');
  if(sw && alivePlayers().length>=5) out.push(`🔴 <b>탕녀</b> 생존 + 생존자 ${alivePlayers().length}명(5+) — 지금 악마가 처형돼도 게임은 끝나지 않습니다(계승).${isMalfunctioning(sw)?' <mark>단, 현재 오작동 — 계승 불발!</mark>':''}`);
  const mayor=S.players.find(p=>p.alive&&p.charId==='mayor');
  if(mayor && alivePlayers().length===3) out.push(`🏛 <b>시장</b> 생존 + 생존자 3명 — 오늘 처형 없이 낮이 끝나면 선한 팀 승리!${isMalfunctioning(mayor)?' <mark>현재 오작동 — 승리 조건 무효</mark>':''}`);
  const slayer=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(slayer) out.push(`🏹 <b>처단자(${esc(slayer.name)})</b> 미사용 — 낮 중 공개 지목 가능. 사용 시 아래 버튼으로 판정하세요.`);
  const artist=S.players.find(p=>p.alive&&p.charId==='artist');
  if(artist){
    out.push(hasStatus(artist,'spent')
      ? `🎨 <b>화가(${esc(artist.name)})</b> — 1회 질문 이미 소진됨.`
      : `🎨 <b>화가(${esc(artist.name)})</b> 1회 질문 미사용 — 질문을 받으면 <button class="small" onclick="doSpend('artist')">✔ 소진 기록</button>`);
  }
  const deadHold=S.players.filter(p=>!p.alive&&p.deadVote!==false);
  if(deadHold.length) out.push(`👻 사망 투표 토큰 보유: ${deadHold.map(p=>esc(p.name)).join(', ')} — <b>1차에 거수해야</b> 2차 찬반에 참여할 수 있고, 찬성/반대를 던질 때 토큰이 자동 소진·기록됩니다(기권은 소진 없음).`);
  // 에디션 공통: dayNotice 필드 자동 노출
  allChars().filter(c=>c.dayNotice).forEach(c=>{
    if(playersByChar(c.id).some(p=>p.alive || (c.id==='klutz'||c.id==='sweetheart'||c.id==='barber'))) out.push(esc(c.dayNotice).replace(/&#39;/g,"'"));
  });
  // 커스텀 캐릭터의 투표 관련 노티스
  (S.customs||[]).filter(c=>c.voteRelated).forEach(c=>{
    playersByChar(c.id).filter(p=>p.alive).forEach(p=>out.push(`🔔 <b>${esc(c.ko)}(${esc(p.name)})</b>: ${esc(c.voteNote||c.ability)}`));
  });
  if(nom){
    const nee=playerOf(nom.nominee);
    if(nee){
      if(nee.charId==='saint') out.push(`🚨 지명 대상이 <b>성자</b>입니다 — 처형 확정 전 중독 여부를 반드시 확인!`);
      if(nee.charId==='recluse') out.push(`👤 지명 대상이 <b>은둔자</b> — 처형돼도 게임은 끝나지 않습니다(악마 아님).`);
      if(charOf(nee.charId)?.type==='demon') out.push(`😈 지명 대상이 <b>악마</b> — 처형 시 탕녀 계승·생존자 수(5+) 확인.`);
    }
  }
  return out;
}
function renderDay(){
  const el=$('#pane-day');
  if(S.phase.kind!=='day'){
    el.innerHTML=`<div class="card"><h2>낮 · 투표</h2><p class="hint">지금은 ${phaseName()} 단계입니다. 낮이 되면 지명·투표 시스템이 열립니다.</p>
    <div class="card" style="background:var(--sunken)"><h3>티르소스 투표 규칙 (하우스 룰)</h3><ol class="guide">
      <li>지명 후 <b>1차 거수 투표</b>: 생존자 + <b>투표 토큰 보유 사망자</b>가 거수 가능. 거수 인원이 <b>생존자의 절반 이상(올림)</b>(⌈n/2⌉ — 공식 기준) 이상이면 2차로. (사망자 거수도 분자에 포함되며, 거수만으로는 토큰이 소진되지 않습니다.)</li>
      <li><b>2차 찬반 투표</b>: <b>생존자 전원 + 1차에 거수한 사망자</b>. 거수하지 않은 토큰 보유 사망자는 분모에서 제외됩니다. 사망자가 찬성/반대를 던지면 그때 토큰이 소진·자동 기록되고, 기권은 토큰을 쓰지 않습니다.</li>
      <li>매 단계 <b>분자/분모/과반 기준</b>을 화면에 표시.</li>
      <li>재지명은 언제나 가능(티르소스 하우스 룰). 하루의 모든 지명 중 <b>찬성 과반을 넘긴 지명 가운데 찬성표가 가장 많은 사람</b>이 처형 — 공식 기준은 최다 득표이며, 분모가 지명마다 달라지므로 찬성률로 비교하지 않습니다.</li>
      <li>최다 득표가 동률이면 처형 없음(공식 규칙 준용).</li>
    </ol></div></div>`;
    return;
  }
  const notices=voteNotices(null);
  const todays=S.noms.filter(n=>n.day===S.phase.n);
  const closed=todays.filter(n=>n.closed);
  const openNom=todays.find(n=>!n.closed);
  const passed=closed.filter(n=>n.result==='pass');
  let best=null, tie=false;
  /* 공식 기준은 '가장 많은 표(most votes)'이지 찬성률이 아니다. 분모(den)는 사망자 거수 여부와
     낮 중 사망으로 지명마다 달라지므로 비율로 비교하면 표를 더 적게 받은 사람이 처형대에 오른다.
     동률 판정도 같은 축(raw 표)으로 해야 한다 — 축이 갈리면 tie 가 조용히 뒤집힌다. */
  passed.forEach(n=>{ if(!best||n.yes>best.yes) best=n; });
  // 동일인이 재지명으로 같은 최다 득표를 2회 받아도 동률이 아니다 — 공식 기준은 '다른 어떤 피지명자보다 많은 표'
  if(best){ const topNees=new Set(passed.filter(n=>n.yes===best.yes).map(n=>n.nominee)); tie=topNees.size>1; }
  const slayer=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  el.innerHTML=`
  <div class="card"><h2>낮 ${S.phase.n}</h2>
    ${S.executedToday?`<div class="alertbox red">오늘 처형 완료: <b>${esc(S.executedToday)}</b> — 하루 1처형 원칙. 추가 처형은 불가(성결자 발동 포함).</div>`:''}
    ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
    ${slayer?`<div class="row" style="margin:6px 0"><button class="small" onclick="doSlayer()">🏹 처단자 공개 지목 판정</button></div>`:''}
  </div>
  ${openNom? renderNomOpen(openNom) : `
  <div class="card"><h2>지명</h2>
    ${S.executedToday?'<p class="hint">오늘 처형이 이미 있었습니다 — 추가 지명·투표는 기록용으로만 진행하세요.</p>':''}
    <div class="pickblock">
      <div class="picklab">지명자 <span class="hint">${nomPick.tor?esc(playerOf(nomPick.tor)?.name||''):'선택'}</span></div>
      <div class="pickgrid">${alivePlayers().map(p=>`<button class="pcell ${nomPick.tor===p.id?'sel':''}" onclick="setNomPick('tor','${p.id}')">
        <span class="pcnum num">${S.players.indexOf(p)+1}</span><span class="pcname">${esc(p.name)}</span></button>`).join('')}</div>
      <div class="picklab" style="margin-top:12px">피지명자 <span class="hint">${nomPick.nee?esc(playerOf(nomPick.nee)?.name||''):'선택'}</span></div>
      <div class="pickgrid">${alivePlayers().map(p=>`<button class="pcell ${nomPick.nee===p.id?'sel nee':''}" onclick="setNomPick('nee','${p.id}')">
        <span class="pcnum num">${S.players.indexOf(p)+1}</span><span class="pcname">${esc(p.name)}</span></button>`).join('')}</div>
      <div class="bigactions" style="margin-top:14px">
        <!-- nomPick 은 페이즈·사망을 넘어 유지된다 — 고른 뒤 죽은 좌석이면 버튼을 잠근다(공식: 죽은 플레이어는 지명·피지명 불가). playerOf(null)?.alive 는 undefined 라 미선택 조건도 그대로 걸린다 -->
        <button class="gold" onclick="newNomination()" ${(!playerOf(nomPick.tor)?.alive||!playerOf(nomPick.nee)?.alive)?'disabled':''}>
          ${nomPick.tor&&nomPick.nee?`${esc(playerOf(nomPick.tor)?.name||'')} → ${esc(playerOf(nomPick.nee)?.name||'')} 지명 개시`:'지명 개시'}</button>
      </div>
    </div>
    <p class="hint">재지명 제한 없음 — 같은 사람을 다시 지명해도 됩니다(티르소스 하우스 룰).</p>
  </div>`}
  ${closed.length?`<div class="card"><h2>오늘의 지명 결과</h2>
    ${closed.map(n=>{
      const isBest=best&&n===best&&!tie&&n.result==='pass';
      return `<div class="nomcard ${isBest?'leader':''}">
        <div class="nomtitle">${esc(playerOf(n.nominator)?.name||'?')} → ${esc(playerOf(n.nominee)?.name||'?')}
          ${n.result==='pass'?`<span class="pill ok">찬성 ${n.yes}/${n.den} · ${(n.ratio*100).toFixed(1)}%</span>`:
            n.result==='handsFail'?'<span class="pill warn">거수 미달</span>':'<span class="pill warn">찬성 과반 미달</span>'}
          ${isBest?'<span class="pill demon">처형 후보 1위</span>':''}
        </div>
        ${n.deadVoters&&n.deadVoters.length?`<div class="hint">👻 사망자 투표: ${n.deadVoters.map(id=>esc(playerOf(id)?.name||id)).join(', ')} (토큰 소진 기록됨)</div>`:''}
        ${isBest&&!S.executedToday&&playerOf(n.nominee)?.alive?`<button class="small danger" style="margin-top:6px" onclick="executeNominee('${n.id}')">⚔ ${esc(playerOf(n.nominee)?.name||'')} 처형 확정</button>`:''}
      </div>`;}).join('')}
    ${tie?'<div class="alertbox warn">⚖ 최고 찬성률 동률 — 처형 없음(공식 규칙 준용). 재지명으로 갱신 가능합니다.</div>':''}
  </div>`:''}`;
}
function newNomination(){
  const tor=(typeof nomPick!=='undefined'&&nomPick.tor)||($('#nomtor')&&$('#nomtor').value)||'';
  const nee=(typeof nomPick!=='undefined'&&nomPick.nee)||($('#nomnee')&&$('#nomnee').value)||'';
  if(!tor||!nee){ toast('지명자와 피지명자를 선택하세요.','warn'); return; }
  /* 공식: 죽은 플레이어는 지명할 수도, 지명당할 수도 없다(사망자에게 남는 건 1회 투표 토큰뿐).
     nomPick 은 모듈 전역이라 페이즈 전환·사망을 넘어 그대로 남는다 — 고른 뒤 죽은 좌석이
     선택 상태로 남아 있을 수 있으므로 진입점에서 잘라내고 낡은 선택을 버린다.
     이름은 toast(textContent)로만 내보낸다 — 인라인 onclick 보간 금지 계약 그대로. */
  const _tp=playerOf(tor), _np=playerOf(nee);
  if(!_tp||!_np){ toast('지명자/피지명자 좌석을 찾을 수 없습니다.','warn');
    if(typeof nomPick!=='undefined'){ nomPick.tor=null; nomPick.nee=null; } renderAll(); return; }
  if(!_tp.alive){ toast(`${_tp.name}은(는) 사망했습니다 — 죽은 플레이어는 지명할 수 없습니다.`,'warn');
    if(typeof nomPick!=='undefined') nomPick.tor=null; renderAll(); return; }
  if(!_np.alive){ toast(`${_np.name}은(는) 이미 사망했습니다 — 죽은 플레이어는 지명당할 수 없습니다.`,'warn');
    if(typeof nomPick!=='undefined') nomPick.nee=null; renderAll(); return; }
  if(tor===nee){ toast('자기 자신을 지명했습니다 — 공식 규칙상 허용됩니다. 그대로 진행합니다.','warn'); }
  /* 공식은 "한 플레이어는 하루 1회만 지명할 수 있고, 하루 1회만 지명당할 수 있다"이지만
     이 앱은 '재지명 제한 없음'을 하우스 룰로 화면(지명 카드·규칙 카드)에 명시해 두었다 —
     막지 않는다(막으면 화면 약속과 동작이 어긋난다). 대신 공식과 갈라지는 순간을 사회자가
     모르고 지나가지 않도록 경고와 로그를 남긴다. 처형 후보 비교는 최다 득표 기준으로
     고쳤으므로 재지명이 있어도 계산 자체는 어긋나지 않는다. */
  const _today=S.noms.filter(n=>n.day===S.phase.n);
  const _dupT=_today.some(n=>n.nominator===tor), _dupN=_today.some(n=>n.nominee===nee);
  if(_dupT||_dupN){
    const _w=[_dupT?'지명자가 오늘 이미 지명했습니다':'', _dupN?'피지명자가 오늘 이미 지명당했습니다':''].filter(Boolean).join(' / ');
    toast(`⚠ ${_w} — 공식 규칙은 하루 1회지만, 티르소스 하우스 룰(재지명 제한 없음)로 진행합니다.`,'warn');
    log(`재지명(하우스 룰): ${_w}`);
  }
  const nom={id:uid(), day:S.phase.n, nominator:tor, nominee:nee, hands:[], stage:1, votes:{}, closed:false, deadVoters:[]};
  S.noms.push(nom);
  if(typeof nomPick!=='undefined'){ nomPick.tor=null; nomPick.nee=null; }
  log(`지명: ${playerOf(tor).name} → ${playerOf(nee).name}`);
  const torP0=playerOf(tor);
  if(hasStatus(torP0,'curse')){
    const witch=S.players.find(p=>p.alive&&p.charId==='witch');
    if(witch && !isMalfunctioning(witch) && alivePlayers().length>=4){
      if(confirm(`🧹 마녀의 저주 발동! 지명자 ${torP0.name}은(는) 저주받은 상태입니다.\n즉시 사망 처리할까요? (지명 절차는 그대로 진행됩니다)`)){
        killPlayer(torP0,'마녀의 저주 — 지명 즉시 사망');
      }
    } else { toast('저주 토큰이 있으나 마녀가 죽었거나 오작동, 또는 생존 3인 — 저주 불발.','warn'); }
  }
  // 성결자 체크
  const neeP=playerOf(nee), torP=playerOf(tor);
  if(neeP.charId==='virgin' && !hasStatus(neeP,'virginUsed')){
    addStatus(neeP,'virginUsed','최초 지명 발생',null);
    const torC=charOf(torP.charId);
    const torIsTF = torC && torC.type==='townsfolk' && torP.charId!=='drunk';
    if(isMalfunctioning(neeP)){
      toast('⚜ 성결자 최초 지명 — 그러나 성결자가 오작동 상태: 발동하지 않습니다. 능력은 소진됩니다.','warn');
    } else if(torIsTF && S.executedToday){
      /* 공식: 하루 1처형. 이미 오늘 처형이 있었다면 성결자 발동은 능력만 소진되고
         추가 처형도, S.executedToday 계열 덮어쓰기도 없어야 한다
         (덮어쓰면 장의사·주모자 연장전·보르톡스 판정의 입력이 통째로 바뀐다). */
      toast(`⚜ 성결자 발동 조건이지만 오늘은 이미 처형(${S.executedToday})이 있었습니다 — 하루 1처형이므로 추가 처형하지 않습니다(능력은 소진).`,'warn');
      log('성결자 발동 — 오늘 이미 처형이 있어 추가 처형 없음');
      nom.closed=true; nom.result='virginTriggered';
    } else if(torIsTF){
      if(confirm(`⚜ 성결자 발동! 지명자 ${torP.name}(${torC.ko})는 마을 주민입니다.\n즉시 처형 처리할까요? (오늘의 처형으로 기록되며, 이 지명은 종료됩니다)`)){
        resolveExecution(torP,'성결자 발동 — 즉시 처형');
        S.executedToday=`${torP.name} (${charName(torP)}) — 성결자 발동`;
        nom.closed=true; nom.result='virginTriggered';
        toast('오늘은 추가 처형이 불가합니다. 장의사는 처형으로 실제 죽은 경우에만 그 캐릭터를 봅니다.','warn');
      }
    } else if(torP.charId==='spy'){
      toast('⚜ 성결자 최초 지명 — 지명자가 첩자입니다. "마을 주민으로 등록"시켜 발동시킬지 재량으로 결정하세요. 발동시키려면 그리모어에서 수동 처형 처리.','warn');
    } else {
      toast(`성결자 최초 지명 — 지명자 ${torP.name}는 마을 주민이 아니므로 발동하지 않습니다. 능력은 소진되었습니다.`,'warn');
    }
  }
  save(); renderAll();
}
/* ── 투표 대상 집합의 단일 정의 ─────────────────────────────────────────────
   분모를 화면용(renderNomOpen)과 확정용(closeBallot) 두 곳에 따로 적어 두었다가
   서로 어긋난 이력이 있다. 아래 두 헬퍼가 유일한 정의이며 renderNomOpen /
   closeBallot / 토큰 소진 안내 래퍼가 전부 이것만 쓴다.
   반환 순서는 S.players 순서(=자리 순서)로 통일한다 — 화면 목록과 확정 집계가
   같은 배열이어야 분자·분모가 갈라질 여지가 없다.

   [1차 거수 대상 handEligible] 생존자 + 투표 토큰 보유 사망자.
     사망자도 손을 들 수 있어야 2차 찬반에 참여할 수 있다(하우스 룰 7-B).
     ★ 토큰 소진 시점 = 2차에서 실제로 찬성/반대를 던질 때(castVote).
       거수만 하고 2차에서 기권하면 토큰은 남는다. 거수 자체는 토큰을 쓰지 않는다.
     이미 hands 에 들어 있는 사람은 토큰이 없어도 포함한다 — 그래야 잘못 올린 손을
     다시 내릴 수 있고, 취소·복원 경로에서 행이 사라지지 않는다.

   [1차 통과 기준] 분모·기준은 생존자 과반 그대로(요구 A). 분자는 거수 전원으로
     사망자 거수도 포함한다 — 공식 규칙도 사망자 표를 '생존자 기준' 문턱의 분자에
     넣는다. 그래서 closeHands() 의 n.hands.length 판정은 손대지 않는다.

   [2차 찬반 대상 ballotEligible] 생존자 ∪ 1차 거수자(사망자 포함).
     거수하지 않은 토큰 보유 사망자는 분모에서 제외된다.
     votes 에 이미 기록이 있는 사람은 방어적으로 포함한다 — 구버전 저장본이나
     stage 되돌림으로 표만 남은 경우 분모에서 빠지면 분자(yes 를 이 집합에서 센다)
     에서도 조용히 사라져 집계가 어긋난다. */
function handEligible(nom){
  const hands=Array.isArray(nom&&nom.hands)? nom.hands : [];
  return S.players.filter(p=> p.alive || p.deadVote!==false || hands.includes(p.id));
}
function ballotEligible(nom){
  const hands=Array.isArray(nom&&nom.hands)? nom.hands : [];
  const votes=(nom&&nom.votes)||{};
  return S.players.filter(p=> p.alive || hands.includes(p.id) || votes[p.id]!==undefined);
}
function renderNomOpen(nom){
  const alive=alivePlayers();
  const den1=alive.length, need1=majority(den1), num1=nom.hands.length;
  const handRows=handEligible(nom);
  const deadHands=nom.hands.filter(id=>{ const q=playerOf(id); return q && !q.alive; }).length;
  const torN=esc(playerOf(nom.nominator)?.name||'?'), neeN=esc(playerOf(nom.nominee)?.name||'?');
  const notices=voteNotices(nom).filter(x=>x.includes('집사')||x.includes('성자')||x.includes('악마')||x.includes('은둔자'));
  if(nom.stage===1){
    return `<div class="card"><h2>진행 중 지명: ${torN} → ${neeN}</h2>
      ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
      <h3>1단계 · 거수 투표 (생존자 + 투표 토큰 보유 사망자)</h3>
      <div class="votemath">
        <div class="vmbox"><div class="vlab">거수(분자)${deadHands?` <span style="text-transform:none;letter-spacing:0">생존 ${num1-deadHands}·사망 ${deadHands}</span>`:''}</div><div class="vval">${num1}</div></div>
        <div class="vmbox"><div class="vlab">생존자(분모)</div><div class="vval">${den1}</div></div>
        <div class="vmbox ${num1>=need1?'pass':'fail'}"><div class="vlab">과반 기준</div><div class="vval">${need1}</div></div>
      </div>
      <div>${handRows.map(p=>{
        const on=nom.hands.includes(p.id);
        const isDead=!p.alive;
        const butlerFlag = p.charId==='butler' && !isMalfunctioning(p);
        const master=S.players.find(q=>hasStatus(q,'master'));
        const masterUp = master && nom.hands.includes(master.id);
        return `<div class="voterow ${isDead?'deadrow':''}"><span class="vname">${esc(p.name)}${isDead?' 👻':''}</span>
          <button class="vbtn ${on?'sel-yes':''}" onclick="toggleHand('${nom.id}','${p.id}')">${on?'✋ 거수':'거수'}</button>
          ${isDead?'<span class="hint">👻 거수해야 2차 찬반에 참여할 수 있습니다 — 토큰은 2차에서 찬성/반대를 던질 때 소진</span>':''}
          ${butlerFlag?`<span class="hint">🤵 집사 — 주인(${master?esc(master.name):'미지정'})이 거수해야 유효${on&&!masterUp?' <mark>⚠ 지금 주인 미거수!</mark>':''}</span>`:''}
        </div>`;}).join('')}</div>
      <div class="row" style="margin-top:10px">
        <button class="primary" onclick="closeHands('${nom.id}')">${num1>=need1?'✅ 과반 달성 — 찬반 투표로':'거수 마감 (미달 → 부결)'}</button>
        <button class="ghost danger" onclick="cancelNom('${nom.id}')">지명 취소</button>
      </div></div>`;
  }
  /* 2단계 찬반 — 분모는 ballotEligible() 하나만 쓴다(closeBallot 과 같은 집합·같은 순서).
     생존자 ∪ 1차 거수자(사망자 포함). 거수 안 한 토큰 보유 사망자는 여기서 빠진다. */
  const eligible=ballotEligible(nom);
  /* 문턱(need2)의 기준 인원은 생존자다 — closeBallot 과 같은 계약(사망자 표는 분자에만 들어간다).
     분모(den2)는 화면 표시·찬성률 계산에만 쓴다. 화면과 확정이 같은 식을 써야
     '화면에선 통과인데 마감하면 부결' 같은 어긋남이 생기지 않는다. */
  const aliveN2=alivePlayers().length;
  const den2=eligible.length, need2=majority(aliveN2);
  const yes=eligible.filter(p=>nom.votes[p.id]==='yes').length;
  const no=eligible.filter(p=>nom.votes[p.id]==='no').length;
  const ratio=den2?yes/den2:0;
  const master=S.players.find(q=>hasStatus(q,'master'));
  return `<div class="card"><h2>진행 중 지명: ${torN} → ${neeN}</h2>
    ${notices.length?`<div class="alertbox">${notices.map(x=>`<div>· ${x}</div>`).join('')}</div>`:''}
    <h3>2단계 · 찬반 투표 (생존자 전원 + 1차에 거수한 사망자)</h3>
    ${(()=>{const i=S.players.findIndex(p=>p.id===nom.nominee); if(i<0) return '';
      const ord=[]; const n=S.players.length;
      for(let d=1;d<=n;d++){ ord.push(S.players[(i+d)%n]); }
      return `<div class="callorder">🔔 호명 순서(피지명자 왼쪽부터 시계 방향): ${ord.map(p=>`<span class="co ${p.alive?'':'dead'}">${esc(p.name)}</span>`).join('<span style="color:var(--muted)">→</span>')}</div>`;})()}
    <div class="votemath">
      <div class="vmbox"><div class="vlab">찬성(분자)</div><div class="vval" style="color:var(--ok)">${yes}</div></div>
      <div class="vmbox"><div class="vlab">반대</div><div class="vval" style="color:var(--evil)">${no}</div></div>
      <div class="vmbox"><div class="vlab">투표권(분모)</div><div class="vval">${den2}</div></div>
      <div class="vmbox ${yes>=need2?'pass':'fail'}"><div class="vlab">과반 기준(생존 ${aliveN2})</div><div class="vval">${need2}</div></div>
      <div class="vmbox ${yes>=need2?'pass':'fail'}"><div class="vlab">찬성률</div><div class="vval">${(ratio*100).toFixed(1)}%</div></div>
    </div>
    <div>${eligible.map(p=>{
      const v=nom.votes[p.id];
      const isDead=!p.alive;
      const butlerFlag = p.alive && p.charId==='butler' && !isMalfunctioning(p);
      const masterYes = master && nom.votes[master.id]==='yes';
      return `<div class="voterow ${isDead?'deadrow':''}">
        <span class="vname">${esc(p.name)}${isDead?' 👻':''}</span>
        <button class="vbtn ${v==='yes'?'sel-yes':''}" onclick="castVote('${nom.id}','${p.id}','yes')">찬성</button>
        <button class="vbtn ${v==='no'?'sel-no':''}" onclick="castVote('${nom.id}','${p.id}','no')">반대</button>
        <button class="vbtn ${v==='abs'?'sel-abs':''}" onclick="castVote('${nom.id}','${p.id}','abs')">기권</button>
        ${isDead?`<span class="hint">${p.deadVote===false?'⚠ 토큰 이미 소진 — 기권만 가능':'토큰 1회 — 찬성/반대 시 소진'}</span>`:''}
        ${butlerFlag?`<span class="hint">🤵 주인(${master?esc(master.name):'미지정'})이 찬성해야 유효${v==='yes'&&!masterYes?' <mark>⚠ 주인 미찬성!</mark>':''}</span>`:''}
      </div>`;}).join('')}</div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="closeBallot('${nom.id}')">찬반 마감</button>
      <button class="ghost danger" onclick="cancelNom('${nom.id}')">지명 취소</button>
    </div></div>`;
}
function findNom(id){ return S.noms.find(n=>n.id===id); }
function toggleHand(nid,pid){ const n=findNom(nid); const i=n.hands.indexOf(pid);
  if(i>=0)n.hands.splice(i,1); else n.hands.push(pid); save(); renderAll(); }
function closeHands(nid){ const n=findNom(nid); const den=alivePlayers().length, need=majority(den);
  if(n.hands.length>=need){ n.stage=2; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 통과, 찬반 투표로`); }
  else { n.closed=true; n.result='handsFail'; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 미달, 부결`); }
  save(); renderAll(); }
function castVote(nid,pid,v){
  const n=findNom(nid); const p=playerOf(pid);
  const prev=n.votes[pid];
  if(!p.alive){
    if(prev===v){ delete n.votes[pid]; if(v!=='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.id); log(`${p.name} 사망 투표 취소 — 토큰 복원`);} save(); renderAll(); return; }
    if((v==='yes'||v==='no') && !(prev==='yes'||prev==='no')){
      if(p.deadVote===false){ toast(`${p.name}은(는) 이미 투표 토큰을 소진했습니다.`,'warn'); return; }
      p.deadVote=false; if(!n.deadVoters.includes(p.id)) n.deadVoters.push(p.id);
      log(`👻 ${p.name} 사망 투표 참여(${v==='yes'?'찬성':'반대'}) — 토큰 자동 소진`);
    }
    if((prev==='yes'||prev==='no') && v==='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.id); log(`${p.name} 기권으로 변경 — 토큰 복원`); }
    n.votes[pid]=v; save(); renderAll(); return;
  }
  n.votes[pid] = prev===v? undefined : v;
  if(n.votes[pid]===undefined) delete n.votes[pid];
  save(); renderAll();
}
function closeBallot(nid){
  const n=findNom(nid);
  /* 분모는 화면(renderNomOpen)과 반드시 같아야 한다 — 같은 헬퍼 하나만 쓴다.
     생존자 ∪ 1차 거수자(사망자 포함). 거수 안 한 토큰 보유 사망자는 제외. */
  const uniq=ballotEligible(n);
  /* 표시용 분모(den)와 통과 문턱(need)의 기준 인원은 다르다 — 공식은 "A nomination requires
     votes from at least half the living players"로 문턱의 기준이 '살아 있는 플레이어'다.
     사망자 표는 분자에만 들어가고 기준 인원에는 들어가지 않는다. den 을 그대로 문턱에 쓰면
     사망자가 1차에 손만 들고 2차에서 기권해(토큰도 쓰지 않고) 문턱을 올려 처형을 막을 수 있다.
     1단계 closeHands 는 이미 alivePlayers() 기준이라 그쪽 계약과도 이걸로 맞는다. */
  const den=uniq.length, need=majority(alivePlayers().length);
  let yes=uniq.filter(p=>n.votes[p.id]==='yes').length;
  // 집사 무효표: 주인이 '찬성'하지 않았으면 집사의 찬성을 집계에서 뺀다
  // (공식: "주인이 투표할 때만 집사도 투표 가능" — 오작동 집사는 자유 투표라 제외)
  /* ── 무효 판정 → 가중 집계 순서 계약 ────────────────────────────────────
     찬반의 분자를 건드리는 규칙은 둘뿐이다: 여기(집사 무효표)와 여행자 표 가중(voting-F 래퍼).
       ① 무효 판정이 먼저다 — 이 함수가 결과를 n.butlerVoided 에 남긴다.
       ② 가중은 그 기록을 읽고 무효표를 대상에서 뺀다 — 무효 처리된 찬성표가 3표(또는 −3표)로
          되살아나지 않는다.
     그래서 판정은 마감할 때마다 처음부터 다시 내려야 한다. 지난 마감의 낡은 n.butlerVoided 가
     남아 있으면 이번에 유효해진 집사 표의 가중까지 함께 죽는다(닫힌 지명의 표를 사회자가
     고쳐 다시 마감하는 경로가 실제로 있다 — castVote 는 n.closed 를 막지 않는다).
     null 대입이 아니라 delete 인 이유: '무효 없음'의 표현을 undefined 하나로 유지해야
     n.butlerVoided 를 읽는 쪽(SABER OUT_BUTLER · 가중 래퍼)이 빈 값을 두 가지로 만나지 않는다. */
  delete n.butlerVoided;
  const butler=uniq.find(p=>p.alive && p.charId==='butler' && !isMalfunctioning(p));
  if(butler && n.votes[butler.id]==='yes'){
    const master=S.players.find(q=>hasStatus(q,'master'));
    if(!master || n.votes[master.id]!=='yes'){
      yes--; n.butlerVoided=butler.id;
      log(`🤵 집사(${butler.name}) 찬성 무효 — 주인${master?`(${master.name}) 미찬성`:' 미지정'} · 집계에서 제외`);
      toast(`집사 ${butler.name}의 찬성은 주인이 찬성하지 않아 무효 처리했습니다.`,'warn');
    }
  }
  n.yes=yes; n.den=den; n.need=need; n.ratio=den?yes/den:0;
  n.closed=true; n.result = yes>=need? 'pass':'yesFail';
  log(`찬반 마감: ${playerOf(n.nominee).name} — 찬성 ${yes}/${den} (기준 ${need}, ${(n.ratio*100).toFixed(1)}%) → ${n.result==='pass'?'과반 통과':'부결'}`);
  save(); renderAll();
}
function cancelNom(nid){
  const n=findNom(nid);
  // 취소된 지명의 투표는 없었던 일 — 소진된 사망 투표 토큰을 복원해야 한다
  if(n && (n.deadVoters||[]).length){
    n.deadVoters.forEach(id=>{ const p=playerOf(id); if(p) p.deadVote=true; });
    log(`👻 지명 취소 — 사망 투표 토큰 복원: ${n.deadVoters.map(id=>playerOf(id)?.name||id).join(', ')}`);
  }
  S.noms=S.noms.filter(x=>x.id!==nid); log('지명 취소'); save(); renderAll(); }
/* 처형은 사망과 별개다. 보호로 살아남아도 '오늘 처형은 있었다'가 성립한다 — 시장(공식 "no
   execution occurs")·하루 1처형 원칙·주모자 연장전이 그 값(S.executedToday)을 본다.
   반면 보르톡스는 공식 문구가 "if no-one died by execution"이라 '처형으로 실제 죽었나'
   (S.executedDiedToday)를 봐야 한다. 장의사도 같은 값이다. 두 축을 섞으면 보호로 무산된
   처형에서 판정이 통째로 뒤집히므로 여기서 반드시 갈라 둔다.
   일반 처형·성결자 발동이 이 함수를 공유한다. */
function resolveExecution(p, cause){
  const before=p.alive;
  S.executedToday=`${p.name} (${charName(p)})`; S.executedTodayPid=p.id; S.executedDiedToday=null;
  const blk=resolveDeath(p,{sourceType:'execution', cause:cause||''}).reason;
  if(blk){
    log(`⚔ ${p.name} 처형 — ${blk}로 사망하지 않음 (오늘의 처형은 소모)`);
    toast(`⚔ ${p.name} 처형 — ${blk}이므로 죽지 않았습니다. 오늘의 처형은 사용되었고(추가 처형 불가), 장의사에게는 아무 캐릭터도 보여주지 마세요.`,'warn');
    save(); renderAll(); return false;
  }
  killPlayer(p, cause);
  const died = before && !p.alive;                  // 어릿광대 1회 생존 등으로 버틴 경우 제외
  S.executedDiedToday = died? `${p.name} (${charName(p)})` : null;
  if(!died) toast(`⚔ ${p.name} 처형 — 그러나 죽지 않았습니다. 오늘의 처형은 사용되었고, 장의사에게는 아무 캐릭터도 보여주지 마세요.`,'warn');
  else toast(`${p.name} 처형. 오늘 밤 장의사에게 보여줄 캐릭터: ${charName(p)} (첩자/은둔자/주정뱅이면 등록 재량)`,'ok');
  save(); renderAll(); return died;
}
function executeNominee(nid){
  const n=findNom(nid); const p=playerOf(n.nominee);
  const saintCheck = p.charId==='saint' && !isMalfunctioning(p);
  if(saintCheck && !confirm(`🚨 ${p.name}은(는) 성자이며 오작동 상태가 아닙니다!\n처형을 확정하면 선한 팀이 패배합니다. 진행할까요?`)) return;
  /* resolveExecution 은 '실제로 죽었는가'를 boolean 으로 돌려준다 — 반환값을 버리면
     찻집 여인·악마의 변호사로 살아남은 성자에게도 악 승리를 공표하게 된다. 승리 엔진 쪽
     래퍼(evalWinEvent 'execute')는 p.alive 를 보고 물러나므로 두 판정이 정면으로 어긋난다.
     게다가 이 토스트 문자열은 toast 래퍼의 '승리 문자열 게이트'를 통과해 S.gameOver 도
     세우지 않은 채 종료 화면을 띄운다. 그래서 사망 여부로 게이트한다. */
  const saintDied = resolveExecution(p, `처형 (찬성 ${n.yes}/${n.den}, ${(n.ratio*100).toFixed(1)}%)`);
  if(saintCheck && saintDied){ toast('✝ 성자가 처형되었습니다 — 악한 팀 승리!','warn'); log('성자 처형 — 악 승리'); }
  else if(saintCheck){ toast('✝ 성자가 처형됐지만 죽지 않았습니다 — 성자 능력은 발동하지 않습니다(악 승리 아님).','warn'); log('성자 처형 — 사망하지 않아 악 승리 미성립'); }
}
function doSlayer(){
  const sl=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(!sl) return;
  const name=prompt('처단자가 지목한 플레이어 이름:'); const t=S.players.find(p=>p.name===name);
  if(!t){ toast('플레이어를 찾지 못했습니다.','warn'); return; }
  addStatus(sl,'slayerUsed','공개 지목',null);
  if(isMalfunctioning(sl)){ toast('처단자가 오작동 상태 — "아무 일도 일어나지 않습니다"라고 공표. 능력 소진.','warn'); log(`처단자 오발(오작동): ${t.name}`); save(); renderAll(); return; }
  const c=charOf(t.charId);
  if(c?.type==='demon' && t.alive){ killPlayer(t,'처단자의 일격'); toast(`😈 ${t.name}(악마) 즉사! 탕녀·생존자 수를 확인하세요.`,'warn'); }
  else if(t.charId==='recluse' && t.alive){
    if(confirm(`${t.name}은(는) 은둔자 — 악마로 등록시켜 죽일까요? (재량)`)){ killPlayer(t,'처단자의 일격(은둔자 악마 등록)'); toast('은둔자가 쓰러졌습니다 — 게임은 끝나지 않습니다. 태연하게!','warn'); }
    else { toast('"아무 일도 일어나지 않습니다" 공표.','ok'); log(`처단자 → 은둔자 ${t.name}: 미등록 처리`); }
  }
  else { toast('"아무 일도 일어나지 않습니다"라고 공표하세요.','ok'); log(`처단자 오발: ${t.name}`); }
  save(); renderAll();
}
</script>

<script>
/* ══════════════════ 상호작용 · 재량 가이드 탭 ══════════════════ */

];
const EFFECT_GUIDES = {
  info: {ko:'정보 제공형', steps:['능력 주인이 오작동인가? → 거짓 정보 가능(그럴듯하게, 한 번 준 거짓과 모순되지 않게)','첩자/은둔자가 판정에 걸리는가? → 등록 재량 결정','정답을 줄 경우: 이 정보가 게임을 즉시 끝내버리지 않는지(밸런스) 확인','무엇을 줬는지 그리모어 메모에 기록']},

const WIKI_TYPES=[['all','전체'],['townsfolk','주민'],['outsider','외지인'],['minion','하수인'],['demon','악마'],['traveler','여행자'],['fabled','전설']];

/* ══════════════ 재량 응대 도우미 확장 — 자유 텍스트 해석(요구 8) ══════════════
   외부 호출 없이 규칙 기반 결정 트리로 5개 신호(대상 규모·효과 유형·가역성·균형
   크기·공개성)를 뽑고, 현재 판 상태(생존/오작동/처형 예산/승리 근접도)와 함께
   EFFECT_GUIDES·DISCRETION_PRINCIPLES 를 조합해 구체적인 응대 절차를 만든다.
   genDiscretion 본문은 건드리지 않고 IIFE 로 감싸 결과 아래에 덧붙인다(반환값 보존). */
const DG_NUM_KO = {'한':1,'하나':1,'두':2,'둘':2,'세':3,'셋':3,'네':4,'넷':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10};
const DG_LEX = {
  info:['정보','알려','알고','알게','확인','보여','물어','묻','조회','진영','캐릭터','누가','누구','힌트','점쳐','점을','엿','읽','진실','들여다'],
  kill:['죽','살해','제거','목숨','사망','시체','부활','되살','살려','처형','찌르','공격','없애'],
  status:['중독','독을','취하','술취','보호','면역','상태','미치','저주','봉인','무력','침묵','막아','걸리게','씌우','지켜'],
  rule:['규칙','승리','패배','조건','투표','지명','표를','한 표','소원','바꾸','교환','변경','추가','한 번 더','되돌','시간을','부활시','예외']
};
function dgType(t){
  const sc={}; let best='rule', bestN=-1;
  ['kill','rule','status','info'].forEach(k=>{
    sc[k]=DG_LEX[k].reduce((n,w)=>n+(t.indexOf(w)>=0?1:0),0);
    if(sc[k]>bestN){ bestN=sc[k]; best=k; }
  });
  return {primary: bestN>0? best : null, scores: sc};
}
function dgScope(t){
  if(/전원|모두|모든|전체|일괄|다 함께/.test(t)) return {n:'all', ko:'전원'};
  let m=t.match(/(\d+)\s*(명|인|사람)/);
  if(m) return {n:+m[1], ko:m[1]+'명'};
  m=t.match(/(하나|한|둘|두|셋|세|넷|네|다섯|여섯|일곱|여덟|아홉|열)\s*(명|사람)/);
  if(m&&DG_NUM_KO[m[1]]) return {n:DG_NUM_KO[m[1]], ko:DG_NUM_KO[m[1]]+'명'};
  if(/이웃|양옆|옆사람/.test(t)) return {n:2, ko:'이웃 2명'};
  if(/자신|본인|스스로|자기/.test(t)) return {n:1, ko:'자신 1명'};
  return {n:1, ko:'1명(명시 없음 — 기본 가정)'};
}
function dgRevert(t,type){
  if(/영구|영원|게임 내내|끝까지|되돌릴 수 없|영영/.test(t)) return {ok:false, ko:'비가역 — 영구 효과로 명시됨'};
  if(/오늘 밤|이 밤|이번 밤|오늘 낮|하루|다음 낮까지|한 번만|일시|잠깐|잠시/.test(t)) return {ok:true, ko:'가역 — 기간이 명시됨'};
  if(type==='kill') return {ok:false, ko:'비가역 — 사망·부활은 되돌릴 수 없다'};
  if(type==='rule') return {ok:false, ko:'사실상 비가역 — 한 번 내린 해석은 판 내내 유지된다'};
  return {ok:true, ko:'기간을 지금 정하면 가역'};
}
function dgMag(t,type,scope){
  let m={info:1,status:2,kill:3,rule:3}[type]||2;
  if(scope.n==='all') m+=2; else if(typeof scope.n==='number'&&scope.n>=3) m+=1;
  if(/승리|패배|게임 끝|게임 종료|이긴다|진다|끝내/.test(t)) m+=2;
  if(/악마|데몬/.test(t)) m+=1;
  if(/부활|되살|살려|시체/.test(t)) m+=1;
  if(/살짝|약간|작은|소소|힌트만|조금/.test(t)) m-=1;
  return Math.max(1,Math.min(5,m));
}
function dgVis(t){
  if(/공개|공표|발표|모두에게|전체에게|광장|선언|다 같이 듣/.test(t)) return {pub:true, ko:'공개 — 다른 플레이어에게 드러난다'};
  if(/비밀|몰래|조용|아무도 모르게|밤에만|은밀|귓속/.test(t)) return {pub:false, ko:'비밀 — 본인만 안다'};

}
function dgSnapshot(){
  const al=alivePlayers(), alive=al.length;
  const mal=al.filter(isMalfunctioning).length;
  const evil=al.filter(isEvil).length, good=alive-evil;
  const demon=al.filter(p=>{ const c=charOf(p.charId); return !!c && c.type==='demon'; }).length;
  const budget=Math.max(0, alive-3);
  const days=Math.max(0, Math.ceil((alive-2)/2));
  let near='균형 — 어느 쪽으로도 기울지 않음';
  if(!S.players.length) near='플레이어 미등록 — 상태 반영 없음';
  else if(alive===0) near='생존자 0 — 판 종료 상태';
  else if(demon===0) near='악마 생존 0 — 선 승리 판정을 먼저 확인하라';
  else if(alive<=3) near='생존 3명 이하 — 악 승리 1수 앞. 처형 하나가 판을 끝낸다';
  else if(evil*2>=alive) near='악 우세 — 균형 원칙상 선 쪽에 유리한 재량을 검토';
  else if(good>=evil*3) near='선 우세 — 정보를 흐리거나 대가를 키우는 재량을 검토';
  return {alive, mal, evil, good, demon, budget, days, near, total:S.players.length};
}

}
/* 신호 + 판 상태로 만드는 부작용·대가 설계 */
function dgCosts(sig,snap){
  const c=[];
  if(sig.mag>=4) c.push('큰 개입 — 눈에 보이는 흔적을 반드시 남겨라(같은 밤 다른 플레이어 1명이 중독되거나, 다음 정보 1개가 거짓이 되는 식).');
  else if(sig.mag>=3) c.push('중간 개입 — 요청자 본인에게만 대가를 붙여라(다음 밤 자기 능력 1회 불발 등).');
  else c.push('작은 개입 — 대가 없이 들어줘도 균형이 깨지지 않는다. 대신 같은 요청이 반복될 때의 상한을 지금 정해라.');
  if(!sig.revert.ok) c.push('비가역 효과는 1회 상한을 명시하라 — "게임당 한 번"을 그리모어에 적고 소진 여부를 표시한다.');
  if(sig.scope.n==='all'||(typeof sig.scope.n==='number'&&sig.scope.n>=3)) c.push('다수 대상 — 대상 목록을 지금 확정해 적어라. 사후에 "그때 누구까지였지"가 되면 판정이 무너진다.');
  if(snap.mal>0) c.push('현재 오작동 인원 '+snap.mal+'명 — 이 효과의 주인이 그중 하나면 대가 없이 "불발"이 곧 결과다. 티 내지 말고 평소 템포로 응대하라.');
  if(snap.demon>0 && snap.alive<=4) c.push('생존자 '+snap.alive+'명 — 지금의 대가는 곧 사망 1명과 같다. 대가를 붙이려면 판을 끝내지 않는 것으로 골라라.');
  return c;
}
function dgRecords(sig,c){
  const r=['요청 원문(그대로) · 요청 시점(' + phaseName() + ')',
    '내가 내린 판정과 그 근거 원칙 1줄',
    '붙인 대가·부작용과 그 발동 시점'];
  if(sig.type==='status') r.push('부여한 상태 토큰과 자동 해제 시점(그리모어 토큰으로 등록)');
  if(sig.type==='info') r.push('실제로 준 정보(진실/거짓 여부 포함) — 다음 정보와 모순되면 안 된다');
  if(sig.type==='kill') r.push('사망 처리 여부와 차단 사유(보호·면역·대체 사망)');
  if(c&&c.id) r.push('"'+c.ko+'" 1회성 능력이면 소진 여부 표시');
  return r;
}
function dgAnnounce(sig){
  if(sig.vis.pub===true) return ['공개로 결정했다면 낮 시작 시 한 문장으로만 말하라 — 이유·출처는 붙이지 않는다.',
    '예: "오늘 아침, 마을에 이상한 일이 있었습니다. ○○에게 일어난 일입니다." (누구의 능력인지는 말하지 않는다)'];
  if(sig.vis.pub===false) return ['비밀로 결정했다면 아무것도 공표하지 않는다 — 밤 템포·낮 표정을 평소와 똑같이 유지하라.',
    '나중에 흘릴 단서를 지금 하나 정해 두라(예: 3일차에 특정 정보가 어긋나게 나온다).'];
  return ['공개/비밀을 아직 안 정했다 — 정보 은닉 원칙상 기본값은 "비밀"이다. 공개는 극적 효과가 확실할 때만.',
    '공개한다면 문장을 미리 적어 두라. 즉흥으로 말하면 능력 출처가 새어 나간다.'];
}
/* 신호에 맞게 6원칙을 재정렬 */
function dgPrinciples(sig,snap){
  const idx={}, w={};
  DISCRETION_PRINCIPLES.forEach(([t],i)=>{ w[t]=0; idx[t]=i; });
  if(snap.mal>0) w['오작동 우선 확인']+=10;
  if(sig.mag>=4||snap.alive<=4) w['균형']+=8;
  if(sig.type==='rule') w['거짓말 금지']+=6, w['일관성']+=5;
  if(sig.type==='info') w['정보 은닉']+=4, w['일관성']+=4;
  if(sig.type==='kill') w['정보 은닉']+=6;
  if(sig.type==='status') w['일관성']+=4;
  if(!sig.revert.ok) w['일관성']+=3;
  if(sig.vis.pub===null) w['정보 은닉']+=3;
  if(sig.mag<=2) w['재미']+=3;
  return DISCRETION_PRINCIPLES.slice().sort((a,b)=> (w[b[0]]-w[a[0]]) || (idx[a[0]]-idx[b[0]]) );
}
function dgAdvice(desc, cid, picked){
  const t=String(desc||'');
  const c = (cid && cid!=='_other') ? charOf(cid) : null;
  const det=dgType(t);
  const type=det.primary||picked||'info';
  const scope=dgScope(t), revert=dgRevert(t,type), vis=dgVis(t);
  const mag=dgMag(t,type,scope);
  const sig={type, scope, revert, vis, mag, matched:!!det.primary};
  const snap=dgSnapshot();
  const g=EFFECT_GUIDES[type]||EFFECT_GUIDES.info;
  const bar='●'.repeat(mag)+'○'.repeat(5-mag);
  const chip=(k,v)=>'<span class="pill" style="margin:0 6px 6px 0;display:inline-block">'+esc(k)+' · '+esc(v)+'</span>';
  let h='<div class="alertbox" style="margin-top:12px"><b>🧭 요청 해석 — 응대 절차</b>';
  if(!t) h+='<div class="hint" style="margin-top:4px">상황 설명이 비어 있어 신호를 뽑지 못했습니다. 아래 원칙 순서대로만 판단하세요.</div>';
  else if(!det.primary) h+='<div class="hint" style="margin-top:4px">문장에서 유형 신호를 찾지 못해 선택하신 유형(' + esc(g.ko) + ')으로 진행합니다. 아래 원칙 순서를 우선 적용하세요.</div>';
  h+='<div style="margin-top:8px">'+chip('효과 유형',g.ko+(det.primary&&det.primary!==picked?' (문장에서 감지 — 선택값과 다름)':''))
    +chip('대상 규모',scope.ko)+chip('가역성',revert.ko)+chip('공개성',vis.ko)+chip('균형 영향',bar+' '+mag+'/5')+'</div>';
  const others=Object.keys(det.scores).filter(k=>k!==type&&det.scores[k]>0);
  if(others.length) h+='<div class="hint">복합 효과 감지: '+others.map(k=>esc(EFFECT_GUIDES[k].ko)).join(' · ')+' 절차도 함께 확인하세요.</div>';
  if(mag>=4&&type!=='rule') h+='<div class="hint">균형 영향이 커서 <b>'+esc(EFFECT_GUIDES.rule.ko)+'</b> 절차를 함께 적용합니다.</div>';

  h+='<h3 style="font-size:14px;margin:14px 0 4px">① 먼저 되물을 것</h3><ol class="guide">'
    +dgQuestions(sig).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';

  h+='<h3 style="font-size:14px;margin:14px 0 4px">② 판정 절차</h3><ol class="guide">'
    +g.steps.map(x=>'<li>'+esc(x)+'</li>').join('')
    +((mag>=4&&type!=='rule')? EFFECT_GUIDES.rule.steps.map(x=>'<li>'+esc('[대형 개입] '+x)+'</li>').join('') : '')
    +'</ol>';

  h+='<h3 style="font-size:14px;margin:14px 0 4px">③ 부작용·대가를 미리 정하기</h3><ul class="guide">'
    +dgCosts(sig,snap).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';

  h+='<h3 style="font-size:14px;margin:14px 0 4px">④ 공표 방법</h3><ul class="guide">'
    +dgAnnounce(sig).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';

  h+='<h3 style="font-size:14px;margin:14px 0 4px">⑤ 기록할 것</h3><ul class="guide">'
    +dgRecords(sig,c).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';

  h+='<h3 style="font-size:14px;margin:14px 0 4px">⑥ 지금 판 상태</h3>'
    +'<div class="checkitem"><b style="min-width:110px">생존</b><span>'+snap.alive+'명 / 전체 '+snap.total+'명 (선 '+snap.good+' · 악 '+snap.evil+' · 악마 '+snap.demon+')</span></div>'
    +'<div class="checkitem"><b style="min-width:110px">오작동</b><span>'+snap.mal+'명 (중독·술취함·주정뱅이)</span></div>'
    +'<div class="checkitem"><b style="min-width:110px">처형 예산</b><span>생존 3명까지 여유 '+snap.budget+'회 · 남은 낮 약 '+snap.days+'일(밤 사망 1 + 처형 1 가정)</span></div>'
    +'<div class="checkitem"><b style="min-width:110px">승리 근접도</b><span>'+esc(snap.near)+'</span></div>';

  h+='<h3 style="font-size:14px;margin:14px 0 4px">⑦ 이 판정에 적용할 원칙(순서)</h3>'
    +dgPrinciples(sig,snap).map((p,i)=>'<div class="checkitem"><b style="min-width:110px">'+(i+1)+'. '+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div>').join('');

  h+='</div>';
  return h;
}
genDiscretion = (function(orig){
  return function(){
    const ret = orig.apply(this, arguments);
    try{
      const box=$('#dg-out'); if(!box) return ret;
      const dEl=$('#dg-desc'), cEl=$('#dg-char'), tEl=$('#dg-type');
      box.insertAdjacentHTML('beforeend', dgAdvice(dEl?dEl.value.trim():'', cEl?cEl.value:'', tEl?tEl.value:'info'));
    }catch(e){ console.warn('재량 응대 확장 실패', e); }
    return ret;
  };
})(genDiscretion);

/* ══════════════════ 체크리스트 탭 (시트별 잊지 말 것) ══════════════════ */
function buildChecklist(){
  const items=[]; const add=(group,src,txt)=>items.push({group,src,txt,key:group+'|'+src+'|'+txt});
  const inPlay=id=>S.players.some(p=>p.charId===id);
  // 셋업
  if(inPlay('baron')) add('셋업','남작','구성 변경 적용 확인: 마을 주민 −2 / 외지인 +2');
  /* 시트를 갈아끼우면 S.drunkMaskChar 가 현재 후보 밖 id 로 남는다(importScript 는 좌석의 유령
     charId 만 끊고 이 필드는 손대지 않는다) — 널 역참조로 체크리스트 탭이 통째로 빈 화면이 되던 자리 */
  if(inPlay('drunk')) add('셋업','주정뱅이',`위장 캐릭터 지정(현재: ${(S.drunkMaskChar&&charOf(S.drunkMaskChar)?.ko)||'⚠ 미지정'}) — 본인에게는 그 주민 토큰을 보여줄 것`);
  if(inPlay('fortuneteller')) add('셋업','점쟁이',`붉은 청어 지정(현재: ${S.redHerringId?playerOf(S.redHerringId)?.name:'⚠ 미지정'}) — 게임 내내 유지`);
  add('셋업','공통','7인 이상이면 첫날 밤 하수인 정보 → 악마 정보(블러프 3개) 순서 진행');
  // 매일 밤
  if(inPlay('poisoner')) add('매일 밤','독살범','새 중독 대상 기록 — 이전 독은 황혼에 자동 해제되었는지 확인');
  if(inPlay('monk')) add('매일 밤','수도사','보호 대상 갱신 — 보호는 그 밤만, 새벽 자동 해제');
  if(inPlay('butler')) add('매일 밤','집사','주인 갱신 — 다음 날 투표 제한에 직결');
  if(inPlay('empath')) add('매일 밤','초공감자','이웃 사망 시 "살아있는 이웃" 재계산');
  if(inPlay('undertaker')) add('매일 밤','장의사','어제 처형이 있었을 때만 깨움 — 성결자 발동 처형 포함');
  if(inPlay('spy')) add('매일 밤','첩자','밤 순서 맨 끝에 그리모어 공개 — 충분한 시간');
  if(inPlay('drunk')) add('매일 밤','주정뱅이','위장 캐릭터 순서에 깨워 일관된 거짓 정보 — 지난 밤에 준 정보 메모 확인');
  // 낮·투표
  if(inPlay('virgin')) add('낮·투표','성결자','최초 지명 시 발동 판정 — 지명자가 주민인지, 성결자가 중독인지');
  if(inPlay('saint')) add('낮·투표','성자','처형 확정 전 중독 여부 확인 — 정상이면 선 패배');
  if(inPlay('butler')) add('낮·투표','집사','주인이 거수/찬성했는지 매 투표 확인');
  if(inPlay('slayer')) add('낮·투표','처단자','공개 지목 시 즉시 판정 — 오작동/은둔자 등록 재량, 성공·실패 무관 소진');
  if(inPlay('mayor')) add('낮·투표','시장','생존 3명이 되면: 처형 없이 낮 종료 = 선 승리(오작동 확인)');
  if(inPlay('scarletwoman')) add('낮·투표','탕녀','악마 사망 시 생존자 5+ 확인 → 계승, 게임 계속. 그녀가 중독이면 계승 불발!');
  if(inPlay('recluse')) add('낮·투표','은둔자','정보·처단자·처형 판정마다 악 등록 여부를 의식적으로 결정');
  if(inPlay('imp')) add('낮·투표','임프','임프 처형·사망 시: 탕녀 → 없으면 게임 종료 선언');
  if(inPlay('soldier')) add('참고','군인','임프 공격 무효 — 단 중독 밤엔 죽는다');
  if(inPlay('ravenkeeper')) add('참고','까마귀지기','밤 사망 시 즉시 발동 — 잊기 쉬움! 임프 살해 판정 직후 확인');
  /* 에디션 공통: 인플레이 캐릭터의 remind·setupNote 자동 편입.
     TB 본편 22종은 위 하드코딩 사슬이 이미 덮으므로 제외하지만, TB 여행자 5종(희생양·총잡이·
     거지·관료·도둑)은 그 사슬에 아예 없어서 remind 가 어디에도 뜨지 않았다 — 여행자는 통과시킨다. */
  /* 원천은 allChars() 여야 한다 — editionChars() 는 S.edition 으로 걸러서 edition:'exp'·'loric'
     캐릭터는 좌석에 앉아 있어도 이 루프에 아예 들어오지 못했다. 같은 캐릭터의 dayNotice 를
     voteNotices() 는 allChars() 로 낮 패널에 띄우므로, 두 화면이 한 판을 두고 다른 말을 했다.
     인플레이 판정은 바로 아래 좌석·S.fabled 검사가 하므로 에디션 필터는 붙이면 안 된다. */
  allChars().filter(c=>!c.custom && ((c.edition||'tb')!=='tb' || c.type==='traveler')).forEach(c=>{
    /* 전설은 좌석을 차지하지 않는다 — 활성 목록(S.fabled)이 인플레이 판정의 출처다
       (좌석 배정도 isFabledActive 안에서 하위호환으로 함께 본다). */
    if(!(c.type==='fabled'? isFabledActive(c.id) : S.players.some(p=>p.charId===c.id))) return;
    if(c.setupNote) add('셋업', c.ko, c.setupNote);
    (c.remind||[]).forEach(r=>add('매일 밤', c.ko, r));
    if(c.dayNotice) add('낮·투표', c.ko, c.dayNotice.replace(/^[^ ]+ /,''));
  });
  // 커스텀
  (S.customs||[]).forEach(c=>{
    if(S.players.some(p=>p.charId===c.id)){
      (c.reminders||[]).forEach(r=>add('커스텀',c.ko,r));
      if(!(c.reminders||[]).length) add('커스텀',c.ko,'커스텀 캐릭터 — 상호작용 검증 필요(제작자에게 시트 검토 요청)');
    }
  });
  return items;
}

function delCustom(id){ S.customs=S.customs.filter(c=>c.id!==id); S.players.forEach(p=>{if(p.charId===id)p.charId='';}); save(); renderAll(); }
function exportScript(){

  navigator.clipboard?.writeText(data).then(()=>toast('시트 JSON 복사됨 — Claude에게 붙여넣어 검증을 요청하세요.','ok'),()=>prompt('복사하세요:',data));
}
/* 가져온 시트는 신뢰할 수 없다 — 스키마·타입·길이를 검증하고 id 를 안전한 형태로 재발급한다. */
function importScript(){
  const raw=prompt('시트 JSON을 붙여넣으세요:'); if(!raw)return;
  let d; try{ d=JSON.parse(raw); }catch(e){ toast('JSON 파싱 실패','warn'); return; }
  /* {name, author, characters:[id…]} 는 downloadScriptJSON·botcscripts·공식 스크립트 툴의 배포
     형식이다. 여기서 거절하면 방금 자기가 내보낸 JSON 조차 되돌릴 수 없고, 억지로 customs 로
     감싸면 RESERVED(=CHARACTERS 전 id, 실험 74종 포함)에 걸려 id 가 cx_ 로 재발급돼 앱이 이미
     가진 능력문·가이드·밤 순서가 하나도 붙지 않는다. 그 형식을 정확히 처리하는 빌더
     가져오기(doImport)가 이미 있으므로 — 기존 id 는 재발급하지 않고 내 스크립트로 등록하고
     미지의 id 만 따로 알린다 — 사용자에게 다시 붙여넣게 하지 않고 파싱 결과를 그대로 넘긴다. */
  if(d && !Array.isArray(d.customs) && Array.isArray(d.characters)
     && typeof window!=='undefined' && window.thyBuilder && typeof window.thyBuilder.importJSON==='function'){
    window.thyBuilder.importJSON(d);
    return;
  }
  if(!d || !Array.isArray(d.customs)){ toast('customs 배열도 characters 배열도 없습니다.','warn'); return; }
  /* 진행 중 교체는 밤 순서·체크리스트·배정을 그 자리에서 바꿔버린다 — 되돌릴 수 없으므로 확인받는다 */
  if(S.phase.kind!=='setup' && !confirm(`게임 진행 중입니다(${phaseName()}).\n시트를 교체하면 밤 순서·체크리스트가 즉시 새 시트 기준으로 바뀌고,\n새 시트에 없는 캐릭터를 쥔 좌석은 배정이 해제됩니다.\n계속할까요?`)) return;
  const str=v=>typeof v==='string'? v.slice(0,400):'';
  const arr=v=>Array.isArray(v)? v.filter(x=>typeof x==='string').map(x=>x.slice(0,400)).slice(0,20):[];
  const TYPES=['townsfolk','outsider','minion','demon','traveler','fabled'];
  /* id 는 조용한 오작동의 근원이다 — 기본 캐릭터나 밤 순서 정보 단계(minioninfo·demoninfo)와
     같은 id 를 쓰면 charOf() 가 CHARACTERS 를 먼저 찾고 nightSteps() 가 INFO_STEPS 분기를
     먼저 타서, 가져오기는 성공한 것처럼 보이는데 그 커스텀은 통째로 가려진다.
     차단하지 않는다 — 새 id 를 발급하고, 그 id 를 가리키던 밤 순서 기준까지 같이 옮긴 뒤
     무엇을 바꿨는지 알린다. */
  const RESERVED=new Set(
    (typeof CHARACTERS!=='undefined'? CHARACTERS.map(c=>c.id):[])
      .concat(typeof INFO_STEPS!=='undefined'? Object.keys(INFO_STEPS):[]));
  const remap=Object.create(null), reissued=[];
  const seen=new Set();
  S.customs=d.customs.slice(0,60).filter(c=>c&&typeof c==='object'&&!Array.isArray(c)).map(c=>{
    const raw=(typeof c.id==='string' && /^[A-Za-z0-9_-]{1,64}$/.test(c.id))? c.id : null;
    let id=raw||('cx_'+uid());
    if(raw && RESERVED.has(raw)){
      id='cx_'+uid();
      if(!remap[raw]) remap[raw]=id;   /* 같은 예약 id 가 여러 번 오면 앵커는 첫 건만 따라간다 */
      reissued.push((typeof c.ko==='string'&&c.ko.trim()? c.ko.trim().slice(0,30):raw)+'('+raw+')');
    }
    while(seen.has(id)||RESERVED.has(id)) id='cx_'+uid();
    seen.add(id);
    return { id, ko:str(c.ko)||'(이름 없음)', en:str(c.en), type:TYPES.includes(c.type)?c.type:'townsfolk',
      ability:str(c.ability)||'(능력 미기재)', first:!!c.first, other:!!c.other,
      firstAfter:typeof c.firstAfter==='string'?c.firstAfter:null,
      otherAfter:typeof c.otherAfter==='string'?c.otherAfter:null,
      voteRelated:!!c.voteRelated, voteNote:str(c.voteNote),
      reminders:arr(c.reminders), warn:arr(c.warn), custom:true };
  });
  /* 재발급된 id 를 기준으로 삼던 커스텀의 앵커를 새 id 로 옮긴다 — 안 옮기면 그 커스텀만 밤 맨 끝으로 밀린다 */
  S.customs.forEach(c=>{ ['firstAfter','otherAfter'].forEach(k=>{ if(c[k]&&remap[c[k]]) c[k]=remap[c[k]]; }); });
  /* 밤 순서 기준 존재 검증 — 어느 에디션 밤 순서에도, 다른 커스텀에도 없는 이름은
     nightSteps() 에서 조용히 맨 끝(악마 살해 뒤)으로 밀린다. 값은 그대로 두고 알리기만 한다:
     아직 만들지 않은 캐릭터를 미리 적어 둔 시트일 수도 있다. */
  const anchorOK=new Set(S.customs.map(c=>c.id));
  if(typeof EDITIONS!=='undefined') Object.keys(EDITIONS).forEach(k=>{
    const e=EDITIONS[k]||{};
    (Array.isArray(e.first)? e.first:[]).forEach(x=>anchorOK.add(x));
    (Array.isArray(e.other)? e.other:[]).forEach(x=>anchorOK.add(x));
  });
  const badAnchor=[];
  S.customs.forEach(c=>{
    if(c.first && c.firstAfter && !anchorOK.has(c.firstAfter)) badAnchor.push(c.ko+'·첫날 밤');
    if(c.other && c.otherAfter && !anchorOK.has(c.otherAfter)) badAnchor.push(c.ko+'·그 외 밤');
  });
  /* 순환 참조 — A 는 B 다음, B 는 A 다음. 삽입 시점에 기준이 아직 없어 둘 다 맨 끝으로 밀린다. */
  const cycIds=new Set(), byId=Object.create(null);
  S.customs.forEach(c=>{ byId[c.id]=c; });
  ['firstAfter','otherAfter'].forEach(k=>{
    S.customs.forEach(c=>{
      const path=[], on=Object.create(null); let cur=c, g=0;
      while(cur && g++<=S.customs.length+1){
        if(on[cur.id]){ path.slice(path.indexOf(cur.id)).forEach(x=>cycIds.add(x)); break; }
        on[cur.id]=1; path.push(cur.id); cur=byId[cur[k]];
      }
    });
  });
  const impNotes=[];
  if(reissued.length) impNotes.push(`기본 캐릭터와 겹친 id ${reissued.length}건에 새 id 를 발급했습니다(${reissued.slice(0,3).join(', ')}${reissued.length>3?' 외':''})`);
  if(badAnchor.length) impNotes.push(`밤 순서 기준을 찾을 수 없는 항목 ${badAnchor.length}건(${badAnchor.slice(0,3).join(', ')}${badAnchor.length>3?' 외':''}) — 그대로 두면 밤 맨 끝으로 밀립니다`);
  if(cycIds.size) impNotes.push(`밤 순서 기준이 서로를 가리킵니다 — ${[...cycIds].map(id=>byId[id]?byId[id].ko:id).join(' → ')}`);
  if(impNotes.length) setTimeout(()=>toast('가져오기 주의 — '+impNotes.join(' / '),'warn'), 1200);
  /* 시트를 갈아끼우면 사라진 커스텀을 쥔 좌석은 유령 charId 가 된다 — charOf() 가 못 찾아
     밤 순서·구성 집계·승리 판정에서 조용히 빠진다. delCustom 과 같은 규칙으로 끊고 알린다. */
  const liveIds=new Set(CHARACTERS.map(c=>c.id).concat(S.customs.map(c=>c.id)));
  const orphans=S.players.filter(p=>p.charId && !liveIds.has(p.charId));
  orphans.forEach(p=>{ p.charId=''; });
  save(); renderAll(); toast(`가져오기 완료 — ${S.customs.length}종 (id·필드 검증 적용)`,'ok');
  if(orphans.length) setTimeout(()=>toast(`⚠ 새 시트에 없는 캐릭터를 쥐고 있던 ${orphans.length}개 좌석의 배정을 해제했습니다 — ${orphans.map(p=>p.name).join(', ')}. 다시 배정하세요.`,'warn'), 700);
}
document.addEventListener('click', e=>{
  const b=e.target.closest && e.target.closest('[data-delcustom]');
  if(b) delCustom(b.getAttribute('data-delcustom'));
});

/* ══════════════════ 초기화 ══════════════════ */
function renderAll(){
  /* 분기 객체는 매 호출마다 새로 만든다 — 값으로 미리 붙잡으면 나중에 얹히는 래퍼를 우회한다.
     stats·profile 만 화살표인 이유: renderStats·renderProfile 은 아래 스크립트 블록에서
     정의되므로 이름을 즉시 평가하면 첫 renderAll() 에서 ReferenceError 가 난다. */
  const draw={scripts:renderScripts, setup:renderSetup, sheet:renderSheet, grim:renderGrim, night:renderNight, day:renderDay, guide:renderGuide, check:renderCheck, custom:renderCustom, stats:()=>renderStats(), profile:()=>renderProfile()}[activeTab];
  /* 모르는 탭(잘못된 해시·구버전 저장본)이 들어오면 $('#pane-'+activeTab) 가 null 이라
     여기서 앱 전체가 죽는다. 기본 탭으로 되돌리고 한 번만 다시 그린다(무한 재귀 방지). */
  if(typeof draw!=='function' || !$('#pane-'+activeTab)){
    if(activeTab==='scripts') return;
    activeTab='scripts';
    return renderAll();
  }
  renderTabs(); renderTopbar();
  document.querySelectorAll('.tabpane').forEach(s=>s.classList.remove('active'));
  $('#pane-'+activeTab).classList.add('active');
  draw();
}
/* ⚠ 여기서 advancePhase 를 '값'으로 붙잡으면, 이 줄 아래에서 래핑된 버전
   (낮 타이머 정리 · nightSnapshot 갱신 · 보르톡스/시장 낮종료 판정)이 상단
   진행 버튼에서 통째로 우회된다. 반드시 호출 시점에 이름을 다시 해석해야 한다. */
$('#advbtn').onclick=()=>advancePhase();
$('#themebtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?null:'dark';
  if(next) document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
  S.theme=next||'auto'; save();
};
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme',S.theme);
if(S.phase.kind==='night') activeTab='night'; else if(S.phase.kind==='day') activeTab='day'; else activeTab='scripts';
renderAll();

<script>
/* ══════════════════ 통계 탭: 평점 · 전광판(MMR) · 판 기록 ══════════════════
   점수 계산은 별도 점수 엔진(scorePlayer · matchMVP · scoreTimeline)에 위임하고
   여기서는 표시만 담당한다 — 엔진이 아직 없으면 안내만 띄운다(typeof 방어).
   판 기록은 S.history(종료 시 다른 모듈이 기록)를 읽기만 하므로 신규 영속 필드 없음. */

const STATS_MIN_GAMES = 3;              // 이 판수 미만은 '배치 중'
const statsOpenHist = new Set();        // 펼쳐진 판 기록 인덱스(세션 한정, 비영속)

function statsEngineReady(){
  return typeof scorePlayer==='function' && typeof matchMVP==='function';
}
/* 평점을 0~10 사이 유한수로 정규화 — 아니면 null */
function statsNum(v){
  const n=Number(v);
  return Number.isFinite(n)? Math.max(0, Math.min(10, n)) : null;
}
/* op.gg 풍 점수대 배지: 9+ 보라 · 8+ 파랑 · 6+ 초록 · 4+ 호박 · 그 외 회색 */
function statsTier(score){
  const n=statsNum(score);
  if(n===null) return {cls:'rt-x', ko:'—'};
  if(n>=9) return {cls:'rt-s', ko:'탁월'};
  if(n>=8) return {cls:'rt-a', ko:'우수'};
  if(n>=6) return {cls:'rt-b', ko:'준수'};
  if(n>=4) return {cls:'rt-c', ko:'분전'};
  return {cls:'rt-d', ko:'고전'};
}
function statsBadge(score){
  const t=statsTier(score), n=statsNum(score);
  return `<span class="rbadge ${t.cls}"><b class="num">${n===null?'—':n.toFixed(1)}</b><span>${t.ko}</span></span>`;
}
/* 엔진 호출부 — 시그니처 편차(플레이어 객체/pid)를 흡수한다 */
function statsScoreOf(p){
  if(typeof scorePlayer!=='function' || !p) return null;
  let v=null;
  try{ v=statsNum(scorePlayer(p)); }catch(e){}
  if(v===null){ try{ v=statsNum(scorePlayer(p.id)); }catch(e){} }
  return v;
}
/* matchMVP() 반환값이 플레이어 객체·id·이름 어느 쪽이어도 pid 로 정규화 */
function statsMvpPid(){
  if(typeof matchMVP!=='function') return null;
  let m=null; try{ m=matchMVP(); }catch(e){ return null; }
  if(!m) return null;
  if(typeof m==='object') return m.id||null;
  if(typeof m==='string'){
    if(playerOf(m)) return m;
    const byName=S.players.find(p=>p.name===m);
    return byName? byName.id : null;
  }
  return null;
}
/* scoreTimeline() 결과를 {labels, series:[{name, points:[숫자|null]}]} 로 정규화 */
function statsTimelineSeries(){
  if(typeof scoreTimeline!=='function') return null;
  let raw=null; try{ raw=scoreTimeline(); }catch(e){ return null; }
  if(!raw) return null;
  let labels=null, list=raw;
  if(!Array.isArray(raw) && typeof raw==='object'){
    if(Array.isArray(raw.series)){ list=raw.series; labels=Array.isArray(raw.labels)? raw.labels : null; }
    else list=Object.entries(raw).map(([k,v])=>({key:k, points:v}));
  }
  if(!Array.isArray(list)) return null;
  const series=list.map(sr=>{
    if(!sr||typeof sr!=='object') return null;
    const pts=[sr.points, sr.values, sr.scores, sr.data].find(a=>Array.isArray(a)&&a.length);
    if(!pts) return null;
    const key=sr.pid||sr.id||sr.key||null;
    const via=key? playerOf(key) : null;
    const nm=sr.name || (via&&via.name) || key || '?';
    return {name:String(nm), points:pts.map(statsNum)};
  }).filter(Boolean).filter(sr=>sr.points.some(n=>n!==null));
  return series.length? {labels, series} : null;
}
/* 인라인 SVG 라인차트 — viewBox 640×240, y축 0~10 고정, 외부 라이브러리 없음 */
function statsChartSVG(tl){
  const W=640, H=240, L=34, R=12, T=14, B=30;
  const iw=W-L-R, ih=H-T-B;
  const len=Math.max(...tl.series.map(s=>s.points.length));
  if(len<1) return '';
  const x=i=> L + (len<2? iw/2 : iw*i/(len-1));
  const y=v=> T + ih*(1-Math.max(0,Math.min(10,v))/10);
  const cols=['var(--accent)','var(--good)','var(--evil)','var(--ok)','var(--primary)','var(--outsider)','var(--minionc)','var(--warn)'];
  const grid=[0,2,4,6,8,10].map(v=>
    `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}" class="cgrid"/>`+
    `<text x="${L-6}" y="${(y(v)+4).toFixed(1)}" class="ctxt" text-anchor="end">${v}</text>`).join('');
  const step=Math.max(1, Math.ceil(len/12));   // 라벨이 겹치지 않게 솎아낸다
  const names=tl.labels||Array.from({length:len},(_,i)=>i+1);
  const lbls=Array.from({length:len},(_,i)=> i%step? '' :
    `<text x="${x(i).toFixed(1)}" y="${H-10}" class="ctxt" text-anchor="middle">${esc(String(names[i]??i+1))}</text>`).join('');
  const lines=tl.series.map((sr,si)=>{
    const c=cols[si%cols.length];
    const pts=sr.points.map((v,i)=> v===null? null : [x(i),y(v)]).filter(Boolean);
    const poly=pts.map(([px,py])=>`${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
    const dots=pts.map(([px,py])=>`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.5" fill="${c}"/>`).join('');
    return `<polyline points="${poly}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const legend=tl.series.map((sr,si)=>`<span class="clg"><i style="background:${cols[si%cols.length]}"></i>${esc(sr.name)}</span>`).join('');
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="페이즈별 평점 추이">${grid}${lines}${lbls}</svg><div class="clegend">${legend}</div></div>`;
}

/* ── S.history 집계 ── */
function statsHistEntries(){
  const hist=Array.isArray(S.history)? S.history : [];
  return hist.filter(h=>h&&typeof h==='object').map(h=>{
    const players=(Array.isArray(h.players)? h.players : Array.isArray(h.roster)? h.roster : [])
      .filter(p=>p&&typeof p==='object');
    const winner=(h.winner==='good'||h.winner==='evil')? h.winner
      : (h.win==='good'||h.win==='evil')? h.win : null;
    return {players, winner, mvpKey:h.mvpId||h.mvpName||h.mvp||null,
      at:h.ts||h.endedAt||h.at||h.date||null, edition:h.edition||null, label:h.label||h.title||null,
      /* 종료 후 동료 평가(있는 판만). 없으면 undefined 로 남겨 화면에서 통째로 생략한다 */
      mvpVotes:h.mvpVotes, bustVotes:h.bustVotes, mvpTop:h.mvpTop, bustTop:h.bustTop, peerVoters:h.peerVoters};
  });
}
function statsIsMvp(entry,p){
  if(p.mvp===true) return true;
  const k=entry.mvpKey;
  if(!k) return false;
  if(typeof k==='object') return k===p || (!!k.id&&k.id===p.id) || (!!k.name&&k.name===p.name);
  return k===p.id || k===p.name;
}
function statsPlayerScore(p){ return statsNum(p.score??p.rating??p.rate); }
/* 전광판: 이름 기준 집계. 판수 가점 없음 — 판별 평점의 단순 평균으로만 순위 */
function statsLeaderboard(){
  const by={};
  /* 등록부가 사람의 단일 출처다 — 소속·현재 이름은 rosterId 로 되찾는다.
     이름만으로 묶으면 동명이인이 합쳐지고, 등록부에서 이름을 고치면 과거 판과 끊긴다. */
  const ros={}; (S.roster||[]).forEach(r=>{ if(r&&r.id) ros[r.id]=r; });
  statsHistEntries().forEach(h=>{
    h.players.forEach(p=>{
      const reg = p.rosterId? ros[p.rosterId] : null;
      const name=String((reg&&reg.name) || p.name || '').trim(); if(!name) return;
      const sc=statsPlayerScore(p); if(sc===null) return;
      const key = p.rosterId? 'r:'+p.rosterId : 'n:'+name;
      const r=by[key] || (by[key]={name, org:'', mbti:'', games:0, sum:0, mvp:0, goodG:0, goodW:0, evilG:0, evilW:0});
      r.name=name;
      if(reg && reg.mbti) r.mbti=reg.mbti;
      r.games++; r.sum+=sc;
      if(statsIsMvp(h,p)) r.mvp++;
      if(p.alignment==='good'){ r.goodG++; if(h.winner==='good') r.goodW++; }
      else if(p.alignment==='evil'){ r.evilG++; if(h.winner==='evil') r.evilW++; }
      const org=(reg&&reg.affil) || p.affil || p.org || p.team || p.affiliation || '';
      if(org) r.org=String(org);
    });
  });
  const rows=Object.values(by).map(r=>Object.assign(r,{avg:r.sum/r.games}));
  rows.sort((a,b)=> b.avg-a.avg || b.games-a.games || a.name.localeCompare(b.name,'ko'));
  return {ranked:rows.filter(r=>r.games>=STATS_MIN_GAMES), placement:rows.filter(r=>r.games<STATS_MIN_GAMES)};
}
function statsWR(w,g){ return g? `${Math.round(w/g*100)}% <span class="hint">(${w}/${g})</span>` : '—'; }
function statsWhen(at){
  if(!at) return '';
  const d=new Date(at);
  if(isNaN(d)) return esc(String(at));
  const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ══════════ 최다 최고 · 최다 찐빠 전광판 ══════════
   집계 입력은 S.history 원본이다 — statsHistEntries() 를 거치지 않는다. 그 함수는 다른 레인도
   손대는 자리라, 반환 필드가 바뀌면 이 집계가 조용히 0을 세게 된다. 여기 필요한 건
   players·winner·최고/찐빠 표시뿐이라 자체 정규화가 더 짧고 안전하다.

   한 판의 '최고/찐빠'를 읽는 우선순위 — 위가 이기고, 없으면 아래로 내려간다.
     ① 종료 후 동료 평가  h.mvpTop / h.bustTop(pid 배열) + h.mvpVotes / h.bustVotes({pid:표수})
        사람이 직접 뽑은 결과라 가장 강하다. 단 이 목록은 상위 2인까지 올려 두는 '결과 표시용'이라
        그대로 세면 2등도 최고가 된다 — 표수를 보고 최다 득표자만 센다(공동 1위는 함께 센다).
        표수가 없으면 목록을 그대로 쓴다(그 판에서는 그게 최선의 정보다).
     ② 원장 명시 표시  플레이어의 mvp/best · worst/blunder, 판의 mvpId/mvpName · worstId/worstName
     ③ 평점 유도 — 최고는 유도하지 않는다. MMR 전광판의 👑 열과 어긋나면 나란히 선 두 표가
        서로를 반박한다(동료 평가가 붙은 판은 '사람이 뽑은 최고'와 '점수 MVP'가 다를 수 있고,
        그건 두 열의 이름이 다르니 정상이다). 찐빠만 그 판 최저 평점 1명으로 유도한다:
          · 채점된 사람이 2명 미만인 판은 뽑지 않는다(최고=찐빠가 되어 의미가 없다).
          · 최고로 뽑힌 사람은 후보에서 뺀다 — 한 판에서 같은 사람이 최고이자 찐빠일 수는 없다.
          · 동점이면 '패배 진영 우선 → 원장 기재 순서'로 갈라 한 판에 정확히 1명만 나온다(matchMVP 의 거울).

   참여 판수는 MMR 전광판과 같은 기준(그 판에 평점이 기록된 경우만) — 두 표가 나란히 서므로
   판수 열이 어긋나면 버그로 보인다. 키(rosterId 우선·없으면 이름)와 표시명 규칙도 statsLeaderboard 와 동일. */

/* 집계 캐시 무효화 신호. 이 문자열이 달라질 때만 원장을 다시 전수 순회한다.
     ① S.history 길이        — 판 종료 적재 · MAX_HISTORY 초과 절삭 · 클라우드 복원
     ② 첫/마지막 판의 시각   — 길이가 같아도 내용이 갈린 원장(복원·가져오기·앞쪽 절삭)
     ③ 마지막 판의 동료 평가 — 투표 집계가 끝나면 이미 쌓인 레코드에 mvpTop/bustTop 이 나중에 붙는다.
                               길이도 ts 도 그대로라 이 항이 없으면 새 결과가 표에 영영 안 뜬다.
     ④ 등록부 id·이름·소속   — rosterEdit/rosterDel 이 표시명과 대상 집합을 바꾼다
   진행 중인 판의 좌석·표·평점은 집계 입력이 아니다 — 바뀌어도 무효화하지 않는다
   (판이 끝나 원장에 적재되는 순간 ①이 잡는다). 등록부는 수십 건 규모라 이 신호 계산은 상수시간에 가깝다. */
function statsAwardSig(){
  const h=Array.isArray(S.history)? S.history : [];
  const at=e=>(e&&(e.ts||e.endedAt||e.at||e.date))||0;
  const peer=e=>e? ((e.mvpTop||[]).length+':'+(e.bustTop||[]).length+':'
    +Object.keys(e.mvpVotes||{}).length+':'+Object.keys(e.bustVotes||{}).length) : '';
  const last=h[h.length-1];
  const ros=(Array.isArray(S.roster)? S.roster : [])
    .map(r=>(r&&r.id)? r.id+''+(r.name||'')+''+(r.affil||'') : '?').join('');
  return h.length+'|'+at(h[0])+'|'+at(last)+'|'+peer(last)+'|'+ros;
}
/* 원장 1건을 집계가 쓰는 모양으로 정규화 */
function statsAwardGames(){
  return (Array.isArray(S.history)? S.history : []).filter(h=>h&&typeof h==='object').map(h=>({
    players:(Array.isArray(h.players)? h.players : Array.isArray(h.roster)? h.roster : [])
      .filter(p=>p&&typeof p==='object'),
    winner:(h.winner==='good'||h.winner==='evil')? h.winner
      : (h.win==='good'||h.win==='evil')? h.win : null,
    bestTop:h.mvpTop,   bestVotes:h.mvpVotes,   bestKey:h.mvpId||h.mvpName||h.mvp||null,
    worstTop:h.bustTop, worstVotes:h.bustVotes, worstKey:h.worstId||h.worstName||h.worst||null
  }));
}
/* pid/이름/객체 어느 쪽으로 가리켜도 그 판의 플레이어 레코드로 되찾는다 */
function statsAwardMatch(players, k){
  if(!k) return null;
  return players.find(p=> (typeof k==='object')
    ? (k===p || (!!k.id&&k.id===p.id) || (!!k.name&&k.name===p.name))
    : (k===p.pid || k===p.id || k===p.name)) || null;
}
/* 동료 평가 목록에서 최다 득표자만 남긴다(표수를 모르면 목록 전체) */
function statsAwardTopVoted(ids, votes, players){
  const pool=(Array.isArray(ids)? ids : []).filter(x=>typeof x==='string');
  if(!pool.length) return [];
  const tal=(votes && typeof votes==='object' && !Array.isArray(votes))? votes : null;
  let win=pool;
  if(tal){
    let mx=-Infinity;
    pool.forEach(pid=>{ const n=tal[pid]|0; if(n>mx) mx=n; });
    win=pool.filter(pid=>(tal[pid]|0)===mx);
  }
  const out=[];
  win.forEach(pid=>{ const q=players.find(p=>p.pid===pid || p.id===pid); if(q && out.indexOf(q)<0) out.push(q); });
  return out;
}
/* 그 판의 최고 플레이어 레코드들(보통 1명, 공동 1위면 여럿) */
function statsBestsOf(h){
  const voted=statsAwardTopVoted(h.bestTop, h.bestVotes, h.players);
  if(voted.length) return voted;
  const flagged=h.players.filter(p=>p.mvp===true||p.best===true);
  if(flagged.length) return flagged;
  const hit=statsAwardMatch(h.players, h.bestKey);
  return hit? [hit] : [];
}
/* 그 판의 찐빠 플레이어 레코드들 */
function statsWorstsOf(h){
  const voted=statsAwardTopVoted(h.worstTop, h.worstVotes, h.players);
  if(voted.length) return voted;
  const flagged=h.players.filter(p=>p.worst===true||p.blunder===true);
  if(flagged.length) return flagged;
  const hit=statsAwardMatch(h.players, h.worstKey);
  if(hit) return [hit];
  const scored=h.players.filter(p=>statsPlayerScore(p)!==null);
  if(scored.length<2) return [];
  const bests=statsBestsOf(h);
  const cand=scored.filter(p=>bests.indexOf(p)<0);
  if(!cand.length) return [];
  let w=null, ws=Infinity, wLost=false;
  cand.forEach(p=>{
    const sc=statsPlayerScore(p);
    const lost=!!h.winner && (p.alignment==='good'||p.alignment==='evil') && p.alignment!==h.winner;
    if(sc<ws || (sc===ws && lost && !wLost)){ w=p; ws=sc; wLost=lost; }
  });
  return w? [w] : [];
}
/* 등록부 전원 + 원장에만 있는 이름을 한 표에 모은다 */
function statsAwardRows(){
  const by={};
  const ros={}; (Array.isArray(S.roster)? S.roster : []).forEach(r=>{ if(r&&r.id) ros[r.id]=r; });
  /* "등록된 플레이어 전체" — 아직 한 판도 안 뛴 사람도 0판으로 남는다(배치 중으로 빠진다) */
  Object.keys(ros).forEach(rid=>{
    const nm=String(ros[rid].name||'').trim(); if(!nm) return;
    by['r:'+rid]={name:nm, org:String(ros[rid].affil||''), games:0, best:0, worst:0};
  });
  statsAwardGames().forEach(h=>{
    const bests=statsBestsOf(h), worsts=statsWorstsOf(h);
    h.players.forEach(p=>{
      const reg = p.rosterId? ros[p.rosterId] : null;
      const name=String((reg&&reg.name) || p.name || '').trim(); if(!name) return;
      if(statsPlayerScore(p)===null) return;          // 판수 기준을 MMR 전광판과 맞춘다
      const key = p.rosterId? 'r:'+p.rosterId : 'n:'+name;
      const r=by[key] || (by[key]={name, org:'', games:0, best:0, worst:0});
      r.name=name;
      const org=(reg&&reg.affil) || p.affil || p.org || p.team || p.affiliation || '';
      if(org) r.org=String(org);
      r.games++;
      if(bests.indexOf(p)>=0) r.best++;
      if(worsts.indexOf(p)>=0) r.worst++;
    });
  });
  return Object.values(by);
}
let _statsAwardCache=null;                 // {sig, board} — 세션 한정, 비영속(신규 영속 필드 없음)
function statsAwardBoard(){
  const sig=statsAwardSig();
  if(_statsAwardCache && _statsAwardCache.sig===sig) return _statsAwardCache.board;
  const rows=statsAwardRows();
  const view=field=>{
    const list=rows.map(r=>({name:r.name, org:r.org, games:r.games,
      cnt:r[field], rate:r.games? r[field]/r.games : 0}));
    /* 제목이 '최다'다 — 1순위는 누적 횟수, 그다음 비율·판수·이름 */
    const cmp=(a,b)=> b.cnt-a.cnt || b.rate-a.rate || b.games-a.games || a.name.localeCompare(b.name,'ko');
    return {ranked:list.filter(r=>r.games>=STATS_MIN_GAMES).sort(cmp),
            place:list.filter(r=>r.games<STATS_MIN_GAMES).sort(cmp)};
  };
  const board={best:view('best'), worst:view('worst')};
  _statsAwardCache={sig, board};
  return board;
}
function statsAwardTable(list, kind, ranked){
  const ko=kind==='best'? '최고' : '찐빠', mark=kind==='best'? '👑' : '💥';
  const head=`<tr><th>순위</th><th>이름</th><th>소속</th><th>${ko}</th><th>${ko}율</th><th>판수</th></tr>`;
  let prevKey=null, prevRank=0;
  const body=list.map((r,i)=>{
    let rank='—';
    if(ranked){                                  // 정수 횟수라 동률이 흔하다 — 공동 순위(1·1·3)로 표기
      const k=r.cnt+'/'+r.rate;
      if(k!==prevKey){ prevRank=i+1; prevKey=k; }
      rank=String(prevRank);
    }
    return `<tr>
      <td class="num">${rank}</td>
      <td><b>${esc(r.name)}</b></td>
      <td>${r.org? esc(r.org) : '<span class="hint">—</span>'}</td>
      <td class="num">${r.cnt? `${mark} ${r.cnt}` : '0'}</td>
      <td class="num">${statsWR(r.cnt, r.games)}</td>
      <td class="num">${r.games}</td>
    </tr>`;
  }).join('');
  return `<div class="tblwrap"><table class="stattbl">${head}${body}</table></div>`;
}
function statsAwardCol(v, kind){
  const ttl=kind==='best'? '👑 최다 최고' : '💥 최다 찐빠';
  return `<div><h3>${ttl}</h3>
  ${v.ranked.length? statsAwardTable(v.ranked, kind, true)
    : `<p class="hint">정규 순위 대상(${STATS_MIN_GAMES}판 이상)이 아직 없습니다.</p>`}
  ${v.place.length? `<h4>배치 중 <span class="hint" style="font-size:12px">(${STATS_MIN_GAMES}판 미만)</span></h4>${statsAwardTable(v.place, kind, false)}`:''}
  </div>`;
}
function statsAwardHTML(){
  const b=statsAwardBoard();
  if(!b.best.ranked.length && !b.best.place.length)
    return `<div class="card"><h2>③ 최고 · 찐빠 전광판</h2><p class="hint">아직 대상이 없습니다 — <b>설정</b> 탭에서 참가자를 등록하거나 판을 끝내면 쌓입니다.</p></div>`;
  return `<div class="card"><h2>③ 최고 · 찐빠 전광판</h2>
  <p class="hint">판마다 뽑힌 최고·찐빠를 사람 단위로 누적합니다 — 종료 후 동료 평가가 있으면 그 최다 득표자, 없으면 그 판의 👑 MVP와 최저 평점 1명입니다. 비율은 참여 판수 대비이며, ${STATS_MIN_GAMES}판 미만은 요동이 커 '배치 중'으로 뺍니다.</p>
  <div class="awardcols">${statsAwardCol(b.best,'best')}${statsAwardCol(b.worst,'worst')}</div>
  </div>`;
}

/* ── 렌더 ── */
function statsCurrentHTML(){
  let body='';
  if(!statsEngineReady()){

  } else {
    const mvpPid=statsMvpPid();

        ${statsBadge(statsScoreOf(p))}
      </div>`;
    }).join('');
    const tl=statsTimelineSeries();
    body=`<div class="statgrid">${cards}</div>
    ${tl? `<h3 style="margin:16px 0 6px">페이즈별 추이</h3>${statsChartSVG(tl)}`
        : `<p class="hint">페이즈별 추이 데이터가 아직 없습니다.</p>`}`;

}
function statsBoardHTML(){
  const lb=statsLeaderboard();
  if(!lb.ranked.length && !lb.placement.length)
    return `<div class="card"><h2>② 전광판</h2><p class="hint">아직 집계된 판이 없습니다 — 판이 끝나면 자동으로 쌓입니다.</p></div>`;
  const head=`<tr><th>순위</th><th>이름</th><th>소속</th><th>MBTI</th><th>평균 평점</th><th>판수</th><th>MVP</th><th>선 / 악 승률</th></tr>`;
  const row=(r,rank)=>`<tr>
    <td class="num">${rank}</td>
    <td><b>${esc(r.name)}</b></td>
    <td>${r.org? esc(r.org) : '<span class="hint">—</span>'}</td>
    <td>${r.mbti? esc(r.mbti) : '<span class="hint">—</span>'}</td>
    <td>${statsBadge(r.avg)}</td>
    <td class="num">${r.games}</td>
    <td class="num">${r.mvp?`👑 ${r.mvp}`:'0'}</td>
    <td class="num">${statsWR(r.goodW,r.goodG)} / ${statsWR(r.evilW,r.evilG)}</td>
  </tr>`;
  return `<div class="card"><h2>② 전광판</h2>
  <p class="hint">판별 평점의 단순 평균으로만 순위를 매깁니다 — 판수가 많다고 가점이 붙지 않습니다.</p>
  ${lb.ranked.length? `<div class="tblwrap"><table class="stattbl">${head}${lb.ranked.map((r,i)=>row(r,String(i+1))).join('')}</table></div>`
    : `<p class="hint">정규 순위 대상(${STATS_MIN_GAMES}판 이상)이 아직 없습니다.</p>`}
  ${lb.placement.length? `<h3 style="margin:14px 0 6px">배치 중 <span class="hint" style="font-size:12px">(${STATS_MIN_GAMES}판 미만)</span></h3>
  <div class="tblwrap"><table class="stattbl">${head}${lb.placement.map(r=>row(r,'—')).join('')}</table></div>`:''}
