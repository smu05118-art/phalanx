<title>티르소스</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#1a0a2e; --panel:#200e2f; --raised:#2d1b4e; --sunken:#0d0520; --line:#3d2a5c;
  --text:#e9e0cc; --muted:#b8a88a; --accent:#c4a24d; --accent-soft:rgba(196,162,77,.14);
  --primary:#7b5cd6; --primary-soft:rgba(123,92,214,.20);
  --good:#4a90d9; --good-soft:rgba(74,144,217,.15);
  --evil:#d94a4a; --evil-soft:rgba(217,74,74,.15);
  --outsider:#22d3ee; --outsider-soft:rgba(34,211,238,.13);
  --minionc:#fb923c; --minionc-soft:rgba(251,146,60,.14);
  --warn:#dfae4a; --warn-soft:rgba(223,174,74,.13);
  --ok:#7fb069; --ok-soft:rgba(127,176,105,.14);
  --danger:#c0473f;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1f8; --outsider:#0e7490; --outsider-soft:rgba(14,116,144,.10); --minionc:#c2540a; --minionc-soft:rgba(194,84,10,.10); --panel:#fbfafe; --raised:#ffffff; --sunken:#e9e5f2; --line:#ddd6ea;
    --text:#28223a; --muted:#6f6885; --accent:#8a6a25; --accent-soft:rgba(138,106,37,.12);
    --primary:#6547c0; --primary-soft:rgba(101,71,192,.12);
    --good:#2f66a3; --good-soft:rgba(47,102,163,.10);
    --evil:#b23f37; --evil-soft:rgba(178,63,55,.10);
    --warn:#a4771c; --warn-soft:rgba(164,119,28,.12);
    --ok:#4a7c47; --ok-soft:rgba(74,124,71,.12);
    --danger:#a83a32;
    --shadow:0 4px 16px rgba(60,50,30,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f1f8; --outsider:#0e7490; --outsider-soft:rgba(14,116,144,.10); --minionc:#c2540a; --minionc-soft:rgba(194,84,10,.10); --panel:#fbfafe; --raised:#ffffff; --sunken:#e9e5f2; --line:#ddd6ea;
  --text:#28223a; --muted:#6f6885; --accent:#8a6a25; --accent-soft:rgba(138,106,37,.12);
  --primary:#6547c0; --primary-soft:rgba(101,71,192,.12);
  --good:#2f66a3; --good-soft:rgba(47,102,163,.10);
  --evil:#b23f37; --evil-soft:rgba(178,63,55,.10);
  --warn:#a4771c; --warn-soft:rgba(164,119,28,.12);
  --ok:#4a7c47; --ok-soft:rgba(74,124,71,.12);
  --danger:#a83a32;
  --shadow:0 4px 16px rgba(60,50,30,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,h4,.serif{font-family:'Gowun Batang','Noto Serif KR',serif}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:7px 14px;transition:border-color .15s, background .15s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.danger{border-color:var(--danger);color:var(--danger)}
button.ghost{background:transparent}
button.small{padding:3px 9px;font-size:12.5px;border-radius:6px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--sunken);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px}
textarea{width:100%;resize:vertical}
.num{font-variant-numeric:tabular-nums}

/* ── top bar ── */
#topbar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
#topbar .inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#brand{display:flex;align-items:baseline;gap:9px}
#brand h1{margin:0;font-size:21px;letter-spacing:.06em;color:var(--accent)}
#brand .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
#phasechip{display:flex;align-items:center;gap:8px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
#phasechip .plabel{font-weight:700;font-size:14px}
#phasechip .plabel.night{color:var(--good)}
#phasechip .plabel.day{color:var(--warn)}
#quickstats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;align-items:center}
.qstat{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.qstat b{color:var(--text);font-size:14px}
#layout{display:grid;grid-template-columns:216px minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto;align-items:start}
#sidenav{position:sticky;top:64px;padding:14px 10px;display:flex;flex-direction:column;gap:3px}
#sidenav button{display:flex;align-items:center;gap:10px;border:none;background:transparent;color:var(--muted);border-radius:9px;padding:10px 14px;font-size:14px;text-align:left;width:100%}
#sidenav button:hover{background:var(--primary-soft);color:var(--text)}
#sidenav button.active{background:var(--primary-soft);color:var(--text);font-weight:700;box-shadow:inset 3px 0 0 var(--primary)}
#sidenav .icn{width:20px;text-align:center;opacity:.9}
#subtabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:0}
#subtabs[hidden]{display:none!important}
#subtabs button{border:none;background:transparent;color:var(--muted);border-radius:8px 8px 0 0;padding:8px 14px;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
#subtabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{padding:18px 18px 90px;min-width:0}
@media (max-width:880px){
  #layout{grid-template-columns:1fr}
  /* teeroz식 하단 고정 탭바 */
  #sidenav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:70;flex-direction:row;justify-content:space-around;gap:0;
    padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.35)}
  #sidenav button{flex-direction:column;gap:2px;width:auto;flex:1;padding:6px 2px;font-size:11px;white-space:nowrap;border-radius:10px;align-items:center}
  #sidenav button .icn{width:auto;font-size:20px;line-height:1.2}
  #sidenav button.active{box-shadow:none;background:var(--primary-soft)}
  main{padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  /* 상단바 슬림 */
  #topbar .inner{padding:8px 12px;gap:8px}
  #brand h1{font-size:18px}
  #brand .sub{display:none}
  #themebtn{margin-left:auto}
  #quickstats{order:9;margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;gap:6px;scrollbar-width:none}
  #quickstats::-webkit-scrollbar{display:none}
  .qstat{white-space:nowrap;flex:0 0 auto}
  /* 터치 타깃·카드 */
  button{min-height:40px}
  button.small{min-height:34px}
  .card{padding:13px 14px;border-radius:12px}
  .grid2{grid-template-columns:1fr}
  .chargrid{grid-template-columns:1fr}
  .scriptgrid{grid-template-columns:1fr}
  /* 투표: 큰 버튼·줄맞춤 */
  .voterow{padding:8px 4px;gap:6px}
  .voterow .vname{min-width:84px;font-size:14px}
  .vbtn{padding:7px 14px;font-size:14px}
  .votemath{gap:8px}
  .vmbox{flex:1 1 96px;padding:8px 8px}
  .vmbox .vval{font-size:21px}
  /* 밤 진행 */
  .step .stephead{padding:12px 12px}
  .step .stepname{font-size:15.5px}
  .step .stepbody{padding:2px 12px 12px 12px}
  /* 원탁 축소 */
  .cseat{width:70px;margin-left:-35px;margin-top:-35px}
  .cseat .ctoken{width:42px;height:42px;font-size:19px}
  .cseat .cname{font-size:11px}
  .cseat .crole{font-size:9.5px}
  /* 시트 */
  .sheethead h2{font-size:20px}
  .sheettabs button{padding:10px 6px;font-size:13.5px}
  .sheetrow{gap:10px}
  .ctoken{flex-basis:40px;width:40px;height:40px;font-size:19px}
  .callorder{font-size:12px}
  .fieldrow{grid-template-columns:1fr}
}
/* 스크립트 카드 (teeroz 홈 스타일) */
.scriptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.scard{display:flex;gap:14px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s}
.scard:hover{border-color:var(--primary);background:var(--primary-soft)}
.scard.disabled{cursor:default;opacity:.55}
.scard.disabled:hover{border-color:var(--line);background:var(--raised)}
.scard .sicon{flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:var(--sunken);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--accent)}
.scard .sko{font-weight:700;font-size:15.5px}
.scard .sen{color:var(--muted);font-size:12px;font-style:italic}
.scard .smeta{color:var(--muted);font-size:11.5px;margin-top:3px}
.secthead{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:15px;font-weight:700;color:var(--text)}
.secthead:first-child{margin-top:0}
.secthead .shicon{color:var(--accent)}
.sheettabs{display:flex;gap:4px;margin:8px 0 14px;border-bottom:1px solid var(--line)}
.sheettabs button{border:none;background:transparent;color:var(--muted);border-radius:8px 8px 0 0;padding:9px 14px;border-bottom:2px solid transparent}
.sheettabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
/* ── 밤 인터랙티브 위저드 ── */
#wizard{position:fixed;inset:0;z-index:100;background:var(--sunken);display:flex;flex-direction:column}
#wizard[hidden]{display:none!important}
#wizhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#wizhead .wtitle{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px}
#wizhead .wstep{color:var(--muted);font-size:12.5px;margin-left:auto}
#wizbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#wizfoot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
#wizfoot button{flex:1;min-height:46px;font-size:15px}
.wiz-note{max-width:560px;font-size:16px;line-height:1.8}
.wiz-caption{font-size:15px;color:var(--muted);margin-bottom:18px}
.wiz-bigtoken{width:170px;height:170px;border-radius:50%;border:5px solid var(--accent);background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:84px;margin:0 auto 14px;box-shadow:0 0 60px var(--accent-soft)}
.wiz-bigname{font-family:'Gowun Batang',serif;font-size:32px;font-weight:700}
.wiz-bigsub{color:var(--muted);font-size:15px;font-style:italic}
.wiz-bignum{font-size:130px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.wiz-biganswer{font-size:72px;font-weight:700;font-family:'Gowun Batang',serif}
.wiz-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px}
.wiz-pickbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--raised);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:96px;cursor:pointer;font-size:14px}
.wiz-pickbtn .pt{font-size:34px}
.wiz-pickbtn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.wiz-pickbtn.dim{opacity:.45}
.wiz-showhint{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--muted);font-size:13px;animation:wizpulse 1.6s infinite}
@keyframes wizpulse{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.wiz-showhint{animation:none}}
.wiz-warnbar{background:var(--evil-soft);border:1px solid var(--evil);border-radius:10px;padding:8px 14px;font-size:14px;max-width:560px;margin-bottom:16px}
/* ── 게임 설정 스테퍼 ── */
.setsteps{display:flex;align-items:flex-start;margin:6px 0 22px}
.setstep{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer}
.setstep .dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;background:var(--raised);border:2px solid var(--line);color:var(--muted)}
.setstep.done .dot{background:#2d7a4f;border-color:#2d7a4f;color:#fff}
.setstep.cur .dot{background:var(--accent);border-color:var(--accent);color:#1a1030}
.setstep .slab{font-size:12px;color:var(--muted)}
.setstep.cur .slab{color:var(--text);font-weight:700}
.setline{flex:1;height:2px;background:var(--line);margin-top:22px;min-width:24px}
body.wizopen #sidenav{display:none!important}
body.wizopen main{padding-bottom:20px}
.ready-hero{text-align:center;padding:28px 10px 8px}
.ready-hero .rh-icon{font-size:76px;line-height:1}
.ready-hero h3{font-size:22px;margin:14px 0 4px}
.ready-hero p{color:var(--muted);margin:0 0 22px}
.bigactions{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.bigactions button{min-height:52px;font-size:16px;border-radius:12px}
.bigactions .gold{background:var(--accent);border-color:var(--accent);color:#1a1030;font-weight:700}
.wiz-players{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.wiz-shownplayer{display:flex;flex-direction:column;align-items:center;gap:6px}
.wiz-shownplayer .pp{width:110px;height:110px;border-radius:50%;border:4px solid var(--good);background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
.wiz-shownplayer .pn{font-size:22px;font-weight:700}
section.tabpane{display:none}
section.tabpane.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
.card h3{margin:14px 0 8px;font-size:15.5px}
.card p.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;border:1px solid var(--line)}
.pill.townsfolk{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.pill.outsider{color:var(--outsider);border-color:var(--outsider);background:var(--outsider-soft)}
.pill.minion{color:var(--minionc);border-color:var(--minionc);background:var(--minionc-soft)}
.pill.demon{color:#fff;border-color:var(--evil);background:var(--evil)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.neutral{color:var(--muted)}

.token{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.token.poison{background:var(--evil-soft);color:var(--evil);border:1px solid var(--evil)}
.token.drunkT{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.token.protect{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.token.herring{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.token.master{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.token.custom{background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.token .x{cursor:pointer;opacity:.7;font-weight:400}
.token .x:hover{opacity:1}

/* player cards */
.pcard{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--accent)}
.pcard.dead{opacity:.62;background:var(--panel)}
.pcard.dead .pname{text-decoration:line-through}
.pcard .pname{font-weight:700;font-size:15px}
.pcard .prole{font-family:'Gowun Batang',serif;font-size:14px}
.pcard .tokens{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:10px}
.pcard .pbtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.seat{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted)}

/* night stepper */
.step{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;overflow:hidden}
.step.wake{border-left-color:var(--accent)}
.step.done{opacity:.55;border-left-color:var(--ok)}
.step.skip{opacity:.45}
.step > .stephead{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.step > .stephead:hover{background:var(--accent-soft)}
.step .stepnum{font-size:12px;color:var(--muted);min-width:22px;text-align:right}
.step .stepname{font-family:'Gowun Batang',serif;font-weight:700;font-size:16px}
.step .stepwho{color:var(--muted);font-size:13px}
.step .stepbody{display:none;padding:2px 16px 14px 46px;border-top:1px dashed var(--line)}
.step.open .stepbody{display:block}
.guide{font-size:14px}
.guide ol,.guide ul{margin:6px 0;padding-left:20px}
.guide li{margin:3px 0}
.alertbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.alertbox.red{border-color:var(--evil);background:var(--evil-soft)}
.alertbox.blue{border-color:var(--good);background:var(--good-soft)}
.alertbox b{font-weight:700}

/* vote */
.votemath{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.vmbox{flex:1 1 130px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
.vmbox .vlab{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.vmbox .vval{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.vmbox.pass .vval{color:var(--ok)} .vmbox.fail .vval{color:var(--evil)}
.voterow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.voterow:last-child{border-bottom:none}
.voterow .vname{min-width:110px;font-weight:500}
.voterow.deadrow .vname{color:var(--muted);text-decoration:line-through}
.vbtn{border-radius:6px;padding:3px 12px;font-size:13px}
.vbtn.sel-yes{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.vbtn.sel-no{background:var(--evil);border-color:var(--evil);color:#fff;font-weight:700}
.vbtn.sel-abs{background:var(--muted);border-color:var(--muted);color:var(--bg);font-weight:700}
.nomcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--raised)}
.nomcard.leader{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nomcard .nomtitle{font-weight:700;font-size:15px}

/* character library */
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.charcard{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.charcard .cname{font-family:'Gowun Batang',serif;font-weight:700;font-size:16px}
.charcard .cen{color:var(--muted);font-size:12px;margin-left:6px}
.charcard .cab{font-size:13.5px;margin-top:6px}
details.morebox{margin-top:8px;font-size:13px}

function editionChars(ed){ return allChars().filter(c=>(c.edition||'tb')===(ed||S.edition||'tb') || c.type==='fabled' || c.custom); }

<script>
/* ══════════════════ 상태 ══════════════════ */
const LS_KEY = 'thyrsus.tb.v1';
const blank = () => ({
  phase:{kind:'setup', n:0},
  players:[], log:[], nightDone:{}, checks:{}, noms:[],
  edition:'tb', redHerringId:null, drunkMaskChar:null, executedToday:null, executedPrevDay:null,
  customs:[], nomSeq:1, theme:'auto', poCharged:false, exorcistPrev:null
});
let S = blank();
try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = Object.assign(blank(), JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

const $ = sel => document.querySelector(sel);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

function allChars(){ return CHARACTERS.concat(S.customs||[]); }
function charOf(id){ return allChars().find(c=>c.id===id); }
function playersByChar(cid){ return S.players.filter(p=>p.charId===cid); }
function alivePlayers(){ return S.players.filter(p=>p.alive); }
function playerOf(pid){ return S.players.find(p=>p.id===pid); }
function isEvil(p){ const c=charOf(p.charId); return c && (c.type==='minion'||c.type==='demon'); }
function hasStatus(p,key){ return (p.statuses||[]).some(s=>s.key===key); }
function isMalfunctioning(p){ return hasStatus(p,'poison') || hasStatus(p,'drunkS') || (p.charId==='drunk'); }
function majority(n){ return Math.floor(n/2)+1; }
function phaseName(){ const ph=S.phase; if(ph.kind==='setup') return '준비'; return (ph.kind==='night'?'밤 ':'낮 ')+ph.n; }
function log(msg){ S.log.push({t:phaseName(), msg}); save(); }

/* 상태 토큰 부여/해제. expiresAt: {kind,n} = 해당 페이즈 '시작 시' 자동 해제 */
function addStatus(p, key, source, expiresAt){
  p.statuses = p.statuses||[];
  p.statuses.push({key, source:source||'', expiresAt:expiresAt||null});
  log(`${p.name}: ${STATUS_DEFS[key].icon}${STATUS_DEFS[key].ko} 부여` + (source?` (${source})`:''));
}
function removeStatus(p, idx){ const s=p.statuses.splice(idx,1)[0]; log(`${p.name}: ${STATUS_DEFS[s.key].ko} 해제`); }
function expireStatuses(){
  const ph=S.phase;
  S.players.forEach(p=>{
    (p.statuses||[]).slice().forEach(s=>{
      if(s.expiresAt && s.expiresAt.kind===ph.kind && s.expiresAt.n===ph.n){
        p.statuses.splice(p.statuses.indexOf(s),1);
        S.log.push({t:phaseName(), msg:`${p.name}: ${STATUS_DEFS[s.key].icon}${STATUS_DEFS[s.key].ko} 자동 해제`});
      }
    });
  });
}

function killPlayer(p, cause, opts){
  opts=opts||{};
  const aliveBefore = alivePlayers().length;   // 죽는 본인 포함(탕녀 계승 판정 기준)
  // 좀버얼 첫 사망 = 죽은 척: 겉으로만 사망 처리, 실제로는 생존(밤에 계속 깨움)
  if(p.charId==='zombuul' && !hasStatus(p,'fakedead')){
    addStatus(p,'fakedead','좀버얼 첫 사망',null);
    p.alive=false;
    log(`🪦 ${p.name}(좀버얼) 죽은 척 — ${cause} (실제로는 생존, 두 번째 사망이 진짜)`);
    toast(`🪦 좀버얼의 첫 사망 — 겉으로는 죽은 것으로 공표하되 실제로는 생존 중입니다. 계속 밤에 깨우세요. 두 번째 사망이 진짜입니다.`,'warn');
    return;
  }
  // 어릿광대 1회 생존: 첫 사망 시 정상 작동이면 재량 발동
  if(p.charId==='fool' && p.alive && !hasStatus(p,'spent') && !isMalfunctioning(p) && !/암살자/.test(cause)){
    if(confirm(`🃏 ${p.name}은(는) 어릿광대입니다 — 1회 생존 발동? (${cause})\n[확인] = 죽지 않음 + 능력 소진 / [취소] = 그대로 사망`)){
      addStatus(p,'spent','어릿광대 1회 생존 발동',null);
      log(`🃏 ${p.name}(어릿광대) 첫 사망 무효 — ${cause} (능력 소진)`);
      toast(`🃏 ${p.name} 생존 — 어릿광대 1회 능력 소진. 사망하지 않습니다.`,'ok');
      return;
    }
  }
  if(p.charId==='zombuul'){
    const zi=(p.statuses||[]).findIndex(s=>s.key==='fakedead');
    if(zi>=0){ p.statuses.splice(zi,1); log(`🪦 ${p.name}(좀버얼) 두 번째 사망 — 죽은 척 해제, 실제 사망`); }
  }
  p.alive=false; log(`💀 ${p.name}(${charName(p)}) 사망 — ${cause}`);
  if(!opts.skipEnd) checkEndConditions(cause, aliveBefore);
}
function charName(p){ const c=charOf(p.charId); return c? c.ko : '?'; }

function checkEndConditions(cause, aliveBefore){
  const demonAlive = S.players.some(p=>(p.alive || (p.charId==='zombuul'&&hasStatus(p,'fakedead'))) && charOf(p.charId)?.type==='demon');
  if(demonAlive){
    // M-7: 생존 2인 이하 + 악마 생존 = 악한 팀 승리
    if(alivePlayers().length<=2){
      toast('🏴 생존자가 2명 이하이고 악마가 살아 있습니다 — 악한 팀 승리!','warn');
      log('악한 팀 승리(생존 2인 이하 + 악마 생존)');
    }
    return;
  }
  {
    const sw = S.players.find(p=>p.alive && p.charId==='scarletwoman');
    const aliveN = (aliveBefore!==undefined? aliveBefore : alivePlayers().length+1);
    if(sw && aliveN>=5 && !isMalfunctioning(sw)){
      toast(`⚠ 악마 사망 — 생존 ${aliveN}명(5+). 탕녀가 임프를 계승합니다. 게임은 계속! 다음 밤에 그녀를 깨워 임프 토큰을 보여주세요.`, 'warn');
      log('탕녀 계승 조건 충족 — 다음 밤 임프로 전환');
    } else if(sw && aliveN>=5 && isMalfunctioning(sw)){
      toast('⚠ 탕녀가 중독/오작동 상태 — 계승 불발. 악마 사망 = 선한 팀 승리!', 'warn');
    } else {
      toast('🏆 악마가 죽었습니다 — 선한 팀 승리! (탕녀 계승 조건 없음)', 'ok');
    }
  }
}

let toastTimer=null;
function toast(msg, kind){
  let el = $('#toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el);
    el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;max-width:560px;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--raised);color:var(--text)'; }
  el.style.borderColor = kind==='ok'?'var(--ok)': kind==='warn'?'var(--warn)':'var(--line)';
  el.textContent=msg; el.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;}, 7000);
}

/* ══════════════════ 페이즈 진행 ══════════════════ */
function advancePhase(){
  const ph=S.phase;
  if(ph.kind==='setup'){
    if(S.players.length<5){ toast('플레이어가 5명 이상 필요합니다.','warn'); return; }
    const unassigned=S.players.filter(p=>!p.charId);
    if(unassigned.length){ toast(`캐릭터 미배정: ${unassigned.map(p=>p.name).join(', ')}`,'warn'); return; }
    const ft=S.players.find(p=>p.charId==='fortuneteller');
    if(ft && !S.redHerringId){ toast('점쟁이가 있습니다 — 붉은 청어를 먼저 지정하세요(설정 탭).','warn'); return; }
    const dr=S.players.find(p=>p.charId==='drunk');
    if(dr && !S.drunkMaskChar){ toast('주정뱅이가 있습니다 — 위장할 마을 주민을 먼저 지정하세요(설정 탭).','warn'); return; }
    S.phase={kind:'night', n:1};
    log('── 게임 시작: 첫날 밤 ──');
    switchTab('night');
  } else if(ph.kind==='night'){
    S.phase={kind:'day', n:ph.n};
    expireStatuses();
    log(`── 낮 ${ph.n} 시작 ──`);
    switchTab('day');
  } else {
    // 낮 종료 → 시장 3인 승리 조건 최종 확인
    const mayor=S.players.find(p=>p.alive && p.charId==='mayor');
    if(mayor && alivePlayers().length===3 && !S.executedToday && !isMalfunctioning(mayor)){
      if(!confirm('⚠ 생존자 3명 + 오늘 처형 없음 + 시장 생존(정상 작동) = 선한 팀 승리 조건입니다!\n그래도 밤으로 진행할까요? (취소를 누르면 낮에 머뭅니다)')) return;
    }
    S.executedPrevDay = S.executedToday; S.executedToday=null;  // 장의사가 이 밤에 참조
    S.phase={kind:'night', n:ph.n+1};
    expireStatuses();  // 독(어제 밤 부여) 해제 타이밍 = 다음 밤 시작
    S.nightDone[S.phase.n]={};
    log(`── 밤 ${S.phase.n} 시작 ──`);
    switchTab('night');
  }
  save(); renderAll();
}

/* ══════════════════ 탭 ══════════════════ */
/* teeroz형 IA: 사이드바 4그룹 + 내 게임 서브탭 */
const NAVS=[
  ['scripts','공식 스크립트','📜'],
  ['game','내 게임','🎲'],
  ['custom','내 스크립트','📝'],
  ['wiki','백과사전','📖'],
];
const GAME_TABS=[['setup','설정'],['grim','그리모어'],['night','밤 진행'],['day','낮 · 투표'],['check','체크리스트']];
const NAV_OF={scripts:'scripts', sheet:'scripts', setup:'game', grim:'game', night:'game', day:'game', check:'game', custom:'custom', guide:'wiki'};
let activeTab='scripts';
function switchTab(t){ activeTab=t; renderAll(); }
function switchNav(nv){
  if(nv==='scripts') switchTab('scripts');
  else if(nv==='game') switchTab(S.phase.kind==='night'?'night':S.phase.kind==='day'?'day':'setup');
  else if(nv==='custom') switchTab('custom');
  else switchTab('guide');
}
function renderTabs(){
  const nav=NAV_OF[activeTab]||'scripts';
  $('#sidenav').innerHTML = NAVS.map(([id,ko,icn])=>`<button class="${nav===id?'active':''}" onclick="switchNav('${id}')"><span class="icn">${icn}</span>${ko}</button>`).join('');
  const st=$('#subtabs');
  if(nav==='game'){
    st.hidden=false;
    st.innerHTML = GAME_TABS.map(([id,ko])=>`<button class="${activeTab===id?'active':''}" onclick="switchTab('${id}')">${ko}</button>`).join('');
  } else st.hidden=true;
}
/* 공식 스크립트 목록 (teeroz 홈 구조) */
const SCRIPTS_META=[
  {id:'tb', ko:'점철되는 혼란', en:'Trouble Brewing', ready:true, desc:'기본 스크립트 · 22캐릭터 · 판정 자동화 완전 지원'},
  {id:'bmr', ko:'피로 물든 달', en:'Bad Moon Rising', ready:true, desc:'25캐릭터 · 밤 순서·가이드·노티스 지원'},
  {id:'sv', ko:'화단에 꽃피운 이단', en:'Sects & Violets', ready:true, desc:'25캐릭터 · 밤 순서·가이드·노티스 지원'},
];
let sheetEd='tb', sheetTab='chars';
function openSheet(ed){ sheetEd=ed; sheetTab='chars'; switchTab('sheet'); }
function renderScripts(){
  const el=$('#pane-scripts');
  el.innerHTML=`
  <div class="card">
    <div class="secthead"><span class="shicon">👑</span> 공식 스크립트</div>
    <div class="scriptgrid">
      ${SCRIPTS_META.map(s=>`<div class="scard ${s.ready?'':'disabled'}" onclick="openSheet('${s.id}')">
        <div class="sicon">📜</div>
        <div><div class="sko">${s.ko}</div><div class="sen">${s.en}</div><div class="smeta">${s.desc}</div></div>
      </div>`).join('')}
    </div>
    <div class="secthead"><span class="shicon">⭐</span> 내 커스텀 스크립트</div>
    ${S.customs.length?`<div class="scriptgrid">
      <div class="scard" onclick="switchTab('custom')">
        <div class="sicon">📝</div>
        <div><div class="sko">티르소스 커스텀 시트</div><div class="sen">custom · ${S.customs.length} characters</div><div class="smeta">${S.customs.map(c=>c.ko).join(' · ')}</div></div>
      </div></div>`
    :`<p class="hint">아직 없습니다 — <b>내 스크립트</b>에서 커스텀 캐릭터를 만들면 여기에 나타납니다.</p>`}
    <div class="secthead"><span class="shicon">🎲</span> 바로가기</div>
    <div class="row">
      <button class="primary" onclick="switchNav('game')">내 게임으로 (${phaseName()})</button>
      <button onclick="switchTab('guide')">백과사전 · 재량 가이드</button>
    </div>
  </div>`;
}
function renderTopbar(){
  const pl=$('#phaselabel'); const ph=S.phase;
  pl.textContent=(ph.kind==='night'?'🌙 ':ph.kind==='day'?'☀ ':'')+phaseName();
  pl.className='plabel '+(ph.kind==='night'?'night':ph.kind==='day'?'day':'');
  $('#advbtn').textContent = ph.kind==='setup'?'게임 시작': ph.kind==='night'?`낮 ${ph.n}으로 →`:`밤 ${ph.n+1}로 →`;
  const alive=alivePlayers().length, total=S.players.length;
  const deadTok=S.players.filter(p=>!p.alive&&p.deadVote!==false).length;
  $('#quickstats').innerHTML = total? `
    <span class="qstat">생존 <b class="num">${alive}</b>/<b class="num">${total}</b></span>
    <span class="qstat">거수 과반 <b class="num">${majority(alive)}</b></span>
    <span class="qstat">사망 투표 토큰 <b class="num">${deadTok}</b></span>
    <span class="qstat">☠ <b class="num">${S.players.filter(p=>hasStatus(p,'poison')).length}</b></span>`:'';
}

/* ══════════════════ 설정 탭 ══════════════════ */
function compFor(n, baronInPlay){
  const c=COMP[Math.min(15,Math.max(5,n))].slice();
  if(baronInPlay){ c[0]-=2; c[1]+=2; }
  return c;
}
function ensureSeats(target){
  target=Math.max(1,Math.min(15,target));
  while(S.players.length<target) S.players.push({id:uid(), name:'', charId:'', alive:true, deadVote:true, statuses:[], notes:''});
  while(S.players.length>target) S.players.pop();
  save(); renderAll();
}
function renamePlayer(pid,v){ const p=playerOf(pid); if(!p) return; p.name=v; save(); }
function setupIssues(){
  const n=S.players.length;
  const issues=[];
  if(n<5) issues.push('플레이어가 5명 이상 필요합니다.');
  const noname=S.players.filter(p=>!p.name.trim()).length;
  if(noname) issues.push(`이름이 비어 있는 좌석 ${noname}곳`);
  const un=S.players.filter(p=>!p.charId);
  if(un.length) issues.push('캐릭터 미배정: '+un.map(p=>p.name).join(', '));
  const baron=S.players.some(p=>p.charId==='baron');
  const comp=n>=5?compFor(n,baron):null;
  const counts={townsfolk:0,outsider:0,minion:0,demon:0};
  S.players.forEach(p=>{const c=charOf(p.charId); if(!c) return; if(c.type==='traveler'||c.type==='fabled') return; counts[c.type]++;});
  if(comp && !(counts.townsfolk===comp[0]&&counts.outsider===comp[1]&&counts.minion===comp[2]&&counts.demon===comp[3]))
    issues.push(`구성 불일치 — 권장 ${comp[0]}/${comp[1]}/${comp[2]}/${comp[3]}, 현재 ${counts.townsfolk}/${counts.outsider}/${counts.minion}/${counts.demon}`);
  if(S.players.some(p=>p.charId==='fortuneteller') && !S.redHerringId) issues.push('점쟁이의 붉은 청어를 지정하세요.');
  if(S.players.some(p=>p.charId==='drunk') && !S.drunkMaskChar) issues.push('주정뱅이의 위장 캐릭터를 지정하세요.');
  return issues;
}
function setupStepDone(k){
  if(k===1) return S.players.length>=5 && S.players.every(p=>p.name.trim());
  if(k===2) return S.players.length>=5 && setupIssues().length===0;
  return false;
}
function gotoSetupStep(k){ S.setupStep=k; save(); renderAll(); }
function renderSetup(){
  const el=$('#pane-setup');

  const n=S.players.length;

    </div>
    <div>${S.players.map((p,i)=>`
      <div class="seatrow">

        <button class="small ghost" onclick="movePlayer('${p.id}',1)" title="아래로">↓</button>

      </div>`).join('')}</div>
    <div class="bigactions" style="margin-top:16px"><button class="gold" onclick="gotoSetupStep(2)" ${n<5?'disabled':''}>다음: 캐릭터 배정 ›</button></div>`;
  }
  else if(step===2){
    body=`
    <div class="row" style="margin-bottom:10px">
      <button class="primary" onclick="randomAssign()" ${n<5?'disabled':''}>🎲 무작위 배정</button>
      <span class="hint">또는 아래에서 직접 선택</span>
    </div>
    ${comp?`<p class="hint">권장 구성 (${n}인${baron?' · 남작 적용':''}): <span class="pill townsfolk">주민 ${comp[0]}</span> <span class="pill outsider">외지인 ${comp[1]}</span> <span class="pill minion">하수인 ${comp[2]}</span> <span class="pill demon">악마 ${comp[3]}</span>
      &nbsp;현재: ${counts.townsfolk}/${counts.outsider}/${counts.minion}/${counts.demon}
      ${compOK?'<span class="pill ok">구성 일치</span>':'<span class="pill warn">구성 불일치</span>'}
      ${travelerN?`<span class="pill neutral">+ 여행자 ${travelerN}</span> <span class="hint" style="display:inline">(여행자·전설은 구성 카운트에 미포함)</span>`:''}</p>`:''}
    <div>${S.players.map((p,i)=>`
      <div class="voterow">
        <span style="color:var(--muted);width:24px" class="num">${i+1}</span>
        <span class="vname">${esc(p.name)}</span>
        <select onchange="setChar('${p.id}',this.value)"><option value="">— 캐릭터 —</option>${opts(p.charId)}</select>
      </div>`).join('')}</div>
    ${(ft||dr)?`<hr class="divider"><h3>시작 전 사회자 결정</h3>
      ${ft?`<div class="fieldrow"><label>🎗 붉은 청어</label><div><select onchange="setHerring(this.value)"><option value="">— 선한 플레이어 선택 —</option>
        ${S.players.filter(p=>{const c=charOf(p.charId);return c&&(c.type==='townsfolk'||c.type==='outsider');}).map(p=>`<option value="${p.id}" ${S.redHerringId===p.id?'selected':''}>${esc(p.name)} (${charName(p)})</option>`).join('')}
      </select> <span class="hint">점쟁이에게 악마처럼 감지될 선한 플레이어 1명 — 게임 내내 유지</span></div></div>`:''}
      ${dr?`<div class="fieldrow"><label>🎭 주정뱅이 위장</label><div><select onchange="setDrunkMask(this.value)"><option value="">— 위장할 마을 주민 —</option>
        ${CHARACTERS.filter(c=>c.type==='townsfolk' && (c.edition||'tb')===S.edition && !S.players.some(p=>p.charId===c.id)).map(c=>`<option value="${c.id}" ${S.drunkMaskChar===c.id?'selected':''}>${c.ko}</option>`).join('')}
      </select> <span class="hint">주정뱅이 본인이 믿게 될 주민 — 미사용 캐릭터에서 선택. 밤 순서에 자동 반영</span></div></div>`:''}`:''}
    <div class="bigactions" style="margin-top:16px"><button class="gold" onclick="gotoSetupStep(3)">다음: 시작 ›</button></div>
    <details class="morebox" style="margin-top:14px"><summary>캐릭터 일람 (${editionOf().ko}${S.customs.length?` + 커스텀 ${S.customs.length}종`:''})</summary><div class="inner">
    ${['townsfolk','outsider','minion','demon','traveler','fabled'].filter(t=>editionChars().some(c=>c.type===t)).map(t=>`
      <h3><span class="pill ${t}">${TYPE_KO[t]}</span></h3>
      <div class="chargrid">${editionChars().filter(c=>c.type===t).map(charCard).join('')}</div>`).join('')}</div></details>`;
  }
  else {
    const issues=setupIssues();
    body = issues.length? `
      <div class="alertbox">아직 준비가 끝나지 않았습니다:<ul class="guide">${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="bigactions"><button onclick="gotoSetupStep(${issues[0].includes('플레이어')?1:2})">‹ 돌아가서 마저 준비하기</button></div>`
    : `<div class="ready-hero">
        <div class="rh-icon">🏰</div>
        <h3>게임 준비 완료!</h3>

function startRevealWiz(){
  const scenes=[];
  S.players.forEach(p=>{
    let cid=p.charId;
    if(cid==='drunk' && S.drunkMaskChar) cid=S.drunkMaskChar;
    scenes.push({t:'note', text:`📱 기기를 ${p.name}에게 건네세요. 다른 사람이 화면을 보지 않게 주의!`});
    scenes.push({t:'show-token', char:cid, caption:`${p.name} — 당신의 캐릭터입니다. 확인했으면 탭하고 다음 사람에게 넘기세요.`});
  });
  scenes.push({t:'note', text:'전원 확인 완료. 기기를 사회자에게 돌려주세요.'});
  startCustomWiz('👥 캐릭터 확인', scenes);
}
function charCard(c){
  return `<div class="charcard"><span class="cname">${esc(c.ko)}</span><span class="cen">${esc(c.en||'')}</span>
  <div class="cab">${esc(c.ability)}</div>
  ${(c.warn&&c.warn.length)?`<details class="morebox"><summary>사회자 노트 ${c.warn.length}건</summary><div class="inner"><ul>${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></details>`:''}
  </div>`;
}
function addPlayer(){ const v=$('#newpname').value.trim(); if(!v) return; if(S.players.length>=15){toast('최대 15명','warn');return;}
  S.players.push({id:uid(), name:v, charId:'', alive:true, deadVote:true, statuses:[], notes:''}); $('#newpname').value=''; save(); renderAll(); }
function removePlayer(pid){ S.players=S.players.filter(p=>p.id!==pid); save(); renderAll(); }
function movePlayer(pid,d){ const i=S.players.findIndex(p=>p.id===pid); const j=i+d; if(j<0||j>=S.players.length)return;
  [S.players[i],S.players[j]]=[S.players[j],S.players[i]]; save(); renderAll(); }
function setChar(pid,cid){ const p=playerOf(pid); p.charId=cid;
  p.statuses=(p.statuses||[]).filter(s=>s.key!=='drunkS');
  if(cid==='drunk') addStatus(p,'drunkS','주정뱅이',null);
  save(); renderAll(); }
function setHerring(pid){ S.redHerringId=pid;
  S.players.forEach(p=>p.statuses=(p.statuses||[]).filter(s=>s.key!=='herring'));
  const p=playerOf(pid); if(p) addStatus(p,'herring','점쟁이 셋업',null);
  save(); renderAll(); }
function setDrunkMask(cid){ S.drunkMaskChar=cid; save(); renderAll(); log(`주정뱅이 위장 캐릭터: ${charOf(cid)?.ko||'-'}`); }
function randomAssign(){
  const n=S.players.length; if(n<5) return;
  let baron = S.edition==='tb' && Math.random() < 0.35; // 남작 포함 여부를 먼저 굴린다
  const comp=compFor(n,baron);
  const pick=(arr,k,exclude)=>{ const pool=arr.filter(c=>!exclude.includes(c.id)); const out=[];
    while(out.length<k && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id); } return out; };
  const pool=editionChars().filter(c=>!c.custom);
  const tf=pool.filter(c=>c.type==='townsfolk'), os=pool.filter(c=>c.type==='outsider'),
        mi=pool.filter(c=>c.type==='minion'), de=pool.filter(c=>c.type==='demon');
  const minions = baron? ['baron'].concat(pick(mi,comp[2]-1,['baron'])) : pick(mi,comp[2],[]);
  if(!baron && minions.includes('baron')){ baron=true; }
  let roles=[].concat(pick(tf,comp[0],[]), pick(os,comp[1],[]), minions, pick(de,comp[3],[]));
  // 남작이 랜덤으로 뽑힌 경우 구성 재조정
  if(roles.includes('baron')){ const c2=compFor(n,true);
    roles=[].concat(pick(tf,c2[0],[]), pick(os,c2[1],[]), roles.filter(id=>charOf(id).type==='minion'), pick(de,c2[3],[]));
  }
  roles.sort(()=>Math.random()-.5);
  S.players.forEach((p,i)=>{ p.charId=roles[i]||''; p.statuses=[]; if(p.charId==='drunk') addStatus(p,'drunkS','주정뱅이',null); });
  S.redHerringId=null; S.drunkMaskChar=null;
  log('무작위 배정 완료'); save(); renderAll();
}

    ${sheetTab==='n1'? `<div>${['dusk'].concat(firstFull,['dawn']).map(id=>nightRow(ed,id,0)).join('')}</div>`:''}
    ${sheetTab==='n2'? `<div>${nightList(ed.other)}</div>`:''}
  </div>`;
}
function startFromSheet(ed){
  if(S.phase.kind!=='setup' && S.edition!==ed){
    if(!confirm('진행 중인 게임이 있습니다. 이 스크립트로 새 게임을 준비하면 배정이 초기화될 수 있습니다. 계속할까요?')) return;
  }
  if(S.edition!==ed){
    S.edition=ed;
    S.players.forEach(p=>{p.charId=''; p.statuses=[];});
    S.redHerringId=null; S.drunkMaskChar=null;
    log(`스크립트 선택: ${EDITIONS[ed].ko}`);
  }
  save(); switchTab('setup');
}
function downloadScriptJSON(ed){
  const data=JSON.stringify({name:SCRIPTS_META.find(s=>s.id===ed).ko, author:'Thyrsus',
    characters:allChars().filter(c=>(c.edition||'tb')===ed||c.custom).map(c=>c.id)}, null, 1);
  navigator.clipboard?.writeText(data).then(()=>toast('스크립트 JSON을 클립보드에 복사했습니다.','ok'),()=>prompt('복사하세요:',data));
}

/* ══════════════════ 그리모어 탭 ══════════════════ */
let grimView = 'circle', focusPid = null;
function statusIcons(p){ return (p.statuses||[]).map(s=>STATUS_DEFS[s.key].icon).join(''); }
function renderCircle(){
  const n=S.players.length; if(!n) return '<p class="hint">플레이어를 추가하면 원탁이 나타납니다.</p>';

      <div class="ctoken ${charOf(p.charId)?.type||''}">${p.alive?glyph(p.charId):'💀'}</div>

      <div class="crole">${charOf(p.charId)?esc(charOf(p.charId).ko):'—'}</div>
      <div class="cstat">${statusIcons(p)}</div></div>`;

  return `<div id="circlewrap">${seats}</div>`;
}
function renderGrim(){
  const el=$('#pane-grim');
  const focus=focusPid?playerOf(focusPid):null;
  el.innerHTML=`
  <div class="card"><h2>그리모어</h2>

    <button class="${grimView==='circle'?'on':''}" onclick="grimView='circle';renderAll()">원탁</button>
    <button class="${grimView==='cards'?'on':''}" onclick="grimView='cards';renderAll()">카드</button></span>
  <span class="hint">☠중독은 다음 밤 시작 시, 🛡보호·🤵주인은 만료 페이즈에 자동 해제. 모든 변동은 하단 기록에 남습니다.</span></div>
  ${grimView==='circle'?renderCircle()+(focus?'<div class="grid2" style="max-width:420px;margin:0 auto">'+playerCardHTML(focus,S.players.indexOf(focus))+'</div>':'<p class="hint" style="text-align:center">토큰을 누르면 상세 카드가 열립니다.</p>'):''}
  ${grimView==='cards'?`<div class="grid2">${S.players.map((p,i)=>playerCardHTML(p,i)).join('')}</div>`:''}
  </div>
  <div class="card"><h2>게임 기록</h2><div id="log">${S.log.map(l=>`<div class="lentry"><span class="lphase">[${esc(l.t)}]</span> ${esc(l.msg)}</div>`).join('')||'<span class="hint">아직 기록이 없습니다.</span>'}</div>
  <div class="row" style="margin-top:8px"><button class="small" onclick="exportGame()">게임 JSON 내보내기</button><button class="small" onclick="showReplay()">📜 전말 요약</button></div></div>`;
  const lg=$('#log'); if(lg) lg.scrollTop=lg.scrollHeight;
}
function playerCardHTML(p,i){
    const c=charOf(p.charId);
    return `<div class="pcard ${p.alive?'':'dead'}">
      <span class="seat">#${i+1}</span>
      <div class="pname">${esc(p.name)} ${p.alive?'':(p.deadVote!==false?'<span class="pill neutral">투표 토큰 보유</span>':'<span class="pill neutral">토큰 소진</span>')}</div>
      <div class="prole">${c?`<span class="pill ${c.type}">${TYPE_KO[c.type]}</span> ${esc(c.ko)}${p.charId==='drunk'&&S.drunkMaskChar?` <span class="token drunkT">🎭 ${esc(charOf(S.drunkMaskChar)?.ko||'')} 행세</span>`:''}`:'<span class="pill neutral">미배정</span>'}</div>
      <div class="tokens">${(p.statuses||[]).map((s,si)=>{const d=STATUS_DEFS[s.key];return `<span class="token ${d.cls}" title="${esc(d.desc)}${s.source?' — '+esc(s.source):''}">${d.icon} ${d.ko}<span class="x" onclick="removeStatus(playerOf('${p.id}'),${si});save();renderAll()">×</span></span>`;}).join('')}</div>
      <div class="pbtns">
        ${p.alive?`
        <button class="small" onclick="addStatusUI('${p.id}','poison')">☠중독</button>
        <button class="small" onclick="addStatusUI('${p.id}','protect')">🛡보호</button>
        <button class="small" onclick="addStatusUI('${p.id}','master')">🤵주인</button>
        <button class="small" onclick="openCharChange('${p.id}')">🔁 변경</button>
        <button class="small danger" onclick="confirmKill('${p.id}')">사망</button>
        `:`
        <button class="small" onclick="revivePlayer('${p.id}')">소생</button>
        ${p.deadVote!==false?`<button class="small" onclick="setDeadVote('${p.id}',false)">토큰 소진</button>`
                            :`<button class="small" onclick="setDeadVote('${p.id}',true)">토큰 복원</button>`}
        `}
      </div>
      <textarea rows="1" placeholder="메모 (밤마다 준 정보 등)" style="margin-top:8px;font-size:12.5px" onchange="playerOf('${p.id}').notes=this.value;save()">${esc(p.notes||'')}</textarea>
    </div>`;
}
function confirmKill(pid){ const p=playerOf(pid); if(!p) return;
  if(confirm(`${p.name} 사망 처리?`)){ killPlayer(p,'사회자 수동 처리'); save(); renderAll(); } }
function revivePlayer(pid){ const p=playerOf(pid); if(!p) return; p.alive=true; log(`${p.name} 소생(수동)`); save(); renderAll(); }
function setDeadVote(pid,v){ const p=playerOf(pid); if(!p) return; p.deadVote=v; log(`${p.name} 투표 토큰 ${v?'복원':'수동 소진'}`); save(); renderAll(); }
function addStatusUI(pid,key){
  const p=playerOf(pid); const ph=S.phase;
  let exp=null, src='사회자 수동';
  if(key==='poison'){ exp={kind:'night', n:(ph.kind==='night'?ph.n:ph.n)+1}; }
  if(key==='protect'){ exp = ph.kind==='night'? {kind:'day', n:ph.n} : {kind:'night', n:ph.n+1}; }
  if(key==='master'){ S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='master')); exp={kind:'night', n:ph.n+1}; }
  addStatus(p,key,src,exp); save(); renderAll();
}
function exportGame(){
  const blob=JSON.stringify(S,null,1);
  navigator.clipboard?.writeText(blob).then(()=>toast('게임 상태 JSON을 클립보드에 복사했습니다.','ok'),()=>prompt('복사하세요:',blob));
}
</script>

<script>
/* ══════════════════ 밤 진행 탭 ══════════════════ */
function nightSteps(){
  const first = S.phase.n===1;
  const ed = editionOf();
  const baseOrder = first? ed.first : ed.other;
  let order = baseOrder.slice();
  // 커스텀 캐릭터 삽입
  (S.customs||[]).forEach(c=>{
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const after = first? c.firstAfter : c.otherAfter;
    if(!after){ order.unshift(c.id); return; }
    const idx = order.indexOf(after);
    if(idx>=0) order.splice(idx+1,0,c.id); else order.push(c.id);
  });
  // 주정뱅이 위장: 위장 캐릭터가 시트에 없으므로, 그 캐릭터의 원래 순서 위치에 삽입
  const drunkP = S.edition==='tb'? S.players.find(p=>p.charId==='drunk') : null;
  const maskC = S.drunkMaskChar? charOf(S.drunkMaskChar): null;
  const steps=[];
  order.forEach(id=>{
    if(INFO_STEPS[id]){
      if(S.players.length>=INFO_STEPS[id].minPlayers) steps.push({id, info:true});
      return;
    }
    const c=charOf(id); if(!c) return;
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const holders = playersByChar(id);
    const maskHere = drunkP && maskC && maskC.id===id; // 위장 캐릭터가 실제로도 플레이 중일 수 있음
    if(!holders.length && !maskHere) return;
    steps.push({id, holders, mask: maskHere? drunkP : null});
  });
  // 위장 캐릭터가 인플레이가 아닌 경우: 순서표에 없으므로 원 위치에 직접 삽입
  if(drunkP && maskC && !steps.some(s=>s.id===maskC.id)){
    const wakes = first? maskC.first : maskC.other;
    if(wakes){
      const baseIdx = (first?ed.first:ed.other).indexOf(maskC.id);
      let insertAt = steps.length;
      if(baseIdx>=0){
        for(let i=0;i<steps.length;i++){
          const bi=(first?ed.first:ed.other).indexOf(steps[i].id);
          if(bi>baseIdx){ insertAt=i; break; }
        }
      }
      steps.splice(insertAt,0,{id:maskC.id, holders:[], mask:drunkP, maskOnly:true});
    }
  }
  return steps;
}
function stepSkipReason(st){
  const first=S.phase.n===1;
  if(st.info) return null;
  const c=charOf(st.id);
  const holders=(st.holders||[]).concat(st.mask?[st.mask]:[]);
  const anyAlive = holders.some(p=>p.alive);
  if(st.id==='ravenkeeper'){
    const rk=holders[0];
    if(rk && rk.alive) return '아직 생존 — 오늘 밤 죽는 경우에만 이 시점에 깨움';
    return null; // 죽었으면 표시(그 밤에 죽었는지는 사회자 판단)
  }
  if(!anyAlive){
    if(st.id==='zombuul' && holders.some(p=>hasStatus(p,'fakedead'))) return null; // 죽은 척 — 계속 깨움
    return '사망 — 깨우지 않음';
  }
  if(st.id==='undertaker' && !S.executedPrevDay && !first) return '어제 낮 처형 없음 — 깨우지 않음';
  if(st.id==='scarletwoman') return null;
  return null;
}
function autoInfoHint(st){
  /* 사회자 친화: 요리사·초공감자 정답 후보 자동 계산 */
  const seats=S.players;
  const evilAt = p => isEvil(p); // 등록 재량 반영 전 '실제' 값
  if(st.id==='chef'){
    let pairs=0;
    for(let i=0;i<seats.length;i++){ if(evilAt(seats[i]) && evilAt(seats[(i+1)%seats.length])) pairs++; }
    return `실제 인접 악 쌍: <b class="num">${pairs}</b> <span class="hint">(첩자·은둔자 등록 재량 반영 전 기준)</span>`;
  }
  if(st.id==='empath'){
    return (st.holders||[]).filter(p=>p.alive).map(p=>{
      const i=seats.indexOf(p); const n=seats.length;
      let L=null,R=null;
      for(let d=1;d<n;d++){ const q=seats[((i-d)%n+n)%n]; if(q.alive&&q!==p){L=q;break;} }
      for(let d=1;d<n;d++){ const q=seats[(i+d)%n]; if(q.alive&&q!==p){R=q;break;} }
      const cnt=(L&&evilAt(L)?1:0)+(R&&evilAt(R)?1:0);
      return `${esc(p.name)}의 생존 이웃: ${L?esc(L.name):'-'} · ${R?esc(R.name):'-'} → 실제 악 수 <b class="num">${cnt}</b> <span class="hint">(등록 재량 반영 전)</span>`;
    }).join('<br>');
  }
  if(st.id==='undertaker' && S.executedPrevDay){
    return `어제 처형: <b>${esc(S.executedPrevDay)}</b>`;
  }
  if(st.id==='fortuneteller' && S.redHerringId){
    const rh=playerOf(S.redHerringId);
    return rh? `🎗 붉은 청어: <b>${esc(rh.name)}</b> — 지목되면 "예"`:'';
  }
  return '';
}
function renderNight(){
  const el=$('#pane-night');
  if(S.phase.kind!=='night'){
    el.innerHTML=`<div class="card"><h2>밤 진행</h2><p class="hint">지금은 ${phaseName()} 단계입니다. 상단의 진행 버튼으로 밤으로 이동하면 이 시트 구성에 맞는 밤 순서가 생성됩니다.</p>
    ${previewNightOrders()}</div>`;
    return;
  }
  const steps=nightSteps();
  const doneMap=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={});
  const poisoned=S.players.filter(p=>hasStatus(p,'poison'));
  el.innerHTML=`
  <div class="card">
    <h2>밤 ${S.phase.n} ${S.phase.n===1?'(첫날 밤)':''}</h2>
    ${poisoned.length?`<div class="alertbox red">☠ 현재 중독: <b>${poisoned.map(p=>`${esc(p.name)}(${charName(p)})`).join(', ')}</b> — 이들의 능력은 오작동합니다(정보=거짓 가능, 발동=불발).</div>`:''}
    <p class="hint">순서대로 진행하며 완료 체크. 이름을 누르면 진행 가이드가 열립니다. 회색 항목은 오늘 밤 깨우지 않는 캐릭터입니다.</p>
    ${steps.map((st,i)=>renderStep(st,i,doneMap)).join('')}
    <div class="alertbox blue" style="margin-top:12px">🌅 <b>새벽</b> — 모두 깨우고, 오늘 밤의 사망자를 공표하세요(사인은 밝히지 않음). 상단 버튼으로 낮으로 진행하면 보호 토큰이 자동 해제됩니다.</div>
  </div>`;
}
function previewNightOrders(){
  const fmt=(ord,first)=>ord.map(id=>{
    if(INFO_STEPS[id]) return `<li>${INFO_STEPS[id].ko} <span class="hint">(7인 이상)</span></li>`;
    const c=charOf(id); return c?`<li>${esc(c.ko)}</li>`:'';
  }).join('');
  return `<div class="grid2" style="margin-top:10px">
    <div><h3>첫날 밤 순서 (공식)</h3><ol class="guide">${fmt(FIRST_NIGHT_ORDER,true)}</ol></div>
    <div><h3>그 외 밤 순서 (공식)</h3><ol class="guide">${fmt(OTHER_NIGHT_ORDER,false)}</ol></div>
  </div>`;
}
function renderStep(st,i,doneMap){
  const first=S.phase.n===1;
  const done=!!doneMap[st.id];
  const skip=stepSkipReason(st);
  let name, who='', body='';
  if(st.info){
    const inf=INFO_STEPS[st.id];
    name=inf.ko;
    const targets = st.id==='minioninfo' ? S.players.filter(p=>charOf(p.charId)?.type==='minion')
                                         : S.players.filter(p=>charOf(p.charId)?.type==='demon');
    who=targets.map(p=>esc(p.name)).join(', ');
    body=`<ol class="guide">${inf.guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    if(typeof NIGHT_FLOW!=='undefined' && flowFor(st.id)) body=`<div class="row" style="margin:4px 0 10px"><button class="primary" style="min-width:200px" onclick="event.stopPropagation();startWiz('${st.id}')">▶ 인터랙티브 진행</button></div>`+body;
    if(st.id==='demoninfo'){
      const inPlay=new Set(S.players.map(p=>p.charId));
      const safeBluffs=CHARACTERS.filter(c=>(c.type==='townsfolk'||c.type==='outsider') && !inPlay.has(c.id) && c.id!==S.drunkMaskChar).map(c=>c.ko);
      body+=`<div class="alertbox">블러프 후보(미사용 선 캐릭터, 주정뱅이 위장 제외): ${esc(safeBluffs.join(', ')||'없음')}</div>`;
    }
  } else {
    const c=charOf(st.id);
    name=c.ko;
    const holders=(st.holders||[]);
    who = holders.map(p=>{
      let tags='';
      if(!p.alive) tags+=' 💀';
      if(hasStatus(p,'poison')) tags+=' ☠';
      if(p.charId==='drunk'||hasStatus(p,'drunkS')) tags+=' 🍺';
      return esc(p.name)+tags;
    }).join(', ');
    if(st.mask) who += (who?' · ':'')+`🎭 ${esc(st.mask.name)} (주정뱅이 — ${esc(c.ko)} 행세)`;
    const guide = first? (c.guideFirst||c.guideOther) : (c.guideOther||c.guideFirst);
    if(guide) body+=`<ol class="guide">${guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    const hint=autoInfoHint(st);
    if(hint) body+=`<div class="alertbox blue">${hint}</div>`;
    const badHolders=holders.filter(p=>p.alive&&isMalfunctioning(p));
    if(badHolders.length) body+=`<div class="alertbox red">☠ <b>${badHolders.map(p=>esc(p.name)).join(', ')}</b>: 능력 오작동 상태 — 정보형이면 <b>거짓 정보</b>를 주고, 발동형이면 <b>효과 없음</b>으로 처리하되 본인에게는 평소처럼 응대하세요.</div>`;
    if(st.mask) body+=`<div class="alertbox">🎭 주정뱅이입니다 — ${esc(c.ko)}처럼 깨우되 <b>항상 그럴듯한 거짓 정보</b>를 주세요. 어떤 정보를 줬는지 그리모어 메모에 기록!</div>`;
    if(c.warn&&c.warn.length) body+=`<details class="morebox"><summary>상호작용 주의 ${c.warn.length}건</summary><div class="inner"><ul>${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></details>`;
    if(typeof NIGHT_FLOW!=='undefined' && flowFor(st.id)) body+=`<div class="row" style="margin:10px 0 4px"><button class="primary" style="min-width:200px" onclick="event.stopPropagation();startWiz('${st.id}')">▶ 인터랙티브 진행</button></div>`;
    body+=stepWidget(st,c);
    const recTargets=holders.filter(p=>p.alive).concat(st.mask&&st.mask.alive?[st.mask]:[]);
    if(recTargets.length) body+=`<div class="row" style="margin-top:10px">
      <input id="rec-${st.id}" placeholder="오늘 밤 제공한 정보 메모 (예: 2번·5번 중 요리사)" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')recordInfo('${st.id}','${recTargets[0].id}')">
      <button class="small" onclick="recordInfo('${st.id}','${recTargets[0].id}')">📝 기록</button></div>`;
    if(c.conditional) who+=` <span class="pill warn">${esc(c.conditional)}</span>`;
  }
  const cls = done?'done': skip?'skip':'wake';
  return `<div class="step ${cls} ${openStep===st.id?'open':''}" id="step-${st.id}">
    <div class="stephead" onclick="toggleStep('${st.id}')">
      <input type="checkbox" ${done?'checked':''} onclick="event.stopPropagation();toggleDone('${st.id}')" style="accent-color:var(--accent)">
      <span class="stepnum num">${i+1}</span>
      <span class="stepname">${esc(name)}</span>
      <span class="stepwho">${who||''}</span>
      ${skip?`<span class="pill neutral" style="margin-left:auto">${esc(skip)}</span>`:''}
    </div>
    <div class="stepbody">${body}</div>
  </div>`;
}
let openStep=null;
function toggleStep(id){ openStep = openStep===id? null : id; renderAll(); }
function toggleDone(id){ const m=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={}); m[id]=!m[id]; save(); renderAll(); }
function recordInfo(stepId, pid){
  const inp=document.getElementById('rec-'+stepId); const v=(inp&&inp.value||'').trim(); if(!v) return;
  const p=playerOf(pid); if(!p) return;
  p.notes=((p.notes||'')+`\n[밤${S.phase.n}] ${v}`).trim();
  log(`📝 ${p.name} 정보 기록: ${v}`);
  save(); renderAll();
  toast('기록됨 — 그리모어 메모에서 확인할 수 있습니다.','ok');
}

function selPlayers(fnName, filter, label, extraArg){
  const cand=S.players.filter(filter||(()=>true));
  return `<div class="row" style="margin-top:8px">
    <select id="sel-${fnName}"><option value="">— ${label} —</option>${cand.map(p=>`<option value="${p.id}">${esc(p.name)} (${charName(p)}${p.alive?'':' 💀'})</option>`).join('')}</select>
    <button class="small primary" onclick="${fnName}(document.getElementById('sel-${fnName}').value${extraArg?','+extraArg:''})">적용</button>
  </div>`;
}
function stepWidget(st,c){

  if(st.id==='butler') return `<h3>🤵 주인 기록</h3>`+selPlayers('doMaster', p=>p.alive&&p.charId!=='butler', '집사가 지목한 주인');
  if(st.id==='imp') return `<h3>🗡 살해 판정</h3><p class="hint">임프가 지목한 대상을 선택하면 보호·군인·시장·중독을 자동 판정합니다.</p>`+selPlayers('doImpKill', p=>true, '임프가 지목한 대상');
  if(st.id==='ravenkeeper') return `<h3>🔮 캐릭터 확인</h3><p class="hint">까마귀지기가 오늘 밤 죽어 지목한 대상 — 실제 캐릭터를 확인하세요(등록 재량 적용 가능).</p>`+selPlayers('doRavenPeek', p=>true, '까마귀지기가 지목한 대상');
  if(st.id==='witch') return `<h3>🧹 저주 대상 기록</h3>`+selPlayers('doCurse', p=>p.alive, '마녀가 지목한 대상');
  if(st.id==='cerenovus') return `<h3>🌀 광기 대상 기록</h3><p class="hint">대상 지정 후, 어떤 캐릭터의 광기인지 그리모어 메모에 적으세요.</p>`+selPlayers('doMad', p=>p.alive, '세레노버스가 지목한 대상');
  if(st.id==='exorcist'){
    const prev=(S.exorcistPrev && S.exorcistPrev.n<S.phase.n)? playerOf(S.exorcistPrev.pid):null;
    const cur=(S.exorcistPrev && S.exorcistPrev.n===S.phase.n)? playerOf(S.exorcistPrev.pid):null;
    return `<h3>📿 구마사제 대상 기록</h3>`
      +(prev?`<div class="alertbox">📿 어제 대상: <b>${esc(prev.name)}</b> — 오늘은 다른 사람을 지목해야 합니다.</div>`:'')
      +(cur?`<div class="alertbox blue">오늘 대상 기록됨: <b>${esc(cur.name)}</b></div>`:'')
      +`<p class="hint">악마를 지목했으면 악마를 깨워 구마사제를 보여주고, 이번 밤 악마 살해 단계를 건너뛰세요.</p>`
      +selPlayers('doExorcist', p=>p.alive, '구마사제가 지목한 대상');
  }
  if(SPENT_ONCE.includes(st.id) && !(c&&c.killer)) return `<h3>✔ 1회성 능력 추적</h3>`+spentWidget(st.id);
  if(c && c.killer && S.edition!=='tb'){ window.__stepKiller=c.id;  // 하위호환(위저드 미사용 경로)
    let extra='';
    if(c.id==='po'){
      extra = S.poCharged
        ? `<div class="alertbox red">⚡ 충전됨 — 이번 밤 3명 지목. 각각 아래에서 살해 기록하세요(살해 기록 시 충전 해제).</div>`
        : `<div class="row" style="margin-top:8px"><button class="small" onclick="doPoCharge()">🦏 이번 밤 지목 안 함(충전)</button></div>`;
    }
    if(SPENT_ONCE.includes(c.id)) extra+=spentWidget(c.id);
    return `<h3>🗡 살해 기록 (${esc(c.ko)})</h3>${extra}<p class="hint">보호·면역(여관 주인·찻집 여인·어릿광대·선원 등)은 위 가이드를 따라 수동 판정 후, 사망만 여기 기록하세요. 시전자 오작동·찻집 여인 이웃은 자동 판정됩니다.</p>`+selPlayers('doStepKill', p=>p.alive, c.ko+'가 지목한 대상', `'${c.id}'`);
  }
  return '';
}
/* 1회성 능력 소진 추적 (어릿광대·악마의 변호사 제외) */
const SPENT_ONCE=['courtier','professor','assassin','seamstress','philosopher','artist','fanggu'];
function spentWidget(cid){
  const holders=playersByChar(cid); if(!holders.length) return '';
  const p=holders.find(q=>!hasStatus(q,'spent'));
  if(!p) return `<div class="row" style="margin-top:8px"><span class="pill ok">✔ 1회 능력 소진됨</span></div>`;
  return `<div class="row" style="margin-top:8px"><button class="small" onclick="doSpend('${cid}')">✔ 능력 사용 — 소진 기록${cid==='fanggu'?' (점프)':''}</button></div>`;
}
function doSpend(cid){
  const p=S.players.find(q=>q.charId===cid && !hasStatus(q,'spent'));
  if(!p){ toast('대상이 없거나 이미 소진되었습니다.','warn'); return; }
  addStatus(p,'spent',`${charName(p)} 1회 능력 사용`,null);
  toast(`✔ ${p.name}(${charName(p)}) 1회 능력 소진 기록`,'ok');
  save(); renderAll();
}
function doPoCharge(){
  S.poCharged=true;
  log('🦏 포: 이번 밤 지목 없음 — ⚡ 충전 (다음 밤 3명 지목)');
  toast('⚡ 포 충전 기록 — 다음 밤에는 3명을 지목합니다.','warn');
  save(); renderAll();
}
function doExorcist(pid){
  if(!pid)return; const t=playerOf(pid);
  if(S.exorcistPrev && S.exorcistPrev.pid===pid && S.exorcistPrev.n<S.phase.n){
    toast(`📿 ${t.name}은(는) 어제의 대상 — 전날과 다른 사람을 지목해야 합니다.`,'warn'); return;
  }
  S.exorcistPrev={pid, n:S.phase.n};
  log(`📿 구마사제 지목: ${t.name}(${charName(t)})`);
  const ex=S.players.find(q=>q.alive&&q.charId==='exorcist');
  if(charOf(t.charId)?.type==='demon'){
    if(ex && isMalfunctioning(ex)) toast('대상이 악마지만 구마사제가 오작동 상태 — 효과 없음. 악마는 평소대로 활동합니다.','warn');
    else toast('😈 악마를 지목했습니다 — 악마를 깨워 구마사제를 보여주고, 이번 밤 악마 살해 단계를 건너뛰세요.','warn');
  } else {
    toast(`${t.name} 기록됨 — 악마가 아니므로 아무 일도 일어나지 않습니다.`,'ok');
  }
  save(); renderAll();
}
/* 찻집 여인: t가 '정상 작동 중인 생존 찻집 여인'의 살아있는 양옆 이웃이고, 그 이웃 둘 다 선(주민/외지인)이면 보호 */
function teaLadyBlock(t){
  const n=S.players.length;
  for(const tl of S.players){
    if(tl.charId!=='tealady' || !tl.alive || isMalfunctioning(tl)) continue;
    const i=S.players.indexOf(tl);
    let L=null,R=null;
    for(let d=1;d<n;d++){ const q=S.players[((i-d)%n+n)%n]; if(q.alive&&q!==tl){L=q;break;} }
    for(let d=1;d<n;d++){ const q=S.players[(i+d)%n]; if(q.alive&&q!==tl){R=q;break;} }
    if(!L||!R||L===R) continue;
    const good=p=>{const c=charOf(p.charId); return c&&(c.type==='townsfolk'||c.type==='outsider');};
    if(good(L)&&good(R)&&(t===L||t===R)) return tl;
  }
  return null;
}
function doPoison(pid){ if(!pid)return; const p=playerOf(pid); const poisoner=S.players.find(q=>q.charId==='poisoner');
  if(hasStatus(p,'poison')){ toast(`${p.name}은(는) 이미 중독 상태입니다 — 중복 부여하지 않습니다.`,'warn'); return; }
  if(poisoner && isMalfunctioning(poisoner)){ toast('독살범 본인이 오작동 상태 — 독이 퍼지지 않습니다. 기록만 남깁니다.','warn'); log(`독살범 오작동: ${p.name} 중독 불발`); save(); renderAll(); return; }
  addStatus(p,'poison','독살범',{kind:'night', n:S.phase.n+1}); save(); renderAll(); toast(`${p.name} 중독 — 내일 황혼(밤 ${S.phase.n+1} 시작)에 자동 해제`,'ok'); }
function doProtect(pid){ if(!pid)return; const p=playerOf(pid); const monk=S.players.find(q=>q.charId==='monk');
  if(monk && isMalfunctioning(monk)){
    toast('수도사가 오작동 상태 — 보호가 작동하지 않습니다! 토큰을 놓지 않고 기록만 남깁니다. 임프가 이 대상을 지목하면 그대로 사망 처리하세요.','warn');
    log(`수도사 오작동: ${p.name} 보호 무효(토큰 미부여)`); save(); renderAll(); return;
  }
  addStatus(p,'protect','수도사',{kind:'day', n:S.phase.n}); save(); renderAll(); }
function doMaster(pid){ if(!pid)return; S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='master'));
  const p=playerOf(pid); addStatus(p,'master','집사',{kind:'night', n:S.phase.n+1}); save(); renderAll(); }
function doImpKill(pid){
  if(!pid)return; const t=playerOf(pid);
  const imp=S.players.find(q=>q.alive && charOf(q.charId)?.type==='demon');
  if(imp && isMalfunctioning(imp)){ toast('임프가 중독/오작동 — 오늘 밤 살해 불발. 아무도 죽지 않습니다.','warn'); log(`임프 오작동: ${t.name} 살해 불발`); save(); renderAll(); return; }
  if(t===imp){ // 자살 → 별 넘기기 (승격을 먼저 하고 사망 처리해야 오판정이 없다)
    const minions=S.players.filter(q=>q.alive && charOf(q.charId)?.type==='minion');
    if(minions.length){
      const sw=minions.find(m=>m.charId==='scarletwoman');
      const pick=prompt(`임프가 될 하수인 이름을 입력하세요 (생존 하수인: ${minions.map(m=>m.name+'('+charName(m)+')').join(', ')})${sw?'\n관례: 탕녀 우선':''}`, (sw||minions[0]).name);
      const np=minions.find(m=>m.name===pick)||sw||minions[0];
      np.charId='imp'; log(`★ ${np.name}이(가) 새 임프가 됨 — 깨워서 임프 토큰을 보여주세요`);
      toast(`${np.name}이(가) 새 임프입니다. 지금 깨워 임프 토큰을 보여주세요.`,'warn');
    }
    killPlayer(t,'임프 자살(★ 별 넘기기)');
    save(); renderAll(); return;
  }
  if(!t.alive){ toast('이미 죽은 대상입니다 — 아무 일도 일어나지 않습니다.','warn'); return; }
  const mf=isMalfunctioning(t);
  if(hasStatus(t,'protect') && !mf){ toast(`${t.name}은(는) 수도사의 보호 중 — 사망 없음. 임프에게 알리지 마세요.`,'ok'); log(`임프 공격 → ${t.name} 보호로 무효`); save(); renderAll(); return; }
  if(t.charId==='soldier' && !mf){ toast(`${t.name}은(는) 군인 — 사망 없음. 임프에게 알리지 마세요.`,'ok'); log(`임프 공격 → 군인 ${t.name} 무효`); save(); renderAll(); return; }
  if(t.charId==='mayor' && !mf){
    if(confirm(`${t.name}은(는) 시장입니다. [확인] = 다른 플레이어가 대신 사망(재량), [취소] = 시장이 그대로 사망`)){
      const alt=prompt('대신 죽을 플레이어 이름:'); const ap=S.players.find(q=>q.name===alt&&q.alive);
      if(ap){ resolveNightDeath(ap, '임프(시장 대체 사망)'); save(); renderAll(); return; }
      toast('대상을 찾지 못해 시장 사망으로 처리합니다.','warn');
    }
  }
  resolveNightDeath(t, '임프의 공격');
  save(); renderAll();
}
function resolveNightDeath(t, cause){
  killPlayer(t, cause);
  if(t.charId==='ravenkeeper' && !isMalfunctioning(t)){
    toast('🔮 까마귀지기가 밤에 죽었습니다 — 지금 깨워서 1명을 지목받고 캐릭터를 보여주세요(까마귀지기 단계).','warn');
  }
  if(t.charId==='ravenkeeper' && isMalfunctioning(t)){
    toast('까마귀지기가 죽었지만 중독/오작동 — 깨우되 거짓 캐릭터를 보여주세요.','warn');
  }
}
function doCurse(pid){ if(!pid)return; S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='curse'));
  const p=playerOf(pid); addStatus(p,'curse','마녀',{kind:'night', n:S.phase.n+1}); save(); renderAll(); }
function doMad(pid){ if(!pid)return; S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='mad'));
  const p=playerOf(pid); addStatus(p,'mad','세레노버스',{kind:'night', n:S.phase.n+1}); save(); renderAll(); }
function doStepKill(pid, killerId){ if(!pid)return; const t=playerOf(pid);
  const kid = killerId || window.__stepKiller;
  const actor=S.players.find(q=>(q.alive || (q.charId==='zombuul'&&hasStatus(q,'fakedead'))) && q.charId===kid);
  if(actor && isMalfunctioning(actor)){ toast(`${charName(actor)}이(가) 오작동 상태 — 이 살해는 불발입니다.`,'warn'); log(`${charName(actor)} 오작동: ${t.name} 살해 불발`); save(); renderAll(); return; }
  if(!t.alive){ toast('이미 죽은 대상입니다.','warn'); return; }
  // 찻집 여인 이웃 보호 자동 판정 (암살자는 모든 보호 관통)
  if(kid!=='assassin'){
    const tl=teaLadyBlock(t);
    if(tl){
      toast(`🍵 ${t.name}은(는) 찻집 여인(${tl.name})의 살아있는 선한 이웃 — 사망하지 않습니다(불발). 악마에게 티 내지 마세요.`,'ok');
      log(`🍵 찻집 여인 보호: ${t.name} 살해 불발 (${actor?charName(actor):'악마'}의 공격)`);
      save(); renderAll(); return;
    }
  }
  if(kid==='po' && S.poCharged){ S.poCharged=false; log('⚡ 포 충전 해제 — 살해 기록됨'); }
  resolveNightDeath(t, (actor?charName(actor):'악마')+'의 공격');
  save(); renderAll(); }
function doRavenPeek(pid){ if(!pid)return; const t=playerOf(pid);
  const c=charOf(t.charId); toast(`${t.name}의 실제 캐릭터: ${c?c.ko:'?'} — 첩자/은둔자면 등록 재량, 까마귀지기가 오작동이면 거짓 제시 가능.`,'ok');
  log(`까마귀지기 확인: ${t.name} (${c?c.ko:'?'})`); }
</script>

<script>
/* ══════════════════ 낮 · 투표 탭 ══════════════════ */
function voteNotices(nom){
  const out=[];
  const butler=S.players.find(p=>p.alive&&p.charId==='butler');

    const master=S.players.find(p=>hasStatus(p,'master'));

  }
  const virgin=S.players.find(p=>p.alive&&p.charId==='virgin'&&!hasStatus(p,'virginUsed'));
  if(virgin) out.push(`⚜ <b>성결자(${esc(virgin.name)})</b> 미발동 — 최초 지명 시 지명자가 마을 주민이면 즉시 처형!${isMalfunctioning(virgin)?' <mark>현재 오작동 — 발동하지 않지만 능력은 소진됨</mark>':''}`);
  const saint=S.players.find(p=>p.alive&&p.charId==='saint');
  if(saint) out.push(`✝ <b>성자(${esc(saint.name)})</b> 생존 중 — 처형되면 선한 팀 패배.${isMalfunctioning(saint)?' <mark>현재 오작동 — 처형돼도 패배하지 않음</mark>':''}`);
  const sw=S.players.find(p=>p.alive&&p.charId==='scarletwoman');
  if(sw && alivePlayers().length>=5) out.push(`🔴 <b>탕녀</b> 생존 + 생존자 ${alivePlayers().length}명(5+) — 지금 악마가 처형돼도 게임은 끝나지 않습니다(계승).${isMalfunctioning(sw)?' <mark>단, 현재 오작동 — 계승 불발!</mark>':''}`);
  const mayor=S.players.find(p=>p.alive&&p.charId==='mayor');
  if(mayor && alivePlayers().length===3) out.push(`🏛 <b>시장</b> 생존 + 생존자 3명 — 오늘 처형 없이 낮이 끝나면 선한 팀 승리!${isMalfunctioning(mayor)?' <mark>현재 오작동 — 승리 조건 무효</mark>':''}`);
  const slayer=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(slayer) out.push(`🏹 <b>처단자(${esc(slayer.name)})</b> 미사용 — 낮 중 공개 지목 가능. 사용 시 아래 버튼으로 판정하세요.`);
  const artist=S.players.find(p=>p.alive&&p.charId==='artist');
  if(artist){
    out.push(hasStatus(artist,'spent')
      ? `🎨 <b>화가(${esc(artist.name)})</b> — 1회 질문 이미 소진됨.`
      : `🎨 <b>화가(${esc(artist.name)})</b> 1회 질문 미사용 — 질문을 받으면 <button class="small" onclick="doSpend('artist')">✔ 소진 기록</button>`);
  }
  const deadHold=S.players.filter(p=>!p.alive&&p.deadVote!==false);
  if(deadHold.length) out.push(`👻 사망 투표 토큰 보유: ${deadHold.map(p=>esc(p.name)).join(', ')} — 찬반 투표 참여 시 자동 소진·기록됩니다.`);
  // 에디션 공통: dayNotice 필드 자동 노출
  allChars().filter(c=>c.dayNotice).forEach(c=>{
    if(playersByChar(c.id).some(p=>p.alive || (c.id==='klutz'||c.id==='sweetheart'||c.id==='barber'))) out.push(esc(c.dayNotice).replace(/&#39;/g,"'"));
  });
  // 커스텀 캐릭터의 투표 관련 노티스
  (S.customs||[]).filter(c=>c.voteRelated).forEach(c=>{
    playersByChar(c.id).filter(p=>p.alive).forEach(p=>out.push(`🔔 <b>${esc(c.ko)}(${esc(p.name)})</b>: ${esc(c.voteNote||c.ability)}`));
  });
  if(nom){
    const nee=playerOf(nom.nominee);
    if(nee){
      if(nee.charId==='saint') out.push(`🚨 지명 대상이 <b>성자</b>입니다 — 처형 확정 전 중독 여부를 반드시 확인!`);
      if(nee.charId==='recluse') out.push(`👤 지명 대상이 <b>은둔자</b> — 처형돼도 게임은 끝나지 않습니다(악마 아님).`);
      if(charOf(nee.charId)?.type==='demon') out.push(`😈 지명 대상이 <b>악마</b> — 처형 시 탕녀 계승·생존자 수(5+) 확인.`);
    }
  }
  return out;
}

  </div>`:''}`;

function newNomination(){

  const nom={id:uid(), day:S.phase.n, nominator:tor, nominee:nee, hands:[], stage:1, votes:{}, closed:false, deadVoters:[]};
  S.noms.push(nom);
  log(`지명: ${playerOf(tor).name} → ${playerOf(nee).name}`);

        killPlayer(torP,'성결자 발동 — 즉시 처형');
        S.executedToday=`${torP.name} (${charName(torP)}) — 성결자 발동`;
        nom.closed=true; nom.result='virginTriggered';
        toast('처형 완료. 오늘은 추가 처형이 불가합니다. 장의사는 오늘 밤 지명자의 캐릭터를 봅니다.','warn');
      }
    } else if(torP.charId==='spy'){
      toast('⚜ 성결자 최초 지명 — 지명자가 첩자입니다. "마을 주민으로 등록"시켜 발동시킬지 재량으로 결정하세요. 발동시키려면 그리모어에서 수동 처형 처리.','warn');
    } else {

    }
  }
  save(); renderAll();
}

        return `<div class="voterow"><span class="vname">${esc(p.name)}</span>
          <button class="vbtn ${on?'sel-yes':''}" onclick="toggleHand('${nom.id}','${p.id}')">${on?'✋ 거수':'거수'}</button>
          ${butlerFlag?`<span class="hint">🤵 집사 — 주인(${master?esc(master.name):'미지정'})이 거수해야 유효${on&&!masterUp?' <mark>⚠ 지금 주인 미거수!</mark>':''}</span>`:''}

  return `<div class="card"><h2>진행 중 지명: ${torN} → ${neeN}</h2>

      const ord=[]; const n=S.players.length;

function findNom(id){ return S.noms.find(n=>n.id===id); }
function toggleHand(nid,pid){ const n=findNom(nid); const i=n.hands.indexOf(pid);
  if(i>=0)n.hands.splice(i,1); else n.hands.push(pid); save(); renderAll(); }
function closeHands(nid){ const n=findNom(nid); const den=alivePlayers().length, need=majority(den);
  if(n.hands.length>=need){ n.stage=2; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 통과, 찬반 투표로`); }
  else { n.closed=true; n.result='handsFail'; log(`거수 ${n.hands.length}/${den} (기준 ${need}) — 미달, 부결`); }
  save(); renderAll(); }
function castVote(nid,pid,v){
  const n=findNom(nid); const p=playerOf(pid);
  const prev=n.votes[pid];
  if(!p.alive){
    if(prev===v){ delete n.votes[pid]; if(v!=='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.id); log(`${p.name} 사망 투표 취소 — 토큰 복원`);} save(); renderAll(); return; }
    if((v==='yes'||v==='no') && !(prev==='yes'||prev==='no')){
      if(p.deadVote===false){ toast(`${p.name}은(는) 이미 투표 토큰을 소진했습니다.`,'warn'); return; }
      p.deadVote=false; if(!n.deadVoters.includes(p.id)) n.deadVoters.push(p.id);
      log(`👻 ${p.name} 사망 투표 참여(${v==='yes'?'찬성':'반대'}) — 토큰 자동 소진`);
    }
    if((prev==='yes'||prev==='no') && v==='abs'){ p.deadVote=true; n.deadVoters=n.deadVoters.filter(x=>x!==p.id); log(`${p.name} 기권으로 변경 — 토큰 복원`); }
    n.votes[pid]=v; save(); renderAll(); return;
  }
  n.votes[pid] = prev===v? undefined : v;
  if(n.votes[pid]===undefined) delete n.votes[pid];
  save(); renderAll();
}
function closeBallot(nid){
  const n=findNom(nid);
  const uniq=S.players.filter(p=>p.alive || p.deadVote!==false || n.votes[p.id]!==undefined);
  const den=uniq.length, need=majority(den);
  const yes=uniq.filter(p=>n.votes[p.id]==='yes').length;
  n.yes=yes; n.den=den; n.need=need; n.ratio=den?yes/den:0;
  n.closed=true; n.result = yes>=need? 'pass':'yesFail';
  log(`찬반 마감: ${playerOf(n.nominee).name} — 찬성 ${yes}/${den} (기준 ${need}, ${(n.ratio*100).toFixed(1)}%) → ${n.result==='pass'?'과반 통과':'부결'}`);
  save(); renderAll();
}
function cancelNom(nid){ S.noms=S.noms.filter(n=>n.id!==nid); log('지명 취소'); save(); renderAll(); }
function executeNominee(nid){
  const n=findNom(nid); const p=playerOf(n.nominee);

    log(`🍵 찻집 여인 보호 — ${p.name} 처형 확정 취소`);
    toast(`🍵 처형 중단 — ${p.name}은(는) 찻집 여인의 보호를 받습니다.`,'warn');
    return;
  }
  const saintCheck = p.charId==='saint' && !isMalfunctioning(p);
  if(saintCheck && !confirm(`🚨 ${p.name}은(는) 성자이며 오작동 상태가 아닙니다!\n처형을 확정하면 선한 팀이 패배합니다. 진행할까요?`)) return;
  killPlayer(p, `처형 (찬성 ${n.yes}/${n.den}, ${(n.ratio*100).toFixed(1)}%)`);
  S.executedToday=`${p.name} (${charName(p)})`;
  if(saintCheck){ toast('✝ 성자가 처형되었습니다 — 악한 팀 승리!','warn'); log('성자 처형 — 악 승리'); }
  toast(`${p.name} 처형. 오늘 밤 장의사에게 보여줄 캐릭터: ${charName(p)} (첩자/은둔자/주정뱅이면 등록 재량)`,'ok');
  save(); renderAll();
}
function doSlayer(){
  const sl=S.players.find(p=>p.alive&&p.charId==='slayer'&&!hasStatus(p,'slayerUsed'));
  if(!sl) return;
  const name=prompt('처단자가 지목한 플레이어 이름:'); const t=S.players.find(p=>p.name===name);
  if(!t){ toast('플레이어를 찾지 못했습니다.','warn'); return; }
  addStatus(sl,'slayerUsed','공개 지목',null);
  if(isMalfunctioning(sl)){ toast('처단자가 오작동 상태 — "아무 일도 일어나지 않습니다"라고 공표. 능력 소진.','warn'); log(`처단자 오발(오작동): ${t.name}`); save(); renderAll(); return; }
  const c=charOf(t.charId);
  if(c?.type==='demon' && t.alive){ killPlayer(t,'처단자의 일격'); toast(`😈 ${t.name}(악마) 즉사! 탕녀·생존자 수를 확인하세요.`,'warn'); }
  else if(t.charId==='recluse' && t.alive){
    if(confirm(`${t.name}은(는) 은둔자 — 악마로 등록시켜 죽일까요? (재량)`)){ killPlayer(t,'처단자의 일격(은둔자 악마 등록)'); toast('은둔자가 쓰러졌습니다 — 게임은 끝나지 않습니다. 태연하게!','warn'); }
    else { toast('"아무 일도 일어나지 않습니다" 공표.','ok'); log(`처단자 → 은둔자 ${t.name}: 미등록 처리`); }
  }
  else { toast('"아무 일도 일어나지 않습니다"라고 공표하세요.','ok'); log(`처단자 오발: ${t.name}`); }
  save(); renderAll();
}
</script>

let wikiFilter='all', wikiQ='';

      ${wikiH('등장 스크립트')}
      <p>${esc(EDITIONS[c.edition||'tb']?.ko||'커스텀')}${EDITIONS[c.edition||'tb']?.en?` <span class="hint" style="display:inline">(${esc(EDITIONS[c.edition||'tb'].en)})</span>`:''} · ${TYPE_KO[c.type]}</p>

      ${(c.guideFirst&&c.guideFirst.length)?`<p style="margin:4px 0 2px"><b>첫날 밤</b></p><ol class="guide">${c.guideFirst.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
      ${(c.guideOther&&c.guideOther.length)?`<p style="margin:10px 0 2px"><b>그 외 밤</b></p><ol class="guide">${c.guideOther.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
      ${(wx.howto&&wx.howto.length)?`<p style="margin:10px 0 2px"><b>낮 능력·판정 팁</b></p><ul class="guide">${wx.howto.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
      ${(!(c.guideFirst&&c.guideFirst.length)&&!(c.guideOther&&c.guideOther.length)&&!(wx.howto&&wx.howto.length))?'<p class="hint">밤에 깨우지 않는 능력 — 조건이 충족되는 순간 자동으로 판정한다.</p>':''}
      ${wikiH('상호작용·주의')}

let guideSel='';
function genDiscretion(){
  const cid=$('#dg-char').value, type=$('#dg-type').value, desc=$('#dg-desc').value.trim();
  const c=cid==='_other'?null:charOf(cid);
  const g=EFFECT_GUIDES[type];
  const holder=c?playersByChar(c.id).find(p=>p.alive):null;
  const mf=holder?isMalfunctioning(holder):false;
  let html=`<div class="alertbox blue" style="margin-top:12px"><b>${c?esc(c.ko):'커스텀 능력'} · ${g.ko}</b>${desc?` — ${esc(desc)}`:''}
  <ol class="guide" style="margin-top:6px">${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
  if(holder&&mf) html+=`<div class="alertbox red">☠ 현재 ${esc(holder.name)}(${esc(c.ko)})은(는) 오작동 상태입니다 — 이 발동은 <b>불발/거짓</b>으로 처리하되, 본인에게는 평소처럼 응대하세요.</div>`;
  if(c&&c.warn&&c.warn.length) html+=`<div style="margin-top:6px" class="hint">관련 상호작용: ${c.warn.map(esc).join(' / ')}</div>`;
  html+=`<div class="hint" style="margin-top:6px">💡 판단이 서지 않으면: "흥미로운 시도네요 — 오늘 밤 결과를 알려드리죠"라고 답하고 시간을 버세요. 즉답 의무는 없습니다.</div></div>`;
  $('#dg-out').innerHTML=html;
  log(`재량 발동 기록: ${c?c.ko:'커스텀'} · ${g.ko}${desc?' · '+desc:''}`);
  save();
}

/* ══════════════════ 체크리스트 탭 (시트별 잊지 말 것) ══════════════════ */
function buildChecklist(){
  const items=[]; const add=(group,src,txt)=>items.push({group,src,txt,key:group+'|'+src+'|'+txt});
  const inPlay=id=>S.players.some(p=>p.charId===id);
  // 셋업
  if(inPlay('baron')) add('셋업','남작','구성 변경 적용 확인: 마을 주민 −2 / 외지인 +2');
  if(inPlay('drunk')) add('셋업','주정뱅이',`위장 캐릭터 지정(현재: ${S.drunkMaskChar?charOf(S.drunkMaskChar).ko:'⚠ 미지정'}) — 본인에게는 그 주민 토큰을 보여줄 것`);
  if(inPlay('fortuneteller')) add('셋업','점쟁이',`붉은 청어 지정(현재: ${S.redHerringId?playerOf(S.redHerringId)?.name:'⚠ 미지정'}) — 게임 내내 유지`);
  add('셋업','공통','7인 이상이면 첫날 밤 하수인 정보 → 악마 정보(블러프 3개) 순서 진행');
  // 매일 밤
  if(inPlay('poisoner')) add('매일 밤','독살범','새 중독 대상 기록 — 이전 독은 황혼에 자동 해제되었는지 확인');
  if(inPlay('monk')) add('매일 밤','수도사','보호 대상 갱신 — 보호는 그 밤만, 새벽 자동 해제');
  if(inPlay('butler')) add('매일 밤','집사','주인 갱신 — 다음 날 투표 제한에 직결');
  if(inPlay('empath')) add('매일 밤','초공감자','이웃 사망 시 "살아있는 이웃" 재계산');
  if(inPlay('undertaker')) add('매일 밤','장의사','어제 처형이 있었을 때만 깨움 — 성결자 발동 처형 포함');
  if(inPlay('spy')) add('매일 밤','첩자','밤 순서 맨 끝에 그리모어 공개 — 충분한 시간');
  if(inPlay('drunk')) add('매일 밤','주정뱅이','위장 캐릭터 순서에 깨워 일관된 거짓 정보 — 지난 밤에 준 정보 메모 확인');
  // 낮·투표
  if(inPlay('virgin')) add('낮·투표','성결자','최초 지명 시 발동 판정 — 지명자가 주민인지, 성결자가 중독인지');
  if(inPlay('saint')) add('낮·투표','성자','처형 확정 전 중독 여부 확인 — 정상이면 선 패배');
  if(inPlay('butler')) add('낮·투표','집사','주인이 거수/찬성했는지 매 투표 확인');
  if(inPlay('slayer')) add('낮·투표','처단자','공개 지목 시 즉시 판정 — 오작동/은둔자 등록 재량, 성공·실패 무관 소진');
  if(inPlay('mayor')) add('낮·투표','시장','생존 3명이 되면: 처형 없이 낮 종료 = 선 승리(오작동 확인)');
  if(inPlay('scarletwoman')) add('낮·투표','탕녀','악마 사망 시 생존자 5+ 확인 → 계승, 게임 계속. 그녀가 중독이면 계승 불발!');
  if(inPlay('recluse')) add('낮·투표','은둔자','정보·처단자·처형 판정마다 악 등록 여부를 의식적으로 결정');
  if(inPlay('imp')) add('낮·투표','임프','임프 처형·사망 시: 탕녀 → 없으면 게임 종료 선언');
  if(inPlay('soldier')) add('참고','군인','임프 공격 무효 — 단 중독 밤엔 죽는다');
  if(inPlay('ravenkeeper')) add('참고','까마귀지기','밤 사망 시 즉시 발동 — 잊기 쉬움! 임프 살해 판정 직후 확인');
  // 에디션 공통: 인플레이 캐릭터의 remind·setupNote 자동 편입
  editionChars().filter(c=>!c.custom && (c.edition||'tb')!=='tb').forEach(c=>{
    if(!S.players.some(p=>p.charId===c.id)) return;
    if(c.setupNote) add('셋업', c.ko, c.setupNote);
    (c.remind||[]).forEach(r=>add('매일 밤', c.ko, r));
    if(c.dayNotice) add('낮·투표', c.ko, c.dayNotice.replace(/^[^ ]+ /,''));
  });
  // 커스텀
  (S.customs||[]).forEach(c=>{
    if(S.players.some(p=>p.charId===c.id)){
      (c.reminders||[]).forEach(r=>add('커스텀',c.ko,r));
      if(!(c.reminders||[]).length) add('커스텀',c.ko,'커스텀 캐릭터 — 상호작용 검증 필요(제작자에게 시트 검토 요청)');
    }
  });
  return items;
}
function toggleCheck(key,v){ S.checks[key]=v; save(); }
function renderCheck(){
  const el=$('#pane-check');
  const items=buildChecklist();
  const groups=[...new Set(items.map(i=>i.group))];
  el.innerHTML=`<div class="card"><h2>이 시트의 사회자 체크리스트</h2>
  <p class="hint">현재 배정된 캐릭터 기준으로 자동 생성됩니다. 배정이 바뀌면 목록도 바뀝니다.</p>
  ${items.length?groups.map(g=>`<h3>${g}</h3>${items.filter(i=>i.group===g).map(i=>`
    <div class="checkitem"><input type="checkbox" ${S.checks[i.key]?'checked':''} onchange="toggleCheck(${JSON.stringify(i.key).replace(/"/g,'&quot;')},this.checked)">
    <span><span class="src">[${esc(i.src)}]</span> ${esc(i.txt)}</span></div>`).join('')}`).join('')
   :'<p class="hint">캐릭터를 배정하면 시트 맞춤 체크리스트가 생성됩니다.</p>'}
  </div>`;
}

/* ══════════════════ 커스텀 탭 ══════════════════ */
function renderCustom(){
  const el=$('#pane-custom');
  const mk=(ord)=>['__front'].concat(ord).map(id=>{

function addCustom(){

  S.customs.push(c); log(`커스텀 캐릭터 추가: ${ko}`); save(); renderAll();

}
function delCustom(id){ S.customs=S.customs.filter(c=>c.id!==id); S.players.forEach(p=>{if(p.charId===id)p.charId='';}); save(); renderAll(); }
function exportScript(){
  const data=JSON.stringify({name:'티르소스 커스텀 시트', base:'trouble-brewing', customs:S.customs}, null, 1);
  navigator.clipboard?.writeText(data).then(()=>toast('시트 JSON 복사됨 — Claude에게 붙여넣어 검증을 요청하세요.','ok'),()=>prompt('복사하세요:',data));
}
function importScript(){
  const raw=prompt('시트 JSON을 붙여넣으세요:'); if(!raw)return;
  try{ const d=JSON.parse(raw); if(Array.isArray(d.customs)){ S.customs=d.customs; save(); renderAll(); toast('가져오기 완료','ok'); } else toast('customs 배열이 없습니다.','warn'); }
  catch(e){ toast('JSON 파싱 실패','warn'); }
}

function renderAll(){

}

$('#themebtn').onclick=()=>{

};
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme',S.theme);
if(S.phase.kind==='night') activeTab='night'; else if(S.phase.kind==='day') activeTab='day'; else activeTab='scripts';
renderAll();
