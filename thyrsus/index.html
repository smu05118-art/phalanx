].sort((a,b)=> a.precedence-b.precedence);

/* ── 수정자 파이프라인 공통부 ─────────────────────────────────────────────────
   '표(table)'는 수정자 배열이고, 배열에 붙은 .spec 이 그 표의 계약이다.
     kind          표 이름(진단·차분 도구가 읽는다)
     defaultStages stages 인자를 생략했을 때 평가할 단계 목록
     ctx           기본 컨텍스트 팩토리(subject 를 받는다)
     probeCtx      '이 항목 하나가 성립하나'만 묻는 modApplies 용 컨텍스트 팩토리
     result        결과 골격 팩토리
     apply         항목이 성립했을 때 결과에 반영하는 함수 (out, m, c, why)
   사슬을 도는 방식(단계 필터 · implemented:false 건너뛰기 · pierce · 첫 성립에서 종료 ·
   검토한 전 항목의 근거 기록)은 판정 종류와 무관하므로 runModifiers 한 곳에만 있다.
   DEATH_SPEC 의 내용은 전환 전 runDeathModifiers 본문을 그대로 옮긴 것이다 — 동작 무변경.
   무행동 증명: thyrsus_sim/pipeline_diff.js --suite=death (원본 sandbox 와 전체 결과 객체 비교) */
const DEATH_SPEC = {
  kind:'death',
  defaultStages:['block'],
  ctx:(t)=>({sourceType:'demon', sourceCharId:null, cause:'', bypass:false,
             phase:(S.phase&&S.phase.kind)||null, alive:!!(t&&t.alive)}),
  probeCtx:()=>({sourceType:'demon', sourceCharId:null, cause:'', bypass:false}),
  result:()=>({died:true, blockedBy:null, reason:null, substitute:null, effect:null, pierced:false}),
  apply:(out,m,c,why)=>{
    out.blockedBy=m.id; out.effect=m.effect;
    if(m.effect==='block'){ out.died=false; out.reason=why; }
    else if(m.effect==='substitute'){ out.substitute=true; }
  }
};
DEATH_MODIFIERS.spec = DEATH_SPEC;

/* 수정자 사슬을 돌려 '판정 + 검토된 전 항목의 근거 사슬'을 만든다. 게임 상태를 바꾸지 않는 순수 함수다.
   stages 를 주지 않으면 표의 defaultStages 를 본다(사망 표는 'block' — 기존 deathBlockReason 과 같은 범위다). */
function runModifiers(table, t, ctx, stages){
  const spec = (table && table.spec) || DEATH_SPEC;
  const st = stages || spec.defaultStages || ['block'];
  const c = Object.assign(spec.ctx(t), ctx||{});
  const out = Object.assign(spec.result(), {trace:[], ctx:c});
  const note = (m, applied, why)=> out.trace.push({id:m.id, ko:m.ko, precedence:m.precedence, applied, why:String(why||'').slice(0,140)});
  if(!t) return out;
  let decided=false;
  for(const m of (table||[])){
    if(decided){ note(m,false,'앞선 판정으로 결정됨 — 평가하지 않음'); continue; }
    /* stage 는 문자열 또는 배열이다 — 관통(pierce)처럼 block 과 kill 두 단계에서 같은 근거로
       평가돼야 하는 항목이 있다. 문자열 항목의 동작은 종전과 완전히 같다. */
    const mst=Array.isArray(m.stage)? m.stage : [m.stage];
    if(!mst.some(x=>st.indexOf(x)>=0)){ note(m,false,`이 경로에서 평가하지 않는 단계(${mst.join('/')})`); continue; }
    if(m.implemented===false){ note(m,false,'미구현 — 사회자 수동 판정'); continue; }
    let hit=false; try{ hit=!!m.when(t,c); }catch(e){ hit=false; }
    if(!hit){ note(m,false,'조건 불성립'); continue; }
    if(m.effect==='pierce'){ out.pierced=true; note(m,true,'이후 모든 보호·면역을 무시한다'); decided=true; continue; }
    let why=''; try{ why=m.reason(t,c)||''; }catch(e){ why=m.ko; }
    note(m,true,why);
    decided=true;
    spec.apply(out,m,c,why);
  }
  return out;
}
/* 사망 표 전용 창구 — deathBlockReason·resolveDeath·killPlayer 의 기존 계약을 그대로 유지한다 */
function runDeathModifiers(t, ctx, stages){ return runModifiers(DEATH_MODIFIERS, t, ctx, stages); }
/* 수정자 하나의 성립 여부만 묻는 창구 — killPlayer·doImpKill 의 분기 조건을 표에서 읽어오게 한다.
   컨텍스트는 표의 spec.probeCtx() 에서 온다(사망 표는 전환 전과 같은 4개 키 그대로). */
function modApplies(table, id, t, ctx){
  const m=(table||[]).find(x=>x.id===id);
  if(!m || m.implemented===false || !t) return false;
  const spec=(table && table.spec) || DEATH_SPEC;
  const base=spec.probeCtx? spec.probeCtx(t) : spec.ctx(t);
  const c=Object.assign(base, ctx||{});
  /* 관통(pierce)은 표의 계약상 '이후 모든 항목을 무효로 만든다'(runModifiers 의 decided 와 같은 규칙).
     항목 하나만 묻는 이 창구에도 같은 규칙을 적용해야 killPlayer 의 kill 단계 분기가 block 단계와
     어긋나지 않는다 — 암살자가 좀버얼을 죽여도 '죽은 척'으로 살아남던 자리가 여기였다.
     ctx 에 bypass 를 넣지 않는 기존 호출부는 probeCtx 의 bypass:false 라 판정이 불변이다. */
  if(m.effect!=='pierce'){
    for(const x of (table||[])){
      if(x===m) break;                                   // 우선순위가 뒤인 항목은 이 판정을 뒤집지 못한다
      if(x.effect!=='pierce' || x.implemented===false) continue;
      let px=false; try{ px=!!x.when(t,c); }catch(e){ px=false; }
      if(px) return false;
    }
  }
  try{ return !!m.when(t,c); }catch(e){ return false; }
}
function deathModApplies(id, t, ctx){ return modApplies(DEATH_MODIFIERS, id, t, ctx); }
/* ── 정보 판정 표(골격) — 이번 라운드는 '빈 표'다 ────────────────────────────
   목적: 거짓 정보를 만들 수 있는 사유(중독·취함·주정뱅이·첩자/은둔자 등록·문지기 등)를
   지금처럼 각 do*() 안의 if 사슬에 흩어 두는 대신, 사망 표와 같은 형태의 선언 항목으로 모은다.
   항목 형태는 사망 표와 동일하다: {id, ko, precedence, stage, effect, official, when, reason}.
   단계(stage)는 'gather'(정보를 만들기 직전) · 'deliver'(사회자에게 문구를 내보내기 직전)를 쓸 예정이다.
   지금은 항목이 하나도 없어 runModifiers 가 즉시 기본 결과를 돌려주고, 제품 경로에 호출부도 없다 —
   이 블록은 다음 라운드의 자리만 잡는다(현재 동작에 영향 없음). 규칙 이관은 다음 라운드에서 한다. */
const INFO_SPEC = {
  kind:'info',
  defaultStages:['gather'],
  ctx:(t)=>({sourceCharId:null, infoKind:null, cause:'',
             phase:(S.phase&&S.phase.kind)||null, alive:!!(t&&t.alive)}),
  probeCtx:()=>({sourceCharId:null, infoKind:null, cause:''}),
  result:()=>({truthful:true, alteredBy:null, reason:null, effect:null, pierced:false}),
  apply:(out,m,c,why)=>{
    out.alteredBy=m.id; out.effect=m.effect;
    /* 'false'(거짓 정보) · 'arbitrary'(사회자 재량) 모두 "사실대로가 아니다"로 접는다.
       세부 효과가 늘어나면 여기서 갈라라 — runModifiers 는 건드리지 않는다. */
    if(m.effect!=='pierce'){ out.truthful=false; out.reason=why; }
  }
};
const INFO_MODIFIERS = [];   // 다음 라운드에 채운다
INFO_MODIFIERS.spec = INFO_SPEC;
function runInfoModifiers(t, ctx, stages){ return runModifiers(INFO_MODIFIERS, t, ctx, stages); }

/* ── 투표 판정 표(골격) — 이번 라운드는 '빈 표'다 ────────────────────────────
   목적: 투표 가능 여부·표 무게를 바꾸는 사유(죽은 자의 유령표 1회 · 여행자 추방 · 버틀러의
   주인 제약 · 투표 가중 캐릭터 등)를 한 표로 모은다. 단계는 'cast'(표를 던질 수 있나) ·
   'tally'(집계할 때 몇 표인가)를 쓸 예정이다. 지금은 빈 표이고 호출부도 없다 — 자리만 잡는다. */
const VOTE_SPEC = {
  kind:'vote',
  defaultStages:['cast'],
  ctx:(t)=>({voteKind:'day', nominee:null, cause:'',
             phase:(S.phase&&S.phase.kind)||null, alive:!!(t&&t.alive)}),
  probeCtx:()=>({voteKind:'day', nominee:null, cause:''}),
  result:()=>({allowed:true, weight:1, changedBy:null, reason:null, effect:null, pierced:false}),
  apply:(out,m,c,why)=>{
    out.changedBy=m.id; out.effect=m.effect; out.reason=why;
    if(m.effect==='block') out.allowed=false;
    else if(m.effect==='weight' && typeof m.weight==='number') out.weight=m.weight;
  }
};
const VOTE_MODIFIERS = [];   // 다음 라운드에 채운다
VOTE_MODIFIERS.spec = VOTE_SPEC;
function runVoteModifiers(t, ctx, stages){ return runModifiers(VOTE_MODIFIERS, t, ctx, stages); }

/* 실제 판정 진입점 — 결과를 근거 사슬과 함께 남긴다. 남긴 것은 그대로 사회자 화면(renderDeathTraces)에 뜬다. */
function resolveDeath(t, ctx, stages){
  const r=runDeathModifiers(t, ctx, stages);
  recordDeathTrace(t, r, 'block');
  return r;
}
function recordDeathTrace(t, r, stage){
  if(!Array.isArray(S.deathTraces)) S.deathTraces=[];
  S.traceSeq=(S.traceSeq|0)+1;
  S.deathTraces.push({seq:S.traceSeq, at:phaseName(), stage,
    pid:t?t.id:null, name:t?t.name:'?', charId:t?t.charId:null,
    sourceType:r.ctx.sourceType, cause:String(r.ctx.cause||'').slice(0,80), bypass:!!r.ctx.bypass,
    died:r.died, blockedBy:r.blockedBy, effect:r.effect, reason:r.reason, trace:r.trace});
  while(S.deathTraces.length>20) S.deathTraces.shift();   // localStorage 보호 — 원장(SABER.MAX_EVENTS)과 같은 이유
}
/* "왜 안 죽었나"를 토스트 한 줄이 아니라 화면에서 되짚는다.
   <details> 라서 JS 핸들러가 하나도 없다 — el.onclick 조기 캡처 사고와 구조적으로 무관하다. */
function renderDeathTraces(limit){
  const rows=(S.deathTraces||[]).slice(-(limit||8)).reverse();
  if(!rows.length) return '';
  const head=r=>{
    const src = r.stage==='kill' ? '사망 확정 단계' : (DEATH_SRC_KO[r.sourceType]||r.sourceType||'');
    const verdict = r.effect==='substitute' ? '대체 사망(사회자 재량)'
                  : r.blockedBy ? (r.effect==='transform' ? '겉으로만 사망' : '사망 안 함')
                  : (r.died ? '사망 진행' : '사망 안 함');
    return `${esc(r.at)} · ${esc(r.name||'?')} · ${esc(src)}${r.bypass?' · 관통':''} → <b>${esc(verdict)}</b>${r.reason?` (${esc(r.reason)})`:''}`;
  };
  return `<details class="card" style="margin-top:10px"><summary>🧾 사망 판정 근거 사슬 — 최근 ${rows.length}건 (왜 죽었나 / 왜 안 죽었나)</summary>
  ${rows.map(r=>`<details style="margin:6px 0;padding:6px 8px;border:1px solid var(--line);border-radius:8px">
    <summary>${head(r)}</summary>
    <ol style="margin:6px 0 0 18px;font-size:12.5px;line-height:1.7">${(r.trace||[]).map(x=>
      `<li style="opacity:${x.applied?'1':'.55'}">${x.applied?'✔':'·'} <b>${esc(x.ko)}</b> <span class="hint">${esc(x.id)} · 우선순위 ${esc(x.precedence)}</span> — ${esc(x.why)}</li>`).join('')}</ol>
    ${r.cause?`<div class="hint" style="margin-top:6px">사인 문자열: ${esc(r.cause)}</div>`:''}
  </details>`).join('')}
  </details>`;
}
/* ── 전환 전 원본. 파이프라인의 무행동을 증명하는 기준선으로 남긴다 ──
   thyrsus_sim/pipeline_diff.js 가 이 함수와 새 deathBlockReason 의 반환값을 대량으로 비교한다.
   제품 실행 경로에서는 호출하지 않는다 — 지우면 무행동 증명이 이 파일에서 재현 불가능해진다. */
function deathBlockReasonLegacy(t, opts){
  opts=opts||{}; const src=opts.sourceType||'demon';   // 'demon' | 'night' | 'execution'
  if(opts.bypass) return null;                         // 암살자는 모든 보호를 관통
  // 찻집 여인: 살아있는 선한 이웃은 어떤 원인으로도 죽지 않는다(처형 포함)
  const tl=teaLadyBlock(t);
  if(tl) return `찻집 여인(${tl.name})의 살아있는 선한 이웃`;
  // 외부 보호는 '다른 플레이어의 능력'이므로 대상이 취하거나 중독돼도 정상 작동한다.
  // 수도사는 악마의 살해로부터만, 여관 주인 등은 모든 밤 사망으로부터 보호한다.
  const pr=(t.statuses||[]).find(s=>s.key==='protect');
  if(pr && src!=='execution' && (pr.source!=='수도사' || src==='demon'))
    return `보호 중(${pr.source||'보호 토큰'})`;
  // 악마의 변호사: '처형'에만 유효한 외부 보호 — 대상이 취하거나 중독돼도 정상 작동한다.
  if(src==='execution' && hasStatus(t,'execProtect'))
    return '악마의 변호사의 변호 — 처형돼도 죽지 않음';
  // 대상 '자신의' 능력에 의한 면역만 오작동의 영향을 받는다
  if(!isMalfunctioning(t)){
    if(t.charId==='soldier' && src==='demon') return '군인 — 악마에게 죽지 않음';
    if(t.charId==='sailor') return '선원 — 죽지 않음';
  }
  return null;
}
/* 기존 호출부와 SABER 원장 훅(preBlock)의 계약을 그대로 유지하는 얇은 어댑터.
   반환값은 '차단 사유 문자열' 또는 null — 파이프라인 도입 전과 동일하다. 기록은 남기지 않는다(훅이 예측 호출로 두 번 부른다). */
function deathBlockReason(t, opts){
  opts=opts||{};
  return runDeathModifiers(t, {sourceType:opts.sourceType||'demon', bypass:!!opts.bypass}, ['block']).reason;
}
/* 탕녀 계승을 '안내'가 아니라 '상태 전환'으로 처리한다.
   charId를 바꾸지 않으면 이후 demonAlive가 계속 false여서 악마 없는 게임이 진행된다. */
function promoteScarletWoman(dead, aliveBefore){
  if(charOf(dead.charId)?.type!=='demon') return false;
  // 다른 악마가 이미 살아있으면(팡 구 점프 등) 계승 대상이 아니다
  if(S.players.some(q=>q.alive && q!==dead && charOf(q.charId)?.type==='demon')) return false;
  const sw=S.players.find(q=>q.alive && q!==dead && q.charId==='scarletwoman');
  if(!sw) return false;
  /* 공식: 여행자는 탕녀의 5인 조건에 포함하지 않는다.
     호출부가 넘기는 aliveBefore 는 여행자 포함 수라 여기서 여행자 몫을 뺀다. */
  const aliveN=regularAliveFrom(aliveBefore);
  if(aliveN<5) return false;
  if(isMalfunctioning(sw)){
    toast('⚠ 탕녀가 중독/오작동 상태 — 계승 불발. 악마 사망이 그대로 성립합니다.','warn');
    log('탕녀 오작동 — 계승 불발');
    return false;
  }
  const demonId=dead.charId, ko=charOf(demonId)?.ko||'악마';
  sw.charId=demonId;
  log(`★ ${sw.name}(탕녀) → ${ko} 계승 (생존 ${aliveN}명)`);
  toast(`★ 탕녀 계승: ${sw.name}이(가) 이제 ${ko}입니다. 캐릭터가 전환되었습니다 — 다음 밤에 깨워 토큰을 보여주세요.`,'warn');
  return true;
}
/* ── 상태-출처 연동(최소침습): 지속효과 출처가 능력을 잃으면 효과도 끝난다 ──
   공식 근거(위키 Poisoner 예시): 독살범이 임프가 되자 시장의 중독이 풀린다 —
   "독살범이 인플레이에 없기 때문". 사망도 동일(죽은 자는 능력이 없다).
   대상: 독살범 독 · 수도사 보호 · 여관 주인 보호/취함 · 궁정대신 취함 · 마녀 저주 · 세레노버스 광기 · 푸카 독.
   유지: 주정뱅이(캐릭터 자체) · 사랑꾼(사망 '후' 발동하는 능력) · 뱀 조련사 스왑 독(영구) · 집사 주인. */
const EFFECT_SOURCE_KO = {poisoner:'독살범', monk:'수도사', innkeeper:'여관 주인', courtier:'궁정대신', witch:'마녀', cerenovus:'세레노버스', pukka:'푸카'};
/* 출처 문자열 대조 — 자동 부여는 '궁정대신'이지만 상태 대시보드의 수동 부여는
   만료 안내가 괄호로 붙은 '궁정대신(3밤+3낮)'으로 저장된다. 화면 표시 문자열을 건드리지
   않고 '이름(…)' 접미 형태까지 같은 출처로 본다 — 수동 부여분도 출처 사망·캐릭터 변경 때
   함께 해제된다. 접두 일치가 아니라 '이름(' 형태로 한정해 다른 출처와 섞이지 않게 한다. */
function statusFromSource(s, src){
  const v=String((s&&s.source)||'');
  return v===src || v.indexOf(src+'(')===0;
}
function clearEffectsFromChar(charId, why){
  const src=EFFECT_SOURCE_KO[charId]; if(!src) return;
  S.players.forEach(q=>{
    (q.statuses||[]).slice().forEach(s=>{
      if(statusFromSource(s,src)){
        q.statuses.splice(q.statuses.indexOf(s),1);
        log(`${q.name}: ${STATUS_DEFS[s.key].icon}${STATUS_DEFS[s.key].ko} 해제 — ${why}`);
      }
    });
  });
}
/* 죽은 플레이어가 지속효과 출처 캐릭터면 그 출처의 상태를 전원에게서 정리한다 */
function reconcileDeath(p){ clearEffectsFromChar(p.charId, `출처 사망(${charName(p)})`); }
function killPlayer(p, cause, opts){
  opts=opts||{};
  /* 사망 컨텍스트 — 표에 넘길 값을 여기 한 번만 만들어 kill 단계 전체가 같은 입력을 본다.
     호출부가 구조화된 값(opts.bypass·sourceType·sourceCharId)을 주면 그것이 우선이고,
     주지 않으면 종전처럼 사인 문자열에서 관통을 추론한다. 문자열 추론은 사회자가 사유에
     '암살자'라고 적으면 오작동하므로 opts 없는 옛 호출부용 fallback 으로만 남긴다.
     opts 3번째 인자를 넘기지 않던 호출부의 동작은 이 fallback 으로 그대로 보존된다. */
  const dctx={cause:cause||'', sourceType:opts.sourceType||null, sourceCharId:opts.sourceCharId||null,
              bypass:(opts.bypass===undefined? /암살자/.test(cause||'') : !!opts.bypass)};
  /* 사망 확정 단계의 근거 사슬 — 좀버얼 죽은 척·어릿광대 1회 생존이 여기서 갈린다.
     상태를 바꾸기 전에 기록해야 아래 두 분기와 같은 입력을 본다(게임 상태는 건드리지 않는다). */
  recordDeathTrace(p, runDeathModifiers(p, dctx, ['kill']), 'kill');
  const aliveBefore = alivePlayers().length;   // 죽는 본인 포함(탕녀 계승 판정 기준)
  // 좀버얼 첫 사망 = 죽은 척: 겉으로만 사망 처리, 실제로는 생존(밤에 계속 깨움)
  if(deathModApplies('zombuul-fakedead', p, dctx)){
    addStatus(p,'fakedead','좀버얼 첫 사망',null);
    p.alive=false;
    p.diedAt={kind:S.phase.kind, n:S.phase.n, cause:cause||''};
    log(`🪦 ${p.name}(좀버얼) 죽은 척 — ${cause} (실제로는 생존, 두 번째 사망이 진짜)`);
    toast(`🪦 좀버얼의 첫 사망 — 겉으로는 죽은 것으로 공표하되 실제로는 생존 중입니다. 계속 밤에 깨우세요. 두 번째 사망이 진짜입니다.`,'warn');
    if(!opts.skipEnd) checkEndConditions(cause, aliveBefore);
    return;
  }
  // 어릿광대 1회 생존: 첫 사망 시 정상 작동이면 재량 발동
  // 어릿광대의 1회 생존은 '강제' 능력이다 — 사회자 재량이 아니므로 확인창 없이 자동 발동.
  // 암살자와 오작동만 예외.
  if(deathModApplies('fool', p, dctx)){
    addStatus(p,'spent','어릿광대 1회 생존 발동',null);
    log(`🃏 ${p.name}(어릿광대) 첫 사망 무효 — ${cause} (능력 소진, 강제 발동)`);
    toast(`🃏 ${p.name} 생존 — 어릿광대의 1회 생존이 발동했습니다(강제). 사망하지 않습니다.`,'ok');
    return;
  }
  if(p.charId==='zombuul'){
    const zi=(p.statuses||[]).findIndex(s=>s.key==='fakedead');
    if(zi>=0){ p.statuses.splice(zi,1); log(`🪦 ${p.name}(좀버얼) 두 번째 사망 — 죽은 척 해제, 실제 사망`); }
  }
  p.alive=false; p.diedAt={kind:S.phase.kind, n:S.phase.n, cause:cause||''};
  log(`💀 ${p.name}(${charName(p)}) 사망 — ${cause}`);
  reconcileDeath(p);   // 출처 사망 → 그의 독·보호·저주·광기 등 지속효과 즉시 정리
  /* 달의 자손: 공개 지목은 '사망을 안 때'다 — 낮 사망이면 지금, 밤 사망이면 새벽(advancePhase)에 받는다.
     판정은 저장된 스냅샷으로 밤 단계에서만 한다(지목 시점과 판정 시점의 분리). */
  if(p.charId==='moonchild' && typeof onMoonchildDeath==='function') onMoonchildDeath(p);
  if(!opts.skipSuccession) promoteScarletWoman(p, aliveBefore);
  if(!opts.skipEnd) checkEndConditions(cause, aliveBefore);
}
function charName(p){ const c=charOf(p.charId); return c? c.ko : '?'; }

function checkEndConditions(cause, aliveBefore){
  const demonAlive = S.players.some(p=>(p.alive || (p.charId==='zombuul'&&hasStatus(p,'fakedead'))) && charOf(p.charId)?.type==='demon');
  if(demonAlive){
    /* M-7: 생존 2인 이하 + 악마 생존 = 악한 팀 승리.
       인원은 realAliveCount() — 죽은 척 중인 좀버얼이 있으면 겉보기 2명이어도 실제로는
       3명이다. 겉보기로 세면 여기서 '악한 팀 승리' 토스트가 뜨고, 그 문자열이 toast 래퍼의
       승리 게이트를 통과해 S.gameOver 도 세우지 않은 채 종료 화면을 띄운다. */
    if(realAliveCount()<=2){
      toast('🏴 생존자가 2명 이하이고 악마가 살아 있습니다 — 악한 팀 승리!','warn');
      log('악한 팀 승리(생존 2인 이하 + 악마 생존)');
    }
    return;
  }
  {
    const sw = S.players.find(p=>p.alive && p.charId==='scarletwoman');
    const aliveN = regularAliveFrom(aliveBefore!==undefined? aliveBefore : alivePlayers().length+1);
    if(sw && aliveN>=5 && !isMalfunctioning(sw)){
      toast(`⚠ 악마 사망 — 생존 ${aliveN}명(5+). 탕녀가 임프를 계승합니다. 게임은 계속! 다음 밤에 그녀를 깨워 임프 토큰을 보여주세요.`, 'warn');
      log('탕녀 계승 조건 충족 — 다음 밤 임프로 전환');
    } else if(sw && aliveN>=5 && isMalfunctioning(sw)){
      toast('⚠ 탕녀가 중독/오작동 상태 — 계승 불발. 악마 사망 = 선한 팀 승리!', 'warn');
    } else {
      toast('🏆 악마가 죽었습니다 — 선한 팀 승리! (탕녀 계승 조건 없음)', 'ok');
    }
  }
}

let toastTimer=null;
function toast(msg, kind){
  let el = $('#toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el);
    el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;max-width:560px;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--raised);color:var(--text)'; }
  el.style.borderColor = kind==='ok'?'var(--ok)': kind==='warn'?'var(--warn)':'var(--line)';
  el.textContent=msg; el.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;}, 7000);
}

function advancePhase(){
  const ph=S.phase;
  if(ph.kind==='setup'){
    if(S.players.length<5){ toast('플레이어가 5명 이상 필요합니다.','warn'); return; }
    const unassigned=S.players.filter(p=>!p.charId);
    if(unassigned.length){ toast(`캐릭터 미배정: ${unassigned.map(p=>p.name).join(', ')}`,'warn'); return; }
    const ft=S.players.find(p=>p.charId==='fortuneteller');
    if(ft && !S.redHerringId){ toast('점쟁이가 있습니다 — 붉은 청어를 먼저 지정하세요(설정 탭).','warn'); return; }
    const dr=S.players.find(p=>p.charId==='drunk');
    if(dr && !S.drunkMaskChar){ toast('주정뱅이가 있습니다 — 위장할 마을 주민을 먼저 지정하세요(설정 탭).','warn'); return; }
    /* 캐릭터 확인 릴레이 미완 경고 — 붉은 청어·주정뱅이 위장까지 정해진 뒤라야
       revealCharId() 가 최종 캐릭터를 가리킨다. 진행 자체는 사회자 재량으로 허용한다.
       (릴레이 블록은 이 함수보다 뒤 script 라 로드 실패 시 조용히 건너뛴다) */
    if(typeof revealPending==='function'){
      const _left=revealPending();
      if(_left.length && !confirm('아직 캐릭터를 확인하지 않은 좌석이 '+_left.length+'곳 있습니다:\n'
          +_left.map(p=>(S.players.indexOf(p)+1)+'번 '+p.name).join(', ')
          +'\n\n그래도 첫 번째 밤을 시작할까요?')) return;
    }
    S.phase={kind:'night', n:1};
    /* 다른 두 전환 분기(밤→낮·낮→밤)와 동일하게 여기서도 한 번 쓸어낸다. 이 분기만 빠져 있어
       {night,1} 만료를 가진 토큰은 만나야 할 페이즈를 영영 만나지 못하고 판이 끝날 때까지
       남았다 — 중독이 남으면 isMalfunctioning 이 계속 참이라 그 캐릭터가 내내 불발한다. */
    expireStatuses();
    /* 새 판이 시작되면 지난 판의 동료 평가는 끊는다. 전체 초기화 없이 이름만 바꿔
       다시 시작하면 좌석 pid 가 그대로라 지난 표가 이번 판 OP스코어의 PEER 항으로
       새어 들어간다(레코드는 이미 pgid 로 확정돼 있으므로 전적은 영향 없음). */
    S.postgame=blank().postgame;
    log('── 게임 시작: 첫날 밤 ──');
    switchTab('night');
  } else if(ph.kind==='night'){
    S.phase={kind:'day', n:ph.n};
    expireStatuses();
    log(`── 낮 ${ph.n} 시작 ──`);
    /* 새벽 = 밤 사망을 공표하는 시점 = 달의 자손이 자기 죽음을 '아는' 시점.
       공개 지목을 여기서 받아 그때의 대상 진영을 얼린다(판정은 다음 밤의 달의 자손 단계). */
    if(typeof sweepMoonchildChoice==='function') sweepMoonchildChoice();
    switchTab('day');
  } else {
    /* 시장 3인 승리 판정은 evalWinEvent('dayEnd') 한 곳에만 둔다.
       예전에는 여기에도 같은 조건의 confirm 이 있어서, 승리 다이얼로그에서 '계속 진행'을
       고른 사회자가 재개 직후(_dayEndResuming) 같은 질문을 한 번 더 받고 취소하면 낮에
       그대로 갇혔다. 조건이 두 벌이면 한쪽만 고칠 때(좀버얼 인원 보정 등) 서로 어긋난다. */
    if(sheetEd!==S.edition) sheetEd=S.edition;   // 시트가 다른 스크립트를 보고 있으면 되돌린다
    /* 열린 채로 낮이 끝난 지명을 여기서 정리한다 — 그대로 두면 다음 낮의 renderDay 가
       day 필터(n.day===S.phase.n)로 걸러 화면에서 사라지고, 사망 투표 토큰을 되돌리는
       유일한 경로(cancelNom)를 부를 UI 가 영영 없어진다(토큰 영구 소실).
       집계되지 않은 표는 토큰을 쓰지 않는다 — cancelNom 과 같은 규칙으로 복원한다.
       result 'abandoned' 는 SABER 집계(pass/yesFail 필터)에서 자동으로 빠진다. */
    S.noms.filter(n=>n.day===ph.n && !n.closed).forEach(n=>{
      const back=(n.deadVoters||[]).map(id=>{ const q=playerOf(id); if(q) q.deadVote=true; return q? q.name : id; });
      n.closed=true; n.result='abandoned'; n.deadVoters=[];
      log(`지명 미결 종료(낮 ${ph.n}) — 사망 투표 토큰 복원: ${back.join(', ')||'없음'}`);
    });
    S.executedPrevDay = S.executedDiedToday;  // 장의사는 '처형으로 실제 죽은' 캐릭터만 본다
    S.executedToday=null; S.executedTodayPid=null; S.executedDiedToday=null;
    S.phase={kind:'night', n:ph.n+1};
    expireStatuses();  // 독(어제 밤 부여) 해제 타이밍 = 다음 밤 시작
    S.nightDone[S.phase.n]={};
    log(`── 밤 ${S.phase.n} 시작 ──`);
    switchTab('night');
  }
  save(); renderAll();
}

function switchTab(t){
  /* 전환 연출용 클래스만 얹는다 — 상태·렌더 순서는 그대로다.
     ① 탭이 실제로 바뀔 때만, ② 다시 그려진 자식 노드에 애니메이션이 걸리도록

     ③ 520ms 뒤 떼어 이후의 일반 재렌더가 다시 페이드되지 않게 한다. */
  const _chg=(t!==activeTab);

  activeTab=t; renderAll();

      _p._thyFxT=setTimeout(function(){ try{ _p.classList.remove('thyfx-in'); }catch(e){} },520);
    }
  }
}

/* ══════════════════ 설정 탭 ══════════════════ */
function compFor(n, outsiderDelta){
  const c=COMP[Math.min(15,Math.max(5,n))].slice();
  const d=Math.max(outsiderDelta||0, -c[1]); // 외지인은 0 미만으로 내려가지 않는다
  c[0]-=d; c[1]+=d;
  return c;
}
/* 공식 셋업 보정: 남작 +2 / 팡 구 +1 / 비고르모르티스 −1 외지인, 대부는 ±1(양쪽 모두 허용) */
const SETUP_MOD_IDS=['baron','godfather','fanggu','vigormortis'];
function setupMods(ids){
  let delta=0, godfather=false;
  ids.forEach(id=>{ if(id==='baron') delta+=2; else if(id==='fanggu') delta+=1; else if(id==='vigormortis') delta-=1; else if(id==='godfather') godfather=true; });
  return {delta, godfather};
}
function compVariants(n, mods){
  const deltas=mods.godfather? [mods.delta+1, mods.delta-1] : [mods.delta];
  return deltas.map(d=>compFor(n,d));
}
function ensureSeats(target){
  target=Math.max(1,Math.min(15,target));
  while(S.players.length<target) S.players.push({id:uid(), rosterId:null, name:'', charId:'', alive:true, deadVote:true, statuses:[], notes:''});
  while(S.players.length>target) S.players.pop();
  save(); renderAll();
}
function renamePlayer(pid,v){
  const p=playerOf(pid); if(!p) return;
  p.name=v;
  /* 등록부에서 가져온 좌석의 이름을 직접 고쳤다면 그 자리에 앉은 사람이 바뀐 것이다.
     링크를 남겨두면 사람 단위 통계가 엉뚱한 등록부 항목에 쌓이므로 여기서 끊는다.
     (renderAll() 은 부르지 않는다 — 입력 중 포커스 유실 방지. 👤 배지는 다음 렌더에서 사라진다) */
  if(p.rosterId){ const r=rosterOf(p.rosterId); if(!r || r.name!==String(v).trim()) p.rosterId=null; }
  save();
}
/* ── 전체 초기화 ──
   게임 상태만 지우고 '한 판의 상태가 아닌' 사용자 자산은 남긴다.
     roster        참가자 명부(사람 단위 통계가 여기에 붙는다)
     history       판 전적 원장(초기화로 날리면 MMR 누적이 성립하지 않는다)
     customs       내가 만든 캐릭터
     theme         표시 설정
     recentScripts 최근 연 스크립트(홈 큐레이션 — 게임 상태와 무관)
     profiles      프로필 집계 캐시(전적의 파생물 — 원장을 남기면서 캐시만 버리면 첫 렌더가 통째로 다시 만든다)
   blank() 은 이들을 전부 비우므로 여기서 되돌려 넣는다. 보존 목록을 상수로 둬야
   새 필드가 생겼을 때 초기화 정책을 한 곳에서만 고칠 수 있다. */
const RESET_KEEP_KEYS=['roster','history','customs','theme','recentScripts','profiles'];
/* 초기화 엔진 — 이 앱의 '판을 지우는' 유일한 경로다(진실의 원천 하나).
   [소거] 보존 목록 밖의 전부. 판 단위 원장(S.events·S.deathTraces·S.log·evSeq·traceSeq)도
          blank() 이 비우므로 '이번 판 구간'을 따로 잘라낼 필요가 없다 — 새 판은 오직 이
          엔진을 거쳐야 시작되므로 원장에는 언제나 진행 중인 한 판만 들어 있다.
   [모드] 'keep' 전체 초기화(전적 보존) · 'void' 판 무효(이 판을 전적에서도 제거).
   두 버튼이 같은 코드를 쓴다 — 초기화 정책은 여기서만 고친다. */
function resetGameState(mode){
  const gid=S.gameId;
  const keep={};
  RESET_KEEP_KEYS.forEach(k=>{ if(S[k]!==undefined) keep[k]=S[k]; });
  /* 무효 처리: 이번 판이 이미 전적에 적립됐다면(confirmWin 경로) 그 레코드를 걷어낸다.
     gid 일치로만 지운다 — 시각·순서로 추정해 지우면 남의 판을 지운다.
     gid 없는 레코드는 이 필드가 생기기 전의 판이므로 정의상 이번 판이 아니다. */
  if(mode==='void' && Array.isArray(keep.history))
    keep.history=keep.history.filter(h=>!(h && h.gid && h.gid===gid));
  S=blank();
  RESET_KEEP_KEYS.forEach(k=>{ if(keep[k]!==undefined) S[k]=keep[k]; });
  /* 승리·종료 오버레이는 지운 판의 잔상이다 — 남겨두면 새 판 위에 겹쳐 뜬 채로 남는다 */
  try{ pendingWin=null; }catch(e){}
  ['gameover','winask'].forEach(id=>{ const o=document.getElementById(id); if(o) o.hidden=true; });
  save(); renderAll();
}
function resetAllKeepAssets(){
  if(!confirm('전체 게임 상태를 초기화할까요?\n(참가자 등록부 · 판 전적 · 내 캐릭터 · 테마는 유지됩니다)')) return;
  resetGameState('keep');
}
/* ── 판 무효 ──
   "이 판은 없던 일로 한다" — 중단·오심·연습판. 초기화가 하는 일 전부에 더해
   이미 적립된 이 판의 전적 레코드까지 걷어내, 전광판·판 기록·이번 판 분석 어디에도
   남지 않게 한다. 등록부·다른 판의 전적·커스텀·테마는 그대로다. */
function voidCurrentGame(){
  const banked=(Array.isArray(S.history)? S.history : []).some(h=>h && h.gid && h.gid===S.gameId);
  if(!confirm('이 판을 무효 처리할까요?\n\n· 진행 중인 판의 그리모어 · 게임 기록 · 원장이 모두 사라집니다'
    +(banked? '\n· 이미 적립된 이 판의 전적도 삭제됩니다 (전광판 · 판 기록에서 사라집니다)' : '')
    +'\n· 참가자 등록부 · 다른 판의 전적 · 내 캐릭터 · 테마는 유지됩니다'
    +'\n\n되돌릴 수 없습니다.')) return;
  try{ statsOpenHist.clear(); }catch(e){}   // 인덱스 기반 펼침 상태 — 레코드가 빠지면 어긋난다
  resetGameState('void');
  toast(banked? '판을 무효 처리했습니다 — 전적에서도 제거했습니다.' : '판을 무효 처리했습니다.','ok');
}
function setupIssues(){
  const n=S.players.length;
  const issues=[];
  if(n<5) issues.push('플레이어가 5명 이상 필요합니다.');
  const noname=S.players.filter(p=>!p.name.trim()).length;
  if(noname) issues.push(`이름이 비어 있는 좌석 ${noname}곳`);
  const un=S.players.filter(p=>!p.charId);
  if(un.length) issues.push('캐릭터 미배정: '+un.map(p=>p.name).join(', '));
  const mods=setupMods(S.players.map(p=>p.charId));
  /* COMP 인원표는 '여행자·전설을 뺀 정규 인원' 기준이다(공식: 여행자는 인원표 밖의 추가 인원).
     좌석 총수로 표를 찾으면 바로 아래 집계가 여행자·전설을 빼는 것과 어긋나, 그런 좌석이 하나만
     있어도 합이 영원히 맞지 않아 '구성 불일치'와 setupStepDone(2) 미완료가 고정된다.
     미배정 좌석(charOf 가 undefined)은 정규 인원으로 센다 — 배정 전에 표가 흔들리면 안 된다. */
  const nReg=S.players.filter(p=>{const c=charOf(p.charId); return !c || (c.type!=='traveler'&&c.type!=='fabled');}).length;
  const comps=nReg>=5?compVariants(nReg,mods):null;
  const counts={townsfolk:0,outsider:0,minion:0,demon:0};
  S.players.forEach(p=>{const c=charOf(p.charId); if(!c) return; if(c.type==='traveler'||c.type==='fabled') return; counts[c.type]++;});
  if(comps && !comps.some(comp=>counts.townsfolk===comp[0]&&counts.outsider===comp[1]&&counts.minion===comp[2]&&counts.demon===comp[3]))
    issues.push(`구성 불일치 — 권장 ${comps.map(c=>c.join('/')).join(' 또는 ')}, 현재 ${counts.townsfolk}/${counts.outsider}/${counts.minion}/${counts.demon}`);
  if(S.players.some(p=>p.charId==='fortuneteller') && !S.redHerringId) issues.push('점쟁이의 붉은 청어를 지정하세요.');
  if(S.players.some(p=>p.charId==='drunk') && !S.drunkMaskChar) issues.push('주정뱅이의 위장 캐릭터를 지정하세요.');
  return issues;
}
function setupStepDone(k){
  if(k===1) return S.players.length>=5 && S.players.every(p=>p.name.trim());
  if(k===2) return S.players.length>=5 && setupIssues().length===0;
  return false;
}
function gotoSetupStep(k){ S.setupStep=k; save(); renderAll(); }
function renderSetup(){
  const el=$('#pane-setup');
  const step=S.setupStep||1;
  const n=S.players.length;
  const mods=setupMods(S.players.map(p=>p.charId));
  /* setupIssues() 와 같은 기준이어야 한다 — 여기만 좌석 총수로 표를 찾으면 compOK 가 언제나 false 다 */
  const nReg=S.players.filter(p=>{const c=charOf(p.charId); return !c || (c.type!=='traveler'&&c.type!=='fabled');}).length;
  const comps=nReg>=5?compVariants(nReg,mods):null;
  /* charOf() 는 미지의 id 에 undefined 를 돌려준다 — 유령 charId 하나로 셋업 탭이 통째로 죽던 자리 */
  const modLabel=SETUP_MOD_IDS.filter(id=>S.players.some(p=>p.charId===id)).map(id=>charOf(id)?.ko||id).join('·');
  const counts={townsfolk:0,outsider:0,minion:0,demon:0};
  let travelerN=0;
  S.players.forEach(p=>{const c=charOf(p.charId); if(!c) return;
    if(c.type==='traveler'||c.type==='fabled') travelerN++; else counts[c.type]++;});
  const compOK = comps && comps.some(comp=>counts.townsfolk===comp[0]&&counts.outsider===comp[1]&&counts.minion===comp[2]&&counts.demon===comp[3]);
  const ft=S.players.find(p=>p.charId==='fortuneteller');
  const dr=S.players.find(p=>p.charId==='drunk');
  /* 커스텀 이름은 사용자 입력이다 — 이스케이프하지 않으면 옵션 라벨이 저장형 XSS 통로가 된다 */
  /* 전설은 좌석을 차지하지 않는다 — S.fabled 토글이 유일한 배치 창구다(blank() 주석 · isFabledActive).
     좌석에 넣으면 alivePlayers()·거수 과반·evalWinEvent 의 생존자 수에 그대로 섞여 악 승리가
     한 명분 늦어지고, setupIssues 는 전설을 counts 에서 빼므로 구성 검사만 따로 어긋난다.
     구버전 저장본이 이미 좌석에 쥐고 있는 값만 예외로 남긴다(선택이 조용히 사라지지 않게). */
  const opts=(sel)=>editionChars().filter(c=>c.type!=='fabled' || c.id===sel).map(c=>`<option value="${esc(c.id)}" ${sel===c.id?'selected':''}>${esc(c.ko)} (${TYPE_KO[c.type]||c.type})</option>`).join('');
  const stepper=`<div class="setsteps">${[[1,'참가자'],[2,'캐릭터 배정'],[3,'시작']].map(([k,ko],i)=>
    `${i?'<div class="setline"></div>':''}
     <div class="setstep ${setupStepDone(k)?'done':''} ${step===k?'cur':''}" onclick="gotoSetupStep(${k})">
       <div class="dot">${setupStepDone(k)&&step!==k?'✓':k}</div><div class="slab">${ko}</div></div>`).join('')}</div>`;
  let body='';
  if(step===1){
    if(!S.players.length) ensureSeats(7);
    body=`<p class="hint">위→아래 순서가 <b>시계 방향 좌석 순서</b>입니다. 요리사·초공감자 판정에 그대로 쓰이니 실제 착석 순서대로 입력하세요.</p>
    ${renderRosterPicker()}
    <div class="row" style="margin-bottom:12px">
      <span class="hint">인원</span>
      <button class="small" onclick="ensureSeats(${n-1})" ${n<=5?'disabled':''}>−</button>
      <b class="num" style="font-size:19px;min-width:28px;text-align:center">${n}</b>
      <button class="small" onclick="ensureSeats(${n+1})" ${n>=15?'disabled':''}>+</button>
      <button class="small" onclick="ensureSeats(${n+1})" ${n>=15?'disabled':''}>참가자 추가</button>
      <button class="small danger ghost" onclick="resetAllKeepAssets()">전체 초기화</button>
    </div>
    <div>${S.players.map((p,i)=>seatRowHTML(p,i)).join('')}</div>
    <div class="bigactions" style="margin-top:16px"><button class="gold" onclick="gotoSetupStep(2)" ${n<5?'disabled':''}>다음: 캐릭터 배정 ›</button></div>`;
  }
  else if(step===2){
    body=`
    <div class="row" style="margin-bottom:10px">
      <button class="primary" onclick="randomAssign()" ${n<5?'disabled':''}>🎲 무작위 배정</button>
      <button onclick="shuffleSeats()" ${n<2?'disabled':''}>🔀 자리 섞기</button>
      <button class="ghost" onclick="clearAssign()">배정 전체 비우기</button>
      <span class="hint">또는 아래에서 직접 선택</span>
    </div>
    ${comps?`<p class="hint">권장 구성 (${nReg}인${nReg!==n?` · 여행자·전설 ${n-nReg} 제외`:''}${modLabel?` · ${modLabel} 적용`:''}): ${comps.map(comp=>`<span class="pill townsfolk">주민 ${comp[0]}</span> <span class="pill outsider">외지인 ${comp[1]}</span> <span class="pill minion">하수인 ${comp[2]}</span> <span class="pill demon">악마 ${comp[3]}</span>`).join(' <span class="hint" style="display:inline">또는</span> ')}
      &nbsp;현재: ${counts.townsfolk}/${counts.outsider}/${counts.minion}/${counts.demon}
      ${compOK?'<span class="pill ok">구성 일치</span>':'<span class="pill warn">구성 불일치</span>'}
      ${travelerN?`<span class="pill neutral">+ 여행자 ${travelerN}</span> <span class="hint" style="display:inline">(여행자·전설은 구성 카운트에 미포함)</span>`:''}</p>`:''}
    <div>${S.players.map((p,i)=>`
      <div class="voterow">
        <span style="color:var(--muted);width:24px" class="num">${i+1}</span>
        <span class="vname">${esc(p.name)}</span>
        <select onchange="setChar('${p.id}',this.value)"><option value="">— 캐릭터 —</option>${opts(p.charId)}</select>
      </div>`).join('')}</div>
    ${(ft||dr)?`<hr class="divider"><h3>시작 전 사회자 결정</h3>
      ${ft?`<div class="fieldrow"><label>🎗 붉은 청어</label><div><select onchange="setHerring(this.value)"><option value="">— 선한 플레이어 선택 —</option>
        ${S.players.filter(p=>{const c=charOf(p.charId);return c&&(c.type==='townsfolk'||c.type==='outsider');}).map(p=>`<option value="${p.id}" ${S.redHerringId===p.id?'selected':''}>${esc(p.name)} (${esc(charName(p))})</option>`).join('')}
      </select> <span class="hint">점쟁이에게 악마처럼 감지될 선한 플레이어 1명 — 게임 내내 유지</span></div></div>`:''}
      ${dr?`<div class="fieldrow"><label>🎭 주정뱅이 위장</label><div><select onchange="setDrunkMask(this.value)"><option value="">— 위장할 마을 주민 —</option>
        ${CHARACTERS.filter(c=>c.type==='townsfolk' && (c.edition||'tb')===S.edition && !S.players.some(p=>p.charId===c.id)).map(c=>`<option value="${c.id}" ${S.drunkMaskChar===c.id?'selected':''}>${c.ko}</option>`).join('')}
      </select> <span class="hint">주정뱅이 본인이 믿게 될 주민 — 미사용 캐릭터에서 선택. 밤 순서에 자동 반영</span></div></div>`:''}`:''}
    <div class="bigactions" style="margin-top:16px"><button class="gold" onclick="gotoSetupStep(3)">다음: 시작 ›</button></div>
    <details class="morebox" style="margin-top:14px"><summary>캐릭터 일람 (${editionOf().ko}${S.customs.length?` + 커스텀 ${S.customs.length}종`:''})</summary><div class="inner">
    ${['townsfolk','outsider','minion','demon','traveler','fabled'].filter(t=>editionChars().some(c=>c.type===t)).map(t=>`
      <h3><span class="pill ${t}">${TYPE_KO[t]}</span></h3>
      <div class="chargrid">${editionChars().filter(c=>c.type===t).map(charCard).join('')}</div>`).join('')}</div></details>`;
  }
  else {
    const issues=setupIssues();
    body = issues.length? `
      <div class="alertbox">아직 준비가 끝나지 않았습니다:<ul class="guide">${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="bigactions"><button onclick="gotoSetupStep(${issues[0].includes('플레이어')?1:2})">‹ 돌아가서 마저 준비하기</button></div>`
    : `<div class="ready-hero">
        <div class="rh-icon">🏰</div>
        <h3>게임 준비 완료!</h3>
        <p>첫 번째 밤을 시작하세요</p>
      </div>
      <div class="bigactions">
        <button onclick="startRevealWiz()">👥 캐릭터 확인하기${typeof revealStats==='function'&&revealStats().total?` <span class="num">${revealStats().done}/${revealStats().total}</span>`:''}</button>
        <button class="gold" onclick="advancePhase()">첫 번째 밤 시작 ›</button>
      </div>
      <p class="hint" style="text-align:center;margin-top:14px">캐릭터 확인하기: 기기를 좌석 순서대로 돌리며 각자 자기 캐릭터를 비공개로 확인합니다.<br>주정뱅이에게는 위장 캐릭터가 표시됩니다.</p>`;
  }
  el.innerHTML=`<div class="card">
    <h2>게임 설정</h2><p class="hint" style="margin-top:-6px">${editionOf().ko}</p>
    ${stepper}${body}</div>`;
}
function startRevealWiz(){
  const scenes=[];
  S.players.forEach(p=>{
    let cid=p.charId;
    if(cid==='drunk' && S.drunkMaskChar) cid=S.drunkMaskChar;
    scenes.push({t:'note', text:`📱 기기를 ${p.name}에게 건네세요. 다른 사람이 화면을 보지 않게 주의!`});
    scenes.push({t:'show-token', char:cid, caption:`${p.name} — 당신의 캐릭터입니다. 확인했으면 탭하고 다음 사람에게 넘기세요.`});
  });
  scenes.push({t:'note', text:'전원 확인 완료. 기기를 사회자에게 돌려주세요.'});
  startCustomWiz('👥 캐릭터 확인', scenes);
}
function charCard(c){
  return `<div class="charcard"><span class="cname">${esc(c.ko)}</span><span class="cen">${esc(c.en||'')}</span>
  <div class="cab">${esc(c.ability)}</div>
  ${(c.warn&&c.warn.length)?`<details class="morebox"><summary>사회자 노트 ${c.warn.length}건</summary><div class="inner"><ul>${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></details>`:''}
  </div>`;
}
/* 이름으로 좌석을 만드는 경로. 요구 2("등록된 플레이어만 참여")에 맞춰 이름을 좌석에 그냥
   꽂지 않고 등록부에 먼저 올린 뒤 그 rosterId 로 앉힌다 — 좌석은 항상 사람에 묶인다(요구 4).
   인자 없이 부르면 #newpname 을 읽는다(구 폴백 입력 호환). */
function addPlayer(name){
  const el=$('#newpname');
  const v=String(name!=null? name : (el? el.value:'')).trim();
  if(!v) return;
  if(S.players.length>=15){toast('최대 15명','warn');return;}
  const ent=rosterEnsure(v);
  if(!ent) return;
  if(S.players.some(p=>p.rosterId===ent.id)){ toast(ent.name+'은(는) 이미 좌석에 있습니다.','warn'); return; }
  S.players.push({id:uid(), rosterId:ent.id, name:ent.name, charId:'', alive:true, deadVote:true, statuses:[], notes:'', alignment:null, diedAt:null});
  if(el) el.value='';
  save(); renderAll();
}

/* ══════════════════ 플레이어 등록부(로스터) ══════════════════
   게임마다 이름을 다시 타이핑하지 않도록 사람 단위 명부를 유지한다.
   게임 내 플레이어 객체에 rosterId 를 달아 통계가 사람 단위로 누적된다. */
function rosterList(){ if(!Array.isArray(S.roster)) S.roster=[]; return S.roster; }
function rosterOf(rid){ return rosterList().find(r=>r.id===rid); }
function rosterSeatOf(rid){ return S.players.find(p=>p.rosterId===rid); }
function rosterAdd(){
  const nameEl=$('#rosName'), afEl=$('#rosAffil'), ageEl=$('#rosAge'), mbEl=$('#rosMbti');
  const name=String(nameEl? nameEl.value:'').trim().slice(0,40);
  if(!name){ toast('이름은 필수입니다.','warn'); return null; }
  const affil=String(afEl? afEl.value:'').trim().slice(0,40);
  /* 같은 사람을 두 번 등록하면 rosterId 가 갈라져 사람 단위 통계가 두 갈래로 쪼개진다.
     이름+소속이 같으면 막고, 진짜 동명이인은 소속으로 구분하게 안내한다. */
  if(rosterList().some(r=>r.name===name && String(r.affil||'')===affil)){
    toast('이미 등록된 참가자입니다 — 동명이인이면 소속을 다르게 적어 구분하세요.','warn'); return null;
  }
  const a=parseInt(ageEl? ageEl.value:'',10);
  const ent=Object.assign(ROSTER_FIELDS(), {id:uid(), name:name, affil:affil,
    age:Number.isFinite(a)? a : null, mbti:normMbti(mbEl? mbEl.value:''), createdAt:Date.now()});
  rosterList().push(ent);
  if(nameEl) nameEl.value=''; if(afEl) afEl.value=''; if(ageEl) ageEl.value=''; if(mbEl) mbEl.value='';
  toast(name+' 등록 완료 — 설정 탭에서 좌석에 앉힐 수 있습니다.','ok');
  save(); renderAll();
  return ent.id;
}
/* 인라인 편집 — 렌더를 다시 돌리면 포커스가 날아가므로 save() 만 한다 */
function rosterEdit(rid, field, v){
  const r=rosterOf(rid); if(!r) return;
  if(field==='name'){
    const t=String(v).trim(); if(!t) return;          // 이름은 비울 수 없다
    r.name=t.slice(0,40);
    S.players.filter(p=>p.rosterId===rid).forEach(p=>p.name=r.name);
  }
  else if(field==='affil') r.affil=String(v).trim().slice(0,40);
  else if(field==='mbti') r.mbti=String(v).toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  else if(field==='age'){ const n=parseInt(v,10); r.age=Number.isFinite(n)? n : null; }
  else if(field==='mbti') r.mbti=normMbti(v);
  else return;
  save();
}
function rosterDel(rid){
  /* 등록부가 '참가 자격'의 단일 출처가 된 뒤로 착석 중인 사람을 지우면 그 좌석이
     미등록 상태로 남는다(게임은 계속 굴러가지만 전적이 사람에 안 붙는다) — 먼저 알린다. */
  const _r=rosterOf(rid);
  if(_r && rosterSeatOf(rid) && !confirm(_r.name+' 은(는) 지금 좌석에 앉아 있습니다.\n등록을 삭제하면 그 좌석은 미등록 상태가 되고 이후 전적이 사람 단위로 누적되지 않습니다.\n계속할까요?')) return;
  S.roster=rosterList().filter(r=>r.id!==rid);
  S.players.forEach(p=>{ if(p.rosterId===rid) p.rosterId=null; });   // 진행 중 게임은 유지, 연결만 끊는다
  save(); renderAll();
}
/* 등록부 칩 토글 — 참가자 목록에 넣거나 뺀다. 빈 좌석이 있으면 새로 밀지 않고 그 좌석을 채운다 */
function rosterToggle(rid){
  const r=rosterOf(rid); if(!r) return;
  const seat=rosterSeatOf(rid);
  if(seat){
    /* 진행 중 게임에서는 칩 오탭 한 번에 살아있는 좌석이 통째로 사라진다 — 캐릭터가 배정됐으면 확인받는다 */
    if(S.phase.kind!=='setup' && seat.charId &&
       !confirm(r.name+' 좌석을 게임에서 빼시겠습니까? 캐릭터·상태·기록이 함께 사라집니다.')) return;
    S.players=S.players.filter(p=>p.id!==seat.id); save(); renderAll(); return;
  }
  const empty=S.players.find(p=>!String(p.name||'').trim() && !p.charId && !p.rosterId);
  if(empty){ empty.name=r.name; empty.rosterId=rid; save(); renderAll(); return; }
  if(S.players.length>=15){ toast('최대 15명','warn'); return; }
  S.players.push({id:uid(), rosterId:rid, name:r.name, charId:'', alive:true, deadVote:true,
    statuses:[], notes:'', alignment:null, diedAt:null});
  save(); renderAll();
}
/* 이름으로 등록부 항목을 찾거나 없으면 만든다 — '좌석에 앉은 사람은 반드시 등록부에 있다'(요구 2)를
   유지하는 단일 출처. 직접 입력 경로(addPlayer)·구버전 좌석 승격(seatEnroll)이 함께 쓴다. */
function rosterEnsure(name, affil){
  const nm=String(name==null?'':name).trim().slice(0,40); if(!nm) return null;
  const af=String(affil==null?'':affil).trim().slice(0,40);
  /* 소속까지 같으면 그 사람, 소속을 안 준 경우엔 동명이 하나라도 있으면 그 사람으로 본다.
     (소속을 준 채로 다른 소속의 동명이인에 붙이면 통계가 남의 것에 쌓인다 — 그건 막는다) */
  const hit=rosterList().find(r=>r.name===nm && String(r.affil||'')===af)
         || (af? null : rosterList().find(r=>r.name===nm));
  if(hit) return hit;
  const ent=Object.assign(ROSTER_FIELDS(), {id:uid(), name:nm, affil:af, createdAt:Date.now()});
  rosterList().push(ent);
  return ent;
}
/* 미등록 좌석(구버전 저장본·진행 중이던 게임)을 등록부로 승격한다.
   이름·캐릭터·상태는 건드리지 않고 rosterId 링크만 붙인다 — 진행 중 게임이 깨지지 않는다. */
function seatEnroll(pid){
  const p=playerOf(pid); if(!p) return;
  if(p.rosterId){ toast('이미 등록부에 연결된 좌석입니다.','warn'); return; }
  const ent=rosterEnsure(p.name);
  if(!ent){ toast('좌석 이름이 비어 있어 등록할 수 없습니다.','warn'); return; }
  if(S.players.some(q=>q!==p && q.rosterId===ent.id)){
    toast(ent.name+'은(는) 이미 다른 좌석에 연결돼 있습니다 — 소속을 붙여 따로 등록하세요.','warn'); return;
  }
  p.rosterId=ent.id; p.name=ent.name;
  toast(ent.name+' 등록부에 추가하고 좌석에 연결했습니다.','ok');
  save(); renderAll();
}
/* 좌석 ← 등록부 배정. 이름 직접 입력을 대체하는 유일한 경로다(요구 2·4).
   빈 값이면 좌석을 비우고, 한 사람이 두 좌석에 앉는 것은 막는다(통계가 갈라진다). */
function seatAssign(pid, rid){
  const p=playerOf(pid); if(!p) return;
  if(!rid){
    if(S.phase.kind!=='setup' && p.charId &&
       !confirm(p.name+' 좌석의 참가자를 비우시겠습니까? 캐릭터는 남지만 이름·등록 연결이 사라집니다.')){ renderAll(); return; }
    p.rosterId=null; p.name=''; save(); renderAll(); return;
  }
  const r=rosterOf(rid);
  if(!r){ toast('등록부에서 사라진 참가자입니다.','warn'); renderAll(); return; }
  const taken=S.players.find(q=>q!==p && q.rosterId===rid);
  if(taken){ toast(r.name+'은(는) 이미 다른 좌석에 앉아 있습니다.','warn'); renderAll(); return; }
  p.rosterId=rid; p.name=r.name;
  save(); renderAll();
}
/* 좌석 셀렉트의 옵션. 이미 다른 좌석이 쓰는 사람은 disabled 로 남겨 '누가 어디 앉았는지'가 보이게 한다.
   미등록 좌석(rosterId 없음 + 이름 있음)은 __legacy 옵션으로 현재 이름을 그대로 지킨다 — 하위호환. */
function seatOptionsHTML(p){
  const used=new Set(S.players.filter(q=>q!==p && q.rosterId).map(q=>q.rosterId));
  const legacy = !p.rosterId && !!String(p.name||'').trim();
  const opts=[`<option value="" ${(p.rosterId||legacy)?'':'selected'}>— 참가자 —</option>`];
  if(legacy) opts.push(`<option value="__legacy" selected>${esc(p.name)} · 미등록</option>`);
  rosterList().forEach(r=>{
    const meta=[r.affil||'', r.mbti||''].filter(Boolean).join('/');
    opts.push(`<option value="${esc(r.id)}"${p.rosterId===r.id?' selected':''}${used.has(r.id)?' disabled':''}>`
      +`${esc(r.name)}${meta?' ('+esc(meta)+')':''}${used.has(r.id)?' — 착석 중':''}</option>`);
  });
  return opts.join('');
}
/* 좌석 한 줄. 이름은 더 이상 자유 입력이 아니다(요구 2) — 등록부에서 고른다.
   pid 는 uid() 산 값이라 인라인에 넣어도 되지만 사용자 문자열(이름)은 전부 data-* 로만 흐른다. */
function seatRowHTML(p,i){
  const legacy = !p.rosterId && !!String(p.name||'').trim();
  return `<div class="seatrow" draggable="true" data-pid="${esc(p.id)}"
       ondragstart="seatDragStart(event,'${p.id}')" ondragover="seatDragOver(event)"
       ondrop="seatDrop(event,'${p.id}')" ondragend="seatDragEnd(event)">
    <span class="draghandle" title="드래그로 좌석 이동">⠿</span>
    <span class="snum">${String(i+1).padStart(2,'0')}</span>
    <span class="rosbadge" title="${p.rosterId?'등록부에서 가져온 참가자':(legacy?'미등록 좌석 — 전적이 사람 단위로 쌓이지 않습니다':'빈 좌석')}">${p.rosterId?'👤':(legacy?'⚠':'·')}</span>
    <select class="seatsel" data-seatsel="${esc(p.id)}" aria-label="${i+1}번 좌석 참가자">${seatOptionsHTML(p)}</select>
    ${legacy?`<button class="small seatenroll" data-seatenroll="${esc(p.id)}" title="이 이름을 등록부에 올리고 좌석에 연결">＋ 등록부에 추가</button>`:''}
    <div class="seatctl">
      <button class="small ghost" onclick="movePlayer('${p.id}',-1)" title="위로">↑</button>
      <button class="small ghost" onclick="movePlayer('${p.id}',1)" title="아래로">↓</button>
      <button class="small danger ghost" onclick="removePlayer('${p.id}')" title="삭제">✕</button>
    </div>
  </div>`;
}
/* 이름·소속은 사용자 입력이므로 전부 esc(). 인라인 onclick 보간 금지 — data-* + 위임 리스너 */
function rosterMetaText(r){
  return [r.affil||'', (r.age!=null&&r.age!=='')? r.age+'세':'', r.mbti||''].filter(Boolean).join(' · ');
}
/* 설정 탭에는 '고르기'만 남긴다. 등록·편집 폼은 통계 탭 renderRosterAdmin() 한 곳뿐이다(요구 1) —
   같은 폼을 두 탭에 두면 #rosName·#rosMbti 가 중복돼 $() 가 어느 쪽을 집는지 알 수 없어진다. */
function renderRosterPicker(){
  const list=rosterList();
  const chips = list.length
    ? `<div class="roschips">${list.map(r=>{
        const meta=rosterMetaText(r);
        return `<button type="button" class="roschip ${rosterSeatOf(r.id)?'on':''}" data-roschip="${esc(r.id)}">
          <span class="rcname">${esc(r.name)}</span>
          <span class="rcmeta">${esc(meta||'—')}</span>
        </button>`;
      }).join('')}</div>`
    : `<div class="alertbox">등록된 플레이어가 없습니다 — <b>통계 탭 › 👤 플레이어 추가</b>에서 먼저 등록하세요.<br>좌석에는 등록된 참가자만 앉힐 수 있습니다.</div>`;
  return `<div class="rosbox">
    <div class="secthead"><span class="shicon">👤</span> 등록부에서 참가자 선택 <span class="hint" style="display:inline;font-weight:400">${list.length}명</span></div>
    ${chips}
    <div class="row" style="margin-top:8px">
      <button class="small ${list.length?'ghost':'primary'}" onclick="switchTab('stats')">👤 플레이어 추가·편집 (통계 탭)</button>
    </div>
  </div>`;
}
/* 통계 탭 '플레이어 추가' 구역 — 등록부의 유일한 편집 지점(요구 1).
   등록부가 사람 단위 통계의 뿌리라 집계 카드보다 위에 둔다. */
function rosterMbtiOptions(sel){
  return ['<option value="">— MBTI —</option>']
    .concat(MBTI_TYPES.map(m=>`<option value="${m}"${sel===m?' selected':''}>${m}</option>`)).join('');
}
function renderRosterAdmin(){
  const list=rosterList();
  return `<div class="card"><h2>👤 플레이어 추가</h2>
    <p class="hint" style="margin-top:-6px">여기 등록한 사람만 게임 좌석에 앉힐 수 있습니다. 평점·전적은 이름이 아니라 <b>등록 항목</b>에 누적됩니다 — 이름을 고쳐도 과거 판이 끊기지 않습니다.</p>
    <div class="rosform">
      <input id="rosName" class="rf-name" placeholder="이름 (필수)" maxlength="40" onkeydown="if(event.key==='Enter')rosterAdd()">
      <input id="rosAffil" class="rf-affil" placeholder="소속 (선택)" maxlength="40" onkeydown="if(event.key==='Enter')rosterAdd()">
      <input id="rosAge" class="rf-age" type="number" min="0" max="120" placeholder="나이" onkeydown="if(event.key==='Enter')rosterAdd()">
      <select id="rosMbti" class="rf-mbti" aria-label="MBTI (선택)">${rosterMbtiOptions('')}</select>
      <button class="small primary" data-rosadd="1">등록</button>
    </div>
    ${list.length? `<div class="rosadmin">${list.map(r=>`
      <div class="rosrow">
        <input class="rf-name" value="${esc(r.name)}" data-rosedit="${esc(r.id)}" data-rosfield="name" placeholder="이름" maxlength="40">
        <input class="rf-affil" value="${esc(r.affil||'')}" data-rosedit="${esc(r.id)}" data-rosfield="affil" placeholder="소속" maxlength="40">
        <input class="rf-age" value="${r.age==null?'':esc(r.age)}" data-rosedit="${esc(r.id)}" data-rosfield="age" type="number" min="0" max="120" placeholder="나이">
        <select class="rf-mbti" data-rosedit="${esc(r.id)}" data-rosfield="mbti" aria-label="MBTI">${rosterMbtiOptions(r.mbti||'')}</select>
        <span class="rosseat hint">${rosterSeatOf(r.id)? '🪑 착석 중':''}</span>
        <button class="small danger ghost" data-rosdel="${esc(r.id)}" title="등록 삭제">✕</button>
      </div>`).join('')}</div>`
      : `<p class="hint">아직 등록된 플레이어가 없습니다. 이름만 넣어도 됩니다 — 소속·나이·MBTI 는 나중에 채울 수 있습니다.</p>`}
    <p class="hint" style="margin-top:10px">좌석 배정은 <b>설정 › 참가자</b>에서 합니다. <button class="small ghost" onclick="switchTab('setup')">설정 탭으로</button></p>
  </div>`;
}
document.addEventListener('click', e=>{
  const t=e.target.closest && e.target.closest('[data-roschip],[data-rosdel],[data-rosadd]');
  if(!t) return;
  if(t.hasAttribute('data-rosadd')) rosterAdd();
  else if(t.hasAttribute('data-rosdel')) rosterDel(t.getAttribute('data-rosdel'));
  else rosterToggle(t.getAttribute('data-roschip'));
});
document.addEventListener('input', e=>{
  const t=e.target.closest && e.target.closest('[data-rosedit]');
  if(!t) return;
  rosterEdit(t.getAttribute('data-rosedit'), t.getAttribute('data-rosfield'), t.value);
});
/* 좌석 배정 — 이름(사용자 문자열)을 인라인 핸들러에 보간하지 않기 위해 data-* + 위임.
   select 는 input·change 를 둘 다 발화하므로 change 한쪽에서만 처리한다(이중 실행 방지). */
document.addEventListener('change', e=>{
  const t=e.target && e.target.closest && e.target.closest('[data-seatsel]');
  if(!t) return;
  const v=t.value;
  if(v==='__legacy') return;              // 미등록 좌석의 현재 이름 — 아무것도 바꾸지 않는다
  seatAssign(t.getAttribute('data-seatsel'), v);
});
document.addEventListener('click', e=>{
  const t=e.target && e.target.closest && e.target.closest('[data-seatenroll]');
  if(!t) return;
  seatEnroll(t.getAttribute('data-seatenroll'));
});
function removePlayer(pid){ S.players=S.players.filter(p=>p.id!==pid); save(); renderAll(); }
function movePlayer(pid,d){ const i=S.players.findIndex(p=>p.id===pid); const j=i+d; if(j<0||j>=S.players.length)return;
  [S.players[i],S.players[j]]=[S.players[j],S.players[i]]; save(); renderAll(); }
function setChar(pid,cid){ const p=playerOf(pid); p.charId=cid;
  // 주정뱅이 캐릭터 자체가 준 취함만 제거한다 — 사랑꾼·여관 주인·건달·궁정대신이 준 취함은 보존
  p.statuses=(p.statuses||[]).filter(s=>!(s.key==='drunkS' && s.source==='주정뱅이'));
  if(cid==='drunk' && !hasStatus(p,'drunkS')) addStatus(p,'drunkS','주정뱅이',null);
  save(); renderAll(); }
/* 좌석 순서를 무작위로 섞는다 — 캐릭터 배정은 그대로 두고 앉은 자리만 바꾼다.
   이웃 판정(요리사·초공감자·찻집 여인 등)이 좌석 순서에 의존하므로 배정 전에 쓰는 게 안전하다. */
function shuffleSeats(){
  if(S.players.length<2) return;
  if(S.phase.kind!=='setup' && !confirm('게임이 이미 진행 중입니다. 좌석을 섞으면 이웃 기반 판정(요리사·초공감자·찻집 여인 등)이 모두 바뀝니다. 계속할까요?')) return;
  for(let i=S.players.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [S.players[i],S.players[j]]=[S.players[j],S.players[i]];
  }
  log('🔀 자리 섞기 — 좌석 순서 무작위 재배치');
  toast('좌석을 섞었습니다. 이웃 기반 판정이 바뀌었으니 그리모어를 확인하세요.','ok');
  save(); renderAll();
}
/* 캐릭터 배정만 전부 지운다 — 플레이어·좌석은 유지 */
function clearAssign(){
  if(!S.players.some(p=>p.charId)){ toast('배정된 캐릭터가 없습니다.','warn'); return; }
  if(!confirm('모든 플레이어의 캐릭터 배정을 지웁니다. 플레이어와 좌석은 유지됩니다. 계속할까요?')) return;
  S.players.forEach(p=>{ p.charId=''; p.alignment=null;
    p.statuses=(p.statuses||[]).filter(x=>x.key!=='drunkS'&&x.key!=='herring'); });
  S.drunkMaskChar=null; S.redHerringId=null;
  log('배정 전체 비우기');
  save(); renderAll();
}
function setHerring(pid){ S.redHerringId=pid;
  S.players.forEach(p=>p.statuses=(p.statuses||[]).filter(s=>s.key!=='herring'));
  const p=playerOf(pid); if(p) addStatus(p,'herring','점쟁이 셋업',null);
  save(); renderAll(); }
function setDrunkMask(cid){ S.drunkMaskChar=cid; save(); renderAll(); log(`주정뱅이 위장 캐릭터: ${charOf(cid)?.ko||'-'}`); }
function randomAssign(){
  const n=S.players.length; if(n<5) return;
  /* 후보 풀 = 이 판이 쓰는 캐릭터 전부(빌더로 연결한 내 스크립트가 있으면 그 목록).
     커스텀을 빼면 커스텀·실험만으로 짠 시트에서는 배정할 것이 아무것도 없다.
     여행자·전설만 제외한다 — 둘 다 COMP 인원표 밖이고, 전설은 좌석 자체를 쓰지 않는다. */
  const pool=editionChars().filter(c=>c.type!=='traveler' && c.type!=='fabled');
  /* 남작은 시트에 실제로 있을 때만 굴린다 — 없는데 뽑으면 그 좌석이 유령 charId 가 된다 */
  let baron = pool.some(c=>c.id==='baron') && Math.random() < 0.35; // 남작 포함 여부를 먼저 굴린다
  const comp=compFor(n, baron?2:0);
  const pick=(arr,k,exclude)=>{ const pool=arr.filter(c=>!exclude.includes(c.id)); const out=[];
    while(out.length<k && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id); } return out; };
  const tf=pool.filter(c=>c.type==='townsfolk'), os=pool.filter(c=>c.type==='outsider'),
        mi=pool.filter(c=>c.type==='minion'), de=pool.filter(c=>c.type==='demon');
  const minions = baron? ['baron'].concat(pick(mi,comp[2]-1,['baron'])) : pick(mi,comp[2],[]);
  if(!baron && minions.includes('baron')){ baron=true; }
  let roles=[].concat(pick(tf,comp[0],[]), pick(os,comp[1],[]), minions, pick(de,comp[3],[]));
  // 셋업 보정 캐릭터(남작·대부·팡 구·비고르모르티스)가 뽑힌 경우 구성 재조정
  const mods=setupMods(roles);
  const delta=mods.delta + (mods.godfather? (Math.random()<0.5?1:-1) : 0); // 대부는 ±1 중 무작위 선택
  let usedComp=comp;
  if(delta!==0 || mods.godfather){ const c2=compFor(n,delta); usedComp=c2;
    roles=[].concat(pick(tf,c2[0],[]), pick(os,c2[1],[]), roles.filter(id=>charOf(id)?.type==='minion'), roles.filter(id=>charOf(id)?.type==='demon'));
  }
  /* pick() 은 풀이 모자라면 조용히 적게 돌려주고 남는 좌석은 빈 문자열로 남는다. 악마를 한 명도
     못 채운 채 진행하면 evalWinEvent('death') 의 demonAlive 가 false 라 첫 사망에서 '마지막
     악마가 죽었습니다'가 잘못 선언된다 — 어느 유형이 몇 명 모자랐는지 반드시 알린다. */
  const short=[];
  [['townsfolk',0],['outsider',1],['minion',2],['demon',3]].forEach(row=>{
    const got=roles.filter(id=>charOf(id)?.type===row[0]).length;
    if(got<usedComp[row[1]]) short.push(`${TYPE_KO[row[0]]||row[0]} ${usedComp[row[1]]-got}명`);
  });
  roles.sort(()=>Math.random()-.5);
  S.players.forEach((p,i)=>{ p.charId=roles[i]||''; p.statuses=[]; if(p.charId==='drunk') addStatus(p,'drunkS','주정뱅이',null); });
  S.redHerringId=null; S.drunkMaskChar=null;
  if(short.length){
    log(`무작위 배정 — 시트에 캐릭터가 모자라 ${short.join(' · ')} 미배정`);
    toast(`시트 캐릭터 부족 — ${short.join(' · ')}을 채우지 못했습니다. 남은 좌석을 직접 배정하세요.`,'warn');
  } else log('무작위 배정 완료');
  save(); renderAll();
}

function nightRow(edMeta,id,i,isFirstNight=true){

  if(id==='dawn') return `<div class="sheetrow"><div class="ctoken">🌅</div><div><span class="sname">새벽</span><div class="sab hint">모두 깨우고 밤 사망자를 공표한다(사인은 비공개).</div></div></div>`;
  if(INFO_STEPS[id]) return `<div class="sheetrow"><div class="ctoken">👥</div><div><span class="sname">${INFO_STEPS[id].ko}</span><span class="sen">7인 이상</span><div class="sab hint">${esc(INFO_STEPS[id].guide[0]||'')}</div></div></div>`;
  const c=charOf(id); if(!c) return '';

  const g = !isFirstNight ? (c.guideOther||c.guideFirst||[])
    : ((edMeta && c.guideOther && !c.first)? c.guideOther : (c.guideFirst||c.guideOther||[]));
  /* data-cid = 이 행의 캐릭터 고유 키. (i) 버튼 주입기가 이름 역조회 대신 이걸 읽는다 */

    <div class="sab hint">${esc((g[0]||'').replace(/\.$/,''))}</div></div></div>`;

function confirmKill(pid){ const p=playerOf(pid); if(!p) return;

   사망에 딸려 소비된 상태(사망 투표 토큰·사망 시각)를 함께 되돌리지 않으면, 다시 죽었을 때
   handEligible 이 p.deadVote===false 로 걸러 정당한 1회 사망 투표를 잃고, 남아 있는 diedAt 이
   살아 있는 좌석에 사망 시각을 붙여 통계·리플레이(SURV·장의사 판정)를 오염시킨다. */

  p.alive=true; p.deadVote=true; p.diedAt=null;
  log(`${p.name} 소생(수동) — 사망 투표 토큰·사망 기록 복원`); save(); renderAll(); }
function setDeadVote(pid,v){ const p=playerOf(pid); if(!p) return; p.deadVote=v; log(`${p.name} 투표 토큰 ${v?'복원':'수동 소진'}`); save(); renderAll(); }
function addStatusUI(pid,key){
  const p=playerOf(pid); const ph=S.phase;
  let exp=null, src='사회자 수동';
  /* 준비(setup)는 ph.n===0 이라 밤 만료를 ph.n+1 로 잡으면 {night,1} — 밤 1이 시작하는 바로
     그 순간 풀려 정작 첫 밤에는 효력이 없다. 준비에 놓은 토큰은 '밤 1에 부여한 것'과 같은
     범위(밤 1 + 낮 1)를 살아야 하므로 만료를 밤 2로 민다.
     낮 만료(protect)는 setup 에서도 {day,1} 이라 이미 밤 1을 덮으므로 그대로 둔다. */
  const nightExp = (ph.kind==='setup')? 2 : ph.n+1;
  if(key==='poison'){ exp={kind:'night', n:nightExp}; }
  if(key==='protect'){ exp = ph.kind==='night'? {kind:'day', n:ph.n} : {kind:'day', n:ph.n+1}; }  // 낮 부여분은 다음 낮 시작에 해제(그 사이 밤 동안 유효)
  if(key==='master'){ S.players.forEach(q=>q.statuses=(q.statuses||[]).filter(s=>s.key!=='master')); exp={kind:'night', n:nightExp}; }
  if(key==='drunkS'){                                   // 취함은 출처별 만료가 다르다 — 정책 선택
    const c=prompt('취함 출처 선택 — 1: 선원/여관 주인/건달/음유시인(다음 황혼까지) · 2: 궁정대신(3밤+3낮) · 3: 영구(주정뱅이·사랑꾼·뱀 조련사)','1');
    if(c===null) return;
    if(c.trim()==='2'){ exp=drunkExpiry('court'); src='궁정대신(3밤+3낮)'; }
    else if(c.trim()==='3'){ exp=null; src='영구'; }
    else { exp=drunkExpiry('dusk'); src='다음 황혼까지'; }
  }
  addStatus(p,key,src,exp); save(); renderAll();
}
function exportGame(){
  const blob=JSON.stringify(S,null,1);
  navigator.clipboard?.writeText(blob).then(()=>toast('게임 상태 JSON을 클립보드에 복사했습니다.','ok'),()=>prompt('복사하세요:',blob));
}

<script>
/* ══════════════════ 밤 진행 탭 ══════════════════ */
function nightSteps(){
  const first = S.phase.n===1;
  /* S.edition 이 EDITIONS 에 없는 값이면(구버전·손상 저장본·가져온 게임 JSON) ed.first 에서
     TypeError 가 나 밤 탭 전체가 죽는다 — 순서표를 못 찾는 것은 폴백으로 넘길 일이지
     앱이 멈출 일이 아니다. */
  const ed = editionOf() || EDITIONS.tb;
  const baseOrder = (first? ed.first : ed.other) || [];
  let order = baseOrder.slice();
  /* 전설(Fabled) 밤 삽입 — 전설은 스크립트 소속이 아니라 사회자가 균형용으로 얹는다.
     그래서 EDITIONS 배열에 넣으면 모든 시트의 참조 밤 순서에 상시 노출돼 잡음이 된다.
     대신 '실제로 판에 들어온 전설'만 공식 위치에 끼워 넣는다. 활성 판정은 S.fabled 가 출처이고
     (isFabledActive), 좌석에 배정된 전설도 구버전 저장본 하위호환으로 함께 인정한다.

     공식 nightsheet 상대 위치(근거: official/nightsheet.json):
       첫밤   dusk → angel → buddhist → toymaker → stormcatcher → … → magician → tor → minioninfo → …
       이후밤 dusk → duchess → toymaker → … → grandmother → tor → ravenkeeper → …
     즉 첫밤의 네 전설은 순서표 선두(EDITIONS 첫 항목보다 앞)이고, 토르만 하수인 정보 앞이다.
     예전에는 angel·buddhist·toymaker 를 전부 minioninfo 앞에 넣어 위치도 상대 순서도 어긋났다.
     ★ 아래 객체의 키 순서 = 공식 상대 순서다. 키를 재배열하면 밤 순서가 그대로 어긋난다.
     에디션마다 기준점이 없을 수 있어 before 에 배열을 허용한다 — '순서표에 실제로 있는 첫
     기준점' 앞에 넣고, 하나도 없으면 tail:true 는 맨 뒤, 아니면 맨 앞이다. */
  const FABLED_SLOT = first
    ? {angel:{head:true}, buddhist:{head:true}, toymaker:{head:true}, stormcatcher:{head:true},
       tor:{before:'minioninfo'}}
    : {duchess:{head:true}, toymaker:{head:true},
       tor:{before:['ravenkeeper','chambermaid','dreamer'], tail:true}};
  /* 하나씩 unshift/splice 하면 나중에 넣은 전설이 먼저 넣은 것보다 앞으로 밀려 공식 상대
     순서가 뒤집힌다(angel→buddhist→toymaker 가 toymaker→angel→buddhist 로 나오던 자리다).
     그래서 넣을 것을 공식 순서대로 모은 뒤 ① 선두 그룹은 한 번에 splice 하고
     ② 앵커 삽입은 역순으로 돌린다 — 같은 앵커를 공유해도 상대 순서가 보존된다. */
  const fabIns=[];
  Object.keys(FABLED_SLOT).forEach(fid=>{
    if(order.includes(fid)) return;
    if(!isFabledActive(fid)) return;                    // S.fabled 활성 ∪ 좌석 배정(하위호환)
    const c=charOf(fid); if(!c) return;
    if(!(first? c.first : c.other)) return;
    fabIns.push({fid:fid, slot:FABLED_SLOT[fid]});
  });
  const fabHead=fabIns.filter(x=>x.slot.head).map(x=>x.fid);
  if(fabHead.length) order.splice(0, 0, ...fabHead);
  fabIns.filter(x=>!x.slot.head).reverse().forEach(x=>{
    const anchors = Array.isArray(x.slot.before)? x.slot.before : [x.slot.before];
    let idx=-1;
    for(const a of anchors){ const i=order.indexOf(a); if(i>=0){ idx=i; break; } }
    if(idx>=0) order.splice(idx,0,x.fid); else if(x.slot.tail) order.push(x.fid); else order.unshift(x.fid);
  });
  // 커스텀 캐릭터 삽입
  (S.customs||[]).forEach(c=>{
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const after = first? c.firstAfter : c.otherAfter;
    if(!after){ order.unshift(c.id); return; }
    const idx = order.indexOf(after);
    if(idx>=0) order.splice(idx+1,0,c.id); else order.push(c.id);
  });
  /* 순서표 밖의 인플레이 캐릭터 편입 — EDITIONS 3종 순서표만 원천으로 삼으면, 좌석에 앉아 있어도
     순서표에 없는 id 는 밤 화면에 행조차 생기지 않는다. stepSkipReason 의 '깨우지 않음' 회색
     처리조차 타지 않으므로 사회자는 그 캐릭터가 빠진 사실 자체를 알 수 없다.
     그래서 공식 밤 순서(SG_NF/SG_NO — window.thyScriptGraph.tables 로 이미 노출돼 있다)의
     상대 위치로 끼워 넣는다. 그 표에도 없으면 자리를 지어내지 않고 맨 뒤에 두되
     '순서 미정'으로 표시한다(renderStep).
     ※ 전설은 위 FABLED_SLOT 이 공식 위치로 이미 다루므로 여기서는 제외한다. */
  const sgT=(typeof window!=='undefined' && window.thyScriptGraph && window.thyScriptGraph.tables) || null;
  const sgOrder=sgT? (first? sgT.firstNight : sgT.otherNight) : null;
  const noOrder=Object.create(null);
  [...new Set(S.players.map(p=>p&&p.charId).filter(Boolean))].forEach(id=>{
    if(order.indexOf(id)>=0 || INFO_STEPS[id]) return;
    const c=charOf(id); if(!c || c.type==='fabled') return;
    if(!(first? c.first : c.other)) return;
    const pos=sgOrder? sgOrder.indexOf(id) : -1;
    if(pos<0){ noOrder[id]=1; order.push(id); return; }
    /* 공식 순서상 이 캐릭터보다 뒤인 첫 항목 앞에 넣는다 — 순서표에 없는 항목(-1)은 기준이 못 된다 */
    let at=order.length;
    for(let i=0;i<order.length;i++){
      const q=sgOrder.indexOf(order[i]);
      if(q>=0 && q>pos){ at=i; break; }
    }
    order.splice(at,0,id);
  });
  // 주정뱅이 위장: 위장 캐릭터가 시트에 없으므로, 그 캐릭터의 원래 순서 위치에 삽입
  const drunkP = S.edition==='tb'? S.players.find(p=>p.charId==='drunk') : null;
  const maskC = S.drunkMaskChar? charOf(S.drunkMaskChar): null;
  const steps=[];
  order.forEach(id=>{
    if(INFO_STEPS[id]){
      if(S.players.length>=INFO_STEPS[id].minPlayers) steps.push({id, info:true});
      return;
    }
    const c=charOf(id); if(!c) return;
    const wakes = first? c.first : c.other;
    if(!wakes) return;
    const holders = playersByChar(id);
    const maskHere = drunkP && maskC && maskC.id===id; // 위장 캐릭터가 실제로도 플레이 중일 수 있음
    /* 전설은 좌석을 차지하지 않으므로 holders 가 비어 있는 게 정상이다 — '보유자 없음'으로
       걸러내면 S.fabled 로 켠 전설이 밤 순서에서 통째로 사라진다.
       (좌석에 배정한 구버전 저장본은 holders 가 채워진 채로 같은 단계에 들어온다.) */
    const fabHere = c.type==='fabled' && isFabledActive(id);
    if(!holders.length && !maskHere && !fabHere) return;
    steps.push({id, holders, mask: maskHere? drunkP : null, noOrder: !!noOrder[id]});
  });
  // 위장 캐릭터가 인플레이가 아닌 경우: 순서표에 없으므로 원 위치에 직접 삽입
  if(drunkP && maskC && !steps.some(s=>s.id===maskC.id)){
    const wakes = first? maskC.first : maskC.other;
    if(wakes){
      const baseIdx = (first?ed.first:ed.other).indexOf(maskC.id);
      let insertAt = steps.length;
      if(baseIdx>=0){
        for(let i=0;i<steps.length;i++){
          const bi=(first?ed.first:ed.other).indexOf(steps[i].id);
          if(bi>baseIdx){ insertAt=i; break; }
        }
      }
      steps.splice(insertAt,0,{id:maskC.id, holders:[], mask:drunkP, maskOnly:true});
    }
  }
  /* 같은 id 가 두 번 들어오면(가져온 시트가 기본 캐릭터 id 를 재사용) nightDone 체크와
     DOM id(step-<id>)가 충돌해 두 단계가 한 몸으로 움직인다 — 첫 항목만 남긴다 */
  const seenStep=new Set();
  return steps.filter(st=>{ if(seenStep.has(st.id)) return false; seenStep.add(st.id); return true; });
}
/* 사망을 계기로 발동하는 역할들.
   'night'    = 그 밤에 죽어야 발동(까마귀지기·현자)
   'today'    = 오늘(직전 낮 또는 이 밤) 죽어야 발동(이발사·사랑꾼)
   'nextnight'= 죽음을 안 낮에 공개 지목하고 그 '다음' 밤에 판정(문차일드) */
const DEATH_TRIGGER_STEPS={ravenkeeper:'night', sage:'night', barber:'today', sweetheart:'today', moonchild:'nextnight'};
function stepSkipReason(st){
  const first=S.phase.n===1;
  if(st.info) return null;
  const c=charOf(st.id);
  const holders=(st.holders||[]).concat(st.mask?[st.mask]:[]);
  const anyAlive = holders.some(p=>p.alive);
  /* 전설(Fabled)은 좌석·생사가 없다 — holders 가 비어 있는 게 정상이므로 아래 '사망 —
     깨우지 않음' 게이트에 걸리면 안 된다. 활성 전설의 단계는 언제나 진행한다. */
  if(c && c.type==='fabled') return null;
  // 구마사제가 이번 밤 봉인한 악마는 단계 자체를 건너뛴다
  if(S.demonBlockedNight===S.phase.n && c?.type==='demon'
     && holders.some(p=>p.id===S.demonBlockedPid)) return '📿 구마사제가 봉인 — 이번 밤 능력 사용 없음';
  const trig=DEATH_TRIGGER_STEPS[st.id];
  if(trig){
    const h=holders[0];
    if(!h) return '해당 캐릭터 없음';
    if(h.alive) return '아직 생존 — 죽는 경우에만 이 시점에 깨움';
    const d=h.diedAt;
    const thisNight = d && d.kind==='night' && d.n===S.phase.n;
    const prevDay    = d && d.kind==='day'   && d.n===S.phase.n-1;
    if(trig==='night' && !thisNight) return '오늘 밤 사망이 아님 — 깨우지 않음';
    if(trig==='today' && !(thisNight||prevDay)) return '오늘 죽지 않음 — 깨우지 않음';
    /* 밤 n 사망이든 낮 n 사망이든 공개 지목은 낮 n, 판정은 밤 n+1 → d.n === S.phase.n-1 */
    if(trig==='nextnight' && !(d && d.n===S.phase.n-1)) return '지목한 낮의 다음 밤이 아님 — 깨우지 않음';
    return null;
  }
  if(!anyAlive){
    if(st.id==='zombuul' && holders.some(p=>hasStatus(p,'fakedead'))) return null; // 죽은 척 — 계속 깨움
    // 비고르모르티스가 죽인 하수인은 죽어도 능력 유지 — 비고르모르티스가 살아있고 정상인 동안 계속 깨움
    if(c?.type==='minion' && holders.some(p=>hasStatus(p,'vigorAbility'))){
      const vg=S.players.find(q=>q.alive && q.charId==='vigormortis');
      if(vg && !isMalfunctioning(vg)) return null;
      return '사망 — 비고르모르티스 부재/오작동으로 능력 유지 정지';
    }
    return '사망 — 깨우지 않음';
  }
  if(st.id==='undertaker' && !S.executedPrevDay && !first) return '어제 낮 처형 없음 — 깨우지 않음';
  if(st.id==='scarletwoman') return null;
  return null;
}
function autoInfoHint(st){
  /* 사회자 친화: 요리사·초공감자 정답 후보 자동 계산 */
  const seats=S.players;
  const evilAt = p => isEvil(p); // 등록 재량 반영 전 '실제' 값
  if(st.id==='chef'){
    let pairs=0;
    for(let i=0;i<seats.length;i++){ if(evilAt(seats[i]) && evilAt(seats[(i+1)%seats.length])) pairs++; }
    return `실제 인접 악 쌍: <b class="num">${pairs}</b> <span class="hint">(첩자·은둔자 등록 재량 반영 전 기준)</span>`;
  }
  if(st.id==='empath'){
    return (st.holders||[]).filter(p=>p.alive).map(p=>{
      const i=seats.indexOf(p); const n=seats.length;
      let L=null,R=null;
      for(let d=1;d<n;d++){ const q=seats[((i-d)%n+n)%n]; if(q.alive&&q!==p){L=q;break;} }
      for(let d=1;d<n;d++){ const q=seats[(i+d)%n]; if(q.alive&&q!==p){R=q;break;} }
      const cnt=(L&&evilAt(L)?1:0)+(R&&evilAt(R)?1:0);
      return `${esc(p.name)}의 생존 이웃: ${L?esc(L.name):'-'} · ${R?esc(R.name):'-'} → 실제 악 수 <b class="num">${cnt}</b> <span class="hint">(등록 재량 반영 전)</span>`;
    }).join('<br>');
  }
  if(st.id==='undertaker' && S.executedPrevDay){
    return `어제 처형: <b>${esc(S.executedPrevDay)}</b>`;
  }
  if(st.id==='fortuneteller' && S.redHerringId){
    const rh=playerOf(S.redHerringId);
    return rh? `🎗 붉은 청어: <b>${esc(rh.name)}</b> — 지목되면 "예"`:'';
  }
  return '';
}
function renderNight(){
  const el=$('#pane-night');
  if(S.phase.kind!=='night'){
    el.innerHTML=`<div class="card"><h2>밤 진행</h2><p class="hint">지금은 ${phaseName()} 단계입니다. 상단의 진행 버튼으로 밤으로 이동하면 이 시트 구성에 맞는 밤 순서가 생성됩니다.</p>
    ${previewNightOrders()}</div>`;
    return;
  }
  const steps=nightSteps();
  const doneMap=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={});
  /* 중독 전용 요약은 파일 하단 '상태 통합 대시보드'(.thy-sb)로 이관했다 — 그쪽 '오작동' 블록이
     중독·취함·주정뱅이를 모두 덮고 만료 시점까지 보여준다. 두 곳에 두면 같은 정보가 두 번 뜬다. */
  el.innerHTML=`
  <div class="card">
    <h2>밤 ${S.phase.n} ${S.phase.n===1?'(첫날 밤)':''}</h2>
    <p class="hint">순서대로 진행하며 완료 체크. 이름을 누르면 진행 가이드가 열립니다. 회색 항목은 오늘 밤 깨우지 않는 캐릭터입니다.</p>
    ${steps.map((st,i)=>renderStep(st,i,doneMap)).join('')}
    <div class="alertbox blue" style="margin-top:12px">🌅 <b>새벽</b> — 모두 깨우고, 오늘 밤의 사망자를 공표하세요(사인은 밝히지 않음). 상단 버튼으로 낮으로 진행하면 보호 토큰이 자동 해제됩니다.</div>
    ${renderDeathTraces(8)}
  </div>`;
}
function previewNightOrders(){
  const fmt=(ord,first)=>ord.map(id=>{
    if(INFO_STEPS[id]) return `<li>${INFO_STEPS[id].ko} <span class="hint">(7인 이상)</span></li>`;
    const c=charOf(id); return c?`<li>${esc(c.ko)}</li>`:'';
  }).join('');
  return `<div class="grid2" style="margin-top:10px">
    <div><h3>첫날 밤 순서 (공식)</h3><ol class="guide">${fmt(editionOf().first,true)}</ol></div>
    <div><h3>그 외 밤 순서 (공식)</h3><ol class="guide">${fmt(editionOf().other,false)}</ol></div>
  </div>`;
}
function renderStep(st,i,doneMap){
  const first=S.phase.n===1;
  const done=!!doneMap[st.id];
  const skip=stepSkipReason(st);
  let name, who='', body='';
  if(st.info){
    const inf=INFO_STEPS[st.id];
    name=inf.ko;
    const targets = st.id==='minioninfo' ? S.players.filter(p=>charOf(p.charId)?.type==='minion')
                                         : S.players.filter(p=>charOf(p.charId)?.type==='demon');
    who=targets.map(p=>esc(p.name)).join(', ');
    body=`<ol class="guide">${inf.guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    if(typeof NIGHT_FLOW!=='undefined' && flowFor(st.id)) body=`<div class="row" style="margin:4px 0 10px"><button class="primary" style="min-width:200px" onclick="event.stopPropagation();startWiz('${st.id}')">▶ 인터랙티브 진행</button></div>`+body;
    if(st.id==='demoninfo'){
      const inPlay=new Set(S.players.map(p=>p.charId));
      /* 블러프는 '이 시트에 있으면서 판에 없는 선한 캐릭터'다(공식 Demon Info). CHARACTERS 전체를
         훑으면 에디션을 가리지 않아 TB 판에서 곡예사(SV 저글러)를 블러프로 추천하는 등 시트 밖
         캐릭터가 섞인다. editionChars() 로 지금 이 판의 캐릭터 풀만 본다 — 빌더로 실험 캐릭터를
         담은 시트라면 그 실험 캐릭터도 정당한 블러프이므로 edition:'exp' 예외는 더는 필요 없다. */
      const safeBluffs=editionChars().filter(c=>(c.type==='townsfolk'||c.type==='outsider') && !inPlay.has(c.id) && c.id!==S.drunkMaskChar).map(c=>c.ko);
      body+=`<div class="alertbox">블러프 후보(미사용 선 캐릭터, 주정뱅이 위장 제외): ${esc(safeBluffs.join(', ')||'없음')}</div>`;
    }
  } else {
    const c=charOf(st.id);
    name=c.ko;
    const holders=(st.holders||[]);
    who = holders.map(p=>{
      let tags='';
      if(!p.alive) tags+=' 💀';
      if(hasStatus(p,'poison')) tags+=' ☠';
      if(p.charId==='drunk'||hasStatus(p,'drunkS')) tags+=' 🍺';
      return esc(p.name)+tags;
    }).join(', ');
    if(st.mask) who += (who?' · ':'')+`🎭 ${esc(st.mask.name)} (주정뱅이 — ${esc(c.ko)} 행세)`;
    const guide = first? (c.guideFirst||c.guideOther) : (c.guideOther||c.guideFirst);
    if(guide) body+=`<ol class="guide">${guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`;
    const hint=autoInfoHint(st);
    if(hint) body+=`<div class="alertbox blue">${hint}</div>`;
    const badHolders=holders.filter(p=>p.alive&&isMalfunctioning(p));
    if(badHolders.length) body+=`<div class="alertbox red">☠ <b>${badHolders.map(p=>esc(p.name)).join(', ')}</b>: 능력 오작동 상태 — 정보형이면 <b>거짓 정보</b>를 주고, 발동형이면 <b>효과 없음</b>으로 처리하되 본인에게는 평소처럼 응대하세요.</div>`;
    if(st.mask) body+=`<div class="alertbox">🎭 주정뱅이입니다 — ${esc(c.ko)}처럼 깨우되 <b>항상 그럴듯한 거짓 정보</b>를 주세요. 어떤 정보를 줬는지 그리모어 메모에 기록!</div>`;
    if(c.warn&&c.warn.length) body+=`<details class="morebox"><summary>상호작용 주의 ${c.warn.length}건</summary><div class="inner"><ul>${c.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></details>`;
    if(typeof NIGHT_FLOW!=='undefined' && flowFor(st.id)) body+=`<div class="row" style="margin:10px 0 4px"><button class="primary" style="min-width:200px" onclick="event.stopPropagation();startWiz('${st.id}')">▶ 인터랙티브 진행</button></div>`;
    body+=stepWidget(st,c);
    const recTargets=holders.filter(p=>p.alive).concat(st.mask&&st.mask.alive?[st.mask]:[]);
    if(recTargets.length) body+=`<div class="row" style="margin-top:10px">
      <input id="rec-${st.id}" placeholder="오늘 밤 제공한 정보 메모 (예: 2번·5번 중 요리사)" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')recordInfo('${st.id}','${recTargets[0].id}')">
      <button class="small" onclick="recordInfo('${st.id}','${recTargets[0].id}')">📝 기록</button></div>`;
    if(c.conditional) who+=` <span class="pill warn">${esc(c.conditional)}</span>`;
    /* 공식 밤 순서표 어디에도 없어 위치를 정하지 못한 캐릭터 — 지어내지 않고 사회자에게 알린다 */
    if(st.noOrder) who+=` <span class="pill warn">순서 미정</span>`;
  }
  const cls = done?'done': skip?'skip':'wake';
  return `<div class="step ${cls} ${openStep===st.id?'open':''}" id="step-${st.id}">
    <div class="stephead" onclick="toggleStep('${st.id}')">
      <input type="checkbox" ${done?'checked':''} onclick="event.stopPropagation();toggleDone('${st.id}')" style="accent-color:var(--accent)">
      <span class="stepnum num">${i+1}</span>
      <span class="stepname">${esc(name)}</span>
      <span class="stepwho">${who||''}</span>
      ${skip?`<span class="pill neutral" style="margin-left:auto">${esc(skip)}</span>`:''}
    </div>
    <div class="stepbody">${body}</div>
  </div>`;
}

function toggleDone(id){ const m=S.nightDone[S.phase.n]||(S.nightDone[S.phase.n]={}); m[id]=!m[id]; save(); renderAll(); }

  if(st.id==='witch') return `<h3>🧹 저주 대상 기록</h3>`+selPlayers('doCurse', p=>p.alive, '마녀가 지목한 대상');
  if(st.id==='cerenovus') return `<h3>🌀 광기 대상 기록</h3><p class="hint">대상 지정 후, 어떤 캐릭터의 광기인지 그리모어 메모에 적으세요.</p>`+selPlayers('doMad', p=>p.alive, '세레노버스가 지목한 대상');
  if(st.id==='exorcist'){

      +(cur?`<div class="alertbox blue">오늘 대상 기록됨: <b>${esc(cur.name)}</b></div>`:'')
      +`<p class="hint">악마를 지목했으면 악마를 깨워 구마사제를 보여주고, 이번 밤 악마 살해 단계를 건너뛰세요.</p>`
      +selPlayers('doExorcist', p=>p.alive, '구마사제가 지목한 대상');
  }
  if(SPENT_ONCE.includes(st.id) && !(c&&c.killer)) return `<h3>✔ 1회성 능력 추적</h3>`+spentWidget(st.id);
  if(c && c.killer && S.edition!=='tb'){ window.__stepKiller=c.id;  // 하위호환(위저드 미사용 경로)

        : `<div class="row" style="margin-top:8px"><button class="small" onclick="doPoCharge()">🦏 이번 밤 지목 안 함(충전)</button></div>`;

  }
  return '';
}
/* 1회성 능력 소진 추적 (어릿광대·악마의 변호사 제외) */
const SPENT_ONCE=['courtier','professor','assassin','seamstress','philosopher','artist','fanggu'];
/* 팡 구의 점프 소진만은 'spent' 토큰이 아니라 S.fangGuJumped 가 유일한 기록이다 —
   실제 점프를 막는 게이트(doFangGuAttack)가 그 값만 보기 때문이다. 예전에는 같은 사실이
   토큰과 플래그 두 곳에 따로 적혀서, 이 버튼으로 '소진 기록'을 눌러도 점프가 그대로
   일어나고, 반대로 실제 점프가 일어난 뒤에도 위젯은 계속 '아직 미소진'으로 보였다. */
function spentDone(cid, p){ return cid==='fanggu'? !!S.fangGuJumped : hasStatus(p,'spent'); }
function spentWidget(cid){
  const holders=playersByChar(cid); if(!holders.length) return '';
  const p=holders.find(q=>!spentDone(cid,q));
  if(!p) return `<div class="row" style="margin-top:8px"><span class="pill ok">✔ 1회 능력 소진됨</span></div>`;
  return `<div class="row" style="margin-top:8px"><button class="small" onclick="doSpend('${cid}')">✔ 능력 사용 — 소진 기록${cid==='fanggu'?' (점프)':''}</button></div>`;
}
function doSpend(cid){
  const p=S.players.find(q=>q.charId===cid && !spentDone(cid,q));
  if(!p){ toast('대상이 없거나 이미 소진되었습니다.','warn'); return; }
  if(cid==='fanggu'){                                  // 기록은 S.fangGuJumped 한 곳에만
    S.fangGuJumped=true;
    log(`🦊 팡 구 점프 소진 기록(수동) — ${p.name}`);
    toast(`✔ ${p.name}(${charName(p)}) 점프 소진 기록 — 이후 자동 점프는 일어나지 않습니다.`,'ok');
    save(); renderAll(); return;
  }
  addStatus(p,'spent',`${charName(p)} 1회 능력 사용`,null);
  toast(`✔ ${p.name}(${charName(p)}) 1회 능력 소진 기록`,'ok');
  save(); renderAll();
}

/* 악마의 변호사: 매일 밤 '전날과 다른' 생존자 1명을 변호 — 내일 처형돼도 죽지 않는다(처형 자체는 성립·소모).
   구마사제(exorcistPrev)와 같은 패턴으로 S.daPrev={pid,n}에 어제 대상을 추적한다.
   밤 n 부여 → 낮 n 처형에 유효 → 밤 n+1 시작(황혼)에 자동 해제. 변호사 오작동이면 불발. */
function doDevilsAdvocate(pid){
  if(!pid)return; const t=playerOf(pid);
  if(S.daPrev && S.daPrev.pid===pid && S.daPrev.n<S.phase.n){
    toast(`⚖️ ${t.name}은(는) 어제의 변호 대상 — 전날과 다른 사람을 지목해야 합니다.`,'warn'); return;
  }
  S.daPrev={pid, n:S.phase.n};
  const da=S.players.find(q=>q.alive&&q.charId==='devilsadvocate');
  if(da && isMalfunctioning(da)){
    toast('악마의 변호사가 오작동 상태 — 보호가 걸리지 않습니다. 기록만 남깁니다.','warn');
    log(`⚖️ 악마의 변호사 오작동: ${t.name} 처형 보호 불발`);
    save(); renderAll(); return;
  }
  // 재지목 시 토큰 '이동': 기존 변호 토큰을 먼저 회수한다 — 한 번에 한 명만 보호(이중 보호·중복 적재 방지)
  S.players.forEach(q=>{ (q.statuses||[]).slice().forEach(s=>{ if(s.key==='execProtect'&&s.source==='악마의 변호사'){ q.statuses.splice(q.statuses.indexOf(s),1); log(`${q.name}: ⚖️처형 보호 해제 — 변호 대상 변경`); } }); });
  addStatus(t,'execProtect','악마의 변호사',{kind:'night', n:S.phase.n+1});
  toast(`⚖️ ${t.name} 처형 보호 — 내일 처형돼도 죽지 않습니다(밤 ${S.phase.n+1} 시작에 자동 해제)`,'ok');
  save(); renderAll();
}
/* 찻집 여인: t가 '정상 작동 중인 생존 찻집 여인'의 살아있는 양옆 이웃이고, 그 이웃 둘 다 선(주민/외지인)이면 보호 */
function teaLadyBlock(t){
  const n=S.players.length;
  for(const tl of S.players){
    if(tl.charId!=='tealady' || !tl.alive || isMalfunctioning(tl)) continue;
    const i=S.players.indexOf(tl);
    let L=null,R=null;
    for(let d=1;d<n;d++){ const q=S.players[((i-d)%n+n)%n]; if(q.alive&&q!==tl){L=q;break;} }
    for(let d=1;d<n;d++){ const q=S.players[(i+d)%n]; if(q.alive&&q!==tl){R=q;break;} }
    if(!L||!R||L===R) continue;
    /* 진영 판정은 isEvil() 단일 출처다 — p.alignment(현상금 사냥꾼 셋업·건달·메제펠레스·교주·뱀 조련사 스왑)가
       캐릭터 타입보다 우선한다. 캐릭터 미배정 좌석은 종전대로 '선'으로 치지 않는다. */
    const good=p=>{const c=charOf(p.charId); return !!c && !isEvil(p);};
    if(good(L)&&good(R)&&(t===L||t===R)) return tl;
  }
  return null;
}
function doPoison(pid){ if(!pid)return; const p=playerOf(pid); const poisoner=S.players.find(q=>q.charId==='poisoner');
  if(hasStatus(p,'poison')){ toast(`${p.name}은(는) 이미 중독 상태입니다 — 중복 부여하지 않습니다.`,'warn'); return; }
  if(poisoner && isMalfunctioning(poisoner)){ toast('독살범 본인이 오작동 상태 — 독이 퍼지지 않습니다. 기록만 남깁니다.','warn'); log(`독살범 오작동: ${p.name} 중독 불발`); save(); renderAll(); return; }
  addStatus(p,'poison','독살범',{kind:'night', n:S.phase.n+1}); save(); renderAll(); toast(`${p.name} 중독 — 내일 황혼(밤 ${S.phase.n+1} 시작)에 자동 해제`,'ok'); }
/* 푸카는 독살범과 수명주기가 다르다 — doPoison 재사용이 결함이었다.
   공식: 밤마다 1명을 물면 즉시 중독, '이전에 문 사람'이 그때 죽으면서 건강해진다.
   푸카가 오작동이면 새 중독도 지연 사망도 없다. 페이즈 기반 expiresAt 을 쓰면 안 된다. */
function doPukkaPick(pid){
  if(!pid)return; const t=playerOf(pid);
  const pk=S.players.find(q=>(q.alive||(q.charId==='zombuul'&&hasStatus(q,'fakedead'))) && q.charId==='pukka');
  const prev=S.pukkaVictimId? playerOf(S.pukkaVictimId): null;
  if(pk && isMalfunctioning(pk)){
    toast('푸카가 중독/취함 상태 — 새로 무는 것도, 이전 희생자의 사망도 일어나지 않습니다. 기록만 남깁니다.','warn');
    log(`푸카 오작동: ${t.name} 중독 불발 — 이전 희생자 사망 보류`);
    save(); renderAll(); return;
  }
  if(hasStatus(t,'poison')) toast(`${t.name}은(는) 이미 중독 상태 — 토큰을 중복 부여하지 않습니다.`,'warn');
  else addStatus(t,'poison','푸카',null);          // 만료 없음 — 다음 지목 때 해제된다
  if(prev && prev!==t && prev.alive){
    // 공식: '죽고 나서 건강해진다'. 사망 판정이 끝날 때까지 독을 유지해야
    // 어릿광대 1회 생존이 막히고 까마귀지기·현자가 거짓 정보를 받을 수 있다(중독 = 임의 정보).
    const blk=resolveDeath(prev,{sourceType:'demon', sourceCharId:'pukka', cause:'푸카의 독'}).reason;
    if(blk){
      toast(`${prev.name}: ${blk} — 푸카의 독으로 죽지 않았습니다. 독은 이제 풀립니다.`,'ok');
      log(`푸카의 독 → ${prev.name} 사망 불발(${blk})`);
    } else {
      log(`🐍 푸카의 독 발현 — ${prev.name} 사망`);
      resolveNightDeath(prev, '푸카의 독');
    }
  } else if(prev && prev===t){
    toast('이전에 문 대상을 다시 물었습니다 — 규칙상 처리(사망 여부)를 직접 판단하세요.','warn');
  }
  /* 공식 Pukka: "they die & the previously poisoned player becomes healthy" — 이전 희생자의
     독은 생사와 무관하게 풀린다. 회수를 위 사망 분기(prev.alive) 안에만 두면, 이미 죽어 있던
     희생자(전날 처형 등)의 '푸카' 토큰이 시체에 영구히 남는다. expiresAt 이 null 이라
     expireStatuses() 도 걷지 못해 유일한 회수 경로가 여기다. 시체의 중독은 얼뜨기·달의 자손처럼
     '죽은 뒤' 판정하는 규칙을 계속 무효화한다.
     분기 '밖'이자 사망 판정 '뒤'라는 위치는 그대로다 — 그래야 어릿광대 1회 생존과
     까마귀지기·현자의 거짓 정보(중독 = 임의 정보)가 판정 시점에 보존된다. */
  if(prev && prev!==t){
    const i=(prev.statuses||[]).findIndex(s=>s.key==='poison' && s.source==='푸카');
    if(i>=0){ prev.statuses.splice(i,1); log(`푸카의 독 해제 — ${prev.name}`); }
  }
  S.pukkaVictimId=t.id;
  save(); renderAll();
}
/* ── 취함 만료 정책(공식 위키 기준) ──
   선원·여관 주인·건달·음유시인: "다음 황혼까지" / 궁정대신: "3밤+3낮" / 주정뱅이·사랑꾼·뱀 조련사 스왑: 영구.
   낮에 부여되면(음유시인 등) 다가올 밤을 기준 밤으로 계산한다. */
function drunkExpiry(policy){
  const ph=S.phase;
  const base = ph.kind==='night'? ph.n : ph.n+1;
  if(policy==='dusk')  return {kind:'night', n:base+1};   // 다음 황혼(다음 밤 시작)에 자동 해제
  if(policy==='court') return {kind:'night', n:base+3};   // 3밤+3낮 뒤 황혼에 자동 해제
  return null;                                            // 영구
}
function doSailorDrunk(pid){
  if(!pid)return; const t=playerOf(pid);
  const sl=S.players.find(q=>q.alive && q.charId==='sailor');
  if(sl && isMalfunctioning(sl)){
    toast('선원 본인이 오작동 상태 — 아무도 취하지 않습니다. 기록만 남깁니다.','warn');
    log(`선원 오작동: ${t.name} 취함 불발`); save(); renderAll(); return;
  }
  if(hasStatus(t,'drunkS')){ toast(`${t.name}은(는) 이미 취해 있습니다 — 중복 부여하지 않습니다.`,'warn'); return; }
  addStatus(t,'drunkS','선원',drunkExpiry('dusk')); save(); renderAll();
  toast(`⚓ ${t.name} 🍺취함 — 다음 황혼(밤 ${drunkExpiry('dusk').n} 시작)에 자동 해제`,'ok');
}
function doInnkeeperDrunk(pid){

  const ik=S.players.find(q=>q.alive && q.charId==='innkeeper');
  if(ik && isMalfunctioning(ik)){

    log(`여관 주인 오작동: ${t.name} 취함 불발`); save(); renderAll(); return;
  }
  if(hasStatus(t,'drunkS')){ toast(`${t.name}은(는) 이미 취해 있습니다 — 중복 부여하지 않습니다.`,'warn'); return; }
  addStatus(t,'drunkS','여관 주인',drunkExpiry('dusk')); save(); renderAll();
  toast(`🏠 ${t.name} 🍺취함 — 다음 황혼(밤 ${drunkExpiry('dusk').n} 시작)에 자동 해제`,'ok');
}
function doCourtierDrunk(cid){
  if(!cid)return;
  const co=S.players.find(q=>q.alive && q.charId==='courtier');
  doSpend('courtier');                                    // 발동 즉시 1회 소진(불발이어도 소모)
  if(co && isMalfunctioning(co)){
    toast('궁정대신이 오작동 상태 — 취함이 걸리지 않습니다(능력은 소진).','warn');
    log(`궁정대신 오작동: ${charOf(cid)?.ko||cid} 취함 불발`); save(); renderAll(); return;
  }

  if(!holders.length){

    log(`궁정대신 지목: ${charOf(cid)?.ko||cid} — 게임에 없음(불발)`); save(); renderAll(); return;
  }
  holders.forEach(p=>{ if(!hasStatus(p,'drunkS')) addStatus(p,'drunkS','궁정대신',drunkExpiry('court')); });
  save(); renderAll();
