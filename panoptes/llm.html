<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Panoptes — LLM 랭킹</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111721; --panel2:#0d131c; --line:#1f2937; --ink:#e6edf3; --dim:#8a93a3;
    --accent:#2bc0d4; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  #app{display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:0 18px;height:52px;flex:0 0 52px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header h1{font-size:16px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  header a.back{font-size:12.5px;font-weight:600;color:var(--dim);text-decoration:none;padding:6px 14px;border-radius:8px;transition:.13s}
  header a.back:hover{background:rgba(127,150,170,.08);color:var(--ink)}
  .hint{color:var(--dim);font-size:12.5px;line-height:1.6}
  #llmview{flex:1;padding:24px clamp(16px,4vw,48px)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🛰 Panoptes</h1>
    <a class="back" href="index.html">← 대시보드</a>
    <span style="font-size:13px;font-weight:700;color:var(--accent)">🤖 LLM — OpenRouter 랭킹</span>
  </header>
  <div id="llmview"><p class="hint" style="padding:20px">LLM 랭킹 데이터 로딩…</p></div>
</div>
<script src="llm_charts.js"></script>
<script>
(async function(){
  const box=document.getElementById('llmview');
  try{ const d=await fetch('data/llm_rankings.json').then(r=>r.json());
    box.innerHTML=''; renderLLM(box, d);
  }catch(e){ console.warn('llm', e); box.innerHTML='<p class="hint" style="padding:20px">LLM 랭킹 데이터 준비 중…</p>'; }
})();
</script>
</body>
</html>
