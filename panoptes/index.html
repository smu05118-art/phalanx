<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰 Panoptes — 국제분쟁 지도</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<script src="lib/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#111721; --panel2:#0d131c; --line:#1f2937; --ink:#e6edf3; --dim:#8a93a3;
    --accent:#2bc0d4; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --s1:#4ea1ff; --s2:#59d0a8; --s3:#ffd23d; --s4:#ff8a3d; --s5:#ff4d5e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:0 18px;height:52px;flex:0 0 52px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10}
  header h1{font-size:16px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  nav.tabs{display:flex;gap:4px}
  .ptab{font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--dim);transition:.13s}
  .ptab:hover{background:rgba(127,150,170,.08);color:var(--ink)}
  .ptab.on{background:rgba(43,192,212,.14);color:var(--accent)}
  header .stat{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
  header .stat b{color:var(--accent)}
  #mapview{flex:1;display:grid;grid-template-columns:300px 1fr 360px;min-height:0}
  #liqview{flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px)}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
  aside.right{border-right:none;border-left:1px solid var(--line)}
  #map{position:relative}
  .sect{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 10px}
  .sect:not(:first-child){margin-top:20px}
  .frow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 9px;border-radius:8px;cursor:pointer;transition:.13s;color:var(--ink)}
  .frow:hover{background:rgba(127,150,170,.08)}
  .frow.off{opacity:.34}
  .frow .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .frow .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .sevbar{display:flex;gap:3px;margin:2px 0 4px}
  .sevbar span{height:6px;flex:1;border-radius:2px}
  .search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--ink);font-size:12.5px;margin-bottom:6px;font-family:var(--sans)}
  .evlist{display:flex;flex-direction:column;gap:7px}
  .evcard{background:var(--panel2);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:9px 11px;cursor:pointer;transition:.13s}
  .evcard:hover{border-color:var(--accent);transform:translateX(2px)}
  .evcard .et{font-size:12.5px;font-weight:650;line-height:1.3;margin-bottom:3px}
  .evcard .em{font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;gap:7px;flex-wrap:wrap}
  #detail .dt{font-size:16px;font-weight:750;line-height:1.3;margin-bottom:6px}
  #detail .badge{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:5px;margin:0 4px 8px 0}
  #detail .meta{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.8;margin:8px 0}
  #detail .meta b{color:var(--ink)}
  #detail p.sum{font-size:13px;line-height:1.65;color:#cdd6de;margin:10px 0}
  #detail .actors span{display:inline-block;font-size:11px;padding:3px 9px;margin:3px 3px 0 0;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  #detail a.src{display:inline-block;margin-top:12px;font-size:12px;color:var(--accent);text-decoration:none}
  #detail a.src:hover{text-decoration:underline}
  .hint{color:var(--dim);font-size:12.5px;line-height:1.6}
  .legend-note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:8px}
  .rjump{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
  .rchip{font-size:11.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--dim);transition:.13s}
  .rchip:hover{border-color:var(--accent);color:var(--accent);background:rgba(43,192,212,.08)}
  #mapLegend{position:absolute;top:14px;right:14px;background:rgba(13,19,28,.82);border:1px solid var(--line);border-radius:10px;padding:9px 12px;z-index:5;backdrop-filter:blur(8px)}
  .mlrow{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);padding:2px 0}
  .mldot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 6px currentColor}
  .maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(13,19,28,.7)!important}
  .maplibregl-ctrl-attrib a{color:var(--dim)!important}
  .maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:12px;padding:8px 11px}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  #timebar{position:absolute;left:16px;bottom:16px;right:16px;background:rgba(17,23,33,.9);border:1px solid var(--line);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(6px)}
  #timebar input{flex:1;accent-color:var(--accent)}
  #timebar .tl{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
  @media(max-width:1000px){#app{grid-template-columns:1fr;grid-template-rows:52px 44vh 1fr}aside.right{display:none}aside{border-right:none;border-bottom:1px solid var(--line)}}

  /* ══ ProView 확장 (proview.js) ══ */
  #tickerbar{height:30px;flex:0 0 30px;background:var(--panel2);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
  #tickerbar .tkwrap{display:inline-block;animation:tkroll 75s linear infinite;will-change:transform}
  #tickerbar:hover .tkwrap{animation-play-state:paused}
  @keyframes tkroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  #tickerbar .tk{display:inline-block;padding:0 10px;font-family:var(--mono);font-size:11px;line-height:30px;cursor:pointer;color:var(--dim)}
  #tickerbar .tk b{color:var(--ink);font-weight:650}
  #tickerbar .tk:hover{color:var(--accent)}
  #tickerbar .tksep{color:#2a3140;font-size:10px}
  .ttsbtn{background:rgba(43,192,212,.12);border:1px solid rgba(43,192,212,.35);color:var(--accent);font-size:11px;font-weight:650;padding:3px 10px;border-radius:999px;cursor:pointer;font-family:var(--sans)}
  .ttsbtn:hover{background:rgba(43,192,212,.22)}
  #ttsPill{position:fixed;right:18px;bottom:18px;z-index:99;background:var(--panel);border:1px solid var(--accent);color:var(--accent);font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .rswitch{display:flex;align-items:center;gap:6px;margin-bottom:12px}
  .rsw{font-size:12px;font-weight:650;padding:5px 12px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:var(--dim);transition:.13s}
  .rsw.on{background:rgba(43,192,212,.14);color:var(--accent);border-color:rgba(43,192,212,.4)}
  .sigts{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
  .nfday{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .nfcard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;transition:.13s}
  .nfcard.fresh{border-left:3px solid var(--accent)}
  .nfcard:hover{border-color:var(--accent)}
  .nft{font-size:12px;line-height:1.4;font-weight:600}
  .nft a{color:var(--ink);text-decoration:none}
  .nft a:hover{color:var(--accent)}
  .nfbrk{display:inline-block;background:#ff4d5e;color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-right:5px;vertical-align:1px}
  .nfm{display:flex;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:4px;align-items:center}
  .nftopic{color:var(--accent)}
  .nfgeo{cursor:pointer;margin-left:auto}
  .nfgeo:hover{transform:scale(1.2)}
  .sightop{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .sightop h2{font-size:20px;font-weight:800}
  .wchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .wchip{font-size:11.5px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--dim);opacity:.5;transition:.13s}
  .wchip.on{opacity:1;color:var(--accent);border-color:rgba(43,192,212,.4);background:rgba(43,192,212,.08)}
  .siggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;max-width:1280px}
  .sigw{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;min-width:0}
  .sigw.wide{grid-column:1/-1}
  .sigh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sigh b{font-size:13.5px}
  .sigedit{margin-left:auto;font-size:11px;color:var(--dim);cursor:pointer}
  .sigedit:hover{color:var(--accent)}
  .sigfoot{font-size:10px;color:var(--dim);margin-top:12px;border-top:1px solid var(--line);padding-top:8px;line-height:1.5}
  .sbp{font-size:13px;line-height:1.7;color:#cdd6de;margin:0 0 8px}
  .wrow{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid rgba(31,41,55,.5);font-size:12.5px}
  .wrow:last-child{border-bottom:none}
  .wrow .wnm{flex:1;font-weight:600;min-width:70px}
  .wrow .wpx{font-family:var(--mono);font-size:12px;min-width:70px;text-align:right}
  .wrow .wch{font-family:var(--mono);font-size:11.5px;min-width:56px;text-align:right}
  .wrow.woff{opacity:.3}
  .wrow.editing{cursor:pointer;outline:1px dashed rgba(43,192,212,.4);outline-offset:-1px;border-radius:6px}
  .cvrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(31,41,55,.5);font-size:12.5px}
  .cvrow:last-child{border-bottom:none}
  .cvt{flex:0 0 84px;font-weight:600}
  .cvbars{flex:1;display:flex;align-items:flex-end;gap:2px;height:22px}
  .cvbars i{flex:1;background:rgba(43,192,212,.55);border-radius:1.5px;min-height:2px}
  .cvn{font-family:var(--mono);font-size:10.5px;color:var(--dim);min-width:58px;text-align:right}
  .cvtr{font-size:10.5px;font-weight:700;min-width:44px;text-align:right}
  .kwcloud{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline}
  .kwchip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--ink);line-height:1.5}
  .kwchip i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:5px}
  .mkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .mkh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px}
  .mkrow{display:flex;align-items:baseline;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid rgba(31,41,55,.45)}
  .mkrow span{flex:1;color:#cdd6de}
  .mkrow b{font-family:var(--mono);font-size:12px}
  .mkrow i{font-style:normal;font-family:var(--mono);font-size:11px;min-width:52px;text-align:right}
  .pdrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(31,41,55,.45);font-size:12.5px;text-decoration:none;color:var(--ink)}
  .pdrow:hover .pdq{color:var(--accent)}
  .pdq{flex:1;line-height:1.35;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pdbar{flex:0 0 90px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .pdbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .pdrow b{font-family:var(--mono);font-size:12px;min-width:44px;text-align:right}
  .pdchg{font-style:normal;font-family:var(--mono);font-size:10px;min-width:34px;text-align:right}
  .rdtop{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--dim);margin:6px 0 10px}
  .rdtop b{font-family:var(--mono);color:var(--ink)}
  .rddrv{font-size:11.5px;line-height:1.5;color:#cdd6de;padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin-top:5px;cursor:pointer}
  .rddrv:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:700px){#tickerbar .tkwrap{animation-duration:40s}.siggrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🛰 Panoptes</h1>
    <nav class="tabs">
      <span class="ptab on" data-tab="map">🗺 분쟁지도</span>
      <span class="ptab" data-tab="sig">📡 시그널</span>
      <span class="ptab" data-tab="liq">💧 유동성</span>
      <span class="ptab" data-tab="tech">📐 기술적</span>
      <span class="ptab" data-tab="ship">🚢 해운</span>
      <span class="ptab" data-tab="human">👥 인간지표</span>
      <span class="ptab" data-tab="llm">🧠 LLM</span>
    </nav>
    <div class="stat" id="headStat"><b id="stEvents">0</b> events · <b id="stActive">0</b> shown · <span id="stUpdated">—</span></div>
  </header>
  <div id="tickerbar" hidden></div>
  <div id="mapview">
    <aside class="left">
      <input class="search" id="search" placeholder="이벤트·국가 검색…">
      <p class="sect">지역 바로가기</p>
      <div id="regionJump" class="rjump"></div>
      <p class="sect">유형 (필터)</p>
      <div id="typeFilters"></div>
      <p class="sect">심각도</p>
      <div id="sevFilters"></div>
      <p class="sect">뉴스 레이어</p>
      <div class="frow" id="newsLayerToggle"><span class="dot" style="background:#2bc0d4;border-radius:50%"></span>지오태그 뉴스 24h<span class="n" id="newsLayerN">0</span></div>
      <p class="legend-note">마커 크기·색 = 심각도(1 긴장 → 5 대규모 교전). 클릭 시 상세. 하단 슬라이더로 기간 필터.</p>
    </aside>
    <div id="map">
      <div id="mapLegend">
        <div class="mlrow"><span class="mldot" style="background:#ff4d5e"></span>심각도 5 · 대규모 교전</div>
        <div class="mlrow"><span class="mldot" style="background:#ff8a3d"></span>4 · 공습·격전</div>
        <div class="mlrow"><span class="mldot" style="background:#ffd23d"></span>3 · 교전</div>
        <div class="mlrow"><span class="mldot" style="background:#59d0a8"></span>2 · 충돌</div>
        <div class="mlrow"><span class="mldot" style="background:#4ea1ff"></span>1 · 긴장</div>
      </div>
      <div id="timebar">
        <span class="tl" id="tlMin">—</span>
        <input type="range" id="timeSlider" min="0" max="100" value="0">
        <span class="tl" id="tlCur">전체 기간</span>
      </div>
    </div>
    <aside class="right">
      <div class="rswitch">
        <span class="rsw on" data-r="ev">이벤트</span><span class="rsw" data-r="news">뉴스플로우</span>
        <button id="ttsNews" class="ttsbtn" title="상위 헤드라인 음성 브리핑">🔊</button>
        <span class="sigts" id="nfUpdated"></span>
      </div>
      <div id="rpaneEv">
        <p class="sect">이벤트 상세</p>
        <div id="detail"><p class="hint">지도의 마커 또는 왼쪽 목록에서 이벤트를 선택하세요.</p></div>
        <p class="sect" style="margin-top:22px">최근 이벤트</p>
        <div class="evlist" id="evlist"></div>
      </div>
      <div id="rpaneNews" hidden></div>
    </aside>
  </div>
  <div id="sigview" hidden style="flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px)"></div>
  <div id="liqview" hidden></div>
  <div id="techview" hidden style="flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px)"></div>
  <div id="shipview" hidden style="flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px)"></div>
  <div id="humanview" hidden style="flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px)"></div>
  <div id="llmview" hidden style="flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px)"></div>
</div>
<script src="proview.js"></script>
<script src="tech_charts.js"></script>
<script src="deriv_charts.js"></script>
<script src="shipping_charts.js"></script>
<script src="llm_charts.js"></script>
<script src="tga_target.js"></script>
<script src="liq_charts.js"></script>
<script src="app.js"></script>
</body>
</html>
