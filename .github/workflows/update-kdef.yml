# 한국방산(argus/kdef) 일일 자동 갱신.
#
# 계약 공시(수시)는 매일 새로 뜨고 정기보고서는 분기마다 뜬다 — 둘 다 캐시가 있으면 건너뛰므로
# 평시 비용은 검색 몇 건이다. 수집기는 **하나씩** 돌린다(DART 는 IP 단위로 끊는다).
# concurrency 그룹은 kce·kship 과 같은 `kship-dart` — 세 탭이 동시에 DART 를 두드리면 안 된다.
name: update-kdef
on:
  schedule:
    - cron: "20 2 * * *"          # 11:20 KST — kship(10:40) 뒤
  workflow_dispatch:
    inputs:
      quarter:
        description: "정기보고서 분기 강제(예: 2026Q3) — 비우면 최신 분기"
        required: false
permissions:
  contents: write
concurrency:
  group: kship-dart
  queue: max  # Preserve every waiting industry refresh (up to 100).
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (before)
        run: cd argus/kdef/tools && python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Collect and build
        id: build
        continue-on-error: true
        env:
          QUARTER_INPUT: ${{ github.event.inputs.quarter }}
        shell: bash
        working-directory: argus/kdef/tools
        run: |
          set -o pipefail
          Q=()
          if [ -n "${QUARTER_INPUT:-}" ]; then
            if ! printf '%s' "$QUARTER_INPUT" | grep -Eq '^[0-9]{4}Q[1-4]$'; then echo "::error::quarter 형식"; exit 2; fi
            Q=(--quarter "$QUARTER_INPUT")
          fi
          python3 build_dicts.py --write
          python3 kdef_universe.py --write
          python3 kdef_contracts.py --collect
          python3 kdef_contracts.py --build
          # 체계업체는 8분기(잔고 추이), 나머지는 최근 2분기(부문매출·주요고객)면 충분하다.
          PRIMES=$(python3 -c "import json;print(','.join(r['stock'] for r in json.load(open('assets/universe.json'))['rows'] if r['role']=='prime'))")
          REST=$(python3 -c "import json;print(','.join(r['stock'] for r in json.load(open('assets/universe.json'))['rows'] if r['role']!='prime'))")
          python3 kdef_reports.py --collect --n 8 --only "$PRIMES" "${Q[@]}"
          python3 kdef_reports.py --collect --n 2 --only "$REST" "${Q[@]}"
          python3 kdef_reports.py --build --n 8 "${Q[@]}"
          # 계약 진행(XI-1) — 반기·사업보고서 「공시내용 진행 및 변경사항」(공용 층 kce/tools/xi1_sector.py). 원장(contracts.json)
          # build 뒤·페이지 생성 앞. 모자란 (회사, 반기)만 받고(최신 반기의 보고서 없음·절 없음은 매번 다시) 머리행 지도에 role xi 로
          # 남긴다 — 그래서 kdef_headers --write 앞이다. 실패해도 페이지는 직전 progress.json 으로 만든다(경고만, 빌드 실패 아님).
          if ! python3 ../../kce/tools/xi1_sector.py kdef --collect --build; then
            echo "::warning::XI-1 계약 진행 수집·빌드 실패 — 직전 progress.json 으로 페이지를 만든다"
          fi
          python3 -c "import json;s=json.load(open('assets/xi1/progress.json'))['sector'];print(' · XI-1 %d건(확정 %d·추정 %d·지연 %d)'%(s['n'],s['linkA'],s['linkB'],s['lag']))" \
            > "$RUNNER_TEMP/xi1_line.txt" 2>/dev/null || : > "$RUNNER_TEMP/xi1_line.txt"
          { echo "### 계약 진행(XI-1)"; cat "$RUNNER_TEMP/xi1_line.txt"; } >> "$GITHUB_STEP_SUMMARY" || true
          # 머리행 지도 — 캐시 원문 표 재생(DART 0). 증분: 지도에 없는 (회사, 분기)만. 신규 편입 회사는
          # kdef_universe --write 가 큐(new_company)에 올렸고 위 REST 수집이 그 회사를 받았다.
          python3 kdef_headers.py --write
          python3 kdef_products.py --collect "${Q[@]}"  # 새 접수번호의 「주요 제품」 절 갱신
          python3 kdef_suppliers.py --build
          python3 kdef_page.py --all
          python3 kdef_parts.py
      - name: Tests (after)
        run: |
          cd argus/kdef/tools && python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check || true
      # 머리행 지도 수치 — 직전 커밋(HEAD) 대비. 사람이 봐야 하는 건(새 미지 열·회귀) Step Summary 와 커밋 메시지에
      # 바로 보여야 한다(scan-kship 의 '산출물 실측 수치를 메시지에' 관례). 보고 파일은 커밋하지 않는다(RUNNER_TEMP).
      - name: Header map summary
        id: hdr
        if: always()
        shell: bash
        working-directory: argus/kdef/tools
        run: |
          git show HEAD:argus/kdef/tools/assets/hdr_queue.json > "$RUNNER_TEMP/hdr_q0.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/hdr_q0.json"
          git show HEAD:argus/kdef/tools/assets/hdrmap.json > "$RUNNER_TEMP/hdr_m0.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/hdr_m0.json"
          python3 kdef_headers.py --summary --base-queue "$RUNNER_TEMP/hdr_q0.json" --base-map "$RUNNER_TEMP/hdr_m0.json" \
            --line-out "$RUNNER_TEMP/hdr_line.txt" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::머리행 요약 실패"
      - name: Commit
        shell: bash
        run: |
          git config user.name "kdef-bot"
          git config user.email "kdef-bot@users.noreply.github.com"
          git reset -q -- '*.pyc' '**/__pycache__/**' 2>/dev/null || true
          if [ -z "$(git status --porcelain -- argus/kdef)" ]; then
            echo "변경 없음"; exit 0
          fi
          HDR="$(cat "$RUNNER_TEMP/hdr_line.txt" 2>/dev/null || true)"
          XI1="$(cat "$RUNNER_TEMP/xi1_line.txt" 2>/dev/null || true)"
          git add -- argus/kdef
          git commit -m "kdef: 자동 갱신 $(date -u +%Y-%m-%d) (계약공시·정기보고서·부품 연결)${XI1}${HDR}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if build errored
        if: always() && steps.build.outcome == 'failure'
        run: |
          echo "::error::수집·생성 단계 실패 — 성공한 산출물은 커밋됐다. 로그를 확인하라"
          exit 1
      # 회귀만 빨강(설계 A·G) — 직전 분기에 채택 표가 있던 (회사, 역할)이 이번 분기에 채택 없이 미지로 바뀜,
      # 체계업체 수주표 채택 소실. 신규사 open·B 항목 증가는 경고(요약)로만 남는다. 산출물은 위에서 이미 커밋됐다.
      - name: Fail if header regression
        if: always() && steps.build.outcome == 'success'
        working-directory: argus/kdef/tools
        run: |
          if ! python3 kdef_headers.py --check > "$RUNNER_TEMP/hdr_check.json"; then
            cat "$RUNNER_TEMP/hdr_check.json"
            echo "::error::머리행 회귀 — 직전 분기에 읽히던 표가 이번 분기에 미지로 바뀌었다(argus/kdef/headers.html · assets/hdr_queue.json)"
            exit 1
          fi
