name: scan-kship (모집단 확장 탐색, 주 1회)

# 기자재 어휘에 걸리는 상장사 ~230곳의 정기보고서 본문을 읽어 조선 공급망 여부를 판정한다(약 1시간).
# 승격분은 assets/universe_probe.json 에 남고, 다음 update-kship 이 '탐색' 출처로 모집단에 넣는다.
on:
  schedule:
    - cron: "0 17 * * 6"        # 매주 일요일 02:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kship-dart            # update-kship 과 같은 그룹 — DART 는 IP 당 프로세스 하나
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 탐색
        working-directory: argus/kship/tools
        run: python3 kship_scan.py --scan
      - name: 모집단 재생성 · 기자재 빌드 · 페이지
        working-directory: argus/kship/tools
        run: |
          python3 kship_universe.py --write
          python3 kship_suppliers.py --collect
          python3 kship_suppliers.py --build
          python3 build_dicts.py
          python3 -m unittest discover -s tests
          python3 kship_page.py --all
          python3 kship_parts.py --all
      - name: 커밋
        run: |
          git config user.name "kship-bot"
          git config user.email "kship-bot@users.noreply.github.com"
          git add -A -- argus/kship
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "kship: 모집단 탐색 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
