name: Update official TGA flow-event context

on:
  workflow_dispatch:
  schedule:
    # Weekly after U.S. business hours. The year-specific IRS calendar and
    # Treasury refunding statement are stable primary-source inputs.
    - cron: "37 23 * * 1"

permissions:
  contents: write

concurrency:
  group: official-tga-flow-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the official-source collector
        run: >-
          python3 -m unittest discover
          -s tools/tga-flow-events/tests
          -p 'test_*.py' -v

      - name: Refresh normalized event context
        run: >-
          python3 tools/tga-flow-events/update_tga_flow_events.py
          --output data/tga-flow-events/current.json

      - name: Validate publication and browser contracts
        run: |
          python3 -m unittest discover -s tools/tga-flow-events/tests -p 'test_*.py' -v
          node --check panoptes/tga_flow_events.js
          node tools/tga-flow-events/tests/verify_frontend_contract.mjs data/tga-flow-events/current.json
          git diff --check

      - name: Detect normalized data change
        id: normalized
        shell: bash
        run: |
          if git diff --quiet -- data/tga-flow-events/current.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit official normalized data
        if: steps.normalized.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "phalanx-tga-events-bot"
          git config user.email "phalanx-tga-events-bot@users.noreply.github.com"
          git add -- data/tga-flow-events/current.json
          git commit -m "data: update official TGA flow-event context"
          git pull --rebase origin main
          git push origin HEAD:main
