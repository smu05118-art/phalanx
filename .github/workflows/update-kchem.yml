# 한국화학(argus/kchem) 일일 재조립.
#
# 이 탭은 네트워크·DART·API 키를 쓰지 않는다. 입력은 맥미니 ARGUS 빌더가 커밋하는 산출물
# (argus/data/argus_data.js · chunk_*.js · connections.js · argus/data_map.js) 뿐이고, 그것을 읽기 전용으로
# 파싱해 화학 스프레드 레지스트리와 페이지를 다시 만든다. 빌드 시각을 기록하지 않으므로 입력이 같으면
# 산출물 바이트가 같고 → 커밋이 생기지 않는다(fingerprint.json 으로 확인).
# 스케줄은 맥미니 argus 크론(07:40 KST) 이 밀어 넣은 뒤, kce(10:00 KST) 앞 — 09:10 KST.
# concurrency 그룹은 COMMON.md §3 대로 kship-dart 를 공유한다(DART 단계는 아직 없지만 R7·R28 이 예정).
name: update-kchem
on:
  schedule:
    - cron: "10 0 * * *"          # 09:10 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kship-dart
  queue: max  # Preserve every waiting industry refresh (up to 100).
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (before)
        run: cd argus/kchem/tools && python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build (입력 검증 → 레지스트리 → 페이지, 네트워크 없음)
        id: build
        shell: bash
        working-directory: argus/kchem/tools
        run: |
          set -o pipefail
          python3 kchem_page.py
      - name: Tests (after)
        run: |
          cd argus/kchem/tools && python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check || true
      - name: Commit
        shell: bash
        run: |
          git config user.name "kchem-bot"
          git config user.email "kchem-bot@users.noreply.github.com"
          git add -A -- argus/kchem
          if git diff --cached --quiet; then
            echo "변경 없음(입력 fingerprint 동일)"; exit 0
          fi
          git diff --cached --stat | tail -3
          FP="$(python3 -c 'import json;print(json.load(open("argus/kchem/tools/assets/fingerprint.json"))["fingerprint"][:12])')"
          ASOF="$(python3 -c 'import json;print(json.load(open("argus/kchem/tools/assets/fingerprint.json"))["argus_asof"])')"
          git commit -m "kchem: 재조립 (ARGUS asof ${ASOF} · 입력 ${FP})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report
        if: always()
        shell: bash
        run: |
          {
            echo "### 한국화학 재조립 결과"
            python3 - <<'PY'
          import json
          try:
              r = json.load(open("argus/kchem/tools/assets/registry.json", encoding="utf-8"))
              s = r["summary"]
              print("- asof %s · 시리즈 %d · 재현 %d/%d · 파생 %d · 원장 정지 %s주 · 입력 %s" % (
                  r["argus_asof"], s["rows"], s["reproduced"], s["spreads"], s["derived_ok"], s["ledger_stale_weeks"], r["fingerprint"][:12]))
              print("- 플래그 %s" % s["flags"])
          except Exception as e:
              print("- registry.json 없음: %s" % e)
          PY
          } >> "$GITHUB_STEP_SUMMARY"
