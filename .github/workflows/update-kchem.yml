# 한국화학(argus/kchem) 일일 재조립.
#
# 이 탭은 네트워크·DART·API 키를 쓰지 않는다. 입력은 맥미니 ARGUS 빌더가 커밋하는 산출물
# (argus/data/argus_data.js · chunk_*.js · connections.js · argus/data_map.js) 뿐이고, 그것을 읽기 전용으로
# 파싱해 화학 스프레드 레지스트리와 페이지를 다시 만든다. 빌드 시각을 기록하지 않으므로 입력이 같으면 산출물 바이트가 같다.
# 커밋 게이트: 허브는 asof/built 를 매일 다시 쓰므로 파일 지문은 매일 바뀐다 — 그래서 '화학 내용 지문'(이 탭이 실제로 읽는 내용만)
# 이 바뀌었거나 평가 주차가 바뀐 경우에만 커밋한다(2026-10 리뷰 #11, `kchem_page.py --gate`).
# 트리거: 허브 산출물이 푸시되면 즉시(argus/data/** · data_map.js) + 09:10 KST 백업 크론. 봇 자신의 커밋은 GITHUB_TOKEN 이라
# 워크플로를 다시 띄우지 않는다(GitHub 규칙).
# concurrency 그룹은 COMMON.md §3 대로 kship-dart 를 공유한다(DART 단계는 아직 없지만 R7·R28 이 예정).
name: update-kchem
on:
  push:
    branches: [main]
    paths:
      - "argus/data/argus_data.js"
      - "argus/data/connections.js"
      - "argus/data/chunk_*.js"
      - "argus/data_map.js"
      - "argus/kchem/tools/*.py"
      - "argus/kchem/tools/tests/**"
      - "argus/kchem/tools/assets/aliases.json"
      - "argus/kchem/tools/assets/supplement_map.json"
      - "argus/kchem/tools/assets/supplement/**"          # 사용자 가격표(kchem_supplement --import) 갱신 → 즉시 재조립
      - ".github/workflows/update-kchem.yml"
  schedule:
    - cron: "10 0 * * *"          # 09:10 KST 백업
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kship-dart
  queue: max  # Preserve every waiting industry refresh (up to 100).
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 산출물 fingerprint는 아래 빌드 후 검사한다. 최신 입력을 받기 전의
      # registry와 먼저 비교하면 정상적인 새 입력도 수집 전에 막힌다.
      - name: Tests (before — parser and input contracts)
        run: cd argus/kchem/tools && python3 -m unittest discover -s tests -p 'test_kchem.py'
      - name: Build (입력 검증 → 레지스트리 → 페이지, 네트워크 없음)
        id: build
        shell: bash
        working-directory: argus/kchem/tools
        run: |
          set -o pipefail
          python3 kchem_page.py
      - name: Tests (after)
        run: |
          cd argus/kchem/tools && python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check || true
      - name: Idempotency (다시 만든 산출물 = 디스크, 바이트 동일)
        working-directory: argus/kchem/tools
        run: python3 kchem_page.py --check
      - name: Commit gate (화학 내용 지문·평가 주차)
        id: gate
        shell: bash
        run: |
          git show HEAD:argus/kchem/tools/assets/fingerprint.json > "$RUNNER_TEMP/old_fp.json" 2>/dev/null || : > "$RUNNER_TEMP/old_fp.json"
          decision="$(cd argus/kchem/tools && python3 kchem_page.py --gate "$RUNNER_TEMP/old_fp.json")"
          echo "$decision"
          case "$decision" in commit*) echo "commit=1" >> "$GITHUB_OUTPUT" ;; *) echo "commit=0" >> "$GITHUB_OUTPUT" ;; esac
      - name: Commit
        if: steps.gate.outputs.commit == '1'
        shell: bash
        run: |
          git config user.name "kchem-bot"
          git config user.email "kchem-bot@users.noreply.github.com"
          git add -A -- argus/kchem
          if git diff --cached --quiet; then
            echo "변경 없음(입력 fingerprint 동일)"; exit 0
          fi
          git diff --cached --stat | tail -3
          FP="$(python3 -c 'import json;print(json.load(open("argus/kchem/tools/assets/fingerprint.json"))["fingerprint"][:12])')"
          ASOF="$(python3 -c 'import json;print(json.load(open("argus/kchem/tools/assets/fingerprint.json"))["argus_asof"])')"
          git commit -m "kchem: 재조립 (ARGUS asof ${ASOF} · 입력 ${FP})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report
        if: always()
        shell: bash
        run: |
          {
            echo "### 한국화학 재조립 결과"
            python3 - <<'PY'
          import json
          try:
              r = json.load(open("argus/kchem/tools/assets/registry.json", encoding="utf-8"))
              s = r["summary"]
              ed = s.get("editions") or {}
              print("- asof %s · 시리즈 %d · 재현 %d/%d(정확 %s) · 고유 %s · 파생 %d · 원장 정지 %s주 · 편집 누락 %s · 프록시 방향 %s/%s · 입력 %s" % (
                  r["argus_asof"], s["rows"], s["reproduced"], s["spreads"], (s.get("grades") or {}).get("exact"), s.get("unique_spreads"),
                  s["derived_ok"], s["ledger_stale_weeks"], ed.get("missing"), s.get("proxies_gated"), s.get("proxies"), r["fingerprint"][:12]))
              print("- 플래그 %s" % s["flags"])
          except Exception as e:
              print("- registry.json 없음: %s" % e)
          PY
          } >> "$GITHUB_STEP_SUMMARY"
