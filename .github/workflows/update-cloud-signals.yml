name: Update cloud signal ledger
on:
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * *'
permissions:
  contents: write
concurrency:
  group: cloud-signals-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify contracts
        run: |
          python3 -m unittest discover -s tools/cloud_signals/tests -v
          node --check ui/cloud_signals.js
          node --test ui/tests/cloud_signals.test.cjs
      - name: Snapshot published Phalanx datasets
        run: |
          python3 tools/cloud_signals/build.py
          node tools/cloud_signals/export_ensemble.cjs
          git diff --check
      - name: Commit only this ledger
        shell: bash
        run: |
          if git diff --quiet -- data/cloud_signals/ledger.json data/cloud_signals/ensemble.json; then exit 0; fi
          git config user.name 'phalanx-cloud-signals-bot'
          git config user.email 'phalanx-cloud-signals-bot@users.noreply.github.com'
          git add -- data/cloud_signals/ledger.json data/cloud_signals/ensemble.json
          git commit -m 'data: refresh cloud observations and ensemble'
          git pull --rebase origin main
          # Recompute against any builder updates received during the run.
          python3 tools/cloud_signals/build.py
          node tools/cloud_signals/export_ensemble.cjs
          git add -- data/cloud_signals/ledger.json data/cloud_signals/ensemble.json
          if ! git diff --cached --quiet; then git commit -m 'data: reconcile cloud ledger after builder update'; fi
          git push origin HEAD:main
