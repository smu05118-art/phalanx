<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>삼성E&A 현장별 데이터</title>
<script src="../vendor/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1116;--pn:#171a21;--pn2:#1e222b;--ln:#2a2f3a;--tx:#e6e8ec;--tx2:#98a1b0;--tx3:#5d6675;
--a:#60a5fa;--cmp:#3b82f6;--bal:#3f4b5f;--pr:#f59e0b;--sep:#22c55e;--con:#a78bfa;--ub:#ef4444;--rc:#14b8a6;--fc:#f472b6;--mn:#22d3ee;--evc:#facc15;--fe:#c084fc;
--pinb:#1a2029;--pinh:#212a34;--pinl:#2a7d72;
--axl:92px;--axr:58px;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:13px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;height:100vh;overflow:hidden}
.wrap{display:grid;grid-template-columns:minmax(208px,16%) 44% 40%;height:100vh}
.side{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.side h1{font-size:14px;padding:13px 14px 8px;font-weight:600;letter-spacing:-.2px}
.side h1 span{display:block;font-size:10.5px;color:var(--tx2);font-weight:400;margin-top:3px}
.ctl{padding:0 18px 8px;display:flex;flex-direction:column;gap:6px}
input[type=search]{width:100%;background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:6px 9px;color:var(--tx);font-size:12.5px;outline:none}
input[type=search]:focus{border-color:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--pn2);border:1px solid var(--ln);border-radius:20px;padding:2px 8px;font-size:10.5px;color:var(--tx2);cursor:pointer;user-select:none}
.chip.on{background:var(--a);border-color:var(--a);color:#0b1020;font-weight:600}
.lgd{font-size:10px;color:var(--tx3);padding:0 18px 5px;display:flex;justify-content:space-between}
/* 변경 이력 — II-4/III-8/XI-1 세 표를 한 섹션에 쌓을 때의 구분 */
.evb+.evb{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.evt{font-size:11px;font-weight:600;color:var(--tx2);margin:0 0 6px}
.evn{font-weight:400;color:var(--tx3)}
.cnt{font-size:10.5px;color:var(--tx2);padding:0 18px 5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* 그룹 전체 열기/닫기 — 그룹이 15개라 하나씩 누르면 번거롭다(사용자 요청) */
.gall{flex:none;background:var(--pn2);border:1px solid var(--ln);border-radius:5px;
 padding:2px 8px;font-size:10px;color:var(--tx2);cursor:pointer;white-space:nowrap;user-select:none}
.gall:hover{color:var(--a);border-color:var(--a)}
.list{flex:1;overflow-y:auto;padding:0 6px 10px}
.it{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center;padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;line-height:1.35}
/* 사업장 코드(별 ↔ 회사명 사이). HDC-*는 II-4 수주목록 기반, P8-*는 III-8에만 등장한 사업장 */
.it .cid{font-size:9.5px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.2px}
.it.on .cid{color:var(--tx2)}
.it:hover{background:var(--pn2)}
.it.on{background:#1d2b45;border-color:var(--a)}
/* list_pin으로 한 공시 밑에 모아 둔 묶음. 나열 순서만으로는 왜 여기 모여 있는지 안 보여서
   한 덩어리로 칠한다. 선택(.on)과 색 계열을 달리해 겹쳐 보이지 않게 하고, 선택된 행에서도
   왼쪽 레일은 남겨 묶음 소속이 유지되게 한다. 위아래 끝만 모서리를 둥글려 블록으로 읽힌다. */
.it.pin{box-shadow:inset 2px 0 0 var(--pinl);border-radius:0}
.it.pin:not(.on){background:var(--pinb)}
.it.pin:not(.on):hover{background:var(--pinh)}
.it.pin.pt{border-top-left-radius:5px;border-top-right-radius:5px}
.it.pin.pb{border-bottom-left-radius:5px;border-bottom-right-radius:5px}
.it .t{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t b{color:var(--tx2);font-weight:400}
.star{font-size:13px;color:#3a4150;cursor:pointer;user-select:none;line-height:1;padding:1px 2px}
.star:hover{color:#f5c518}
.star.on{color:#f5c518}
.hd h2 .hstar{font-size:16px;margin-right:6px;vertical-align:1px}
/* 공기 격차 배지 — 완공예정일 개정판마다 하나씩, 화살표로 잇는다 */
.gaps .sep{color:var(--tx3);margin:0 5px}
.grp{position:sticky;top:0;background:var(--pn2);color:var(--tx2);font-size:10px;font-weight:600;
 padding:4px 8px;letter-spacing:.2px;border-bottom:1px solid var(--ln);border-top:1px solid var(--ln);z-index:1;
 cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px}
.grp:hover{color:var(--tx)}
.grp .gt{display:inline-block;width:8px;color:var(--tx3);font-size:9px}
.grp:hover .gt{color:var(--a)}
.grp.col{color:var(--tx3)}
.grp:first-child{border-top:none}
.flags{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:2.5px;white-space:nowrap}
.f1{color:var(--cmp)}.f2{color:var(--sep)}.f3{color:var(--pr)}.fx{color:#3a4150}
.mid{padding:14px 16px;overflow-y:auto;min-height:0;border-right:1px solid var(--ln)}
.main{padding:16px 20px;overflow-y:auto;min-height:0}
.hd h2{font-size:18px;font-weight:600;letter-spacing:-.3px}
.hd .sub{color:var(--tx2);font-size:12px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.warn{margin-top:8px;padding:7px 10px;background:#3a2a10;border:1px solid #7a5a1a;border-radius:6px;color:#f5c469;font-size:11.5px;line-height:1.5}
.sec{background:var(--pn);border:1px solid var(--ln);border-radius:10px;margin-top:14px;overflow:hidden}
.sec>h3{font-size:12.5px;padding:9px 14px;background:var(--pn2);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px}
.sec>h3 .bd{width:3px;height:13px;border-radius:2px}
.sec>h3 small{color:var(--tx2);font-weight:400;font-size:11px}
.sec .bd2{padding:12px 14px}
.cw{position:relative;height:280px}
.cw.sm{height:180px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.k{background:var(--pn2);border:1px solid var(--ln);border-radius:7px;padding:8px 10px}
.k .l{font-size:10px;color:var(--tx2);margin-bottom:2px}
.k .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
/* 차트 x축과 열이 세로로 정렬되는 표 */
table.grid{table-layout:fixed;width:100%;border-collapse:collapse;font-size:10.5px}
table.grid th,table.grid td{padding:3px 2px;border-bottom:1px solid var(--ln);text-align:center;
 font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.grid th:first-child,table.grid td:first-child{text-align:left;padding-left:6px;color:var(--tx2)}
table.grid thead th{color:var(--tx2);font-weight:500;background:var(--pn2)}
table.grid td.na{color:#454c59}
table.grid th.yb,table.grid td.yb{border-left:1px dashed #586074}
.tw{margin-top:8px}
.tw .cap{font-size:10.5px;color:var(--tx2);margin:8px 0 3px;padding-left:2px;display:flex;gap:6px;align-items:center}
.tw .cap i{width:3px;height:10px;border-radius:2px;display:inline-block}
/* 주석(※ 설명)은 제목 우측 '주석' 버튼 → 팝업으로. 상시 노출은 화면을 너무 많이 쓴다 */
.notebtn{margin-left:auto;flex:0 0 auto;background:var(--pn2);border:1px solid var(--ln);border-radius:5px;
 color:var(--tx2);font-size:10px;padding:2px 8px;cursor:pointer;font-family:inherit;line-height:1.6}
.notebtn:hover{border-color:var(--a);color:var(--a)}
.nmask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;
 align-items:center;justify-content:center;padding:24px}
.nmask.on{display:flex}
.nmodal{background:var(--pn);border:1px solid var(--ln);border-radius:10px;max-width:900px;width:100%;
 max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.nmhd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);font-size:12.5px}
.nmhd b{flex:1;min-width:0}
.nmx{cursor:pointer;color:var(--tx2);font-size:14px;padding:0 4px}
.nmx:hover{color:var(--tx)}
.nmbd{padding:12px 16px;overflow:auto;font-size:11.5px;line-height:1.75;color:var(--tx2)}
.nmbd .nsep{border:0;border-top:1px solid var(--ln);margin:10px 0}
/* 주석 팝업 안의 대조표(III-8 별도 vs 연결 표기 차이) */
.nmbd .ntab{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px}
.nmbd .ntab th,.nmbd .ntab td{border:1px solid var(--ln);padding:4px 7px;text-align:left;vertical-align:top}
.nmbd .ntab th{background:var(--pn2);color:var(--tx2);font-weight:600;white-space:nowrap}
.sec.sum{margin-top:14px}
.mid>.sec.sum:first-child{margin-top:0}
.sec.sum tr.hi td{background:#1d2b45}
.sec.sum tr.tot td{font-weight:700;border-top:1px solid #3a4150;background:#1a1e26}
.sec.sum tr.sub td{color:var(--tx3);font-size:11.5px}
.sec.sum tr.sub td:first-child{padding-left:14px}
.sec.sum tr.nt td{color:var(--tx2)}
.sec.sum tr.nt td:first-child,.sec.sum tr.cs td:first-child{color:var(--tx2)}
.sec.sum tr.cs td{color:var(--a);background:#161d2b}
.sec.sum td.wr{color:#f87171}
.sec.sum td.fl,table.grid td.fl{outline:1px dashed var(--sep);outline-offset:-2px;border-radius:2px}
table.grid td.fli{outline:1px dashed var(--pr);outline-offset:-2px;border-radius:2px}
table.grid td.flx,.sec.sum td.flx{outline:1px dashed var(--mn);outline-offset:-2px;border-radius:2px}
table.grid tr.calc td{font-style:italic;color:var(--tx2)}
table.grid tr.calc td:first-child{color:var(--tx3)}
table.grid td.ffc{outline:1px dashed var(--fc);outline-offset:-2px;border-radius:2px}
table.grid td.fm{outline:1px solid var(--mn);outline-offset:-2px;border-radius:2px}
table.grid td.evc{outline:1px dashed var(--evc);outline-offset:-2px;border-radius:2px;background:rgba(250,204,21,.10)}
table.grid td.fe{outline:1px dashed var(--fe);outline-offset:-2px;border-radius:2px;background:rgba(192,132,252,.10)}
table.grid th.hf{color:var(--fc);font-weight:600}
/* 좌상단 칸에 넣는 표 이름 — 분기 헤더보다 눈에 띄게 굵고 밝게 */
table.grid th.hc{font-weight:700;color:var(--tx1)}
.none{color:var(--tx3);font-size:12px;padding:16px;text-align:center;font-style:italic}
tr.rp td:first-child{color:#7dd3fc}

/* 관계사(특수관계자) 발주 사업장 — index·matrix·trace 공용 (scripts/site_style.py) */
.it.rps{background:rgba(125,211,252,.07);box-shadow:inset 2px 0 0 #7dd3fc}
.it.rps.on{background:rgba(125,211,252,.16)}
/* .it은 4열 그리드(별·코드·이름·플래그)다. 배지는 다섯 번째 자식이라 열을 늘려 주지 않으면
   다음 줄로 밀려 목록 전체가 두 줄이 된다. 배지 열은 auto — 관계사 이름 폭만큼만 쓴다.
   matrix는 이 규칙을 `td.lbl .it`(특이도 0,2,1)로 두고 있어 `.it.rps`(0,2,0)가 진다.
   그래서 두 선택자를 함께 적는다 — 한쪽만 두면 matrix에서만 두 줄로 밀린다(사용자 지적). */
.it.rps,td.lbl .it.rps{grid-template-columns:auto auto auto 1fr auto}
tr.rps td.cn{box-shadow:inset 2px 0 0 #7dd3fc;background:rgba(125,211,252,.06)}
/* line-height는 테두리 2px을 포함해 다른 행과 같은 높이가 되게 잡는다 — matrix는 행 높이가
   촘촘해 배지가 1px만 높아도 행마다 높이가 들쭉날쭉해진다(브라우저 실측 16px vs 15px). */
.rpb{padding:0 4px;border-radius:3px;font-size:9.5px;line-height:12px;color:#7dd3fc;
 background:rgba(125,211,252,.12);border:1px solid rgba(125,211,252,.35);white-space:nowrap}
/* 즐겨찾기 별표 — 세 페이지 공통 */
.star{font-size:13px;color:#3a4150;cursor:pointer;user-select:none;line-height:1;padding:1px 2px}
.star:hover{color:#f5c518}
.star.on{color:#f5c518}

/* ── 세 페이지 공통 타이포 위계 (사용자 지시 2026-08-31) ────────────────────────
   페이지마다 제목 14/15px · 본문 12.5/13px · 버튼 9.5/11.5px · 목록 명칭 11/11.5/12px로
   제각각이던 것을 한 벌로 묶는다. 여기 값만 고치면 세 페이지가 같이 바뀐다.
     제목 15px · 부제 12px · 본문 12px · 버튼 12px
     목록 코드 10px · 목록 명칭 12px · 목록 한 줄 20px
   페이지별 규칙이 특이도로 이기지 않게 선택자를 함께 적는다 — matrix의 `td.lbl .t`(0,2,1)를
   `td.lbl .it .t`(0,3,1)로 넘고, trace의 `td.cn .nm`은 같은 특이도라 뒤에 오는 이것이 이긴다. */
body{font-size:12px;line-height:1.5}
h1,.side h1,header h1{font-size:15px;font-weight:600;letter-spacing:-.2px}
h1 span,.side h1 span,header h1 span{font-size:12px;font-weight:400;margin-top:3px}
a.nav{font-size:12px;padding:5px 11px;border-radius:6px}

/* 목록 한 줄 20px — 세 페이지 동일(사용자 지정 2026-08-31).
   .it은 그리드라 height로 고정하고, 표(matrix·trace)는 세로 여백을 0으로 두고 칸 높이를 준다. */
.it{height:20px;line-height:1;align-items:center}
/* 분기매출의 목록은 표 칸 안에 있고 칸에 아래 테두리 1px이 붙는다 — 안쪽은 18px로 두어야
   테두리까지 합쳐 19px이 된다(칸의 height는 최소값이라 안쪽이 더 크면 그쪽이 이긴다). */
td.lbl .it{height:19px;line-height:1;align-items:center}
tbody td,tbody th{padding-top:0;padding-bottom:0;height:20px}
/* 분기매출은 칸마다 아래 테두리 1px이 붙어 그만큼 더 높아진다(border-collapse:separate라
   box-sizing이 먹지 않는다). 테두리를 포함해 19px이 되게 칸을 1px 낮춘다 — 브라우저 실측. */
tbody td.lbl,tbody td.lbl~td{height:19px}
/* 그룹 머리 행은 아래 테두리가 없어 1px 낮게 잡혔다 — 사업장 행과 같은 20px로 맞춘다. */
tbody tr.grp td{height:20px}
.it .cid,td.lbl .it .cid,td.cn .cd{font-size:10px}
.it .t,td.lbl .it .t,td.cn .nm{font-size:12px}

/* 페이지 여백 — 세 페이지의 제목이 **같은 자리**에서 시작하게 한다(좌 18px · 상 14px).
   이전에는 (14,13)·(18,12)·(22,18)로 제각각이었다. 원본위치확인은 여백이 body에 있어
   `body.pg`로 받는다 — 다른 두 페이지의 body에 여백이 붙지 않게 클래스로 막았다. */
.side h1{padding:14px 18px 8px}
header{padding:14px 18px}
body.pg{padding:14px 18px 28px}
/* 제목 아래 네비 줄까지 같은 자리에 오게 — 원본위치확인은 제목이 margin으로,
   현장별 데이터는 h1 padding-bottom으로 간격을 만든다. 4px 차이를 여기서 메운다. */
body.pg h1{margin:0 0 8px}

.note{font-size:10px;color:var(--tx3);margin-top:6px}
.empty{color:var(--tx2);text-align:center;padding:70px 20px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2f3542;border-radius:4px}
@media(max-width:1400px){.wrap{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.side{max-height:34vh}.mid{max-height:46vh;border-right:none;border-bottom:1px solid var(--ln)}}
</style></head><body>
<div class="wrap">
 <aside class="side">
  <h1>삼성E&A 현장별 데이터<span id="hdsub"></span></h1>
  <div style="padding:0 18px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:stretch">
   <a class="nav" href="../index.html" style="display:block;text-align:center;flex:1 1 calc(50% - 3px);min-width:0;overflow:hidden;text-overflow:ellipsis;background:var(--pn2);border:1px solid var(--ln);white-space:nowrap;color:var(--tx2);text-decoration:none">← 회사 선택</a>
   <a class="nav" href="../sea/matrix.html" style="display:block;text-align:center;flex:1 1 calc(50% - 3px);min-width:0;overflow:hidden;text-overflow:ellipsis;background:var(--pn2);border:1px solid var(--ln);white-space:nowrap;color:var(--a);text-decoration:none">→ 현장별 분기매출</a>
   <a class="nav" href="../sea/trace.html" style="display:block;text-align:center;flex:1 1 calc(50% - 3px);min-width:0;overflow:hidden;text-overflow:ellipsis;background:var(--pn2);border:1px solid var(--ln);white-space:nowrap;color:var(--a);text-decoration:none">→ 원본위치확인</a>
   <a class="nav" href="../sea/backtest.html" style="display:block;text-align:center;flex:1 1 calc(50% - 3px);min-width:0;overflow:hidden;text-overflow:ellipsis;background:var(--pn2);border:1px solid var(--ln);white-space:nowrap;color:var(--a);text-decoration:none">→ 예측 vs 실측</a>
  </div>
  <div class="ctl">
   <input type="search" id="q" placeholder="회사 · 프로젝트명 · 발주처 검색">
   <div class="chips" id="fe"></div>
   <div class="chips" id="ff"></div>
   <div class="chips" id="fb"></div>
  </div>
  <div class="lgd"><span>회사 · 프로젝트명</span><span>II-4 / III-8 / XI-1</span></div>
  <div class="cnt"><span id="cnt"></span><span class="gall" id="gall"></span></div>
  <div class="list" id="list"></div>
 </aside>
 <aside class="mid" id="mid"></aside>
 <main class="main" id="main"></main>
</div>
<div id="nmask" class="nmask"><div class="nmodal">
 <div class="nmhd"><b id="nmTitle"></b><span class="nmx" id="nmClose">✕</span></div>
 <div class="nmbd" id="nmBody"></div></div></div>
<script>

// ---- 실제 매출액(정기보고서 손익계산서 + 부문/지역 주석) ------------------------

// 자회사(현대엔지니어링) 연결매출이 따로 붙는 반면, 삼성E&A는 연결·별도 양쪽에
// 지역·부문이 다 있고 부문 체계가 2025Q4에 바뀐다.
function revHTML(){
 const CR=DATA.coRev, RC=REVCFG;
 if(!CR||!RC||!RC.rows||!RC.rows.length) return '';
 const S=CR.series||{}, SRC=CR.src||{}, SRCBY=CR.srcBy||{};
 // 값이 한 칸도 없는 계열은 줄을 만들지 않는다 — 회사마다 있는 계열이 달라
 // 설정에는 넉넉히 적어 두고 실제 데이터가 있는 것만 보여준다.
 const live=s=>S[s]&&S[s].some(v=>v!=null);
 const srcOf=(s,fq)=>(SRCBY[s]&&SRCBY[s][fq])||SRC[fq]||'';
 const rowHTML=(r)=>`<tr class="${r.sub?'sub':''}"><td>${esc(r.l)}</td>`+S[r.s].map((v,k)=>{
   if(v==null) return `<td class="na${YBF(k)}">–</td>`;
   return `<td class="${YBF(k).trim()}" title="${esc(srcOf(r.s,FQF[k]))}">${fmt(v)}</td>`;
  }).join('')+'<td></td></tr>';
 const b=RC.rows.filter(r=>live(r.s)).map(rowHTML).join('');
 if(!b) return '';
 // ---- 매출인식액(추정)/실제 매출액 비율. 분자(n)는 REV에서 고른다.
 const ENT=RC.ratio_entity;
 const pick=n=>{
   if(!REV||!ENT) return null;
   if(n==='total') return REV.rows&&REV.rows[ENT];
   if(n==='dom')   return REV.dom&&REV.dom[ENT];
   if(n==='ovs')   return REV.ovs&&REV.ovs[ENT];
   if(n&&n.slice(0,4)==='seg:') return REV.seg&&REV.seg[ENT]&&REV.seg[ENT][n.slice(4)];
   return null;};
 const fmtPct=v=>v==null?'–':v.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
 let ratioB='';
 (RC.ratio||[]).forEach(r=>{
   const num=pick(r.n), den=S[r.s];
   if(!num||!den) return;
   ratioB+=`<tr class="${r.sub?'sub':''}"><td>${esc(r.l)}</td>`+FQF.map((f,k)=>{
     const a=num[k], d=den[k];
     if(a==null||d==null||d===0) return `<td class="na${YBF(k)}">–</td>`;
     return `<td class="${YBF(k).trim()}">${fmtPct(a/d*100)}</td>`;
    }).join('')+'<td></td></tr>';
 });
 return `<section class="sec sum"><h3><i class="bd" style="background:var(--con)"></i>실제 매출액 <small>정기보고서 손익계산서 · 십억원</small></h3>
  <div class="bd2"><table class="grid">${COLS2}${HEADF}<tbody>${b}</tbody></table>
  <div class="note">${RC.note||''}</div>
  ${ratioB?`<div class="tw">
  <table class="grid">${COLS2}${headF('추정/실제')}<tbody>${ratioB}</tbody></table>
  <div class="note">${RC.ratio_note||''}</div></div>`:''}
  </div></section>`;}

// 폭에 따라 달라지므로 DOM 변경과 창 크기 변경 때마다 다시 훑는다(속성만 바꾸므로

function truncTitles(root){
 (root||document).querySelectorAll('td,th,.t,.gt').forEach(el=>{
  const mine=el.dataset.tt==='1';
  if(el.hasAttribute('title')&&!mine) return;
  if(el.scrollWidth>el.clientWidth+1){
   el.title=el.textContent.replace(/\s+/g,' ').trim(); el.dataset.tt='1';
  }else if(mine){ el.removeAttribute('title'); delete el.dataset.tt; }
 });
}

function foldNotes(root){
 root.querySelectorAll('section.sec').forEach(sec=>{
  const notes=[...sec.querySelectorAll('.note')];
  if(!notes.length) return;
  const html=notes.map(n=>n.innerHTML).join('<hr class="nsep">');
  notes.forEach(n=>n.remove());
  const h3=sec.querySelector('h3'); if(!h3) return;
  const ttl=h3.textContent.replace(/\s+/g,' ').trim();
  const b=document.createElement('button');
  b.className='notebtn'; b.type='button'; b.textContent='주석';
  b.title='이 섹션의 설명 주석 보기';
  b.addEventListener('click',e=>{e.stopPropagation(); openNote(ttl,html);});
  h3.appendChild(b);
 });
}

 let h=`<div class="hd"><h2><span class="star hstar${BM.has(s.id)?' on':''}" title="즐겨찾기 (다시 확인할 프로젝트 표시)">${BM.has(s.id)?'★':'☆'}</span>${esc(s.nm)}</h2><div class="sub">

   // 공기 격차 배지 — 마지막 실측 분기의 (실제 진행률 − 기준 공정률). 차트를 안 보고도
   // 지연 현장이 목록에서 걸러지도록 헤더에 박는다. 기준선이 없는 사업장은 표시하지 않는다.
   if(!s.s.prC) return '';

   // (사용자 지적). 실측이 아니면 배지에 ~ 를 붙여 구분한다. 예측 구간(fcst)은 제외한다 —

 // ===== II-4

 // XI-1 교차참조 검토 대기 배너 — 판단 재료(II-4 표·XI-1 진행 현황 표)가 이 화면에 이미

 const m=new Map();
 fields.forEach(f=>{const a=F[f]; if(!a) return; let prev=null;
  a.forEach((v,k)=>{ if(v==null) return;
   if(prev!=null&&String(v)!==String(prev.v)) m.set(FQF[k]+'|'+f,{o:prev.v});
   prev={v}; });});
 return m;}

   if(v==null) return `<td class="na${YBF(k)}">–</td>`;
   // 금액 열이라도 값이 문자열이면 그대로 쓴다 — XI-1 계약금액이 외화로 적힌 분기는
   // 환산하지 않고 원문 표기(「2,426,809,931 (USD)」)를 문자열로 싣기 때문이다.
   const amt=isAmt&&typeof v==='number';
   const disp=amt?fmt(Number(v)):esc(String(v));
   const e=chg.get(fq+'|'+f);
   const cls=YBF(k).trim()+(e?' evc':'');
   // 항상 원문 그대로의 전체 값을 title에 담아, 셀 폭이 좁아 말줄임(…)으로 잘린 텍스트도
   // 마우스를 올리면 전부 볼 수 있게 한다(사용자 요청). 변경 이벤트가 있으면 이전 값도 덧붙인다.
   const full=amt?fmt(Number(v))+' 백만원':String(v);
   const ttl=e?`변경됨 — 이전: ${amt&&typeof e.o==='number'?fmt(Number(e.o))+' 백만원':String(e.o)} → 현재: ${full}`:full;
   return `<td class="${cls}" title="${esc(ttl)}">${disp}</td>`;
  }).join('')+'<td></td></tr>';
 });
 return `${opt.facts||''}<table class="grid">${COLSF}${headF(opt&&opt.head)}<tbody>${body}</tbody></table>
  <div class="note">${opt.note||'※ 공시된 전 분기 실측값을 표시합니다(결측 분기는 –). 마지막 4개 분기(헤더 *)는 다른 표와 가로축을 맞추려고 늘린 열입니다 — 이 항목들은 공시 원문 기반이라 예측하지 않으므로 항상 빈 칸입니다.<br>※ 노란 점선 박스는 직전 실측 대비 값이 바뀐 시점입니다. 셀 글씨가 잘려 보이면(…) 마우스를 올려 전체 값을 확인하세요 — 변경된 셀은 이전 값도 함께 뜹니다. 우측 패널 차트와 나란히 보면 값이 튀는 시점의 원인(명칭·발주처·공기·도급액 변경)을 바로 확인할 수 있습니다.'}</div>`;}
// 변경 이력 = II-4 / III-8 / XI-1 세 표를 한 섹션에 위아래로 쌓는다(사용자 요청).
// 세 표 모두 FQF 축·열 폭이 같아 같은 분기가 세로로 정렬되므로, 어느 출처가 먼저 바뀌었는지
// 눈으로 바로 짚을 수 있다.
// 표 위 제목 줄은 두지 않는다 — 출처 이름을 각 표의 좌상단 칸(headF)에 적어 세로 공간을
// 아꼈다(사용자 요청). 블록 구분은 .evb+.evb의 윗선이 맡는다.
function evBlock(inner){
 return `<div class="evb">${inner}</div>`;}
// III-8은 별도/연결 두 기준으로 공시된다. 수주총액은 두 행으로 나눠 표에 그대로 두지만,
// 품목·발주처·계약일·공사기한까지 두 벌을 늘어놓으면 표가 배로 길어지고 읽기 어려워진다.
// 그래서 표에는 별도 기준만 싣고, 연결 쪽 표기가 다른 분기만 여기 모아 주석 팝업으로 뺀다
// (사용자 요청). .note는 foldNotes()가 자동으로 섹션 제목의 '주석' 버튼으로 걷어간다.
function p8NoteHTML(F){
 let h='※ 수주총액은 별도·연결을 각각 한 행으로 나눠 표시합니다 — 두 기준은 연결 자회사 몫이 포함되는지가 달라 금액이 크게 다를 수 있어, 한 행에 섞으면 기준이 바뀌는 분기의 증감이 실제 변동처럼 보입니다.'
      +'<br>※ 품목·발주처·계약일·공사기한은 <b>별도 기준</b>을 표시합니다(그 분기에 별도 공시가 없으면 연결 값으로 채웁니다).'
      +'<br>※ 노란 점선 박스는 직전 공시 분기 대비 값이 바뀐 시점입니다.';
 if((F._dropQ||[]).length) h+='<br>※ 별도와 연결이 <b>완전히 같은 값</b>으로 실린 분기는 연결 차트를 그리지 않습니다 — 두 기준이 서로 다른 범위를 보여주는 것이 아니라, 그 계약에 연결·별도 양쪽 모두 표기 의무가 있어 같은 내용이 두 번 공시된 것이라, 똑같은 그림이 두 장 나오지 않게 한 것입니다. <b>표의 수주총액(연결) 행에는 원문 값이 그대로 남습니다</b>(비어 있으면 그 분기에는 연결 공시가 애초에 없던 것입니다). 판정은 <b>분기(사업보고서) 단위</b>라 값이 다른 분기의 연결 차트는 그대로 그립니다.';
 return h;}
// 현장별 특이사항은 주석 버튼 뒤에 숨기지 않고 표 위에 그대로 띄운다(사용자 지시 2026-08-28)
// — 주석은 '표를 어떻게 구성했나' 같은 개념 설명 자리이고, '이 사업장의 이 분기가 이렇다'는
// 눈에 보여야 판단에 쓰인다. 위 p8NoteHTML은 개념만, 아래는 이 사업장의 사실만 담는다.
function p8FactsHTML(F){
 const oc=F._onlyCon||[], fc=F._forced||[], d=F._diff||[];
 // 값이 100% 같아 생략한 분기는 아무것도 적지 않는다(사용자 지시 2026-08-28) — 설명할
 // 것이 없는 사실이라 줄만 잡아먹는다. 규칙 자체의 설명은 주석(p8NoteHTML)에 있다.
 // 여기에는 **왜 그런지 설명이 필요한 것만** 한 줄씩 적는다.
 const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1);
   return w+((c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28?a:b):a);};   // 받침 유무로 조사 선택
 const fqs=new Set(fc.map(x=>x.fq));
 const lines=[];
 fc.forEach(x=>{
  const ds=d.filter(y=>y.fq===x.fq);
  const what=ds.length?ds.map(y=>y.f).join('·'):'값';
  const sh=v=>(v==null||String(v).trim()==='')?'–':String(v);
  const val=ds.length?` (별도 ${ds.map(y=>sh(y.s)).join('·')} / 연결 ${ds.map(y=>sh(y.c)).join('·')})`:'';
  // 사유 문구는 오버라이드가 정한다(p8_overrides.csv의 reason). 비어 있으면 붙이지 않는다 —
  // 값 항목이 실제로 다른 건을 오타라고 단정하지 않기 위해서다.
  const why=(x.why||'').trim();
  // 분기 뒤 조사는 붙이지 않는다 — 'Q4은'처럼 숫자로 끝나 받침 판정이 안 된다.
  lines.push(`<b>${esc(x.fq)}</b> — ${esc(jo(what,'이','가'))} 다르지만 ${why?esc(why)+' ':''}연결 표기 생략${esc(val)}`);
 });
 if(oc.length) lines.push(`별도 공시가 없어 <b>연결 값으로 표시</b>한 분기 ${oc.length}개`
   +(oc.length<=6?` (${oc.map(esc).join(', ')})`:''));
 const dr=d.filter(x=>!fqs.has(x.fq));
 if(dr.length){
  const by=new Map();
  dr.forEach(x=>{const k=x.f+'|'+x.s+'|'+x.c; if(!by.has(k)) by.set(k,{...x,fqs:[]}); by.get(k).fqs.push(x.fq);});
  [...by.values()].forEach(x=>lines.push(
    `<b>${esc(x.fqs.join(', '))}</b> — ${esc(x.f)} 표기 차이 (별도 ${esc(String(x.s))} / 연결 ${esc(String(x.c))})`));
 }
 if(!lines.length) return '';
 return `<div class="warn" style="margin:0 0 10px">${lines.map(l=>'▣ '+l).join('<br>')}</div>`;}
function eventSectionHTML(){
 if(!cur) return '';
 return `<section class="sec sum"><h3><i class="bd" style="background:#64748b"></i>변경 이력 <small>${esc(cur.ent)} · ${esc(cur.nm)} · II-4 변경 ${cur.ev.length}건</small></h3>
  <div class="bd2">
  ${evBlock(evGridHTML(cur,{head:'II-4'}))}
  ${evBlock(cur.p8Full
     ? evGridHTML(cur,{head:'III-8',data:cur.p8Full,fields:P8FIELDS,note:p8NoteHTML(cur.p8Full),facts:p8FactsHTML(cur.p8Full)})
     : `<div class="none">III-8-라에 이 사업장 공시 없음</div>`)}
  ${evBlock(cur.xipFull
     ? evGridHTML(cur,{head:'XI-1',data:cur.xipFull,fields:XPFIELDS,
         note:'※ 「나. 진행 현황」의 분기별 공시값입니다(「가.」 공시 대장은 분기가 아니라 공시일 기준이라 이 축에 얹을 수 없어 아래 별도 표로 둡니다). 원문 열 제목은 「계약시작월/계약종료월」이지만 셀 값에는 일자까지 들어 있어(값이 있는 142건 전부 YYYY-MM-DD, 나머지는 원문이 공란) 자르지 않고 그대로 표시합니다.<br>※ 노란 점선 박스는 직전 공시 분기 대비 값이 바뀐 시점입니다.'})
     : `<div class="none">XI-1 진행 현황에 이 사업장 공시 없음</div>`)}
  </div></section>`;}
// ---- 키보드 탐색(사용자 요청): ↑/↓ 로 좌측 목록의 이전/다음 사업장으로 이동한다.
// 기준은 SITES 원본이 아니라 filtered() — 즉 지금 화면에 보이는 순서(검색·필터·즐겨찾기 반영)
// 그대로 움직인다. 선택이 목록 밖으로 나가면 스크롤을 따라 붙인다.
function moveSel(delta){
 const L=visible(); if(!L.length) return;
 // 위치는 객체 동일성으로 찾는다. 코드로 찾으면 같은 코드가 두 줄인 순간(레지스트리 충돌 등)
 // 항상 첫 줄을 가리켜 두 번째 줄에서 ↓를 눌러도 제자리로 돌아온다 — 목록이 그 지점에서
 // 막힌다. 코드 대조는 필터가 바뀌어 객체가 목록 밖으로 나갔을 때의 보조 수단으로만 쓴다.
 let i=cur?L.indexOf(cur):-1;
 if(i<0&&cur) i=L.findIndex(s=>s.id===cur.id);
 if(i<0) i = delta>0 ? -1 : L.length;   // 현재 선택이 필터 밖이면 방향에 맞춰 양 끝에서 시작
 const ni=Math.min(L.length-1,Math.max(0,i+delta));
 if(ni===i) return;                      // 목록 끝에서는 그대로(순환하지 않음)
 cur=L[ni]; render(); draw(cur);
 const el=document.querySelector('#list .it.on'); if(el) el.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey) return;
 if(document.getElementById('nmask').classList.contains('on')) return;  // 주석 팝업 중엔 무시
 const t=e.target, tag=((t&&t.tagName)||'').toLowerCase();
 // Space: 현재 선택 사업장의 즐겨찾기 토글(사용자 요청 — ↓로 내리다 Space로 체크, 다시 ↓).
 // 검색창을 포함한 모든 입력칸에서는 제외한다 — 검색어에 띄어쓰기를 쳐야 하기 때문.
 // (↑↓는 검색창에서도 목록 탐색으로 쓰지만 Space는 다르다.)
 if(e.key===' '){
  if(tag==='input'||tag==='textarea') return;
  if(!cur) return;
  e.preventDefault();                     // 기본 동작(페이지 스크롤) 방지
  toggleBM(cur.id);
  const el=document.querySelector('#list .it.on'); if(el) el.scrollIntoView({block:'nearest'});
  return;
 }
 if(e.key!=='ArrowDown'&&e.key!=='ArrowUp') return;
 // 검색창에서는 ↑↓가 캐럿 이동뿐이라 목록 탐색으로 쓴다(검색어 입력 → 화살표로 고르기).
 // 그 외 일반 입력칸이 생기면 기본 동작을 건드리지 않는다.
 if(tag==='textarea'||(tag==='input'&&t.type!=='search')) return;
 e.preventDefault();
 moveSel(e.key==='ArrowDown'?1:-1);
});
document.getElementById('q').oninput=render;
// 보고서 건수는 실측 분기 수에서 뽑는다 — 예전엔 22로 박아 놨는데, 참조 시작 분기를
// 2021Q4로 올렸을 때(fetch_dart.FQ_MIN) 기간만 바뀌고 건수가 그대로 남아 어긋났다.
document.getElementById('hdsub').textContent=FQ[0]+' – '+FQ[N-1]+' · 정기보고서 '+N+'건';
renderMid();
document.getElementById('main').innerHTML='<div class="empty">왼쪽에서 사업장을 선택하세요</div>';
render(); if(SITES.length){cur=SITES[0];render();draw(SITES[0]);}
// 렌더 환경에 이 API들이 없을 수 있다(Node vm 스모크 테스트). 없으면 툴팁만 안 붙고 넘어간다.
try{
 if(typeof MutationObserver!=='undefined')
  new MutationObserver(ttSoon).observe(document.body,{childList:true,subtree:true});
 if(typeof addEventListener==='function') addEventListener('resize',ttSoon);
 ttSoon();
}catch(e){}
