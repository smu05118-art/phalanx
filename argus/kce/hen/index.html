<!doctype html>

<html lang="ko"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>현대엔지니어링 현장별 데이터</title>

<script src="../vendor/chart.umd.min.js"></script>

<style>

:root{--bg:#0f1116;--pn:#171a21;--pn2:#1e222b;--ln:#2a2f3a;--tx:#e6e8ec;--tx2:#98a1b0;--tx3:#5d6675;

--a:#60a5fa;--cmp:#3b82f6;--bal:#3f4b5f;--pr:#f59e0b;--sep:#22c55e;--con:#a78bfa;--ub:#ef4444;--rc:#14b8a6;--fc:#f472b6;--mn:#22d3ee;--evc:#facc15;--fe:#c084fc;--xi:#8b5cf6;

--pinb:#1a2029;--pinh:#212a34;--pinl:#2a7d72;

--axl:92px;--axr:58px;}

*{box-sizing:border-box;margin:0;padding:0}

body{background:var(--bg);color:var(--tx);font:13px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;height:100vh;overflow:hidden}

.wrap{display:grid;grid-template-columns:24% minmax(0,1fr);height:100vh}

/* ② 노트북~FHD는 **2단**(목록+상세)이 기본이고 중단 총괄 패널은 토글로 편다(사용자 지시).

   FHD에서 3단을 유지하면 중단 표(25개 분기)가 표 폭 764px·칸당 25px로 눌려 글자를 10.5px

   위로 못 키운다. 편히 읽으려면 중단에만 1,010px이 필요한데 그러면 상세가 660px로 찌그러진다.

   1920px는 이 표를 3단 안에 담기에 폭이 모자란다 — 그래서 필요할 때만 편다.

   펼친 상태는 localStorage(encMid)에 남는다. WQHD(③)에서는 항상 펴 둔다. */

.mid{display:none}

/* 총괄표는 3단을 새로 여는 게 아니라 **오른쪽 칸에서 상세와 자리를 바꾼다**(사용자 지시).

   FHD에서 셋을 나란히 놓으면 총괄표(25개 분기)가 797px, 상세가 864px로 둘 다 눌린다.

   자리를 바꾸면 총괄표가 오른쪽 칸 전체(FHD 1,613px)를 받아 칸당 65px로 읽힌다. */

body.midon .mid{display:block}

body.midon .main{display:none}

.side{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}

.side h1{font-size:14px;padding:13px 14px 8px;font-weight:600;letter-spacing:-.2px}

.side h1 span{display:block;font-size:12px;color:var(--tx2);font-weight:400;margin-top:3px}

.ctl{padding:0 18px 8px;display:flex;flex-direction:column;gap:6px}

input[type=search]{width:100%;background:var(--pn2);border:1px solid var(--ln);border-radius:6px;height:26px;padding:0 9px;color:var(--tx);font-size:12px;outline:none;box-sizing:border-box}

input[type=search]:focus{border-color:var(--a)}

.chips{display:flex;flex-wrap:wrap;gap:4px}

.chip{background:var(--pn2);border:1px solid var(--ln);border-radius:20px;padding:2px 8px;font-size:12px;color:var(--tx2);cursor:pointer;user-select:none}

.chip.on{background:var(--a);border-color:var(--a);color:#0b1020;font-weight:600}

.lgd{font-size:12px;color:var(--tx3);padding:0 18px 5px;display:flex;justify-content:space-between}

/* 변경 이력 — II-4/III-8/XI-1 세 표를 한 섹션에 쌓을 때의 구분 */

.evb+.evb{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}

.evt{font-size:12px;font-weight:600;color:var(--tx2);margin:0 0 6px}

.evn{font-weight:400;color:var(--tx3)}

.cnt{font-size:12px;color:var(--tx2);padding:0 18px 5px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* 그룹 전체 열기/닫기 — 그룹이 15개라 하나씩 누르면 번거롭다(사용자 요청) */

.gall{flex:none;background:var(--pn2);border:1px solid var(--ln);border-radius:5px;

 padding:2px 8px;font-size:12px;color:var(--tx2);cursor:pointer;white-space:nowrap;user-select:none}

.gall:hover{color:var(--a);border-color:var(--a)}

.srow{display:contents}          /* 데스크톱: 래퍼가 없는 것처럼 동작 */

.gallm{display:none}             /* 모바일 전용 전체닫기 버튼 */

.list{flex:1;overflow-y:auto;padding:0 6px 10px}

/* 별표·플래그·코드·이름·출처플래그 다섯 열. 마커가 둘이라 앞에 auto가 둘이다. */

.it{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:5px;align-items:center;padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;line-height:1.35}

/* 사업장 코드(별 ↔ 회사명 사이). HDC-*는 II-4 수주목록 기반, P8-*는 III-8에만 등장한 사업장 */

.it .cid{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.2px}

.it.on .cid{color:var(--tx2)}

.it:hover{background:var(--pn2)}

.it.on{background:#1d2b45;border-color:var(--a)}

/* 묶음(.it.pin) 규칙은 scripts/site_style.py에 공용으로 있다. */

.it .t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.it .t b{color:var(--tx2);font-weight:400}

/* 별표·플래그는 얹히는 줄의 글자 크기를 따른다(사용자 지시 2026-09-03) —

   목록은 명칭 12px, 3단 헤더는 현장명 15px. */

.star{font-size:12px;color:#3a4150;cursor:pointer;user-select:none;line-height:1;padding:1px 2px}

.star:hover{color:#f5c518}

.star.on{color:#f5c518}

.hd h2 .hstar{font-size:15px;margin-right:2px;vertical-align:1px}

.hd h2 .hflag{font-size:15px;margin-right:6px;vertical-align:1px}

/* 공기 격차 배지 — 완공예정일 개정판마다 하나씩, 화살표로 잇는다 */

.gaps .sep{color:var(--tx3);margin:0 5px}

.grp{position:sticky;top:0;background:var(--pn2);color:var(--tx2);font-size:12px;font-weight:600;

 padding:4px 8px;letter-spacing:.2px;border-bottom:1px solid var(--ln);border-top:1px solid var(--ln);z-index:1;

 cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px}

.grp:hover{color:var(--tx)}

.grp .gt{display:inline-block;width:9px;color:var(--tx3);font-size:12px}

.grp:hover .gt{color:var(--a)}

.grp.col{color:var(--tx3)}

.grp:first-child{border-top:none}

.flags{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:2.5px;white-space:nowrap}

.f1{color:var(--cmp)}.f2{color:var(--sep)}.f3{color:var(--pr)}.fx{color:#3a4150}

.mid{padding:14px 16px;overflow-y:auto;min-height:0;border-right:1px solid var(--ln)}

.main{padding:16px 20px;overflow-y:auto;min-height:0}

/* 현장명은 1단 제목·matrix·trace와 같은 15px이다(사용자 지시 2026-09-03). 최초 구축 때

   18px로 두고 한 번도 조정하지 않아 「제목 15 · 부제 12 · 본문 12」 체계 밖에 혼자 있었다. */

.hd h2{font-size:15px;font-weight:600;letter-spacing:-.3px}

.hd .sub{color:var(--tx2);font-size:12px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}

.warn{margin-top:8px;padding:7px 10px;background:#3a2a10;border:1px solid #7a5a1a;border-radius:6px;color:#f5c469;font-size:12px;line-height:1.5}

.sec{background:var(--pn);border:1px solid var(--ln);border-radius:10px;margin-top:14px;overflow:hidden}

.sec>h3{font-size:12.5px;padding:9px 14px;background:var(--pn2);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px}

.sec>h3 .bd{width:3px;height:13px;border-radius:2px}

.sec>h3 small{color:var(--tx2);font-weight:400;font-size:12px}

.sec .bd2{padding:12px 14px}

/* 중단 패널 네 박스 접기(사용자 요청 2026-09-04) — 위 박스가 큰 회사에서 아래 박스를 보려면

   위를 닫을 수 있어야 한다. 제목 줄을 누르면 그 박스의 내용만 감춘다. */

.sec.sum>h3{cursor:pointer;user-select:none}

/* 접기 표식은 **주석 버튼 오른쪽**에 둔다. 둘 다 margin-left:auto면 앞엣것이 밀려나

   주석 버튼 위치가 섹션마다 달라진다(사용자 지적 2026-09-04). 주석이 종전대로 오른쪽

   끝을 잡고, 접기는 그 오른쪽에 고정폭으로 붙어 세로로 줄이 맞는다. */

.sec.sum>h3 .fold{color:var(--tx2);font-size:12px;flex:0 0 auto;min-width:56px;text-align:right;margin-left:8px}

.sec.sum>h3 .notebtn{margin-left:auto}

.sec.sum.col>.bd2,.sec.sum.col>.note,.sec.sum.col>div:not(:first-child){display:none}

.cw{position:relative;height:280px}

.cw.sm{height:180px}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}

.k{background:var(--pn2);border:1px solid var(--ln);border-radius:7px;padding:8px 10px}

.k .l{font-size:12px;color:var(--tx2);margin-bottom:2px}

.k .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* 차트 x축과 열이 세로로 정렬되는 표 */

table.grid{table-layout:fixed;width:100%;border-collapse:collapse;font-size:12px}

table.grid th,table.grid td{padding:3px 2px;border-bottom:1px solid var(--ln);text-align:center;

 font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

table.grid th:first-child,table.grid td:first-child{text-align:left;padding-left:6px;color:var(--tx2)}

table.grid thead th{color:var(--tx2);font-weight:500;background:var(--pn2)}

table.grid td.na{color:#454c59}

table.grid th.yb,table.grid td.yb{border-left:1px dashed #586074}

.tw{margin-top:8px}

.tw .cap{font-size:12px;color:var(--tx2);margin:8px 0 3px;padding-left:2px;display:flex;gap:6px;align-items:center}

.tw .cap i{width:3px;height:10px;border-radius:2px;display:inline-block}

/* 주석(※ 설명)은 제목 우측 '주석' 버튼 → 팝업으로. 상시 노출은 화면을 너무 많이 쓴다 */

.notebtn{margin-left:auto;flex:0 0 auto;background:var(--pn2);border:1px solid var(--ln);border-radius:5px;

 color:var(--tx2);font-size:12px;padding:2px 8px;cursor:pointer;font-family:inherit;line-height:1.6}

.notebtn:hover{border-color:var(--a);color:var(--a)}

.nmask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;

 align-items:center;justify-content:center;padding:24px}

.nmask.on{display:flex}

.nmodal{background:var(--pn);border:1px solid var(--ln);border-radius:10px;max-width:900px;width:100%;

 max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}

.nmhd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);font-size:12.5px}

.nmhd b{flex:1;min-width:0}

.nmx{cursor:pointer;color:var(--tx2);font-size:14px;padding:0 4px}

.nmx:hover{color:var(--tx)}

.nmbd{padding:12px 16px;overflow:auto;font-size:12px;line-height:1.75;color:var(--tx2)}

.nmbd .nsep{border:0;border-top:1px solid var(--ln);margin:10px 0}

/* 주석 팝업 안의 대조표(III-8 별도 vs 연결 표기 차이) */

.nmbd .ntab{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}

.nmbd .ntab th,.nmbd .ntab td{border:1px solid var(--ln);padding:4px 7px;text-align:left;vertical-align:top}

.nmbd .ntab th{background:var(--pn2);color:var(--tx2);font-weight:600;white-space:nowrap}

.sec.sum{margin-top:14px}

.mid>.sec.sum:first-child{margin-top:0}

.sec.sum tr.hi td{background:#1d2b45}

.sec.sum tr.tot td{font-weight:700;border-top:1px solid #3a4150;background:#1a1e26}

.sec.sum tr.sub td{color:var(--tx3);font-size:12px}

.sec.sum tr.sub td:first-child{padding-left:14px}

.sec.sum tr.nt td{color:var(--tx2)}

.sec.sum tr.nt td:first-child,.sec.sum tr.cs td:first-child{color:var(--tx2)}

.sec.sum tr.cs td{color:var(--a);background:#161d2b}

.sec.sum td.wr{color:#f87171}

.sec.sum td.fl,table.grid td.fl{outline:1px dashed var(--sep);outline-offset:-2px;border-radius:2px}

table.grid td.fli{outline:1px dashed var(--pr);outline-offset:-2px;border-radius:2px}

table.grid td.flx,.sec.sum td.flx{outline:1px dashed var(--xi);outline-offset:-2px;border-radius:2px}

/* 「진행률」·「매출인식액」처럼 공시값을 가공해 만든 행 — 색만 옅게 두고 활자는 세운다.

   공시값 가공은 원문 취급이라는 규칙 때문이다(사용자 지시 2026-09-07). 이 행에서도

   이탤릭은 셀 단위로, 보고서 밖에서 만들어낸 값(보간·예측·추정 배분)에만 붙는다. */

table.grid tr.calc td{color:var(--tx2)}

/* 3단(사업장 상세) 계산식 행 — 진행률·매출인식액·완성액(추정)·회수·잔액·XI-1 파생 행은 원문에 없는 값이라 값 칸을 이탤릭으로(사용자 지시 2026-09-08). 라벨 칸은 세운다. */

table.grid tr.calc td+td{font-style:italic}

table.grid tr.calc td:first-child{color:var(--tx3)}

table.grid td.ffc{outline:1px dashed var(--fc);outline-offset:-2px;border-radius:2px}

/* 활자 규칙 — **보고서에 없는 수치를 만들어낸 값만 이탤릭**(사용자 지시 2026-09-07).

   공시값을 가공한 것(당기 누적 − 직전 누적, 사업장 합산, 다른 절의 표에서 가져온 교차참조,

   원문 대조로 확정한 정정)은 전부 원문 취급이라 정체다. 이탤릭이 붙는 것은 셋뿐 —

   선형보간(fli) · S-curve 예측(ffc) · 추정 배분(fe), 그리고 그것이 섞인 합계 셀(it). */

table.grid.site td.fli,table.grid.site td.fe,table.grid.site td.ffc,

table.grid td.itl{font-style:italic}

/* 목록을 합산해 만든 줄 — 원문에 그 줄이 없다. 표1의 지역·공종 소행이 여기 든다. */

table.grid tr.itl td+td{font-style:italic}

/* 표 전체가 목록 합산인 경우 — 표2(분기 매출 계산액)·표4(비율). */

.sec.itlall table.grid tbody tr td+td{font-style:italic}

table.grid td.fm{outline:1px solid var(--mn);outline-offset:-2px;border-radius:2px}

table.grid td.evc{outline:1px dashed var(--evc);outline-offset:-2px;border-radius:2px;background:rgba(250,204,21,.10)}

table.grid td.fe{outline:1px dashed var(--fe);outline-offset:-2px;border-radius:2px;background:rgba(192,132,252,.10)}

/* 원문 값을 강제 수정한 칸(p8_overrides setvalue) — 헤더 경고 배너(.warn)와 같은 색으로 칠한다(사용자 지시 2026-09-08, 전 회사 공통). */

table.grid td.fset{background:#3a2a10;outline:1px solid #7a5a1a;outline-offset:-2px;border-radius:2px;color:#f5c469}

table.grid th.hf{color:var(--fc);font-weight:600}

/* 좌상단 칸에 넣는 표 이름 — 분기 헤더보다 눈에 띄게 굵고 밝게 */

table.grid th.hc{font-weight:700;color:var(--tx1)}

.none{color:var(--tx3);font-size:12px;padding:16px;text-align:center;font-style:italic}

tr.rp td:first-child{color:#7dd3fc}



/* 관계사(특수관계자) 발주 사업장 — index·matrix·trace 공용 (scripts/site_style.py) */

/* 관계사는 이름 배지(.rpb)만으로 구분한다 — 행 하이라이트는 뺐다(사용자 지시 2026-09-01).

   삼성물산 83개·삼성E&A 57개가 통째로 칠해져 있어, 정작 보여야 할 **묶음(list_pin)

   하이라이트**가 그 위에 묻혔다. 하이라이트는 묶음 하나만 쓴다. */

/* .it은 4열 그리드(별·코드·이름·플래그)다. 배지는 다섯 번째 자식이라 열을 늘려 주지 않으면

   다음 줄로 밀려 목록 전체가 두 줄이 된다. 배지 열은 auto — 관계사 이름 폭만큼만 쓴다.

   matrix는 이 규칙을 `td.lbl .it`(특이도 0,2,1)로 두고 있어 `.it.rps`(0,2,0)가 진다.

   그래서 두 선택자를 함께 적는다 — 한쪽만 두면 matrix에서만 두 줄로 밀린다(사용자 지적). */

/* 배지가 붙은 만큼 열을 늘린다 — b1·b2·b3은 **배지 개수**다(관계사·다수현장·해외법인).
   종전에는 경우마다 규칙을 적었는데 배지가 셋이 되면 조합이 여덟이라 세지 못한다.
   matrix는 `td.lbl .it`로 특이도를 높여 두고 있어 두 선택자를 함께 적는다. */
.it.b1,td.lbl .it.b1{grid-template-columns:auto auto auto auto 1fr auto}
.it.b2,td.lbl .it.b2{grid-template-columns:auto auto auto auto auto 1fr auto}
.it.b3,td.lbl .it.b3{grid-template-columns:auto auto auto auto auto auto 1fr auto}
/* 3단 상세 제목(h2)에도 같은 배지를 단다 — 목록·matrix·trace와 눈이 같은 곳을 보게 한다
   (사용자 지시 2026-09-09). h2는 그리드가 아니라 글줄이라 배지 뒤 여백만 준다. */
h2 .rpb,h2 .lmb,h2 .ebb{margin-right:6px;vertical-align:middle}


/* list_pin으로 묶어 둔 사업장 묶음 — index·matrix·trace 공용. 나열 순서만으로는 「왜 여기

   모여 있는지」가 안 보여서 한 덩어리로 칠한다. 선택(.on)과 색 계열을 달리해 겹쳐 보이지

   않게 하고, 선택된 행에서도 왼쪽 레일은 남겨 묶음 소속이 유지되게 한다. 위아래 끝만 모서리를

.rpb{padding:0 4px;border-radius:3px;font-size:12px;line-height:13px;color:#7dd3fc;

   드나드는 묶음이라 추정도 분기 매출인식액도 만들지 않는다. 관계사 배지(하늘색)와

const _sqn=v=>(v||'').toLowerCase()

  .replace(/주식회사|유한회사|㈜|\(주\)/g,'')

  .replace(/[\s()\[\]{}·,.\-–—_\/'"~]/g,'');

const SQ=new Map(), SQALT=new Map();

SITES.forEach(s=>{

  const alt=[];

  (s.names||[]).forEach(r=>{const v=r&&r[1]; if(v) alt.push(v);});

  const xf=s.xipFull||{}; ['계약명','계약상대방'].forEach(k=>(xf[k]||[]).forEach(v=>{if(v) alt.push(v);}));

  const pf=s.p8Full||{}; ['품목','발주처'].forEach(k=>(pf[k]||[]).forEach(v=>{if(v) alt.push(v);}));

  const baseN=_sqn([s.ent,s.nm,s.cl||'',s.id].join(' '));

  const uniq=[...new Set(alt)];

  SQ.set(s.id, baseN+'|'+uniq.map(_sqn).join('|'));

  // 대표 표기에 없는 것만 「숨은 표기」로 따로 들고 있다가 걸린 이유를 알려 준다

  SQALT.set(s.id, uniq.filter(v=>!baseN.includes(_sqn(v))));

});

// 검색어가 대표 표기에는 없고 숨은 표기에만 걸린 경우 그 표기를 돌려준다(툴팁·부제용)

function hitAlt(s,qn){

  if(!qn) return null;

  const baseN=_sqn([s.ent,s.nm,s.cl||'',s.id].join(' '));

  if(baseN.includes(qn)) return null;

  return (SQALT.get(s.id)||[]).find(v=>_sqn(v).includes(qn))||null;

}

function filtered(){const q=document.getElementById('q').value.trim();

 const qn=_sqn(q);

 return SITES.filter(s=>{if(selEnt.size&&!selEnt.has(s.ent))return false;

  for(const i of selSrc) if(!s.has[i]) return false;

  if(bmOnly&&!BM.has(s.id))return false;

  if(flOnly&&!FL.has(s.id))return false;

  if(!qn)return true; return (SQ.get(s.id)||'').includes(qn);});}

 if(!present.length) return `<div class="none">${esc(opt.empty||'변경 이벤트 없음')}</div>`;

 const chg=opt.data?selfChanges(EF,present):new Map(s.ev.map(e=>[e.fq+'|'+e.f,e]));

 let body='';

 present.forEach(f=>{

  const isAmt=AMTF.has(f);

  body+=`<tr><td>${esc(opt.fields?f:EVLABEL(f))}</td>`+FQF.map((fq,k)=>{

   const v=EF[f][k];

   if(v==null) return `<td class="na${YBF(k)}">–</td>`;

   // 금액 열이라도 값이 문자열이면 그대로 쓴다 — XI-1 계약금액이 외화로 적힌 분기는

   // 환산하지 않고 원문 표기(「2,426,809,931 (USD)」)를 문자열로 싣기 때문이다.

   const amt=isAmt&&typeof v==='number';

   const disp=amt?fmt(Number(v)):esc(String(v));

   const e=chg.get(fq+'|'+f);

   const cls=YBF(k).trim()+(e?' evc':'');

   // 항상 원문 그대로의 전체 값을 title에 담아, 셀 폭이 좁아 말줄임(…)으로 잘린 텍스트도

   // 마우스를 올리면 전부 볼 수 있게 한다(사용자 요청). 변경 이벤트가 있으면 이전 값도 덧붙인다.

   const full=amt?fmt(Number(v))+' 백만원':String(v);

   const ttl=e?`변경됨 — 이전: ${amt&&typeof e.o==='number'?fmt(Number(e.o))+' 백만원':String(e.o)} → 현재: ${full}`:full;

   return `<td class="${cls}" title="${esc(ttl)}">${disp}</td>`;

  }).join('')+'<td></td></tr>';

 });

 return `${opt.facts||''}<table class="grid">${COLS2}${headF(opt&&opt.head)}<tbody>${body}</tbody></table>

  <div class="note">${opt.note||'※ 공시된 전 분기 실측값을 표시합니다(결측 분기는 –). 마지막 4개 분기(헤더 *)는 다른 표와 가로축을 맞추려고 늘린 열입니다 — 이 항목들은 공시 원문 기반이라 예측하지 않으므로 항상 빈 칸입니다.<br>※ 노란 점선 박스는 직전 실측 대비 값이 바뀐 시점입니다. 셀 글씨가 잘려 보이면(…) 마우스를 올려 전체 값을 확인하세요 — 변경된 셀은 이전 값도 함께 뜹니다. 우측 패널 차트와 나란히 보면 값이 튀는 시점의 원인(명칭·발주처·공기·도급액 변경)을 바로 확인할 수 있습니다.'}</div>`;}

// 변경 이력 = II-4 / III-8 / XI-1 세 표를 한 섹션에 위아래로 쌓는다(사용자 요청).

// 세 표 모두 FQF 축·열 폭이 같아 같은 분기가 세로로 정렬되므로, 어느 출처가 먼저 바뀌었는지

// 아꼈다(사용자 요청). 블록 구분은 .evb+.evb의 윗선이 맡는다.

function evBlock(inner){

 return `<div class="evb">${inner}</div>`;}

// III-8은 별도/연결 두 기준으로 공시된다. 수주총액은 두 행으로 나눠 표에 그대로 두지만,

// 품목·발주처·계약일·공사기한까지 두 벌을 늘어놓으면 표가 배로 길어지고 읽기 어려워진다.

// 그래서 표에는 별도 기준만 싣고, 연결 쪽 표기가 다른 분기만 여기 모아 주석 팝업으로 뺀다

// (사용자 요청). .note는 foldNotes()가 자동으로 섹션 제목의 '주석' 버튼으로 걷어간다.

function p8NoteHTML(F){

 let h='※ 수주총액은 별도·연결을 각각 한 행으로 나눠 표시합니다 — 두 기준은 연결 자회사 몫이 포함되는지가 달라 금액이 크게 다를 수 있어, 한 행에 섞으면 기준이 바뀌는 분기의 증감이 실제 변동처럼 보입니다.'

      +'<br>※ 품목·발주처·계약일·공사기한은 <b>별도 기준</b>을 표시합니다(그 분기에 별도 공시가 없으면 연결 값으로 채웁니다).'

      +'<br>※ 노란 점선 박스는 직전 공시 분기 대비 값이 바뀐 시점입니다.';

 if((F._dropQ||[]).length) h+='<br>※ 별도와 연결이 <b>완전히 같은 값</b>으로 실린 분기는 연결 차트를 그리지 않습니다 — 두 기준이 서로 다른 범위를 보여주는 것이 아니라, 그 계약에 연결·별도 양쪽 모두 표기 의무가 있어 같은 내용이 두 번 공시된 것이라, 똑같은 그림이 두 장 나오지 않게 한 것입니다. <b>표의 수주총액(연결) 행에는 원문 값이 그대로 남습니다</b>(비어 있으면 그 분기에는 연결 공시가 애초에 없던 것입니다). 판정은 <b>분기(사업보고서) 단위</b>라 값이 다른 분기의 연결 차트는 그대로 그립니다.';

 return h;}

// 현장별 특이사항은 주석 버튼 뒤에 숨기지 않고 표 위에 그대로 띄운다(사용자 지시 2026-08-28)

// — 주석은 '표를 어떻게 구성했나' 같은 개념 설명 자리이고, '이 사업장의 이 분기가 이렇다'는

// 눈에 보여야 판단에 쓰인다. 위 p8NoteHTML은 개념만, 아래는 이 사업장의 사실만 담는다.

function p8FactsHTML(F){

 const oc=F._onlyCon||[], fc=F._forced||[], d=F._diff||[];

 // 값이 100% 같아 생략한 분기는 아무것도 적지 않는다(사용자 지시 2026-08-28) — 설명할

 // 것이 없는 사실이라 줄만 잡아먹는다. 규칙 자체의 설명은 주석(p8NoteHTML)에 있다.

 // 여기에는 **왜 그런지 설명이 필요한 것만** 한 줄씩 적는다.

 const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1);

   return w+((c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28?a:b):a);};   // 받침 유무로 조사 선택

 const fqs=new Set(fc.map(x=>x.fq));

 const lines=[];

 fc.forEach(x=>{

  const ds=d.filter(y=>y.fq===x.fq);

  const what=ds.length?ds.map(y=>y.f).join('·'):'값';

  const sh=v=>(v==null||String(v).trim()==='')?'–':String(v);

  const val=ds.length?` (별도 ${ds.map(y=>sh(y.s)).join('·')} / 연결 ${ds.map(y=>sh(y.c)).join('·')})`:'';

  // 사유 문구는 오버라이드가 정한다(p8_overrides.csv의 reason). 비어 있으면 붙이지 않는다 —

  // 값 항목이 실제로 다른 건을 오타라고 단정하지 않기 위해서다.

  const why=(x.why||'').trim();

  // 분기 뒤 조사는 붙이지 않는다 — 'Q4은'처럼 숫자로 끝나 받침 판정이 안 된다.

  lines.push(`<b>${esc(x.fq)}</b> — ${esc(jo(what,'이','가'))} 다르지만 ${why?esc(why)+' ':''}연결 표기 생략${esc(val)}`);

 });

 // 원문 값 교정은 **분기당 한 줄**로 짧게 — 오류 종류·수정 방법은 상단 배너에 있고, 여기서는

 // 무엇이 어떻게 바뀌었는지만 적는다(사용자 지시 2026-09-08). 근거 전문은 p8_overrides.csv에 있다.

 {const g={};

  (F._set||[]).forEach(x=>{const k=x.fq; g[k]=g[k]||{b:[],c:{}};

   if(g[k].b.indexOf(x.basis)<0) g[k].b.push(x.basis);

   x.ch.forEach(c=>{g[k].c[`${esc(c[0])} ${esc(String(c[1]==null||c[1]===''?'–':c[1]))}→${esc(String(c[2]===''?'–':c[2]))}`]=1;});});

  Object.keys(g).sort().forEach(k=>lines.push(

   `<b>${esc(k)}</b> 원문 값 교정 — ${Object.keys(g[k].c).join(' · ')} (${g[k].b.join('·')})`));}

 const sf=F._soft;

 if(sf) lines.push(`<b>${esc(sf.q0)}~${esc(sf.q1)} ${sf.n}개 분기</b> — ${esc(sf.f)}만 다르지만 `

   +`연결 표기 생략 (별도·연결의 대손 손실률 산정 집합이 달라 갈리는 값이라 사업장 실적이 아니다)`);

 if(oc.length) lines.push(`별도 공시가 없어 <b>연결 값으로 표시</b>한 분기 ${oc.length}개`

   +(oc.length<=6?` (${oc.map(esc).join(', ')})`:''));

 const dr=d.filter(x=>!fqs.has(x.fq));

 if(dr.length){

  const by=new Map();

  dr.forEach(x=>{const k=x.f+'|'+x.s+'|'+x.c; if(!by.has(k)) by.set(k,{...x,fqs:[]}); by.get(k).fqs.push(x.fq);});

  [...by.values()].forEach(x=>lines.push(

    `<b>${esc(x.fqs.join(', '))}</b> — ${esc(x.f)} 표기 차이 (별도 ${esc(String(x.s))} / 연결 ${esc(String(x.c))})`));

 }

 if(!lines.length) return '';

 return `<div class="warn" style="margin:0 0 10px">${lines.map(l=>'▣ '+l).join('<br>')}</div>`;}

function eventSectionHTML(){

 if(!cur) return '';

 return `<section class="sec sum"><h3><i class="bd" style="background:#64748b"></i>5. 현장별 변경 내역 이력 <small>${esc(cur.ent)} · ${esc(cur.nm)} · II-4 변경 ${cur.ev.length}건</small></h3>

  <div class="bd2">

  ${evBlock(evGridHTML(cur,{head:'II-4'}))}

  ${evBlock(cur.p8Full

     ? evGridHTML(cur,{head:'III-8',data:cur.p8Full,fields:P8FIELDS,note:p8NoteHTML(cur.p8Full),facts:p8FactsHTML(cur.p8Full)})

     : `<div class="none">III-8-라에 이 사업장 공시 없음</div>`)}

  ${evBlock(cur.xipFull

     ? evGridHTML(cur,{head:'XI-1',data:cur.xipFull,fields:XPFIELDS,

         note:'※ 「나. 진행 현황」의 분기별 공시값입니다(「가.」 공시 대장은 분기가 아니라 공시일 기준이라 이 축에 얹을 수 없어 아래 별도 표로 둡니다). 원문 열 제목은 「계약시작월/계약종료월」이지만 셀 값에는 일자까지 들어 있어(값이 있는 142건 전부 YYYY-MM-DD, 나머지는 원문이 공란) 자르지 않고 그대로 표시합니다.<br>※ 노란 점선 박스는 직전 공시 분기 대비 값이 바뀐 시점입니다.'})

     : `<div class="none">XI-1 진행 현황에 이 사업장 공시 없음</div>`)}

  </div></section>`;}

// ---- 키보드 탐색(사용자 요청): ↑/↓ 로 좌측 목록의 이전/다음 사업장으로 이동한다.

// 기준은 SITES 원본이 아니라 filtered() — 즉 지금 화면에 보이는 순서(검색·필터·즐겨찾기 반영)

// 그대로 움직인다. 선택이 목록 밖으로 나가면 스크롤을 따라 붙인다.

function moveSel(delta){

 const L=visible(); if(!L.length) return;

 // 위치는 객체 동일성으로 찾는다. 코드로 찾으면 같은 코드가 두 줄인 순간(레지스트리 충돌 등)

 // 항상 첫 줄을 가리켜 두 번째 줄에서 ↓를 눌러도 제자리로 돌아온다 — 목록이 그 지점에서

 // 막힌다. 코드 대조는 필터가 바뀌어 객체가 목록 밖으로 나갔을 때의 보조 수단으로만 쓴다.

 let i=cur?L.indexOf(cur):-1;

 if(i<0&&cur) i=L.findIndex(s=>s.id===cur.id);

 if(i<0) i = delta>0 ? -1 : L.length;   // 현재 선택이 필터 밖이면 방향에 맞춰 양 끝에서 시작

 const ni=Math.min(L.length-1,Math.max(0,i+delta));

 if(ni===i) return;                      // 목록 끝에서는 그대로(순환하지 않음)

 cur=L[ni]; render(); draw(cur);

 const el=document.querySelector('#list .it.on'); if(el) el.scrollIntoView({block:'nearest'});

}

document.addEventListener('keydown',e=>{

 if(e.altKey||e.ctrlKey||e.metaKey) return;

 if(document.getElementById('nmask').classList.contains('on')) return;  // 주석 팝업 중엔 무시

 const t=e.target, tag=((t&&t.tagName)||'').toLowerCase();

 // Space: 현재 선택 사업장의 즐겨찾기 토글(사용자 요청 — ↓로 내리다 Space로 체크, 다시 ↓).

 // 검색창을 포함한 모든 입력칸에서는 제외한다 — 검색어에 띄어쓰기를 쳐야 하기 때문.

 // (↑↓는 검색창에서도 목록 탐색으로 쓰지만 Space는 다르다.)

 if(e.key===' '){

  if(tag==='input'||tag==='textarea') return;

  if(!cur) return;

  e.preventDefault();                     // 기본 동작(페이지 스크롤) 방지

  toggleBM(cur.id);

  const el=document.querySelector('#list .it.on'); if(el) el.scrollIntoView({block:'nearest'});

  return;

 }

 // F: 플래그 토글(사용자 요청) — Space가 별표인 것과 같은 자리. 입력칸에서는 글자를

 // 쳐야 하므로 제외한다.

 if(e.key==='f'||e.key==='F'){

  if(tag==='input'||tag==='textarea') return;

  if(!cur) return;

  e.preventDefault();

  toggleFL(cur.id);

  const el=document.querySelector('#list .it.on'); if(el) el.scrollIntoView({block:'nearest'});

  return;

 }

 if(e.key!=='ArrowDown'&&e.key!=='ArrowUp') return;

 // 검색창에서는 ↑↓가 캐럿 이동뿐이라 목록 탐색으로 쓴다(검색어 입력 → 화살표로 고르기).

 // 그 외 일반 입력칸이 생기면 기본 동작을 건드리지 않는다.

 if(tag==='textarea'||(tag==='input'&&t.type!=='search')) return;

 e.preventDefault();

 moveSel(e.key==='ArrowDown'?1:-1);

});

document.getElementById('q').oninput=render;

// 보고서 건수는 실측 분기 수에서 뽑는다 — 예전엔 22로 박아 놨는데, 참조 시작 분기를

{const mb=document.getElementById('midtg');

 sync();}

document.getElementById('main').innerHTML='<div class="empty">왼쪽에서 사업장을 선택하세요</div>';

render(); if(SITES.length){cur=SITES[0];render();draw(SITES[0]);}
