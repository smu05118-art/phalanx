<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁 ARGUS — 시클리컬 사이클 관제</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111721; --panel2:#0d131c; --line:#1f2937; --ink:#e6edf3; --dim:#8a93a3;
    --accent:#2bc0d4; --up:#59d0a8; --down:#ff5e6c; --warn:#f6c85f;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .skip{position:absolute;left:12px;top:-48px;z-index:100;background:var(--accent);color:#071017;padding:8px 12px;border-radius:6px;font-weight:800}
  .skip:focus{top:8px}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;background:rgba(17,23,33,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
  header .sub{font-size:11.5px;color:var(--dim)}
  header .sub b{color:var(--accent);font-family:var(--mono)}
  header .disc{margin-left:auto;font-size:10.5px;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;white-space:nowrap}
  #mockBadge{display:none;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--warn);
    border:1px solid rgba(246,200,95,.5);border-radius:999px;padding:2px 9px}
  main{padding:18px clamp(12px,3vw,40px) 60px;max-width:1360px;margin:0 auto}
  .boot{color:var(--dim);font-size:13px;padding:40px 0;text-align:center}
  @media(max-width:760px){header .disc{margin-left:0}}
</style>
</head>
<body>
<a class="skip" href="#argusRoot">본문으로 건너뛰기</a>
<header>
  <h1>👁 ARGUS <span style="font-weight:600;color:var(--dim);font-size:13px">— 시클리컬 사이클 관제</span></h1>
  <span class="sub">기준일 <b id="hdAsof">—</b></span>
  <span id="mockBadge">MOCK DATA</span>
  <span class="disc">참고용 · 투자조언 아님</span>
  <a href="map.html" style="margin-left:auto;background:linear-gradient(135deg,#123055,#1b4d8a);color:#dcebff;border:1px solid #2f5c93;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:600;text-decoration:none">🗺 전상품 맵</a>
</header>
<main id="argusRoot" tabindex="-1" aria-busy="true"><div class="boot" role="status">요약 데이터 로딩…</div></main>
<noscript><div class="boot">ARGUS 차트와 표를 보려면 JavaScript를 활성화해야 합니다.</div></noscript>
<script src="data/argus_data.js"></script>
<script src="argus_charts.js"></script>
<script>
(function(){
  var D = window.ARGUS;
  var root = document.getElementById('argusRoot');
  if (!D || !D.axes) { root.setAttribute('aria-busy', 'false'); root.innerHTML = '<div class="boot" role="alert">argus_data.js 없음 — argus_build.py 를 먼저 실행하세요.</div>'; return; }
  document.getElementById('hdAsof').textContent = D.asof || '—';
  if (D.mock) document.getElementById('mockBadge').style.display = 'inline-block';
  try {
    window.renderARGUS(root, D);
    root.setAttribute('aria-busy', 'false');
  } catch (error) {
    root.setAttribute('aria-busy', 'false');
    root.innerHTML = '<div class="boot" role="alert">대시보드 렌더 실패: ' + String(error && error.message || error) + '</div>';
  }
})();
</script>
</body>
</html>
