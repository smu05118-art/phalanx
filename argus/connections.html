<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGUS · 데이터 연결</title>
<style>
:root{color-scheme:dark;--bg:#0e1117;--panel:#171d27;--line:#2b3545;--text:#e6edf6;--dim:#a0adbf;--blue:#79b6ff;--green:#71dab5;--amber:#efc478}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header,main{max-width:1450px;margin:auto;padding:24px}header{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}h2{font-size:20px;margin:0}p{color:var(--dim)}.stats,.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:var(--panel);border:1px solid var(--line);padding:14px 22px;border-radius:12px;min-width:160px}.stat b{font-size:27px;display:block}.stat span{color:var(--dim)}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel);color:var(--text)}input{min-width:260px;flex:1}button{cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--blue);background:#203552}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.8fr);gap:20px}.list{max-height:780px;overflow:auto;border:1px solid var(--line);border-radius:12px}.row{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:14px 18px}.row small{color:var(--dim)}.row .value{font-variant-numeric:tabular-nums;font-weight:700}.row .tag{font-size:11px;color:var(--green)}.row .wait{color:var(--amber)}.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;align-self:start;position:sticky;top:16px;min-width:0}.big{font-size:35px;font-weight:700;margin:15px 0 0;font-variant-numeric:tabular-nums}.unit{font-size:14px;color:var(--dim)}.plot{width:100%;height:230px;display:block;margin-top:20px}.meta{font-size:12px;color:var(--dim);overflow-wrap:anywhere}.related{display:flex;flex-wrap:wrap;gap:8px}.related button{font-size:12px}.empty{padding:24px;color:var(--dim)}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{text-align:right;padding:7px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}.scroll{max-height:260px;overflow:auto}.status{color:var(--amber)}:focus-visible{outline:2px solid var(--blue);outline-offset:3px}@media(max-width:800px){header,main{padding:18px}.layout{grid-template-columns:1fr}.detail{position:static;order:-1}.list{max-height:520px}.stat{min-width:0;flex:1;padding:10px}.stat b{font-size:23px}.plot{height:200px}}@media(prefers-reduced-motion:no-preference){.detail{animation:in .18s ease-out}@keyframes in{from{opacity:.7;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head><body><header><h1>데이터 연결</h1><a href="index.html">← ARGUS</a></header><main>
<p>가격의 기준·관측일·갱신 경로를 함께 확인합니다. 자동 연결 여부와 데이터 신선도는 별개입니다.</p>
<div class="stats" id="stats"></div><div class="controls"><input id="search" type="search" aria-label="품목 검색" placeholder="품목·산업·단위 검색"><select id="category" aria-label="산업"><option value="">모든 산업</option></select><select id="status" aria-label="연결 상태"><option value="all">전체 연결 상태</option><option value="auto">자동 연결</option><option value="manual">원장 갱신 필요</option><option value="stale">지연·오래된 관측</option></select></div>
<div class="layout"><div><p id="count" aria-live="polite"></p><div class="list" id="list"></div></div><section class="detail" id="detail" aria-live="polite"></section></div></main>
<script src="data/connections.js"></script><script>
'use strict';const D=window.ARGUS_CONNECTIONS, $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null?'—':v.toLocaleString('ko-KR',{maximumFractionDigits:5}), fresh={fresh:'정상',late:'발표 대기·지연',stale:'오래된 관측',dead:'장기 미갱신'};
if(!D){$('detail').textContent='연결 현황을 불러오지 못했습니다. 새로고침해 주세요.';}else{
const byId=Object.fromEntries(D.rows.map(r=>[r.sid,r]));let selected='';try{selected=decodeURIComponent(location.hash.slice(1));}catch(e){}
$('stats').innerHTML=[['전체 지표',D.total],['자동 연결',D.connected],['원장 갱신 필요',D.total-D.connected]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
[...new Set(D.rows.map(r=>r.cat))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o);});
function choose(sid){if(!byId[sid])return;selected=sid;history.replaceState(null,'','#'+encodeURIComponent(sid));renderDetail(byId[sid]);document.querySelectorAll('[data-sid]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sid===sid)));}
function render(){const term=$('search').value.toLowerCase(),cat=$('category').value,mode=$('status').value;const rows=D.rows.filter(r=>(!cat||r.cat===cat)&&(!term||(r.name+' '+r.cat+' '+r.unit).toLowerCase().includes(term))&&(mode==='all'||mode==='auto'&&r.lane||mode==='manual'&&!r.lane||mode==='stale'&&r.freshness!=='fresh')).sort((a,b)=>Number(!!b.lane)-Number(!!a.lane)||a.name.localeCompare(b.name));$('count').textContent=rows.length+'개 지표 · 최근 관측일 기준';$('list').innerHTML=rows.map(r=>'<button class="row" data-sid="'+esc(r.sid)+'" aria-pressed="'+(r.sid===selected)+'"><b>'+esc(r.name)+'</b><span class="value">'+fmt(r.last)+'</span><small>'+esc(r.last_date||'관측 없음')+' · '+esc(r.unit)+'</small><span class="tag '+(!r.lane?'wait':'')+'">'+(r.lane?'자동 연결':'원장 필요')+' · '+esc(fresh[r.freshness]||r.freshness)+'</span></button>').join('')||'<div class="empty">조건에 맞는 지표가 없습니다.</div>';$('list').querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>choose(b.dataset.sid));}
function renderDetail(r){const pts=r.observations||[];let svg='';if(pts.length){const vals=pts.map(p=>p[1]),lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*.12||Math.abs(hi)*.05||1;const x=i=>48+i/Math.max(1,pts.length-1)*502,y=v=>185-(v-lo+pad)/(hi-lo+2*pad)*150;svg='<svg class="plot" viewBox="0 0 580 225" role="img" aria-label="'+esc(r.name)+' 실제 관측 '+pts.length+'개"><line x1="48" y1="185" x2="550" y2="185" stroke="#42516a"/><text x="5" y="40" fill="#a0adbf" font-size="11">'+fmt(hi)+'</text><text x="5" y="184" fill="#a0adbf" font-size="11">'+fmt(lo)+'</text><polyline points="'+pts.map((p,i)=>x(i)+','+y(p[1])).join(' ')+'" fill="none" stroke="#79b6ff" stroke-width="2"/>'+pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p[1])+'" r="'+(pts.length===1?5:2)+'" fill="#79b6ff"><title>'+esc(p[0])+' · '+fmt(p[1])+' '+esc(r.unit)+'</title></circle>').join('')+'<text x="48" y="214" fill="#a0adbf" font-size="11">'+esc(pts[0][0])+'</text><text x="550" y="214" text-anchor="end" fill="#a0adbf" font-size="11">'+esc(pts.at(-1)[0])+'</text></svg>';}
$('detail').innerHTML='<div class="meta">'+esc(r.cat)+' · '+(r.lane?'자동 연결':'원장 갱신 필요')+'</div><h2>'+esc(r.name)+'</h2><div class="big">'+fmt(r.last)+' <span class="unit">'+esc(r.unit)+'</span></div><div class="meta">관측 '+esc(r.last_date||'없음')+' · '+esc(fresh[r.freshness]||r.freshness)+'</div>'+svg+'<p class="meta">최근 실제 관측 '+pts.length+'개 · '+(pts.length<2?'첫 관측을 확보했습니다. 추가 발표부터 추이가 쌓입니다.':'각 점은 수집한 관측값입니다. 중간 값은 만들지 않습니다.')+'</p><p class="status">'+esc(r.reason)+'</p><p>'+esc(r.basis)+'</p><p class="meta">'+esc(r.source)+'</p>'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">발행처 원문 ↗</a>':'')+'<details style="margin-top:18px"><summary>관측값 펼치기</summary><div class="scroll"><table><thead><tr><th>관측일</th><th>'+esc(r.unit)+'</th></tr></thead><tbody>'+pts.slice().reverse().map(p=>'<tr><td>'+esc(p[0])+'</td><td>'+fmt(p[1])+'</td></tr>').join('')+'</tbody></table></div></details>'+(r.related.length?'<p>다른 기준의 참고지표</p><p class="meta">규격·지역·통화가 달라 위 가격이나 스프레드를 대체하지 않습니다.</p><div class="related">'+r.related.map(k=>'<button data-related="'+esc(k)+'">'+esc(byId[k].name)+'</button>').join('')+'</div>':'');$('detail').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>choose(b.dataset.related));}
[$('search'),$('category'),$('status')].forEach(e=>e.addEventListener('input',render));render();choose(byId[selected]?selected:(byId.sol_pvi_module_182_perc?'sol_pvi_module_182_perc':D.rows[0]?.sid));}
</script></body></html>
