</style></head><body><header><h1>데이터 연결</h1><a href="index.html">← ARGUS</a></header><main>
<p>가격의 기준·관측일·갱신 경로를 함께 확인합니다. 자동 연결 여부와 데이터 신선도는 별개입니다.</p>
<div class="stats" id="stats"></div><section id="audit-summary" aria-label="원장 출처 조사 요약"></section><div class="controls"><input id="search" type="search" aria-label="품목 검색" placeholder="품목·산업·단위 검색"><select id="category" aria-label="산업"><option value="">모든 산업</option></select><select id="status" aria-label="연결 상태"><option value="all">전체 연결 상태</option><option value="auto">자동 연결</option><option value="manual">원장 갱신 필요</option><option value="suspended">발행 중단</option><option value="unavailable">현재 공개 미노출</option><option value="stale">지연·오래된 관측</option><option value="audited">원장 출처 조사</option><option value="unresolved">동일 원천 미연결</option></select></div>
<div class="layout"><div><p id="count" aria-live="polite"></p><div class="list" id="list"></div></div><section class="detail" id="detail" aria-live="polite"></section></div></main>

'use strict';const D=window.ARGUS_CONNECTIONS, $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null?'—':v.toLocaleString('ko-KR',{maximumFractionDigits:5}), fresh={fresh:'정상',late:'발표 대기·지연',stale:'오래된 관측',dead:'장기 미갱신'};
if(!D){$('detail').textContent='연결 현황을 불러오지 못했습니다. 새로고침해 주세요.';}else{
const suspended=r=>r.source_status==='suspended', notShown=r=>r.source_availability?.status==='not_in_current_public_preview', archived=r=>r.source_availability?.status==='archived_snapshot', connectionLabel=r=>suspended(r)?'발행 중단':notShown(r)?'자동 확인 · 현재 공개 미노출':archived(r)?'자동 확인 · 과거 공개본':r.lane?'자동 연결':'원장 갱신 필요';
const byId=Object.fromEntries(D.rows.map(r=>[r.sid,r]));let selected='';try{selected=decodeURIComponent(location.hash.slice(1));}catch(e){}
$('stats').innerHTML=[['전체 지표',D.total],['자동 연결',D.connected],['원장 갱신 필요',D.manual??D.total-D.connected-(D.suspended||0)],['발행 중단',D.suspended||0]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
const A=D.audit_summary;
if(A?.total){$('audit-summary').className='audit-summary';$('audit-summary').innerHTML='<b>원장 '+fmt(A.total)+'개 전수 출처 조사</b><p>동일 원천 연결 '+fmt(A.exact_ready)+'개 · 동일 원천 미연결 '+fmt(A.total-A.exact_ready)+'개 · 별도 공개 비교지표 '+fmt(A.new_comparison_series)+'개</p><p class="meta">관련 참고가격을 연결한 원장 '+fmt(A.original_rows_with_reference_links||0)+'개도 동일 원천 미연결 수에 포함됩니다. 지연 공개 참고계열 '+fmt(A.public_delayed_reference_series||0)+'개 중 현재 공개 '+fmt(A.public_reference_present||0)+'개 · 현재 미노출 '+fmt(A.public_reference_not_currently_shown||0)+'개 · 과거 공개본만 확보 '+fmt(A.public_reference_archived_only||0)+'개입니다.</p><p class="meta">산식을 확인한 '+fmt(A.formula_verified_waiting)+'개는 입력 가격이 수동입니다. 공개 비교가격과 업종 지수는 기존 원장 가격을 대체하지 않습니다. 목록에서 지표를 선택하면 출처·차이·남은 확인 조건을 볼 수 있습니다.</p>';}
const auditStatus={ready_exact_alias:'동일 원천 연결 가능',original_assessment_unidentified:'원장 평가기관·코드 미확인',derived_recipe_unconfirmed:'스프레드 산식 미확정',verified_alias_waiting_for_input:'가격 사본 확인 · 원본 수동',weighted_recipe_waiting_for_inputs:'배합 산식 확인 · 입력 수동',solar_basis_unresolved:'태양광 가격 규격 미확인'};
const relation={exact_alias:'동일 원장 가격 사본',proxy_only:'다른 기준의 비교가격',component_reference_only:'스프레드 제품측 참고가격',broad_sector_context_only:'업종 전체 지수 · 맥락 참고',same_provider_candidate_not_equivalent:'동일 제공기관 · 규격 미확인',source_discovery_not_verified_equivalent:'원천 탐색 경로 · 수치 피드 미확인',same_product_reference_only:'같은 제품군 · 별도 참고가격'};
const conditions={original_assessment_provider:'평가기관',assessment_code:'평가코드',product_grade:'제품 등급',incoterm:'FOB·CFR 등 거래조건',delivery_location:'거래·인도 지역',currency_and_unit:'통화와 단위',lot_size_and_delivery_window:'거래 수량·인도 기간',spot_or_contract:'현물·계약 구분',low_high_mid_or_settlement:'저가·고가·중간값·결제값 구분',weekly_date_label_and_aggregation:'주간 날짜·집계 방식',historical_overlap:'과거 겹침값 대조'};
const safeUrl=u=>{try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)&&!x.username&&!x.password?x.href:null;}catch(e){return null;}};
const sourceName=sid=>byId[sid]?.name||sid;
function sourceAudit(r){
 const a=r.source_audit;if(!a)return '';
 const f=a.formula,w=f?.weighted_recipe_from_header;
 let formula='';
 if(w){formula='<h4>원문 배합 산식</h4><p>'+esc(sourceName(w.product_input))+' − '+Object.entries(w.raw_material_weights||{}).map(([k,v])=>fmt(v)+' × '+esc(sourceName(k))).join(' − ')+'</p><p class="meta">검증 '+fmt(w.checked_observations)+'개 / 원장 '+fmt(w.target_observations)+'개 · 불일치 '+fmt(w.mismatches)+'개 · 입력 누락 '+fmt((w.unverified_dates||[]).length)+'개. 입력 가격이 수동이어서 자동 계산하지 않습니다.</p>';}
 else if(f?.expression){formula='<h4>확인한 연결식</h4><p>'+esc((f.inputs||[]).length===1?sourceName(f.inputs[0]):f.expression)+'</p><p class="meta">겹침 '+fmt(f.checked_observations)+'개 · 불일치 '+fmt(f.mismatches)+'개 · '+(f.automatic_inputs?'검증된 관측만 복사합니다.':'입력이 수동이어서 자동 갱신하지 않습니다.')+'</p>';}
 else if(f){const candidates=f.p_minus_q_identity_candidates||[];formula='<h4>산식 확인 결과</h4><p>원장에 계산식이 저장되어 있지 않습니다. '+(candidates.length?'제품가격 − 원재료가격과 수치가 맞는 후보 '+fmt(candidates.length)+'개가 있지만 공식 배합 산식으로 확정하지 않았습니다.':'확정할 수 있는 원문 산식이 없습니다.')+'</p>';if(candidates.length)formula+='<ul class="meta">'+candidates.slice(0,3).map(c=>'<li>'+esc(sourceName(f.product_input))+' − '+esc(sourceName(c.input_sid))+' · 대조 '+fmt(c.checked_observations)+'개</li>').join('')+'</ul>';}
 const sources=(a.candidates||[]).map(c=>{const url=safeUrl(c.url);return '<div class="source-item"><span class="badge">'+esc(relation[c.relationship]||c.relationship)+'</span>'+(c.sid&&byId[c.sid]?'<h4>'+esc(sourceName(c.sid))+' <button data-audit-related="'+esc(c.sid)+'">지표 보기</button></h4>':'')+(c.basis?'<p>'+esc(c.basis)+'</p>':'')+(c.why_not_equivalent?'<p class="meta">'+esc(c.why_not_equivalent)+'</p>':'')+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">공개 출처·자료 경로 ↗</a>':'<p class="meta">원본 가격도 수동 상태입니다.</p>')+'</div>';}).join('');
 return '<section class="audit-card" aria-label="이 지표의 출처 조사"><h3>출처 조사 · '+esc(auditStatus[a.status]||a.status)+'</h3><p>'+esc(a.reason)+'</p>'+formula+sources+'<details style="margin-top:14px"><summary>동일 지표 연결을 위한 검증 항목</summary><ul class="meta">'+(a.contract_fields_needed||[]).map(k=>'<li>'+esc(conditions[k]||k)+'</li>').join('')+'</ul></details></section>';
}
[...new Set(D.rows.map(r=>r.cat))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o);});
function choose(sid){if(!byId[sid])return;selected=sid;history.replaceState(null,'','#'+encodeURIComponent(sid));renderDetail(byId[sid]);document.querySelectorAll('[data-sid]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sid===sid)));}
function render(){const term=$('search').value.toLowerCase(),cat=$('category').value,mode=$('status').value;const rows=D.rows.filter(r=>(!cat||r.cat===cat)&&(!term||(r.name+' '+r.cat+' '+r.unit+' '+r.sid).toLowerCase().includes(term))&&(mode==='all'||mode==='auto'&&r.lane||mode==='manual'&&!r.lane&&!suspended(r)||mode==='suspended'&&suspended(r)||mode==='unavailable'&&notShown(r)||mode==='stale'&&r.freshness!=='fresh'||mode==='audited'&&r.source_audit||mode==='unresolved'&&r.source_audit&&!r.source_audit.exact_connection)).sort((a,b)=>Number(!!b.lane)-Number(!!a.lane)||a.name.localeCompare(b.name));$('count').textContent=rows.length+'개 지표 · 최근 관측일 기준';$('list').innerHTML=rows.map(r=>'<button class="row" data-sid="'+esc(r.sid)+'" aria-pressed="'+(r.sid===selected)+'"><b>'+esc(r.name)+'</b><span class="value">'+fmt(r.last)+'</span><small>'+esc(r.last_date||'관측 없음')+' · '+esc(r.unit)+'</small><span class="tag '+(!r.lane?'wait':'')+'">'+connectionLabel(r)+' · '+esc(fresh[r.freshness]||r.freshness)+'</span></button>').join('')||'<div class="empty">조건에 맞는 지표가 없습니다.</div>';$('list').querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>choose(b.dataset.sid));}
function availabilityNote(r){const a=r.source_availability;if(!a)return '';if(archived(r))return '<p class="status">검증된 과거 공개본의 관측값입니다. 현재 공개 페이지의 노출 여부는 아직 확인되지 않았습니다. 원문 관측일을 보존합니다.</p>';return '<p class="status">공개 페이지 확인 '+esc(a.checked_at||'미확인')+' · '+(notShown(r)?'이번 공개 페이지에는 이 계열이 없습니다. 마지막으로 검증한 공개 관측 이력을 보존하며 새 값을 만들지 않습니다.':'이번 공개 페이지에서 확인했습니다. 최소 14일 지연 자료이며 관측일과 확인일이 다릅니다.')+'</p>';}
function renderDetail(r){const pts=r.observations||[];let svg='';if(pts.length){const vals=pts.map(p=>p[1]),lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*.12||Math.abs(hi)*.05||1;const x=i=>48+i/Math.max(1,pts.length-1)*502,y=v=>185-(v-lo+pad)/(hi-lo+2*pad)*150;svg='<svg class="plot" viewBox="0 0 580 225" role="img" aria-label="'+esc(r.name)+' 실제 관측 '+pts.length+'개"><line x1="48" y1="185" x2="550" y2="185" stroke="#42516a"/><text x="5" y="40" fill="#a0adbf" font-size="11">'+fmt(hi)+'</text><text x="5" y="184" fill="#a0adbf" font-size="11">'+fmt(lo)+'</text><polyline points="'+pts.map((p,i)=>x(i)+','+y(p[1])).join(' ')+'" fill="none" stroke="#79b6ff" stroke-width="2"/>'+pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p[1])+'" r="'+(pts.length===1?5:2)+'" fill="#79b6ff"><title>'+esc(p[0])+' · '+fmt(p[1])+' '+esc(r.unit)+'</title></circle>').join('')+'<text x="48" y="214" fill="#a0adbf" font-size="11">'+esc(pts[0][0])+'</text><text x="550" y="214" text-anchor="end" fill="#a0adbf" font-size="11">'+esc(pts.at(-1)[0])+'</text></svg>';}
$('detail').innerHTML='<div class="meta">'+esc(r.cat)+' · '+connectionLabel(r)+'</div><h2>'+esc(r.name)+'</h2><div class="big">'+fmt(r.last)+' <span class="unit">'+esc(r.unit)+'</span></div><div class="meta">관측 '+esc(r.last_date||'없음')+' · '+esc(fresh[r.freshness]||r.freshness)+'</div>'+svg+'<p class="meta">최근 실제 관측 '+pts.length+'개 · '+(pts.length<2?'첫 관측을 확보했습니다. 추가 발표부터 추이가 쌓입니다.':'각 점은 수집한 관측값입니다. 중간 값은 만들지 않습니다.')+'</p><p class="status">'+esc(r.reason)+'</p>'+availabilityNote(r)+'<p>'+esc(r.basis)+'</p>'+sourceAudit(r)+'<p class="meta">'+esc(r.source)+'</p>'+(safeUrl(r.url)?'<a href="'+esc(safeUrl(r.url))+'" target="_blank" rel="noopener noreferrer">발행처 원문 ↗</a>':'')+'<details style="margin-top:18px"><summary>관측값 펼치기</summary><div class="scroll"><table><thead><tr><th>관측일</th><th>'+esc(r.unit)+'</th></tr></thead><tbody>'+pts.slice().reverse().map(p=>'<tr><td>'+esc(p[0])+'</td><td>'+fmt(p[1])+'</td></tr>').join('')+'</tbody></table></div></details>'+(r.related.length?'<p>관련 원천·참고지표</p><p class="meta">동일 가격 사본과 다른 기준의 비교지표를 출처 조사에서 구분합니다.</p><div class="related">'+r.related.map(k=>'<button data-related="'+esc(k)+'">'+esc(byId[k].name)+'</button>').join('')+'</div>':'');$('detail').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>choose(b.dataset.related));$('detail').querySelectorAll('[data-audit-related]').forEach(b=>b.onclick=()=>choose(b.dataset.auditRelated));}
[$('search'),$('category'),$('status')].forEach(e=>e.addEventListener('input',render));render();choose(byId[selected]?selected:(byId.sol_pvi_module_182_perc?'sol_pvi_module_182_perc':D.rows[0]?.sid));}
</script></body></html>
