# GitHub Pages(Jekyll) 빌드 설정.
#
# 왜 생겼나 — `argus/kce/tools/` 는 DART 수집·페이지 생성 **파이프라인 소스**지 배포물이
# 아니다. 그런데 Pages는 레포를 통째로 올리므로 그 안의 html이 사이트에 실려 있었다:
#
#   · tools/assets/picker_base.html   회사 선택 화면의 *원형*. 링크가 원형 기준
#     (`sct/index.html` 등)이라 실제 배포 위치에서는 22개가 전부 404다.
#   · tools/tests/fixtures/*.html     DART 원문 스냅샷. `/css/report_xml.css`,
#     `/dsaf001/main.do?...` 처럼 DART 사이트 기준 절대경로를 물고 있어 역시 전부 404.
#   · tools/*.py, tools/assets/series_cache/ (4MB)  코드와 시계열 원장. 볼 이유가 없다.
#
# 왜 경로 이동이 아닌가 — `kce_page.py` 의 `PICKER_BASE` 상수가 그 경로를 가리킨다.
# 파일을 옮기면 상수를 함께 고쳐야 한다. 경로는 그대로 두고 빌드에서만 뺀다.
#
# 왜 front matter(`published: false`)가 아닌가 — `kce_page.picker_html()` 이
# picker_base.html 을 **글자 그대로 복사**한 뒤 삽입만 해서 `argus/kce/index.html` 을
# 만든다(삭제 연산 0). front matter를 달면 회사 선택 화면에까지 따라 붙어 그 화면 자체가
# 배포에서 빠진다. 그래서 파일 단위 스위치가 아니라 빌드 설정으로 뺀다.
#
# exclude 를 지정하면 Jekyll 기본 목록을 덮어쓰므로 기본값도 함께 적는다.
exclude:
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # ↓ 파이프라인 소스·픽스처·원장 — 배포물이 아니다(한국건설·한국조선).
  - argus/kce/tools/
  - argus/kship/tools/
  - argus/kdef/tools/
