 // 1) 두 경로 겹쳐 보기 — 비가중 병렬 바 + 매출선 + 가이던스★/당사 추정◆ (원전 8번 양식)
 const ch=c.chart,qs=ch.periods,last=qs[qs.length-1];
 const gmid=m.guid_lo?(m.guid_lo+m.guid_hi)/2:null;
 CH(document.getElementById('lv'+c.id),{data:{labels:qs,datasets:[
  ...ch.routes.map((r,k)=>({type:'bar',label:r.label.split(' (')[0],data:r.vals,
   backgroundColor:k?'#3d6fd8':'#5aa9ff',yAxisID:'y'})),
  {type:'line',label:'매출',data:ch.rev,borderColor:'#7ee08a',backgroundColor:'#7ee08a',
   yAxisID:'y2',tension:.25,pointRadius:3},
  ...(gmid?[{type:'scatter',label:'가이던스 중간',data:[{x:last,y:gmid}],yAxisID:'y2',
   backgroundColor:'#ffd166',pointStyle:'star',pointRadius:9}]:[]),
  ...(e.corr_rev?[{type:'scatter',label:'당사 추정',data:[{x:last,y:e.corr_rev}],yAxisID:'y2',
   backgroundColor:'#fff',pointStyle:'rectRot',pointRadius:7}]:[])]},
  options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>(v/1e9).toFixed(0)+'B'}},
   y2:{position:'right',grid:{display:false},ticks:{callback:v=>F(v,d)}}},
   plugins:{legend:{labels:{boxWidth:10}}}}});
 // 2) 회귀 산점 — ±1σ 밴드·컨센 수평선·직전분기 사전예측 검증 (원전 9번 양식)
 const pts=ch.scatter||[];let fitline=[],bandUp=[],bandDn=[];
 if(fit.b!=null&&pts.length){const xs=pts.map(p=>p[0]),lo=Math.min(...xs,e.x_now??0),hi=Math.max(...xs,e.x_now??0);
  fitline=[{x:lo,y:fit.a+fit.b*lo},{x:hi,y:fit.a+fit.b*hi}];
  bandUp=fitline.map(p=>({x:p.x,y:p.y+fit.sd}));bandDn=fitline.map(p=>({x:p.x,y:p.y-fit.sd}));}
 const consYoY=(m.consensus&&e.base_rev)?((m.consensus/e.base_rev-1)*100):null;
 CH(document.getElementById('sc'+c.id),{type:'scatter',data:{datasets:[
  {label:'±1σ',type:'line',data:bandUp,borderColor:'transparent',pointRadius:0,fill:'+1',
   backgroundColor:'rgba(57,208,195,.10)'},
  {label:'',type:'line',data:bandDn,borderColor:'transparent',pointRadius:0},
  {label:'과거 분기',data:pts.map(p=>({x:p[0],y:p[1]})),backgroundColor:'#5aa9ff'},
  {label:'회귀선',type:'line',data:fitline,borderColor:'#39d0c3',pointRadius:0,borderWidth:2},
  ...(consYoY!=null?[{label:'컨센 내포 '+consYoY.toFixed(1)+'%',type:'line',
   data:fitline.map(p=>({x:p.x,y:consYoY})),borderColor:'#c9a24a',borderDash:[3,3],pointRadius:0,borderWidth:1}]:[]),
  ...(c.prev_oos?[{label:'직전분기 사전예측 '+(c.prev_oos.pred>c.prev_oos.actual?'(높게)':'(낮게 '+(c.prev_oos.actual-c.prev_oos.pred).toFixed(0)+'p)'),
   data:[{x:pts.length?pts[pts.length-1][0]:0,y:c.prev_oos.pred}],backgroundColor:'transparent',
   borderColor:'#ff9e6e',borderWidth:2,pointStyle:'rect',pointRadius:7}]:[]),
  ...(e.x_now!=null?[{label:'이번 입력',data:[{x:e.x_now,y:e.raw_yoy}],backgroundColor:'#7ee08a',
   pointStyle:'star',pointRadius:10}]:[])]},
  options:{maintainAspectRatio:false,scales:{x:{title:{display:true,text:'컴포짓 YoY %'}},
   y:{title:{display:true,text:'매출 YoY %'}}},plugins:{legend:{labels:{boxWidth:10,filter:i=>i.text!==''}}}}});
 // 3) 추정 vs 가이던스·컨센 — 수평 밴드 + 컨센 수직선 + 점추정◆ (원전 10번 양식)
 if(e.corr_rev&&m.guid_lo){
  const rr=e.range_corr||[e.corr_rev,e.corr_rev];
  const consLine=m.consensus?[{type:'bar',label:'컨센',data:[[m.consensus,m.consensus*1.004],[m.consensus,m.consensus*1.004]],
   backgroundColor:'#c9a24a',barPercentage:1.2,grouped:false}]:[];
  CH(document.getElementById('rg'+c.id),{type:'bar',data:{labels:['회사 가이던스','당사 추정'],datasets:[
   {label:'범위',data:[[m.guid_lo,m.guid_hi],[rr[0],rr[1]]],
    backgroundColor:['#3d6fd8','#2fae66'],borderSkipped:false,borderRadius:4,grouped:false},
   ...consLine,
   {type:'scatter',label:'점추정',data:[{x:e.corr_rev,y:'당사 추정'}],backgroundColor:'#fff',
    pointStyle:'rectRot',pointRadius:7}]},
   options:{indexAxis:'y',maintainAspectRatio:false,
    scales:{x:{min:Math.min(m.guid_lo,rr[0])*0.93,ticks:{callback:v=>F(v,d)}}},
    plugins:{legend:{display:false},
     tooltip:{callbacks:{label:x=>Array.isArray(x.raw)?F(x.raw[0],d)+'~'+F(x.raw[1],d)+' '+d.unit:F(x.raw.x??x.raw,d)}}}}});
  if(e.eps_est){const h3=document.getElementById('rg'+c.id).closest('.card').querySelector('h3');
   h3.innerHTML+=` · <span style="color:#7ee08a">EPS 파생 $${e.eps_est} (${(e.eps_range||[]).join('~')})</span> vs 컨센 $${m.eps_cons??'–'}`;}
 }
 // 4) 다음 분기 조건부 밴드 + 시장 눈높이 수직선 (원전 11번 양식)
 if(c.next_q&&c.next_q.on_our_est){
  const nq=c.next_q,labs=['당사 착지 기준','컨센 착지 기준'].slice(0,nq.on_consensus?2:1);
  const ds=[{label:'범위',data:[[nq.on_our_est[0],nq.on_our_est[1]],...(nq.on_consensus?[[nq.on_consensus[0],nq.on_consensus[1]]]:[])],
    backgroundColor:['#2fae66','#3d6fd8'],borderSkipped:false,borderRadius:4,grouped:false}];
  if(m.next_q_consensus)ds.push({label:'눈높이',data:labs.map(()=>[m.next_q_consensus,m.next_q_consensus*1.004]),
   backgroundColor:'#c9a24a',barPercentage:1.2,grouped:false});
  CH(document.getElementById('nx'+c.id),{type:'bar',data:{labels:labs,datasets:ds},
   options:{indexAxis:'y',maintainAspectRatio:false,
    scales:{x:{min:(nq.on_consensus?Math.min(nq.on_our_est[0],nq.on_consensus[0]):nq.on_our_est[0])*0.9,ticks:{callback:v=>F(v,d)}}},
    plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>F(x.raw[0],d)+'~'+F(x.raw[1],d)+' '+d.unit}}}}});
  if(m.next_q_consensus){document.getElementById('nx'+c.id).closest('.card').querySelector('h3').innerHTML+=
    ` · <span style="color:#c9a24a">눈높이 ${F(m.next_q_consensus,d)}</span>`;}
 }
 // 5) 가이던스 트랙레코드 — 범위 바 + 실적◆ + 이번 분기 컨센★/당사◆ (원전 12번 양식)
 if((c.track||[]).length){
  const tq=[...c.track.map(t=>t.q),m.fq||'이번 분기'];
  CH(document.getElementById('tr'+c.id),{data:{labels:tq,datasets:[
   {type:'bar',label:'가이던스 범위',data:[...c.track.map(t=>t.guid_lo&&t.guid_hi?[t.guid_lo,t.guid_hi]:null),
     m.guid_lo?[m.guid_lo,m.guid_hi]:null],backgroundColor:'#3d6fd8',borderSkipped:false,borderRadius:3,barPercentage:.5},
   {type:'scatter',label:'실적',data:c.track.map((t,j)=>({x:tq[j],y:t.actual})),
    backgroundColor:'#39d0c3',pointStyle:'rectRot',pointRadius:6},
   ...(m.consensus?[{type:'scatter',label:'이번 컨센',data:[{x:tq[tq.length-1],y:m.consensus}],
    backgroundColor:'#ffd166',pointStyle:'star',pointRadius:9}]:[]),
   ...(e.corr_rev?[{type:'scatter',label:'당사 추정',data:[{x:tq[tq.length-1],y:e.corr_rev}],
    backgroundColor:'#fff',pointStyle:'rectRot',pointRadius:6}]:[])]},
   options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>F(v,d)}}},
    plugins:{legend:{labels:{boxWidth:10}}}}});
 }
});
