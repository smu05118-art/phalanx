   y:{title:{display:true,text:'매출 YoY %'}}},plugins:{legend:{labels:{boxWidth:10}}}}});
 // 3) 레인지 vs 밴드 (수평 플로팅 바)
 if(e.corr_rev&&m.guid_lo){
  CH(document.getElementById('rg'+c.id),{type:'bar',data:{labels:['가이던스','당사 범위'],datasets:[
   {label:'밴드',data:[[m.guid_lo,m.guid_hi],[ (e.range_corr||[e.corr_rev,e.corr_rev])[0],(e.range_corr||[e.corr_rev,e.corr_rev])[1]]],
    backgroundColor:['#3d6fd8','#2fae66'],borderSkipped:false,borderRadius:4}]},
   options:{indexAxis:'y',maintainAspectRatio:false,
    scales:{x:{min:m.guid_lo*0.93,ticks:{callback:v=>F(v,d)}}},
    plugins:{legend:{display:false},annotation:undefined,
     tooltip:{callbacks:{label:x=>F(x.raw[0],d)+'~'+F(x.raw[1],d)+' '+d.unit}}}}});
  const rgc=document.getElementById('rg'+c.id);
  // 컨센·점추정 마커는 플러그인 없이 캔버스 위 오버레이 라인 대신 라벨로 대체(호환성)
 }
 // 4) 다음 분기 조건부 밴드
 if(c.next_q&&c.next_q.on_our_est){
  const nq=c.next_q,ds=[{label:'당사 착지 기준',data:[[nq.on_our_est[0],nq.on_our_est[1]]],backgroundColor:'#2fae66',borderRadius:4}];
  if(nq.on_consensus)ds.push({label:'컨센 착지 기준',data:[[nq.on_consensus[0],nq.on_consensus[1]]],backgroundColor:'#3d6fd8',borderRadius:4});
  CH(document.getElementById('nx'+c.id),{type:'bar',
   data:{labels:[m.next_q_label||'다음 분기'],datasets:ds},
   options:{indexAxis:'y',maintainAspectRatio:false,
    scales:{x:{ticks:{callback:v=>F(v,d)}}},
    plugins:{legend:{labels:{boxWidth:10}},tooltip:{callbacks:{label:x=>x.dataset.label+': '+F(x.raw[0],d)+'~'+F(x.raw[1],d)}}}}});
  if(m.next_q_consensus){/* 마커: 제목에 수치 병기 */
   document.getElementById('nx'+c.id).closest('.card').querySelector('h3').innerHTML+=
    ` · 눈높이 ${F(m.next_q_consensus,d)} ${d.unit}`;}
 }
 // 5) 트랙레코드
 if((c.track||[]).length){
  CH(document.getElementById('tr'+c.id),{type:'bar',data:{labels:c.track.map(t=>t.q),datasets:[
   {label:'실제',data:c.track.map(t=>t.actual),backgroundColor:'#5aa9ff'},
   {label:'컨센',data:c.track.map(t=>t.cons??null),backgroundColor:'#8a93a6'},
   {label:'가이던스 상단',data:c.track.map(t=>t.guid_hi??null),backgroundColor:'#c9a24a'}]},
   options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>F(v,d)}}},
    plugins:{legend:{labels:{boxWidth:10}}}}});
 }
});
